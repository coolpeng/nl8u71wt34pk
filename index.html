<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>2025 金监局·计算机岗 真题在线刷题</title>
<style>

:root{
  --bg:#f4f6fb; --card:#ffffff; --line:#e5eaf3; --ink:#1b2434; --muted:#6c7890;
  --primary:#2f5fe0; --primary-soft:#eaf0ff; --ok:#0f9d58; --ok-soft:#e7f7ee;
  --bad:#e0453b; --bad-soft:#fdeceb; --warn:#d98a12; --warn-soft:#fff5e4;
  --radius:14px; --shadow:0 2px 14px rgba(30,48,90,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:11px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:9px;white-space:nowrap}
.brand b{font-size:16px;letter-spacing:.2px}
.brand span{font-size:12px;color:var(--muted)}
.yearselect{font-size:13.5px;font-weight:700;color:var(--primary);background:var(--primary-soft);border:1px solid #c7d8fc;padding:5px 12px;border-radius:8px;outline:none;cursor:pointer}
.modebar{display:flex;background:#eef2f8;padding:3px;border-radius:10px;gap:2px}
.modebar button{padding:6px 14px;border-radius:8px;font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap}
.modebar button.on{background:#fff;color:var(--primary);box-shadow:0 1px 5px rgba(30,48,90,.1)}
.topright{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{font-size:12px;color:var(--muted);background:#f2f5fa;border:1px solid var(--line);padding:5px 10px;border-radius:8px;white-space:nowrap}
.chip b{color:var(--ink);font-variant-numeric:tabular-nums}
.timer{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--primary);background:var(--primary-soft);padding:5px 12px;border-radius:8px;white-space:nowrap}
.timer.urgent{color:var(--bad);background:var(--bad-soft)}
.linkbtn{font-size:13px;color:var(--muted);padding:5px 8px;border-radius:7px;white-space:nowrap}
.linkbtn:hover{background:#f0f3f9;color:var(--primary)}
.progressbar{position:absolute;left:0;bottom:-1px;height:2px;background:var(--primary);transition:width .25s}

/* ---------- layout ---------- */
.wrap{max-width:1320px;margin:0 auto;padding:22px;display:grid;grid-template-columns:268px minmax(0,1fr);gap:20px;align-items:start}
.side{position:sticky;top:78px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.side h3{margin:0 0 12px;font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.5px;display:flex;justify-content:space-between;align-items:center}
.sheetgrid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.cell{position:relative;aspect-ratio:1;display:grid;place-items:center;padding:0;min-width:0;overflow:hidden;border-radius:7px;background:#eef2f8;color:#65718a;font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;transition:.12s}
.cell:hover{transform:translateY(-1px);background:#dfe7f5}
.cell.done{background:var(--primary-soft);color:var(--primary)}
.cell.right{background:var(--ok-soft);color:var(--ok)}
.cell.wrong{background:var(--bad-soft);color:var(--bad)}
.cell.cur{box-shadow:0 0 0 2px var(--primary) inset}
.cell.flag::after{content:"";position:absolute;top:2px;right:2px;width:5px;height:5px;border-radius:50%;background:var(--warn)}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.sidefoot{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.primarybtn{display:block;width:100%;background:var(--primary);color:#fff;font-weight:700;font-size:14px;padding:11px;border-radius:10px;text-align:center;box-shadow:0 3px 10px rgba(47,95,224,.2)}
.primarybtn:hover{background:#2450c8}
.ghostbtn{display:block;width:100%;margin-top:8px;border:1px solid var(--line);color:var(--muted);font-size:13px;padding:9px;border-radius:10px;text-align:center}
.ghostbtn:hover{border-color:var(--primary);color:var(--primary)}

/* ---------- question card ---------- */
.main{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px 26px}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);padding-bottom:16px;border-bottom:1px solid var(--line)}
.qnum{font-size:15px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.tag{font-size:11.5px;padding:3px 9px;border-radius:20px;background:#f0f3f9;color:var(--muted);font-weight:600}
.tag.type{background:var(--primary-soft);color:var(--primary)}
.tag.score{background:var(--warn-soft);color:var(--warn)}
.flagbtn{margin-left:auto;font-size:12.5px;color:var(--muted);padding:4px 9px;border:1px solid var(--line);border-radius:7px}
.flagbtn.on{color:var(--warn);border-color:#f0d9a8;background:var(--warn-soft)}
.passage{margin-top:18px;background:#f8fafd;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.passage summary{cursor:pointer;padding:10px 14px;font-size:13px;font-weight:700;color:var(--primary);list-style:none;display:flex;align-items:center;gap:7px}
.passage summary::-webkit-details-marker{display:none}
.passage summary::before{content:"▸";font-size:11px;transition:.2s}
.passage[open] summary::before{transform:rotate(90deg)}
.passage .ptext{padding:0 16px 16px;font-size:14px;line-height:1.85;color:#3c485c;white-space:pre-wrap}
.stem{font-size:17px;line-height:1.85;font-weight:600;margin:22px 0 18px;white-space:pre-wrap}
.options{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;border:1.5px solid var(--line);border-radius:11px;padding:13px 15px;font-size:15px;line-height:1.65;transition:.14s;text-align:left;width:100%;background:#fff}
.opt:hover{border-color:#b9caf0;background:#fafbff}
.opt .letter{flex:0 0 26px;height:26px;border-radius:50%;background:#f0f3f9;color:var(--muted);display:grid;place-items:center;font-size:13px;font-weight:800;margin-top:1px}
.opt .txt{flex:1;white-space:pre-wrap;overflow-wrap:anywhere}
.opt.sel{border-color:var(--primary);background:var(--primary-soft)}
.opt.sel .letter{background:var(--primary);color:#fff}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .letter{background:var(--ok);color:#fff}
.opt.incorrect{border-color:var(--bad);background:var(--bad-soft)}
.opt.incorrect .letter{background:var(--bad);color:#fff}
.opt.dim{opacity:.72}
.qactions{display:flex;align-items:center;gap:10px;margin-top:22px;flex-wrap:wrap}
.navbtn{border:1px solid var(--line);background:#fff;padding:9px 17px;border-radius:9px;font-size:13.5px;font-weight:600;color:#46536a}
.navbtn:hover{border-color:var(--primary);color:var(--primary)}
.navbtn:disabled{opacity:.4;cursor:not-allowed}
.navbtn.go{background:var(--primary);border-color:var(--primary);color:#fff}
.navbtn.go:hover{background:#2450c8;color:#fff}
.qhint{font-size:12px;color:var(--muted);margin-left:auto}

/* ---------- flashcard section ---------- */
.cardsection{display:none;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px 26px;margin-bottom:20px}
.cardsection.show{display:block}
.cardhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.cardtitle{font-size:16px;font-weight:800;color:var(--ink)}
.cardcatbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.cardcatbtn{font-size:12.5px;padding:5px 12px;border-radius:20px;background:#f0f3f9;color:var(--muted);font-weight:600}
.cardcatbtn.on{background:var(--primary);color:#fff}
.flashcardbox{border:1.5px solid var(--line);border-radius:12px;padding:20px;background:#fafbff;margin-bottom:16px}
.flashcardq{font-size:16px;font-weight:700;color:var(--ink);margin-bottom:12px}
.flashcarda{display:none;font-size:14.5px;line-height:1.8;color:#2c3a50;background:#fff;padding:14px;border-radius:9px;border:1px dashed #c0d1f7;white-space:pre-wrap}
.flashcarda.show{display:block}
.flashaction{display:flex;gap:10px;align-items:center}

/* ---------- feedback ---------- */
.feedback{margin-top:20px;border-radius:11px;padding:16px 18px;font-size:14.5px;line-height:1.85;display:none}
.feedback.show{display:block}
.feedback.ok{background:var(--ok-soft);border:1px solid #bfe8cf}
.feedback.no{background:var(--bad-soft);border:1px solid #f3c6c3}
.fbhead{font-weight:800;font-size:15px;margin-bottom:8px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.fbhead .badge{padding:2px 9px;border-radius:20px;font-size:12px;color:#fff}
.redobtn{margin-left:auto;font-size:12.5px;color:var(--primary);background:#fff;border:1px solid rgba(47,95,224,.3);padding:4px 11px;border-radius:7px;font-weight:600}
.redobtn:hover{background:var(--primary);color:#fff}
.feedback.ok .badge{background:var(--ok)}.feedback.no .badge{background:var(--bad)}
.fbans{font-size:13px;color:#4a566c;margin-bottom:8px}
.fbans b{font-size:15px;color:var(--ink);letter-spacing:1px}
.fbtext{white-space:pre-wrap;border-top:1px dashed rgba(0,0,0,.12);padding-top:10px;color:#37445a}
.fbmini{background:#f3f6fb;border:1px solid var(--line);border-radius:9px;padding:10px 14px;font-size:13px;color:var(--muted);margin-top:18px;display:none}
.fbmini.show{display:block}

/* ---------- report ---------- */
.report{display:none;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px;margin-bottom:20px}
.report.show{display:block}
.scorehero{display:flex;align-items:center;gap:26px;flex-wrap:wrap;padding-bottom:20px;border-bottom:1px solid var(--line)}
.bigscore{font-size:48px;font-weight:800;line-height:1;color:var(--primary);font-variant-numeric:tabular-nums}
.bigscore small{font-size:16px;color:var(--muted);font-weight:600;margin-left:4px}
.scoreinfo{font-size:14px;color:var(--muted);line-height:1.9}
.scoreinfo b{color:var(--ink)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:20px}
.ritem{border:1px solid var(--line);border-radius:10px;padding:13px 15px}
.ritem .n{font-size:12.5px;color:var(--muted)}
.ritem .v{font-size:20px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.ritem .v small{font-size:12px;color:var(--muted);font-weight:600}
.rh{font-size:14px;font-weight:800;margin:24px 0 10px}
.wronglist{display:flex;flex-wrap:wrap;gap:7px}
.wronglist button{width:38px;height:34px;border-radius:8px;background:var(--bad-soft);color:var(--bad);font-weight:700;font-size:13px}
.wronglist button:hover{background:var(--bad);color:#fff}
.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(20px);background:#1e293b;color:#fff;padding:10px 18px;border-radius:9px;font-size:13.5px;opacity:0;transition:.25s;pointer-events:none;z-index:99;box-shadow:0 8px 26px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.footnote{text-align:center;font-size:12px;color:#9aa5b7;padding:8px 0 26px}

@media(max-width:960px){
  .wrap{grid-template-columns:1fr;padding:14px;gap:14px}
  .side{position:static;padding:14px}
  .sheetgrid{grid-template-columns:repeat(10,minmax(0,1fr))}
  .side.collapsed .sheetgrid,.side.collapsed .legend,.side.collapsed .sidefoot{display:none}
  .side.collapsed h3{margin-bottom:0}
  .card{padding:18px 16px}
  .topbar{padding:10px 14px;gap:10px}
  .brand span{display:none}
  .topright{width:100%;margin-left:0}
  .stem{font-size:16px}
  .qhint{display:none}
}


/* ---- 允许复制题目内容（桌面 Cmd/Ctrl+C，移动端长按） ---- */
.stem,.ptext,.feedback,.fbmini,.opt,.opt .txt{
  -webkit-user-select:text;user-select:text;-webkit-touch-callout:default;
}
.qhead{flex-wrap:wrap}
.copybtn{font-size:12.5px;font-weight:700;color:var(--muted);background:#eef2fa;
  border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.copybtn:hover{color:var(--primary);border-color:#c7d8fc;background:var(--primary-soft)}
.copybtn:active{transform:scale(.96)}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><b>金监局 · 计算机岗</b><span>真题冲刺刷题宝典</span></div>
  <select id="examYearSelect" class="yearselect" onchange="switchExamYear(this.value)">
    <option value="2025" selected>2025年 金监局/银保监计算机岗真题卷 (120题)</option>
    <option value="2024" >2024年 金监局/银保监计算机岗真题卷 (120题)</option>
    <option value="2023" >2023年 金监局/银保监计算机岗真题卷 (120题)</option>
    <option value="2022" >2022年 金监局/银保监计算机岗真题卷 (120题)</option>
    <option value="2021" >2021年 金监局/银保监计算机岗真题卷 (120题)</option>
    <option value="2020" >2020年 金监局/银保监计算机岗真题卷 (120题)</option>
    <option value="2019" >2019年 金监局/银保监计算机岗真题卷 (100题)</option>
  </select>
  <div class="modebar">
    <button id="mPractice" class="on">练习模式</button>
    <button id="mExam">模拟考试</button>
    <button id="mWrong">错题重做</button>
  </div>
  <div class="topright">
    <span class="chip">已答 <b id="doneCount">0</b>/<b id="totalCount">120</b></span>
    <span class="chip">正确率 <b id="accRate">—</b></span>
    <span class="timer" id="timer" hidden>120:00</span>
    <button class="linkbtn" id="btnReset">清空记录</button>
  </div>
  <div class="progressbar" id="progressbar" style="width:0"></div>
</div>

<div class="wrap">
  <aside class="side" id="side">
    <h3><span>答题卡</span><button class="linkbtn" id="btnToggle" style="display:none">收起 / 展开</button></h3>
    <div class="sheetgrid" id="sheet"></div>
    <div class="legend">
      <span><i style="background:#eef2f8"></i>未答</span>
      <span><i style="background:#eaf0ff"></i>已答</span>
      <span><i style="background:#e7f7ee"></i>正确</span>
      <span><i style="background:#fdeceb"></i>错误</span>
    </div>
    <div class="sidefoot">
      <button class="primarybtn" id="btnSubmit">交卷并查看成绩</button>
      <button class="ghostbtn" id="btnReset2">重新开始本卷</button>
    </div>
  </aside>

  <main class="main">
    <section class="report" id="report">
      <div class="scorehero">
        <div class="bigscore" id="rScore">0<small> / 100 分</small></div>
        <div class="scoreinfo" id="rInfo"></div>
      </div>
      <div class="rgrid" id="rGrid"></div>
      <div class="rh">错题清单（点击题号回看解析）</div>
      <div class="wronglist" id="rWrong"></div>
      <div class="qactions">
        <button class="navbtn go" id="rBack">返回逐题查看</button>
        <button class="navbtn" id="rRestart">重新考一次</button>
      </div>
    </section>

    <section class="card" id="card">
      <div class="qhead">
        <span class="qnum" id="qNum">第 1 题</span>
        <span class="tag type" id="qType">单选题</span>
        <span class="tag" id="qSection">经济金融基础知识</span>
        <span class="tag score" id="qScore">0.5 分</span>
        <button class="flagbtn" id="btnFlag">☆ 标记</button>
        <button class="copybtn" id="btnCopy" title="复制本题题干、选项、答案与解析">复制本题</button>
      </div>
      <details class="passage" id="passageBox" open hidden>
        <summary>阅读原文（点击展开 / 收起）</summary>
        <div class="ptext" id="passageText"></div>
      </details>
      <div class="stem" id="qStem"></div>
      <div class="options" id="qOptions"></div>
      <div class="feedback" id="feedback"></div>
      <div class="fbmini" id="fbmini"></div>
      <div class="qactions">
        <button class="navbtn" id="btnPrev">← 上一题</button>
        <button class="navbtn go" id="btnConfirm">确认作答</button>
        <button class="navbtn" id="btnNext">下一题 →</button>
        <span class="qhint">快捷键：A/B/C/D 选项 · ← → 切题 · Enter 确认 / 下一题</span>
      </div>
    </section>
  </main>
</div>

<script id="allExamsData" type="application/json">{"2019":{"meta":{"total":120,"source":"2019 年银保监会/金监局计算机岗专业卷（PDF 原文重提取）"},"sections":[{"key":"econ","name":"经济金融基础知识 · 单选","range":[1,20],"per":0.5,"type":"single"},{"key":"cs","name":"计算机专业知识 · 单选","range":[21,80],"per":1,"type":"single"},{"key":"multi","name":"计算机专业知识 · 多选","range":[81,100],"per":1,"type":"multi"},{"key":"eng","name":"英语阅读理解 · 单选","range":[101,120],"per":0.5,"type":"single"}],"questions":[{"id":1,"section":"econ","type":"single","stem":"实际 GDP 等于（ ）。","passage":"","options":{"A":"价格水平除以名义 GDP","B":"名义 GDP 除以价格水平","C":"名义 GDP 乘以价格水平","D":"价格水平乘以潜在 GDP"},"answer":"B","analysis":"实际 GDP=名义 GDP/GDP 平减指数，GDP 平减指数表示价格水平。故选B项。"},{"id":2,"section":"econ","type":"single","stem":"菲利普斯曲线揭示了失业率和通胀率之间存在（ ）关系。","passage":"","options":{"A":"负相关","B":"正相关","C":"无相关","D":"等同于"},"answer":"A","analysis":"菲利普斯曲线反映了失业率和通货膨胀率之间此消彼长的负相关关系。故选A项。"},{"id":3,"section":"econ","type":"single","stem":"根据宏观经济学总供给——总需求模型，扩张性的财政政策能使产出（）。","passage":"","options":{"A":"增加","B":"减少","C":"不变","D":"难以确定"},"answer":"D","analysis":"根据总供给——总需求模型，当总供给曲线向右上方倾斜时，扩张性的财政政策使得总需求曲线右移，产出增加，物价水平上升；当总供给曲线垂直于横轴时，扩张性的财政政策使得总需求曲线右移，但不会增加产出，只会提高物价水平。故选D 项。"},{"id":4,"section":"econ","type":"single","stem":"边际消费倾向递减规律是（ ）的前提之一。","passage":"","options":{"A":"持久收入理论","B":"生命周期理论","C":"所有消费理论","D":"凯恩斯消费理论"},"answer":"D","analysis":"凯恩斯消费理论的基本假设有三个：收入是影响消费最重要的因素，收入与消费正相关；边际消费倾向递减；平均消费倾向递减。故选 D 项。"},{"id":5,"section":"econ","type":"single","stem":"当达到市场均衡时，买者是支付愿望（ ）的人，卖者是成本（）的人。","passage":"","options":{"A":"最高、最高","B":"最高、最低","C":"最低、最高","D":"最低、最低"},"answer":"C","analysis":"当达到市场均衡时，此时的买者支付愿望最低，卖者的成本最高。故选C项。"},{"id":6,"section":"econ","type":"single","stem":"下面哪种情况是帕累托最优？（ ）","passage":"","options":{"A":"收入分配公平","B":"不使社会中的某些成员福利变差，就无法使其他成员福利改善","C":"企业内部化其所有外部性","D":"不损害他人福利而改善部分人的福利"},"answer":"B","analysis":"帕累托最优状态是指资源的重新分配不可能使得一个人状况变得更好而不损害其他人的利益。故选 B 项。"},{"id":7,"section":"econ","type":"single","stem":"厂商的停止营业点是指（ ）。","passage":"","options":{"A":"SMC 与 SAC 相交之点","B":"SMC 与 AVC 相交之点","C":"SMC 与 AFC 相交之点","D":"SAC 与 AVC 相切之点"},"answer":"B","analysis":"厂商的 SMC 与 AVC 相交的点，是厂商的停止营业点，此时不管生产还是不生产都亏损总固定成本 TFC。故选 B 项。"},{"id":8,"section":"econ","type":"single","stem":"某一经济活动存在外部不经济是指该活动（ ）。","passage":"","options":{"A":"私人成本大于社会成本","B":"私人成本小于社会成本","C":"私人利益大于社会利益","D":"私人利益小于社会利益"},"answer":"B","analysis":"外部不经济是对外界带来坏的影响，但是没有受到额外的损失，因此私人成本小于社会成本。故选 B 项。"},{"id":9,"section":"econ","type":"single","stem":"布雷顿森林会议确立的国际货币体系核心内容是（ ）。","passage":"","options":{"A":"各国货币与美元和英镑构成的货币篮子挂钩","B":"各国货币都与特别提款权挂钩","C":"美元与黄金挂钩，其他各国货币与美元挂钩","D":"各国货币都与黄金挂钩"},"answer":"C","analysis":"布雷顿森林体系内容中实行双挂钩制度：各国货币与美元挂钩、美元与黄金挂钩。故选 C 项。"},{"id":10,"section":"econ","type":"single","stem":"在货币政策的传导机制中，既可以作为操作目标，又可以是中介目标的是（）。","passage":"","options":{"A":"基础货币","B":"货币供应量","C":"短期利率","D":"长期利率"},"answer":"C","analysis":"在货币政策的传导机制中，既可以作为操作目标，又可以是中介目标的短期利率。基础货币是操作目标；货币供应量是中介目标；长期利率是中介目标。故选C项。"},{"id":11,"section":"econ","type":"single","stem":"根据蒙代尔政策搭配理论，当一国国际收支出现逆差、国内通货紧缩严重时，合理的政策选择为（ ）。","passage":"","options":{"A":"扩张性货币政策和紧缩性财政政策","B":"扩张性财政政策、扩张性货币政策和货币升值","C":"紧缩性财政政策、紧缩性货币政策和货币贬值","D":"紧缩性货币政策和扩张性财政政策"},"answer":"D","analysis":"根据蒙代尔弗莱明模型，针对国内失衡用财政政策，国际失衡用货币政策。所以，通货紧缩，应该用扩张性财政政策；针对逆差应该用紧缩性货币政策。故选D项。"},{"id":12,"section":"econ","type":"single","stem":"商业银行把贷款分为正常类、关注类、次级类、可疑类和损失类，构成不良贷款的是（ ）。","passage":"","options":{"A":"后两类","B":"后三类","C":"后四类","D":"前三类"},"answer":"B","analysis":"按照风险程度的高低，可将贷款分为正常类、关注类、次级类、可疑类和损失类，其中，后三类统称为不良贷款。故选 B 项。"},{"id":13,"section":"econ","type":"single","stem":"商业银行最高风险管理和决策机构是（ ）。","passage":"","options":{"A":"董事会","B":"监事会","C":"高级管理层","D":"股东代表大会"},"answer":"A","analysis":"董事会是商业银行的最高风险管理和决策机构，承担商业银行风险管理的最终责任。故选 A 项。"},{"id":14,"section":"econ","type":"single","stem":"商业银行其他资本不变的情况下，以下情形会相应减少银行可贷头寸的是（）。","passage":"","options":{"A":"现金流入大于流出","B":"清算收入大于支出","C":"法定存款准备金率提高","D":"贷款按期收回"},"answer":"C","analysis":"法定存款准备金率提高，商业银行的可贷资金会减少，C 项正确。其他选项均会使得商业银行的可贷资金增加。故选 C 项。"},{"id":15,"section":"econ","type":"single","stem":"巴塞尔协议Ⅲ引入（ ）概念，要求对业务规模大、复杂程度高、对整个银行体系带来系统风险的银行，提出特别资本要求，使其具有超出一般标准的吸收亏损能力。","passage":"","options":{"A":"国际重要性银行","B":"系统关键性银行","C":"系统重要性银行","D":"国际核心性银行"},"answer":"C","analysis":"巴塞尔协议Ⅲ引入系统重要性银行概念，要求对业务规模大、复杂程度高、对整个银行体系带来系统风险的银行，提出特别资本要求，使其具有超出一般标准的吸收亏损能力。故选 C 项。"},{"id":16,"section":"econ","type":"single","stem":"表外业务是商业银行从事的不列入（ ）的经营活动。","passage":"","options":{"A":"损益表","B":"资产负债表","C":"现金流量表","D":"财务状况变动表"},"answer":"B","analysis":"表外业务是指商业银行从事的不列入资产负债表，但能影响银行当期损益的经营活动，它有狭义和广义之分。狭义的表外业务是指那些虽未列入资产负债表，但同表内的资产业务或负债业务关系密切的业务。广义的表外业务除包括上述狭义的表外业务外，还包括结算、代理、咨询等中间业务。故选 B 项。"},{"id":17,"section":"econ","type":"single","stem":"1999 年 11 月，美国国会通过（ ）允许金融持股公司下属子公司对银行、证券、保险兼业经营，美国金融重新进入混业时代。","passage":"","options":{"A":"《麦克法登法案》","B":"《金融服务现代化法案》","C":"《银行体系改革蓝图》","D":"《多德－弗兰克法案》"},"answer":"B","analysis":"1999 年，美国通过《金融服务现代化法案》，取消分业经营制度，重新建立混业经营的金融体系。故选 B 项。"},{"id":18,"section":"econ","type":"single","stem":"SDR 是（ ）。","passage":"","options":{"A":"欧洲经济货币联盟创设的货币","B":"IMF 创设的储备资产和记账单位","C":"欧洲货币体系的中心货币","D":"世界银行创设的一种特别使用资金的权利"},"answer":"B","analysis":"特别提款权（Special Drawing Right，SDR），亦称“纸黄金”，最早发行于1969 年，是国际货币基金组织（IMF）根据会员国认缴的份额分配的，可用于偿还国际货币基金组织债务、弥补会员国政府之间国际收支逆差的一种账面资产。故选B 项。"},{"id":19,"section":"econ","type":"single","stem":"在人身保险产品定价中，确定死亡率的重要基础是（ ）。","passage":"","options":{"A":"利率表","B":"生命表","C":"费率表","D":"生命周期表"},"answer":"B","analysis":"在人寿保险费率厘定过程中，死亡率的表示方式是生命表。生命表是根据一定时期某一国家或地区的特定人群的有关生存、死亡的统计资料加以分析整理而形成的一种表格，它是寿险精算的数理基础，是厘定人寿保险纯保费的基本依据。生命表中，最重要的是计算每个年龄段的死亡率。故选 B 项。"},{"id":20,"section":"econ","type":"single","stem":"在世界银行提倡的养老多支柱体系中，商业养老保险属于（）的范畴。","passage":"","options":{"A":"公共年金计划","B":"职业年金计划","C":"个人储蓄计划","D":"基本养老计划"},"answer":"C","analysis":"我国养老保险制度是一个“三支柱”的体系，党的十九大报告明确提出，要全面建成多层次社会保障体系。第一个支柱：基本养老保险；第二个支柱：企业年金和职业年金；第三个支柱：个人储蓄型养老保险和商业养老保险。故选 C 项。"},{"id":21,"section":"cs","type":"single","stem":"计算机存储容量 1KB 大小为（ ）B。","passage":"","options":{"A":"256","B":"512","C":"1024","D":"2048"},"answer":"C","analysis":"本题考查计算机组成原理。1KB=1024B。故选 C 项。"},{"id":22,"section":"cs","type":"single","stem":"进程调度主要负责（ ）。","passage":"","options":{"A":"选一个作业进入内存","B":"选一个进程占有 CPU","C":"建立一个进程","D":"撤销一个进程"},"answer":"B","analysis":"本题考查操作系统——进程调度。进程调度的主要功能是根据一定的算法将CPU 分派给就绪队列中的一个进程。故选 B 项。"},{"id":23,"section":"cs","type":"single","stem":"下列事件中最有可能导致系统产生死锁的是（ ）。","passage":"","options":{"A":"多个进程释放资源","B":"一个进程进入死循环","C":"多个进程竞争共享资源","D":"多个进程竞争独占资源"},"answer":"D","analysis":"本题考查操作系统——死锁。死锁是指系统中存在两个或多个进程，每一个进程都占用了某种资源而又都在等待其中另一个进程所占用的资源，那么这种等待永远都不能结束。多个进程竞争独占资源，如果资源分配不合理，进入不安全序列，最有可能导致系统产生死锁。故选 D 项。"},{"id":24,"section":"cs","type":"single","stem":"一个 C 语言程序是（ ）开始执行。","passage":"","options":{"A":"程序中的第一个语句","B":"名为 main 的函数","C":"包含文件（头文件）第一个函数","D":"程序中的第一个函数"},"answer":"B","analysis":"本题考查程序设计——C 程序结构。C 语言规定，程序总是从main( ）主函数开始执行的。故选 B 项。"},{"id":25,"section":"cs","type":"single","stem":"面向对象编程的特性中，下列哪一项不包括？（ ）","passage":"","options":{"A":"抽象性","B":"继承性","C":"多态性","D":"不确定性"},"answer":"D","analysis":"本题考查程序设计——面向对象编程的概念。面向对象的4 个特性：抽象性、封装性、继承性、多态性。故选 D 项。"},{"id":26,"section":"cs","type":"single","stem":"数据库管理系统能实现对数据库中数据的查询、插入、修改和删除等操作，这种功能称为数据的（ ）。","passage":"","options":{"A":"定义功能","B":"管理功能","C":"操纵功能","D":"控制功能"},"answer":"C","analysis":"（DBMS）是一种操纵和管理数据库的大型软件，用于建立、使用和维护数据库。DBMS 的主要功能之一是数据操纵，它提供数据操作语言 DML，供用户实现对数据的追加、删除、更新、查询等操作。故选 C 项。"},{"id":27,"section":"cs","type":"single","stem":"在数据库中引入索引是为了（ ）。","passage":"","options":{"A":"提高查询语句执行效率","B":"提高更新语句执行效率","C":"实现数据的物理独立性","D":"实现数据的逻辑独立性"},"answer":"A","analysis":"索引是对数据库表中一列或多列的值进行排序的一种结构，使用索引可快速访问数据库表中的特定信息。故选 A 项。"},{"id":28,"section":"cs","type":"single","stem":"在 TCP/IP 参考模型中，提供无连接服务的传输层协议是（ ）。","passage":"","options":{"A":"TCP","B":"UDP","C":"ARP","D":"OSPF"},"answer":"B","analysis":"UDP 协议是一种无连接的传输层协议，提供面向事务的简单不可靠信息传送服务。故选 B 项。"},{"id":29,"section":"cs","type":"single","stem":"开放系统互连（ISO/OSI）参考模型总共分为（ ）层。","passage":"","options":{"A":"7","B":"6","C":"5","D":"4"},"answer":"A","analysis":"开放系统互连参考模型（OSI）一共分为七层，从低到高分别是：物理层、数据链路层、网络层、传输层、会话层、表示层和应用层。故选 A 项。"},{"id":30,"section":"cs","type":"single","stem":"一般而言，Internet 防火墙建立在（ ）。","passage":"","options":{"A":"内部子网之间传送信息的中枢","B":"每个子网的内部","C":"内部网络与外部网络的交叉点","D":"部分内部网络与外部网络的结合处"},"answer":"C","analysis":"防火墙指的是一个由软件和硬件设备组合而成、在内部网和外部网之间、专用网与公共网之间的边界上构造的保护屏障。一般而言，Internet 防火墙建立在一个网络的内部网络与外部网络的交叉点，保护内部网络不受攻击。故选 C 项。"},{"id":31,"section":"cs","type":"single","stem":"“进不来”“拿不走”“看不懂”“改不了”“走不脱”是网络信息安全建设目标，其中“看不懂”是指下面哪种安全服务？（ ）","passage":"","options":{"A":"数据加密","B":"身份认证","C":"数据完整性","D":"访问控制"},"answer":"A","analysis":"网络安全服务的功能主要有 5 项，分别是：鉴别服务、访问控制服务、数据保密性服务、数据完整性服务和可审查性服务。其中数据保密性服务（或数据加密性服务）主要用于信息泄露、窃听等被动威胁的防御措施，对应的是“看不懂”。故选A 项。"},{"id":32,"section":"cs","type":"single","stem":"在软件生命周期中，要准确确定软件必须做什么和必须具备哪些功能的阶段是（ ）。","passage":"","options":{"A":"概要设计","B":"详细设计","C":"可行性分析","D":"需求分析"},"answer":"D","analysis":"软件生命周期是软件的产生直到报废或停止使用的生命周期。通常，软件生命周期包括：问题定义、可行性研究、需求分析、开发阶段（概要设计、详细设计、实现、测试）、维护。需求分析是对待开发软件提出的需求进行分析并给出详细定义，即准确地确定软件系统的功能。编写软件规格说明书及初步的用户手册，提交评审。故选D 项。"},{"id":33,"section":"cs","type":"single","stem":"为有效捕获系统需求、软件开发模型适合采用（ ）。","passage":"","options":{"A":"瀑布模型","B":"V 模型","C":"原型模型","D":"增量模型"},"answer":"C","analysis":"本题考查软件工程与项目管理——软件开发模型。瀑布模型：将软件生命周期划分为制订计划、需求分析、软件设计、程序编写、软件测试和运行维护等 6 个基本活动，并且规定了它们自上而下、相互衔接的固定次序，如同瀑布流水，逐级下落。原型模型：第一步是建造一个快速原型，实现客户或未来的用户与系统的交互，用户或客户对原型进行评价，进一步细化待开发软件的需求。通过逐步调整原型使其满足客户的要求，开发人员可以确定客户的真正需求是什么。第二步则在第一步的基础上开发客户满意的软件产品。V 模型：大体可以划分为下面几个不同的阶段步骤，即需求分析、概要设计、详细设计、编码、单元测试、集成测试、系统测试、验收测试。增量模型：软件被作为一系列的增量构件来设计、实现、集成和测试，每一个构件是由多种相互作用的模块所形成的提供特定功能的代码片段构成。相比较，原型模型更强调对软件需求的细化和捕获。故选 C 项。"},{"id":34,"section":"cs","type":"single","stem":"计算机操作的最小时间单位是（ ）。","passage":"","options":{"A":"时钟周期","B":"指令周期","C":"CPU 周期","D":"增量模型"},"answer":"A","analysis":"本题考查计算机组成原理——CPU。指令周期：是取出一条指令并执行这条指令的时间。一般由若干个机器周期组成，是从取指令、分析指令到执行完所需的全部时间。机器周期：在计算机中，为了便于管理，常把一条指令的执行过程划分为若干个阶段，每一阶段完成一项工作。例如，取指令、存储器读、存储器写等，这每一项工作称为一个基本操作。时钟周期：也称为振荡周期，定义为时钟频率的倒数。时钟周期是计算机中最基本的、最小的时间单位。在一个时钟周期内，CPU 仅完成一个最基本的动作。故选 A 项。"},{"id":35,"section":"cs","type":"single","stem":"CPU 和主存储器之间增加 Cache 的目的是（ ）。","passage":"","options":{"A":"扩大主存储器容量","B":"解决 CPU 和主存之间的速度匹配问题","C":"扩大 CPU 中通用寄存器的数量","D":"既扩大主存储器容量，又扩大 CPU 中通用寄存器的数量"},"answer":"B","analysis":"高速缓冲存储器（Cache）是位于 CPU 和主存储器之间，规模较小，但速度很高的存储器，通常由 SRAM 组成。由于 CPU 的速度比主存快得多，所以引入Cache，用来存放一些 CPU 可能会用到的数据，减少了 CPU 的等待时间，所以 Cache 解决CPU和主存之间的速度匹配问题。故选 B 项。"},{"id":36,"section":"cs","type":"single","stem":"如果 I/0 操作所花费的时间比 CPU 处理时间短得多，则缓冲区（）。","passage":"","options":{"A":"最有效","B":"几乎无效","C":"均衡","D":"无法处理"},"answer":"B","analysis":"本题考查计算机组成原理—— I/0 设备。缓冲区是为了缓解I/0 操作低速，与CPU 处理速度不匹配的问题。I/0 操作所花费的时间比 CPU 处理时间短得多，则缓冲区基本无效。故选 B 项。"},{"id":37,"section":"cs","type":"single","stem":"在支持多线程的系统中，进程 P 创建的若干个线程不能共享的是（）。","passage":"","options":{"A":"进程 P 的代码段","B":"进程 P 中打开的文件","C":"进程 P 的全局变量","D":"进程 P 中某线程的栈指针"},"answer":"D","analysis":"ABC 项正确，在引入线程的系统中，一个进程中的各个线程可以共享其隶属进程的资源，包括一个进程的代码段、数据段及所拥有系统资源，如已打开的文件、I/O设备等。D 项错误，为了保证线程的独立运行，每个线程都应该包含独立的堆栈和CPU寄存器状态，这些是不能共享的。故选 D 项。"},{"id":38,"section":"cs","type":"single","stem":"以下数据结构中，哪一个是线性结构？（ ）","passage":"","options":{"A":"广义表","B":"二叉树","C":"稀疏矩阵","D":"串"},"answer":"D","analysis":"本题考查数据结构——线性结构。常用的线性结构：线性表、栈、队列、数组、串；常用的非线性结构：二维数组、多维数组、树（二叉树等）、图、广义表。故选D项。"},{"id":39,"section":"cs","type":"single","stem":"SQL 数据库中，可以通过（ ）将要保密的数据对无权存取这些数据的用户隐藏起来。","passage":"","options":{"A":"视图机制","B":"敏感度标记","C":"索引机制","D":"逻辑表"},"answer":"A","analysis":"为不同的用户定义视图，通过视图机制把要保密的数据对无权存取的用户隐藏起来，从而自动地对数据提供一定程度的安全保护。故选 A 项。"},{"id":40,"section":"cs","type":"single","stem":"在 C 语言中，下面是一个初始化指针的语句：int *px=&","passage":"","options":{"A":"其中指令+变量的名字应该是（ ）。A.*px","B":"a","C":"px","D":"&a"},"answer":"A","analysis":"本题考查程序设计——C 语言指针。按照语句定义，变量名为*px。故选A项。"},{"id":41,"section":"cs","type":"single","stem":"下列关系表达式中，结果为假是（ ）。","passage":"","options":{"A":"（3+4）>6","B":"（3！=4）>2","C":"3<=4 丨丨 3","D":"（3<4）==1"},"answer":"B","analysis":"本题考查程序设计——表达式。A 项中（3+4）=7，7>6，结果为真；B项中（3！=4）为 1，1>2 结果为假；C 项中 3<=4 为 1，1||3 为真；D 项中3<=4 为1，1==1 为真. 故选 B 项。"},{"id":42,"section":"cs","type":"single","stem":"有些程序设计语言中，过程调用与所需执行代码的绑定直到运行时才进行，这种绑定称为（ ）。","passage":"","options":{"A":"静态绑定","B":"动态绑定","C":"过载绑定","D":"强制绑定"},"answer":"B","analysis":"面向对象有三种特性：派生，继承，多态。其中多态性有两种，一种是依靠函数重载实现的静态绑定，一种是依靠虚函数实现的动态绑定。动态绑定是在运行时进行的，即一个给定的过程调用和响应调用需执行的代码的结合直到调用发生时才进行。这种机制实现了方法的定义与具体的对象无关，而对方法的调用则可以关联于具体的对象。故选B项。"},{"id":43,"section":"cs","type":"single","stem":"软件模块的耦合度描述了（ ）。","passage":"","options":{"A":"模块内各种元素结合的程度","B":"模块内多个功能之间的接口","C":"模块之间公共数据的数量","D":"模块之间相互关联的程度"},"answer":"D","analysis":"耦合性（或称耦合力或耦合度）是一种软件度量，是指一程序中，模块及模块之间信息或参数依赖的程度。A、B 项错误，内聚是从功能角度来度量功能模块内的联系，一个好的内聚功能模块应当恰好做一件事。它描述的是功能模块内的功能联系。C项错误，耦合性并不单一指模块间的公共数据，包含的内容更广。D 项正确，软件模块的耦合度描述的是模块之间相互关联的程度。故选 D 项。"},{"id":44,"section":"cs","type":"single","stem":"以下哪种测试不属于广义的软件性能测试？（ ）","passage":"","options":{"A":"并发测试","B":"压力测试","C":"兼容性测试","D":"负载测试"},"answer":"C","analysis":"软件的性能是软件的一种非功能特性，它关注的不是软件是否能够完成特定的功能，而是在完成该功能时展示出来的及时性。根据测试目的的不同，可以把软件性能测试以及与性能有关的其他一些测试分为：①性能测试；②并发测试；③压力测试；④可靠性测试；⑤负载测试；⑥配置测试；⑦失效恢复测试。兼容性测试属于系统测试的范畴，不是软件性能测试。故选 C 项。"},{"id":45,"section":"cs","type":"single","stem":"版本管理是对系统不同的版本进行（ ）的过程。","passage":"","options":{"A":"标识与跟踪","B":"标识变更","C":"发布变更","D":"控制变更"},"answer":"D","analysis":"本题考查软件工程与项目管理——软件配置管理。版本管理是为了满足不同需求，对同一产品或系统进行局部的改进和改型所产生的产品或系统系列的变更情况进行记录、跟 踪、维护和控制的过程。故选 D 项。"},{"id":46,"section":"cs","type":"single","stem":"在关系代数运算中，五种基本运算为（ ）。","passage":"","options":{"A":"并、差、选择、投影、自然连接","B":"并、差、交、选择、投影","C":"并、差、选择、投影、笛卡尔积","D":"并、差、交、选择、笛卡尔积"},"answer":"C","analysis":"本题考查数据库技术——SQL 查询语句。在关系代数运算中，五种基本运算为：并、差、选择、投影、笛卡尔积。故选 C 项。"},{"id":47,"section":"cs","type":"single","stem":"数据库安全机制中，GRANT 语句实现的是（ ）。","passage":"","options":{"A":"用户查询","B":"用户授权","C":"加密保护","D":"回收评可"},"answer":"B","analysis":"本题考查数据库技术——数据库安全机制。数据库安全机制中，GRANT语句实现的是用户授权。故选 B 项。"},{"id":48,"section":"cs","type":"single","stem":"关于分布式数据库，正确的说法是（ ）。","passage":"","options":{"A":"客户机分布在不同场地，所以是分布式","B":"多个数据库服务器间的数据交互通过客户端程序实现","C":"数据的物理存储分布在不同的服务器上，而用户只关心访问的逻辑结构","D":"每个服务器上必须运行相同的数据库管理系统"},"answer":"C","analysis":"分布式数据库系统通常使用较小的计算机系统，每台计算机可单独放在一个地方，每台计算机中都可能有 DBMS 的一份完整拷贝副本，或者部分拷贝副本，并具有自己局部的数据库，位于不同地点的许多计算机通过网络互相连接，共同组成一个完整的、全局的逻辑上集中、物理上分布的大型数据库。A 项错误，是服务器分布在不同的场所，所以是分布式。B 项错误，数据的管理通过分布式数据库管理系统（DDBMS）来管理。C项正确，用户不需要知道所操作的数据具体存储于哪个场地，只需要知道要访问的数据库逻辑结构。D 项错误，分布式数据库允许不同场地使用不同的 DBMS。故选 C 项。"},{"id":49,"section":"cs","type":"single","stem":"数据库一个事务执行过程中，其正在访问的数据被其他事务所修改，导致处理结果不正确，这是由于违背了事务的（ ）而引起的。","passage":"","options":{"A":"原子性","B":"一致性","C":"隔离性","D":"持久性"},"answer":"C","analysis":"事务的四大属性即事务的原子性、一致性、隔离性、持久性。事务的隔离性是多个用户并发访问数据库时，数据库为每一个用户开启的事务，不能被其他事务的操作数据所干扰，多个并发事务之间要相互隔离。故选 C 项。"},{"id":50,"section":"cs","type":"single","stem":"为确保连接可靠建立，TCP 采用的技术（ ）。","passage":"","options":{"A":"多次重发","B":"一致性","C":"隔离性","D":"持久性"},"answer":"A","analysis":"本题考查计算机网络——TCP/IP 协议。在 TCP/IP 协议中，TCP 协议提供可靠的连接服务，采用三次握手建立一个连接。在该协议传输模式中在将数据包成功发送给目标计算机后，TCP 会要求发送一个确认；如果在某个时限内没有收到确认，那么TCP 将重新发送数据包。故选 A 项。"},{"id":51,"section":"cs","type":"single","stem":"ARP 协议的作用是（ ）。","passage":"","options":{"A":"将端口映射到 IP 地址","B":"连接 IP 层和 TCP 层","C":"广播 IP 地址","D":"将 IP 地址映射到 MAC 地址"},"answer":"D","analysis":"本题考查计算机网络——TCP/IP 协议。ARP 协议即地址解析协议，是根据IP地址获取物理 MAC 地址的一个 TCP/IP 协议。故选 D 项。"},{"id":52,"section":"cs","type":"single","stem":"不同 IP 网段的主机进行通信可以使用（ ）。","passage":"","options":{"A":"路由器","B":"交换机","C":"集线器","D":"网桥"},"answer":"A","analysis":"本题考查计算机网络——网络设备。不同 IP 网段的主机进行通信，需要在路由器中设置路由途径。故选 A 项。"},{"id":53,"section":"cs","type":"single","stem":"IPV6 地址长度为（ ）。","passage":"","options":{"A":"32 位","B":"48 位","C":"64 位","D":"128 位"},"answer":"D","analysis":"本题考查计算机网络——IP 地址。IPV4 地址长度为 32 位，IPV6 地址长度为128 位。故选 D 项。"},{"id":54,"section":"cs","type":"single","stem":"访问 http://www.test.com/main/index.htm 时，其中 index.htm（）。","passage":"","options":{"A":"协议名","B":"域名","C":"主机名","D":"页面文件"},"answer":"D","analysis":"本题考查计算机网络——域名。URL 由三部分组成：协议类型、域名/IP 地址和路径及文件名。index.htm 为文件名。故选 D 项。"},{"id":55,"section":"cs","type":"single","stem":"对于一个没有经过子网划分的传统 C 类网络来说，允许安装（）台主机。","passage":"","options":{"A":"1024","B":"254","C":"16","D":"48"},"answer":"B","analysis":"本题考查计算机网络——IP 地址。没有经过子网划分的传统C 类网络，有8位主机号，即可以安装 28=256 台主机，去掉八位二进制为全 0/全 1 的情况，可以安装254台主机。故选 B 项。"},{"id":56,"section":"cs","type":"single","stem":"属于操作系统自身安全漏洞的是（ ）。","passage":"","options":{"A":"操作系统自身存在的后门","B":"QQ 木马病毒","C":"管理员账户设置弱口令","D":"电脑中防火墙未做任何访问限制"},"answer":"A","analysis":"本题考查信息安全——系统安全。后门是系统开发阶段，开发者有意在系统程序中留下的，属于系统自身安全漏洞。故选 A 项。"},{"id":57,"section":"cs","type":"single","stem":"许多黑客都利用系统和软件中的漏洞进行攻击，以下最有效的解决方案是（）。","passage":"","options":{"A":"安装网络监控软件","B":"安装入侵检测系统","C":"给系统和软件更新安装最新的补丁","D":"安装防病毒软件"},"answer":"C","analysis":"AB 项错误，网络监控软件、入侵检测系统均可监控计算机是否遭受攻击，但不能有效解决计算机存在的漏洞问题。C 项正确，只有给系统、软件安装更新最新的补丁，才能免于黑客利用漏洞攻击。D 项错误，安装防病毒软件不能弥补漏洞。故选C 项。"},{"id":58,"section":"cs","type":"single","stem":"一般来说，个人计算机中的防病毒软件无法防御以下哪类威胁？（）","passage":"","options":{"A":"Word 病毒","B":"DDOS 攻击","C":"电子邮件病毒","D":"木马"},"answer":"B","analysis":"本题考查信息安全——计算机病毒。DDOS（分布式拒绝服务攻击）指借助于客户/服务器技术，将多个计算机联合起来作为攻击平台，对一个或多个目标发动DOS 攻击，成倍提高了 DOS 攻击的威力，通过大量合法的请求占用大量网络资源，以达到瘫痪网络的目的。所以个人计算机中的防病毒软件无法防御。故选 B 项。"},{"id":59,"section":"cs","type":"single","stem":"设有 98 个已排序元素，采用二分法查找时，最大比较次数是（）。","passage":"","options":{"A":"49","B":"15","C":"20","D":"7"},"answer":"D","analysis":"本题考查数据结构——查找。按照二分查找法，每次查找缩小一半的范围，查找元素个数依次是 49、24、12、6、3、1、0，本题最多执行 7 次查找。故选D 项。"},{"id":60,"section":"cs","type":"single","stem":"如果分时操作系统的时间固定，（ ）则响应时间越长。","passage":"","options":{"A":"用户数越多","B":"用户数越少","C":"CPU 频率越高","D":"内存越大"},"answer":"A","analysis":"本题考查操作系统——操作系统分类。分时系统的响应时间T 可以表达为：T≈Q*N，其中 Q 是时间片，而 N 是用户数。当时间片一定，用户数越多（即N越大），T就越大。故选 A 项。"},{"id":61,"section":"cs","type":"single","stem":"（ ）调度算法有利于 CPU 繁忙型的作业，而不利于 I/O 繁忙型的作业。","passage":"","options":{"A":"时间片轮转","B":"先来先服务","C":"短作业（进程）","D":"优先权"},"answer":"B","analysis":"本题考查操作系统——进程调度。在进程调度中，采用FCFS 调度算法时，则每次调度就是从就绪队列中选择一个最先进入该队列的进程，把处理机分配给它，使之投入运行。FCFS 调度算法有利于 CPU 繁忙型的作业，而不利于 I/O 繁忙型的作业（进程）。CPU繁忙型作业，是指该类作业需要大量的 CPU 时间进行计算，而很少请求I/O。通常的科学计算便属于 CPU 繁忙型作业。I/O 繁忙型作业是指 CPU 进行处理时，又需频繁地请求I/O，而每次 I/O 的操作时间却很短，目前大多数的事务处理，都属于 I/O 繁忙型作业。故选B项。"},{"id":62,"section":"cs","type":"single","stem":"软件按功能可分为应用软件、支撑软件（或工具软件）和系统软件，下面属于应用软件的是（ ）。","passage":"","options":{"A":"Unix 系统","B":"Windows 系统","C":"Linux 系统","D":"银行客户管理系统"},"answer":"D","analysis":"本题考查操作系统——软件分类。Unix、Linux、Windows 系统都属于系统软件，银行客户管理系统是应用软件。故选 D 项。"},{"id":63,"section":"cs","type":"single","stem":"通常软件著作权的客体不包括（ ）。","passage":"","options":{"A":"源程序","B":"目标程序","C":"软件文档","D":"软件开发思想"},"answer":"D","analysis":"本题考查软件工程与项目管理——软件著作权。软件著作权的客体是指计算机软件，即计算机程序（包括源程序和目标程序）及其有关文档。故选D 项。"},{"id":64,"section":"cs","type":"single","stem":"以下文件的物理结构中，最不利于文件长度动态增长的是（）。","passage":"","options":{"A":"连续结构","B":"链式结构","C":"多级索引结构","D":"混合索引结构"},"answer":"A","analysis":"本题考查操作系统——文件管理。连续结构把逻辑上连续的文件信息依次存放在连续编号的物理块中。只要知道文件在存储设备上的起始地址（首块号）和文件长度（总块数），就能很快地进行存取。这种结构的优点是访问速度快，缺点是文件长度增加困难。故选 A 项。"},{"id":65,"section":"cs","type":"single","stem":"在 Java 中，负责对字节代码解释执行的是（ ）。","passage":"","options":{"A":"垃圾回收器","B":"虚拟机","C":"应用服务器","D":"编译器"},"answer":"B","analysis":"本题考查程序设计——Java 语言。引入 Java 语言虚拟机后，Java 语言在不同平台上运行时不需要重新编译。Java 语言使用模式 Java 虚拟机屏蔽了与具体平台相关的信息，使得 Java 语言编译程序只需生成在 Java 虚拟机上运行的目标代码（字节码），就可以在多种平台上不加修改地运行。Java 虚拟机在执行字节码时，把字节码解释成具体平台上的机器指令执行。故选 B 项。"},{"id":66,"section":"cs","type":"single","stem":"若 C 程序的表达式中引用了未赋初值的变量，则（ ）。","passage":"","options":{"A":"编译时一定会报告错误信息，该程序不能运行","B":"可以通过编译并运行，但运行时一定会报告异常","C":"可以通过编译，但链接时一定会报告错误信息而不能运行","D":"可以通过编译并运行，但运行结果不一定是期望的结果"},"answer":"D","analysis":"在编写 C/C++源程序时，为所定义的变量赋初始值是良好的编程习惯，而赋初值不是强制的要求，因此编译程序不检查变量是否赋初值。如果表达式中引用的变量从定义到使用始终没有赋值，则该变量中的值表现为一个随机数或 0，这样对表达式的求值结果就是不确定的了。A 项错误，因为赋初值不是强制的要求，因此编译器不会报错。B项错误，在运行时该变量会表现为一个随机值或 0，所以不一定会报错。C 项错误，全局变量、静态变量处于数据区，默认初始化为 0 （如果指定初始值，则为指定的值），而局部变量处于堆栈区，其数值是随机的。变量都有默认值，链接可以通过。D 项正确，因为没有赋予正确的初值，因此虽然执行但不一定获取正确的结果。故选 D 项。"},{"id":67,"section":"cs","type":"single","stem":"程序的三种基本控制结构是（ ）。","passage":"","options":{"A":"过程、子程序和分程序","B":"顺序、选择和循环","C":"递归、堆栈和队列","D":"调用、返回和转移"},"answer":"B","analysis":"本题考查程序设计——程序的基本结构。程序的三种基本控制结构是顺序、选择和循环。故选 B 项。"},{"id":68,"section":"cs","type":"single","stem":"软件需求分析阶段的工作可分为四个方面：需求获取、需求分析、编写需求规格说明书以及（ ）。","passage":"","options":{"A":"需求报告","B":"需求评审","C":"需求总结","D":"风险评估"},"answer":"B","analysis":"本题考查软件工程与项目管理——软件需求分析。软件需求分析阶段的工作可分为四个方面：需求获取、需求分析、编写需求规格说明书、需求评审。故选B 项。"},{"id":69,"section":"cs","type":"single","stem":"黑盒测试也称为功能测试，黑盒测试不能发现（ ）。","passage":"","options":{"A":"终止性错误","B":"是否存在冗余代码","C":"输入是否正确接受","D":"界面是否有错误"},"answer":"D","analysis":"本题考查软件工程与项目管理——软件测试方法。黑盒测试是以用户的角度，从输入数据与输出数据的对应关系出发进行测试的。很明显，如果外部特性本身设计有问题或规格说明的规定有误，用黑盒测试方法是发现不了的。故选 D 项。"},{"id":70,"section":"cs","type":"single","stem":"针对软件在运行期的数据特点，修改其排序算法使其高效，属于（）维护。","passage":"","options":{"A":"正确性","B":"适应性","C":"完善性","D":"预防性"},"answer":"C","analysis":"本题考查软件工程与项目管理——软件维护。修改其排序算法使其高效，属于完善性维护。故选 C 项。"},{"id":71,"section":"cs","type":"single","stem":"从时间、地区和高品种类三个维度来分析某电器商品销售数据属于（）。","passage":"","options":{"A":"ETL","B":"OLTP","C":"OLAP","D":"DateMining"},"answer":"C","analysis":"本题考查数据挖掘——数据处理分类。数据处理大致可以分成两大类：联机事务处理 OLTP（on-line transaction processing）、联机分析处理 OLAP（On-Line Analytical Processing）。OLTP 是传统的关系型数据库的主要应用，主要是基本的、日常的事务处理，例如银行交易。OLAP 是数据仓库系统的主要应用，支持复杂的分析操作，侧重决策支持，并且提供直观易懂的查询结果。为了提高数据分析效率，OLAP 技术彻底打破以记录为单位的数据浏览方式，而将数据分离为“维度”和“度量”：维度是观察数据的角度，例如“销售时间”“销售地点”“产品”；度量是具体考察的数量值，例如“销售数量”和“销售金额”。ETL 是将业务系统的数据经过抽取、清洗转换之后加载到数据仓库的过程，目的是将企业中的分散、零乱、标准不统一的数据整合到一起，为企业的决策提供分析依据。故选 C 项。"},{"id":72,"section":"cs","type":"single","stem":"在 Windows 在运行中，ping 命令可以实现（ ）。","passage":"","options":{"A":"查看当前 TCP/2P 配置信息","B":"显示连接及状态信息","C":"测试达到目的的主机的连通性","D":"查看当前使用 DYS 服务器"},"answer":"C","analysis":"本题考查计算机网络——常用网络操作命令。ping 命令的目的就是测试本机到目的主机的连通性。故选 C 项。"},{"id":73,"section":"cs","type":"single","stem":"从整个 Internet 的观点出发，（ ）可以有效减少路由器的规模。","passage":"","options":{"A":"增加动态路由的更新频率","B":"路由聚合","C":"划分 VLAN","D":"减少动态路由的更新的频率"},"answer":"B","analysis":"本题考查计算机网络——网络设备。路由聚合（也叫汇总）是让路由选择协议能够用一个地址通告众多网络，旨在缩小路由器中路由选择表的规模，以节省内存，并缩短IP 对路由选择表进行分析以找出前往远程网络的路径所需的时间。故选B 项。"},{"id":74,"section":"cs","type":"single","stem":"以下场景描述中，存在明显安全隐患的是（ ）。","passage":"","options":{"A":"小王通过实名认证接入单位的无线互联网络实现手机上网","B":"小宋使用脱敏后的数据进行程序测试","C":"小吴使用涉密计算机起草一份非涉密文件","D":"小李用数据线通过与互联网物理隔离的内部计算机 USB 端口给手机充电"},"answer":"D","analysis":"数据脱敏是数据库安全技术之一，指对某些敏感信息通过脱敏规则进行数据的变形，实现敏感隐私数据的可靠保护。在涉及客户安全数据或者一些商业性敏感数据的情况下，在不违反系统规则条件下，对真实数据进行改造并提供测试使用，如身份证号、手机号、卡号、客户号等个人信息都需要进行数据脱敏。B 项不存在安全隐患。内部计算机与外部网络隔离，然而手机并未与外界网络隔离，通过 USB 数据线连接二者有安全隐患。故选D项。"},{"id":75,"section":"cs","type":"single","stem":"软件需要包括功能需求、非功能需求、设计约束三个主要部分，其中（）属于功能需求的内容。","passage":"","options":{"A":"软件开发工具","B":"软件的运行环境","C":"软件可靠性","D":"软件需要完成什么"},"answer":"D","analysis":"本题考查软件工程与项目管理——软件需求分析。软件需要完成什么属于功能需求的内容。故选 D 项。"},{"id":76,"section":"cs","type":"single","stem":"小李在使用扫描软件对目标网络进行扫描时发现，某一个主机开放了25 和110 端口，此主机最有可能是（ ）。","passage":"","options":{"A":"文件服务器","B":"WEB 服务器","C":"邮件服务器","D":"DNS 服务器"},"answer":"C","analysis":"传输层使用协议端口号（protocol port number），或通常简称为端口（port），端口用一个 16 位端口号进行标志。端口号只具有本地意义，即端口号只是为了标志本计算机应用层中的各进程。在因特网中不同计算机的相同端口号是没有联系的。虽然通信的终点是应用进程，但我们可以把端口想象是通信的终点，因为我们只要把要传送的报文交到目的主机的某一个合适的目的端口，剩下的工作（即最后交付目的进程）就由TCP、UDP 来完成。TCP 25 端口：SMTP 简单邮件传输服务；TCP 110 端口：POP3 邮局协议使用的端口，因此最有可能是邮件服务器。故选 C 项。"},{"id":77,"section":"cs","type":"single","stem":"在安全领域，自主访问控制与强制访问控制相比具有以下哪个优点？（）","passage":"","options":{"A":"具有较高的安全性","B":"控制粒度较大","C":"配置效率不高","D":"具有较高的灵活性"},"answer":"D","analysis":"自主访问控制是根据自主访问控制策略建立的一种模型，允许合法用户以用户或用户组的身份访问策略规定的客体，同时组织非授权用户访问客体，某些用户还可以把自己拥有的客体的访问权限授予其他用户。自主访问控制的优缺点：优点在于可以根据主体的身份和访问权限进行决策，具有某种访问能力的主体能够自主的将访问权的某个子集授予其他主体，灵活性高；缺点是信息在传递过程中其访问权限关系会被改变。强制访问控制是指计算机系统根据使用系统的机构事先确定的安全策略，对用户的访问权限进行强制性的控制。也就是说，系统独立于用户行为强制执行访问控制，用户不能改变他们的安全级别或对象的安全属性。故选 D 项。"},{"id":78,"section":"cs","type":"single","stem":"C 语言中，以下函数 abc 的功能是（ ）。int abc（char *ps）｛char *p;p=ps;while（*p++）;return（p-ps）;｝","passage":"","options":{"A":"比较两个字符串的长度","B":"求字符串的长度","C":"将串 ps 复制到串 p 中","D":"查找字符串最后一个字符"},"answer":"B","analysis":"空字符后第一个字符索引减去首字符索引，结果为字符串长度。故选B项。"},{"id":79,"section":"cs","type":"single","stem":"如果银行制订业务系统连续性计划，考虑备用系统设备选址时以下哪项最重要？（ ）","passage":"","options":{"A":"不会受到同一灾难事件影响","B":"能够及时召集到高水平技术团队","C":"离它所要服务的用户是否足够近","D":"交通便利，距离机场、车站很近"},"answer":"A","analysis":"建设灾备中心时，应根据风险分析的结果，避免灾备中心与生产中心同时遭受同类风险。灾备中心还应具有方便灾难恢复人员或设备到达的交通条件，以及数据备份和灾难恢复所需的通信和电力等资源。故选 A 项。"},{"id":80,"section":"cs","type":"single","stem":"四种云部署模式是（ ）。","passage":"","options":{"A":"公有、内部、混合和社区","B":"外部、私有、混合和社区","C":"公有、私有、联合和社区","D":"公有、私有、混合和社区"},"answer":"D","analysis":"云计算有四种部署模型，公有云，私有云，社区云和混合云。故选D项。"},{"id":81,"section":"multi","type":"multi","stem":"下列软件中，属于操作系统的是（ ）。","passage":"","options":{"A":"UNIX","B":"Linux","C":"MS DOS","D":"MS Office"},"answer":"ABC","analysis":"本题考查操作系统——操作系统的分类。UNIX、Linux、MS DOS 都是操作系统，MS Office 是办公软件，属于应用软件。故选 ABC 项。"},{"id":82,"section":"multi","type":"multi","stem":"操作系统中三级调度包括（ ）。","passage":"","options":{"A":"作业调度","B":"进程调度","C":"线程调度","D":"中级调度"},"answer":"ABD","analysis":"本题考查操作系统——调度。操作系统中三级调度包括作业调度（高级调度）、中级调度和低级调度。高级调度：又称作业调度。主要任务是按一定的原则从外存上处于后备状态的作业中选择一个或多个，给它们分配内存、输入输出设备等必要资源。中级调度：主要任务是按照给定的原则和策略，将处于外存对换区中的重又具备运行条件的进程调入内存，或将处于内存的暂时不能运行的进程交换到外存对换区。低级调度：又称进程调度。主要任务是按照某种策略和方法从就绪队列中选取一个进程，将处理机分配给它。是操作系统中最基本的一种调度，在一般操作系统中都必须配置进程调度。低级调度是必不可少的，是操作系统中最基本的一种调度。故选 ABD 项。"},{"id":83,"section":"multi","type":"multi","stem":"算法复杂度一般包括（ ）。","passage":"","options":{"A":"系统复杂度","B":"时间复杂度","C":"计算复杂度","D":"空间复杂度"},"answer":"BD","analysis":"本题考查数据结构——算法。算法复杂度包括时间复杂度和空间复杂度。故选BD 项。"},{"id":84,"section":"multi","type":"multi","stem":"关于栈与队列，下面错误的说法是（ ）。","passage":"","options":{"A":"栈底元素一定是最后入栈的元素","B":"栈操作遵循后进先出原则","C":"栈底元素一定是最先入栈的元素","D":"栈与队列操作特性相同"},"answer":"AD","analysis":"本题考查数据结构——存储结构。栈：后进先出，栈底元素最先入栈；队列：先进先出。栈与队列操作特性不同。故选 AD 项。"},{"id":85,"section":"multi","type":"multi","stem":"在数据库 E-R 图中，包括以下基本成分（ ）。","passage":"","options":{"A":"实体","B":"对象","C":"属性","D":"联系"},"answer":"ACD","analysis":"本题考查数据库——E-R 模型。数据库 E-R 图的元素包括实体、联系、属性。故选 ACD 项。"},{"id":86,"section":"multi","type":"multi","stem":"属于软件详细设计阶段任务的是（ ）。","passage":"","options":{"A":"算法设计","B":"数据结构","C":"数据库","D":"逻辑模型"},"answer":"ABC","analysis":"本题考查软件工程与项目管理——软件生命周期详细设计阶段。详细设计的基本任务：对每个模块进行详细的算法设计；对模块内的数据结构进行设计；对数据库进行物理设计；其他设计，如代码设计、用户界面设计、输入输出格式设计；编写详细设计说明书；评审。故选 ABC 项。"},{"id":87,"section":"multi","type":"multi","stem":"关于软件测试的表述，正确的说法是（ ）。","passage":"","options":{"A":"软件测试是为了检查并改正尽可能多的错误","B":"软件测试是为了检查并改正所有的错误","C":"成功的测试是没有发现软件错误","D":"成功的测试是发现至今未能发现的软件错误"},"answer":"AD","analysis":"本题考查软件工程与项目管理——软件生命周期软件测试阶段。软件测试是为了检查并改正尽可能多的错误，成功的测试是发现至今未能发现的软件错误。故选AD项。"},{"id":88,"section":"multi","type":"multi","stem":"影响软件质量的因素包括（ ）。","passage":"","options":{"A":"开发技术","B":"过程质量","C":"人员素质","D":"成本、时间、进度等约束条件"},"answer":"ABCD","analysis":"本题考查软件工程与项目管理——软件质量管理。影响软件质量的因素包括开发技术，过程质量控制，开发人员素质，成本、时间、进度等约束条件等。故选ABCD项。"},{"id":89,"section":"multi","type":"multi","stem":"面向对象分析中，一般使用 UML 建模，其中属于静态图的是（）。","passage":"","options":{"A":"类图","B":"对象图","C":"活动图","D":"包图"},"answer":"ABD","analysis":"本题考查软件工程与项目管理——面向对象分析。使用UML 建模，其中属于静态图的有：用例图、类图、对象图、组件图、部署图；属于动态图的有：时序图、协作图、状态图、活动图。一个“包图”可以是任何一种的 UML 图组成，通常是UML 用例图或UML类图。故选 ABD 项。"},{"id":90,"section":"multi","type":"multi","stem":"下列工作中，（ ）是数据库管理员 DBA 的职责。","passage":"","options":{"A":"决定 DB 结构和信息内容","B":"设计数据的存储结构和存取策略","C":"提出并确定数据库的用户访问权限","D":"监控数据库的使用和运行"},"answer":"ACD","analysis":"数据库管理员负责保护控制数据，使得数据能够被任何有权使用的人有效利用。A 项正确，数据库管理员定义并存储数据库的内容。B 项错误，设计数据库是软件开发阶段工作。C 项正确，DBA 为了保护数据库的安全，为不同的使用者确定访问权限。D项正确，DBA 监控数据了的使用和运行。故选 ACD 项。"},{"id":91,"section":"multi","type":"multi","stem":"以下最不易受电磁干扰和噪声影响的网络传输介质是（ ）。","passage":"","options":{"A":"非屏蔽双绞线","B":"单模光纤","C":"同轴电缆","D":"多模光纤"},"answer":"BD","analysis":"A 项错误，非屏蔽双绞线由两根彼此绝缘的铜线组成，按规则螺旋状绞合在一起成为一对线，价格低廉，使用方便，但容易受到外部电磁场的干扰。B 项正确，光纤是由透明的石英玻璃拉成细丝，传导光纤的媒体。单模光纤是直径减小到只有一个波长。由于传输媒介不是金属，所以不易受到电磁干扰。C 项错误，同轴电缆指有两个同心导体，而导体和屏蔽层又共用同一轴心的电缆。最常见的同轴电缆由绝缘材料隔离的铜线导体组成。由于金属铜做传输介质，因此容易外部电磁场的干扰。D 项正确，多模光纤直径比单模光纤大，允许多条不同角度的入射光线在一条光纤中传输，由于传输介质都是石英玻璃，因此不易受到电磁场的干扰。故选 BD 项。"},{"id":92,"section":"multi","type":"multi","stem":"有关隐私权，正确的说法是（ ）。","passage":"","options":{"A":"网络时代，隐私权的保护受到较大冲击","B":"虽然网络世界不同于现实世界，但也需要保护个人隐私","C":"由于网络是虚拟世界，所以在网上不需要保护个人的隐私","D":"可以借助法律来保护网络隐私权"},"answer":"ABD","analysis":"A 项正确，网络隐私的载体是具有虚拟性质的网络，其不可触摸性导致了私人空间、私人信息极其容易受到侵犯。网络的高度开放性、流动性和交互性的特性决定了个人信息一旦在网络上传播，其速度之快、范围之广以及任何人攫取之便捷将无法控制。B项正确，隐私权在网络中的延伸，是指自然人在网上享有私人生活安宁、私人信息、私人空间和私人活动依法受到保护，不被他人非法侵犯、知悉、搜集、复制、利用和公开的一种人格权。C 项错误，网络隐私权是隐私权在网络中的延伸，是隐私权在网络空间的表现形式。D项正确，国内外已通过立法对网络隐私权进行保护。故选 ABD 项。"},{"id":93,"section":"multi","type":"multi","stem":"信息系统意外宕机的因素有哪些？（ ）","passage":"","options":{"A":"人为错误","B":"自然灾害","C":"软件故障","D":"硬件故障"},"answer":"ABCD","analysis":"信息系统的可靠性与硬件、软件、环境、人等因素有关。A 项正确，由于人为错误可导致系统宕机，例如数据库管理员权限分级不严谨，初级数据库操作员删除了整个数据库导致的宕机。B 项正确，强烈的自然灾害如烈度大的地震、剧烈海啸等可摧毁数据中心导致的宕机。C 项正确，由于软件系统设计冗余小或者有比较大的设计BUG，可以导致整个系统陷入死循环而宕机。D 项正确，由于供电（欠压，过载，波动）、震动、硬件质量（热稳定性和抗干扰能力）等因素可导致系统宕机。故选 ABCD 项。"},{"id":94,"section":"multi","type":"multi","stem":"关于信息系统弱点，正确的说法是（ ）。","passage":"","options":{"A":"信息系统弱点无处不在","B":"信息系统的弱点通常只存在于设计不完美的操作系统中","C":"信息系统弱点可以通过有效的防护措施，将风险降到可接受范围内","D":"信息系统弱点主要由技术因素造成"},"answer":"AC","analysis":"A 项正确，影响系统安全性的因素非常多，系统弱点无处不在，可能是计算机硬件、操作系统、数据库、通信网络、检测、控制等很多方面。B 项错误，信息系统都具有脆弱性，前期设计得当的信息系统，充分考虑到资源调度安全，数据存储的安全，信息传播的安全等因素，前期设计不完美的系统，出现弱点会更多。C 项正确，考虑充分的防护措施，比如系统权限分级、完善的网络协议、配置正确的防火系统，可以将风险降低到可接受范围。D 项错误，信息系统的弱点多少主要由前期系统设计强健性决定。故选AC 项。"},{"id":95,"section":"multi","type":"multi","stem":"关于保障网络安全，正确的说法是（ ）。","passage":"","options":{"A":"绕过防火墙，私自和外部网络连接，可能造成系统安全漏洞","B":"越权修改网络系统配置，可能造成网络工作不正常或故障","C":"有意或无意地泄露网络用户或网络管理员口令是危险的","D":"解决来自网络内部的不安全因素，必须从技术方面入手"},"answer":"ABC","analysis":"A 项正确，绕过防火墙，会将系统已知未打补丁的漏洞或一些未知的系统漏洞暴露，有可能因此受到网络攻击并产生安全漏洞。B 项正确，网络系统配置包括通讯端口设置、网络协议，共享访问权限，防火墙安全控制等，越权修改会导致网络崩溃或网络信息传输的不安全性。C 项正确，网络管理员口令是信息系统唯一合法认证手段，通过不同权限的管理员口令可以合法的取得系统权限，泄露管理员口令是非常危险的。D 项错误，解决网络内部的不安全因素，首先考虑完善的访问制度，加强身份认证，访问控制、端口的保护和正确的信息审计，并通过技术的手段加以保证。故选 ABC 项。"},{"id":96,"section":"multi","type":"multi","stem":"数据仓库的基本特征包括（ ）。","passage":"","options":{"A":"面向主题的","B":"集成的","C":"非易失的","D":"时变的"},"answer":"ABCD","analysis":"数据仓库是一个面向主题的、集成的、相对稳定的（非易失的）、反映历史变化的（时变的）数据集合，用于支持企业或组织的决策分析处理。故选ABCD 项。"},{"id":97,"section":"multi","type":"multi","stem":"下面哪些属于对程序的静态分析？（ ）","passage":"","options":{"A":"程序复杂度分析","B":"代码规则检查","C":"内存泄漏检查","D":"程序结构分析"},"answer":"ABD","analysis":"（Program Static Analysis）是指在不运行代码的方式下，通过词法分析、语法分析、控制流、数据流分析等技术对程序代码进行扫描，验证代码是否满足规范性、安全性、可靠性、可维护性等指标的一种代码分析技术。A 项正确，通过计算程序时间复杂度和空间复杂度来预测程序耗费的资源，属于静态分析。B 项正确，代码规则检查可以通过程序的静态分析完成证代码是否满足规范性的要求。C 项错误，内存泄露检查属于动态分析。D项正确，可以通过程序的静态分析查找代码中存在的结构性错误，进行程序结构分析。故选ABD项。"},{"id":98,"section":"multi","type":"multi","stem":"手机银行软件开发时可能考虑的安全措施包括（ ）。","passage":"","options":{"A":"App 程序采取反编译措施","B":"遵守安全规范要求开展编程","C":"跨平台兼容性","D":"避免或减少程序逻辑设计缺陷"},"answer":"ABCD","analysis":"信息安全指确保信息的保密性、完整性和可用性。A 项正确，未采用反编译措施的 APP 在被反编译后可以明确看到软件的安全协议构成、软件系统逻辑等敏感元素，会对整个系统造成安全性威胁。B 项正确，银行系统对信息传递的安全性及信息鉴权有完备的规范，基于安全规范下编程是信息安全要求的基本规范。C 项正确，手机端主流操作系统是安卓和苹果的 IOS，银行服务器一般是 Unix，两者之间的信息通讯需要考虑数据结构的兼容和其他方面的兼容性。D 项正确，程序设计的缺陷有可能造成用户端使用体验下降，严重的设计缺陷甚至可能会威胁到系统安全，应该在前期避免程序设计缺陷。故选ABCD项。"},{"id":99,"section":"multi","type":"multi","stem":"下列哪些属于 SQL 注入安全防范措施？（ ）","passage":"","options":{"A":"防止重要参数被篡改","B":"替换或删除敏感的字符或字符串","C":"将动态 SQL 语句替换为存储过程","D":"对输入内容进行转义处理"},"answer":"BCD","analysis":"SQL 注入，就是通过把 SQL 命令插入到 Web 表单提交或输入域名或页面请求的查询字符串，最终达到欺骗服务器执行恶意的 SQL 命令。A 项错误，不是具体的防范措施。B 项正确，SQL 注入能够成功的根本在于，程序没有对用户输入进行有效的验证，但如果验证的不够彻底，就会给攻击者留下可乘之机。有必要屏蔽掉用户输入中的特殊字符或敏感字符。C 项正确，如果在编写 SQL 语句的时候，用户输入的变量不是直接嵌入到SQL语句，而是通过固定的存储来传递这个变量的话，那么就可以有效地防治SQL 注入式攻击。D 项正确，在用户的输入没有为转义字符过滤时，可能会发生注入式攻击，它会被传递给一个 SQL 语句。这样就会导致应用程序的终端用户对数据库上的语句实施操纵。故选BCD项。"},{"id":100,"section":"multi","type":"multi","stem":"关于网络地址转换 NAT 的特点，正确的说法是（ ）。","passage":"","options":{"A":"NAT 的基本思路是 IP 地址重用，以缓解 IP 地址短缺","B":"内部网络的主机分配内部专用 IP 地址","C":"NAT 路由器实现内部网络内部专用地址与全局 IP 地址的转换","D":"NAT 只涉及 IP 地址，不涉及相邻层次"},"answer":"ABC","analysis":"网络地址转换（Network Address Translation，缩写为 NAT），也叫做网络掩蔽或者 IP 掩蔽（IP masquerading），是一种在 IP 数据包通过路由器或防火墙时重写来源IP地址或目的 IP 地址的技术。A 项正确，NAT 广泛应用在有多台主机但只通过一个公有IP 地址访问因特网的私有网络中，缓解 IP 地址短缺。B 项正确，专用网内部的主机已经分配到了本地 IP 地址。C 项正确，使用本地地址的主机在和外界通信时，都要在NAT 路由器上将其本地地址转换成全球 IP 地址，才能和因特网连接。D 项错误，NAT 违反了基本的网络分层结构模型的设计原则。因为在传统的网络分层结构模型中，第 N 层是不能修改第N+1 层的报头内容的。NAT 破坏了这种各层独立的原则。故选 ABC 项。"},{"id":101,"section":"eng","type":"single","stem":"According to this passage, insurance is possible because________.","passage":"Insurance is the sharing of risks. Nearly everyone is exposed to risk of some sort. The house owner, for example, knows that his property can be damaged by fire, the ship owner knows that his vessel may be lost at sea; the breadwinner knows that he may die at an early age and leave his family the poorer. On the other hand, not every house is damaged by fire nor every vessel lost at sea. If these persons each put a small sum of money into a pool, there will be enough to meet the needs of the few who do suffer loss. In other words, the losses of the few are met fromthe contributions of the money. This is the basis of insurance. Those who pay the contribution are known as “insured”and those who administer the pool of contributions as “insurers”. Not all risks can be covered by insurance. Broadly speaking, the ordinary risks of business and speculation cannot be covered. The risk that buyers will not buy goods at the prices offered is not of a kind that can be statistically estimated, and risks can only be insured against if they can be so estimated. The legal basis of all insurance is the “policy”. This is a printed form of contract. It states that in return for the regular payment by the insured of a certain sum of money, called the “premium”, which is usually paid every year, the insurer will pay a sum of money or compensation for loss, if the risk actually happens. The wording of policies, particularly in marine insurance, often seems very old-fashioned, but there is a sound reason of this. Over a large number of years, many law cases have been brought to clear up the meanings of doubtful phrases in policies. The law courts have given these phrases a definite and indisputable meaning, and to avoid future disputes the phrases have continued to be used in polices even when they have passedout of normal use in speech.","options":{"A":"only a small proportion of the insured suffer loss","B":"everyone at some time suffers loss","C":"nearly everyone suffers loss","D":"only insured people suffer loss"},"answer":"A","analysis":"本题属于细节理解题。题目意为：根据文意，保险是可行的，原因是________。A 项，“被保险人中只有一小部分真正蒙受损失”；B 项，“所有人都有蒙受损失的时候”；C 项，“几乎所有人都蒙受损失”；D 项，“只有被保险人蒙受损失”。根据题目中关键词找到主题句：On the other hand, not every house is damaged by fire nor every vessel lost at sea. 解释了不是所有人都会遭受损失，只有一小部分人会遭到厄运，因此保险是切实可行的。故选 A 项。"},{"id":102,"section":"eng","type":"single","stem":"The phrase “the pool of contributions” in the first paragraph means________.","passage":"Insurance is the sharing of risks. Nearly everyone is exposed to risk of some sort. The house owner, for example, knows that his property can be damaged by fire, the ship owner knows that his vessel may be lost at sea; the breadwinner knows that he may die at an early age and leave his family the poorer. On the other hand, not every house is damaged by fire nor every vessel lost at sea. If these persons each put a small sum of money into a pool, there will be enough to meet the needs of the few who do suffer loss. In other words, the losses of the few are met fromthe contributions of the money. This is the basis of insurance. Those who pay the contribution are known as “insured”and those who administer the pool of contributions as “insurers”. Not all risks can be covered by insurance. Broadly speaking, the ordinary risks of business and speculation cannot be covered. The risk that buyers will not buy goods at the prices offered is not of a kind that can be statistically estimated, and risks can only be insured against if they can be so estimated. The legal basis of all insurance is the “policy”. This is a printed form of contract. It states that in return for the regular payment by the insured of a certain sum of money, called the “premium”, which is usually paid every year, the insurer will pay a sum of money or compensation for loss, if the risk actually happens. The wording of policies, particularly in marine insurance, often seems very old-fashioned, but there is a sound reason of this. Over a large number of years, many law cases have been brought to clear up the meanings of doubtful phrases in policies. The law courts have given these phrases a definite and indisputable meaning, and to avoid future disputes the phrases have continued to be used in polices even when they have passedout of normal use in speech.","options":{"A":"the money paid by the insurers","B":"the cost of administering insurance","C":"the money paid by the insured","D":"the amount of each premium"},"answer":"C","analysis":"本题属于细节理解题。题目意为：第一自然段中，短语the pool of contribution（款项总额）的意思是 ________。A 项，“保险公司支付的款项”；B 项，“管理保险的费用”；C 项，“被保险人支付的款项”；D 项，“每笔保险费的金额”。根据题目中关键词找到主题句：If these persons each put a small sum of money into a pool, there will be enoughto meet the needs of the few who do suffer loss.In other words, the losses of the few are met fromthe contributions of the money.This is the basis of insurance.短语“the pool of contribution”是使用了修辞手法，其实质就是保险费的总和，即被保险人支付的款项。故选C 项。"},{"id":103,"section":"eng","type":"single","stem":"The insurance of businesses’ ordinary risks is not possible because________.","passage":"Insurance is the sharing of risks. Nearly everyone is exposed to risk of some sort. The house owner, for example, knows that his property can be damaged by fire, the ship owner knows that his vessel may be lost at sea; the breadwinner knows that he may die at an early age and leave his family the poorer. On the other hand, not every house is damaged by fire nor every vessel lost at sea. If these persons each put a small sum of money into a pool, there will be enough to meet the needs of the few who do suffer loss. In other words, the losses of the few are met fromthe contributions of the money. This is the basis of insurance. Those who pay the contribution are known as “insured”and those who administer the pool of contributions as “insurers”. Not all risks can be covered by insurance. Broadly speaking, the ordinary risks of business and speculation cannot be covered. The risk that buyers will not buy goods at the prices offered is not of a kind that can be statistically estimated, and risks can only be insured against if they can be so estimated. The legal basis of all insurance is the “policy”. This is a printed form of contract. It states that in return for the regular payment by the insured of a certain sum of money, called the “premium”, which is usually paid every year, the insurer will pay a sum of money or compensation for loss, if the risk actually happens. The wording of policies, particularly in marine insurance, often seems very old-fashioned, but there is a sound reason of this. Over a large number of years, many law cases have been brought to clear up the meanings of doubtful phrases in policies. The law courts have given these phrases a definite and indisputable meaning, and to avoid future disputes the phrases have continued to be used in polices even when they have passedout of normal use in speech.","options":{"A":"such risks are very expensive","B":"such risks cannot be estimated precisely","C":"such risks are too high","D":"the premium would be too high"},"answer":"B","analysis":"本题属于细节理解题。题目意为：对普通商业风险进行投保是不可行的，原因是 ________ 。A 项，“此类风险所需费用昂贵”；B 项，“此类风险不能被准确预估”；C 项，“此类风险发生率太高”；D 项，“保险费用太高”。根据题目中关键词找到主题句：Not all risks can be covered by insurance.Broadly speaking, the ordinary risks of business andspeculation cannot be covered.主题句中，解释了不能对普通商业风险进行投保的原因是无法预估此类风险，只有在风险可以预估的情况下才能对风险投保。故选B 项。"},{"id":104,"section":"eng","type":"single","stem":"Old-fashioned wording is sometimes used in insurance policies because________.","passage":"Insurance is the sharing of risks. Nearly everyone is exposed to risk of some sort. The house owner, for example, knows that his property can be damaged by fire, the ship owner knows that his vessel may be lost at sea; the breadwinner knows that he may die at an early age and leave his family the poorer. On the other hand, not every house is damaged by fire nor every vessel lost at sea. If these persons each put a small sum of money into a pool, there will be enough to meet the needs of the few who do suffer loss. In other words, the losses of the few are met fromthe contributions of the money. This is the basis of insurance. Those who pay the contribution are known as “insured”and those who administer the pool of contributions as “insurers”. Not all risks can be covered by insurance. Broadly speaking, the ordinary risks of business and speculation cannot be covered. The risk that buyers will not buy goods at the prices offered is not of a kind that can be statistically estimated, and risks can only be insured against if they can be so estimated. The legal basis of all insurance is the “policy”. This is a printed form of contract. It states that in return for the regular payment by the insured of a certain sum of money, called the “premium”, which is usually paid every year, the insurer will pay a sum of money or compensation for loss, if the risk actually happens. The wording of policies, particularly in marine insurance, often seems very old-fashioned, but there is a sound reason of this. Over a large number of years, many law cases have been brought to clear up the meanings of doubtful phrases in policies. The law courts have given these phrases a definite and indisputable meaning, and to avoid future disputes the phrases have continued to be used in polices even when they have passedout of normal use in speech.","options":{"A":"law courts have decided not to use fashionable words","B":"it is widely accepted by all the insured","C":"it enables ordinary people to understand it easily","D":"the meaning of such wording has been agreed upon"},"answer":"D","analysis":"本题属于细节推理题。题目意为：保险单上有时使用过时词语，原因是________ 。A 项，“法庭决定不使用时髦词语”；B 项，“它被所有的被保险人广泛接受”；C 项，“它使普通人能够轻松理解”；D 项，“此类词语的含义已被确定”。根据题目中关键词找到主题句：The wording of policies, particularly in marine insurance, often seems veryold-fashioned, but there is a sound reason of this.Over a large number of years, many lawcases have been brought to clear up the meanings of doubtful phrases in policies.主题句中，使用过时词语的原因是此类词语含义清晰，不会引起矛盾。故选 D 项。"},{"id":105,"section":"eng","type":"single","stem":"It seems that the author thinks the insurance is________.","passage":"Insurance is the sharing of risks. Nearly everyone is exposed to risk of some sort. The house owner, for example, knows that his property can be damaged by fire, the ship owner knows that his vessel may be lost at sea; the breadwinner knows that he may die at an early age and leave his family the poorer. On the other hand, not every house is damaged by fire nor every vessel lost at sea. If these persons each put a small sum of money into a pool, there will be enough to meet the needs of the few who do suffer loss. In other words, the losses of the few are met fromthe contributions of the money. This is the basis of insurance. Those who pay the contribution are known as “insured”and those who administer the pool of contributions as “insurers”. Not all risks can be covered by insurance. Broadly speaking, the ordinary risks of business and speculation cannot be covered. The risk that buyers will not buy goods at the prices offered is not of a kind that can be statistically estimated, and risks can only be insured against if they can be so estimated. The legal basis of all insurance is the “policy”. This is a printed form of contract. It states that in return for the regular payment by the insured of a certain sum of money, called the “premium”, which is usually paid every year, the insurer will pay a sum of money or compensation for loss, if the risk actually happens. The wording of policies, particularly in marine insurance, often seems very old-fashioned, but there is a sound reason of this. Over a large number of years, many law cases have been brought to clear up the meanings of doubtful phrases in policies. The law courts have given these phrases a definite and indisputable meaning, and to avoid future disputes the phrases have continued to be used in polices even when they have passedout of normal use in speech.","options":{"A":"a form of gambling","B":"a way of making money quickly","C":"useful and necessary","D":"old-fashioned"},"answer":"C","analysis":"本题属于观点态度题。该题询问作者对保险的态度。A 项，把保险看作一种赌博，文章并未提及此事，排除；B 项，是一种赚快钱的方式，保险并没有此种功能，文章也未提及，排除；C 项，有用且必要的，从作者对保险业务的成型到保单的签订，都做了很详细的说明，可以推断作者认为保险是有用的，C 项符合题意；D 项，保险是过时的，是文章中形容一些保单措辞的表达，和保险业无关，排除。根据题目中关键词找到主题句：Insurance is the sharing of risks.Nearly everyone is exposed to risk of some sort.主题句中，作者明确表示几乎所有人都有可能遭受风险，而保险能够分担风险，因此保险是有用而且必需的。故选C项。 （二）"},{"id":106,"section":"eng","type":"single","stem":"What can we learn about mortgage loans from the first paragraph?","passage":"The very loans that are supposed to help seniors stay in their homes are in many cases pushing them out. Reverse mortgages, which allow homeowners 62 or older to borrowmoney against the value of their homes and not pay it back until they move out or die, have long been said with problems. Now, federal and state regulators are documenting new instances of abuse as smaller mortgage brokers, including former sub-prime lenders, flood the market after the recent exit of big banks and as defaults on the loans hit record highs. Some lenders are aggressively recommending loans to seniors who cannot afford the fees associated with them, without mentioning the property taxes and maintenance. Others are wooingseniors with promises that the loans are free money that can be used to finance their long-desiredthings, without clearly explaining the risks. Some widows were pressured not to have their names on the contract, without being told that they could be left facing foreclosure after their husbands died.Now, as the vast baby boomer generation is entering retirement and more seniors struggle with declining savings, the newly established Consumer Financial Protection Bureau is working on new rules that could mean better disclosure for consumers and stricter supervision of lenders. More than 775,000 of such loans are outstanding, according to the federal government. Concerns about the multi-billion dollar reverse mortgages market echo those raised in the lead-up to the financial crisis when consumers were marketed loans—often carrying hidden risks —that they could not afford. “There are many of the same red flags, including explosive growthand the fact that these loans are often advertised aggressively without regarded to suitability,”sadLori Swanson, the Minnesota attorney general, who is working on reforming the reverse mortgage market.","options":{"A":"The loans are expected to help seniors stay in their homes.","B":"The loans are driving all seniors out of their homes.","C":"The reverse mortgage only welcomes seniors.","D":"Any senior can apply for reverse mortgages."},"answer":"A","analysis":"本题属于细节理解题。题目意为：从第一段中，我们能得知反向抵押贷款________？A 项，“反向抵押贷款本来的预期是帮助老年人留在家里”；B 项，“反向抵押贷款正在将所有的老年人赶出家门”；C 项，“反向抵押贷款只欢迎老年人”；D 项，“任何老年人都能申请反向抵押贷款”。根据题目中关键词找到主题句：The very loans that are supposed to help seniors stay in their homes are in many cases pushing themout.Reverse mortgages, which allow homeowners 62 or older to borrow money against the value of their homes and not pay it back until they move out or die, have long been said with problems.可以看出反向抵押贷款的初衷本来是帮助老年人留在家中，但往往结果是使老年人丧失房产。B项“all”, C 项“only”，D 项“any”的说法过于绝对。故选 A 项。"},{"id":107,"section":"eng","type":"single","stem":"Which is true about the problem of reverse mortgage?","passage":"The very loans that are supposed to help seniors stay in their homes are in many cases pushing them out. Reverse mortgages, which allow homeowners 62 or older to borrowmoney against the value of their homes and not pay it back until they move out or die, have long been said with problems. Now, federal and state regulators are documenting new instances of abuse as smaller mortgage brokers, including former sub-prime lenders, flood the market after the recent exit of big banks and as defaults on the loans hit record highs. Some lenders are aggressively recommending loans to seniors who cannot afford the fees associated with them, without mentioning the property taxes and maintenance. Others are wooingseniors with promises that the loans are free money that can be used to finance their long-desiredthings, without clearly explaining the risks. Some widows were pressured not to have their names on the contract, without being told that they could be left facing foreclosure after their husbands died.Now, as the vast baby boomer generation is entering retirement and more seniors struggle with declining savings, the newly established Consumer Financial Protection Bureau is working on new rules that could mean better disclosure for consumers and stricter supervision of lenders. More than 775,000 of such loans are outstanding, according to the federal government. Concerns about the multi-billion dollar reverse mortgages market echo those raised in the lead-up to the financial crisis when consumers were marketed loans—often carrying hidden risks —that they could not afford. “There are many of the same red flags, including explosive growthand the fact that these loans are often advertised aggressively without regarded to suitability,”sadLori Swanson, the Minnesota attorney general, who is working on reforming the reverse mortgage market.","options":{"A":"Some lenders are unwilling to lend money to seniors.","B":"The borrowers cannot pay back the money as expected.","C":"Federal and state regulators are documenting the objection.","D":"Some lenders go bankrupt."},"answer":"B","analysis":"本题属于细节理解题。题目意为：关于反向抵押贷款的问题正确的说法是？A项，一些贷款机构不愿意把钱借给老年人，与文章第二段第一句话Some lenders are aggressively recommending loans to seniors who cannot afford the fees associated with them, without mentioning the property taxes and maintenance.不符，排除；B 项，“借款人无法如预期中归还款项”；C 项，“联邦和州监管部门正在制定反对意见”；D 项，“一些放款人破产了”。根据题目中关键词发现，本题与第一题主题句相同，可以看出反向抵押贷款的最大问题是借款方老年人无法按时还款，因此可能损失自己的房产。故选B 项。"},{"id":108,"section":"eng","type":"single","stem":"The phrase “facing foreclosure” most probably implies________.","passage":"The very loans that are supposed to help seniors stay in their homes are in many cases pushing them out. Reverse mortgages, which allow homeowners 62 or older to borrowmoney against the value of their homes and not pay it back until they move out or die, have long been said with problems. Now, federal and state regulators are documenting new instances of abuse as smaller mortgage brokers, including former sub-prime lenders, flood the market after the recent exit of big banks and as defaults on the loans hit record highs. Some lenders are aggressively recommending loans to seniors who cannot afford the fees associated with them, without mentioning the property taxes and maintenance. Others are wooingseniors with promises that the loans are free money that can be used to finance their long-desiredthings, without clearly explaining the risks. Some widows were pressured not to have their names on the contract, without being told that they could be left facing foreclosure after their husbands died.Now, as the vast baby boomer generation is entering retirement and more seniors struggle with declining savings, the newly established Consumer Financial Protection Bureau is working on new rules that could mean better disclosure for consumers and stricter supervision of lenders. More than 775,000 of such loans are outstanding, according to the federal government. Concerns about the multi-billion dollar reverse mortgages market echo those raised in the lead-up to the financial crisis when consumers were marketed loans—often carrying hidden risks —that they could not afford. “There are many of the same red flags, including explosive growthand the fact that these loans are often advertised aggressively without regarded to suitability,”sadLori Swanson, the Minnesota attorney general, who is working on reforming the reverse mortgage market.","options":{"A":"the widows are pressured to lose their own names","B":"the widows may be forced to leave their homes","C":"the widows have misunderstood the reverse mortgage","D":"the widows do not know what their long-desired things are"},"answer":"B","analysis":"本题属于语义题。题目意为：短语‘facing foreclosure’（面临丧失抵押品赎回权）最可能暗示 ________ 。定位文章可知，该短语出现在文章第二段最后一句话：Some widows were pressured not to have their names on the contract, without being told that they couldbe left facing foreclosure after their husbands died.A 项，“寡妇被强迫舍弃自己本来的名字”；B 项，“寡妇可能被强迫离开自己的家”；C 项，“寡妇误解了反向抵押贷款”；D 项，“寡妇不知道自己长久以来渴望得到的东西是什么”。根据本题主题句可知，在签署反向抵押贷款合同时，一些寡妇没有在合同上签字，因此在丈夫去世后，她们可能会丧失自己的房产。故选 B 项。"},{"id":109,"section":"eng","type":"single","stem":"Which is true about the new rules from Consumer Financial Protection Bureau?","passage":"The very loans that are supposed to help seniors stay in their homes are in many cases pushing them out. Reverse mortgages, which allow homeowners 62 or older to borrowmoney against the value of their homes and not pay it back until they move out or die, have long been said with problems. Now, federal and state regulators are documenting new instances of abuse as smaller mortgage brokers, including former sub-prime lenders, flood the market after the recent exit of big banks and as defaults on the loans hit record highs. Some lenders are aggressively recommending loans to seniors who cannot afford the fees associated with them, without mentioning the property taxes and maintenance. Others are wooingseniors with promises that the loans are free money that can be used to finance their long-desiredthings, without clearly explaining the risks. Some widows were pressured not to have their names on the contract, without being told that they could be left facing foreclosure after their husbands died.Now, as the vast baby boomer generation is entering retirement and more seniors struggle with declining savings, the newly established Consumer Financial Protection Bureau is working on new rules that could mean better disclosure for consumers and stricter supervision of lenders. More than 775,000 of such loans are outstanding, according to the federal government. Concerns about the multi-billion dollar reverse mortgages market echo those raised in the lead-up to the financial crisis when consumers were marketed loans—often carrying hidden risks —that they could not afford. “There are many of the same red flags, including explosive growthand the fact that these loans are often advertised aggressively without regarded to suitability,”sadLori Swanson, the Minnesota attorney general, who is working on reforming the reverse mortgage market.","options":{"A":"The rules are good for lenders while bad for borrowers.","B":"The rules will help baby boomer seniors to save money.","C":"The rules will help consumers better understand reverse mortgage.","D":"The rules will be stricter for consumers."},"answer":"C","analysis":"本题属于细节推断题。题目意为：下列关于消费者金融保护局的新规，哪一项是正确的？由题干中的 Consumer Financial Protection Bureau 定位本题主题句：Now, as the vast baby boomer generation is entering retirement and more seniors struggle with decliningsavings, the newly established Consumer Financial Protection Bureau is working on newrules that could mean better disclosure for consumers and stricter supervision of lenders.可知：随着大量婴儿潮时代出生的人步入退休阶段，更多的老年人正在努力解决积蓄减少这一困境，新成立的消费者金融保护局开始着手制定新的政策，这一举措可能意味着消费者会拥有更好的知情权，借贷方面面临更为严格的监管。A 项，“新规对放款人有利，对借款人有害”；B 项，“新规能帮助婴儿潮时代出生的老年人省钱”；C 项，“新规能帮助消费者更好地理解反向抵押贷款”；D 项，“新规将对消费者更加严格”。故选 C 项。"},{"id":110,"section":"eng","type":"single","stem":"The “red flags” of reverse mortgage don’t include________.","passage":"The very loans that are supposed to help seniors stay in their homes are in many cases pushing them out. Reverse mortgages, which allow homeowners 62 or older to borrowmoney against the value of their homes and not pay it back until they move out or die, have long been said with problems. Now, federal and state regulators are documenting new instances of abuse as smaller mortgage brokers, including former sub-prime lenders, flood the market after the recent exit of big banks and as defaults on the loans hit record highs. Some lenders are aggressively recommending loans to seniors who cannot afford the fees associated with them, without mentioning the property taxes and maintenance. Others are wooingseniors with promises that the loans are free money that can be used to finance their long-desiredthings, without clearly explaining the risks. Some widows were pressured not to have their names on the contract, without being told that they could be left facing foreclosure after their husbands died.Now, as the vast baby boomer generation is entering retirement and more seniors struggle with declining savings, the newly established Consumer Financial Protection Bureau is working on new rules that could mean better disclosure for consumers and stricter supervision of lenders. More than 775,000 of such loans are outstanding, according to the federal government. Concerns about the multi-billion dollar reverse mortgages market echo those raised in the lead-up to the financial crisis when consumers were marketed loans—often carrying hidden risks —that they could not afford. “There are many of the same red flags, including explosive growthand the fact that these loans are often advertised aggressively without regarded to suitability,”sadLori Swanson, the Minnesota attorney general, who is working on reforming the reverse mortgage market.","options":{"A":"explosive growth","B":"the reform of reverse mortgage market","C":"little consideration to suitability","D":"aggressive and improper marketing"},"answer":"B","analysis":"本题属于猜测词义题。题目意为：反向抵押贷款的‘危险信号’不包括________ 。red flags 不仅可以表示红旗，还可以指危险信号，由上下文可知，此处即为“危险信号”。根据主题句：There are many of the same red flags, including explosive growth and the fact that these loans are often advertised aggressively without regarded to suitability.可知，危险信号包括：explosive growth, advertised aggressively without regarded to suitability，他们涉及到：爆炸性增长、很少考虑适合性及积极不当的营销，B 项，反向抵押市场改革是Lori Swanson目前的工作内容，不包括在危险信号里。故选 B 项。 （三）"},{"id":111,"section":"eng","type":"single","stem":"In the restaurant story, the author may most probably think the waiter or waitress was________.","passage":"Imagine you went to a restaurant with your girlfriend, had a burger, paid with a credit card, and left. The next time you go there, the waiter or waitress, armed with your profile data, greets you with, “Hey Joe, how are you? Mary is over there in the seat you sat last time. Would you like to join her for dinner again?” Then you find out that your burger has been cooked and placed onthe table. Forget the fact that you are with another date and are on a diet that doesn’t include burgers. Sound a little bizarre? To some, this is the restaurant equivalent of the Internet. The Net’s ability to profile you through your visits to and interactions at websites provides marketers with anenormous amount of data on you—some of which you may not want them to have. Are you aware that almost every time you access a website you get a “cookie”? Unfortunately, it’s not the Mrs. Field’s recipe. A cookie on the Internet is a computer code sent bythe site to your computer—usually without your knowledge. During the entire period of time that you are at the site, the cookie is collecting information about yourself, including where you visit, how long you stay there, and how frequently you return to certain pages. While this may sound scary enough, cookies aren’t even the latest in technology. Anewsystem called I-librarian Alexa—named after the legendary third century B.C.library in Alexandria, Egypt—does even more. While cookies track what you are doing at one site. Alexa collects data on all your web activities, such as which site you visit next, how long you stay there, whether youclick on advertisements, etc. All this information is available to marketers, who use it to market more effectively to you. Not only do you not get paid for providing the information, you probablydon’t even know that you are giving it.","options":{"A":"stupid","B":"polite","C":"considerate","D":"annoying"},"answer":"D","analysis":"本题属于语义推断题。题目意为：在餐馆的故事中，作者最有可能认为服务生________。A 项“愚蠢的”；B 项“礼貌的”；C 项“考虑周到的”；D 项“讨厌的”。根据主题句： Forget the fact that you are with another date and are on a diet that doesn’t include burgers.可知，服务生不考虑顾客的需求，擅自为其安排不合适的约会对象和餐点，顾客会感到餐厅服务员的做法令人讨厌。故选 D 项。"},{"id":112,"section":"eng","type":"single","stem":"The author makes up the restaurant story in order to________ .","passage":"Imagine you went to a restaurant with your girlfriend, had a burger, paid with a credit card, and left. The next time you go there, the waiter or waitress, armed with your profile data, greets you with, “Hey Joe, how are you? Mary is over there in the seat you sat last time. Would you like to join her for dinner again?” Then you find out that your burger has been cooked and placed onthe table. Forget the fact that you are with another date and are on a diet that doesn’t include burgers. Sound a little bizarre? To some, this is the restaurant equivalent of the Internet. The Net’s ability to profile you through your visits to and interactions at websites provides marketers with anenormous amount of data on you—some of which you may not want them to have. Are you aware that almost every time you access a website you get a “cookie”? Unfortunately, it’s not the Mrs. Field’s recipe. A cookie on the Internet is a computer code sent bythe site to your computer—usually without your knowledge. During the entire period of time that you are at the site, the cookie is collecting information about yourself, including where you visit, how long you stay there, and how frequently you return to certain pages. While this may sound scary enough, cookies aren’t even the latest in technology. Anewsystem called I-librarian Alexa—named after the legendary third century B.C.library in Alexandria, Egypt—does even more. While cookies track what you are doing at one site. Alexa collects data on
