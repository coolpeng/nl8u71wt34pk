e implants to access electronically-controlled doors, or monitor how typing speed correlates with heart rate. Implanted chips may seem extreme, but it is a relatively small step from ID cards and biometrics to such devices. As long as such schemes are voluntary, there will probably be a growing number of convenience-oriented uses so that a substantial number of workers would opt to have a chip inserted. But if implanted chips are used to reduce slack time or rest breaks, that could prove to be detrimental. And if surveillance tools take away autonomy, that’s when they prove most unpopular. A lot depends on how such monitoring initiatives are communicated and this could prevent possible revolts being staged. If bosses don’t communicate effectively, employees assume the worst. But if they’re open about the information they’re collecting and what they’re doing with it, research suggests 46% of employees are generally okay with it. Although many such monitoring schemes use anonymised data and participation is voluntary, many staffers remain skeptical and fear an erosion of their civil liberties. So workplace surveillance could be empowering for staff and useful for companies looking to become more efficient and profitable. But implemented in the wrong way, it could also become an unpopular tool of oppression that proves counterproductive.","options":{"A":"How frequently employees are to be monitored.","B":"What specific personal information is being excluded.","C":"What steps are taken to minimize their detrimental impact.","D":"How well bosses make known their purpose of monitoring."},"answer":"D","analysis":"细节理解题。本题考查影响监控效果的核心变量。由题干中的 monitoring initiatives 定位到第五段最后一句。文中第五段最后一句指出，监控举措要想有积极效果，很大程度上取决于如何传达此类监控措施。第六段第一、二句提到，如果老板不能与员工进行有效沟通，员工会把事情想得很糟糕。但是，如果他们对正在收集的信息以及对这些信息的处理持开放态度，研究表明，46% 的员工通常都是能接受的。原文强调“沟通方式”（how initiatives are communicated）决定效果。选项 A（频率）、B（排除信息）、C（减少负面影响）均未提及。因此答案是 D。"},{"id":115,"section":"eng","type":"single","stem":"What concern do monitoring initiatives cause among many staffers?","passage":"Many oppose workplace surveillance, because of the inherent dechumanizing effect it has and the relentless pressure it brings. But it’s on the rise around the world as firms look to become more efficient by squeezing more productivity from their workers. More than half of companies with over $750 million in annual revenue used“non-traditional”monitoring techniques on staff last year. Monitoring employee performance gives firms the ability to assess how their staff are performing and interacting, which can be good for both the firm and employees themselves. A growing number of analytics companies offer this service. They gather“data exhaust”left by employees’email and instant messaging apps, and use name badges equipped with radio-frequency identification devices and microphones. These can check how much time you spend talking, your volume and tone of voice, even if you do not dominate conversations. While this may sound intrusive, exponents argue that it can also protect employees against bullying and sexual harassment. Some of this data analysis can produce unexpected results. For example, it was found that people who sat at 12-person lunch tables tended to interact, share ideas more and outperform those who regularly sat at four-person tables, a fact that would probably have gone undetected without such data analysis. Over the last few years a Stockholm co-working space called Epicenter has gone much further and holds popular“chipping parties”, where people can have microchips implanted in their hands. They can use the implants to access electronically-controlled doors, or monitor how typing speed correlates with heart rate. Implanted chips may seem extreme, but it is a relatively small step from ID cards and biometrics to such devices. As long as such schemes are voluntary, there will probably be a growing number of convenience-oriented uses so that a substantial number of workers would opt to have a chip inserted. But if implanted chips are used to reduce slack time or rest breaks, that could prove to be detrimental. And if surveillance tools take away autonomy, that’s when they prove most unpopular. A lot depends on how such monitoring initiatives are communicated and this could prevent possible revolts being staged. If bosses don’t communicate effectively, employees assume the worst. But if they’re open about the information they’re collecting and what they’re doing with it, research suggests 46% of employees are generally okay with it. Although many such monitoring schemes use anonymised data and participation is voluntary, many staffers remain skeptical and fear an erosion of their civil liberties. So workplace surveillance could be empowering for staff and useful for companies looking to become more efficient and profitable. But implemented in the wrong way, it could also become an unpopular tool of oppression that proves counterproductive.","options":{"A":"They may empower employers excessively.","B":"They may erode the workplace environment.","C":"They may infringe upon staffers' entitled freedom.","D":"They may become counterproductive in the long run. （四） “Progress in AI is something that will take a while to happen, but that doesn’t make it science fiction,”said Stuart Russell, the University of California computing professor, and co-author of the top AI textbook. The science of AI is a human enterprise that requires social limitations. The risks, however are not being properly weighed. There are two emerging approaches to AI. The first is to view it engineering terms, where algorithms（算法）are trained on specific tasks. The second presents deep philosophical questions about the nature of human knowledge. The former is very much pushed by Silicon Valley, where AI is deployed to get products quickly to market and problems dealt with later. This has led to AI“succeeding”even when the goals aren't socially acceptable and they are pursued with little accountability. The pitfalls of this approach are highlighted by the role YouTube's algorithm plays in radicalizing people, given that there is no public understanding of how it works. Prof. Russell argues, reasonably, for a system of checks where machines can pause and“ask”for human guidance, and for regulations to deal with systemic biases. The academic also backs global adoption of EU legislation that would ban impersonation of humans by machines. Computers are getting closer to passing, in a superficial way, the Turing test — where machines attempt to trick people into believing they are communicating with other humans. Yet human knowledge is collective: to truly fool humans a computer would have to be able to grasp mutual understandings. OpenAI’s GPT-3, probably the best non-human writer ever, cannot comprehend what it spews. When Oxford scientists put it—and similar AIs—to the test this year, they found the machines produced false answers to questions that “mimic popular misconceptions and have the potential to deceive”. It so troubled one of OpenAI’s own researchers that no one knew how such language is being made that he left to set up an AI safety lab. Some argue that AI can already produce new insights that humans have missed. But human intelligence is much more than an algorithm. Inspiration strikes when a brilliant thought arises that can’t be explained as a logical consequence of preceding steps. Einstein’s theory of general relativity cannot be derived from observations of that age—it was experimentally proven only decades later. Human beings can also learn a new task by being shown how to do it only a few times. Machines, so far, cannot. Currently, AI can be prompted—but not prompt itself—into action. Humans are stumbling into an era when the more powerful the AI system, the harder it is to explain its actions. How can we tell if a machine is acting on our behalf and not acting contrary to our interests? Such questions ought to give us all pause for thought."},"answer":"C","analysis":"细节理解与推断题。本题考查员工的主要顾虑。由题干中的 staffers 定位到第六段最后一句。第六段最后一句提到尽管许多此类监控计划使用匿名数据，而且是自愿参与的，许多员工仍然持怀疑态度，担心他们的公民自由会受到侵害，由此可见员工担忧监控举措会侵犯他们应有的自由，文中的 liberties 对应 C 项中的 freedom，故选 C 项。选项 D是实施不当的后果，非员工直接担忧。选项 A 和 B 原文未提及。因此答案是 C。"},{"id":116,"section":"eng","type":"single","stem":"According to Paragraph 1 and Paragraph 2, Stuart Russell ______.","passage":"“Progress in AI is something that will take a while to happen, but that doesn’t make it science fiction,”said Stuart Russell, the University of California computing professor, and co-author of the top AI textbook. The science of AI is a human enterprise that requires social limitations. The risks, however are not being properly weighed. There are two emerging approaches to AI. The first is to view it engineering terms, where algorithms（算法）are trained on specific tasks. The second presents deep philosophical questions about the nature of human knowledge. The former is very much pushed by Silicon Valley, where AI is deployed to get products quickly to market and problems dealt with later. This has led to AI“succeeding”even when the goals aren't socially acceptable and they are pursued with little accountability. The pitfalls of this approach are highlighted by the role YouTube's algorithm plays in radicalizing people, given that there is no public understanding of how it works. Prof. Russell argues, reasonably, for a system of checks where machines can pause and“ask”for human guidance, and for regulations to deal with systemic biases. The academic also backs global adoption of EU legislation that would ban impersonation of humans by machines. Computers are getting closer to passing, in a superficial way, the Turing test — where machines attempt to trick people into believing they are communicating with other humans. Yet human knowledge is collective: to truly fool humans a computer would have to be able to grasp mutual understandings. OpenAI’s GPT-3, probably the best non-human writer ever, cannot comprehend what it spews. When Oxford scientists put it—and similar AIs—to the test this year, they found the machines produced false answers to questions that “mimic popular misconceptions and have the potential to deceive”. It so troubled one of OpenAI’s own researchers that no one knew how such language is being made that he left to set up an AI safety lab. Some argue that AI can already produce new insights that humans have missed. But human intelligence is much more than an algorithm. Inspiration strikes when a brilliant thought arises that can’t be explained as a logical consequence of preceding steps. Einstein’s theory of general relativity cannot be derived from observations of that age—it was experimentally proven only decades later. Human beings can also learn a new task by being shown how to do it only a few times. Machines, so far, cannot. Currently, AI can be prompted—but not prompt itself—into action. Humans are stumbling into an era when the more powerful the AI system, the harder it is to explain its actions. How can we tell if a machine is acting on our behalf and not acting contrary to our interests? Such questions ought to give us all pause for thought.","options":{"A":"suggested social control on AI","B":"denied the imminence of AI progress","C":"praised AI science for its great success","D":"had a low opinion of AI for its potential risks"},"answer":"A","analysis":"细节理解题。本题考查对人物观点的精准定位。A 建议对 AI 进行社会控制，B 否认 AI 进步的紧迫性，C 赞扬 AI 科学的巨大成功，D 因潜在风险而对 AI 评价低。第一段明确提到 Russell 认为 AI 科学需要“social limitations”，第二段进一步主张建立 “system of checks”和法规（“regulations”）来处理系统性偏见。所以 A 选项正确，他建议社会控制。选项 B（否认 AI进步的紧迫性）错误。Russell仅强调 AI进步需要时间，但未否认其紧迫性（第一段提到“doesn't make it science fiction”）。选项 C（赞扬 AI 科学的成功）错误。原文未提及对 AI 成功的赞扬，反而指出其风险未被合理评估。选项 D（因潜在风险而对 AI 评价低）不准确。Russell 并非否定 AI 本身，而是强调需通过社会控制管理风险。因此答案是 A。"},{"id":117,"section":"eng","type":"single","stem":"The approach of viewing AI in engineering terms has ______.","passage":"“Progress in AI is something that will take a while to happen, but that doesn’t make it science fiction,”said Stuart Russell, the University of California computing professor, and co-author of the top AI textbook. The science of AI is a human enterprise that requires social limitations. The risks, however are not being properly weighed. There are two emerging approaches to AI. The first is to view it engineering terms, where algorithms（算法）are trained on specific tasks. The second presents deep philosophical questions about the nature of human knowledge. The former is very much pushed by Silicon Valley, where AI is deployed to get products quickly to market and problems dealt with later. This has led to AI“succeeding”even when the goals aren't socially acceptable and they are pursued with little accountability. The pitfalls of this approach are highlighted by the role YouTube's algorithm plays in radicalizing people, given that there is no public understanding of how it works. Prof. Russell argues, reasonably, for a system of checks where machines can pause and“ask”for human guidance, and for regulations to deal with systemic biases. The academic also backs global adoption of EU legislation that would ban impersonation of humans by machines. Computers are getting closer to passing, in a superficial way, the Turing test — where machines attempt to trick people into believing they are communicating with other humans. Yet human knowledge is collective: to truly fool humans a computer would have to be able to grasp mutual understandings. OpenAI’s GPT-3, probably the best non-human writer ever, cannot comprehend what it spews. When Oxford scientists put it—and similar AIs—to the test this year, they found the machines produced false answers to questions that “mimic popular misconceptions and have the potential to deceive”. It so troubled one of OpenAI’s own researchers that no one knew how such language is being made that he left to set up an AI safety lab. Some argue that AI can already produce new insights that humans have missed. But human intelligence is much more than an algorithm. Inspiration strikes when a brilliant thought arises that can’t be explained as a logical consequence of preceding steps. Einstein’s theory of general relativity cannot be derived from observations of that age—it was experimentally proven only decades later. Human beings can also learn a new task by being shown how to do it only a few times. Machines, so far, cannot. Currently, AI can be prompted—but not prompt itself—into action. Humans are stumbling into an era when the more powerful the AI system, the harder it is to explain its actions. How can we tell if a machine is acting on our behalf and not acting contrary to our interests? Such questions ought to give us all pause for thought.","options":{"A":"questioned the nature of human knowledge","B":"contributed to socially irresponsible algorithms","C":"prevented the algorithmic radicalization","D":"sped up the market entry of quality products"},"answer":"B","analysis":"细节理解题。本题考查因果关系与细节匹配。选项 B（导致社会责任缺失的算法）正确。第二段指出硅谷推动的工程方法导致 AI 在目标不被社会接受时仍被推进，且缺乏问责（如 YouTube 算法引发激进化）。选项 A（质疑人类知识的本质）错误。这属于第二种方法（哲学方法）的特点，与工程方法无关。选项 C（防止算法激进化）错误。原文明确提到工程方法导致了算法激进化（“highlighted by the role YouTube's algorithm plays in radicalizing people”）。选项 D（加速优质产品上市）错误。原文仅提到“quickly to market”，未提及“quality products”。因此答案是 B。"},{"id":118,"section":"eng","type":"single","stem":"According to Prof. Russell, machines ______.","passage":"“Progress in AI is something that will take a while to happen, but that doesn’t make it science fiction,”said Stuart Russell, the University of California computing professor, and co-author of the top AI textbook. The science of AI is a human enterprise that requires social limitations. The risks, however are not being properly weighed. There are two emerging approaches to AI. The first is to view it engineering terms, where algorithms（算法）are trained on specific tasks. The second presents deep philosophical questions about the nature of human knowledge. The former is very much pushed by Silicon Valley, where AI is deployed to get products quickly to market and problems dealt with later. This has led to AI“succeeding”even when the goals aren't socially acceptable and they are pursued with little accountability. The pitfalls of this approach are highlighted by the role YouTube's algorithm plays in radicalizing people, given that there is no public understanding of how it works. Prof. Russell argues, reasonably, for a system of checks where machines can pause and“ask”for human guidance, and for regulations to deal with systemic biases. The academic also backs global adoption of EU legislation that would ban impersonation of humans by machines. Computers are getting closer to passing, in a superficial way, the Turing test — where machines attempt to trick people into believing they are communicating with other humans. Yet human knowledge is collective: to truly fool humans a computer would have to be able to grasp mutual understandings. OpenAI’s GPT-3, probably the best non-human writer ever, cannot comprehend what it spews. When Oxford scientists put it—and similar AIs—to the test this year, they found the machines produced false answers to questions that “mimic popular misconceptions and have the potential to deceive”. It so troubled one of OpenAI’s own researchers that no one knew how such language is being made that he left to set up an AI safety lab. Some argue that AI can already produce new insights that humans have missed. But human intelligence is much more than an algorithm. Inspiration strikes when a brilliant thought arises that can’t be explained as a logical consequence of preceding steps. Einstein’s theory of general relativity cannot be derived from observations of that age—it was experimentally proven only decades later. Human beings can also learn a new task by being shown how to do it only a few times. Machines, so far, cannot. Currently, AI can be prompted—but not prompt itself—into action. Humans are stumbling into an era when the more powerful the AI system, the harder it is to explain its actions. How can we tell if a machine is acting on our behalf and not acting contrary to our interests? Such questions ought to give us all pause for thought.","options":{"A":"should be banned from pretending to be humans","B":"are especially helpful to counter social biases","C":"might get uniformly regulated at a global scale","D":"are not supposed to be supervised by humans"},"answer":"A","analysis":"细节理解题。本题考查人物观点与具体建议。选项 A（应禁止冒充人类）正确。第三段明确提到 Russell 支持欧盟立法禁止机器冒充人类（“ban impersonation of humans by machines”）。选项 B（特别有助于消除社会偏见）错误。原文仅提到法规需处理系统性偏见，未说明机器本身的作用。选项 C（可能在全球范围内统一监管）不准确。Russell 支持“global adoption of EU legislation”，但未提及“uniformly regulated”。选项 D（不应由人类监督）错误。Russell 主张机器需“ask for human guidance”，说明需要人类监督。因此答案是 A。"},{"id":119,"section":"eng","type":"single","stem":"What does the author say about OpenAI’s GPT-3?","passage":"“Progress in AI is something that will take a while to happen, but that doesn’t make it science fiction,”said Stuart Russell, the University of California computing professor, and co-author of the top AI textbook. The science of AI is a human enterprise that requires social limitations. The risks, however are not being properly weighed. There are two emerging approaches to AI. The first is to view it engineering terms, where algorithms（算法）are trained on specific tasks. The second presents deep philosophical questions about the nature of human knowledge. The former is very much pushed by Silicon Valley, where AI is deployed to get products quickly to market and problems dealt with later. This has led to AI“succeeding”even when the goals aren't socially acceptable and they are pursued with little accountability. The pitfalls of this approach are highlighted by the role YouTube's algorithm plays in radicalizing people, given that there is no public understanding of how it works. Prof. Russell argues, reasonably, for a system of checks where machines can pause and“ask”for human guidance, and for regulations to deal with systemic biases. The academic also backs global adoption of EU legislation that would ban impersonation of humans by machines. Computers are getting closer to passing, in a superficial way, the Turing test — where machines attempt to trick people into believing they are communicating with other humans. Yet human knowledge is collective: to truly fool humans a computer would have to be able to grasp mutual understandings. OpenAI’s GPT-3, probably the best non-human writer ever, cannot comprehend what it spews. When Oxford scientists put it—and similar AIs—to the test this year, they found the machines produced false answers to questions that “mimic popular misconceptions and have the potential to deceive”. It so troubled one of OpenAI’s own researchers that no one knew how such language is being made that he left to set up an AI safety lab. Some argue that AI can already produce new insights that humans have missed. But human intelligence is much more than an algorithm. Inspiration strikes when a brilliant thought arises that can’t be explained as a logical consequence of preceding steps. Einstein’s theory of general relativity cannot be derived from observations of that age—it was experimentally proven only decades later. Human beings can also learn a new task by being shown how to do it only a few times. Machines, so far, cannot. Currently, AI can be prompted—but not prompt itself—into action. Humans are stumbling into an era when the more powerful the AI system, the harder it is to explain its actions. How can we tell if a machine is acting on our behalf and not acting contrary to our interests? Such questions ought to give us all pause for thought.","options":{"A":"Its language is impossible to understand.","B":"It is non-human but can truly fool humans.","C":"Its programming is based on misconceptions.","D":"It is intelligent but cannot comprehend words."},"answer":"D","analysis":"细节理解题。本题考查具体信息的同义替换。选项 D（智能但无法理解语言）正确。第三段指出 GPT-3“cannot comprehend what it spews”，且测试中生成错误答案，模仿误解。选项 A（其语言无法理解）错误。原文强调 GPT-3 自身无法理解生成内容，而非人类无法理解其语言。选项 B（能真正愚弄人类）错误。原文提到 GPT-3只是“superficially”接近图灵测试，实际无法理解“mutual understandings”。选项 C（编程基于误解）错误。GPT-3 生成的内容模仿误解，但编程基础并非基于误解。因此答案是 D。"},{"id":120,"section":"eng","type":"single","stem":"Einstein’s theory of general relativity is mentioned to show that ______.","passage":"“Progress in AI is something that will take a while to happen, but that doesn’t make it science fiction,”said Stuart Russell, the University of California computing professor, and co-author of the top AI textbook. The science of AI is a human enterprise that requires social limitations. The risks, however are not being properly weighed. There are two emerging approaches to AI. The first is to view it engineering terms, where algorithms（算法）are trained on specific tasks. The second presents deep philosophical questions about the nature of human knowledge. The former is very much pushed by Silicon Valley, where AI is deployed to get products quickly to market and problems dealt with later. This has led to AI“succeeding”even when the goals aren't socially acceptable and they are pursued with little accountability. The pitfalls of this approach are highlighted by the role YouTube's algorithm plays in radicalizing people, given that there is no public understanding of how it works. Prof. Russell argues, reasonably, for a system of checks where machines can pause and“ask”for human guidance, and for regulations to deal with systemic biases. The academic also backs global adoption of EU legislation that would ban impersonation of humans by machines. Computers are getting closer to passing, in a superficial way, the Turing test — where machines attempt to trick people into believing they are communicating with other humans. Yet human knowledge is collective: to truly fool humans a computer would have to be able to grasp mutual understandings. OpenAI’s GPT-3, probably the best non-human writer ever, cannot comprehend what it spews. When Oxford scientists put it—and similar AIs—to the test this year, they found the machines produced false answers to questions that “mimic popular misconceptions and have the potential to deceive”. It so troubled one of OpenAI’s own researchers that no one knew how such language is being made that he left to set up an AI safety lab. Some argue that AI can already produce new insights that humans have missed. But human intelligence is much more than an algorithm. Inspiration strikes when a brilliant thought arises that can’t be explained as a logical consequence of preceding steps. Einstein’s theory of general relativity cannot be derived from observations of that age—it was experimentally proven only decades later. Human beings can also learn a new task by being shown how to do it only a few times. Machines, so far, cannot. Currently, AI can be prompted—but not prompt itself—into action. Humans are stumbling into an era when the more powerful the AI system, the harder it is to explain its actions. How can we tell if a machine is acting on our behalf and not acting contrary to our interests? Such questions ought to give us all pause for thought.","options":{"A":"AI-produced insights can be complementary to human thoughts","B":"machines are comparable to humans in terms of logical thinking","C":"human intelligence can hardly be translated into an algorithm","D":"brilliant scientific ideas always come way ahead of their time"},"answer":"C","analysis":"细节理解题。本题考查例子与论点的关系。选项 C（人类智能难以转化为算法）正确。最后一段用爱因斯坦的理论说明人类智能能产生无法通过逻辑推导的灵感，而 AI依赖算法，无法做到这一点。选项 A（AI 见解可补充人类思想）错误。例子强调人类智能的独特性，而非 AI 的补充作用。选项 B（机器在逻辑思维上与人类相当）错误。例子反驳了这一观点，强调人类智能的不可替代性。选项 D（科学思想常超前于时代）偏离主题。例子重点在于人类智能的非算法性，而非时间先后。因此答案是 C。"}]}}</script>
<script>
(function(){
"use strict";
const ALL_EXAMS = JSON.parse(document.getElementById('allExamsData').textContent);
let currentYear = '2025';
let DATA = ALL_EXAMS[currentYear];
let QS = DATA.questions, BYID = {}; QS.forEach(q=>BYID[q.id]=q);
let SECS = DATA.sections, KEY = 'jgj_' + currentYear + '_quiz_v1';

window.switchExamYear = function(year){
  currentYear = year;
  DATA = ALL_EXAMS[currentYear];
  QS = DATA.questions;
  BYID = {};
  QS.forEach(q=>BYID[q.id]=q);
  SECS = DATA.sections;
  KEY = 'jgj_' + currentYear + '_quiz_v1';
  try { S = Object.assign(defaultState(), JSON.parse(localStorage.getItem(KEY)||'{}')); }
  catch(e){ S = defaultState(); }
  render();
  toast('已切换至 ' + year + ' 年真题卷');
};
const $ = id => document.getElementById(id);

function secOf(id){ return SECS.find(s=>id>=s.range[0] && id<=s.range[1]) || SECS[0]; }
function passageOf(id){
  if(id<101) return '';
  const anchor = 101 + Math.floor((id-101)/5)*5;
  return BYID[anchor] ? BYID[anchor].passage : '';
}
const defaultState = () => ({
  mode:'practice', answers:{}, judged:{}, wrong:[], flags:{}, current:1,
  submitted:false, startedAt:null, elapsed:0, onlyWrong:false, wrongSession:null, showReport:false
});
let S;
try{ S = Object.assign(defaultState(), JSON.parse(localStorage.getItem(KEY)||'{}')); }
catch(e){ S = defaultState(); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function eq(a,b){ const x=(a||[]).slice().sort().join(''), y=(b||[]).slice().sort().join(''); return x && x===y; }
function isRight(id){ return eq(S.answers[id], (BYID[id].answer||'').split('')); }
function answeredCount(){ return Object.keys(S.answers).filter(k=>(S.answers[k]||[]).length).length; }
function activeIds(){ return (S.onlyWrong && S.wrongSession) ? S.wrongSession.slice().sort((a,b)=>a-b) : QS.map(q=>q.id); }
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1800); }

/* ---------- timer ---------- */
let tick=null;
function elapsedSec(){
  if(!S.startedAt) return S.elapsed||0;
  return Math.floor((Date.now()-S.startedAt)/1000);
}
function fmt(s){ s=Math.max(0,s); const m=Math.floor(s/60), r=s%60; return String(m).padStart(2,'0')+':'+String(r).padStart(2,'0'); }
function updateTimer(){
  const el=$('timer');
  if(S.mode!=='exam' || S.submitted){ el.hidden=true; return; }
  el.hidden=false;
  const total=DATA.meta.minutes*60, left=total-elapsedSec();
  el.textContent='剩余 '+fmt(left);
  el.classList.toggle('urgent', left<=600);
  if(left<=0){ finishExam(true); }
}
function startTimer(){ if(tick) clearInterval(tick); tick=setInterval(updateTimer,1000); updateTimer(); }
function stopTimer(){ if(tick) clearInterval(tick); tick=null; }

/* ---------- render ---------- */
function renderTop(){
  $('mPractice').classList.toggle('on', S.mode==='practice' && !S.onlyWrong);
  $('mExam').classList.toggle('on', S.mode==='exam');
  $('mWrong').classList.toggle('on', S.onlyWrong);
  const ids=activeIds();
  const done=ids.filter(i=>(S.answers[i]||[]).length).length;
  $('doneCount').textContent=done;
  $('totalCount').textContent=ids.length;
  const judged=Object.keys(S.judged).filter(k=>S.judged[k]);
  const right=judged.filter(k=>isRight(+k)).length;
  $('accRate').textContent = judged.length ? Math.round(right/judged.length*100)+'%' : '—';
  $('progressbar').style.width = (done/ids.length*100).toFixed(1)+'%';
  $('btnSubmit').textContent = (S.mode==='exam' && !S.submitted) ? '交卷并查看成绩' : '查看成绩报告';
  updateTimer();
}
function renderSheet(){
  const box=$('sheet'); box.innerHTML='';
  for(const s of SECS){
    for(let i=s.range[0]; i<=s.range[1]; i++){
      const d=document.createElement('button');
      d.className='cell'; d.textContent=i; d.dataset.id=i;
      const ans=S.answers[i];
      if(ans && ans.length){
        if(S.submitted || S.judged[i]){ d.classList.add(isRight(i)?'right':'wrong'); }
        else { d.classList.add('done'); }
      }
      if(S.flags[i]) d.classList.add('flag');
      if(S.current===i) d.classList.add('cur');
      d.onclick=()=>goto(i);
      box.appendChild(d);
    }
  }
}
function renderReport(){
  let score=0, right=0;
  const parts=SECS.map(s=>{
    let sc=0, r=0;
    for(let i=s.range[0]; i<=s.range[1]; i++){ if(isRight(i)){ sc+=s.per; r++; } }
    score+=sc; right+=r;
    return {name:s.name, score:sc, max:(s.range[1]-s.range[0]+1)*s.per, right:r, total:s.range[1]-s.range[0]+1};
  });
  const wrongs=QS.filter(q=>!isRight(q.id)).map(q=>q.id);
  $('rScore').innerHTML = score.toFixed(1).replace(/\.0$/,'') + '<small> / 100 分</small>';
  $('rInfo').innerHTML = '答对 <b>'+right+'</b> / 120 题 · 正确率 <b>'+Math.round(right/120*100)+'%</b><br>'
    + '用时 <b>'+fmt(S.elapsed||0)+'</b> · 未作答 <b>'+(120-answeredCount())+'</b> 题'
    + (S.mode==='exam' ? ' · 模拟考试' : ' · 练习模式');
  $('rGrid').innerHTML = parts.map(p=>
    '<div class="ritem"><div class="n">'+p.name+'</div><div class="v">'+p.score.toFixed(1).replace(/\.0$/,'')+'<small> / '+p.max+' 分</small></div>'
    +'<div class="n">答对 '+p.right+' / '+p.total+' 题</div></div>').join('');
  $('rWrong').innerHTML = wrongs.length
    ? wrongs.map(i=>'<button data-id="'+i+'">'+i+'</button>').join('')
    : '<span style="color:var(--ok);font-weight:700">全部答对，没有错题 🎉</span>';
  $('rWrong').querySelectorAll('button').forEach(b=>b.onclick=()=>{ S.showReport=false; save(); goto(+b.dataset.id); });
}
function renderQuestion(){
  const q=BYID[S.current], sec=secOf(q.id);
  const reveal = S.submitted || (S.mode==='practice' && S.judged[q.id]);
  $('qNum').textContent='第 '+q.id+' 题';
  $('qType').textContent = q.type==='multi'?'多选题':'单选题';
  $('qSection').textContent = sec.name.split(' · ')[0];
  $('qScore').textContent = sec.per+' 分';
  $('btnFlag').textContent = S.flags[q.id] ? '★ 已标记' : '☆ 标记';
  $('btnFlag').classList.toggle('on', !!S.flags[q.id]);

  const psg=passageOf(q.id), pb=$('passageBox');
  if(psg){ pb.hidden=false; $('passageText').textContent=psg; } else { pb.hidden=true; }
  $('qStem').textContent=q.stem;

  const chosen=S.answers[q.id]||[], correct=(q.answer||'').split('');
  const ob=$('qOptions'); ob.innerHTML='';
  ['A','B','C','D'].forEach(L=>{
    const btn=document.createElement('button');
    btn.className='opt'; btn.dataset.letter=L;
    const isSel=chosen.includes(L), isCor=correct.includes(L);
    if(reveal){
      if(isCor) btn.classList.add('correct');
      else if(isSel) btn.classList.add('incorrect');
      else btn.classList.add('dim');
    } else if(isSel) btn.classList.add('sel');
    btn.innerHTML='<span class="letter">'+L+'</span><span class="txt"></span>';
    btn.querySelector('.txt').textContent=q.options[L]||'';
    btn.onclick=()=>{ if(window.getSelection && window.getSelection().toString().trim()) return; pick(L); };
    ob.appendChild(btn);
  });

  const fb=$('feedback'), mini=$('fbmini');
  fb.className='feedback'; mini.className='fbmini';
  fb.innerHTML=''; mini.textContent='';
  if(reveal){
    const ok=isRight(q.id);
    fb.classList.add('show', ok?'ok':'no');
    const redo = (S.mode==='practice' && S.judged[q.id] && !S.submitted) ? '<button class="redobtn" id="btnRedo">↺ 重做本题</button>' : '';
    fb.innerHTML='<div class="fbhead"><span class="badge">'+(ok?'✓ 回答正确':'✕ 回答错误')+'</span><span>第 '+q.id+' 题</span>'+redo+'</div>'
      +'<div class="fbans">正确答案 <b>'+q.answer+'</b> · 你的答案 <b>'+(chosen.length?chosen.join(''):'未作答')+'</b></div>'
      +'<div class="fbtext"></div>';
    fb.querySelector('.fbtext').textContent=q.analysis||'（原卷未提供解析）';
    const rb=$('btnRedo');
    if(rb) rb.onclick=()=>{
      delete S.answers[q.id]; delete S.judged[q.id];
      S.wrong=S.wrong.filter(x=>x!==q.id);
      save(); renderQuestion();
    };
  } else if(S.mode==='exam'){
    mini.classList.add('show');
    mini.textContent = chosen.length ? '已作答：'+chosen.join('')+'　（考试模式下交卷后统一显示答案与解析）' : '考试模式：选择答案后点击「确认作答」，或直接从答题卡跳题。';
  } else if(q.type==='multi'){
    mini.classList.add('show'); mini.textContent='多选题：可选多个选项，选好后点「确认作答」（少选、多选、错选均不得分）。';
  }
  $('btnConfirm').textContent = reveal ? '下一题 →' : '确认作答';
  const ids=activeIds(), at=ids.indexOf(S.current);
  $('btnPrev').disabled = at<=0;
  $('btnNext').disabled = at>=ids.length-1;
  renderTop(); renderSheet();
}
function render(){
  $('report').classList.toggle('show', !!S.showReport);
  $('card').style.display = S.showReport ? 'none' : '';
  if(S.showReport) renderReport();
  renderQuestion();
  renderTop();
}

/* ---------- actions ---------- */
function recordWrong(id){
  if(!isRight(id) && !S.wrong.includes(id)) S.wrong.push(id);
  if(isRight(id)) S.wrong=S.wrong.filter(x=>x!==id);
}
function pick(L){
  const q=BYID[S.current];
  if(S.mode==='exam' && S.submitted) return;
  if(S.mode==='practice' && S.judged[S.current]) return;
  let a=(S.answers[S.current]||[]).slice();
  if(q.type==='single'){ a=[L]; }
  else { a = a.includes(L) ? a.filter(x=>x!==L) : a.concat(L).sort(); }
  S.answers[S.current]=a;
  if(q.type==='single' && S.mode==='practice'){
    S.judged[S.current]=true; recordWrong(S.current);
    save(); renderQuestion(); return;
  }
  if(q.type==='single' && S.mode==='exam'){
    save(); renderQuestion(); next(); return;
  }
  save(); renderQuestion();
}
function confirmAnswer(){
  if(S.submitted || (S.mode==='practice' && S.judged[S.current])){ next(); return; }
  const a=S.answers[S.current]||[];
  if(!a.length){ toast('还没选答案'); return; }
  if(S.mode==='practice'){
    S.judged[S.current]=true; recordWrong(S.current);
    save(); renderQuestion();
  } else {
    save(); renderQuestion(); next();
  }
}
function goto(id){ S.current=id; S.showReport=false; save(); render(); window.scrollTo({top:0,behavior:'smooth'}); }
function step(d){
  const ids=activeIds();
  const i=ids.indexOf(S.current);
  const t=ids[i+d];
  if(t===undefined){ toast(d>0?'已经是最后一题了':'已经是第一题了'); return; }
  goto(t);
}
function next(){ step(1); }
function prev(){ step(-1); }

function switchMode(mode){
  if(mode==='wrong'){
    if(!S.wrong.length){ toast('还没有错题，先做几道题吧'); return; }
    S.onlyWrong=true; S.mode='practice'; S.showReport=false;
    S.wrongSession=S.wrong.slice().sort((a,b)=>a-b);
    S.wrongSession.forEach(id=>{ delete S.answers[id]; delete S.judged[id]; });
    S.current=S.wrongSession[0];
    stopTimer();
  } else {
    S.onlyWrong=false; S.wrongSession=null; S.mode=mode; S.showReport=false;
    if(mode==='exam'){
      if(!S.startedAt && !S.submitted){ S.startedAt=Date.now(); }
      startTimer();
    } else { stopTimer(); }
  }
  save(); render();
  if(mode==='wrong') toast('共 '+S.wrongSession.length+' 道错题，答对后自动移出错题本');
  if(mode==='exam' && !S.submitted) toast('模拟考试开始：120 分钟倒计时，交卷后统一判分');
}
function finishExam(auto){
  if(S.mode!=='exam' || S.submitted) return;
  S.elapsed=elapsedSec(); S.startedAt=null; S.submitted=true; S.showReport=true;
  QS.forEach(q=>{ if(!isRight(q.id) && !S.wrong.includes(q.id)) S.wrong.push(q.id); });
  stopTimer(); save(); render();
  toast(auto?'考试时间到，已自动交卷':'已交卷，成绩报告已生成');
}
function resetAll(){
  if(!confirm('确定清空所有作答记录、错题本和计时吗？此操作不可撤销。')) return;
  stopTimer(); S=defaultState(); save(); render(); toast('已清空，可以重新开始');
}

/* ---------- events ---------- */
$('mPractice').onclick=()=>switchMode('practice');
$('mExam').onclick=()=>switchMode('exam');
$('mWrong').onclick=()=>switchMode('wrong');
$('btnSubmit').onclick=()=>{
  if(S.mode==='exam' && !S.submitted){ finishExam(false); }
  else { S.showReport=true; save(); render(); }
};
$('btnReset').onclick=resetAll;
$('btnReset2').onclick=resetAll;
$('btnFlag').onclick=()=>{ S.flags[S.current]=!S.flags[S.current]; save(); renderQuestion(); };
$('btnPrev').onclick=prev;
$('btnNext').onclick=next;
$('btnConfirm').onclick=()=>confirmAnswer();
$('rBack').onclick=()=>{ S.showReport=false; save(); render(); };
$('rRestart').onclick=resetAll;
$('btnToggle').onclick=()=>$('side').classList.toggle('collapsed');

/* ---- 一键复制本题（含题干/选项/答案/解析/阅读原文） ---- */
function copyCurrentQuestion(){
  const q=BYID[S.current]; if(!q) return;
  const yr=(String((DATA.meta&&DATA.meta.source)||'').match(/20\d{2}/)||[''])[0];
  const psg=passageOf(q.id), L=[];
  L.push((yr?yr+' 年 · ':'')+'第 '+q.id+' 题（'+(q.type==='multi'?'多选题':'单选题')+'）');
  if(psg) L.push('【阅读原文】\n'+psg);
  L.push('【题干】'+q.stem);
  ['A','B','C','D'].forEach(x=>L.push(x+'. '+(q.options[x]||'')));
  L.push('【答案】'+q.answer);
  L.push('【解析】'+q.analysis);
  const txt=L.join('\n');
  const done=()=>toast('已复制：题干 / 选项 / 答案 / 解析');
  const fail=()=>toast('自动复制失败，请长按文字手动复制');
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(txt).then(done).catch(()=>legacyCopyText(txt,done,fail));
  } else legacyCopyText(txt,done,fail);
}
function legacyCopyText(txt,done,fail){
  const ta=document.createElement('textarea');
  ta.value=txt; ta.setAttribute('readonly','');
  ta.style.cssText='position:fixed;top:0;left:0;opacity:0;pointer-events:none';
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,txt.length);
  let ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta); ok?done():fail();
}
$('btnCopy').onclick=copyCurrentQuestion;

document.addEventListener('keydown',e=>{
  if(e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if(e.metaKey||e.ctrlKey||e.altKey) return;  /* 不拦截系统快捷键：复制/全选/粘贴/撤销 */
  const k=e.key.toLowerCase();
  if('abcd'.includes(k) && k.length===1){ pick(k.toUpperCase()); e.preventDefault(); return; }
  if('1234'.includes(k) && k.length===1){ pick('ABCD'[+k-1]); e.preventDefault(); return; }
  if(k==='arrowright'){ next(); e.preventDefault(); }
  if(k==='arrowleft'){ prev(); e.preventDefault(); }
  if(k==='enter'){
    if(S.showReport){ S.showReport=false; save(); render(); }
    else if(S.submitted || (S.mode==='practice' && S.judged[S.current])) next();
    else confirmAnswer();
    e.preventDefault();
  }
});
function adapt(){
  const narrow=window.innerWidth<=960;
  $('btnToggle').style.display = narrow ? '' : 'none';
}
window.addEventListener('resize',adapt);
adapt();
if(S.mode==='exam' && !S.submitted && S.startedAt) startTimer();
render();
})();
</script>
