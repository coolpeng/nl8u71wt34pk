\n二者是同一概念的不同表述，B 项也错误 , 该题命题不严谨）故选 D 项。", "passage": ""}, {"id": 49, "section": "cs", "type": "single", "stem": "某数据库应用系统运行期间，用户反映某更新操作很慢，无法正常完成业务。系\n统工程师分别在用户的客户机和服务器上使用数据库管理系统自带的客户端工具执行此更\n新操作语句，发现该语句执行后长时间无响应。经检查数据库服务器 CPU 使用率小于 1%，\n磁盘 I/O 也非常小。造成此现象可能的原因是（… … ）。", "options": {"A": "客户机到服务器的网络故障", "B": "更新操作涉及的表没有建立主码", "C": "更新的字段没有建立有效的索引", "D": "更新操作涉及的数据被锁定"}, "answer": "D", "analysis": "A 项，数据库服务器端也出现问题，说明不是网络的原因。B 项，表都要有主码，\n没有主码的表是无法建立的。C 项，由于磁盘 I/O 很小，说明更新后并没有在表中进行大\n量的查找，只有当涉及数据被锁定时，才符合题目中所述情况。故选 D 项。", "passage": ""}, {"id": 50, "section": "cs", "type": "single", "stem": "银行的业务子系统会在数据库服务器上产生各种增删改的事务或数据查询服务请\n求，随着系统的不断运行，系统中的数据会不断增长，就可能会出现系统效率下降的情况，\n以下几种方法中不能优化查询的是（… … ）。", "options": {"A": "创建索引", "B": "使用左连接操作", "C": "避免相关子查询", "D": "用排序来取代非顺序磁盘存取"}, "answer": "B", "analysis": "左连接消耗的资源是非常多的，所以查询不使用任何的左（右）连接可获得\n很好的效果。故选 B 项。", "passage": ""}, {"id": 51, "section": "cs", "type": "single", "stem": "一级封锁协议解决了事务的并发操作带来的（… … ）不一致性的问题。", "options": {"A": "数据丢失修改", "B": "数据不可重复读", "C": "读脏数据", "D": "数据重复修改"}, "answer": "A", "analysis": "数据库的并发操作会带来一些问题，例如丢失更新问题，不一致分析问题（读\n过时的数据），依赖于未提交更新的问题。故选 A 项。", "passage": ""}, {"id": 52, "section": "cs", "type": "single", "stem": "以下关于 NoSQL 数据库的说法中，正确的是（… … ）。", "options": {"A": "各种 NoSQL 数据库具有统一的架构", "B": "NoSQL 数据库保证 ACID 特性", "C": "NoSQL 数据库保证 BASE 特性", "D": "NoSQL 数据库经常使用 JOIN 操作"}, "answer": "C", "analysis": "… …\n【解析】NoSQL 最常见的解释是“non-relational”，泛指非关系型的数据库，区别于\n关系数据库，它们不保证关系数据的 ACID 特性，但保证 BASE 特性。故选 C 项。", "passage": ""}, {"id": 53, "section": "cs", "type": "single", "stem": "Hadoop 和 Spark 的差异是（… … ）。", "options": {"A": "不存在差异", "B": "数据计算时主要依赖 I/O 还是内存", "C": "使用场景分别是 OLTP 和 OLAP 场景", "D": "分别擅长跑批分析和实时计算"}, "answer": "B", "analysis": "… …\n【解析】Hadoop 中中间结果存放在 HDFS 中，每次 MR 都需要刷写 - 调用，而 Spark\n中间结果存放优先存放在内存中，内存不够再存放在磁盘中，不放入 HDFS，避免了大量\n的 I/O 和刷写读取操作。故选 B 项。", "passage": ""}, {"id": 54, "section": "cs", "type": "single", "stem": "MySQL 中，预设的、拥有最高权限超级用户的用户名是（… … ）。", "options": {"A": "sa", "B": "Administartor"  IP 地址所带来的连\n接问题之外，还有一个很重要的优点是可以绕过防火墙的限制。故选 A 项。", "passage": ""}, {"id": 68, "section": "cs", "type": "single", "stem": "TCP SYN 拒绝服务攻击的原理是利用了（… … ）。", "options": {"A": "TCP 三次握手过程", "B": "TCP 面向流的工作机制", "C": "TCP 数据传输中的窗口技术", "D": "TCP 连接终止时的 FIN 报文"}, "answer": "A", "analysis": "SYN 泛洪是一种常见的 DDoS（分布式拒绝服务）攻击类型，它旨在淹没\n目标服务器的 TCP 连接队列，从而使合法用户无法建立新的 TCP 连接。这种攻击利用了\nTCP 三次握手过程中的漏洞，攻击者发送大量的伪造 TCP 连接请求（SYN 包），但不完成\n握手过程，导致服务器的 TCP 连接队列不断增长，占用大量资源，最终无法处理合法连接\n请求。故选 A 项。", "passage": ""}, {"id": 69, "section": "cs", "type": "single", "stem": "下列协议中，哪个不是安全协议？（… … ）", "options": {"A": "SSL", "B": "ICMP", "C": "VPN", "D": "HTTPS"}, "answer": "B", "analysis": "CMP 是消息报文协议，是用于在 IP 网络中传递控制信息和错误消息的协议，\n139\n\n2023 年银保监会招录考试计算机岗·专业知识真题卷答案解析\n主要用于网络设备之间的通信诊断和状态报告，本身并不提供安全功能。故选 B 项。", "passage": ""}, {"id": 70, "section": "cs", "type": "single", "stem": "Windows 操作系统设置账户锁定策略，这可以防止（… … ）。", "options": {"A": "木马入侵", "B": "暴力攻击", "C": "IP 欺骗", "D": "缓冲区溢出攻击"}, "answer": "B", "analysis": "Windows 操作系统设置账户的锁定策略，根据密码输入错误的次数，锁定用户，\n防止暴力攻击。故选 B 项。", "passage": ""}, {"id": 71, "section": "cs", "type": "single", "stem": "网络加密方式的（… … ）是把网络上传输的数据报文的每一位进行加密，而且把\n路由信息、校验和等控制信息全部加密。", "options": {"A": "链路加密", "B": "节点对节点加密", "C": "端对端加密", "D": "混合加密"}, "answer": "A", "analysis": "链路加密主要功能是对路由信息、校验信息、控制信息等全部加密。故选 A 项。", "passage": ""}, {"id": 72, "section": "cs", "type": "single", "stem": "在混合加密方式下，真正用来加解密通信过程中所传输数据（明文）的密钥是（… … ）。", "options": {"A": "非对称算法的公钥… …", "B": "对称算法的密钥", "C": "非对称算法的私钥… …", "D": "CA 中心的公钥"}, "answer": "B", "analysis": "… …\n【解析】在混合加密方式中，通常结合使用非对称加密和对称加密。非对称加密使用\n公钥和私钥，其中公钥用于加密数据，而私钥用于解密数据。然而，在混合加密的实际应\n用中，由于非对称加密的计算成本较高，通常不会直接用于大量数据的加密和解密。相反，\n非对称加密主要用于安全地交换对称加密的密钥（即会话密钥）。一旦双方通过非对称加\n密方式安全地交换了对称密钥，后续的数据通信就会使用这个对称密钥进行加密和解密，\n因为对称加密在处理大量数据时效率更高。因此，在混合加密方式下，真正用来加解密通\n信过程中所传输数据（明文）的密钥是对称算法的密钥。故选 B 项。", "passage": ""}, {"id": 73, "section": "cs", "type": "single", "stem": "SSL 产生会话密钥的方式是（… … ）。", "options": {"A": "从密钥管理数据库中请求获得", "B": "每一台客户机分配一个密钥的方式", "C": "随机由客户机产生并加密后通知服务器", "D": "由服务器产生并分配给客户机"}, "answer": "C", "analysis": "… …\n【解析】 SSL 协议客户机产生一个一次性会话密钥，由服务器公钥加密后传输给服务器。\n故选 C 项。", "passage": ""}, {"id": 74, "section": "cs", "type": "single", "stem": "在程序编写上防范缓冲区溢出攻击的方法有（… … ）。\nⅠ . 编写正确、安全的代码\nⅡ . 程序指针完整性检测\nⅢ . 数组边界检查\nⅣ . 使用应用程序保护软件", "options": {"A": "验证问题的答案不以任何形式返回客户端中", "B": "前端严格限制参数的格式与类型\n8984351279", "C": "Ⅱ和Ⅲ", "D": "都是"}, "answer": "C", "analysis": "… …\n【解析】 防范缓冲区溢出攻击的方法有程序指针完整性检测与数组边界检查。故选 C 项。", "passage": ""}, {"id": 75, "section": "cs", "type": "single", "stem": "应用程序开发时，一个安全的验证功能不能依赖（… … ）。", "options": {"A": "", "B": "", "C": "采用不易自动化识别的辅助验证机制，并在服务端做好非空和一次性校验", "D": "服务端根据参数要求设置白名单验证机制，校验出错及时阻断流程"}, "answer": "B", "analysis": "在应用程序开发中，一个安全的验证功能不能依赖于前端严格限制参数的格\n式与类型。这是因为客户端验证存在局限性，它无法提供真正的安全性，因为它要求客户\n端始终在到达服务器时进行输入验证。此外，客户端验证可以被网页浏览者看到、操控和\n禁止，因此不能完全依赖于客户端来确保数据的安全性。故选 B 项。\n糖糖老师：176.【答案】C\n【解析】程序开发员掌握程序的源代码，再去访问安全系统，风险比较大。故选 C 项。", "passage": ""}, {"id": 76, "section": "cs", "type": "single", "stem": "职责分离是信息安全管理的一个基本原则，其目的是权力不能过分集中在某一个\n人手中，以确保没有单独的人员（单独进行操作）可以对应用程序系统特征或控制功能进\n行破坏。当以下哪一类人员访问安全系统软件时，会违背职责分离原则？（… … ）", "options": {"A": "数据安全管理员", "B": "数据安全分析员", "C": "程序开发员", "D": "系统审核员"}, "answer": "", "analysis": "参考原卷解析", "passage": ""}, {"id": 77, "section": "cs", "type": "single", "stem": "WannaCry 勒索病毒暴发于 2017 年 5 月，主要是利用微软 Windows 操作系统漏洞造\n成网络传播。针对这一漏洞，微软早在 2017 年初就发布了相关的补丁。如果今天某单位\n服务器仍然感染了该勒索蠕虫病毒，那么属于哪个阶段的问题？（… … ）", "options": {"A": "微软公司软件编程阶段的失误", "B": "最终用户使用阶段的失误", "C": "系统管理员维护阶段的失误", "D": "微软公司软件设计阶段的失误"}, "answer": "C", "analysis": "系统补丁发布时间早于病毒暴发时间，公司服务器仍然感染，属于系统管理\n员维护失误。故选 C 项。", "passage": ""}, {"id": 78, "section": "cs", "type": "single", "stem": "根据《中华人民共和国网络安全法》规定，网络运营者应当按照网络安全等级保\n护制度的要求，履行下列安全保护义务，其中要求：采取监测、记录网络运行状态、网络\n安全事件的技术措施，并按照规定留存相关的网络日志不少于（… … ）。", "options": {"A": "安全保护… …", "B": "等级保护", "C": "分级保护", "D": "分类分级保护"}, "answer": "C", "analysis": "… …\n【解析】采取监测、记录网络运行状态、网络安全事件的技术措施，并按照规定留存\n140\n\n相关的网络日志不少于六个月。故选 C 项。", "passage": ""}, {"id": 79, "section": "cs", "type": "single", "stem": "", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "D", "analysis": "根据《中华人民共和国数据安全法》规定，国家建立数据分类等级保护制度，\n根据数据在经济社会发展中的重要程度，以及一旦遭到篡改、破坏、泄露或者非法获取、\n非法利用，对国家安全、公共利益或者个人、组织合法权益造成的危害程度，对数据实行\n分类等级保护。故选 D 项。", "passage": ""}, {"id": 80, "section": "cs", "type": "single", "stem": "业务影响分析在开展业务连续性管理工作中尤为重要，它的主要好处是（… … ）。", "options": {"A": "对业务系统的恢复目标优先级顺序做出正确决策", "B": "安排适当的资源，避免过度投入", "C": "确保在灾难发生后能按恢复计划有序恢复业务", "D": "降低灾难发生后造成的损失\n三、银保监计算机类专业多项选择题：每题 1 分，共 20 题，计 20 分。下面各题，\n每题至少有两个正确答案，少选、多选或错选均不得分。"}, "answer": "A", "analysis": "… …\n8984351279\n【解析】业务影响分析（BIA）是一种通过收集相关数据来预测业务、其流程和系统\n中断的后果的方法。这些数据可用于制定紧急情况下的业务恢复策略。故选 A 项。\n三、银保监计算机类专业多项选择题：每题 1 分，共 20 题，计 20 分。下面各题，\n每题至少有两个正确答案，少选、多选或错选均不得分。", "passage": ""}, {"id": 81, "section": "multi", "type": "multi", "stem": "下列常用的 RAID 中，具有数据冗余能力的是（… … ）。", "options": {"A": "RAID0", "B": "RAID1", "C": "RAID5", "D": "RAIDO+5"}, "answer": "BCD", "analysis": "RAID 0 只是提高数据传输速度，不具备数据冗余能力，A 项错误。故选 BCD 项。", "passage": ""}, {"id": 82, "section": "multi", "type": "multi", "stem": "软件架构设计是降低成本、改进质量、按时和按需交付产品的关键活动。以下关\n于软件架构重要性的叙述中，正确的有（… … ）。", "options": {"A": "架构设计能够满足系统的性能、可维护性等品质", "B": "良好的架构设计能够更好地捕获并了解用户需求", "C": "架构设计能够使得不同的利益相关人（stakeholders）达成一致的目标", "D": "架构设计能够支持项目计划和项目管理等活动"}, "answer": "ACD", "analysis": "软件架构设计是降低成本、改进质量、按时和按需交付产品的关键因素。架\n构设计能够满足系统的性能、可维护性等品质；能够使得不同的利益相关人 (Stakeholders)\n达成一致的目标；能够支持项目计划和项目管理等活动；能够有效地管理复杂性，等等。\n然而系统架构的给出必须建立在需求明确的基础上。故选 ACD 项。", "passage": ""}, {"id": 83, "section": "multi", "type": "multi", "stem": "用 JAVA 编写和运行带数据库的网站之前需要建立起开发环境，这至少需要安装\n（… … ）。", "options": {"A": "头脑风暴", "B": "访谈", "C": "问卷调查", "D": "蒙特卡洛分析"}, "answer": "ABCD", "analysis": "Java 工具包是 JDK，连接数据库需要数据库与数据库的驱动程序，发布网站\n需要 web 容器。故选 ABCD 项。", "passage": ""}, {"id": 84, "section": "multi", "type": "multi", "stem": "", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "ABC", "analysis": "本题考查的需求分析中需求获取的方法。。需求获取的方法常见的包括：用\n户访谈（结构化 / 非结构化）、问卷调查、观察法（现场调研）、原型法（快速原型）、\n头脑风暴、焦点小组、文档分析（现有系统文档、行业标准）等。蒙特·卡罗方法（Monte\nCarlo method），也称统计模拟方法，是由于科学技术的发展和电子计算机的发明，而被提\n出的一种以概率统计理论为指导的一类非常重要的数值计算方法，不是获取需求的方法。\n故选 ABC 项。", "passage": ""}, {"id": 85, "section": "multi", "type": "multi", "stem": "系统设计阶段的活动包括（… … ）。", "options": {"A": "系统规格说明", "B": "系统详细设计", "C": "《系统需求说明书》编写", "D": "系统总体结构设计"}, "answer": "BD", "analysis": "【解析】系统设计阶段的主要活动包括：\n第一，系统总体结构设计，具体有系统总体布局方案的确定、软件系统总体结构的设计、\n计算机硬件方案选择和设计、数据存储的总体设计：\n第二，系统详细设计，具体有代码设计、数据库设计、输出设计、输入设计、用户界\n面设计和处理过程设计。\n故选 BD 项。", "passage": ""}, {"id": 86, "section": "multi", "type": "multi", "stem": "数据挖掘是从海量数据中提取或“挖据”知识，以下哪些属于常见的数据挖掘分\n析方法？（… … ）", "options": {"A": "分类", "B": "聚集", "C": "关联规则", "D": "时序模式"}, "answer": "ABCD", "analysis": "常见的数据挖掘分析方法有关联分析、预测、分类分析、聚类分析、序列模\n型分析等。故选 ABCD 项。", "passage": ""}, {"id": 87, "section": "multi", "type": "multi", "stem": "在做数据库的 TRUNCATE 操作时，下列描述正确的是（… … ）。", "options": {"A": "会将列上的自增长值恢复至种子值", "B": "", "C": "表的索引和约束保持不变", "D": "不会触发触发器（trigger）"}, "answer": "CD", "analysis": "TRUNCATE TABLE 删除表中的所有行，但表结构及其列、约束、索引等保\n持不变。新行标识所用的计数值重置为该列的种子。由于 TRUNCATE TABLE 不记录在日\n志中，所以它不能激活触发器。\n故选 CD 项。", "passage": ""}, {"id": 88, "section": "multi", "type": "multi", "stem": "对于动态网络地址转换（NAT），正确的说法是（… … ）。\nA，将很多内部地址映射到单个真实地址", "options": {"A": "", "B": "外部网络地址和内部地址一对一的映射", "C": "最多可有 64000 个同时的动态 NAT 连接", "D": "每个连接使用一个端口"}, "answer": "ACD", "analysis": "静态 NAT 外部网络地址和内部地址一对一的映射，B 项错误。故选 ACD 项。", "passage": ""}, {"id": 89, "section": "multi", "type": "multi", "stem": "OSPF 相对于 RIP 的优势在于（… … ）。", "options": {"A": "没有跳数限制… …", "B": "支持可变长子网掩码（VLSM）", "C": "支持网络规模大… …", "D": "收敛速度快"}, "answer": "ABCD", "analysis": "OSPF 协议属于 LS 算法，度量值是速度，支持 VLSM，支持大中型网络，收\n敛速度快。故选 ABCD 项。", "passage": ""}, {"id": 90, "section": "multi", "type": "multi", "stem": "自然灾害严重威胁数据的安全，存储灾备是网络规划与设计中非常重要的环节。\n传统的数据中心灾备存储一般采用主备模式，存在资源利用效率低、可用性差、出现故障\n停机时间长、数据恢复慢等问题。双活数据中心的出现解决了传统数据中心的弊端，成为\n数据中心建设的趋势。某厂商提供的双活数据中心解决方案中，双活数据中心架构分为主\n机层、网络层和存储层。在对双活数据中心技术的叙述中，正确的是（… … ）。", "options": {"A": "分布于不同数据中心的存储系统均处于工作状态。两套存储系统承载相同的前端业\n务，且互为热备，同时承担生产和灾备服务", "B": "存储双活是数据中心双活的重要基础，数据存储的双活通过使用虚拟卷镜像与节点\n分离两个核心功能来实现", "C": "双活数据中心不仅要实现存储的双活，而且要考虑存储、网络、数据库、服务器、\n应用等各层面上实现双活", "D": "在双活解决方案中，两项灾备关键指标 RPO（业务系统所能容忍的数据丢失量）和\nRTO（所能容忍的业务停止服务最长时间）均趋于 0"}, "answer": "ABCD", "analysis": "双活方案是两台服务器同时工作，提高可靠性与可用性，平衡负载。故选\nABCD 项。", "passage": ""}, {"id": 91, "section": "multi", "type": "multi", "stem": "下列哪些措施符合操作系统的安全配置原则？（… … ）", "options": {"A": "关闭没必要的服务", "B": "不安装多余的组件", "C": "安装最新的补丁程序", "D": "开放更多的服务"}, "answer": "ABC", "analysis": "开放的服务多，就开放的端口多，给操作系统带来安全隐患。故选 ABC 项。\n糖糖老师：192.【答案】ACD\n【解析】网络风暴与主机的数量无关，vlan 可以隔离不同子网信号，防火墙可以预防\n由攻击带来的网络风暴。故选 ACD 项。", "passage": ""}, {"id": 92, "section": "multi", "type": "multi", "stem": "“网络风暴”的解决办法有（… … ）。", "options": {"A": "划分 VLAN 并配置 ACL（访问控制列表）", "B": "减少网络中的主机数量", "C": "增加防火墙", "D": "私有 VLAN 方式"}, "answer": "", "analysis": "参考原卷解析", "passage": ""}, {"id": 93, "section": "multi", "type": "multi", "stem": "下列有关防火墙局限性描述哪些是正确的？（… … ）", "options": {"A": "防火墙不能对非法的外部访问进行过滤", "B": "防火墙不能解决来自内部网络的攻击和安全问题", "C": "防火墙不能防范不经过防火墙的攻击", "D": "防火墙不能防治策略配置不当或错误配置引起的安全威胁"}, "answer": "BCD", "analysis": "防火墙是根据策略规则对外网数据进行过滤，A 项错误。故选 BCD 项。", "passage": ""}, {"id": 94, "section": "multi", "type": "multi", "stem": "以下有关 WAF 的说法正确的是（… … ）。", "options": {"A": "WAF 可对客户端的非法请求予以实时阻断", "B": "WAF 可防范 SQL 注入、XSS 等专门针对 Web 应用的攻击", "C": "WAF 可对来自 Web 应用程序客户端的各类请求进行内容检测", "D": "WAF 工作在网络层"}, "answer": "ABC", "analysis": "WAF 工作在应用层，D 项错误。故选 ABC 项。\n\n2023 年银保监会招录考试计算机岗·专业知识真题卷答案解析", "passage": ""}, {"id": 95, "section": "multi", "type": "multi", "stem": "开发时，关于权限要求描述正确的有（… … ）。", "options": {"A": "应用 TSL/SSL", "B": "对应用代码进行签名", "C": "本地加密存储敏感信息", "D": "进行代码混淆"}, "answer": "ACD", "analysis": "用系统数据的账号也可以是管理员，B 项错误。故选 ACD 项。", "passage": ""}, {"id": 96, "section": "multi", "type": "multi", "stem": "", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "ABCD", "analysis": "SSL 保证数据传输安全，签名进行身份认证，本地加密保证程序安全，代码\n混淆提高了代码的安全性。故选 ABCD 项。", "passage": ""}, {"id": 97, "section": "multi", "type": "multi", "stem": "网络蜜罐技术是入侵检测技术的一个重要发展方向，以下有关蜜罐的说法正确的\n是（… … ）。", "options": {"A": "蜜罐系统是一个包含漏洞的诱骗系统，它通过模拟一个或多个易受攻击的主机或服\n务，给攻击者提供一个容易攻击的目标", "B": "使用蜜罐技术，可以使目标系统得以保护，便于研究入侵者的攻击行为", "C": "蜜罐技术是一种主动防御技术", "D": "蜜罐系统会直接提高计算机安全等级，是其他安全策略不可替代的"}, "answer": "ABC", "analysis": "蜜罐系统是安全策略之一。故选 ABC 项。", "passage": ""}, {"id": 98, "section": "multi", "type": "multi", "stem": "习近平总书记指出，网络安全和信息化是相辅相成的，“网络安全和信息化是一\n体之两翼、驱动之双轮，必须统一谋划、统一部署、统一推进、统一实施。做好网络安全\n和信息化工作，要处理好（… … ）和（… … ）的关系，做到协调一致、齐头并进，以安全", "options": {"A": "安全", "B": "互联网", "C": "信息化", "D": "发展\n确的是（… … ）。"}, "answer": "AD", "analysis": "", "passage": ""}, {"id": 99, "section": "multi", "type": "multi", "stem": "我国要求党政机关均应建立并实施网络安全工作责任制，关于单位领导责任表述", "options": {"A": "分管领导负责任，主要负责人无责任", "B": "分管领导为第一责任人", "C": "主要 - 负责人为第一责任人", "D": "分管领导为直接责任人"}, "answer": "CD", "analysis": "8984351279\n【解析】网络安全和信息化是相辅相成的，网络安全和信息化是一体之两翼、驱动之\n双轮，必须统一谋划、统一部署、统一推进、统一实施。做好网络安全和信息化工作，要\n处理好安全和发展的关系，做到协调一致、齐头并进，以安全保发展、以发展促安全，努\n力建久安之势、成长治之业。故选 AD 项。\n【解析】 《实施办法》第二条规定：按照谁主管谁负责、属地管理的原则，各级党委（党\n组）对本地区本部门网络安全工作负主体责任，领导班子主要负责人是第一责任人，主管\n网络安全的领导班子成员是直接责任人。故选 CD 项。", "passage": ""}, {"id": 100, "section": "multi", "type": "multi", "stem": "按照 COSO 的企业全面风险管理框架，信息科技风险管理需要确保（… … ）。", "options": {"A": "企业战略目标", "B": "员工成长目标", "C": "企业经营目标", "D": "合规目标\n\n每题所给的四个选项中，选出最佳选项。\n（一）\n-\nIn mid\n-\nApril 2020, the national unemployment rate reached 14.7 percent—the highest since\nthe Great Depression. Forty\none million American workers filed for unemployment between\nFebruary and May of 2020. Unprecedented unemployment rates don't just have a impact on the\nunemployed, though. For people still employed during the COVID"}, "answer": "ACD", "analysis": "COSO—ERM 2004 从四类目标、八大要素和四层企业内部的不同层次的单元\n构成了三维视角的企业全面风险管理的模型。四大目标包括：战略、经营、报告与合规目标。\n八大要素包括：内部环境、目标设定、事项识别、风险评估、风险应对、控制活动、信息\n沟通和监控；四大层面包括：主体层次、分布、业务单位、子公司。故选 ACD 项。\n四、英语阅读理解题：每小题 0.5 分，共 20 题，计 10 分。阅读下列短文，从\n每题所给的四个选项中，选出最佳选项。", "passage": ""}, {"id": 101, "section": "eng", "type": "single", "stem": "What can we know from the first paragraph?（ ）", "options": {"A": "The unemployment rate in the United States is at an all\n-\ntime high.", "B": "41 million people were unemployed in the United States in 2020.", "C": "The high unemployment rate has little effect on the employee.", "D": "The employed are also uneasy about their employment prospects."}, "answer": "D", "analysis": "从第一段“In mid\n-\nApril…May of 2020.”可知 A 项中的“all\n-\ntime”与原文不\n符，失业率并不是空前高，而是自从大萧条之后最高的一次，A 项错误，不当选。从第一\n段第二句可知，时间为 2020 年 2 月到 5 月，并非 2020 年全年，B 项错误，不当选。从第\n一段第三句可知，有很大的影响，选项中的“little effect”表达错误，C 项错误，不当选。\n从第一段最后一句中“with greater symptoms of depression and anxiety”可知，疫情中有工\n141\n\n2023 年银保监会招录考试计算机岗·专业知识真题卷答案解析\n作的人也忧心忡忡。故选 D 项。", "passage": ""}, {"id": 102, "section": "eng", "type": "single", "stem": "Researchers of the mentioned study mainly asked participants about .", "options": {"A": "their mental conditions", "B": "their depression symptoms", "C": "their views on economic situation", "D": "their family income and expenditure\n8984351279"}, "answer": "A", "analysis": "本题出自第三段。从第三段中“if they were feeling nervous,\nanxious...”“worrying”\n“financial concerns”等可知，主要研究人们在新型冠状病毒期间的精神状况。另外，第五\n段第一行和第六段第二行的“mental health”等也有提示。故选 A 项。", "passage": ""}, {"id": 103, "section": "eng", "type": "single", "stem": "Through the investigation, the researchers found that .", "options": {"A": "greater economic insecurity can cause serious anxiety", "B": "epidemics can lead to psychological problems", "C": "people infected with COVID\n-", "D": ""}, "answer": "A", "analysis": "本题从第四段可以知晓。“greater financial concern with greater anxiety symptoms,\nand greater job insecurity with greater depressive symptoms”证明，更大的经济担忧与更严重\n的焦虑症状之间、更强烈的工作不安全感与更严重的抑郁症状之间，均存在独立的联系，\n从而对之前发现的联系进行了重要的扩展。故选 A 项。", "passage": ""}, {"id": 104, "section": "eng", "type": "single", "stem": "The researchers advised employers to .", "options": {"A": "provide more work opportunities", "B": "avoid firing their sick employees", "C": "make employees feel financially secure", "D": "allow anxious workers to get fully paid"}, "answer": "C", "analysis": "从第六段最后一句可知，疫情之下减轻员工心理负担，即使工时和工资少了，\n也应让员工继续工作，从而使他们缓解经济压力，感到经济安全。故选 C 项。", "passage": ""}, {"id": 105, "section": "eng", "type": "single", "stem": "What would be the author's purpose of writing this passage?（ ）", "options": {"A": "His idea on the CEOs was recognized by corporate boards.", "B": "One of his lines had been modified to describe the CEOs.", "C": "His play pointed out that“all CEOs are above average”\n.", "D": "His radio program aroused the“Lake Wobegon effect”\n."}, "answer": "B", "analysis": "最后一段为总结部分，给员工和老板分别提了相应的建议，表明了作者的写\n作意图——帮助人们去应对疫情，面对失业，缓解压力。故选 B 项。", "passage": ""}, {"id": 106, "section": "eng", "type": "single", "stem": "", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "B", "analysis": "第二段第四句中的破折号后的内容表明，“all CEOs are above average”这一说\n法是对 Garrison Keillor 某句台词的修改。故选 B 项。", "passage": ""}, {"id": 107, "section": "eng", "type": "single", "stem": "According to the second paragraph, CEOs' pay keeps soaring mainly because .", "options": {"A": "surveys indicate that CEOs deserve higher pay", "B": "consultants tend to believe CEOs are above average", "C": "directors' belief greatly influences the pay standard", "D": "compensation committees seldom evaluate the CEOs' ability"}, "answer": "C", "analysis": "第二段最后两句的“Since...”“ The result...”表明这两句之间存在因果关系，\n由倒数第二句可以推断出，“ CEOs”报酬不断上涨主要是因为受到董事们的想法的影响，…\nC 项提到了董事们的想法。故选 C 项。", "passage": ""}, {"id": 108, "section": "eng", "type": "single", "stem": "“\ncream\n-\nof\n-\nthe\n-\ncrop” (Line 1, Paragraph 4) is closest in meaning to“ ”\n.", "options": {"A": "competent", "B": "courageous", "C": "disappointing", "D": "hard\n-\nworking\n8984351279"}, "answer": "A", "analysis": "糖糖老师：1【 解 析】 从 第 四 段 首 句 中“cream\n-\nof\n-\nthe\n-\nsurprisingly poorly”可以推断出，“cream\n-\nof\n-\nthe\n-\n段主要讨论“ CEOs”的能力，因此“cream\n-\nof\n-\ncrop”之 前 的“supposed”以 及“but”“did\ncrop”应该与“poorly”的意思相反，而该\nthe\n-\ncrop”应是表示“ CEOs”被认为能\n力卓著。故选 A 项。", "passage": ""}, {"id": 109, "section": "eng", "type": "single", "stem": "Scott Klinger most probably tends to agree that .", "options": {"A": "most people lose money in the investment into the stocks", "B": "the CEOs, performance can't be reflected by the value of stocks", "C": "the CEOs are not the only factor that prospers a corporation", "D": "the pay of the CEOs greatly influences the profit of a company"}, "answer": "C", "analysis": "第四段 倒 数 第 二句 中 的“...is dead wrong”表 明 C 项 符 合 Scott Klinger 对…\n“ CEOs”的看法。故选 C 项。\n142", "passage": ""}, {"id": 110, "section": "eng", "type": "single", "stem": "Which of the following is the biggest concern of the corporate boards?（ ）", "options": {"A": "The free market.", "B": "The CEOs' performance.", "C": "The CEOs'\npay.", "D": "The corporations' profit.\n（三）\nWe have a crisis on our hands. You mean global warming? The world economy? No, the\ndecline of reading. People are just not doing it anymore, especially the young. Who's responsible?\nActually, it's more like, what is responsible?\nThe Internet, of course, and everything that comes with it—Facebook, Twitter（推特）. You\ncan write your own list. There's been a warning about the imminent death of literate civilization\nfor a long time. In the 20th century, first it was the movies, then radio, then television that seemed\nto spell doom for the written world. None did. Reading survived; in fact it not only survived, it\nhas flourished. The world is more literate than ever before—there are more and more readers, and\nmore and more books.\nThe fact that we often get our reading material online today is not something we should\nworry over. The electronic and digital revolution of the last two decades has arguably shown the\nway forward for reading and for writing. Take the arrival of e\n-\nbook readers as an example.\nDevices like Kindle make reading more convenient and are a lot more environmentally\nfriendly than the traditional paper book.\nAs technology makes new ways of writing possible, new ways of reading are possible.\n\n\nInterconnectivity allows for the possibility of a reading experience that was barely imaginable\nbefore. Where traditional books had to make do with photographs and illustrations, an e\n-\nbook\ncan provide readers with an unlimited number of links: to texts, pictures, and videos. In the future,\nthe way people write novels, history, and philosophy will resemble nothing seen in the past.\nOn the other hand, there is the danger of trivialization. One Twitter group is offering its\nfollowers single\n-\nsentence\n-\nlong“digests” of the great novels. War and Peace in a sentence?\nYou must be joking. We should fear the fragmentation of reading. There is the danger that the high\n-\nspeed connectivity of the Internet will reduce our attention span —that we will be incapable of\nreading anything of length or which requires deep concentration.\nIn such a fast\n-\nchanging world, in which reality seems to be remade each day, we need the\nability to focus and understand what is happening to us. This has always been the function of\nliterature and we should be careful not to let it disappear. Our society needs to be able to imagine\nthe possibility of someone utterly in tune with modern technology but able to make sense of a\ndynamic, confusing world.\nIn the 15th century, Johannes Gutenberg's invention of the printing press in Europe had a\nhuge impact on civilization. Once upon a time the physical book was a challenging thing. We\nshould remember this before we assume that technology is out to destroy traditional culture."}, "answer": "D", "analysis": "最后一段第一句表明董事会关心的是利润，其他任何因素都与利润挂钩。\n故选 D 项。", "passage": ""}, {"id": 111, "section": "eng", "type": "single", "stem": "Which of the following paragraphs briefly reviews the historical challenges for reading?\n（ ）", "options": {"A": "multimodal content", "B": "environmental friendliness", "C": "convenience for readers\n-", "D": "imaginative design"}, "answer": "B", "analysis": "细节理解题。根据第一段、第二段“Actually, it'\ns more like, what is responsible\n?… You can write your own list.”和第二段“In the 20th century, first it was the movies,… there\n故选 B 项。", "passage": ""}, {"id": 112, "section": "eng", "type": "single", "stem": "", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "D", "analysis": "【 解 析】 细 节 理 解 题。 由 第 五 段 最 后 一 句“...\nunlimited number of links:\n他都有提到。故选 D 项。\n8984351279\nare more and more readers, and more and more books.”可知，第二段是介绍阅读的历史挑战。\nan e\n-\nbook can provide readers with an\nto texts, pictures, and videos. In the future, the way people write novels,\nhistory, and philosophy will resemble nothing seen in the past.”可知，除了有想象力的设计其", "passage": ""}, {"id": 113, "section": "eng", "type": "single", "stem": "Which of the following can best describe how the author feels toward single\nlong novels?（ ）", "options": {"A": "Ironic.", "B": "Worried.\n-\nsentence", "C": "Convenience for readers.", "D": "Doubtful."}, "answer": "B", "analysis": "推理判断题。由第六段“You must be joking. We should fear the fragmentation of\nreading. There is the danger that the high\n-\nspeed connectivity of the Internet will reduce our attention\nspan...”可知，作者对把小说概括成一句话这样的行为非常担忧（worried），这种碎片化\n的阅读会让我们注意力难以集中。A 项“讽刺的”，C 项“为读者提供便利”，D 项“有\n疑虑的”均不符合题意。故选 B 项。", "passage": ""}, {"id": 114, "section": "eng", "type": "single", "stem": "According to the passage, people need knowledge of modern technology and（ ）\nto survive in the fast\n-\nchanging society.", "options": {"A": "high sensitivity", "B": "good judgement", "C": "good imagination", "D": "the ability to focus"}, "answer": "B", "analysis": "题干意为：根据文章所述，人们需要现代技术的知识和（… … ）才能在快\n速变化的社会中生存。根据题干定位到第七段最后一句，由“Our society needs to be able\nto imagine the possibility of someone utterly in tune with modern technology but able to make sense\nof a dynamic, confusing world.”可知，“knowledge of modern technology”对应“in tune with modern\ntechnology”，而“make sense of a dynamic, confusing world”则对应 B 项“良好的判断力”。\n故选 B 项。", "passage": ""}, {"id": 115, "section": "eng", "type": "single", "stem": "What is the main idea of the passage?（ ）\nA. Technology pushes the way forward for reading and writing.", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "C", "analysis": "根据全文内容的介绍可知，文章主要讲现代科技给我们带来了很多机遇，\n同时对传统的阅读方式也带来了前所未有的挑战。特别由最后一段的“a huge impact on\ncivilization”和“technology is out to destroy traditional culture”可知，科技是传统阅读的机遇\n和挑战。故选 C 项。", "passage": ""}, {"id": 116, "section": "eng", "type": "single", "stem": "According to Paragraph 1, bankruptcy rates in the U.S. have been increasing mainly\nbecause .", "options": {"A": "having credit cards was a fashionable trend in the 1970s", "B": "credit\n-\ncard companies charged only those unable to repay high rates", "C": "many indebted people easily claimed bankruptcy throughout the country", "D": "many credit card holders pressed by debt have filed for bankrupt"}, "answer": "D", "analysis": "事实细节题。第一段指出破产率的上升主要归咎于高利率信用卡的广泛使用，\n而很多高风险的信用卡持卡人不堪债务累累，于是申请破产。故选 D 项。", "passage": ""}, {"id": 117, "section": "eng", "type": "single", "stem": "By saying“the impersonality of credit\n-\ncard borrowing” (Line 1, Paragraph 2), the\nauthor implies that .", "options": {"A": "e\n-\nmails have taken over interpersonal communications", "B": "face\n-\nto\n-\nface interviews with bankers would strengthen morality", "C": "people can own a credit card by replying to a junk\n-\nmail offer", "D": "credit\n-\ncard borrowing has lost the moral obligations"}, "answer": "C", "analysis": "语义理解题。第二段谈到利用诸如邮件等简单方式进行信用卡借贷，比面谈\n的借贷更可能导致持卡人在道德上松懈还款责任。故选 C 项。", "passage": ""}, {"id": 118, "section": "eng", "type": "single", "stem": "Which of the following is TRUE of the other factors fueling the bankruptcy rise? （ ）", "options": {"A": "Lack of medical insurance has brought about social troubles.", "B": "Unemployment has impaired cardholders' ability to repay debts.", "C": "The growth of gambling industry has inhibited money wasting.", "D": "Government authorities have decided to legalize bankruptcy."}, "answer": "B", "analysis": "推理判断题。根据“fueling the bankruptcy rise”定位到第三段，文中谈到失业\n也可能导致持卡人濒临破产。故选 B 项。", "passage": ""}, {"id": 119, "section": "eng", "type": "single", "stem": "Bankruptcy Reform Act of 1978 was amended in order to .", "options": {"A": "promote easy credit and filing", "B": "counter debt\n-\ncreating forces", "C": "give debtors more freedom", "D": "cripple opportunistic filings"}, "answer": "D", "analysis": "事实细节题。根据“Bankruptcy Reform Act of 1978”定位到第四段，文中提到，\n1984 年最高法院为了抑制投机人士提出破产申请，对此项法案进行了修正。故选 D 项。", "passage": ""}, {"id": 120, "section": "eng", "type": "single", "stem": "We can conclude from the last paragraph that .", "options": {"A": "despite legal efforts uncertainty remains in bankruptcy issues", "B": "new acts concerning bankruptcy will protect debtors", "C": "bankruptcy in the U.S. will decrease in the long run", "D": "bankruptcy experts don't care about the effectiveness of filings\n8984351279"}, "answer": "A", "analysis": "推理判断题。最后一段提到，尽管设立了新的限制，破产方面的专家对此法\n案能否有效降低破产申请倾向持怀疑态度或不发表任何意见。故选 A 项。\n糖糖老师：1\n\n2023 年银保监会招录考试计算机岗·专业知识真题卷答案解析\n8984351279\n143", "passage": ""}]}, "2022": {"meta": {"title": "2022年 金监局·计算机岗 专业科目真题卷", "subtitle": "金融监督管理总局招录考试 · 专业知识真题卷（含解析）", "year": 2022, "total": 120, "minutes": 120, "score": 100, "source": "【考试喵】金监局2022年笔试真题及解析-计算机岗.txt"}, "sections": [{"key": "econ", "name": "经济金融基础知识 · 单选", "range": [1, 20], "per": 0.5, "type": "single"}, {"key": "cs", "name": "计算机专业知识 · 单选", "range": [21, 80], "per": 1, "type": "single"}, {"key": "multi", "name": "计算机专业知识 · 多选", "range": [81, 100], "per": 1, "type": "multi"}, {"key": "eng", "name": "英语阅读理解 · 单选", "range": [101, 120], "per": 0.5, "type": "single"}], "questions": [{"id": 1, "section": "econ", "type": "single", "stem": "为维护您的个人权益，确保公务员考试的公平公正，请您协助我\n们监督考试实施工作。\n本场考试规定：监考人员要向本考场全体考生展示题本密封情况，\n并邀请 2 名考生代表验封签字后，方能开启试卷袋。如果您发现本考场\n监考人员存在违规启用试卷袋的情况，请向人力资源和社会保障部人事\n考试中心举报。", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "C", "analysis": "实际经济周期理论将经济波动的根源归结为以技术冲击为代表的实际因素，\n认为是总供给冲击产生经济周期而不是总需求冲击产生经济周期。故选 C 项。", "passage": ""}, {"id": 2, "section": "econ", "type": "single", "stem": "根据凯恩斯主义的 IS\n-\nLM 模型，当经济处于流动性陷阱时期，为刺激需求应该采\n取的政策是（… … ）。", "options": {"A": "增加财政税收", "B": "增加财政支出", "C": "增加货币供给", "D": "提高法定准备金率"}, "answer": "B", "analysis": "根据凯恩斯主义的 IS\n-\nLM 模型，当经济处于流动性陷阱时期，货币政策无效，\n应采取扩张的财政政策来刺激总需求，如增加财政支出、减少税收等。故选 B 项。", "passage": ""}, {"id": 3, "section": "econ", "type": "single", "stem": "在宏观经济学基本假设中，投资支出是利率的函数。当投资支出对利率变化比较敏\n感时，（… … ）。", "options": {"A": "总需求曲线更趋平缓", "B": "总需求曲线更趋陡峭", "C": "总需求曲线无变化", "D": "总供给曲线更趋平缓"}, "answer": "A", "analysis": "当投资支出对利率变化比较敏感时，IS 曲线更加平坦，货币政策效果好。也\n就意味着，当价格下降时，实际货币供给量增加，LM 曲线向右移动之后带来的总需求增\n加的量变多，所以总需求曲线趋向平坦。故选 A 项。", "passage": ""}, {"id": 4, "section": "econ", "type": "single", "stem": "监考人员宣布考试结束时，考生应立即停止作答，将题本、答题\n卡和草稿纸一律留在桌上，待监考人员确认数量无误、允许离开后，方\n可离开考场。如果你违反了以上任何一项要求，都将影响你的成绩。", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "D", "analysis": "根据短期生产的三个阶段，由总产量、边际产量与平均产量的图形可知，当\n边际产量大于零时，总产量上升，平均产量可能上升也可能下降。故选 D 项。\n糖糖老师：15.【答案】A\n【解析】具有替代关系的两种商品，其中一种商品的价格和另一种商品的需求量之间\n呈同方向变动关系；互补关系的两种商品，其中一种商品的价格和另一种商品的需求量之\n间呈反方向变动关系。乒乓球拍与乒乓球是一组互补品，所以当乒乓球拍价格降低时，乒\n乓球的需求增加，引起需求曲线向右移动。故选 A 项。", "passage": ""}, {"id": 5, "section": "econ", "type": "single", "stem": "在这项测验中，可能有些试题较难，不要在一道题上思考时间太久，\n遇到不会答的题目可以先跳过去，如果有时间再去思考，否则，你可能\n没有时间完成后面的题目。", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "", "analysis": "参考原卷解析", "passage": ""}, {"id": 6, "section": "econ", "type": "single", "stem": "西方经济学中的“免费搭便车”问题产生的原因是（… … ）。", "options": {"A": "私人成本超过了社会收益", "B": "产品是非竞争性的和排他性的", "C": "产品是非排他性的", "D": "市场产量高于社会最优产量"}, "answer": "C", "analysis": "2022 年银保监会招录考试计算机岗·专业知识真题卷答案解析\n【解析】公共物品具有非竞争性和非排他性。由于公共物品存在消费上的非排他性，\n理性的个人倾向于由他人付费而自己坐享其成。这就是所谓的“免费搭便车”，即公共物\n品的非排他性导致“免费搭便车”问题的产生。故选 C 项。", "passage": ""}, {"id": 7, "section": "econ", "type": "single", "stem": "人们通常所说的负利率是指（… … ）。", "options": {"A": "名义利率为负", "B": "名义利率低于实际利率", "C": "实际利率为负", "D": "存款利率低于贷款利率"}, "answer": "C", "analysis": "通常所说的负利率是指实际利率小于零，即名义利率小于通货膨胀率。故\n选 C 项。", "passage": ""}, {"id": 8, "section": "econ", "type": "single", "stem": "我国货币政策的最终目标是（… … ）。", "options": {"A": "国际收支平衡、充分就业", "B": "人民币币值稳定、国际收支平衡", "C": "国际收支平衡、经济增长", "D": "人民币币值稳定、经济增长"}, "answer": "D", "analysis": "货币币值的稳定，并以此促进经济增长。故选 D 项。", "passage": ""}, {"id": 9, "section": "econ", "type": "single", "stem": "弗里德曼货币需求理论的显著特征之一是（… … ）。", "options": {"A": "强调恒久性收入对货币需求的重要影响", "B": "强调货币需求的动机", "C": "强调人们的流动性偏好", "D": "强调资产的多样性组合"}, "answer": "A", "analysis": "", "passage": ""}, {"id": 10, "section": "econ", "type": "single", "stem": "商业银行通过实行资产证券化可以（… … ），从而降低资本要求。", "options": {"A": "二者都不占用或较少占用银行资金", "B": "银行在其中主要充当代理人、受托人的角色", "C": "", "D": "二者都有较大风险"}, "answer": "B", "analysis": "8984351279\n【解析】《中华人民共和国中国人民银行法》第三条规定，我国货币政策目标是保持\n【解析】与凯恩斯不同，弗里德曼强调恒久性收入对货币需求的重要影响，并且认为\n恒久性收入相对稳定，货币需求函数也是相对稳定的。故选 A 项。\n【解析】资产证券化是指以基础资产未来所产生的现金流为偿付支持，通过结构化设\n计进行信用增级，在此基础上发行资产支持证券的过程，它是以特定资产组合或特定现金\n流为支持，发行可交易证券的一种融资形式。商业银行通过资产证券化能够实现表内资产\n表外化，从而增强商业银行资产的流动性，获得低成本融资，减少表内风险资产，便于商\n业银行优化资产负债管理。故选 B 项。", "passage": ""}, {"id": 11, "section": "econ", "type": "single", "stem": "关于商业银行的中间业务与表外业务，以下表述错误的是（… … ）。\nC. 银行的收入主要为服务费、手续费、管理费等", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "D", "analysis": "商业银行的中间业务一般是传统无风险业务或承担较小的风险，而表外业务\n一般会承受一定的风险。故选 D 项。", "passage": ""}, {"id": 12, "section": "econ", "type": "single", "stem": "商业银行日常经营和风险管理过程中，承担风险和吸收非预期损失的资金来源于\n（… … ）。", "options": {"A": "资本金", "B": "同业拆借资金", "C": "贷款损失准备", "D": "在中央银行的存款"}, "answer": "A", "analysis": "商业银行通常采取提取损失准备金和冲减利润的方式来应对和吸收预期损失；\n利用资本金来应对和化解非预期损失。故选 A 项。", "passage": ""}, {"id": 13, "section": "econ", "type": "single", "stem": "个人客户可以使用信用卡（… … ）。", "options": {"A": "购买房屋……", "B": "购买汽车", "C": "购买理财产品……", "D": "开展股票投资"}, "answer": "B", "analysis": "我国有关法律规定的信用卡，是指由商业银行或者其他金融机构发行的具有\n消费支付、信用贷款、转账结算、存取现金等全部功能或者部分功能的电子支付卡。严禁\n在包括但不限于以下范围使用：房地产、股票、金融投资等其他消费领域。故选 B 项。", "passage": ""}, {"id": 14, "section": "econ", "type": "single", "stem": "根据《中华人民共和国信托法》，以下表述正确的是（… … ）。", "options": {"A": "可以采取口头形式设立信托", "B": "信托财产是属于受托人的财产", "C": "受益人不能是受托人", "D": "法律、行政法规禁止流通的财产，不得作为信托财产"}, "answer": "D", "analysis": "根据《中华人民共和国信托法》规定，设立信托，应当采取书面形式，\n书面形式包括信托合同、遗嘱或者法律、行政法规规定的其他书面文件等， A 项错误，\n123\n\n2022 年银保监会招录考试计算机岗·专业知识真题卷答案解析\n不当选。信托财产与属于受托人所有的财产相区别，不得归入受托人的固有财产或者成为\n固有财产的一部分，B 项错误，不当选。受益人是在信托中享有信托受益权的人。受益人\n可以是自然人、法人或者依法成立的其他组织。委托人可以是受益人，也可以是同一信托\n的唯一受益人。受托人可以是受益人，但不得是同一信托的唯一受益人， C 项错误，不当选。\n法律、行政法规禁止流通的财产，不得作为信托财产，D 项正确，当选。故选 D 项。", "passage": ""}, {"id": 15, "section": "econ", "type": "single", "stem": "2008 年以来全球金融监管体系最大的变革之一，是（… … ）成为全球金融监管体\n系中的核心协调机构。", "options": {"A": "巴塞尔委员会", "B": "金融稳定委员会", "C": "国际清算银行", "D": "国际货币基金组织"}, "answer": "B", "analysis": "在 2008 年全球爆发金融危机的局面下，2009 年 4 月初伦敦 G20 峰会决议设\n立一个全球性的金融监管体系，金融稳定委员会（FSB）在此背景下应运而生，专家称其为“全\n球央行”。2009 年 6 月 27 日，这个根据 G20 峰会决议设立的“全球央行”正式开始运作。\n金融稳定委员会的具体职能包括：评估全球金融系统脆弱性，监督各国改进行动；促进各\n国监管机构合作和信息交换，对各国监管政策和监管标准提供建议；协调国际标准制订机\n构的工作；为跨国界风险管理制订应急预案等。故选 B 项。", "passage": ""}, {"id": 16, "section": "econ", "type": "single", "stem": "中国货币市场的基准利率是（… … ）。", "options": {"A": "LIBOR", "B": "NIBOR", "C": "HIBOR…………", "D": "SHIBOR"}, "answer": "D", "analysis": "中国货币市场的基准利率是上海银行间同业拆放利率 SHIBOR。故选 D 项。", "passage": ""}, {"id": 17, "section": "econ", "type": "single", "stem": "下列会对我国国际收支平衡表中的经常账户有影响的情况是（… … ）。", "options": {"A": "中国人寿保险公司购买谷歌公司的股票", "B": "中国工商银行向德国某公司发放贷款", "C": "中国人民保险公司收到英国某客户的保险费", "D": "中国人民银行购买美国国债"}, "answer": "C", "analysis": "经常项目主要反映一国与他国之间实际资源的转移，是国际收支中最重要的\n项目。经常项目包括货物（贸易）、服务（无形贸易）、收益和单方面转移（经常转移）\n四个项目。资本与金融项目反映的是国际资本流动，包括长期或短期的资本流出和资本流\n入，是国际收支平衡表的第二大类项目。资本项目包括资本转移和非生产、非金融资产的\n收买或出售，前者主要是投资捐赠和债务注销，后者主要是土地和无形资产（专利、版权、\n商标等）的收买或出售。金融账户包括直接投资、证券投资（间接投资）和其他投资（包\n括国际信贷、预付款等）。ABD 项均属于资本与金融项目，C 项属于经常项目中的服务项\n目。故选 C 项。", "passage": ""}, {"id": 18, "section": "econ", "type": "single", "stem": "保险经纪人是基于（… … ）的利益提供中介服务的机构。", "options": {"A": "保险人", "B": "投保人", "C": "被保险人", "D": "受益人"}, "answer": "B", "analysis": "糖糖老师：1【解析】根据《中华人民共和国保险法》规定，保险经纪人（包括保险经纪公司及其\n分支机构）是基于投保人的利益，为投保人与保险人订立保险合同提供中介服务，并依法\n收取佣金的机构。保险代理人是指根据保险人的委托授权，代理其经营保险业务，并收取\n代理费用的人，保险代理人在保险人授权的范围内以保险人的名义进行业务活动。本题要\n注意保险经纪人与保险代理人的区分。故选 B 项。", "passage": ""}, {"id": 19, "section": "econ", "type": "single", "stem": "衡量保险公司偿付能力状况的关键指标是偿付能力充足率，它等于（… … ）。", "options": {"A": "实际资本 / 最低资本", "B": "认可资产 / 认可负债", "C": "认可资产 / 最低资本", "D": "实际资本 / 认可资产"}, "answer": "A", "analysis": "偿付能力是保险公司偿还债务的能力。保险公司应当具有与其风险和业务规\n124\n\n模相适应的资本，确保偿付能力充足率不低于 100%。综合偿付能力充足率= 保险公司的\n实际资本 / 最低资本。故选 A 项。", "passage": ""}, {"id": 20, "section": "econ", "type": "single", "stem": "保险损失补偿原则不适用于（… … ）。", "options": {"A": "建筑工程保险", "B": "货物运输保险", "C": "农业保险", "D": "人身保险\n二、银保监计算机类专业单项选择题：每题 1 分，共 60 题，计 60 分，在每题\n给出的四个选项中，只有一项是符合题目要求的。"}, "answer": "D", "analysis": "“损失补偿原则”是适用于财产保险的一项重要原则，即当保险事故发生并\n使被保险人遭受损失时，保险人必须在其承担的保险金给付义务范围内履行合同义务，对\n被保险人所受实际损失进行补偿。保险人履行给付义务旨在弥补被保险人因承保危险发生\n用于人身保险。故选 D 项。\n8984351279\n所失去的利益，被保险人不能因保险给付义务的履行而获得额外利益。但是对于人身保险， …\n《中华人民共和国保险法》第四十六条规定：“被保险人因第三者的行为而发生死亡、伤\n残或者疾病等保险事故的，保险人向被保险人或者受益人给付保险金后，不享有向第三者\n追偿的权利，但被保险人或者受益人仍有权向第三者请求赔偿。”该条款明确限制保险人\n行使代位追偿权，同时赋予被保险人或者受益人另外向实施致害行为的第三者主张侵权赔\n偿的权利。而且，保险法对人身保险并无重复投保的限制。因此，“损失补偿原则”不适\n二、银保监计算机类专业单项选择题：每题 1 分，共 60 题，计 60 分，在每题\n给出的四个选项中，只有一项是符合题目要求的。", "passage": ""}, {"id": 21, "section": "cs", "type": "single", "stem": "二进制数 00111110 转换成十进制数为（… … ）。", "options": {"A": "60", "B": "61", "C": "62", "D": "63"}, "answer": "C", "analysis": "二进制转换为十进制，按“位权展开相加法”运算，0*27+0*26+1*25+1*24+1*\n23+1*22+1*21+0*20=62。故选 C 项。", "passage": ""}, {"id": 22, "section": "cs", "type": "single", "stem": "信息系统总体规划中需要进行应用架构规划，（… … ）不属于应用架构规划应考\n虑的内容。", "options": {"A": "I/O 设备和 I/O 端口之间", "B": "通用寄存器和 I/O 设备之间", "C": "I/O 端口和 IO 端口之间", "D": "通用寄存器和 I/O 端口之间"}, "answer": "A", "analysis": "应用架构是以业务架构为依据，对应用体系的结构和相互关系进行说明。应\n用架构包括应用现状、应用要素和应用体系设计的描述，为创建一体化的信息系统奠定基\n础。应用架构需充分考虑如下方面：（1）应用现状：应对现有应用系统情况进行描述。…\n（2）应用要素：应包括对服务域、服务类、服务组件的说明。（3）应用体系设计：应按\n照信息化建设要求，规划设计主要业务和相关领域的应用系统。故选 A 项。", "passage": ""}, {"id": 23, "section": "cs", "type": "single", "stem": "", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "D", "analysis": "I/O 端口又称 I/O 接口，是 CPU 与设备之间的交接面。由于主机和 I/O 设备\n的工作方式和工作速度有很大差异，I/O 端口就应运而生。在执行一条指令时，CPU 使用\n地址总线选择所请求的 I/O 端口，使用数据总线在 CPU 寄存器和端口之间传输数据。故选…\nD 项。", "passage": ""}, {"id": 24, "section": "cs", "type": "single", "stem": "下列关于队列的叙述中正确的是（… … ）。", "options": {"A": "在队列中只能插入数据", "B": "在队列中只能删除数据", "C": "队列是先进先出的线性表", "D": "队列是先进后出的线性表"}, "answer": "C", "analysis": "【解析】队列是先进先出的线性表，在队列中可以插入数据，也可以删除数据，在队\n尾插入，队首删除。故选 C 项。", "passage": ""}, {"id": 25, "section": "cs", "type": "single", "stem": "在系统内存中设置磁盘缓冲区的主要目的是（… … ）。", "options": {"A": "减少平均寻道时间", "B": "减少磁盘 I/O 次数", "C": "提高磁盘数据可靠性", "D": "实现设备无关性"}, "answer": "B", "analysis": "在系统内存中设置磁盘缓冲区的主要目的是减少磁盘 I/O 次数。磁盘缓冲区\n是硬盘与外部总线交换数据的场所，它对性能的影响大大超过磁盘缓存对性能的影响。故\n选 B 项。", "passage": ""}, {"id": 26, "section": "cs", "type": "single", "stem": "MVC（Model-View-Controller，模型 - 视图 - 控制器）是一种广泛流行的软件设计模式，\n也是 J2EE 平台上推荐的一种设计模型，其中，（… … ）主要表现用户界面。", "options": {"A": "视图", "B": "模型\n处理能力、（… … ）等。", "C": "", "D": ""}, "answer": "A", "analysis": "MVC 模式代表 Model-View-Controller（模型 - 视图 - 控制器）模式。这种模\n式用于应用程序的分层开发。Model（模型）代表一个存取数据的对象或 JAVA POJO。它\n也可以带有逻辑，在数据变化时更新控制器。View（视图）代表模型包含的数据的可视化，\n主要表现用户界面。Controller（控制器）作用于模型和视图上，它控制数据流向模型对象，\n并在数据变化时更新视图。它使视图与模型分离开。故选 A 项。", "passage": ""}, {"id": 27, "section": "cs", "type": "single", "stem": "面向消息中间件通过高效可靠的（… … ），在分布式环境下扩展进程间的通信，\n可支撑多种通信协议、语言、应用程序、硬件和软件平台。", "options": {"A": "消息扩展机制", "B": "消息共享机制", "C": "消息传递机制", "D": "消息处理机制"}, "answer": "C", "analysis": "面向消息中间件（Message-Oriented Middleware, MOM）：利用高效可靠的消\n息传递机制进行平台无关的数据传递，并可基于数据通信进行分布系统的集成。通过提供\n消息传递和消息队列模型，可在分布环境下扩展进程间的通信，并支持多种通信协议、语言、\n应用程序、硬件和软件平台。故选 C 项。", "passage": ""}, {"id": 28, "section": "cs", "type": "single", "stem": "对数据库管理系统评价的主要性能指标有数据所允许的索引数量和最大并发事务", "options": {"A": "MIPS", "B": "最大连接数", "C": "支持协议和标准", "D": "时延抖动"}, "answer": "B", "analysis": "对数据库管理系统评价的主要性能指标有数据所允许的索引数量、最大并发\n事务处理能力、最大连接数等。故选 B 项。", "passage": ""}, {"id": 29, "section": "cs", "type": "single", "stem": "李某在书店租到一张带有注册商标的应用软件光盘，擅自复制后在网络进行传播，\n其行为是侵犯（… … ）的行为。", "options": {"A": "商标权", "B": "注册商标专用权", "C": "软件著作权", "D": "署名权"}, "answer": "C", "analysis": "计算机软件著作权：是指自然人、法人或者其他组织对计算机软件作品享有\n的财产权利和精神权利的总称。根据我国《计算机软件保护条例》的规定，软件著作权人\n享有下列各项权利：（1）发表权，即决定软件是否公之于众的权利；（2）署名权，即表\n糖糖老师：1明开发者身份，在软件上署名的权利；（3）修改权，即对软件进行增补、删节，或者改\n变指令、语句顺序的权利；（4）复制权，即将软件制作一份或者多份的权利；（5）发行权，\n即以出售或者赠与方式向公众提供软件的原件或者复制件的权利；（6）出租权，即有偿\n许可他人临时使用软件的权利，但是软件不是出租的主要标的的除外；（7）信息网络传\n播权，即以有线或者无线方式向公众提供软件，使公众可以在其个人选定的时间和地点获\n得软件的权利；（8）翻译权，即将原软件从一种自然语言文字转换成另一种自然语言文\n字的权利；（9）应当由软件著作权人享有的其他权利。\n\n2022 年银保监会招录考试计算机岗·专业知识真题卷答案解析\n本题中李某侵犯了该软件著作权人的信息网络传播权。故选 C 项。", "passage": ""}, {"id": 30, "section": "cs", "type": "single", "stem": "下列选项中不属于虚拟化主要特征的是（… … ）。", "options": {"A": "高扩展性", "B": "高可用性", "C": "高安全性", "D": "实现技术简单"}, "answer": "D", "analysis": "虚拟化是指通过虚拟化技术将一台计算机虚拟成多台逻辑计算机，主要特征\n包括封装、独立、隔离、分区、高扩展性、高可用性、高安全性等。故选 D 项。", "passage": ""}, {"id": 31, "section": "cs", "type": "single", "stem": "将高级语言源程序翻译成目标程序的是（… … ）。", "options": {"A": "解释程序", "B": "编译程序", "C": "链接程序", "D": "汇编程序"}, "answer": "B", "analysis": "将高级语言程序翻译成目标程序的是编译程序。故选 B 项。", "passage": ""}, {"id": 32, "section": "cs", "type": "single", "stem": "某公司承接一个互联网企业的开发项目，由于互联网业务变化较快，无法在项目\n初期准确确定出项目需求，作为项目经理应首先考虑的开发模型是（… … ）。", "options": {"A": "瀑布模型", "B": "V 模型", "C": "螺旋模型", "D": "原型化模型"}, "answer": "D", "analysis": "8984351279\n【解析】瀑布模型简单易用，开发进程比较严格，要求在项目开发前，项目需求已经\n被很好地理解，也很明确，项目实施过程中发生需求变更的可能性小。V 模型在瀑布模型\n的基础上，强调测试过程与开发过程的对应性和并行性，同样要求需求明确，而且很少有\n需求变更的情况发生。螺旋模型表现为瀑布模型的多次迭代，主要是针对风险比较大的项\n目而设计的一种软件开发过程模型，主要适用于规模很大的项目，或者采用了新技术以及\n不确定因素和风险限制了项目进度的项目。原型模型是在需求阶段快速构建一部分系统的\n生存期模型，主要是在项目前期需求不明确，或者需要减少项目不确定性的时候采用。原\n型化可以尽快地推出一个可执行的程序版本，有利于尽早占领市场。综上所述，该企业应\n该采用原型化模型。故选 D 项。", "passage": ""}, {"id": 33, "section": "cs", "type": "single", "stem": "下列任务中，不属于软件工程需求分析阶段的是（… … ）。", "options": {"A": "分析软件系统的数据要求", "B": "确定软件系统的功能需求", "C": "确定软件系统的性能要求", "D": "确定软件系统的运行平台"}, "answer": "D", "analysis": "软件工程需求分析阶段主要确定软件系统的功能需求、性能要求、界面和分\n析软件系统的数据要求。故选 D 项。", "passage": ""}, {"id": 34, "section": "cs", "type": "single", "stem": "内容耦合是指（… … ）。", "options": {"A": "两个模块之间传递的是数据结构", "B": "一个模块调用另一个模块时，传递的是控制变量", "C": "通过一个公共数据环境相互作用的那些模块间的耦合", "D": "一个模块直接使用另一个模块的内部数据，或通过非正常入口而转入另一个模块内部"}, "answer": "D", "analysis": "内容耦合是指如果一个模块与另一个模块的内部属性有关，不经调用直接使\n用另一个模块的程序代码或内部数据，那么这两个模块之间就存在内容耦合，也就是一个\n模块直接使用另一模块内部的数据，或通过非正常入口转入另一模块的内部。故选 D 项。", "passage": ""}, {"id": 35, "section": "cs", "type": "single", "stem": "Java 语言是（… … ）。", "options": {"A": "面向问题的解释型高级编程语言", "B": "面向机器的低级编程语言", "C": "面向过程的编译型高级编程语言", "D": "面向对象的解释型高级编程语言"}, "answer": "D", "analysis": "编程语言大致分为面向机器，面向过程和面向对象 3 种结构，Java 语言是面\n向对象的解释型高级编程语言。故选 D 项。", "passage": ""}, {"id": 36, "section": "cs", "type": "single", "stem": "一个", "options": {"A": "本程序的 main 函数开始，到 main 函数结束", "B": "本程序文件的第一个函数开始，到本程序文件的最后一个函数结束", "C": "本程序的 main 函数开始，到本程序文件的最后一个函数结束", "D": "本程序文件的第一个函数开始，到本程序 main 函数结束"}, "answer": "A", "analysis": "一个 C 程序的执行是本程序的 main 函数开始，到 main 函数结束，中间会调\n用用户自定义函数。故选 A 项。", "passage": ""}, {"id": 37, "section": "cs", "type": "single", "stem": "关于软件测试，以下说法错误的是（… … ）。", "options": {"A": "测试能提高软件的质量，但是提高质量不能依赖测试", "B": "测试只能证明缺陷存在，不能证明缺陷不存在", "C": "开发人员测试自己的程序后，可作为该程序已经通过测试的依据", "D": "80% 的缺陷聚集在 20% 的模块中，经常出错的模块改错后还会经常出错"}, "answer": "C", "analysis": "软件测试是提高软件质量的一种重要手段，测试能提高软件的质量，但是提\n125\n\n2022 年银保监会招录考试计算机岗·专业知识真题卷答案解析\n高质量不能依赖测试；软件测试的目的是发现错误和缺陷，只能证明缺陷存在，不能证明\n缺陷不存在；80% 的缺陷聚集在 20% 的模块中，经常出错的模块改错后还会经常出错；\n通常情况下，不让开发人员测试自己的程序，即使测试了也不能作为该程序已经通过测试\n的依据。故选 C 项。", "passage": ""}, {"id": 38, "section": "cs", "type": "single", "stem": "对软件是否能达到用户所期望的要求的测试称为（… … ）。", "options": {"A": "集成测试", "B": "有效性测试", "C": "系统测试", "D": "验收测试"}, "answer": "D", "analysis": "验收测试是部署软件之前的最后一个测试操作。在软件产品完成了单元测试、\n集成测试和系统测试之后，产品发布之前所进行的软件测试活动。它是技术测试的最后一\n个阶段，也称为交付测试。验收测试的目的是判断软件是否能达到用户所期望的要求，确\n保软件准备就绪，并且可以让最终用户将其用于执行软件的既定功能和任务。故选 D 项。", "passage": ""}, {"id": 39, "section": "cs", "type": "single", "stem": "面向对象技术中，对象是类的实例，对象有三种成分：（… … ）、属性和方法。", "options": {"A": "标识", "B": "规则", "C": "封装", "D": "消息"}, "answer": "A", "analysis": "对象有三种成分：标识、属性和方法（或操作）。每个对象都有自己的标识，\n表示该对象的状态。对象中的属性只能够通过该对象所提供的操作来存取或修改。操作也\n称为方法或服务，它规定了对象的行为，表示对象所提供的服务。故选 A 项。", "passage": ""}, {"id": 40, "section": "cs", "type": "single", "stem": "某政府部门计划采购一批服务，但是采用公开招标方式的费用占该采购项目总价\n值的比例过大，该部门可依法采用（… … ）方式采购。", "options": {"A": "邀请招标", "B": "单一来源", "C": "竞争性谈判", "D": "询价"}, "answer": "A", "analysis": "根据《政府采购法》的规定，对于采用公开招标方式的费用占政府采购项目\n总价值的比例过大的货物或服务，其适用的政府采购方式是邀请招标方式。邀请招标也称\n选择性招标，是由采购人根据供应商或承包商的资信和业绩，选择一定数目的法人或其他\n组织（不能少于 3 家），向其发出投标邀请书，邀请他们参加投标竞争，从中选定中标供\n应商的一种采购方式。故选 A 项。", "passage": ""}, {"id": 41, "section": "cs", "type": "single", "stem": "某手机应用系统上线后，收到老年用户多起投诉：界面繁琐，字体太小，使用不方…\n便。这反映项目组在（… … ）工作中存在不足。", "options": {"A": "变更控制", "B": "识别干系人", "C": "质量控制", "D": "团队建设"}, "answer": "B", "analysis": "本题属于项目组在需求分析中，没有准确识别干系人。故选 B 项。", "passage": ""}, {"id": 42, "section": "cs", "type": "single", "stem": "CMM 模型将软件过程的成熟度划分为 5 级，其中在（… … ）使用定量分析来不断\n改进和管理软件过程。", "options": {"A": "优化级", "B": "管理级", "C": "由于是常规产品，抽检 5 台 责人的行为（… … ）。\n8984351279", "D": "可重复级\n管理相关规定，以下质量检验方法中正确的是（… … ）。"}, "answer": "A", "analysis": "CMM/CMMI 将软件过程的成熟度分为 5 个等级，以下是 5 个等级的基本特征。\n（1）初始级：软件过程是无序的，有时甚至是混乱的，对过程几乎没有定义，成功\n糖糖老师：1取决于个人努力。管理是反应式的。\n（2）已管理级：建立了基本的项目管理过程来跟踪费用、进度和功能特性。制定了\n必要的过程纪律，能重复早先类似应用项目取得的成功经验。\n（3）已定义级：已将软件管理和工程两方面的过程文档化、标准化，并综合成该组\n织的标准软件过程。所有项目均使用经批准、剪裁的标准软件过程来开发和维护软件，软\n件产品的生产在整个软件过程是可见的。目前，公司需要申请的就是已定义级别，通常称\n为 CMMI3。\n126\n\n（4）量化管理级：分析对软件过程和产品质量的详细度量数据，对软件过程和产品\n都有定量的理解与控制。管理有一个作出结论的客观依据，管理能够在定量的范围内预测\n性能。\n（5）优化管理级：可集中精力改进过程，采用新技术、新方法。拥有防止出现缺陷、\n识别薄弱环节以及加以改进的手段。可取得过程有效性的统计数据，并可据此进行分析，\n从而得出最佳方法。每个等级都被分解为过程域，特殊目标和特殊实践，通用目标、通用\n实践和共同特性。\n管理软件过程。\n故选 A 项。", "passage": ""}, {"id": 43, "section": "cs", "type": "single", "stem": "某单位新进一批 500 台不同型号的 PC 机，均由同一设备生产厂家提供，按照质量", "options": {"A": "对本批次设备进行随机抽检", "B": "对该批次产品每台进行检验", "C": "", "D": "针对不同型号进行抽检"}, "answer": "D", "analysis": "8984351279\nCMM 模型将软件过程的成熟度划分为 5 级，其中在优化级使用定量分析来不断改进和\n【解析】按题意，由于 500 台不同型号的 PC 机，均由同一设备生产厂家提供，可以\n针对不同型号进行抽检。故选 D 项。", "passage": ""}, {"id": 44, "section": "cs", "type": "single", "stem": "某银行软件开发部参与开发管理系统软件的程序员王某，辞职到另一银行任职，\n于是该项目负责人将该管理系统软件开发者的署名更改为李某（接王某工作）。该项目负", "options": {"A": "侵犯了王某开发者身份权（署名权）", "B": "不构成侵权，因为程序员王某不是软件著作权人", "C": "只是行使管理者的权利，不构成侵权", "D": "不构成侵权，因为程序员王某已不是项目组成员"}, "answer": "A", "analysis": "《计算机软件保护条例》第八条明确，软件著作权人享有署名权（即表明开\n发者身份的权利），但在职务软件中，软件著作权归单位所有，而实际开发者作为作者仍\n享有署名权。王某作为银行员工，在任职期间参与开发管理系统软件，该软件属于职务作品。\n软件著作权（如复制权、发行权等）归银行所有，但王某作为实际开发者之一，依法享有\n署名权（开发者身份权），即有权要求在软件上被署名为开发者。项目负责人将软件开发\n者署名从王某更改为李某，移除了王某的署名，这侵犯了王某的署名权。故选 A 项。", "passage": ""}, {"id": 45, "section": "cs", "type": "single", "stem": "项目整体评估是把项目看成一个整体，权衡各种要素之间关系的评估，整体性体\n现在对（… … ）等方面的集成。", "options": {"A": "经济、技术运行、环境、风险", "B": "沟通、计划、变更", "C": "资源、管理、人员", "D": "文档、说明、软件、硬件"}, "answer": "A", "analysis": "项目整体评估是把项目看成一个整体，权衡各种要素之间关系的评估，整体\n性体现在对经济、技术运行、环境、风险等方面的集成。故选 A 项。", "passage": ""}, {"id": 46, "section": "cs", "type": "single", "stem": "在数据库系统的体系结构中，对一个表创建视图，构建的是数据库的（… … ）。", "options": {"A": "内模式和外模式 / 内模式映像", "B": "模式和模式 / 内模式映像", "C": "模式和模式 / 外模式映像", "D": "外模式和外模式 / 模式映像"}, "answer": "D", "analysis": "在数据库系统的体系结构中，三级模式中视图对应外模式，表对应模式，存\n储文件对应内模式。对一个表创建视图，构建的是数据库的外模式和外模式 / 模式映像。\n故选 D 项。", "passage": ""}, {"id": 47, "section": "cs", "type": "single", "stem": "在 DBS 中，数据独立性是指（… … ）。", "options": {"A": "数据之间相互独立", "B": "应用程序与 DB 的结构之间相互独立", "C": "数据的逻辑结构与物理结构相互独立", "D": "数据与磁盘之间相互独立"}, "answer": "B", "analysis": "数据独立性是指应用程序和数据结构之间相互独立，互不影响。故选 B 项。", "passage": ""}, {"id": 48, "section": "cs", "type": "single", "stem": "下列关于关系模型的参照完整性规则的叙述中，错误的是（… … ）。", "options": {"A": "外键和相应的主键需定义在相同值域上", "B": "外键和相应的主键可以不同名", "C": "参照关系模式和被参照关系模式可以是同一个关系模式", "D": "外键值不可以为空值"}, "answer": "D", "analysis": "外键值可以为空，其它选项说法正确。故选 D 项。", "passage": ""}, {"id": 49, "section": "cs", "type": "single", "stem": "关于 Left join、Inner join、Right join 以下描述错误的是（… … ）。", "options": {"A": "Left join 返回左表中所有记录和右表中联结字段相等的记录", "B": "Right join 返回包括右表中的所有记录和左表中联结字段相等的记录", "C": "Inner join 只返回两个表中联结字段相等的记录", "D": "三个关联查询中 Left join 查询的记录最少"}, "answer": "D", "analysis": "Left join 返回左表中所有记录和右表中连接字段相等的记录；Right join 返回\n包括右表中的所有记录和左表中连接字段相等的记录；Inner join 只返回两个表中连接字段\n相等的记录；三个关联查询中 Inner join 查询的记录最少。故选 D 项。", "passage": ""}, {"id": 50, "section": "cs", "type": "single", "stem": "如果有 10 个不同的实体集，它们之间存在着 12 个不同的二元联系（两个实体集\n之间的联系），其中 3 个 1：1 联系、4 个 1：N 联系、5 个 M:N 联系，那么根据 E-R 模型\n转换成关系模型的规则，这个 E-R 结构转换成的关系模式集中，主键和外键的总数分别为\n（… … ）。", "options": {"A": "14、12", "B": "15、15", "C": "15、17", "D": "19、19"}, "answer": "C", "analysis": "本题考查数据库设计相关知识主键个数即关系模式个数，本题中有 10 个实体、\n5 个 M:N 的关系，转换后应有 15 个关系模式，则有 15 个主键。外键是有联系产生的，1:1、\n1:N 联系均有一个外键，M:N 有两个外键，则外键 =3+4+5*2=17。故选 C 项。", "passage": ""}, {"id": 51, "section": "cs", "type": "single", "stem": "设计数据库时，以下不能优化查询效率的措施是（… … ）。", "options": {"A": "将数据、日志、索引放在同一 I/O 设备上，增加读取速度", "B": "分割数据表，减少表的尺寸", "C": "数据存储时适当进行数据冗余，减少数据表间的连接操作", "D": "在 IN 后面值的列表中，将出现频繁的值放在最前面"}, "answer": "A", "analysis": "数据库优化查询效率的措施包括：对查询语句的优化，分表分库，适当的数\n据冗余，以减少数据库表之间的链接操作，提高查询速度。数据和日志通常放在不同 I/O\n设备上。故选 A 项。", "passage": ""}, {"id": 52, "section": "cs", "type": "single", "stem": "在数据库技术中，“脏数据”是指（… … ）。", "options": {"A": "锁是一种特殊的二元信号量", "B": "为了避免活锁现象的发生，DBMS 采用资源分配图的方法来处理事务的数据操作请求", "C": "对于每个需要撤销的死锁事务，可以简单地放弃该事务已经完成的全部操作，重新\n启动该事务", "D": "在顺序加锁中，维护数据项的加锁顺序很困难，代价也非常大"}, "answer": "D", "analysis": "当一个事务正在访问数据，并且对数据进行了修改，而这种修改还没有提交\n到数据库中，这时，另外一个事务也访问这个数据，然后使用了这个数据。因为这个数据\n是还没有提交的数据，那么另外一个事务读到的这个数据是脏数据。故选 D 项。", "passage": ""}, {"id": 53, "section": "cs", "type": "single", "stem": "", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "B", "analysis": "为了避免活锁现象的发生，DBMS 一般采用先来先服务的策略来处理事务的\n数据操作请求。故选 B 项。", "passage": ""}, {"id": 54, "section": "cs", "type": "single", "stem": "在面向对象数据库（OODB）中，包含其他对象的对象，称为（… … ）。", "options": {"A": "复合对象", "B": "持久对象", "C": "超对象", "D": "嵌套对象"}, "answer": "A", "analysis": "在面向对象数据库中，包含其他对象的对象，称为复合对象。故选 A 项。", "passage": ""}, {"id": 55, "section": "cs", "type": "single", "stem": "联机分析处理（OLAP）与联机事务处理（OLTP）的区别是（… … ）。", "options": {"A": "OLAP 针对数据库，OLTP 针对数据仓库", "B": "OLAP 要求响应时间合理，OLTP 要求响应时间快", "C": "OLAP 主要用于更新事务，OLTP 用于分析数据", "D": "OLAP 面向操作人员，OLTP 面向决策人员"}, "answer": "B", "analysis": "本题考查对数据挖掘相关概念的掌握。联机分析处理（OLAP）用于数据挖掘，\n从数据仓库中分析数据，为决策提供依据，要求响应时间合理；联机事务处理（OLTP）用\n糖糖老师：1于更新事务，将数据写入数据库，面向操作人员，要求响应时间合理。故选 B 项。", "passage": ""}, {"id": 56, "section": "cs", "type": "single", "stem": "以下 IP 地址中属于私网地址的是（… … ）。", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "C", "analysis": "【 解 析 】A 类 地 址 中 私 网 地 址 是 10.*.*.*;B 类 地 址 中 私 网 地 址 是 172.16.0.0~\n172.31.255.255;C 类地址中私网地址是 192.168.*.*；故选 C 项。", "passage": ""}, {"id": 57, "section": "cs", "type": "single", "stem": "一个 16 个端口的以太网交换机，冲突域和广播域的个数分别是（… … ）。", "options": {"A": "1、1", "B": "16、16", "C": "1、16", "D": "16、1"}, "answer": "D", "analysis": "交换机每个接口是一个冲突域，所有接口是一个广播域。故选 D 项。", "passage": ""}, {"id": 58, "section": "cs", "type": "single", "stem": "在常用的传输介质中，带宽最大、信号传输衰减最小，抗扰能力最强的传输质（… … ）。", "options": {"A": "双绞线", "B": "同轴电缆", "C": "光纤", "D": "无线信道"}, "answer": "C", "analysis": "2022 年银保监会招录考试计算机岗·专业知识真题卷答案解析\n【解析】在常用的传输介质中，带宽最大、信号传输衰减最小，抗扰能力最强的传输\n质是光纤。故选 C 项。", "passage": ""}, {"id": 59, "section": "cs", "type": "single", "stem": "邮件客户端软件使用（… … ）协议从电子部件服务器上获取电子邮件。", "options": {"A": "SMTP", "B": "POP3", "C": "TCP", "D": "UDP"}, "answer": "B", "analysis": "SMTP 即简单邮件传输协议。它是一组用于从源地址到目的地址传输邮件的\n规范，通过它来控制邮件的中转方式。SMTP 协议属于 TCP/IP 协议簇，它帮助每台计算机\n在发送或中转信件时找到下一个目的地。SMTP 服务器就是遵循 SMTP 协议的发送邮件服\n件的。故选 B 项。", "passage": ""}, {"id": 60, "section": "cs", "type": "single", "stem": "当我们需要检测某远程服务器上的某项服务其端口是否正常打开时，可以使用\n（… … ）命令来借助判定。", "options": {"A": "ping", "B": "telnet", "C": "traceroute", "D": "netstat"}, "answer": "B", "analysis": "8984351279\n务器。POP3 即邮局协议的第 3 个版本，它规定怎样将个人计算机连接到 Internet 的邮件服\n务器和下载电子邮件的电子协议。它是因特网电子邮件的第一个离线协议标准，POP3 允\n许用户从服务器上把邮件存储到本地主机（即自己的计算机）上，同时删除保存在邮件服\n务器上的邮件，而 POP3 服务器则是遵循 POP3 协议的接收邮件服务器，用来接收电子邮\n【解析】测试某个端口是否开启，在 cmd 下输入 telnet 之后会出现一个窗口，按照提\n示输入 help 可以查看选项。故选 B 项。", "passage": ""}, {"id": 61, "section": "cs", "type": "single", "stem": "TCP/IP 模型的网络层提供的是（… … ）。", "options": {"A": "无连接不可靠的数据报服务", "B": "无连接可靠的数据报服务", "C": "有连接不可靠的虚电路服务", "D": "有连接可靠的虚电路服务"}, "answer": "A", "analysis": "TCP/IP 模型的网络层提供的是无连接不可靠的数据报服务。故选 A 项。\n注：网络层提供的两种服务：面向连接的虚电路服务、无连接的数据报服务。\n数据包在传输过程中可能会出现误码，也有可能由于路由器繁忙而被路由器丢弃，还\n有可能出现按序发送的数据包不能按序到达接收方。如果网络层对于上述传输错误不采取\n任何措施，则提供的是不可靠传输服务；如果网络层对于上述传输错误采取措施并使得接\n收方能正确接收发送方所发送的数据包，则提供的是可靠传输服务。不同网络体系结构所\n提供的服务可能是不同的，例如因特网使用的 TCP/IP 协议体系的网际层提供的是无连接\n的不可靠的数据报服务，而 ATM、帧中继和 X.25 的网络层提供的都是面向连接的、可靠\n的虚电路服务。", "passage": ""}, {"id": 62, "section": "cs", "type": "single", "stem": "物理层的主要功能是透明地完成相邻节点之间原始（… … ）的传输。", "options": {"A": "数据包", "B": "帧", "C": "报文", "D": "比特流"}, "answer": "D", "analysis": "物理层的主要功能是透明的完成相邻节点之间原始比特流的传输。故选 D 项。", "passage": ""}, {"id": 63, "section": "cs", "type": "single", "stem": "SMTP 使用的端口号是（… … ）。", "options": {"A": "21", "B": "23", "C": "25", "D": "110"}, "answer": "", "analysis": "参考原卷解析", "passage": ""}, {"id": 64, "section": "cs", "type": "single", "stem": "下列隧道协议中工作在网络层的是（… … ）。", "options": {"A": "SSL", "B": "L2TP", "C": "IPSec", "D": "PPTP"}, "answer": "C", "analysis": "隧道协议中工作在网络层的是 IPSeC。故选 C 项。\n127\n\n2022 年银保监会招录考试计算机岗·专业知识真题卷答案解析", "passage": ""}, {"id": 65, "section": "cs", "type": "single", "stem": "不属于物联网技术三层架构的是（… … ）。", "options": {"A": "网络层", "B": "传输层", "C": "感知层", "D": "应用层"}, "answer": "B", "analysis": "物联网从架构上面可以分为感知层、网络层和应用层。\n（1）感知层：负责信息采集和物物之间的信息传输，信息采集的技术包括传感器、\n条码和二维码、RFID 射频技术、音视频等多媒体信息，信息传输包括远近距离数据传输\n技术、自组织组网技术、协同信息处理技术、信息采集中间件技术等传感器网络。感知层\n是实现物联网全面感知的核心能力，是物联网中包括关键技术、标准化方面、产业化方面\n亟待突破的部分，关键在于具备更精确、更全面的感知能力，并解决低功耗、小型化和低\n成本的问题。\n（2）网络层：是利用无线和有线网络对采集的数据进行编码、认证和传输，广泛覆\n盖的移动通信网络是实现物联网的基础设施，是物联网三层中标准化程度昀高、产业化能\n力昀强、昀成熟的部分，关键在于为物联网应用特征进行优化和改进，形成协同感知的网络。\n（3）应用层：提供丰富的基于物联网的应用，是物联网发展的根本目标，将物联网\n技术与行业信息化需求相结合，实现广泛智能化应用的解决方案集，关键在于行业融合、\n信息资源的开发利用、低成本高质量的解决方案、信息安全的保障以及有效的商业模式的\n开发。\n故选 B 项。", "passage": ""}, {"id": 66, "section": "cs", "type": "single", "stem": "用户", "options": {"A": "的公钥", "B": "的私钥", "C": "B 的私钥", "D": "CA 的公钥"}, "answer": "A", "analysis": "按照“谁发出，谁负责”的原则，利用 CA 的公钥验证该证书的真伪，利用\nA 的公钥验证 M 的真实性。故选 A 项。", "passage": ""}, {"id": 67, "section": "cs", "type": "single", "stem": "网络安全技术可以分为主动防御技术和被动防御技术两大类，以下属于主动防御\n技术的是（… … ）。", "options": {"A": "蜜罐技术", "B": "入侵检测技术", "C": "防火墙技术", "D": "恶意代码扫描技术"}, "answer": "A", "analysis": "蜜罐（Honeypot）技术是一种主动防御技术，是入侵检测技术的一个重要发\n展方向。蜜罐是一种在互联网上运行的计算机系统，是专门为吸引并诱骗那些试图非法闯\n入他人计算机系统的人而设计的。蜜罐系统是一个包含漏洞的诱骗系统，它通过模拟一个\n或多个易受攻击的主机和服务，给攻击者提供一个容易攻击的目标。故选 A 项。\n糖糖老师：168.【答案】B\n【解析】套接字一般用（IP 地址：端口号）表示；端口是表示服务的地址，是可以复\n用的；端口可以泄露网络信息。故选 B 项。", "passage": ""}, {"id": 68, "section": "cs", "type": "single", "stem": "互联网上通信双方不仅需要知道对方的地址，也需要知道通信程序的端口号。以\n下关于端口的描述中，不正确的是（… … ）。", "options": {"A": "FTP", "B": "SSH", "C": "SSL", "D": "DHCP"}, "answer": "", "analysis": "参考原卷解析", "passage": ""}, {"id": 69, "section": "cs", "type": "single", "stem": "", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "B", "analysis": "SSH 为 Secure Shell 的缩写，由 IETF 的网络小组（Network Working Group）所制定；\nSSH 为建立在应用层基础上的安全协议。SSH 是较可靠，专为远程登录会话和其他网络服\n务提供安全性的协议。利用 SSH 协议可以有效防止远程管理过程中的信息泄露问题。故选\n128\n\nB 项。", "passage": ""}, {"id": 70, "section": "cs", "type": "single", "stem": "ARP 攻击造成网络无法跨网段通信的原因是（… … ）。", "options": {"A": "发送大量 ARP 报文造成网络堵塞", "B": "伪造网关 ARP 报文使得数据包无法发送到网关", "C": "ARP 攻击破坏了网络的物理连通性", "D": "ARP 攻击破坏了网关设备"}, "answer": "B", "analysis": "ARP 攻击造成网络无法跨网段通信的原因是伪造网关 ARP 报文使得数据包\n无法发送到网关。故选 B 项。", "passage": ""}, {"id": 71, "section": "cs", "type": "single", "stem": "文件类型病毒不能感染的文件类型是（… … ）。", "options": {"A": "COM 类型", "B": "SYS 类型", "C": "HTML 类型", "D": "EME 类型"}, "answer": "C", "analysis": "文件型病毒系计算机病毒的一种，主要通过感染计算机中的可执行文件（.exe）", "passage": ""}, {"id": 72, "section": "cs", "type": "single", "stem": "常见的恶意代码类型有特洛伊木马，蠕虫，病毒、后门、Rootkit、僵尸程序、广告…\n软件，2017 年 5 月爆发的恶意代码 WannaCry 勒索软件属于（… … ）。", "options": {"A": "特洛伊木马", "B": "蠕虫", "C": "后门", "D": "Rootkit\n据库是否为 SQL Server，还可以得到（… … ）。\n8984351279"}, "answer": "B", "analysis": "8984351279\n和命令文件（.com）。文件型病毒是对计算机的源文件进行修改，使其成为新的带毒文件。\n一旦计算机运行该文件就会被感染，从而达到传播的目的。当然还有感染所有视窗操作系\n统可执行文件的病毒，可感染的文件类型包括后缀名是 EXE、DLL 或者 VXD、SYS。故选 C 项。\n【解析】WannaCry（想哭，又叫 Wanna Decryptor），一种“蠕虫式”的勒索病毒软件，\n该恶意软件会扫描电脑上的 TCP 445 端口（Server Message Block/SMB），以类似于蠕虫病\n毒的方式传播，攻击主机并加密主机上存储的文件，然后要求以比特币的形式支付赎金。\n勒索金额为 300 至 600 美元。故选 B 项。", "passage": ""}, {"id": 73, "section": "cs", "type": "single", "stem": "注入语句，http://xxx.xxx.xxx/abc.asp?p=YY and user>0 不仅可以判断服务器的后台数", "options": {"A": "当前连接数据库的用户数量", "B": "当前连接数据库的用户名", "C": "当前连接数据库的用户口令", "D": "当前连接数据库的数据库名"}, "answer": "B", "analysis": "注入语句，http://xxx.xxx.xxx/abc.asp?p= YY and user>0 不仅可以判断服务器的\n后台数据库是否为 SQL Server，还可以得到当前连接数据库的用户名。故选 B 项。", "passage": ""}, {"id": 74, "section": "cs", "type": "single", "stem": "SQL 注入不能做到（… … ）", "options": {"A": "读取敏感信息", "B": "写入文件", "C": "弹出 XSS 窗", "D": "命令执行"}, "answer": "C", "analysis": "SQL 注入是将 Web 页面的原 URL、表单域或数据包输入的参数，修改拼接成\nSQL 语句，传递给 Web 服务器，进而传给数据库服务器以执行数据库命令。如 Web 应用\n程序的开发人员对用户所输入的数据或 cookie 等内容不进行过滤或验证（即存在注入点）\n就直接传输给数据库，就可能导致拼接的 SQL 被执行，获取对数据库的信息以及提权，发\n生 SQL 注入攻击。xxs 攻击是跨站脚本攻击，通过插入恶意脚本，实现对用户游览器的控制。\nSQL 注入不能做到弹出 XSS 窗。故选 C 项。", "passage": ""}, {"id": 75, "section": "cs", "type": "single", "stem": "面向数据挖掘的隐私保护技术主要解决高层应用中的隐私保护问题，致力于研究\n如何根据不同数据挖掘的特征来实现对隐私的保护，从数据挖掘的角度，不属于隐私保护\n技术的是（… … ）。", "options": {"A": "基于数据分析的隐私保护技术", "B": "基于数据失真的隐私保护技术", "C": "基于数据匿名化的隐私保护技术", "D": "基于数据加密的隐私保护技术"}, "answer": "A", "analysis": "从数据挖掘的角度，目前的隐私保护技术主要可以分为三类：基于数据失真\n的隐私保护技术、基于数据加密的隐私保护技术、基于数据匿名化的隐私保护技术。故选\nA 项。", "passage": ""}, {"id": 76, "section": "cs", "type": "single", "stem": "以下内容，不属于突发事件预案组成部分的是（… … ）。", "options": {"A": "应急处理流程", "B": "联系电话表", "C": "事件场景", "D": "应急演练结果"}, "answer": "D", "analysis": "突发事件预案组成包括事件场景描述、应急处理流程、时间处理联系电话表等，\n不包括应急演练结果。故选 D 项。", "passage": ""}, {"id": 77, "section": "cs", "type": "single", "stem": "关于商业银行实施信息科技外包活动应当遵循的要求，以下说法不正确的是（… … ）。", "options": {"A": "在外包合同中约定风险责任和风险转移条款，要求外包商承担风险管理责任… …", "B": "应建立与自身规模、市场地位相适应的供应商关系管理策略", "C": "应建立外包立项，尽职调查，供应商选择、合同签署、日常管理和后评价管理流程", "D": "对于重要的非驻场外包服务，要加强对其安全性、业务连续性的指标考核，每年开\n展实地检查，加强风险评估"}, "answer": "A", "analysis": "银行保险机构在实施信息科技外包时应当坚持以下原则：\n（一）不得将信息科技管理责任、网络安全主体责任外包；\n（二）以不妨碍核心能力建设、积极掌握关键技术为导向；\n（三）保持外包风险、成本和效益的平衡；\n（四）保障网络和信息安全，加强重要数据和个人信息保护；\n（五）强调事前控制和事中监督；\n（六）持续改进外包策略和风险管理措施。\n在外包合同中约定风险责任和风险转移条款，要求外包商承担风险管理责任，属于将\n信息科技管理责任、网络安全主体责任外包，违反了第一条原则。故选 A 项。", "passage": ""}, {"id": 78, "section": "cs", "type": "single", "stem": "（… … ）这一计算机软件著作权权利是不可以转让的。", "options": {"A": "发行权", "B": "复制权", "C": "署名权", "D": "信息网络传播权"}, "answer": "C", "analysis": "《著作权法》第十条 著作权包括下列人身权和财产权：（一）发表权，即\n决定作品是否公之于众的权利；（二）署名权，即表明作者身份，在作品上署名的权利；…\n（三）修改权，即修改或者授权他人修改作品的权利；（四）保护作品完整权，即保护作\n品不受歪曲、篡改的权利；（五）复制权，即以印刷、复印、拓印、录音、录像、翻录、\n翻拍等方式将作品制作一份或者多份的权利；（六）发行权，即以出售或者赠与方式向公\n众提供作品的原件或者复制件的权利；（七）出租权，即有偿许可他人临时使用电影作品\n和以类似摄制电影的方法创作的作品、计算机软件的权利，计算机软件不是出租的主要标\n的的除外；（八）展览权，即公开陈列美术作品、摄影作品的原件或者复制件的权利；（九）\n表演权，即公开表演作品，以及用各种手段公开播送作品的表演的权利；（十）放映权，\n即通过放映机、幻灯机等技术设备公开再现美术、摄影、电影和以类似摄制电影的方法创\n作的作品等的权利；（十一）广播权，即以无线方式公开广播或者传播作品，以有线传播\n或者转播的方式向公众传播广播的作品，以及通过扩音器或者其他传送符号、声音、图像\n的类似工具向公众传播广播的作品的权利；（十二）信息网络传播权，即以有线或者无线\n糖糖老师：1方式向公众提供作品，使公众可以在其个人选定的时间和地点获得作品的权利；（十三）\n摄制权，即以摄制电影或者以类似摄制电影的方法将作品固定在载体上的权利；（十四）\n改编权，即改变作品，创作出具有独创性的新作品的权利；（十五）翻译权，即将作品从\n一种语言文字转换成另一种语言文字的权利；（十六）汇编权，即将作品或者作品的片段\n通过选择或者编排，汇集成新作品的权利；（十七）应当由著作权人享有的其他权利。\n著作权人可以许可他人行使前款第（五）项至第（十七）项规定的权利，并依照约定\n或者本法有关规定获得报酬。著作权人可以全部或者部分转让本条第一款第（五）项至第\n\n2022 年银保监会招录考试计算机岗·专业知识真题卷答案解析\n（十七）项规定的权利，并依照约定或者本法有关规定获得报酬。因此，ABD 均可转让。\n发表权是作者享有的最重要的著作人身权，作者将作品创作完成后，如果不行使其发\n表权，则其他任何著作人身权或著作财产权均无从行使。而至于署名权能否转让，知识产\n权界也有不同的声音，一类声音是持传统观点的不能转让，其理由为署名权为人身权，人\n身权不能让与，另一类声音是认为署名权可以转让。", "passage": ""}, {"id": 79, "section": "cs", "type": "single", "stem": "我国发布的第一个信息安全等级保护的国家标准 GB17859-199，提出将信息系统\n的安全等级划分为（… … ）个等级，并提出每个级别的安全功能要求。", "options": {"A": "8", "B": "7", "C": "6", "D": "5"}, "answer": "D", "analysis": "", "passage": ""}, {"id": 80, "section": "cs", "type": "single", "stem": "关于敏捷软件开发中需要关注的风险，以下说法不正确的是（… … ）。", "options": {"A": "敏捷软件开发通过其执行结构规避和减轻了常见的软件开发风险，但也引入了开发\n过程的不确定性，蕴含了大量风险", "B": "敏捷软件开发风险主要包括人员风险、技术风险、产品风险、过程风险", "C": "敏捷软件开发与传统开发方法不同，在一开始不进行详细的架构设计，因此会带来\n架构体系不稳定和设计不佳的风险", "D": "敏捷开发的过程风险需要关注的方面包括缺乏计划、迭代掌握不佳、缺乏风险管理\n缺乏质量保证措施等\n三、银保监计算机类专业多项选择题：每题 1 分，共 20 题，计 20 分。下面各题，\n每题至少有两个正确答案，少选、多选或错选均不得分。"}, "answer": "C", "analysis": "8984351279\n【解析】我国发布的第一个信息安全等级保护的国家标准 GB 17859-199，提出将信息\n系统的安全等级划分为 5 个等级，即自主保护级、系统审计保护级、安全标识保护级、结\n构化保护级、访问验证保护级，并提出每个级别的安全功能要求。故选 D 项。\n【解析】 在敏捷软件开发过程中从人、过程、产品和技术四个维度进行的风险处理过程。\n（1）人员风险：敏捷软件开发通过频繁沟通、每日站立会议、反馈等方式解决了沟\n通不畅，缺乏协作的问题；通过领导、结对编程、代码集体所有权等方式促进团队协作，\n提高技能素质，应对人员变动，降低矛盾和冲突；通过频繁的产品发布提高人员成就感和\n士气；通过现场开发，降低缺乏客户介入的风险。\n（2）技术风险：敏捷软件开发通过迭代、测试套件、重构等方式适应变化和演进，\n避免了传统的开发方法在一开始就进行架构设计，从而导致架构体系不稳定和设计不佳的\n风险。对于敏捷技能险，可以通过引入敏捷教练、结对编程、学习环的方式加以应对。而\n对于非敏捷软件开发所特有的普适性技术风险，可以通过组织和加强内部技术人员的培训\n和培养，引进能解决项目关键问题的优秀人才，防止优秀人才的流失等方式进行规避。\n（3）产品风险：敏捷软件开发通过迭代、反馈、客户参与的方式解决了构建错误产品、\n功能蔓延、需求镀金、质量低下、客户满意度低等风险。可以通过综合考虑功能价值和风险，\n按照高风险高价值→低风险高价值→低风险低价值→高风险低价值的顺序开发产品功能，\n渐次降低产品的价值风险；通过对净现值、内部收益率、回收期、贴现回收期等经济指标\n的综合分析，规避项目的投资回报风险。\n（4）过程风险：敏捷软件开发通过产品→发布规划→迭代规划→任务逐渐瞄准的形式，\n极大地消除了各种不确定风险。\n故选 C 项。\n129\n\n2022 年银保监会招录考试计算机岗·专业知识真题卷答案解析\n三、银保监计算机类专业多项选择题：每题 1 分，共 20 题，计 20 分。下面各题，\n每题至少有两个正确答案，少选、多选或错选均不得分。", "passage": ""}, {"id": 81, "section": "multi", "type": "multi", "stem": "下列部件中其位数（宽度）一定与机器字长相同的是（… … ）。", "options": {"A": "ALU", "B": "指令寄存器", "C": "通用寄存器", "D": "浮点寄存器"}, "answer": "AC", "analysis": "机器字长是指计算机能直接处理的二进制数据的位数，决定了计算机的运算\n精度。指令字长：一个指令字中包含二进制代码的位数。存储字长：一个存储单元存储一\n串二进制代码，这串二进制代码的位数称为存储字长，存储字长可以是 8 位、16 位、32 位等。\n跟运算相关的 ALU 位数（宽度）一定与机器字长相同，但指令寄存器一定不对。故选 AC 项。", "passage": ""}, {"id": 82, "section": "multi", "type": "multi", "stem": "（… … ）是文件系统应具备的功能。", "options": {"A": "对文件的按名存取", "B": "负责实现访问数据时的逻辑结构到物理结构的转换", "C": "提高磁盘的 I/O 速度", "D": "实现对文件的各种操作"}, "answer": "ABD", "analysis": "文件系统应具备的功能包括管理和调度文件的存储空间，提供文件的逻辑结\n构、物理结构和存储方法，实现文件从标识到实际地址的映射（按名存取），实现文件的\n控制操作和存取操作，实现文件信息的共享并提供可靠的文件保密和保护措施，提供文件\n的安全措施。故选 ABD 项。", "passage": ""}, {"id": 83, "section": "multi", "type": "multi", "stem": "架构权衡分析方法（ATAM）是一种常见的系统架构评估框架，主要在系统开发之前，\n针对（… … ）等质量属性进行评价和折中。", "options": {"A": "性能", "B": "可用性", "C": "安全性", "D": "可修改性"}, "answer": "ABCD", "analysis": "体系结构权衡分析方法（Architecture Tradeoff Analysis Method, ATAM）是一种\n常见的系统架构评估框架，该框架主要关注系统的性能，针对可用性、安全性和可修改性，\n在系统开发之前进行分析、评价与折中。故选 ABCD 项。", "passage": ""}, {"id": 84, "section": "multi", "type": "multi", "stem": "为了提高易读性，源程序模块之前应加入序言性注释，用于说明（… … ）。", "options": {"A": "模块的功能", "B": "语句的功能", "C": "开发历史", "D": "模块的接口"}, "answer": "ACD", "analysis": "注释的作用是说明程序段或语句的功能。为了提高易读性，源程序模块内部\n应加入序言性注释，用于说明模块的功能，该注释内容不应有语句的功能。故选 ACD 项。", "passage": ""}, {"id": 85, "section": "multi", "type": "multi", "stem": "以下关于 Web 应用软件测试的说法中，错误的有（… … ）。", "options": {"A": "对 Web 应用软件进行性能测试时，不需要进行压力测试", "B": "内容测试是 Web 应用软件易用性测试的一项重要内容", "C": "Cookie 测试是 Web 应用软件功能测试的一项重要内容", "D": "是否存在无效链接是 Web 应用软件安全性测试关注的范畴"}, "answer": "ABD", "analysis": "对 Web 应用软件进行性能测试时，需要进行压力测试；性能测试是 Web 应\n用软件易用性测试的一项重要内容；Web 应用软件功能测试主要包括链接测试、表单测试、\n搜索测试、删除测试、cookies 和 session 测试、数据库测试。故选 ABD 项。\n糖糖老师：186.【答案】ABD\n【解析】项目活动投入越多，人们对成功的希望越大，愿意冒的风险也就越小。故选\nABD 项。", "passage": ""}, {"id": 86, "section": "multi", "type": "multi", "stem": "关于项目风险的描述，正确的是（… … ）。", "options": {"A": "风险具有随机性、相对性、可变性", "B": "项目收益越大，人们愿意承担的风险越大", "C": "项目投入越多，人们愿意承担的风险越大", "D": ""}, "answer": "", "analysis": "参考原卷解析", "passage": ""}, {"id": 87, "section": "multi", "type": "multi", "stem": "M 软件公司的软件产品注册商标为 M，为确保公司在市场竞争中占据优势，对员工\n进行了保密约束。此情形下该公司享有（… … ）。", "options": {"A": "商业秘密权", "B": "著作权", "C": "专利权", "D": "商标权"}, "answer": "ABD", "analysis": "关于软件著作权的取得，《计算机软件保护条例》规定：“软件著作权自软\n件开发完成之日起产生。”即软件著作权自软件开发完成之日起自动产生，不论整体还是\n局部，只要具备了软件的属性即产生软件著作权，既不要求履行任何形式的登记或注册手\n130\n\n续，也无须在复制件上加注著作权标记，也不论其是否已经发表都依法享有软件著作权。\n软件公司享有商业秘密权，因为一项商业秘密受到法律保护的依据，必须具备构成商\n业秘密的三个条件，即不为公众所知悉、具有实用性、采取了保密措施。商业秘密权保护\n软件是以软件中是否包含着“商业秘密”为必要条件的。该软件公司组织开发的应用软件\n具有商业秘密的特征，包含着他人不能知道的技术秘密；具有实用性，能为软件公司带来\n经济效益；对职工进行了保密的约束，在客观上已经采取相应的保密措施，所以软件公司\n享有商业秘密权。", "passage": ""}, {"id": 88, "section": "multi", "type": "multi", "stem": "在数据库技术中，关于视图的叙述正确的是（… … ）。", "options": {"A": "视图不存储数据，但可以通过视图访问数据", "B": "视图提供了一种数据安全机制", "C": "视图可以实现数据的逻辑独立性", "D": "视图能够提高对数据的访问效率"}, "answer": "ABC", "analysis": "8984351279\n商标权、专利权不能自动取得，申请人必须履行商标法、专利法规定的申请手续，向\n国家行政部门提交必要的申请文件，申请获准后即可取得相应权利。获准注册的商标通常\n称为注册商标，题目里已经强调了 M 软件公司的软件产品注册商标为 M，所以该公司已经\n享有了商标权，只有专利权还没有申请，故选 ABD 项。\n【解析】视图是数据库系统中的重要机制。视图构建于基本表或视图之上，为用户提\n供一个虚表，与实际存储数据的基本表建立一种映射关系，用户可以像基本表一样对视图\n进行操作，所有通过视图对数据的操作最终都转换成对基本表的操作来实现。可以通过建\n立视图，将视图授权给指定用户，则用户只能访问通过视图可见的数据，对视图外的数据\n起到保护作用，用户无法访问，因此，视图提供了一种数据安全机制。运行中的数据库，\n出于对性能的要求，可能要对已有的基本表进行分解或合并，即数据库重构。此时，数据\n库的模式发生改变，可以重建或修改已有视图，保持视图中的数据项与原有视图或基本表\n中的数据项一致，并映射到修改后的基本表上，实现了数据的逻辑独立性。普通视图只是\n记录相当于把查询语句持久化了，下次再按照这个查询条件来查询一遍，只是添加了一个\n对多表关联更加方便的查询入口而已，并不能实际提高查询效率。故选 ABC 项。", "passage": ""}, {"id": 89, "section": "multi", "type": "multi", "stem": "以下关于数据库设计中范式的描述，正确的是（… … ）。", "options": {"A": "范式级别越高，数据冗余程度越小", "B": "随着范式级别的提高，在需求变化时数据的稳定性越强", "C": "范式级别越高，存储同样的数据就需要分解成更多张表", "D": "范式级别提高，数据库性能（速度）将下降"}, "answer": "ACD", "analysis": "范式级别越高，数据冗余程度越小，存储同样数据就需要分解成更多张表，\n数据库性能（速度）将下降，在需求变化时数据的稳定性将变差，故选 ACD 项。", "passage": ""}, {"id": 90, "section": "multi", "type": "multi", "stem": "在 SQL 语言中，对于匹配串中的通配符描述正确的有（… … ）。", "options": {"A": "_（下划线）：匹配任意 1 个字符", "B": "%（百分号）：匹配 0 个或多个字符", "C": "[]：匹配 [] 口中的任意多个字符", "D": "_（下划线）：匹配 0 个或 1 个字符"}, "answer": "AB", "analysis": "SQL 通配符必须与 LIKE 运算符一起使用。在 SQL 中，可使用以下通配符：\n通配符 % 代表零个或多个字符，_ 仅替代一个字符；[charlist] 字符列中的任何单一字符；\n[^charlist] 或者 [!charlist] 不在字符列中的任何单一字符。故选 AB 项。", "passage": ""}, {"id": 91, "section": "multi", "type": "multi", "stem": "下面选项中，描述 VLAN 特点的是（… … ）。", "options": {"A": "VLAN 间的通信需要借助三层设备", "B": "VLAN 减少了冲突域的数量", "C": "每个 VLAN 需要使用分开的 IP 地址空间", "D": "针对各个 VLAN，交换机都会有一张 MAC 地址表指导数据转发"}, "answer": "ACD", "analysis": "VLAN 叫虚拟局域网，是在原来物理的局域网里面划分出多个逻辑上的工作…\n\n组，也就逻辑上的局域网，每个局域网它是独立的一个广播域，所以不同广播域之间啊，\n是需要三层设备才能转发，A 项正确；一般在网络规划里面，一个 VLAN 是一个地址空间，\n这个地址空间指的意思就是他划分的那个 IP 地址段，网络号是不一样的，C 项正确；针对\n各个 VLAN，交换机里面都有一个 MAC 地址转发表，如果有 VLAN 的话，交换机 MAC 地\n址转发表里面也会记录出这个 VLAN 的 IP 地址，D 项正确；VLAN 是划分广播域的，跟冲\n突域其实没关系，VLAN 的划分增加了广播域的数量，减少了广播域的范围，B 项错误。\n故选 ACD 项。", "passage": ""}, {"id": 92, "section": "multi", "type": "multi", "stem": "从路由协议使用的算法来看，路由协议可以分为（… … ）。", "options": {"A": "距离向量协议", "B": "链路状态协议", "C": "信息收集协议", "D": "平衡型协议"}, "answer": "AB", "analysis": "从路由协议使用的算法来看，路由协议可以分为：距离矢量协议，如 RIP；\n链路状态协议，如 OSPF、ISIS。故选 AB 项。", "passage": ""}, {"id": 93, "section": "multi", "type": "multi", "stem": "DHCP 客户端能从 DHCP 服务器获得（… … ）。", "options": {"A": "DHCP 服务器地址", "B": "邮件服务器地址", "C": "DNS 服务器地址", "D": "Web 服务器地址"}, "answer": "AC", "analysis": "DHCP 客户端能从 DHCP 服务器获得 DHCP 服务器地址、DNS 服务器地址。\n故选 AC 项。", "passage": ""}, {"id": 94, "section": "multi", "type": "multi", "stem": "如果 IPv6 头部包含多个扩展头部，第一个扩展头部不是（… … ）。", "options": {"A": "逐跳头部", "B": "路由选择头部", "C": "分段头部", "D": "认证头部"}, "answer": "BCD", "analysis": "IPv6 头部包含多个扩展头部，第一个扩展头部是逐跳头部。故选 BCD 项。", "passage": ""}, {"id": 95, "section": "multi", "type": "multi", "stem": "下列攻击中，可能导致网络瘫痪的是（… … ）。", "options": {"A": "溢出攻击", "B": "钓鱼攻击", "C": "邮件炸弹攻击", "D": "拒绝服务攻击"}, "answer": "ACD", "analysis": "网络钓鱼是通过大量发送声称来自银行或其他知名机构的欺骗性垃圾邮件，\n意图引诱收信人给出敏感信息（如用户名、口令、账号 ID、ATM PIN 码或信用卡详细信息）\n的一种攻击方式，不会导致网络瘫痪。故选 ACD 项。", "passage": ""}, {"id": 96, "section": "multi", "type": "multi", "stem": "下面关于跨站攻击的描述，正确的是（… … ）。", "options": {"A": "跨站脚本攻击指的是恶意攻击者向访问 Web 页面里插入恶意的 HTML 代码", "B": "跨站脚本攻击简称 XSS", "C": "静态站点不会受到跨站脚本攻击威胁", "D": "造成跨站脚本攻击的原因是网站程序对用户的输入过滤不足"}, "answer": "ABCD", "analysis": "跨站攻击，即 Cross Site Script Execution（通常简写为 XSS）是指攻击者利用\n网站程序对用户输入过滤不足，输入可以显示在页面上对其他用户造成影响的 HTML 代码，\n从而盗取用户资料、利用用户身份进行某种动作或者对访问者进行病毒侵害的一种攻击方\n式。动态站点会受到一种名为“跨站脚本攻击”（Cross Site Scripting, 安全专家们通常将其\n糖糖老师：1缩写成 XSS，原本应当是 css，但为了和层叠样式表（Cascading Style Sheet,CSS）有所区分，\n故称 XSS）的威胁，而静态站点则完全不受其影响。故选 ABCD 项。", "passage": ""}, {"id": 97, "section": "multi", "type": "multi", "stem": "缓冲区溢出漏洞出现的原因有（… … ）。", "options": {"A": "HTTP", "B": "FTP", "C": "SMTP… …", "D": "POP3"}, "answer": "ABCD", "analysis": "缓冲区溢出是指当计算机向缓冲区内填充数据位数时超过了缓冲区本身的容\n量溢出的数据覆盖在合法数据上，程序员通过往程序的缓冲区写超出其长度的内容（不一\n定超出系统负荷），造成缓冲区的溢出，从而破坏程序的堆栈，使程序转而执行其它指令，\n以达到攻击的目的。缓冲区溢出漏洞的形成是技术（语言特性、代码逻辑）和管理（安全意识、\n\n2022 年银保监会招录考试计算机岗·专业知识真题卷答案解析\n测试流程）多重因素共同作用的结果。故选 ABCD 项。", "passage": ""}, {"id": 98, "section": "multi", "type": "multi", "stem": "", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "ABC", "analysis": "防病毒网关是一种网络设备，用以保护网络内（一般是局域网）进出数据的\n安全。主要体现在病毒杀除、关键字过滤（如色情、反动）、垃圾邮件阻止的功能，同时\n部分设备也具有一定防火墙（划分 Vlan）的功能。如果与互联网相连，就需要网关的防病\n毒软件。能够检测进出网络内部的数据，对 HTTP、FTP、SMTP、IMAP、POP3 等多种协\n方面起到了非常大的作用。故选 ABC 项。", "passage": ""}, {"id": 99, "section": "multi", "type": "multi", "stem": "在银行卡风险管理领域，以下哪些措施可以防范伪卡欺诈？（… … ）", "options": {"A": "添加卡片校验码", "B": "增加其他交易验证要素", "C": "限制交易时间", "D": "加强交易监控"}, "answer": "ABD", "analysis": "交易验证要素、加强交易监控。故选 ABD 项。", "passage": ""}, {"id": 100, "section": "multi", "type": "multi", "stem": "商业银行应制定全面的信息科技风险管理策略，包括（… … ）。", "options": {"A": "信息分级与保护", "B": "信息系统开发、测试和维护", "C": "信息科技运行和维护", "D": "访问控制\n\n每题所给的四个选项中，选出最佳选项。\n（一）\nfactory."}, "answer": "ABCD", "analysis": "8984351279\n议的数据进行病毒扫描，一旦发现病毒就会采取相应的手段进行隔离或查杀，在防护病毒\n【解析】在银行卡风险管理领域，防范伪卡欺诈措施包括添加卡片校验码、增加其他\n【解析】《商业银行信息科技风险管理指引目录》第十五条：商业银行应制定全面的\n信息科技风险管理策略，包括但不限于以下领域：（1）信息分级与保护；（2）信息系统\n开发、测试和维护；（3）信息科技运行和维护；（4）访问控制；（5）物理安全；（6）\n人员安全；（7）业务连续性计划与应急处置。故选 ABCD 项。\n四、英语阅读理解题：每小题 0.5 分，共 20 题，计 10 分。阅读下列短文，从\n每题所给的四个选项中，选出最佳选项。", "passage": ""}, {"id": 101, "section": "eng", "type": "single", "stem": "According to Paragraph 1, the U.S. economy became the largest and the most modern in\nthe world because .", "options": {"A": "the U.S. won the American Revolution", "B": "there were many new inventions", "C": "competing with the Europe and eventually surpassed it", "D": "the economy grew steadily for more than 150 years"}, "answer": "B", "analysis": "第一段中“Then Francis Cabot Lowell went to Britain in 1811. He memorized the\nsecrets to constructing a power loom.”表明美国的繁荣得益于工业化的发展，而工业化发展\n的显著特征则为各种新发明的出现及应用，B 项正确，当选。本段重点内容在“whereas”\n之后进行了转折，答案在此后出现，A 项错误，不当选。本段未提及“eventually surpassed\nit”，C 项错误，不当选。D 项未提及，不当选。故选 B 项。", "passage": ""}, {"id": 102, "section": "eng", "type": "single", "stem": "Which of the following best expresses the essential information in the highlighted\nsentence?（ ）", "options": {"A": "New England grew more rapidly than European countries.", "B": "There was rapid growth in all states of the United States, including New England.", "C": "Only one area besides New England in America experienced fast growth.", "D": "Fast growth occurred in New England first in America."}, "answer": "D", "analysis": "“New England was the home of a growing textile industry. It was the first area of\nthe United States to experience such rapid growth.”中“it”指代“New England（新英格兰） ”，\n新英格兰是美国第一个发展速度如此之快的地区，本句只指美国的发展，没有谈到与欧洲\n国家的对比。故选 D 项。\n131\n\n2022 年银保监会招录考试计算机岗·专业知识真题卷答案解析", "passage": ""}, {"id": 103, "section": "eng", "type": "single", "stem": "Which of the following can be inferred about Pennsylvania's industry?（ ）", "options": {"A": "It had a textile industry similar to Massachusetts'\n.", "B": "It often competed against Massachusetts and other states.", "C": "Its iron industry was stronger than in other states.", "D": "It became a richer state than Massachusetts with faster growth."}, "answer": "C", "analysis": "第二段中“This growth also occurred in Pennsylvania. The iron industry pushed that\nstate along and helped it to grow even faster.”证明其发展的是钢铁产业，钢铁产业发展势头\n很盛，与 C 项符合，A 项错误，不当选。B 项文章未提及。文章未将其与 Massachusetts 对…\n比，D 项错误，不当选。故选 C 项。", "passage": ""}, {"id": 104, "section": "eng", "type": "single", "stem": "Why does the author mention practical inventions in Paragraph 4?（ ）", "options": {"A": "To exemplify the reasons for the development of industry in America.", "B": "To show how America became rich by selling new products.", "C": "To illustrate how intelligent American inventors were.", "D": "To prove that most useful inventions came from America."}, "answer": "A", "analysis": "“From the 1850s on, industry in the United States boomed.”是第四段的中心句，\n主要想阐述美国的工业爆发，下文罗列了工业发展欣欣向荣的景象。故选 A 项。", "passage": ""}, {"id": 105, "section": "eng", "type": "single", "stem": "The word“boomed” in the passage is closest in the meaning to“ ”\n.", "options": {"A": "imploded", "B": "increased", "C": "fluctuated", "D": "continued\n（二）\nTesting has replaced teaching in most public schools. My own children's school week is\nframed by pretests, drills, tests, and retests. They know that the best way to read a textbook is to\nlook at the questions at the end of the chapter and then skim the text for the answers. I believe\nthat my daughter Erica, who gets excellent marks, has never read a chapter of any of her school\nteach to the mandated state test."}, "answer": "B", "analysis": "“boomed”指快速发展， A 项意思为“内爆，经济或政治突然崩溃”， B 项为“增\n加”，C 项为“波动”，D 项为“继续”。故选 B 项。", "passage": ""}, {"id": 106, "section": "eng", "type": "single", "stem": "What can be inferred about Erica at school?（ ）", "options": {"A": "She learns the best way of reading a textbook.", "B": "She learns to find answers more than anything else.", "C": "She has not learned anything substantial.", "D": "She likes testing more than learning."}, "answer": "C", "analysis": "【 解 析】 第 一 段“I believe that my daughter Erica, who gets excellent marks, has never\nread a chapter of any of her school textbooks all the way through.”中“ never ”一词证明 A 项\n错误，不当选。通过文章可知，作者对应试教育持反对意见，排除 BD 项。故选 C 项。", "passage": ""}, {"id": 107, "section": "eng", "type": "single", "stem": "What do teachers think about teaching to the mandated state test?（ ）", "options": {"A": "It is commonly recognized.", "B": "It is curiously controversial.", "C": "It has been exceptionally effective.", "D": "It has been inadequately developed."}, "answer": "A", "analysis": "第一段“And teachers are often heard to state proudly and openly that they teach\nto the mandated state test.”提到教师自豪且公开地谈论此事，可见教师是认可的。故选 A 项。", "passage": ""}, {"id": 108, "section": "eng", "type": "single", "stem": "As it is indicated in the second paragraph, the author finds it strange that .", "options": {"A": "skills are determined before tests are set", "B": "tests are used to assess students' skills", "C": "tests restrict the skills necessary for students", "D": "skills are consolidated by taking tests"}, "answer": "A", "analysis": "“Teaching to the test is a curious phenomenon.”“strange”\n作者对应试教育持反对意见，排除 B 项。C 项未提及。第二段“Instead of deciding what\nskills students ought to learn, helping students learn them, and then using some sensible methods\nof assessment to discover whether students have mastered the skills, teachers are encouraged to\nreverse the process.”\n表明作者认为先测试后进行技能训练更好，排除 D 项。故选 A 项。\n糖糖老师：1与“curious”\n同义，", "passage": ""}, {"id": 109, "section": "eng", "type": "single", "stem": "According to the third paragraph,“this fundamental confusion” refers to the fact\nthat .", "options": {"A": "the basic of skills has been discussed too much", "B": "a test of a skill has been equated with acquiring the skill", "C": "the nature and quality of what is taught are rarely concerned", "D": "skills do not develop by being taught to take tests"}, "answer": "B", "analysis": "第三段“We must be careful to avoid mistaking preparation for a test of a skill\nwith the acquisition of that skill. Too many discussions of basic of skills make this fundamental\nconfusion...”中的“this”表明答案在前文。故选 B 项。", "passage": ""}, {"id": 110, "section": "eng", "type": "single", "stem": "The crisis of comprehension is most probably resulted from .", "options": {"A": "students' insufficient phonic and grammar skills", "B": "teaching that takes up much of students' free time", "C": "teaching that emphasizes details rather than the whole", "D": "students' incompetence in thinking about what they read\n（三）\nYou can't see it, smell it, or hear it, and people disagree on how precisely to define it, or\nwhere exactly it comes from. It isn't a school subject or an academic discipline, but it can be\nlearned. It is a quality that is required of artists, but it is also present in the lives of scientists and\nentrepreneurs. All of us benefit from it and we thrive mentally and spiritually when we are able\nto wield it. It is a delicate thing, easily stamped out; in fact, it flourishes most fully when people\nare playful and childlike. Meanwhile, it works best in conjunction with deep knowledge and\nexpertise.\n\n\n\nThis mysterious but teachable quality is creativity, the subject of a recently\n-\npublished report\nby Durham Commission on Creativity and Education. The report concludes that creativity should\nnot inhabit the school curriculum only as it relates to drama, music, art and other obviously\ncreative subjects, but that creative thinking ought to run through all of school life, infusing the\nway humanities and natural sciences are learned.\nThe authors, who focus on education in England, offer a number of sensible recommendations,\ncreativity through the school curriculum."}, "answer": "D", "analysis": "细节理解题。结合最后一段中“However, they have little or no experience reading\n132\n\nor thinking, and talking about what they read.”可知答案。故选 D 项。", "passage": ""}, {"id": 111, "section": "eng", "type": "single", "stem": "What do we learn from the passage about creativity?（ ）", "options": {"A": "It develops best when people are spiritually prepared.", "B": "It is most often wielded by scientists and entrepreneurs.", "C": "It is founded on scientific knowledge and analytical skill.", "D": "It contributes to intellectual growth but can easily be killed."}, "answer": "D", "analysis": "第一段“It is a quality that is required of artists, but it is also present in the lives\nof scientists and entrepreneurs.”表明艺术家、科学家和企业家都需要创造力，B 项“most”\n表达错误。“All of us benefit from it and we thrive mentally and spiritually when we are able\nto wield it.”表明精神世界对创造力有影响，但 A 项“best”一词表述不准确，不当选。C", "passage": ""}, {"id": 112, "section": "eng", "type": "single", "stem": "What is the conclusion of a recently\n-\npublished report?（ ）", "options": {"A": "Art courses should be made obviously creative subjects.", "B": "Drama, music art should be included into the school curriculum.", "C": "Cultivation on creativity should permeate the entire school curriculum.", "D": "Students should learn more obviously creative subjects."}, "answer": "C", "analysis": "8984351279\n项未提及。“It isn't a school subject or an academic discipline, but it can be learned.”和“It is a\ndelicate thing, easily stamped out...”表明 D 项正确，当选。故选 D 项。\n【解析】细节理解题。第二段“The report concludes that creativity should not inhabit\nthe school curriculum only as it relates to drama, music, art and other obviously creative subjects,\nbut that creative thinking ought to run through all of school life, infusing the way humanities and\nnatural sciences are learned.”中的“run through all of school life”表明培养创造力应该渗透整\n个学校课程，C 项正确，当选。注意本句“not only…but…” （不仅…… 而且……）句型，\n课程学校已经开设，不是应该开设，B 项错误，不当选。文中 AD 项在本段未提及，仅在\n第四段出现，已不属于该结论。故选 C 项。", "passage": ""}, {"id": 113, "section": "eng", "type": "single", "stem": "According to the passage, which of the followings is NOT the factor threatening the\nfostering of creativity?（ ）", "options": {"A": "UK's education policy.", "B": "Decreased school budgets.", "C": "Test\n-\noriented teaching.", "D": "Low awareness among students."}, "answer": "D", "analysis": "文章中提到，创造力培养受到多种因素的影响，包括教育政策、学校预算、\n应试教学等，但并未明确提到学生对其的低认知是威胁创造力培养的因素。实际上，文章\n强调了创造力的培养需要广泛的意识和支持，而不仅仅是学生的认知水平。故选 D 项。", "passage": ""}, {"id": 114, "section": "eng", "type": "single", "stem": "What do we learn about the private schools in the UK?（ ）", "options": {"A": "They encourage extracurricular activities.", "B": "They attach great importance to arts education.", "C": "They prioritize arts subjects over maths and sciences.", "D": "Their students are more creative than those in the state sector."}, "answer": "B", "analysis": "ACD 项文中未提及，由第三段“One suggestion from the commission is a network\nof teacher\n-\nled'creativity collaboratives', along the lines of existing maths hubs, with the aim of\nsupporting teaching for creativity through the school curriculum.”可以看出英国很重视创造力\n培养。故选 B 项。", "passage": ""}, {"id": 115, "section": "eng", "type": "single", "stem": "What should be done to meet the future challenges?（ ）", "options": {"A": "Increasing government investment in school education.", "B": "Narrowing the existing gap between the rich and the poor.", "C": "Focusing on meeting the needs of underprivileged students.", "D": "Providing all children with equal access to arts education.\n（四）\nMany of us are fearful of making changes in our work lives—fear is a natural human\ncondition. We feel less threatened when we stick with the familiar. As long as we are receiving a\npaycheck, we tolerate the dissatisfaction. Better to just play it safe.\nBut the safety net we preserve requires a big trade\n-\noff. It often denies us the opportunity to\nexperience work that makes us happy, that is consistent with our desires while still meeting our\nmonetary needs. Yet many of us strap ourselves into jobs in which the only reward is money.\nWe breed cynicism when we treat our work as nothing more than a financial equation, a\nnecessity we tolerate in order to acquire funds to live, with the hope of somehow achieving\nsuccess and happiness along the way. That's really true that most of us want to be happy.\nWe spend 80,000 hours of our lives at work. Yet, we view happiness as something to be\nachieved“outside” of work. We hire ourselves out on Monday through Friday and“live” for the\nweekends.\nMost of us didn't choose our careers to fulfil a purpose or mission. On the contrary, we just\nlooked for“a good job with a good company” , reflecting such criteria as pay, title and would\ngrow over time. Actually, that our careers and work lives would just happen“by accident”"}, "answer": "D", "analysis": "由最后一段中“justice”“\nwrong”和“unfair”可以分析出必须做到公平。故选…\nD 项。", "passage": ""}, {"id": 116, "section": "eng", "type": "single", "stem": "From the Paragraph 1, we can learn that .", "options": {"A": "fear is one of the fundamental traits
