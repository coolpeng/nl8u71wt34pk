banks. Although commercial banks put stock in the Fed, it does not imply they have direct control. The Board of Governors and the heads of the Reserve banks orient their policies to the public interest rather than to the benefit of the private banking system. The U.S. banking system's regulatory apparatus is complex; the authority of the Federal Reserve is shared in some instances, for example, in mergers or the examination of banks with other federal agencies such as the Controller of the Currency（COC） and the Federal Deposit Insurance Cooperation （FDIC）. In the critical area of regulating the nation's money supply in accordance with national economic goals, however, the Federal Reserve is independent within the government.","options":{"A":"strength","B":"structure","C":"order","D":"restriction"},"answer":"B","analysis":"语义题。由第三段“The U.S. banking system's regulatory apparatus is complex...”可知，美国银行系统的监管机制很复杂。A 项，表示力量、力气、长处；B 项，表示组织、机构；C 项，表示命令、顺序；D 项，表示限制、约束。“apparatus”表示组织、机构，与B 项意思相符。故选 B 项。"},{"id":106,"section":"eng","type":"single","stem":"What do we learn from the conclusion of the author's review study?（ ）","passage":"Organic agriculture is a relatively untapped resource for feeding the Earth's population, especially in the face of climate change and other global challenges. That's the conclusion I reached in reviewing 40 years of science comparing the long - term prospects of organic and conventional farming. The review study,“Organic Agriculture in the 21st Century,”is featured as the cover story for the February issue of the journey Nature Plants. It is the first to compare organic and conventional agriculture across the main goals of sustainability identified by the National Academy of Science: productivity, economics, and environment. Critics have long argued that organic agriculture is inefficient, requiring more land to yield the same amount of food. It's true that organic farming produces lower yields, averaging 10 to 20 percent less than conventional. Advocates contend that the environmental advantages of organic agriculture far outweigh the lower yields, and that increasing research and breeding resources for organic system would reduce the yield gap. Sometimes excluded from these arguments is the fact that we already produce enough food to more than feed the world's 7.4 billion people but do not provide adequate access to all individuals. In some cases, organic yields can be higher than conventional. For example, in severe drought conditions, which are expected to increase with climate change in many areas, organic farms can produce as good, if not better, yields because of the higher water - holding capacity of organically farmed soils. What science does tell us is that mainstream conventional farming systems have provided growing supplies of food and other products but often at the expense of other sustainability goals. Conventional agriculture may produce more food, but it often comes at a cost to the environment. Biodiversity loss, environmental degradation, and severe impacts on ecosystem services have accompanied conventional farming systems. With organic agriculture, environmental costs tend to be lower and the benefits greater. Overall, organic farms tend to store more soil carbon, have better soil quality, and reduce soil erosion compared to their conventional counterparts. Organic agriculture also creates less soil and water pollution and lower greenhouse gas emissions. And it's more energy - efficient because it doesn't rely on synthetic fertilizers or pesticides. Organic agriculture is also associated with greater biodiversity of plants, animals, insects and microorganisms as well as genetic diversity. Despite lower yields, organic agriculture is more profitable for farmer because consumers are willing to pay more. Higher prices, called price premiums, can be justified as a way to compensate farmers for providing ecosystem services and avoiding environmental damage or external costs.","options":{"A":"More resources should be tapped for feeding the world's population.","B":"Organic farming may be exploited to solve the global food problem.","C":"The long - term prospects of organic farming are yet to be explored.","D":"Organic farming can be an effective way to solve climate change and other global issues."},"answer":"D","analysis":"主旨题。根据题干的关键词可以快速定位到文章的第一段，由“Organic agriculture is a relatively untapped resource for feeding the Earth's population, especially in the face of climate change and other global challenges.”可以得出作者的观点——有机农业可以用来养活地球人口，应对环境变化和其他全球性挑战。故选 D 项。"},{"id":107,"section":"eng","type":"single","stem":"What is the critics' argument against organic farming?（ ）","passage":"Organic agriculture is a relatively untapped resource for feeding the Earth's population, especially in the face of climate change and other global challenges. That's the conclusion I reached in reviewing 40 years of science comparing the long - term prospects of organic and conventional farming. The review study,“Organic Agriculture in the 21st Century,”is featured as the cover story for the February issue of the journey Nature Plants. It is the first to compare organic and conventional agriculture across the main goals of sustainability identified by the National Academy of Science: productivity, economics, and environment. Critics have long argued that organic agriculture is inefficient, requiring more land to yield the same amount of food. It's true that organic farming produces lower yields, averaging 10 to 20 percent less than conventional. Advocates contend that the environmental advantages of organic agriculture far outweigh the lower yields, and that increasing research and breeding resources for organic system would reduce the yield gap. Sometimes excluded from these arguments is the fact that we already produce enough food to more than feed the world's 7.4 billion people but do not provide adequate access to all individuals. In some cases, organic yields can be higher anic farming? （ ）","passage":"Organic agriculture is a relatively untapped resource for feeding the Earth's population, especially in the face of climate change and other global challenges. That's the conclusion I reached in reviewing 40 years of science comparing the long - term prospects of organic and conventional farming. The review study,“Organic Agriculture in the 21st Century,”is featured as the cover story for the February issue of the journey Nature Plants. It is the first to compare organic and conventional agriculture across the main goals of sustainability identified by the National Academy of Science: productivity, economics, and environment. Critics have long argued that organic agriculture is inefficient, requiring more land to yield the same amount of food. It's true that organic farming produces lower yields, averaging 10 to 20 percent less than conventional. Advocates contend that the environmental advantages of organic agriculture far outweigh the lower yields, and that increasing research and breeding resources for organic system would reduce the yield gap. Sometimes excluded from these arguments is the fact that we already produce enough food to more than feed the world's 7.4 billion people but do not provide adequate access to all individuals. In some cases, organic yields can be higher than conventional. For example, in severe drought conditions, which are expected to increase with climate change in many areas, organic farms can produce as good, if not better, yields because of the higher water - holding capacity of organically farmed soils. What science does tell us is that mainstream conventional farming systems have provided growing supplies of food and other products but often at the expense of other sustainability goals. Conventional agriculture may produce more food, but it often comes at a cost to the environment. Biodiversity loss, environmental degradation, and severe impacts on ecosystem services have accompanied conventional farming table for farmer because consumers are willing to pay more. Higher prices, called price premiums, can be justified as a way to compensate farmers for providing ecosystem services and avoiding environmental damage or external costs.","options":{"A":"It will not be able to meet global food demand.","B":"It is not conductive to sustainable development.","C":"It will eventually give way to organic farming.","D":"It is going mainstream throughout the world."},"answer":"B","analysis":"细 节 题。 由 第 六 段“What science does tell us is that mainstream conventional farming systems have provided growing supplies of food and other products but often at the expense of other sustainability goals.”可知，传统农业系统提供了越来越多的食物和其他产品，但往往是以其他可持续发展目标为代价的。故选 B 项。"},{"id":110,"section":"eng","type":"single","stem":"Why does the author think price premiums of organic food are justifiable?（ ）","passage":"Organic agriculture is a relatively untapped resource for feeding the Earth's population, especially in the face of climate change and other global challenges. That's the conclusion I reached in reviewing 40 years of science comparing the long - term prospects of organic and conventional farming. The review study,“Organic Agriculture in the 21st Century,”is featured as the cover story for the February issue of the journey Nature Plants. It is the first to compare organic and conventional agriculture across the main goals of sustainability identified by the National Academy of Science: productivity, economics, and environment. Critics have long argued that organic agriculture is inefficient, requiring more land to yield the same amount of food. It's true that organic farming produces lower yields, averaging 10 to 20 percent less than conventional. Advocates contend that the environmental advantages of organic agriculture far outweigh the lower yields, and that increasing research and breeding resources for organic system would reduce the yield gap. Sometimes excluded from these arguments is the fact that we already produce enough food to more than feed the world's 7.4 billion people but do not provide adequate access to all individuals. In some cases, organic yields can be higher than conventional. For example, in severe drought conditions, which are expected to increase with climate change in many areas, organic farms can produce as good, if not better, yields because of the higher water - holding capacity of organically farmed soils. What science does tell us is that mainstream conventional farming systems have provided growing supplies of food and other products but often at the expense of other sustainability goals. Conventional agriculture may produce more food, but it often comes at a cost to the environment. Biodiversity loss, environmental degradation, and severe impacts on ecosystem services have accompanied conventional farming systems. With organic agriculture, environmental costs tend to be lower and the benefits greater. Overall, organic farms tend to store more soil carbon, have better soil quality, and reduce soil erosion compared to their conventional counterparts. Organic agriculture also creates less soil and water pollution and lower greenhouse gas emissions. And it's more energy - efficient because it doesn't rely on synthetic fertilizers or pesticides. Organic agriculture is also associated with greater biodiversity of plants, animals, insects and microorganisms as well as genetic diversity. Despite lower yields, organic agriculture is more profitable for farmer because consumers are willing to pay more. Higher prices, called price premiums, can be justified as a way to compensate farmers for providing ecosystem services and avoiding environmental damage or external costs.","options":{"A":"They give farmers going organic a big competitive edge.","B":"They motivate farmers to continue to upgrade farming technology.","C":"Organic farming costs more than conventional farming.","D":"Organic farming does long - term good to ecosystem."},"answer":"A","analysis":"细节题。题干问的是作者认为关于有机食品溢价合理的原因。由最后一段第一句“Despite lower yields, organic agriculture is more profitable for farmer because consumers are willing to pay more.”可知，有机农业对农民来说是有利可图的。故选 A 项。"},{"id":111,"section":"eng","type":"single","stem":"What is the French Paradox according to this passage?（  ）","passage":"For much of the past decade, American and British scientists have been annoyed by the phenomenon known as the French Paradox. Nutritionally speaking, the French have been getting away with murder: They eat all the butter, cream, foie gras, pastry and cheese that their hearts desire, and yet their rates of obesity and heart disease are much lower than ours. The French eat three times as much saturated animal fat as Americans do, and only a third as many die of heart attacks. It's maddening. Baffled, scientists struggled to come up with a few hypotheses: Maybe it was something in the red wine, they said. But while winemakers worldwide celebrated that news, more sober research has suggested that any alcohol—whether Lafite Rothschild, a banana daiquiri or a cold bud—pretty much has the same nice, relaxing effect. So while a little wine is apt to do you good, the French aren't so special in having a drink now and then (though the fact that they drink wine moderately and slowly with meals, instead of downing shots at the bar, could make a difference). After the wine argument, scientists ventured that it must be the olive oil that keeps the French healthy. But this doesn't explain the butter or brie. Then, French scientist Serge Renaud said it's the foie gras that melts away cholesterol. This, too, is dicey: While people in Toulouse - the duck - liver - eating area of France—do indeed have one of the lowest rates of heart disease in the developed world, they actually only eat the delicacy about six times a year. And they're a lot more likely to die of stroke than we are anyway. Other researchers, perhaps sponsored by the garlic and onion industry, suggested that the French Paradox effect is due to garlic and onions. Claude Fischler, a nutritional sociologist at INSERM, says all these single hypotheses are more wishful thinking than science. Last May, researchers writing in the British Medical Journal came up with the least cheerful hypothesis of all. They argued that it's just a matter of time before the French—who are in fact eating more hamburgers and French fries these days—catch up with Americans, and begin suffering the same high rates of cardiovascular disease. These researchers, Malcolm Law and Nicholas Wald, call this the“time lag explanation”for the French Paradox. As far as they are concerned, the McDonaldization (this is a French catch - all term for the importation of fast food and other American cultural horrors) of France will continue at a frantic pace, and it is as inevitable that French men will start keeling over（晕倒）of heart attacks as it is that French women will eventually wear jean shorts and marshmallow tennis shoes on the streets of Paris.","options":{"A":"The French people eat unhealthy food and die of heart attacks each year.","B":"The French eat more nutritious food than Americans but don't worry about getting heart disease.","C":"The French are much less likely to suffer from heart disease although they eat lots of fatty food.","D":"The French are as likely to die of heart attacks as Americans although they eat less fatty food."},"answer":"C","analysis":"主旨题。由第一段的内容“... yet their rates of obesity and heart disease are much lower than ours. The French eat three times as much saturated animal fat as Americans do,and only a third as many die of heart attacks.”可知，他们的肥胖率和心脏病发病率比我们低得多。法国人摄入的饱和动物脂肪是美国人的三倍，而死于心脏病的法国人只有美国人的三分之一。故选 C 项。"},{"id":112,"section":"eng","type":"single","stem":"What can be learned from the second paragraph?（  ）","passage":"For much of the past decade, American and British scientists have been annoyed by the phenomenon known as the French Paradox. Nutritionally speaking, the French ha gh rates of cardiovascular disease. These researchers, Malcolm Law and Nicholas Wald, call this the“time lag explanation”for the French Paradox. As far as they are concerned, the McDonaldization (this is a French catch - all term for the importation of fast food and other American cultural horrors) of France will continue at a frantic pace, and it is as inevitable that French men will start keeling over（晕倒）of heart attacks as it is that French women will eventually wear jean shorts and marshmallow tennis shoes on the streets of Paris.","options":{"A":"The French drink as much wine as people elsewhere.","B":"The French wine has different relaxing effects compared with other wines.","C":"Drinking red wine now and then benefits people a lot.","D":"The French drink wine in ways different from people of other countries."},"answer":"D","analysis":"推断题。根据第二段的内容，科学家们努力提出假设，想证明红酒里有什么特别的东西，其实红酒跟别的酒一样，同样有放松作用。少喝对身体有好处。法国人并不特别喜欢时不时地喝几杯，他们认为吃饭时缓慢地喝适量的葡萄酒会有所改变。故选 D 项。"},{"id":113,"section":"eng","type":"single","stem":"The underlined word“dicey”（Paragraph 3）probably means“  ”.","passage":"For much of the past decade, American and British scientists have been annoyed by the phenomenon known as the French Paradox. Nutritionally speaking, the French have been getting away with murder: They eat all the butter, cream, foie gras, pastry and cheese that their hearts desire, and yet their rates of obesity and heart disease are much lower than ours. The French eat three times as much saturated animal fat as Americans do, and only a third as many die of heart attacks. It's maddening. Baffled, scientists struggled to come up with a few hypotheses: Maybe it was something in the red wine, they said. But while winemakers worldwide celebrated that news, more sober research has suggested that any alcohol—whether Lafite Rothschild, a banana daiquiri or a cold bud—pretty much has the same nice, relaxing effect. So while a little wine is apt to do you good, the French aren't so special in having a . This, too, is dicey: While people in Toulouse — the duck - liver- eating area of France — do indeed have one of the lowest rates of heart disease in the developed world, they actually only eat the delicacy about six times a year.”可知，法国科学家认为是鹅肝融化了胆固醇，这也是不确定的。虽然在法国吃鹅肝的图卢兹地区的人们，确实是发达国家中心脏病发病率最低的，但他们实际上一年只吃六次这种美味。故选 C 项。"},{"id":114,"section":"eng","type":"single","stem":"In the author's opinion, the French Paradox has something to do with   .","passage":"For much of the past decade, American and British scientists have been annoyed by the phenomenon known as the French Paradox. Nutritionally speaking, the French have been getting away with murder: They eat all the butter, cream, foie gras, pastry and cheese that their hearts desire, and yet their rates of obesity and heart disease are much lower than ours. The French eat three times as much saturated animal fat as Americans do, and only a third as many die of heart attacks. It's maddening. Baffled, scientists struggled to come up with a few hypotheses: Maybe it was something in the red wine, they said. But while winemakers worldwide celebrated that news, more sober research has suggested that any alcohol—whether Lafite Rothschild, a banana daiquiri or a cold bud—pretty much has the same nice, relaxing effect. So while a little wine is apt to do you good, the French aren't so special in having a drink now and then (though the fact that they drink wine moderately and slowly with meals, instead of downing shots at the bar, could make a difference). After the wine argument, scientists ventured that it must be the olive oil that keeps the French healthy. But this doesn't explain the butter or brie. Then, French scientist Serge Renaud said it's the foie gras that melts away cholesterol. This, too, is dicey: While people in Toulouse - the duck - liver - eating area of France—do indeed have one of the lowest rates of heart disease in the developed world, they actually only eat the delicacy about six times a year. And they're
