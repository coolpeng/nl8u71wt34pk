borrowing may have helped weaken the moral imperative to repay debts: in the 1960s a prospective borrower met face - to - face with a bank lending officer, but today the borrower gets credit by responding to a junk - mail offer. Other developments also fueled the rise in bankruptcy, including medical bills. A Harvard University study found that about a quarter of filers cited illness or injury as the specific reason for their troubles. Loss of jobs probably also drove some credit - card holders into bankruptcy. Other possible contributors include the growth of the gambling industry in recent years and the Supreme Court's 1977 decision to allow lawyers to advertise directly to the general public. Changes in bankrupt law apparently have had little effect on filings. The Bankrupt Reform Act of 1978 was designed to make it easier for consumers to pay off debts and start anew. As under previous acts, penniless debtors could file for complete discharge of debts under Chapter 7, and debtors with substantial assets could arrange for partial repayment under Chapter 13. Most filers opted for the more generous provisions of Chapter 7. During the six years following implementation of the act, filings rose substantially. The act was amended in 1984 to curb opportunistic petitions. However, filings went in the opposite direction than expected. Evidently, easy credit and other debt - creating forces have been more powerful. The latest legal effort is the Bankruptcy Abuse Prevention and Consumer Protection Act of 2005, which went into effect in October. The new act lays down far more strict standards for debtors, including a test to qualify for Chapter 7 relief. Despite the new restrictions, bankruptcy experts tend to be skeptical or non - committal about the effectiveness in reducing filings.","options":{"A":"having credit cards was a fashionable trend in the 1970s","B":"credit - card companies charged only those unable to repay high rates","C":"many indebted people easily claimed bankruptcy throughout the country","D":"many credit card holders pressed by debt have filed for bankrupt"},"answer":"D","analysis":"事实细节题。第一段指出破产率的上升主要归咎于高利率信用卡的广泛使用，而很多高风险的信用卡持卡人不堪债务累累，于是申请破产。故选 D 项。"},{"id":117,"section":"eng","type":"single","stem":"By saying“the impersonality of credit - card borrowing”(Line 1, Paragraph 2), the author implies that  .","passage":"Bankruptcy rates in the U.S. have been growing for more than two decades despite generally rising levels of personal income. The most prominent explanation puts the blame directly on credit cards, which became vastly more popular in the past 30 years. University of Pennsylvania law professor David A. Skeel notes that a 1978 Supreme Court decision allow credit - card companies to charge the interest rate allowed in their state of incorporation. As a result, many incorporated in the high - rate states of Delaware and South Dakota. Being able to charge high rates throughout the country, they could afford to issue cards to those with limited ability to repay. Many high - risk cardholders, overburdened with debt, filed for bankruptcy. Skeel also notes that the impersonality of credit - card borrowing may have helped weaken the moral imperative to repay debts: in the 1960s a prospective borrower met face - to - face with a bank lending officer, but today the borrower gets credit by responding to a junk - mail offer. Other developments also fueled the rise in bankruptcy, including medical bills. A Harvard University study found that about a quarter of filers cited illness or injury as the specific reason for their troubles. Loss of jobs probably also drove some credit - card holders into bankruptcy. Other possible contributors include the growth of the gambling industry in recent years and the Supreme Court's 1977 decision to allow lawyers to advertise directly to the general public. Changes in bankrupt law apparently have had little effect on filings. The Bankrupt Reform Act of 1978 was designed to make it e d the Supreme Court's 1977 decision to allow lawyers to advertise directly to the general public. Changes in bankrupt law apparently have had little effect on filings. The Bankrupt Reform Act of 1978 was designed to make it easier for consumers to pay off debts and start anew. As under previous acts, penniless debtors could file for complete discharge of debts under Chapter 7, and debtors with substantial assets could arrange for partial repayment under Chapter 13. Most filers opted for the more generous provisions of Chapter 7. During the six years following implementation of the act, filings rose substantially. The act was amended in 1984 to curb opportunistic petitions. However, filings went in the opposite direction than expected. Evidently, easy credit and other debt - creating forces have been more powerful. The latest legal effort is the Bankruptcy Abuse Prevention and Consumer Protection Act of 2005, which went into effect in October. The new act lays down far more strict standards for debtors, including a test to qualify for Chapter 7 relief. Despite the new restrictions, bankruptcy experts tend to be skeptical or non - committal about the effectiveness in reducing filings.","options":{"A":"promote easy credit and filing","B":"counter debt - creating forces","C":"give debtors more freedom","D":"cripple opportunistic filings"},"answer":"D","analysis":"事实细节题。根据“Bankruptcy Reform Act of 1978”定位到第四段，文中提到，1984 年最高法院为了抑制投机人士提出破产申请，对此项法案进行了修正。故选 D 项。"},{"id":120,"section":"eng","type":"single","stem":"We can conclude from the last paragraph that  .","passage":"Bankruptcy rates in the U.S. have been growing for more than two decades despite generally rising levels of personal income. The most prominent explanation puts the blame directly on credit cards, which became vastly more popular in the past 30 years. University of Pennsylvania law professor David A. Skeel notes that a 1978 Supreme Court decision allow credit - card companies to charge the interest rate allowed in their state of incorporation. As a result, many incorporated in the high - rate states of Delaware and South Dakota. Being able to charge high rates throughout the country, they could afford to issue cards to those with limited ability to repay. Many high - risk cardholders, overburdened with debt, filed for bankruptcy. Skeel also notes that the impersonality of credit - card borrowing may have helped weaken the moral imperative to repay debts: in the 1960s a prospective borrower met face - to - face with a bank lending officer, but today the borrower gets credit by responding to a junk - mail offer. Other developments also fueled the rise in bankruptcy, including medical bills. A Harvard University study found that about a quarter of filers cited illness or injury as the specific reason for their troubles. Loss of jobs probably also drove some credit - card holders into bankruptcy. Other possible contributors include the growth of the gambling industry in recent years and the Supreme Court's 1977 decision to allow lawyers to advertise directly to the general public. Changes in bankrupt law apparently have had little effect on filings. The Bankrupt Reform Act of 1978 was designed to make it easier for consumers to pay off debts and start anew. As under previous acts, penniless debtors could file for complete discharge of debts under Chapter 7, and debtors with substantial assets could arrange for partial repayment under Chapter 13. Most filers opted for the more generous provisions of Chapter 7. During the six years following implementation of the act, filings rose substantially. The act was amended in 1984 to curb opportunistic petitions. However, filings went in the opposite direction than expected. Evidently, easy credit and other debt - creating forces have been more powerful. The latest legal effort is the Bankruptcy Abuse Prevention and Consumer Protection Act of 2005, which went into effect in October. The new act lays down far more strict standards for debtors, including a test to qualify for Chapter 7 relief. Despite the new restrictions, bankruptcy experts tend to be skeptical or non - committal about the effectiveness in reducing filings.","options":{"A":"despite legal efforts uncertainty remains in bankruptcy issues","B":"new acts concerning bankruptcy will protect debtors","C":"bankruptcy in the U.S. will decrease in the long run","D":"bankruptcy experts don't care about the effectiveness of filings"},"answer":"A","analysis":"推理判断题。最后一段提到，尽管设立了新的限制，破产方面的专家对此法案能否有效降低破产申请倾向持怀疑态度或不发表任何意见。故选 A 项。"}]},"2024":{"meta":{"total":120,"source":"2024 年银保监会/金监局计算机岗专业卷（PDF 原文重提取）"},"sections":[{"key":"econ","name":"经济金融基础知识 · 单选","range":[1,20],"per":0.5,"type":"single"},{"key":"cs","name":"计算机专业知识 · 单选","range":[21,80],"per":1,"type":"single"},{"key":"multi","name":"计算机专业知识 · 多选","range":[81,100],"per":1,"type":"multi"},{"key":"eng","name":"英语阅读理解 · 单选","range":[101,120],"per":0.5,"type":"single"}],"questions":[{"id":1,"section":"econ","type":"single","stem":"根据马克思的政治经济学理论，商品有两种属性，即（  ）。","passage":"","options":{"A":"使用价值和交换价值","B":"使用价值和价值","C":"交换价值和剩余价值","D":"剩余价值和价值"},"answer":"B","analysis":"根据马克思的政治经济学理论，商品的两种基本属性是指商品的使用价值和价值。使用价值表示商品的有用性，属于自然属性；价值是指凝结在商品当中一般的、无差别的人类劳动，属于社会属性。故选 B 项。"},{"id":2,"section":"econ","type":"single","stem":"在两部门经济中，（  ）时经济达到均衡。","passage":"","options":{"A":"计划储蓄等于计划投资","B":"实际投资等于实际储蓄","C":"实际消费加实际投资等于产出值","D":"企业总投资等于个人总收入"},"answer":"A","analysis":"在两部门经济中，经济达到均衡时社会的总需求等于总产出，即经济社会的收入等于全体社会想要有的支出，实现计划储蓄和计划投资相等。故选 A 项。"},{"id":3,"section":"econ","type":"single","stem":"下列各项可被计入国内生产总值（GDP）的是（  ）。","passage":"","options":{"A":"家庭主妇的家务劳动","B":"拍卖毕加索画稿的收入","C":"晚上帮邻居照看孩子的收入","D":"从政府领取的困难补助收入"},"answer":"C","analysis":"国内生产总值（GDP）是指一定时期内（通常为 1 年）在一国（或地区）境内生产的所有最终产品与服务的市场价值总和。拍卖毕加索画稿是产权转移活动，没有实际价值增值；家庭主妇的家务劳动属于自给自足；从政府领取的困难补助收入属于转移支付，均不应计入 GDP。故选 C 项。"},{"id":4,"section":"econ","type":"single","stem":"用来衡量一个国家贫富差距标准的指标是（  ）。","passage":"","options":{"A":"国内生产总值","B":"消费价格指数","C":"基尼系数","D":"恩格尔系数"},"answer":"C","analysis":"基尼系数是衡量一个国家贫富差距的指标。基尼系数越大，洛伦兹曲线越弯曲，收入分配越不均等；基尼系数越小，洛伦兹曲线越平缓，收入分配越均等。故选 C 项。"},{"id":5,"section":"econ","type":"single","stem":"当货币需求对利率的敏感程度降低时，LM 曲线将（  ）。","passage":"","options":{"A":"变平缓","B":"向右下方移动","C":"向左上方移动","D":"变陡峭"},"answer":"D","analysis":"LM 曲线反映了货币市场均衡时，利率和收入之间的相互关系。货币需求对利率的敏感程度越低，LM 曲线斜率越大，越陡峭。故选 D 项。"},{"id":6,"section":"econ","type":"single","stem":"假设一国测算的菲利普斯曲线公式为 π=πe - 4 - 0.3（u - 0.05），则该国的自然失业率为（  ）。","passage":"","options":{"A":"1.5%","B":"3%","C":"5%","D":"6%"},"answer":"C","analysis":"菲利普斯曲线反映了失业率和通货膨胀率之间反向变动的关系。附加预期的菲利普斯曲线的形式可以修正为 π=πe - ε（u - u*）。“π”表示通货膨胀率，“πe”表示预期通货膨胀率，“ε”表示价格对失业率的反应程度，“u”表示失业率，“u*”表示自然失业率。故选 C 项。"},{"id":7,"section":"econ","type":"single","stem":"建筑工人工资提高将使（  ）。","passage":"","options":{"A":"新房供给曲线左移，房价上升","B":"新房供给曲线右移，房价下降","C":"新房需求曲线左移，房价下降","D":"新房需求曲线左移，房价上升"},"answer":"A","analysis":"建筑工人的工资提升，会导致新房供给的成本增加，新房供给曲线左移，房屋价格水平上升。故选 A 项。"},{"id":8,"section":"econ","type":"single","stem":"在某一时期，某品牌 5G 手机的需求曲线向左平移的原因可能是（  ）。","passage":"","options":{"A":"消费者对某品牌 5G 手机的预期价格水平上升","B":"某品牌 5G 手机的价格上升","C":"消费者对某品牌 5G 手机的预期价格水平下降","D":"消费者的收入水平提高"},"answer":"C","analysis":"商品价格的影响属于内生变量，需求曲线的位置不会发生变动。预期价格水平下降，会导致当前的需求下降，需求曲线左移；预期价格水平上升、收入水平上升，会使需求曲线右移。故选 C 项。"},{"id":9,"section":"econ","type":"single","stem":"某公司以延期付款的方式向某超市销售一批商品，则该超市到期偿还欠款时，货币执行（  ）职能。","passage":"","options":{"A":"支付手段","B":"流通手段","C":"贮藏手段","D":"价值尺度"},"answer":"A","analysis":"支付手段是指货币用于清偿债务以及支付赋税、租金、工资等的职能。这一职能是为适应商品生产和商品交换发展的需要而发展起来的。本题中，货币用于偿还欠款属于支付手段。故选 A 项。"},{"id":10,"section":"econ","type":"single","stem":"货币乘数代表每一个单位基础货币的变动所能够引起的（  ）的变动。","passage":"","options":{"A":"货币供给","B":"存款准备金","C":"流通中现金","D":"货币需求"},"answer":"A","analysis":"货币乘数也称货币扩张系数或货币扩张乘数，是指在基础货币（高能货币）的基础上，货币供给量通过商业银行的创造存款货币功能产生派生存款的作用产生的信用扩张倍数，是货币供给扩张的倍数。即货币乘数是指每一个单位基础货币的增减所引起的货币供给量增减的倍数。故选 A 项。"},{"id":11,"section":"econ","type":"single","stem":"一张面额为 10 000 元、到期期限为 6 个月的商业票据贴现，若商业银行的年贴现率为 5%，则商业银行应付金额为（  ）元。","passage":"","options":{"A":"10 250","B":"9 750","C":"10 500","D":"9 500"},"answer":"B","analysis":"票据贴现利息 = 票据票面金额 × 贴现率 × 时间 =10 000×5%×6/12=250（元），银行应付金额 =10 000 - 250=9 750（元）。故选 B 项。"},{"id":12,"section":"econ","type":"single","stem":"以下不属于商业银行信贷资金来源的是（  ）。","passage":"","options":{"A":"各类存款","B":"理财资金","C":"资本金","D":"金融债券"},"answer":"B","analysis":"商业银行信贷资金来源是商业银行的负债业务，包括存款、资本金、金融债券、各类借款等。理财资金是商业银行的中间业务，不属于商业银行信贷资金来源。故选 B 项。"},{"id":13,"section":"econ","type":"single","stem":"同业拆借活动在金融机构之间进行，其拆借形式多为（  ）拆借。","passage":"","options":{"A":"质押","B":"抵押","C":"担保","D":"信用"},"answer":"D","analysis":"同业拆借基本上是信用拆借，拆借活动在金融机构之间进行，市场准入条件较严格，金融机构主要以其信誉参与拆借活动。故选 D 项。"},{"id":14,"section":"econ","type":"single","stem":"我国反洗钱的行政主管部门是（  ）。","passage":"","options":{"A":"公安部","B":"国家金融监督管理总局","C":"国家外汇管理局","D":"中国人民银行"},"answer":"D","analysis":"中国人民银行为我国反洗钱行政主管部门，已于 2004 年建立了我国的金融情报中心——反洗钱监测分析中心，是连接反洗钱预防监控和刑事打击工作的桥梁，是开展反洗钱工作的重要机构。故选 D 项。"},{"id":15,"section":"econ","type":"single","stem":"根据《巴塞尔协议Ⅲ》，对商业银行核心一级资本、一级资本和总资本的最低充足率要求分别是（  ）。","passage":"","options":{"A":"4%、6%、8%","B":"4%、6%、10%","C":"4.5%、6%、8%","D":"4.5%、6%、10%"},"answer":"C","analysis":"根据《巴塞尔协议Ⅲ》的资本要求，核心一级资本最低充足率为 4.5%，一级资本最低充足率为 6%，总资本最低充足率为 8%。故选 C 项。"},{"id":16,"section":"econ","type":"single","stem":"不良贷款率是衡量商业银行（  ）的指标之一。","passage":"","options":{"A":"市场风险","B":"信用风险","C":"流动性风险","D":"利率风险"},"answer":"B","analysis":"不良贷款率是衡量商业银行信用风险的指标之一。故选 B 项。"},{"id":17,"section":"econ","type":"single","stem":"我国公布人民币汇率时采用的标价方法是（  ）。","passage":"","options":{"A":"直接标价法：一单位人民币折合的美元（或英镑）单位数","B":"间接标价法：一单位美元（或英镑）折合的人民币单位数","C":"直接标价法：一单位美元（或英镑）折合的人民币单位数","D":"间接标价法：一单位人民币折合的美元（或英镑）单位数"},"answer":"C","analysis":"我国外汇标价采用的是直接标价法，它是以一定单位（1 个或 100 个、1 000 个、10 000 个单位）的外国货币作为标准，折算成若干数额的本国货币来表示汇率。故选 C 项。"},{"id":18,"section":"econ","type":"single","stem":"美国经济学家保罗·克鲁格曼提出“不可能三角”，指一国不可能同时实现（  ）三种政策目标。","passage":"","options":{"A":"资本自由流动、浮动汇率、独立货币政策","B":"资本自由流动、固定汇率、独立货币政策","C":"资本管制、固定汇率、独立货币政策","D":"资本管制、浮动汇率、独立货币政策"},"answer":"B","analysis":"“不可能三角”是指经济社会和财政金融政策目标选择面临诸多困境，难以同时实现三个方面的目标。在金融政策方面，资本自由流动、固定汇率和货币政策独立性三者不可能兼得。故选 B 项。"},{"id":19,"section":"econ","type":"single","stem":"投保人对同一保险标的、同一保险利益、同一保险事故同时分别向两个以上保险人订立保险合同，其保险金额之和超过保险价值的保险被称为（  ）。","passage":"","options":{"A":"共同保险","B":"再保险","C":"重复保险","D":"两全保险"},"answer":"C","analysis":"投保人对同一保险标的、同一保险利益、同一保险事故同时分别向两个以上保险人订立保险合同，其保险金额之和超过保险价值的保险被称为重复保险。故选 C 项。"},{"id":20,"section":"econ","type":"single","stem":"某企业购置机器设备时投保了财产保险，机器设备购置价格为 7 万元，双方约定的保险金额为 10 万元。保险有效期内该机器设备因事故全损，事故发生时，该机器设备重置价格为 8 万元，保险人最多应赔付（  ）。","passage":"","options":{"A":"7 万元","B":"10 万元","C":"8 万元","D":"15 万元"},"answer":"C","analysis":"保险金额高于保险价值，且事故发生时重置价值低于保险金额，故保险人应按照重置价值进行赔偿，即赔付 8 万元。故选 C 项。"},{"id":21,"section":"cs","type":"single","stem":"以下关于解释程序和编译程序的叙述中，正确的是（  ）。","passage":"","options":{"A":"编译程序和解释程序都生成源程序的目标程序","B":"编译程序和解释程序都不生成源程序的目标程序","C":"编译程序生成源程序的目标程序，而解释程序则不然","D":"编译程序不生成源程序的目标程序，而解释程序反之"},"answer":"C","analysis":"编译程序先翻译后执行，会生成源程序的目标程序（编译源程序不能直接执行，比如：C 程序）；解释程序一边翻译一边执行，不会生成源程序的目标程序（解释源程序可直接执行，比如：python 程序）。故选 C 项。"},{"id":22,"section":"cs","type":"single","stem":"若与某资源关联的信号量初始值为 5，当前值为 2。则该资源的可用数和等待该资源的进程数分别为（  ）。","passage":"","options":{"A":"2，3","B":"2，0","C":"3，2","D":"0，3"},"answer":"B","analysis":"等待该资源的进程数可以通过计算“当前值 - 初始值”来得出。在这个例子中，当前值为 2，初始值为 5，所以等待该资源的进程数为 2-5=-3。但是，等待资源的进程数通常是一个非负整数，所以这里可能出现了错误或者特殊情况。一种可能的解释是，信号量的初始值和当前值是在某个时刻记录下来的，而在这个时刻之后，可能有更多的进程释放了该资源，导致当前值增加到 2，等待为 0。故选 B 项。"},{"id":23,"section":"cs","type":"single","stem":"一个进程被唤醒意味着（  ）。","passage":"","options":{"A":"该进程一定重新占用 CPU","B":"它的优先级变为最大","C":"其 PCB 移至就绪队列队首","D":"进程变为就绪状态"},"answer":"D","analysis":"一个进程被唤醒意味着它从睡眠状态（或等待状态）切换到活动状态，可以开始执行它的任务。在操作系统中，当一个进程需要等待某个事件（例如，等待输入 / 输出操作完成，或者等待获取锁）时，通常会被置于睡眠状态。一旦等待的事件发生，进程就会被唤醒并切换到活动状态。故选 D 项。"},{"id":24,"section":"cs","type":"single","stem":"7456-3567=3667，在使用（  ）情况下成立。","passage":"","options":{"A":"汇编语言","B":"八进制","C":"ASCTI 码","D":"64 位操作系统"},"answer":"B","analysis":"八进制，每位数的范围是 0-7，逢八进一。故选 B 项。"},{"id":25,"section":"cs","type":"single","stem":"指令周期是指（  ）。","passage":"","options":{"A":"CPU 从主存取出一条指令的时间","B":"CPU 执行一条指令的时间","C":"CPU 从主存取出一条指令加上执行该条指令的时间","D":"时钟周期的时间"},"answer":"C","analysis":"指令周期是指 CPU 从内存取出一条指令并执行这条指令的时间。一般由若干个机器周期组成，是从取指令、分析指令到执行完所需的全部时间。故选 C 项。"},{"id":26,"section":"cs","type":"single","stem":"系统为某进程分配了 3 个页框，该进程已访问的页号序列为 1，0，2，3，2，4，5，3，7，8，9，8。若该进程使用 LRU 算法，下一个要访问的页号为 6，此时应淘汰的页号为（  ）。","passage":"","options":{"A":"2","B":"3","C":"7","D":"8"},"answer":"C","analysis":"现在的页号访问记录为 7,9,8, 访问新页号时，删除最早的记录，删除 7 号。故选 C 项。"},{"id":27,"section":"cs","type":"single","stem":"对一组数据（2，15，16，90，5，10）进行排序，若前三趟排序结果如下（  ）。（1）2，15，16，5，10，90（2）2，15，5，10，16，90（3）2，5，10，15，16，90则采用的排序算法最可能是（  ）。","passage":"","options":{"A":"冒泡排序","B":"希尔排序","C":"归并排序","D":"基数排序"},"answer":"A","analysis":"冒泡排序是一种简单的排序算法，它重复地遍历要排序的数列，一次比较两个元素，如果它们的顺序错误就把它们交换过来。遍历数列的工作是重复地进行直到没有再需要交换，也就是说该数列已经排序完成。这个算法的名字由来是因为越小的元素会经由交换慢慢“浮”到数列的顶端。对于给出的三个排序结果，可以看出，每次排序时，都是先将最小的数放前面，或者最大的数放前面，然后其他的数再按照升序排列，这符合冒泡排序的特点。故选 A 项。"},{"id":28,"section":"cs","type":"single","stem":"已知一个长度为 8 的顺序表 L，其中的元素按关键字有序排列。若采用折半查找法查找一个不存在的元素，则关键字比较次数最多是（  ）。","passage":"","options":{"A":"3","B":"4","C":"5","D":"6"},"answer":"B","analysis":"折半查找法最坏情况是 log2n+1，应该是 4 次。故选 B 项。"},{"id":29,"section":"cs","type":"single","stem":"IT 战略规划的核心组成要素包括现状分析、战略分析、（  ）和路径分析。","passage":"","options":{"A":"业务分析","B":"评估分析","C":"系统分析","D":"差距分析"},"answer":"D","analysis":"IT 战略规划的核心组成要素通常包括现状分析、战略分析、差距分析和路径分析。故选 D 项。"},{"id":30,"section":"cs","type":"single","stem":"假定 char*ss =“0123456789”，那么 sizeof（ss）的结果为（  ）。","passage":"","options":{"A":"1","B":"4","C":"10","D":"11"},"answer":"B","analysis":"在 C 语言中，sizeof 运算符用于获取特定类型或对象在内存中的大小。当使用 sizeof（ss）时，它返回的是指向字符数组的指针的大小，而不是数组本身的大小。在大多数现代计算机系统中，一个指针的大小通常是 4 字节（32 位系统）或 8 字节（64 位系统）。因此，sizeof（ss）将返回 4 或 8，具体取决于系统是 32 位还是 64 位。故选 B 项。"},{"id":31,"section":"cs","type":"single","stem":"关于面向对象方法的优点，下列不正确的叙述是（  ）。","passage":"","options":{"A":"与人类习惯的思维方法比较一致","B":"可重用性好","C":"以数据操作为中心","D":"可维护性好"},"answer":"C","analysis":"面向对象方法具有与人类思维一致、稳定性好、可重用性好、可维护性好和易于开发大型软件产品等优点。面向对象方法是以对象为中心，而不是以数据操作为中心。在面向对象方法中，对象是具有特定属性（字段）和行为（方法）的对象，而不是单纯的数据操作。C 项错误。故选 C 项。"},{"id":32,"section":"cs","type":"single","stem":"某银行欲开发一个在线交易系统。为了能够精确表达用户与系统的复杂交互过程，应采用 UML 的（  ）进行交互过程建模。","passage":"","options":{"A":"类图","B":"序列图","C":"部署图","D":"对象图"},"answer":"B","analysis":"在软件工程中，序列图是对象交互的一种表现方式。序列图是对象之间基于时间顺序的动态交互，它显示出了随着时间的变化对象之间是如何进行通讯的。序列图的主要用途之一是从一定程度上更加详细的描述用例表达的需求，并将其转化为进一步的更加正式层次的精细表达。序列图中的对象可以是系统的参与者或者任何有效的系统对象。每个对象底部中心的位置都带有生命线，生命线是一个时间线，从序列图的顶部一直延伸到底部，所用时间取决于交互持续的时间，也就是说生命线表现了对象存在的时段。故选B 项。"},{"id":33,"section":"cs","type":"single","stem":"白盒测试是根据程序的（  ）来设计测试用例，黑盒测试是根据软件的规格说明来设计测试用例。","passage":"","options":{"A":"功能","B":"性能","C":"内部逻辑","D":"内部数据"},"answer":"C","analysis":"白盒测试是一种软件测试方法，根据程序的逻辑结构，而不是其功能。它也被称为透明盒测试、结构测试或基于代码的测试。在白盒测试中，系统的内部视角用于设计测试用例，测试人员选择输入来练习代码的路径并确定预期的输出。这种方法可以应用于软件测试过程的单元级、集成级和系统级，以检查单元内的路径、集成期间单元之间的路径以及系统级测试期间子系统之间的路径。故选 C 项。"},{"id":34,"section":"cs","type":"single","stem":"某政府网站突然出现无法访问的现象，负责维护的工程师小王决定逐一排查相关设备，找到故障原因，以防止再次发生。而同事小李却建议尽快恢复业务可用，包括重启相关服务器等应急措施。针对此情况，描述正确的是（  ）。","passage":"","options":{"A":"小王的安排合理，属于问题管理范畴","B":"小王的安排合理，属于事故管理范畴","C":"小李的安排合理，属于事故管理范畴","D":"小李的安排合理，属于问题管理范畴"},"answer":"C","analysis":"事故管理的主要目标是尽快恢复正常的业务运营，并将业务影响降到最低，保障服务质量和可用性问题管理的目标是通过消除引起事故的深层次根源以预防问题和事故的再发生，并将未能解决的事故影响降到最低。政府网站突然无法访问，首先需要处理事故，恢复服务正常运营。故选 C 项。"},{"id":35,"section":"cs","type":"single","stem":"由于信用卡公司升级了其信用卡支付系统，导致超市的原有信息系统也需要做相应的修改，该类维护属于（  ）。","passage":"","options":{"A":"正确性维护","B":"完善性维护","C":"适应性维护","D":"预防性维护"},"answer":"C","analysis":"网络环境升级后，相应的软硬件也需要作出相应的修改，这属于适应性维护。故选 C 项。"},{"id":36,"section":"cs","type":"single","stem":"数字字符 0 的 ASCII 值为 48，若有以下程序 main (){char a='1',b='2':printf (\"%c,\",b++) ;printf (\"%d\\n\",b-a) ;}程序运行后的输出结果是（  ）。","passage":"","options":{"A":"3,2","B":"50.2","C":"2.2","D":"2,50"},"answer":"C","analysis":"数字字符 0 的 ASCII 值为 48, 数字字符 1 的编码为 49，数字字符 2 的编码为50, 数字字符 3 的编码为 51；printf（\"%c,\",b++）是输出数字字符，b++ 是先输出再累加，输出 2；printf（\"%d\\n\",b-a）；输出十进制，b 现在为数字字符 3,b-a 后是十进制 2，最终结果，输出 2,2故选 C 项。"},{"id":37,"section":"cs","type":"single","stem":"10 个成员组成的开发小组，若任意两人之间都有沟通路径，则共有（  ）条沟通路径。","passage":"","options":{"A":"100","B":"90","C":"50","D":"45"},"answer":"D","analysis":"题目中任意两个人之间存在沟通路径，相当于完全图的定义“任意两个顶点之间存在路径”，即除了本身之外，到其余顶点之间均存在一条边，1 个顶点，与其相连的边为 n-1 条，n 个顶点，则边的数目为 n*（n-1），一条边重复算 2 次，需要除 2，即 n*（n-1）/2，故 10 个人，存在路径为 10*9/2=45。故选 D 项。"},{"id":38,"section":"cs","type":"single","stem":"某公司要开发一个软件产品，产品的某些需求是明确的，而某些需求则需要进一步细化。由于市场竞争的压力，产品需要尽快上市，则该软件开发不宜采用（  ）模型。","passage":"","options":{"A":"瀑布","B":"原型","C":"增量","D":"螺旋"},"answer":"A","analysis":"由于该软件开发需要尽快上市，并且产品的某些需求需要进一步细化，因此采用传统的瀑布模型可能不是最佳选择。瀑布模型要求在需求分析、设计、编码、测试和发布等阶段之间进行严格的阶段划分，这可能需要更多的时间和资源。故选 A 项。"},{"id":39,"section":"cs","type":"single","stem":"在设计某超市的收银软件系统时，要求能够支持在不同时期推出打折、返利、满减等不同促销活动，则适合采用（  ）模式。","passage":"","options":{"A":"策略（Strategy）","B":"访问者（Visitor）","C":"观察者（Observer）","D":"中介者（Mediator）"},"answer":"A","analysis":"策略模式是一种行为设计模式，它可以根据不同的条件选择不同的算法或行为，从而实现算法或行为的动态选择。在这个问题中，不同的促销活动可以看作不同的策略，可以根据不同的策略来计算折扣、返利和满减等。因此，适合采用策略模式。故选 A 项。"},{"id":40,"section":"cs","type":"single","stem":"关于信息系统项目生命周期的描述，正确的是（  ）。","passage":"","options":{"A":"项目执行期间，风险与不确定性在开始时最小","B":"原型法对于需求的响应是动态的","C":"V 模型不适用于需求明确和需求变更频繁的项目","D":"敏捷开发模式适用于各类项目"},"answer":"B","analysis":"实际上，在项目开始时，风险和不确定性往往最大，因为项目的具体细节和需求往往在项目开始后逐渐明确。A 项错误。原型法对于需求的响应是动态的。在原型法中，获取需求的过程是动态的，由少到多，逐渐获得完整需求。这种方法允许在开发过程中灵活调整需求，以适应变化或新的发现。B 项正确。V 模型实际上非常适合需求明确和需求变更频繁的项目。在 V 模型中，需求分析阶段会进行需求定义和审查，一旦确定，就可以指导后续的设计、编码和测试。当需求变更时，可以及时反映到设计和代码中，从而更快地响应变化。C 项错误；敏捷开发模式并不适用于所有项目。它特别适用于需求不明确、变化频繁的项目，或者对于那些需要快速响应变化的业务场景。对于一些相对稳定、需求明确的项目，传统的瀑布模型可能更为有效。D 项错误。故选 B 项。"},{"id":41,"section":"cs","type":"single","stem":"对实际应用问题建立数学模型并求得结果后，还需要根据建模的目的和要求，利用相关知识，结合研究对象的特点，进行模型分析。模型分析工作一般不包括（  ）。","passage":"","options":{"A":"模型的合理性分析","B":"模型的误差分析","C":"模型的先进性分析","D":"参数的灵敏性分析"},"answer":"C","analysis":"模型分析工作主要包括模型的合理性分析、模型的误差分析和参数的灵敏性分析等。这些分析旨在评估模型的性能、准确性和可靠性，以确保模型能够有效地解决实际问题。故选 C 项。"},{"id":42,"section":"cs","type":"single","stem":"某手机应用系统上线后，收到老年用户多起投诉：面繁琐，字体太小，使用不方便。这反映项目组在（  ）工作中存在不足。","passage":"","options":{"A":"变更控制","B":"识别干系人","C":"质量控制","D":"团队建设"},"answer":"B","analysis":"老年用户投诉该手机应用系统操作繁琐、字体太小、使用不方便，这表明项目组在识别干系人（即老年人用户）的需求和考虑他们的特点方面存在不足。在项目初期，应该识别所有的干系人，包括老年用户，并考虑他们的需求和特点，以确保项目满足他们的期望和需求。故选 B 项。"},{"id":43,"section":"cs","type":"single","stem":"以下关于软件测试与质量保证的叙述中，正确的是（  ）","passage":"","options":{"A":"软件测试是质量保证的重要手段","B":"软件质量保证人员就是测试人员","C":"软件测试是质量保证人员的主要工作内容","D":"软件测试关注的是过程中的活动，质量保证关注的是过程的产物"},"answer":"A","analysis":"软件测试和质量保证是软件工程中的两个重要环节，它们的目标都是确保软件产品的质量。软件测试是质量保证的重要手段之一，通过测试可以发现软件中的缺陷和错误，从而提供有关软件质量的信息，帮助开发人员及时纠正错误，提高软件质量。因此，软件测试是质量保证的重要手段，A 选项正确；虽然软件测试和质量保证都关注软件的质量，但它们的职责和关注点是不同的。软件测试的职责是发现软件中的缺陷和错误，而质量保证的职责是监控软件开发流程，确保软件开发过程符合规定的质量标准。因此，B、C选项错误。软件测试关注的是对软件产品进行检测和验证，以确定软件是否满足质量要求。质量保证关注的是对软件开发过程进行监控和评审，以确保软件开发过程符合规定的质量标准。因此，D 选项错误。故选 A 项。"},{"id":44,"section":"cs","type":"single","stem":"在对程序质量进行评审时，模块结构是一个重要的评审项，评审内容中不包括（  ）。","passage":"","options":{"A":"数据结构","B":"数据流结构","C":"控制流结构","D":"模块结构与功能结构之间的对应关系"},"answer":"D","analysis":"模块结构是指程序中各个模块之间的相互关系和组织方式。在对程序质量进行评审时，模块结构是一个重要的评审项，包括数据结构、数据流结构、控制流结构等方面。功能结构是指程序的功能模块之间的组织方式和关系，它与模块结构是不同的概念，D 项错误。故选 D 项。"},{"id":45,"section":"cs","type":"single","stem":"项目经理正着手某系统集成项目的风险应对计划编制，若某项目风险发生的概率很小，而应对该风险所采取的对策需要付出较高的代价，则他最可能采取的风险应对策略是（  ）。","passage":"","options":{"A":"接受","B":"回避","C":"减轻","D":"转移"},"answer":"A","analysis":"接受策略适用于风险概率低、影响较小，或主动应对成本高于风险发生后的损失时；回避策略通常通过取消工作、改变计划完全消除风险，适用于高概率、高影响的威胁；减轻策略适用于需投入资源降低概率或影响（如增加测试）时；转移策略适用于需支付额外成本将风险转移给第三方（如购买保险）时，但代价较高且风险概率小，转移成本可能超过潜在损失。若风险发生概率低且应对代价高，项目经理通常选择接受风险，因为主动应对的成本可能超过风险带来的损失。故选 A 项。"},{"id":46,"section":"cs","type":"single","stem":"SQL 中，假定某表中“resume”是文本型字段，则查找该字段中含有“银行”的所有记录应使用（  ）作为条件表达式。","passage":"","options":{"A":"[resume]=“银行”","B":"[resume] EXIST“银行”","C":"[resumc] LIKE“* 银行 *”","D":"“银行”IN [resume]"},"answer":"C","analysis":"在 SQL 数据库中查找包含指定“字符串”的字段时，使用 [ 字段 ] LIKE“*字符串 *”A 选项只会匹配那些 resume 字段值完全为 ' 银行 ' 的记录，而忽略了那些包含 '银行 ' 的记录；B 选项不是一个正确的 SQL 语法；D 选项 IN 运算符通常用于检查一个字段是否在一个给定的值列表中。故选 C 项。"},{"id":47,"section":"cs","type":"single","stem":"下列哪种数据库技术最适合用来分析银行资金流动？（  ）","passage":"","options":{"A":"关系型数据库","B":"数据仓库","C":"流数据库","D":"图数据库"},"answer":"B","analysis":"使用金融数据仓库（Financial Data Warehouse）或企业数据仓库（Enterprise Data Warehouse）来整合和处理来自银行内部和外部的各种数据源。这些数据仓库可以存储和管理大量的金融数据，包括账户信息、交易历史、资产负债表、利润表等。通过使用数据库查询和分析工具，可以深入挖掘这些数据，发现资金流动的模式、趋势和异常情况。关系型数据库、流数据库和图数据库虽然也可以用于存储和处理数据，但在处理复杂查询和多维数据分析时，可能会面临性能瓶颈和数据一致性问题。故选 B 项。"},{"id":48,"section":"cs","type":"single","stem":"若事务 T 对数据对象 Q 加了排他锁，则 T 对 Q（  ）。","passage":"","options":{"A":"只能读不能写","B":"只能写不能读","C":"既能读又能写","D":"既不能读又不能写"},"answer":"C","analysis":"若事务 T 对数据对象 Q 加了排他锁，则 T 对 Q 有独占使用的权力。这意味着在 T 释放锁之前，其他事务不能对 Q 进行读写操作。这种锁主要用于数据共享的情况，可以防止其他事务修改 Q 的值。当 T 释放锁后，其他事务才能对 Q 进行操作。故选 C 项。"},{"id":49,"section":"cs","type":"single","stem":"下列 SQL 语句中，能够实现“收回用户 XIAO 对通讯录（TXL）中手机（mobile）的修改权”这一功能的是（  ）。","passage":"","options":{"A":"REVOKE UPDATE（mobile） OF TABLE TXL TO XIAO;","B":"REVOKE UPDATE（mobile） OF TABLE TXL FROM XIAO;","C":"REVOKE UPDATE（mobile） ON TABLE TXL TO XIAO;","D":"REVOKE UPDATE（mobile） ON TABLE TXL FROM XIAO;"},"answer":"D","analysis":"要收回用户 XIAO 对通讯录（TXL）中手机（mobile）的修改权，你可以使用SQL 的 REVOKE 语句。具体的语句可能如下：REVOKE UPDATE （mobile） ON TABLE TXL FROM XIAO;这条 SQL 命令会从用户 XIAO 收回对通讯录（TXL）表中手机（mobile）字段的修改权。在执行此命令后，用户 XIAO 将无法再更新 TXL 表中的 mobile 字段。故选 D 项。"},{"id":50,"section":"cs","type":"single","stem":"假设你拥有一个保存员工信息的表，有 Last Name 和 First Name 列和一个经常使用的查询，类似如下：HHERE Last Name=‘Smith’ OR Last Name =‘Smith’ AND First Name‘LIKE’那么建立索引列正确的是（  ）。","passage":"","options":{"A":"(Last Name,First Name)","B":"(Last Name)","C":"(First Name)","D":"(First Name,Last Name)"},"answer":"A","analysis":"创建索引可以让数据库更快地执行查询操作，因为索引可以大大减少查询所需的数据扫描次数。在查询中，提到了 LastName 列和 FirstName 列，因此在这两个列上创建索引可以帮助数据库更快地查找匹配的数据。故选 A 项。"},{"id":51,"section":"cs","type":"single","stem":"下列不属于数据库优化技巧的是（  ）。","passage":"","options":{"A":"分离数据、日志、索引到不同的高性能 I/O 设备上","B":"用 OR 的字段可以分解成多个查询，并且通过 UNION 链接多个查询","C":"纵向、横向聚合表，减少表的数量","D":"将数据的处理工作放在服务器上，例如可以多使用存储过程"},"answer":"B","analysis":"优化查询语句：尽量使用简单的查询语句，避免使用复杂的子查询和连接操作。同时，可以使用 EXPLAIN 命令来分析查询语句的执行计划，找到性能瓶颈并进行优化。故选 B 项。"},{"id":52,"section":"cs","type":"single","stem":"给定关系 R（U,F），其中 U={A,B,C,D,E,H},F=（A->B,B->DH,A->H,C->E），则关系 R 有（  ）。","passage":"","options":{"A":"1 个候选码 A","B":"2 个候选码 A、B","C":"1 个候选码 AC","D":"2 个候选码 A、C"},"answer":"C","analysis":"首先，我们分析每个属性的函数依赖：A->B B->D,H A->H C->E根据函数依赖的推导，我们可以得出：A 能够决定 B 和 H，而 B 又能够决定 D 和 H。因此，A 能够决定 B、D、H。同时，C能够决定 E。这意味着，如果我们知道 A 和 C 的值，我们就能够唯一确定整个关系的所有属性。因此，AC 是关系 R 的一个候选码。故选 C 项。"},{"id":53,"section":"cs","type":"single","stem":"区块链是典型的分布式技术，对于区块链而言，应优先解决分布式计算的（  ）。","passage":"","options":{"A":"可用性","B":"一致性","C":"分区容错性","D":"易用性"},"answer":"B","analysis":"对于分布式计算而言，应优先解决一致性、安全性问题、扩展性问题、性能问题和容错性问题等，以确保分布式计算的可靠性和稳定性。故选 B 项。"},{"id":54,"section":"cs","type":"single","stem":"关系 SC（SNO,CNO,GRADE），列分别表示学号，课程号，成绩。现要查询平均分在 90 分以上的学生的学号和平均成绩，正确的语句是（  ）。","passage":"","options":{"A":"SELECT SNO, AVG （GRADE） FROM SC WHERE AVG （GRADE）>=90 GROUPBY SNO;","B":"SELECT SNO,AVG （GRADE） FROM SC GROUP BY SNO HAVING AVG（GRADE）>=90;","C":"SELECT SNO, AVG （GRADE） FROM SC WHERE AVG （GRADE） >=90 ORDERBY SNO;","D":"SELECT SNO,AVG （GRADE） FROM SC GROUP BY CNO HAVING AVG（GRADE）>=90;"},"answer":"B","analysis":"可以使用以下 SQL 语句查询平均分在 90 分以上的学生的学号和平均成绩：SELECT SNO, AVG（GRADE） AS AVG_GRADE FROM SC GROUP BY SNO HAVING AVG（GRADE） >= 90;上述语句使用了 SELECT 语句查询满足条件的数据。首先使用 GROUP BY 子句按照学号（SNO）进行分组，然后使用 AVG（GRADE）计算每个学生的平均成绩，并使用HAVING 子句筛选出平均成绩大于等于 90 分的学生。结果集中包含学号（SNO）和平均成绩（AVG_GRADE）。故选 B 项。"},{"id":55,"section":"cs","type":"single","stem":"华为开源数据库 openGauss 是基于下列哪个开源数据库构建的？（  ）","passage":"","options":{"A":"MySQL","B":"Redis","C":"SQLite","D":"PostgreSQL"},"answer":"D","analysis":"openGauss 是一款基于 PostgreSQL 的开源数据库管理系统，由华为公司开发并开源。它支持分布式架构，并具有高性能、高可用性、可扩展性等特点。故选 D 项。"},{"id":56,"section":"cs","type":"single","stem":"网卡实现的主要功能在（  ）。","passage":"","options":{"A":"物理层和数据链路层","B":"数据链路层和网络层","C":"物理层和网络层","D":"数据链路层和应用层"},"answer":"A","analysis":"网卡工作在数据链路层，转发数据帧，连接的传输介质在物理层，所以网卡主要实现的功能在物理层与数据链路层。故选 A 项。"},{"id":57,"section":"cs","type":"single","stem":"路由器通过光纤连接广域网的是（  ）。","passage":"","options":{"A":"SFP 端口","B":"同步串行口","C":"Console 端口","D":"AUX 端口"},"answer":"A","analysis":"在路由器中，光纤接口通常被称为 SFP 端口或光模块插槽，用于通过光纤连接广域网。SFP 是 Small Form-factor Pluggable 的缩写，意思是小型可插拔。故选 A 项。"},{"id":58,"section":"cs","type":"single","stem":"下列关于路由器功能的说法，错误的是（  ）。","passage":"","options":{"A":"建立、维护和更新路由表","B":"转发分组","C":"扩展以太网，转发帧","D":"进行数据处理"},"answer":"C","analysis":"路由器工作在网络层，网络层的数据结构是“包”，也称为“分组”，“帧”是链路层的数据结构。扩展以太网，接收和转发帧是集线器（Hub）的功能，不是路由器（Router）的功能，C 项错误，故选 C 项。"},{"id":59,"section":"cs","type":"single","stem":"HTTPS 的安全机制工作在（  ）。","passage":"","options":{"A":"网络层","B":"物理层","C":"传输层","D":"应用层"},"answer":"C","analysis":"HTTPS 的安全机制工作在传输层，通过 SSL/TLS 协议提供数据加密、身份验证和数据完整性等安全特性。故选 C 项。"},{"id":60,"section":"cs","type":"single","stem":"可以动态为主机配置 IP 地址的协议是（  ）","passage":"","options":{"A":"ARP","B":"RAPR","C":"DHCP","D":"NAT"},"answer":"C","analysis":"DHCP 是动态主机配置协议，可以为客户端动态分配 IP 地址。ARP 是 IP 地址与 MAC 地址之间的转换协议；ARP 是反向转换协议，把 MAC 地址转换为 IP 地址，NAT 是地址转换协议，把私网地址转换为公网地址。故选 C 项。"},{"id":61,"section":"cs","type":"single","stem":"OSI 参考模型传输层传输信息的基本单元是（  ）。","passage":"","options":{"A":"报文","B":"包","C":"帧","D":"块"},"answer":"A","analysis":"OSI 参考模型传输层传输信息的基本单元是报文，它是由应用层向传输层传送的数据，是应用层数据的封装，它不包含物理地址（MAC 地址），但包含逻辑地址（IP地址）。故选 A 项。"},{"id":62,"section":"cs","type":"single","stem":"以下关于网络冗余设计的叙述中，错误的是（  ）。","passage":"","options":{"A":"网络冗余设计避免网络组件单点失效造成应用失效","B":"通常情况下主路径与备用路径承担相同的网络负载","C":"负载分担是通过并行链路提供流量分担来提供性能","D":"网络中存在备用链路时可以考虑加入负载分担设计"},"answer":"B","analysis":"通常情况下，主路径是主要的通信路径，承载着大部分的网络流量，而备用路径则处于备用状态，只有在主路径发生故障时才会被启用。因此，主路径和备用路径在网络负载方面通常是不平等的。故选 B 项。"},{"id":63,"section":"cs","type":"single","stem":"使用 traceroute 命令测试网络时可以（  ）。","passage":"","options":{"A":"检验链路协议是否运行正常","B":"检验目标网络是否在路由表中","C":"检验应用程序是否正常","D":"显示分组到达目标路径上经过的各路由器"},"answer":"D","analysis":"使用 traceroute 命令可以显示分组到达目标路径上经过的各路由器，从而可以测试网络连接的过程和经过的路由器。故选 D 项。"},{"id":64,"section":"cs","type":"single","stem":"服务通信协议层的主要功能是描述并定义服务之间进行消息传递所需的技术标准。常用的标准是（  ）。","passage":"","options":{"A":"HTTP 协议","B":"JMS 协议","C":"SMTP 协议","D":"SOAP 协议"},"answer":"D","analysis":"服务通信协议层描述并定义服务之间进行消息传递所需的技术标准，常用的标准是 SOAP 协议、REST 协议等。这些协议规定了服务之间如何进行通信和交互，以确保消息的传递和理解的准确性和一致性。故选 D 项。"},{"id":65,"section":"cs","type":"single","stem":"直接封装 RIP、OSPF、BGP 报文的协议分别是（  ）。","passage":"","options":{"A":"TCP、UDP、IP","B":"TCP、IP、UDP","C":"UDP、TCP、IP","D":"UDP、IP、TCP"},"answer":"D","analysis":"RIP 报文封装在 UDP 协议中，端口号为 520。OSPF 报文直接封装在 IP 层即第三层，协议号为 89。BGP 报文直接封装在 TCP 层，然后加上 IP 头部，使用的端口号是179。故选 D 项。"},{"id":66,"section":"cs","type":"single","stem":"区块链在（  ）网络环境下，通过透明和可信规则，构建可追溯的块链式数据结构，实现和管理事务处理。","passage":"","options":{"A":"分布式","B":"集中式","C":"关系式","D":"共享式"},"answer":"A","analysis":"区块链是一种分布式数据存储、点对点传输、共识机制、加密算法等计算机技术的新型应用模式。区块链在分布式网络环境下，通过透明和可信规则，构建追溯的区块链式数据结构，实现和管理事务处理。故选 A 项。"},{"id":67,"section":"cs","type":"single","stem":"作为对防火墙的有力补充，入侵检测系统（IDS）能够帮助网络系统快速发现网络攻击的发生，扩展了系统管理员的安全管理能力（包括安全审计、监视、进攻识别和响应），提高了信息安全基础结构的完整性。网络入侵检测系统的实现手段主要是（  ）。","passage":"","options":{"A":"检索行为特征","B":"监视设备日志","C":"跟踪程序行为","D":"扫描报文序列"},"answer":"B","analysis":"网络入侵检测系统的主要实现手段是监视和分析网络流量以及异常行为，包括但不限于对网络协议的监视、对数据包结构的分析以及对网络行为的监控。通过实时监测和分析网络流量，IDS 能够发现异常行为模式并发出警报，以便管理员采取适当的措施。故选 B 项。"},{"id":68,"section":"cs","type":"single","stem":"依据涉密信息系统分级保护管理规范和技术标准，涉密信息系统建设使用单位将保密级别分为三级，下列分级正确的是（  ）。","passage":"","options":{"A":"秘密 机密 要密","B":"机密 要密 绝密","C":"秘密 机密 绝密","D":"商密 秘密 机密"},"answer":"C","analysis":"信息安全等级保护管理办法第二十五条 涉密信息系统按照所处理信息的最高密级，由低到高分为秘密、机密、绝密三个等级。故选 C 项。"},{"id":69,"section":"cs","type":"single","stem":"管理员发现本机上存在多个 webshell，之后查看日志信息，发现服务器本身的日志被删除了，所以登录 WEB 后台，查看后台日志，此时发现后台有被管理员登录的情况，且有很多管理员登录失败的信息，之后有成功登录后并执行了一些操作的情况，下面可能是攻击者的攻击手段的是（  ）。","passage":"","options":{"A":"利用 SQL 注入，获取管理员的密码，直接登录后台，上传 webshell","B":"直接利用 SQL 注入，上传 webshell，获取管理员密码，登录后台","C":"利用暴力破解登录后台，上传 webshell","D":"利用跨站语句，窃取 cookie 后，利用 cookie 登录，上传 webshell，窃取管理员后台密码登录"},"answer":"C","analysis":"管理员在查看日志时发现服务器本身的日志被删除，这可能意味着攻击者试图掩盖他们的攻击行为。同时，后台有管理员登录失败的信息，这可能表明攻击者尝试通过暴力破解方式获取管理员权限。之后有成功登录后并执行了一些操作的情况，这表明攻击者最终成功利用了管理员权限，并可能上传了 webshell。故选 C 项。"},{"id":70,"section":"cs","type":"single","stem":"对于国产密码算法，下列说法错误的是（  ）。","passage":"","options":{"A":"SMI、SM4 是对称加密算法，分组长度为 256 比特","B":"SM2 是非对称加密算法","C":"SM3 是杂凑算法，杂凑值长度为 256 比特","D":"SM9 是标识密码算法"},"answer":"A","analysis":"SM4 是中国自主研发的分组密码，也被称为对称加密算法。它使用分组长度为 128 比特。故选 A 项。"},{"id":71,"section":"cs","type":"single","stem":"在 PKI 体系下，A 方有一对密钥 (KApub,KApri),B 方有一对密钥 (KBpub,KBpri),A 方给 B 方发送信息 M，对信息 M 加密为：M’=KBpub (KApri())。B 方收到密文，正确的解决方案是（  ）。","passage":"","options":{"A":"KBpub (KApri (M’))","B":"KApub (KApub (M’))","C":"KApub (KBpri (M’))","D":"KBpri (KApub (M’))"},"answer":"C","analysis":"在 PKI 体系下，A 方有一对密钥（KApub，KApri），B 方有一对密钥（KBpub，KBpri），A 方给 B 方发送信息 M，对信息 M 加密为：M’=KBpub（KApri（））。B 方收到密文后需要用 A 方的公钥解密，所以正确的解决方案是 KApub（KBpri（M’））。故选 C 项。"},{"id":72,"section":"cs","type":"single","stem":"以下对跨站脚本攻击（XSS）的解释最准确的一项是（  ）。","passage":"","options":{"A":"引诱用户点击虚假网络链接的一种攻击方法","B":"构造精妙的关系数据库的结构化查询语言对数据库进行非法的访问","C":"一种很强大的木马攻击手段","D":"将恶意代码嵌入到用户浏览的 WEB 网页中，从而达到恶意的目的"},"answer":"D","analysis":"XSS 又叫 CSS（Cross Site Script），跨站脚本攻击。它指的是恶意攻击者往Web 页面里插入恶意 html 代码，当用户浏览该页之时，嵌入其中 Web 里面的 html 代码会被执行，从而达到恶意用户的特殊目的。故选 D 项。"},{"id":73,"section":"cs","type":"single","stem":"2021 年 9 月 1 日起施行的《关键信息基础设施安全保护条例》规定，运营者应当自行或者委托网络安全服务机构对关键信息基础设施（  ）网络安全监测和风险评估。","passage":"","options":{"A":"每两年至少进行一次","B":"每年至少进行一次","C":"每半年至少进行一次","D":"每季度至少进行一次"},"answer":"B","analysis":"《关键信息基础设施安全保护条例》规定，运营者应当自行或者委托网络安全服务机构对关键信息基础设施每年至少进行一次检测和风险评估，并将检测和风险评估报告报送国家网信部门、国务院电信主管部门、国务院公安部门和国家保密行政管理部门。故选 B 项。"},{"id":74,"section":"cs","type":"single","stem":"杀毒软件报告发现病毒 Macro.Melissa，由该病毒名称可以推断出病毒类型是（  ），这类病毒主要感染目标是（  ）。","passage":"","options":{"A":"宏病毒，EXE 或 COM 可执行文件","B":"引导型，磁盘引导区","C":"宏病毒，Word 或 Excel 文件","D":"引导型，DDL 系统文件"},"answer":"C","analysis":"Macro.Melissa 是一种宏病毒，主要感染 Word 或 Excel 文件。一旦打开这样的文档，其中的宏就会被执行，宏病毒就会被激活，转移到计算机上，并驻留在 Normal模板上。从此以后，所有自动保存的文档都会“感染”上这种宏病毒，而且如果其他用户打开了感染病毒的文档，宏病毒又会转移到他的计算机上。故选 C 项。"},{"id":75,"section":"cs","type":"single","stem":"以下哪一项协议不能被攻击者用来进行 DoS 攻击？（  ）","passage":"","options":{"A":"TCP","B":"ICMP","C":"UDP","D":"IPSec"},"answer":"D","analysis":"DOS 攻击称为拒绝服务攻击，主要是占用服务器的系统资源，IPSec 协议具有身份认证功能，可以拒绝 DOS 攻击。故选 D 项。"},{"id":76,"section":"cs","type":"single","stem":"关于 IT 治理与 IT 管理的关系描述，不正确的是（  ）。","passage":"","options":{"A":"IT 管理和 IT 治理相辅相成，缺一不可","B":"IT 治理是 IT 管理的基石","C":"IT 治理比 IT 管理更宏观","D":"IT 治理是在 IT 管理既定模式下采取的行动"},"answer":"C","analysis":"IT 治理和 IT 管理都是企业进行信息化建设的重要部分，但它们侧重点不同。IT 治理是关于企业或组织中 IT 应用系统的规划、组织、领导、控制和监督的活动，它更加关注于宏观的战略和政策层面，而 IT 管理则更加关注于日常的运营和管理层面。IT 治理和 IT 管理是相互关联但不同层次的概念，不存在比较大小的问题。故选 C 项。"},{"id":77,"section":"cs","type":"single","stem":"根据《中华人民共和国网络安全法》的规定，国家实行网络安全（  ）保护制度。","passage":"","options":{"A":"分类","B":"分级","C":"行政级别","D":"等级"},"answer":"D","analysis":"为了保障网络安全，维护网络空间主权和国家安全、社会公共利益，保护公民、法人和其他组织的合法权益，促进经济社会信息化健康发展，制定了相关法律法规。该法明确规定：国家对公共通信和信息服务、能源、交通、水利、金融、公共服务、电子政务等重要行业和领域，以及其他一旦遭到破坏、丧失功能或者数据泄露，可能严重危害国家安全、国计民生、公共利益的关键信息基础设施，在网络安全等级保护制度的基础上，实行重点保护。故选 D 项。"},{"id":78,"section":"cs","type":"single","stem":"制订业务连续性计划（BCP）的第一步是（  ）。","passage":"","options":{"A":"执行模拟演练","B":"执行业务影响分析（BIA）","C":"识别备份方案","D":"制订业务恢复计划"},"answer":"B","analysis":"在制订 BCP 之前，企业需要先进行执行业务影响分析 BIA，以确定企业的关键业务流程和资源，并评估这些业务流程和资源面临的风险，从而为后续的 BCP 制订提供重要的参考和指导。故选 B 项。"},{"id":79,"section":"cs","type":"single","stem":"银行业金融机构应当按照（  ）原则，采取与风险程度适应的重要信息系统投产及变更策略。","passage":"","options":{"A":"对业务影响最小","B":"对机构影响最小","C":"对利润影响最小","D":"对系统影响最小"},"answer":"A","analysis":"银行业金融机构应当按照对业务影响最小原则，采取与风险程度相适应的重要信息系统投产及变更策略。故选 A 项。"},{"id":80,"section":"cs","type":"single","stem":"以下对商业银行董事会应履行的信息科技管理职责描述不准确的是（  ）。","passage":"","options":{"A":"审查批准信息科技战略","B":"确保信息科技风险管理工作所需资金","C":"审核信息科技员工的道德品行","D":"每年审阅并向监管机构报送信息科技风险的年度报告"},"answer":"C","analysis":"《商业银行信息科技风险管理指引》规定，商业银行的董事会应履行以下信息科技管理职责：（一）遵守并贯彻执行国家有关信息科技管理的法律、法规和技术标准，落实中国银行业监督管理委员会（以下简称银监会）相关监管要求。（二）审查批准信息科技战略，确保其与银行的总体业务战略和重大策略相一致。评估信息科技及其风险管理工作的总体效果和效率。（三）掌握主要的信息科技风险，确定可接受的风险级别，确保相关风险能够被识别、计量、监测和控制。（四）规范职业道德行为和廉洁标准，增强内部文化建设，提高全体人员对信息科技风险管理重要性的认识。（五）设立一个由来自高级管理层、信息科技部门和主要业务部门的代表组成的专门信息科技管理委员会，负责监督各项职责的落实，定期向董事会和高级管理层汇报信息科技战略规划的执行、信息科技预算和实际支出、信息科技的整体状况。（六）在建立良好的公司治理的基础上进行信息科技治理，形成分工合理、职责明确、相互制衡、报告关系清晰的信息科技治理组织结构。加强信息科技专业队伍的建设，建立人才激励机制。（七）确保内部审计部门进行独立有效的信息科技风险管理审计，对审计报告进行确认并落实整改。（八）每年审阅并向银监会及其派出机构报送信息科技风险管理的年度报告。（九）确保信息科技风险管理工作所需资金。（十）确保银行所有员工充分理解和遵守经其批准的信息科技风险管理制度和流程，并安排相关培训。（十一）确保本法人机构涉及客户信息、账务信息以及产品信息等的核心系统在中国境内独立运行，并保持最高的管理权限，符合银监会监管和实施现场检查的要求，防范跨境风险。（十二）及时向银监会及其派出机构报告本机构发生的重大信息科技事故或突发事件，按相关预案快速响应。（十三）配合银监会及其派出机构做好信息科技风险监督检查工作，并按照监管意见进行整改。（十四）履行信息科技风险管理其他相关工作。审核信息科技员工的道德品行是商业银行对信息科技部门内部管理职责的要求，C 项错误，故选 C 项。"},{"id":81,"section":"multi","type":"multi","stem":"以下排序方法中，每一趟排序至少能确定 1 个元素最终位置的有（  ）。","passage":"","options":{"A":"简单选择排序","B":"希尔排序","C":"快速排序","D":"堆排序"},"answer":"ACD","analysis":"每一趟排序至少能确定一个元素最终位置的排序算法包括简单选择排序、堆排序和快速排序。希尔排序虽然也是选择排序的一种，但它并不保证每一趟排序能确定一个元素的最终位置。故选 ACD 项。"},{"id":82,"section":"multi","type":"multi","stem":"信息系统的容灾方案通常要考虑的要点有（  ）。","passage":"","options":{"A":"灾难的类型","B":"恢复时间","C":"恢复技术和恢复程度","D":"成本"},"answer":"ABCD","analysis":"信息系统的容灾方案通常需要考虑多个要点，以应对各种可能发生的灾难，包括：（1）灾难的类型：不同的灾难类型可能对信息系统产生不同的影响，例如自然灾害、人为错误、恶意攻击等。因此，容灾方案需要考虑可能发生的不同类型的灾难，并制定相应的应对措施。（2）恢复时间：容灾方案需要确定在灾难发生后，信息系统能够恢复到正常运营的时间。这个时间应该尽可能短，以减少对业务的影响。为了实现这一点，容灾方案需要考虑数据备份和恢复策略、系统高可用性设计等因素。（3）恢复程度：容灾方案需要确定在灾难发生后，信息系统能够恢复到的状态。这可能涉及数据完整性问题、应用一致性问题以及系统的可用性和可扩展性问题等。为了解决这些问题，容灾方案需要考虑采用数据复制、快照等技术，以及制定相应的应急预案。（4）效果相关：容灾方案的效果通常需要进行评估和测试，以确保其能够在灾难发生后有效地恢复信息系统。这可能涉及容灾方案的可行性、成本效益以及与业务需求的符合程度等方面。（5）备份策略：备份是容灾的基础，因此容灾方案需要考虑备份策略，包括备份频率、备份内容、备份存储位置等问题。同时，还需要定期进行备份测试和恢复测试，以确保备份数据的可用性和完整性。（6）技术选择：容灾方案需要选择合适的技术来实现容灾目标，例如数据备份技术、数据复制技术、快照技术等。同时，还需要考虑技术的成熟度、可扩展性以及成本等因素。（7）人员培训：容灾方案需要制定相应的培训计划，以提高员工对容灾方案的认识和应急处理能力。培训内容可以包括应急预案、操作流程、备份与恢复流程等。（8）监控与检测：容灾方案需要建立相应的监控和检测机制，以实时监测系统的运行状态和数据备份情况。当发生异常情况时，需要及时报警并采取相应的处理措施，以避免灾难的发生或减少灾难的影响。（9）文档记录：容灾方案需要建立完善的文档记录制度，以记录容灾方案的实施过程、备份数据情况以及应急预案等内容。这些文档可以作为未来参考和评估的依据，同时也可以帮助员工更好地了解和掌握容灾方案。（10）定期审查：容灾方案需要定期进行审查和更新，以适应业务需求和技术发展的变化。审查可以包括对备份数据的检查、技术设备的测试和维护以及应急预案的修订等。故选 ABCD 项。"},{"id":83,"section":"multi","type":"multi","stem":"软件开发中，以下属于 MVC 设计模式概念的有（  ）。","passage":"","options":{"A":"模型","B":"视图","C":"集合","D":"控制"},"answer":"ABD","analysis":"MVC 设计模式是软件工程中的一种软件架构模式，把软件系统分为三个基本部分：模型（Model）、视图（View）和控制器（Controller）。故选 ABD 项。"},{"id":84,"section":"multi","type":"multi","stem":"对 Web 服务器进行性能评估的主要指标包括（  ）。","passage":"","options":{"A":"丢包率","B":"最大并发连接数","C":"响应延迟","D":"吞吐量"},"answer":"BCD","analysis":"对 Web 服务器进行性能评估的指标包括：吞吐量（Throughput）：Web 服务器每秒可以处理的请求数量，通常以每秒请求数（RPS）或每秒事务数（TPS）来衡量。并发能力（Concurrency）：Web 服务器同时处理多个请求的能力，通常以并发连接数（Concurrent Connections）或每秒并发请求数来衡量。响应时间（Response Time）：Web 服务器处理单个请求所需的时间，通常以毫秒为单位来衡量。可用性（Availability）：Web 服务器在给定时间内提供服务的能力，通常以可用性百分比或 99.9% 的可用性时间来衡量。可扩展性（Scalability）：Web 服务器在增加硬件资源（如 CPU、内存、存储等）后，性能提升的能力。稳定性（Stability）：Web 服务器在长时间运行或高负载情况下，保持稳定性能的能力。安全性（Security）：Web 服务器保护数据和资源免受未经授权的访问、篡改或破坏的能力。可靠性（Reliability）：Web 服务器在给定时间内提供无故障服务的能力。可维护性（Maintainability）：Web 服务器的代码质量和可维护性，以及故障修复的速度和能力。性能测试（Performance Testing）：对 Web 服务器进行性能测试，以评估其在实际应用场景中的性能表现。故选 BCD 项。"},{"id":85,"section":"multi","type":"multi","stem":"区块链技术的特点是（  ）。","passage":"","options":{"A":"去中心化","B":"分布式","C":"共识机制","D":"不可篡改"},"answer":"ABCD","analysis":"区块链技术的特点包括以下五个方面：去中心化：区块链技术不依赖额外的第三方管理机构或硬件设施，没有中心管制，除了自成一体的区块链本身，通过分布式核算和存储，各个节点实现了信息自我验证、传递和管理。开放性：区块链技术基础是开源的，除了交易各方的私有信息被加密外，区块链的数据对所有人开放，任何人都可以通过公开的接口查询区块链数据和开发相关应用，因此整个系统信息高度透明。独立性：基于协商一致的规范和协议（类似比特币采用的哈希算法等各种数学算法），整个区块链系统不依赖其他第三方，所有节点能够在系统内自动安全地验证、交换数据，不需要任何人为的干预。安全性：只要不能掌控全部数据节点的 51%，就无法肆意操控修改网络数据，这使区块链本身变得相对安全，避免了主观人为的数据变更。匿名性：区块链技术允许用户通过生成私钥来证明自己的身份，同时也可以在不暴露真实身份的情况下进行交易。这种匿名性可以保护用户的隐私，并且使得交易更加便捷。故选 ABCD 项。"},{"id":86,"section":"multi","type":"multi","stem":"下列关于函数的说法，不正确的是（  ）。","passage":"","options":{"A":"函数既可以嵌套定义，又可以嵌套调用","B":"函数必须有返回值，否则不能使用函数","C":"在 C 程序中有调用关系的所有函数必须放在同一个源程序文件中","D":"在 C 程序中调用函数，若函数的参数是简单变量，则只能把实参的值传递给形参，形参的值不能传递给实参"},"answer":"ABC","analysis":"A 选项，函数可以嵌套调用，但是不能嵌套定义，A 错误；函数无返回值使用 void 修饰；函数的参数是变量时，是单向传递，数据可以由实参传递给形参，但是不能传回。故选 ABC 项。"},{"id":87,"section":"multi","type":"multi","stem":"下列关于敏捷方法的叙述，正确的是（  ）。","passage":"","options":{"A":"敏捷方法强调可工作的软件胜过大量的文档","B":"敏捷方法强调软件过程与工具胜过个体和交互","C":"敏捷方法强调尽早提交有价值的软件","D":"敏捷方法强调小版本发布"},"answer":"ACD","analysis":"敏捷方法强调可工作的软件胜过大量的文档。这意味着敏捷团队更注重交付实际运行的软件，而不是过多的文档和计划。客户更关心软件的可用性和功能，而不是文档的完整性和详细程度。因此，敏捷团队会保持文档简单且易于理解。A 项正确；敏捷方法并非不重视个体和交互，而是强调使用适当的工具和方法来优化整个开发过程。通过使用合适的工具和自动化方法，可以提高开发效率和质量，B 项不准确；敏捷方法强调尽早提交有价值的软件。这与尽早发现问题并进行修复的理念是一致的。通过尽早提交软件，客户可以更快地看到结果并给出反馈，从而帮助团队更好地理解客户需求并及时调整方向，C 项正确；敏捷方法强调小版本发布。这意味着敏捷团队不会一次性地完成整个系统的开发，而是将其分解为多个小版本，每个版本包含特定的功能或改进。通过小版本的发布，团队可以更快地获取反馈并进行迭代，从而提高开发效率和交付质量。D 项正确。故选 ACD 项。"},{"id":88,"section":"multi","type":"multi","stem":"关于需求分析的描述，不正确的是（  ）。","passage":"","options":{"A":"需求分析是确定满足所选择方案的特定的信息需求","B":"需求分析阶段需要编写完成《系统设计说明书》","C":"需求分析是许多大型信息系统花费精力最多的阶段","D":"需求分析可以忽略组织原有的目标，但不能忽略业务过程和决策过程"},"answer":"BD","analysis":"需求分析是软件开发过程中一个非常重要的阶段，它决定了系统的功能和特性，是后续设计和开发的基础。在这个阶段，需要对用户的需求进行深入的了解和分析，确定系统的目标、范围和约束条件，并编写相应的文档，如《需求规格说明书》。A、C项正确。在需求分析阶段之后，需要进行系统设计，包括系统的架构设计、模块设计、数据库设计、界面设计等，这些工作完成后，才能编写《系统设计说明书》。B 项错误；需求分析阶段需要了解和考虑组织原有的目标、业务过程和决策过程，以便确定新的系统需求。同时，还需要考虑系统的可行性和可实现性，不能忽略任何重要的方面。D 项错误。故选 BD 项。"},{"id":89,"section":"multi","type":"multi","stem":"以下关于运维、运营和经营的说法，正确的是（  ）。","passage":"","options":{"A":"运营是采用信息技术手段及方法，依据需求方提出的服务级别要求，对其信息系统的基础环境、硬件、软件及安全等提供的各种技术支持和管理服务","B":"运营强调以经营为中心，是把投入的资源（生产要素）按照特定要求转换为产出（产品和服务）的过程","C":"企业的运营目标、按其重要性来说，可分为战略目标和战术目标","D":"面向操作系统、数据库系统、中间件和办公软件等的运维服务属于基础软件的运维服务"},"answer":"BCD","analysis":"A 项错误，运营是对企业生产运营系统的投入要素进行转换，输出产品和服务的过程，不仅仅是对信息系统提供的各种技术支持和管理服务。B 项正确，运营是以经营为中心，把投入的资源（生产要素）按照特定要求转换为产出（产品和服务）的过程。C 项正确，企业的运营目标按照其重要性来说，可以分为战略目标和战术目标。D 选项确，面向操作系统、数据库系统、中间件和办公软件等的运维服务属于基础软件的运维服务。故选 BCD 项。"},{"id":90,"section":"multi","type":"multi","stem":"与传统 IT 运维管理相比，云运维管理的特点包括（  ）。","passage":"","options":{"A":"分散化","B":"资源物理化","C":"资源池","D":"集中化"},"answer":"CD","analysis":"云运维管理具有集中化、弹性、高可用性、自动化、安全性、多租户和按需付费等特点，这些特点使得云运维管理能够更加灵活、高效地应对云计算环境下的 IT 系统运维需求。故选 CD 项。"},{"id":91,"section":"multi","type":"multi","stem":"使用 VLAN 有许多好处，其中包括（  ）。","passage":"","options":{"A":"扩展了通信范围","B":"减少了网络的流量","C":"对用户可以分别实施管理","D":"提高了网络的利用率"},"answer":"ABCD","analysis":"VLAN 的好处包括：简化网络管理：VLAN 可以将多个网络设备集成在一起，通过统一的接口进行管理和配置，从而简化了网络管理的复杂性。管理员可以更方便地监控和控制网络设备，提高工作效率。提高网络性能：VLAN 可以通过优化网络流量和负载均衡来提高网络性能。它可以根据应用程序的需求和网络负载情况来动态分配带宽，确保关键业务得到优先处理，从而提高整体的网络性能。降低网络成本：VLAN 通过集中化的管理和资源共享，可以降低网络设备的购置和维护成本。它减少了设备冗余和浪费，提高了设备的利用率，从而降低了企业的网络成本。增强网络安全：VLAN 可以提供更强大的网络安全功能，如访问控制、入侵检测、数据加密等。通过对网络流量的监控和分析，VLAN 可以及时发现和应对网络安全威胁，保护企业的数据和资产安全。便于扩展和升级：VLAN 具备较好的扩展性和灵活性，可以根据企业的需求进行扩展和升级。当企业需要增加网络设备或升级网络技术时，VLAN 可以更容易地适应这些变化，降低升级成本和风险。提高业务连续性：VLAN 可以通过提供高可用性和冗余备份机制来提高业务连续性。当某个网络设备或链路出现故障时，VLAN 可以自动切换到备用设备或路径，确保业务的正常运行。故选 ABCD 项。"},{"id":92,"section":"multi","type":"multi","stem":"下列关于数据库索引的说法，正确的有（  ）。","passage":"","options":{"A":"建立索引的目的是提高查询速度","B":"建立索引使用 CREATE INDEX 语句","C":"删除索引使用 DELETE INDEX 语句","D":"一个基本表中能建立一个或多个索引"},"answer":"ABD","analysis":"索引是一种数据结构，它可以帮助数据库系统更快地查询和检索数据。通过建立索引，数据库系统可以大大提高查询速度。A 项是正确。在创建索引时，可以使用 CREATE INDEX 语句。B 项是正确。删除索引需要使用 DROP INDEX 语句，而不是DELETE INDEX 语句。DROP INDEX 语句用于删除指定的索引。C 项错误。在一个基本表中，可以建立一个或多个索引。索引可以提高查询速度，但是过多的索引会增加数据插入、更新和删除操作的开销。因此，需要根据实际情况选择合适的索引数量。D 项是正确。故选ABD 项。"},{"id":93,"section":"multi","type":"multi","stem":"某地教育部门的高考查分系统遭遇数据库性能瓶颈，以下哪些方式能短时间内针对性地解决问题？（  ）。","passage":"","options":{"A":"更换性能更强的服务器","B":"增加服务器，部署 nginx 负载均衡","C":"部署 Redis 缓存","D":"增加从数据库，读写分离"},"answer":"BCD","analysis":"更换性能更强的服务可以解决硬件性能瓶颈，但可能会涉及其他软件层面的问题，如数据库优化、网络带宽等，因此不能保证能在短时间内解决问题，A 项排除；通过负载均衡，可以将数据库的请求分散到多台服务器上，从而提高整体的处理能力。这种方式可以在短时间内解决问题，但需要考虑到网络延迟、数据同步等问题，B 项当选；Redis 是一种内存数据库，可以用来缓存热点数据，减轻数据库的负载。这种方式可以在短时间内提高查询速度，C 项当选；通过读写分离，可以将读操作分流到多个从数据库上，从而减轻主数据库的负载。这种方式可以在短时间内提高查询速度，D项当选。故选 BCD项。"},{"id":94,"section":"multi","type":"multi","stem":"在 OSI 模型中，网络层的功能有（  ）。","passage":"","options":{"A":"路由选择","B":"流量控制","C":"拥塞控制","D":"网络连接的建立与管理"},"answer":"ABCD","analysis":"在 OSI（开放系统互联）模型中，网络层的主要功能包括：分组与分组交换：将从传输层接收到的数据报文封装成分组（也称为“包”）并向下传送到数据链路层。路由选择：根据网络层中的路由表，为分组选择最佳路径，以实现网络互联。网络连接复用：通过网络连接复用技术，提高网络传输效率。差错检测与恢复：检测并纠正分组在传输过程中可能出现的错误，确保数据的完整性。服务选择：为传输层提供数据报和虚电路两种服务，但 Internet 的网络层仅为传输层提供数据报一种服务。网络管理：管理网络中的数据通信过程，将数据设法从源端经过若干个中间节点传送到目的端，为传输层提供最基本的端到端的数据传送服务。流量控制：监控网络流量，防止网络拥塞，确保数据顺畅传输。拥塞控制：当网络出现拥塞时，采取适当的控制措施进行疏导，以维护网络的正常运行。分片与重组：如果要发送的分组超过了协议数据单元允许的长度，则源节点的网络层就要对该分组进行分片，分片到达目的主机后，由目的节点的网络层再重新组装成原分组。故选 ABCD 项。"},{"id":95,"section":"multi","type":"multi","stem":"物联网是一种虚拟网络与现实世界实时交互的新型系统，关于特点描述正确的是（  ）。","passage":"","options":{"A":"无处不在的数据感知","B":"以无线为主的信息传输","C":"智能化的信息处理","D":"以物理网传输为主干网"},"answer":"ABC","analysis":"物联网是一种虚拟网络与现实世界实时交互的新型系统，它的特点包括无处不在的数据感知、以无线为主的信息传输、智能化的信息处理，而不是以物理网传输为主干网。故选 ABC 项。"},{"id":96,"section":"multi","type":"multi","stem":"2017 年 5 月，全球大面积爆发 WannaCry 勒索病毒，受害者电脑会被黑客锁定并勒索赎金。为有效应对勒索病毒攻击，下列说法正确的是（  ）。","passage":"","options":{"A":"尽快升级操作系统版本","B":"安装操作系统补丁","C":"重启已中病毒的计算机以恢复数据","D":"加强防火墙访问控制策略，关闭不必要的文件共享端口"},"answer":"ABD","analysis":"预防计算机病毒的主要手段有：升级操作系统版本、安装操作系统补丁，设置防火墙，关闭端口，进行访问控制等操作。勒索病毒主要是加密文件，重启计算机不会恢复数据。故选 ABD 项。"},{"id":97,"section":"multi","type":"multi","stem":"在 Web 系统开发时，下列选项中的技术能避免注入漏洞出现的是（  ）。","passage":"","options":{"A":"使用预编译语句","B":"给关键 Cookie 植入 Httponly 标识","C":"使用存储过程来验证用户的输入","D":"在数据类型、长度、格式和范围等方面对用户输入进行过滤"},"answer":"ABCD","analysis":"预编译语句也称为参数化查询，可以防止 SQL 注入攻击。在执行 SQL 查询之前，将查询参数作为参数传递给查询，而不是将它们拼接到 SQL 查询中。这样，数据库将把参数视为不可变的字符串，从而避免了注入攻击。A 项正确；HttpOnly 是一个安全性标志，可以防止 JavaScript 读取含有敏感信息的 Cookie。如果 Cookie 被标记为 HttpOnly，那么 JavaScript 无法访问其中的内容，从而防止了跨站脚本攻击（XSS）。B 项正确；存储过程是一段预编译的 SQL 代码，可以在数据库端执行。使用存储过程可以对用户的输入进行有效的验证，只允许符合规定的输入被执行。这样即使输入不符合预期，也无法引起注入漏洞；C 项正确；对用户输入进行过滤是一种简单而有效的防止注入攻击的方法。对用户输入进行过滤，确保输入符合预期的数据类型、长度、格式和范围等要求，可以有效地防止恶意输入被注入系统中。D 项正确。故选 ABCD 项。"},{"id":98,"section":"multi","type":"multi","stem":"《中华人民共和国个人信息保护法》规定个人信息处理者在处理个人信息前，应当以显著方式、清晰易懂的语言真实、准确、完整地向个人告知下列事项（  ）。","passage":"","options":{"A":"个人信息处理者的名称或者姓名和联系方式","B":"个人信息的处理目的、处理方式、处理的个人信息种类、保存期限","C":"个人行使本法规定权利的方式和程序","D":"法律、行政法规规定应当告知的其他事项"},"answer":"ABCD","analysis":"按照《个人信息保护法》第十七条规定，应当告知：（一）个人信息处理者的名称或者姓名和联系方式；（二）个人信息的处理目的、处理方式，处理的个人信息种类、保存期限；（三）个人行使本法规定权利的方式和程序；（四）法律、行政法规规定应当告知的其他事项。前款规定事项发生变更的，应当将变更部分告知个人。故选 ABCD 项。"},{"id":99,"section":"multi","type":"multi","stem":"为全面推进银行业和保险业数字化转型，推动金融高质量发展，更好地服务实体经济和满足人民群众需要，原中国银保监会于 2022 年初印发了《关于银行业保险业数字化转型的指导意见》，其中在科技能力建设方面提出的指导方向包括（  ）。","passage":"","options":{"A":"加大数据中心基础设施弹性供给","B":"提高科技架构支撑能力","C":"推动科技管理敏捷转型","D":"提高新技术应用和自主可控能力"},"answer":"ABCD","analysis":"在科技能力建设方面强调加大数据中心基础设施弹性供给、提高科技架构支撑能力、推动科技管理敏捷转型以及提高新技术应用和自主可控能力。同时，坚持自主可控原则，鼓励银行保险机构组织创新研究，建立人机结合的分析系统，促进经验提炼和知识积累。故选 ABCD 项。"},{"id":100,"section":"multi","type":"multi","stem":"关于开源软件风险，以下说法正确的是（  ）。","passage":"","options":{"A":"开源软件因为开放了源代码，没有 license，所以企业使用开源软件不存在许可证违规风险","B":"开源软件存在的安全漏洞可能会被引入到企业软件当中，且这种漏洞无法从公开漏洞库信息中检索并识别，所以存在较大风险","C":"参与开源项目的企业可能因管理不善造成自有知识产权代码泄露风险","D":"使用开源软件的企业应当根据自身的需求和具体情况来制定相应的开源管理策略，明确使用或参与开源的基本原则、对开源软件的管理方法等"},"answer":"BCD","analysis":"A 项错误，开源软件虽然开放了源代码，但是没有许可证，依然存在许可证违规风险。B 项正确，开源软件存在的安全漏洞可能会被引入到企业软件当中，且这种漏洞无法从公开漏洞库信息中检索并识别，所以存在较大风险。C 项正确，参与开源项目的企业可能因管理不善造成自有知识产权代码泄露风险。D 项正确，使用开源软件的企业应当根据自身的需求和具体情况来制定相应的开源管理策略，明确使用或参与开源的基本原则、对开源软件的管理方法等。故选 BCD 项。"},{"id":101,"section":"eng","type":"single","stem":"Why doesn't the author think the housing market is fully recovered ?（ ）","passage":"The housing market exited the trauma ward（急救室）in 2021. Prices rose as much as 30 percent in some areas, bidding wars broke out and the foreclosure rate（丧失赎取权率）halved from its peak. But the patient is by no means fully recovered. In fact, five years after the housing bubble collapsed, one in five mortgage holders still owe more than their home is worth. At its worst in early 2020, almost 16 million Americans were underwater on their mortgage. In some of the hardest hit neighborhoods, such as Las Vegas, Phoenix, and Detroit, 70 percent of homeowners owed more than the value of their home. Since then, rising home prices have pushed 5 million homeowners back into the black, but 11 million out of a total of 50 million mortgage holders remain in what financial folks call a negative equity position.“This is the new normal in the housing market,”said Svenja Gudell, director of economic research at Zillow, an online real estate database,“We will have high levels of negative equity for some time.” With mortgage rates rising and expected to hit 5 percent late next year, many economists predict a more subdued housing market in 2022. That means price gains should moderate and it could take a while longer for homeowners who are underwater to recover. Out of the 75 million homeowners in America, about one in seven stay trapped in their homes, unable to move or sell. Housing prices have gone up and down over the decades, but until the financial crisis of 2008, it was rare to owe a bank more than a home is worth. For all of the 19th century and even during the Great Depression, this was virtually unheard of. Until all the negative equity disappears, the housing market won't be back to normal. It looks like we still have years to go.","options":{"A":"In some places, housing prices rose as much as 30%.","B":"There were bidding wars broke out frequently.","C":"The foreclosure rate halved from its peak.","D":"Some homeowners owe more than the value of their home."},"answer":"D","analysis":"从第一段的“five years after the housing bubble collapsed, one in five mortgage holders still owe more than their home is worth.”可以看出，有五分之一的抵押权人的债务仍超过他们房子的价值，说明笔者并不认为房地产市场已经完全恢复。故选 D 项。"},{"id":102,"section":"eng","type":"single","stem":"What does the phrase“back into the black”（Line 4, Paragraph 2）mean ?（ ）","passage":"The housing market exited the trauma ward（急救室）in 2021. Prices rose as much as 30 percent in some areas, bidding wars broke out and the foreclosure rate（丧失赎取权率）halved from its peak. But the patient is by no means fully recovered. In fact, five years after the housing bubble collapsed, one in five mortgage holders still owe more than their home is worth. At its worst in early 2020, almost 16 million Americans were underwater on their mortgage. In some of the hardest hit neighborhoods, such as Las Vegas, Phoenix, and Detr  owe a bank more than a home is worth.”看出，“this”指代前面所提到的欠银行的钱超过房子的价值。故选 A 项。"},{"id":105,"section":"eng","type":"single","stem":"What can we learn from the last paragraph?（ ）","passage":"The housing market exited the trauma ward（急救室）in 2021. Prices rose as much as 30 percent in some areas, bidding wars broke out and the foreclosure rate（丧失赎取权率）halved from its peak. But the patient is by no means fully recovered. In fact, five years after the housing bubble collapsed, one in five mortgage holders still owe more than their home is worth. At its worst in early 2020, almost 16 million Americans were underwater on their mortgage. In some of the hardest hit neighborhoods, such as Las Vegas, Phoenix, and Detroit, 70 percent of homeowners owed more than the value of their home. Since then, rising home prices have pushed 5 million homeowners back into the black, but 11 million out of a total of 50 million mortgage holders remain in what financial folks call a negative equity position.“This is the new normal in the housing market,”said Svenja Gudell, director of economic research at Zillow, an online real estate database,“We will have high levels of negative equity for some time.” With mortgage rates rising and expected to hit 5 percent late next year, many economists predict a more subdued housing market in 2022. That means price gains should moderate and it could take a while longer for homeowners who are underwater to recover. Out of the 75 million homeowners in America, about one in seven stay trapped in their homes, unable to move or sell. Housing prices have gone up and down over the decades, but until the financial crisis of 2008, it was rare to owe a bank more than a home is worth. For all of the 19th century and even during the Great Depression, this was virtually unheard of. Until all the negative equity disappears, the housing market won't be back to normal. It looks like we still have years to go.","options":{"A":"The housing price will rise again in 2024.","B":"The housing price will never go up again.","C":"The housing market will not be back to normal soon.","D":"The housing market can recover in 2024."},"answer":"C","analysis":"从最后一段第一句“Until all the negative equity disappears, the housing market won't be back to normal.”可以看出，直到所有负资产消失，房地产市场才会恢复正常。故选 C 项。"},{"id":106,"section":"eng","type":"single","stem":"From the first paragraph we can learn that  .","passage":"Many of us are fearful of making changes in our work lives—fear is a natural human condition. We feel less threatened when we stick with the familiar. As long as we are receiving a paycheck, we tolerate the dissatisfaction. Better to just play it safe. But the safety net we preserve requires a big trade - off. It often denies us the opportunity to experience work that makes us happy, that is consistent with our desires while still meeting our monetary needs. Yet many of us strap ourselves into jobs in which the only reward is money. We breed cynicism when we treat our work as nothing more than a financial equation, a necessity we tolerate in order to acquire funds to live, with the hope of somehow achieving success and happiness along the way. That's really true most of us want to be happy. We spend 80,000 hours of our lives at work. Yet, we view happiness as something to be achieved“outside” of work. We hire ourselves out on Monday through Friday and“live”for the weekends. Most of us didn't choose our careers to fulfill a purpose or mission. On the contrary, we just looked for“a good job with a good company”, reflecting such criteria as pay, title and security. We reasoned that if we could“get a foot in the door”and work hard, our careers would grow over time, actually, that our careers and work lives would just happen“by accident”. Because of this, many of us have careers today that are just“accidents waiting to happen”. Everyday business decisions, a reorganization plan, an acquisition by another company, a relocation out of the country, can throw our work lives into danger. But despite this uncertainty, some of us still cling to our jobs, dissatisfying as they may be. Can't take that risk! “Hanging on”involves risk too. For when we sacrifice pleasure for pay, our work lacks dignity, uses our energy and, ultimately, breaks our spirit. An unhappy, unfulfilled work life contributes to an unhappy, unfulfilled personal life. Happiness in work, as happiness in love, demands a measure of risk. Author Marsha Simetar suggests that if you“do what you love, the money will follow”. Certainly this may seem a bit risky, perhaps idealistic, but it is undoubtedly true that people who love what they do find ways to make the most money.","options":{"A":"fear is one of the fundamental traits in human character defects","B":"people tend to keep stable work to avoid the fear of changes","C":"the paycheck makes people feel safe about their work","D":"people feel less fearful under natural human conditions"},"answer":"B","analysis":"从第一段第二句“We feel less threatened when we stick with the familiar.”可以看出，当我们做自己熟悉的事时，不会感觉到威胁。B 项，人们倾向于保持稳定的工作以避免害对变化的恐惧，与这个表述一致。故选 B 项。"},{"id":107,"section":"eng","type":"single","stem":"But the safety net we preserve requires a big trade - off(Line 1,Paragraph 2). The author means  .","passage":"Many of us are fearful of making changes in our work lives—fear is a natural human condition. We feel less threatened when we stick with the familiar. As long as we are receiving a paycheck, we tolerate the dissatisfaction. Better to just play it safe. But the safety net we preserve requires a big trade - off. It often denies us the opportunity to experience work that makes us happy, that is consistent with our desires while still meeting our monetary needs. Yet many of us strap ourselves into jobs in which the only reward is money. We breed cynicism when we treat our work as nothing more than a financial equation, a necessity we tolerate in order to acquire funds to live, with the hope of somehow achieving success and hap ，它会经常剥夺我们体验快乐工作的机会，但是它能符合我们的愿望，并且满足我们的货币需求。这也就是说，安全意味着牺牲金钱需求和工作幸福之间的平衡。故选 C 项。"},{"id":108,"section":"eng","type":"single","stem":"According to the passage,when changes throw our work lives into danger,we will usually  .","passage":"Many of us are fearful of making changes in our work lives—fear is a natural human condition. We feel less threatened when we stick with the familiar. As long as we are receiving a paycheck, we tolerate the dissatisfaction. Better to just play it safe. But the safety net we preserve requires a big trade - off. It often denies us the opportunity to experience work that makes us happy, that is consistent with our desires while still meeting our monetary needs. Yet many of us strap ourselves into jobs in which the only reward is money. We breed cynicism when we treat our work as nothing more than a financial equation, a necessity we tolerate in order to acquire funds to live, with the hope of somehow achieving success and happiness along the way. That's really true most of us want to be happy. We spend 80,000 hours of our lives at work. Yet, we view happiness as something to be achieved“outside” of work. We hire ourselves out on Monday through Friday and“live”for the weekends. Most of us didn't choose our careers to fulfill a purpose or mission. On the contrary, we just looked for“a good job with a good company”, reflecting such criteria as pay, title and security. We reasoned that if we could“get a foot in the door”and work hard, our careers would grow over time, actually, that our careers and work lives would just happen“by accident”. Because of this, many of us have careers today that are just“accidents waiting to happen”. Everyday business decisions, a reorganization plan, an acquisition by another company, a relocation out of the country, can throw our work lives into danger. But despite this uncertainty, some of us still cling to our jobs, dissatisfying as they may be. Can't take that risk! “Hanging on”involves risk too. For when we sacrifice pleasure for pay, our work lacks dignity, uses our energy and, ultimately, breaks our spirit. An unhappy, unfulfilled work life contributes to an unhappy, unfulfilled personal life. Happiness in work, as happiness in love, demands a measure of risk. Author Marsha Simetar suggests that if you“do what you love, the money will follow”. Certainly this may seem a bit risky, perhaps idealistic, but it is undoubtedly true that people who love what they do find ways to make the most money.","options":{"A":"express great dissatisfaction with the job","B":"feel uncertain about the risk","C":"take another work opportunity","D":"remain in the work position"},"answer":"D","analysis":"从第四段最后一句“... some of us still cling to our jobs, dissatisfying as they may be. Can't take that risk！”可以看出，虽然存在这样的不确定性，但是有些人仍然坚持他们的工作，尽管他们可能不满意。故选 D 项。"},{"id":109,"section":"eng","type":"single","stem":"We can learn from the passage that  .","passage":"Many of us are fearful of making changes in our work lives—fear is a natural human condition. We feel less threatened when we stick with the familiar. As long as we are receiving a paycheck, we tolerate the dissatisfaction. Better to just play it safe. But the safety net we preserve requires a big trade - off. It often denies us the opportunity to experience work that makes us happy, that is consistent with our desires while still meeting our monetary needs. Yet many of us strap ourselves into jobs in which the only reward is money. We breed cynicism when we treat our work as nothing more than a financial equation, a necessity we tolerate in order to acquire funds to live, with the hope of somehow achieving success and happiness along the way. That's really true most of us want to be happy. We spend 80,000 hours of our lives at work. Yet, we view happiness as something to be achieved“outside” of work. We hire ourselves out on Monday through Friday and“live”for the weekends. Most of us didn't choose our careers to fulfill a purpose or mission. On the contrary, we just looked for“a good job with a good company”, reflecting such criteria as pay, title and security. We reasoned that if we could“get a foot in the door”and work hard, our careers would grow over time, actually, that our careers and work lives would just happen“by accident”. Because of this, many of us have careers today that are just“accidents waiting to happen”. Everyday business decisions, a reorganization plan, an acquisition by another company, a relocation out of the country, can throw our work lives into danger. But despite this uncertainty, some of us still cling to our jobs, dissatisfying as they may be. Can't take that risk! “Hanging on”involves risk too. For when we sacrifice pleasure for pay, our work lacks dignity, uses our energy and, ultimately, breaks our spirit. An unhappy, unfulfilled work life contributes to an unhappy, unfulfilled personal life. Happiness in work, as happiness in love, demands a measure of risk. Author Marsha Simetar suggests that if you“do what you love, the money will follow”. Certainly this may seem a bit risky, perhaps idealistic, but it is undoubtedly true that people who love what they do find ways to make the most money.","options":{"A":"people struggle between the ideal work and monetary needs","B":"people do not have a sense of mission nowadays","C":"happiness and money can be both achieved during work in most cases","D":"the development of our careers is doomed to happen"},"answer":"A","analysis":"根据本文的整体内容可知，人们在理想的工作和金钱需求之间挣扎。故选A 项。"},{"id":110,"section":"eng","type":"single","stem":"The purpose of the author in writing the passage is to  .","passage":"Many of us are fearful of making changes in our work lives—fear is a natural human condition. We feel less threatened when we stick with the familiar. As long as we are receiving a paycheck, we tolerate the dissatisfaction. Better to just play it safe. But the safety net we preserve requires a big trade - off. It often denies us the opportunity to experience work that makes us happy, that is consistent with our desires while still meeting our monetary needs. Yet many of us strap ourselves into jobs in which the only reward is money. We breed cynicism when we treat our work as nothing more than a financial equation, a necessity we tolerate in order to acquire funds to live, with the hope of somehow achieving success and happiness along the way. That's really true most of us want to be happy. We spend 80,000 hours of our lives at work. Yet, we view happiness as something to be achieved“outside” of work. We hire ourselves out on Monday through Friday and“live”for the weekends. Most of us didn't choose our careers to fulfill a purpose or mission. On the contrary, we just looked for“a good job with a good company”, reflecting such criteria as pay, title and security. We reasoned that if we could“get a foot in the door”and work hard, our careers would grow over time, actually, that our careers and work lives would just happen“by accident”. Because of this, many of us have careers today that are just“accidents waiting to happen”. Everyday business decisions, a reorganization plan, an acquisition by another company, a relocation out of the country, can throw our work lives into danger. But despite this uncertainty, some of us still cling to our jobs, dissatisfying as they may be. Can't take that risk! “Hanging on”involves risk too. For when we sacrifice pleasure for pay, our work lacks dignity, uses our energy and, ultimately, breaks our spirit. An unhappy, unfulfilled work life contributes to an unhappy, unfulfilled personal life. Happiness in work, as happiness in love, demands a measure of risk. Author Marsha Simetar suggests that if you“do what you love, the money will follow”. Certainly this may seem a bit risky, perhaps idealistic, but it is undoubtedly true that people who love what they do find ways to make the most money.","options":{"A":"persuade people to choose careers with purpose","B":"criticize the phenomenon of working for money","C":"elaborate people's attitudes towards work and safety","D":"illustrate how to achieve safety of work lives"},"answer":"A","analysis":"从最后一段“... but it is undoubtedly true that people who love what they do find ways to make the most money.”可以看出，作者的最终目的还是要劝人们选择热爱的事业，毫无疑问，热爱自己所做的事的人会找到赚最多钱的方法。因此，本文的最终目的还是劝说人们要有目的地选择职业。故选 A 项。"},{"id":111,"section":"eng","type":"single","stem":"The word“jolted”(Paragraph 1) is closest in meaning to  .","passage":"The U.S. Federal Trade Commission (FTC) jolted the markets on Dec. 9th with filings that seek to force Facebook Inc. to sell Instagram and WhatsApp. The FTC is trying to achieve something that hasn't happened in four decades: the breakup of one of America's biggest companies. What makes the case all the more surprising is that it's the FTC, often criticized for lax enforcement, and not the U.S. Department of Justice (DOJ) pushing for the breakup.“The Facebook case is a really big deal,”says Sam Weinstein, who teaches at the Cardozo School of Law at Yeshiva University.“If we imagine the government winning and breaking up Facebook, that's a milestone.” The federal government and states across the U.S. have sued both Facebook and Alphabet's Google in recent weeks for abusing their dominant positions in social media and internet search, respectively. Together, the cares represent a watershed moment in U.S. antitrust enforcement and an escalation of regulatory pressure on the technology sector, which also includes a push to pare back a prized liability shield. Section 230 of the Communications Decency Act. But while the Google case says comfortably within legal precedent, the Facebook case represents a startling offensive. The FTC is staking out new territory in seeking to unwind Facebook's purchases of Instagram and WhatsApp—deals that the agency approved in 2012 and 2014. It's pursuing a unique line of attack. Rather than targeting the Instagram and WhatsApp deals individually as illegal under traditional merger law, the agency argues that they are part of a broader strategy by Facebook to monopolize social media. The DOJ's Google suit, by contrast, adheres to the legal framework of the U.S. monopoly case against Microsoft Corp. from 1998. The 1998 Microsoft lawsuit charged that the software giant's agreements with manufacturers to install its Internet Explorer browser on its operating system violated antitrust laws. Similarly, the Google complaint focuses on its exclusive deals to package its search engines into phones and browsers.“The DOJ case is literally a clone of U.S. vs Microsoft and should be somewhat of a slam - dunk,”says Sally Hubbard from the Open Markets Institute. The FTC's strategy may be more innovative, but that very feature could handicap it in court. The agency will need to convince a judge that structural relief against Facebook is warranted. The chairman of the FTC, Joe Simons, said in an interview that prying apart consummated deals can get“very messy”. That could be especially true with Facebook, which has worked to integrate Instagram and WhatsApp, using the same servers, networks, and advertising for all three. Facebook, for its part, says it faces robust competition and competes fairly and has argued that revisiting acquisitions after so long could chill future deals. Together, the two cases could redraw the rules that Silicon Valley has been operating under since the Microsoft case, says Weinstein, the Cardozo professor.“Whatever comes out of these cases,”he says,“is going to set the course of antitrust law for the next 20 years.”","options":{"A":"disturbed","B":"cornered","C":"shocked","D":"captured"},"answer":"C","analysis":"根据前后文可以推断出，这个单词的意思是“震惊”。故选 C 项。"},{"id":112,"section":"eng","type":"single","stem":"According to Paragraphs 3 and 4, the U.S. government's case against Facebook is  .","passage":"The U.S. Federal Trade Commission (FTC) jolted the markets on Dec. 9th with filings that seek to force Facebook Inc. to sell Instag nwind Facebook's purchases of Instagram and WhatsApp—deals that the agency approved in 2012 and 2014. It's pursuing a unique line of attack. Rather than targeting the Instagram and WhatsApp deals individually as illegal under traditional merger law, the agency argues that they are part of a broader strategy by Facebook to monopolize social media. The DOJ's Google suit, by contrast, adheres to the legal framework of the U.S. monopoly case against Microsoft Corp. from 1998. The 1998 Microsoft lawsuit charged that the software giant's agreements with manufacturers to install its Internet Explorer browser on its operating system violated antitrust laws. Similarly, the Google complaint focuses on its exclusive deals to package its search engines into phones and browsers.“The DOJ case is literally a clone of U.S. vs Microsoft and should be somewhat of a slam - dunk,”says Sally Hubbard from the Open Markets Institute. The FTC's strategy may be more innovative, but that very feature could handicap it in court. The agency will need to convince a judge that structural relief against Facebook is warranted. The chairman of the FTC, Joe Simons, said in an interview that prying apart consummated deals can get“very messy”. That could be especially true with Facebook, which has worked to integrate Instagram and WhatsApp, using the same servers, networks, and advertising for all three. Facebook, for its part, says it faces robust competition and competes fairly and has argued that revisiting acquisitions after so long could chill future deals. Together, the two cases could redraw the rules that Silicon Valley has been operating under since the Microsoft case, says Weinstein, the Cardozo professor.“Whatever comes out of these cases,”he says,“is going to set the course of antitrust law for the next 20 years.”","options":{"A":"Microsoft a Lesson for All the High - tech Giants","B":"A Tale of Two Antitrust Battles","C":"Google and Facebook: Antitrust Concerns Reaching Beyond Privacy","D":"The Smoking Gun in the Facebook and Google Antitrust Cases"},"answer":"B","analysis":"本文主要讲述两场反垄断战的故事，无论结果如何都会为未来的二十年反垄断法奠定基础。故选 B 项。"},{"id":116,"section":"eng","type":"single","stem":"The author thinks that the ideas of free market and government are  .","passage":"Few ideas have more profoundly poisoned the minds of more people than the notion of a “free market”existing somewhere in the universe, into which government“intrudes”. According to this view, whatever we might do to reduce inequality or economic insecurity—to make the economy work for most of us—runs the risk of distorting the market and causing it to be less efficient, or of unintended consequences that may end up harming us. The“free market”is to be preferred over“government”. This prevailing view is utterly false. There can be no“free market”without government. A market—any market—requires government to make and enforce the rules of the game. In most modern democracies, such rules emanate from legislatures, administrative agencies and courts. Government doesn'“t intrude”on the“free market”. It creates and maintains the market. The interminable debate over whether the free market is better than“government”makes it impossible for us to examine who exercises power, how they benefit from doing so and whether such rules need to be altered so that more people benefit from them. The myth of market fundamentalism is therefore highly useful to those who do not wish such an examination to be undertaken. The debate over market vs government serves to distract the public from the underlying realities of how the rules are generated and changed, from the power of the moneyed interests over this process, and the extent to which they gain from the results. In other words, not only do these“free market”advocates want the public to agree with them about the superiority of the market, but also about the central importance of the interminable and distracting debate over whether the market or the government should prevail. This is why its so important to expose the underlying structure of the so - called free market and show how and where power is exercised over it. It's why I write a weekly column for The Guardian—one of the few publications in the world committed to revealing the truth about the economy and exposing the myths that distract the public's attention from what is really going on. The Guardian can do this because it's not financed by commercial sponsors or any party with a financial or other interest in what it reports but exists solely to serve the public. Inequalities of income, wealth, and political power continue to widen across all advanced economies. To reverse them we need an informed public capable of seeing the mythologies that protect and preserve today's super - rich no less than did the Divine, Right at Kings centuries ago.","options":{"A":"compatible","B":"illusory","C":"paradoxical","D":"perplexing"},"answer":"A","analysis":"从第二段第二句“There can be no‘free market’without government.”可以看出，作者认为没有政府就没有自由市场。A 项，“compatible”意为“兼容的，可共存的”，比较恰当。故选 A 项。"},{"id":117,"section":"eng","type":"single","stem":"A kind of market fundamentalism is promoted by those who  .","passage":"Few ideas have more profoundly poisoned the minds of more people than the notion of a “free market”existing somewhere in the universe, into which government“intrudes”. According to this view, whatever we might do to reduce inequality or economic insecurity—to make the economy work for most of us—runs the risk of distorting the market and causing it to be less efficient, or of unintended consequences that may end up harming us. The“free market”is to be preferred over“government”. This prevailing view is utterly false. There can be no“free market”without government. A market—any market—requires government to make and enforce the rules of the game. In most modern democracies, such rules emanate from legislatures, administrative agencies and courts. Government doesn'“t intrude”on the“free market”.  mythologies that protect and preserve today's super - rich no less than did the Divine, Right at Kings centuries ago.","options":{"A":"arguing for the superiority of the market","B":"exposing the power behind the market","C":"condemning the super - rich for their greed","D":"shunning the debate over the markets role"},"answer":"B","analysis":"从“It's why I write a weekly column for The Guardian — one of the few publications in the world committed to revealing the truth about the economy and exposing the myths that distract the public's attention from what is really going on.”可以看出，“The Guardian”是致力于揭示经济真相，并揭露分散公众注意力的神话的出版物之一。故选 B 项。"},{"id":120,"section":"eng","type":"single","stem":"To redress inequalities in advanced countries, we need to  .","passage":"Few ideas have more profoundly poisoned the minds of more people than the notion of a “free market”existing somewhere in the universe, into which government“intrudes”. According to this view, whatever we might do to reduce inequality or economic insecurity—to make the economy work for most of us—runs the risk of distorting the market and causing it to be less efficient, or of unintended consequences that may end up harming us. The“free market”is to be preferred over“government”. This prevailing view is utterly false. There can be no“free market”without government. A market—any market—requires government to make and enforce the rules of the game. In most modern democracies, such rules emanate from legislatures, administrative agencies and courts. Government doesn'“t intrude”on the“free market”. It creates and maintains the market. The interminable debate over whether the free market is better than“government”makes it impossible for us to examine who exercises power, how they benefit from doing so and whether such rules need to be altered so that more people benefit from them. The myth of market fundamentalism is therefore highly useful to those who do not wish such an examination to be undertaken. The debate over market vs government serves to distract the public from the underlying realities of how the rules are generated and changed, from the power of the moneyed interests over this process, and the extent to which they gain from the results. In other words, not only do these“free market”advocates want the public to agree with them about the superiority of the market, but also about the central importance of the interminable and distracting debate over whether the market or the government should prevail. This is why its so important to expose the underlying structure of the so - called free market and show how and where power is exercised over it. It's why I write a weekly column for The Guardian—one of the few publications in the world committed to revealing the truth about the economy and exposing the myths that distract the public's attention from what is really going on. The Guardian can do this because it's not financed by commercial sponsors or any party with a financial or other interest in what it reports but exists solely to serve the public. Inequalities of income, wealth, and political power continue to widen across all advanced economies. To reverse them we need an informed public capable of seeing the mythologies that protect and preserve today's super - rich no less than did the Divine, Right at Kings centuries ago.","options":{"A":"know where public interest lies and serve it","B":"protect the interests of the less powerful","C":"expose the myth of the“free market”","D":"curtail the greediness of the super - rich"},"answer":"C","analysis":"从最后一段第二句“To reverse them we need an informed public capable of seeing the mythologies that protect and preserve today's super - rich no less than did the Divine,Right at Kings centuries ago.”可以看出，为了扭转这些不公平，我们需要一个知情的公众能够看到保护和维持当今超级富豪的神话，就像几个世纪前的国王一样。故选 C 项。"}]},"2025":{"meta":{"total":120,"source":"2025 年银保监会/金监局计算机岗专业卷（PDF 原文重提取）"},"sections":[{"key":"econ","name":"经济金融基础知识 · 单选","range":[1,20],"per":0.5,"type":"single"},{"key":"cs","name":"计算机专业知识 · 单选","range":[21,80],"per":1,"type":"single"},{"key":"multi","name":"计算机专业知识 · 多选","range":[81,100],"per":1,"type":"multi"},{"key":"eng","name":"英语阅读理解 · 单选","range":[101,120],"per":0.5,"type":"single"}],"questions":[{"id":1,"section":"econ","type":"single","stem":"《中共中央关于进一步全面深化改革 推进中国式现代化的决定》提出制定（  ）。","passage":"","options":{"A":"科技创新促进法","B":"金融法","C":"金融稳定法","D":"民营企业促进法"},"answer":"B","analysis":"《中共中央关于进一步全面深化改革、推进中国式现代化的决定》（简称《决定》）全文近日公布，其中在深化金融体制改革部分明确提出“制定金融法”。故选 B 项。"},{"id":2,"section":"econ","type":"single","stem":"根据马克思主义政治经济学理论，（  ）成为商品是货币转化为资本的前提。","passage":"","options":{"A":"剩余价值","B":"一般等价物","C":"劳动力","D":"生产资料"},"answer":"C","analysis":"根据马克思主义政治经济学理论，劳动力成为商品是货币转化为资本的前提。这是因为劳动力成为商品需要满足两个基本条件：一是劳动者必须拥有人身自由，能够自由支配自己的劳动力并将其视为商品出售；二是劳动者没有生产资料和生活资料，只能通过出售劳动力来维持生计。故选 C 项。"},{"id":3,"section":"econ","type":"single","stem":"在核算国内生产总值（GDP）时，以下哪项计入投资 ?（  ）","passage":"","options":{"A":"购买股票、债券等金融资产","B":"购买二手房","C":"购买新设备","D":"购买培训服务"},"answer":"C","analysis":"计入 GDP 的是购买最终商品的市场价值，购买股票、债券等金融资产不属于经济学领域的投资，经济学领域的投资仅包括固定资产投资和存货投资（也可认为包括净投资和重置投资）；购买二手房不计入 GDP，否则容易造成重复计算；购买培训服务属于消费，不属于投资。故选 C 项。"},{"id":4,"section":"econ","type":"single","stem":"IS 曲线右上方、LM 曲线右下方的组合表示（  ）。","passage":"","options":{"A":"产品供大于求、货币供大于求","B":"产品供大于求、货币供小于求","C":"产品供小于求、货币供大于求","D":"产品供小于求、货币供小于求"},"answer":"B","analysis":"IS 右上方，i<s，产品供大于求；LM 右下，L>m，货币供小于求。故选 B 项。"},{"id":5,"section":"econ","type":"single","stem":"在总需求不变时，短期总供给的增加会引起以下哪项变化 ?（  ）","passage":"","options":{"A":"价格水平下降，国民收入增加","B":"价格水平下降，国民收入下降","C":"价格水平上升，国民收入增加","D":"价格水平上升，国民收入下降"},"answer":"A","analysis":"短期总供给增加，总供给曲线下移，会使得价格水平下降，国民收入增加。故选 A 项。"},{"id":6,"section":"econ","type":"single","stem":"一个经济体系中的自然失业率是指（  ）。","passage":"","options":{"A":"摩擦性失业人数、结构性失业人数和周期性失业人数相加后除以劳动力人数","B":"摩擦性失业人数和周期性失业人数相加后除以劳动力人数","C":"结构性失业人数和周期性失业人数相加后除以劳动力人数","D":"摩擦性失业人数和结构性失业人数相加后除以劳动力人数"},"answer":"D","analysis":"一个经济体系中的自然失业率是指摩擦性失业人数和结构性失业人数相加后除以劳动力人数，故选 D 项。"},{"id":7,"section":"econ","type":"singl
