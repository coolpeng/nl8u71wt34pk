<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>2025 金监局·计算机岗 真题在线刷题</title>
<style>

:root{
  --bg:#f4f6fb; --card:#ffffff; --line:#e5eaf3; --ink:#1b2434; --muted:#6c7890;
  --primary:#2f5fe0; --primary-soft:#eaf0ff; --ok:#0f9d58; --ok-soft:#e7f7ee;
  --bad:#e0453b; --bad-soft:#fdeceb; --warn:#d98a12; --warn-soft:#fff5e4;
  --radius:14px; --shadow:0 2px 14px rgba(30,48,90,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:11px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:9px;white-space:nowrap}
.brand b{font-size:16px;letter-spacing:.2px}
.brand span{font-size:12px;color:var(--muted)}
.yearselect{font-size:13.5px;font-weight:700;color:var(--primary);background:var(--primary-soft);border:1px solid #c7d8fc;padding:5px 12px;border-radius:8px;outline:none;cursor:pointer}
.modebar{display:flex;background:#eef2f8;padding:3px;border-radius:10px;gap:2px}
.modebar button{padding:6px 14px;border-radius:8px;font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap}
.modebar button.on{background:#fff;color:var(--primary);box-shadow:0 1px 5px rgba(30,48,90,.1)}
.topright{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{font-size:12px;color:var(--muted);background:#f2f5fa;border:1px solid var(--line);padding:5px 10px;border-radius:8px;white-space:nowrap}
.chip b{color:var(--ink);font-variant-numeric:tabular-nums}
.timer{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--primary);background:var(--primary-soft);padding:5px 12px;border-radius:8px;white-space:nowrap}
.timer.urgent{color:var(--bad);background:var(--bad-soft)}
.linkbtn{font-size:13px;color:var(--muted);padding:5px 8px;border-radius:7px;white-space:nowrap}
.linkbtn:hover{background:#f0f3f9;color:var(--primary)}
.progressbar{position:absolute;left:0;bottom:-1px;height:2px;background:var(--primary);transition:width .25s}

/* ---------- layout ---------- */
.wrap{max-width:1320px;margin:0 auto;padding:22px;display:grid;grid-template-columns:268px minmax(0,1fr);gap:20px;align-items:start}
.side{position:sticky;top:78px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.side h3{margin:0 0 12px;font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.5px;display:flex;justify-content:space-between;align-items:center}
.sheetgrid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.cell{position:relative;aspect-ratio:1;display:grid;place-items:center;padding:0;min-width:0;overflow:hidden;border-radius:7px;background:#eef2f8;color:#65718a;font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;transition:.12s}
.cell:hover{transform:translateY(-1px);background:#dfe7f5}
.cell.done{background:var(--primary-soft);color:var(--primary)}
.cell.right{background:var(--ok-soft);color:var(--ok)}
.cell.wrong{background:var(--bad-soft);color:var(--bad)}
.cell.cur{box-shadow:0 0 0 2px var(--primary) inset}
.cell.flag::after{content:"";position:absolute;top:2px;right:2px;width:5px;height:5px;border-radius:50%;background:var(--warn)}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.sidefoot{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.primarybtn{display:block;width:100%;background:var(--primary);color:#fff;font-weight:700;font-size:14px;padding:11px;border-radius:10px;text-align:center;box-shadow:0 3px 10px rgba(47,95,224,.2)}
.primarybtn:hover{background:#2450c8}
.ghostbtn{display:block;width:100%;margin-top:8px;border:1px solid var(--line);color:var(--muted);font-size:13px;padding:9px;border-radius:10px;text-align:center}
.ghostbtn:hover{border-color:var(--primary);color:var(--primary)}

/* ---------- question card ---------- */
.main{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px 26px}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);padding-bottom:16px;border-bottom:1px solid var(--line)}
.qnum{font-size:15px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.tag{font-size:11.5px;padding:3px 9px;border-radius:20px;background:#f0f3f9;color:var(--muted);font-weight:600}
.tag.type{background:var(--primary-soft);color:var(--primary)}
.tag.score{background:var(--warn-soft);color:var(--warn)}
.flagbtn{margin-left:auto;font-size:12.5px;color:var(--muted);padding:4px 9px;border:1px solid var(--line);border-radius:7px}
.flagbtn.on{color:var(--warn);border-color:#f0d9a8;background:var(--warn-soft)}
.passage{margin-top:18px;background:#f8fafd;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.passage summary{cursor:pointer;padding:10px 14px;font-size:13px;font-weight:700;color:var(--primary);list-style:none;display:flex;align-items:center;gap:7px}
.passage summary::-webkit-details-marker{display:none}
.passage summary::before{content:"▸";font-size:11px;transition:.2s}
.passage[open] summary::before{transform:rotate(90deg)}
.passage .ptext{padding:0 16px 16px;font-size:14px;line-height:1.85;color:#3c485c;white-space:pre-wrap}
.stem{font-size:17px;line-height:1.85;font-weight:600;margin:22px 0 18px;white-space:pre-wrap}
.options{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;border:1.5px solid var(--line);border-radius:11px;padding:13px 15px;font-size:15px;line-height:1.65;transition:.14s;text-align:left;width:100%;background:#fff}
.opt:hover{border-color:#b9caf0;background:#fafbff}
.opt .letter{flex:0 0 26px;height:26px;border-radius:50%;background:#f0f3f9;color:var(--muted);display:grid;place-items:center;font-size:13px;font-weight:800;margin-top:1px}
.opt .txt{flex:1;white-space:pre-wrap;overflow-wrap:anywhere}
.opt.sel{border-color:var(--primary);background:var(--primary-soft)}
.opt.sel .letter{background:var(--primary);color:#fff}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .letter{background:var(--ok);color:#fff}
.opt.incorrect{border-color:var(--bad);background:var(--bad-soft)}
.opt.incorrect .letter{background:var(--bad);color:#fff}
.opt.dim{opacity:.72}
.qactions{display:flex;align-items:center;gap:10px;margin-top:22px;flex-wrap:wrap}
.navbtn{border:1px solid var(--line);background:#fff;padding:9px 17px;border-radius:9px;font-size:13.5px;font-weight:600;color:#46536a}
.navbtn:hover{border-color:var(--primary);color:var(--primary)}
.navbtn:disabled{opacity:.4;cursor:not-allowed}
.navbtn.go{background:var(--primary);border-color:var(--primary);color:#fff}
.navbtn.go:hover{background:#2450c8;color:#fff}
.qhint{font-size:12px;color:var(--muted);margin-left:auto}

/* ---------- flashcard section ---------- */
.cardsection{display:none;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px 26px;margin-bottom:20px}
.cardsection.show{display:block}
.cardhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.cardtitle{font-size:16px;font-weight:800;color:var(--ink)}
.cardcatbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.cardcatbtn{font-size:12.5px;padding:5px 12px;border-radius:20px;background:#f0f3f9;color:var(--muted);font-weight:600}
.cardcatbtn.on{background:var(--primary);color:#fff}
.flashcardbox{border:1.5px solid var(--line);border-radius:12px;padding:20px;background:#fafbff;margin-bottom:16px}
.flashcardq{font-size:16px;font-weight:700;color:var(--ink);margin-bottom:12px}
.flashcarda{display:none;font-size:14.5px;line-height:1.8;color:#2c3a50;background:#fff;padding:14px;border-radius:9px;border:1px dashed #c0d1f7;white-space:pre-wrap}
.flashcarda.show{display:block}
.flashaction{display:flex;gap:10px;align-items:center}

/* ---------- feedback ---------- */
.feedback{margin-top:20px;border-radius:11px;padding:16px 18px;font-size:14.5px;line-height:1.85;display:none}
.feedback.show{display:block}
.feedback.ok{background:var(--ok-soft);border:1px solid #bfe8cf}
.feedback.no{background:var(--bad-soft);border:1px solid #f3c6c3}
.fbhead{font-weight:800;font-size:15px;margin-bottom:8px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.fbhead .badge{padding:2px 9px;border-radius:20px;font-size:12px;color:#fff}
.redobtn{margin-left:auto;font-size:12.5px;color:var(--primary);background:#fff;border:1px solid rgba(47,95,224,.3);padding:4px 11px;border-radius:7px;font-weight:600}
.redobtn:hover{background:var(--primary);color:#fff}
.feedback.ok .badge{background:var(--ok)}.feedback.no .badge{background:var(--bad)}
.fbans{font-size:13px;color:#4a566c;margin-bottom:8px}
.fbans b{font-size:15px;color:var(--ink);letter-spacing:1px}
.fbtext{white-space:pre-wrap;border-top:1px dashed rgba(0,0,0,.12);padding-top:10px;color:#37445a}
.fbmini{background:#f3f6fb;border:1px solid var(--line);border-radius:9px;padding:10px 14px;font-size:13px;color:var(--muted);margin-top:18px;display:none}
.fbmini.show{display:block}

/* ---------- report ---------- */
.report{display:none;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px;margin-bottom:20px}
.report.show{display:block}
.scorehero{display:flex;align-items:center;gap:26px;flex-wrap:wrap;padding-bottom:20px;border-bottom:1px solid var(--line)}
.bigscore{font-size:48px;font-weight:800;line-height:1;color:var(--primary);font-variant-numeric:tabular-nums}
.bigscore small{font-size:16px;color:var(--muted);font-weight:600;margin-left:4px}
.scoreinfo{font-size:14px;color:var(--muted);line-height:1.9}
.scoreinfo b{color:var(--ink)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:20px}
.ritem{border:1px solid var(--line);border-radius:10px;padding:13px 15px}
.ritem .n{font-size:12.5px;color:var(--muted)}
.ritem .v{font-size:20px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.ritem .v small{font-size:12px;color:var(--muted);font-weight:600}
.rh{font-size:14px;font-weight:800;margin:24px 0 10px}
.wronglist{display:flex;flex-wrap:wrap;gap:7px}
.wronglist button{width:38px;height:34px;border-radius:8px;background:var(--bad-soft);color:var(--bad);font-weight:700;font-size:13px}
.wronglist button:hover{background:var(--bad);color:#fff}
.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(20px);background:#1e293b;color:#fff;padding:10px 18px;border-radius:9px;font-size:13.5px;opacity:0;transition:.25s;pointer-events:none;z-index:99;box-shadow:0 8px 26px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.footnote{text-align:center;font-size:12px;color:#9aa5b7;padding:8px 0 26px}

@media(max-width:960px){
  .wrap{grid-template-columns:1fr;padding:14px;gap:14px}
  .side{position:static;padding:14px}
  .sheetgrid{grid-template-columns:repeat(10,minmax(0,1fr))}
  .side.collapsed .sheetgrid,.side.collapsed .legend,.side.collapsed .sidefoot{display:none}
  .side.collapsed h3{margin-bottom:0}
  .card{padding:18px 16px}
  .topbar{padding:10px 14px;gap:10px}
  .brand span{display:none}
  .topright{width:100%;margin-left:0}
  .stem{font-size:16px}
  .qhint{display:none}
}

</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><b>金监局 · 计算机岗</b><span>真题冲刺刷题宝典</span></div>
  <select id="examYearSelect" class="yearselect" onchange="switchExamYear(this.value)">
    <option value="2025" selected>2025年 金监局/银保监计算机岗真题卷 (120题)</option>
    <option value="2024" >2024年 金监局/银保监计算机岗真题卷 (120题)</option>
    <option value="2023" >2023年 金监局/银保监计算机岗真题卷 (120题)</option>
    <option value="2022" >2022年 金监局/银保监计算机岗真题卷 (120题)</option>
    <option value="2021" >2021年 金监局/银保监计算机岗真题卷 (120题)</option>
    <option value="2020" >2020年 金监局/银保监计算机岗真题卷 (120题)</option>
    <option value="2019" >2019年 金监局/银保监计算机岗真题卷 (100题)</option>
  </select>
  <div class="modebar">
    <button id="mPractice" class="on">练习模式</button>
    <button id="mExam">模拟考试</button>
    <button id="mWrong">错题重做</button>
  </div>
  <div class="topright">
    <span class="chip">已答 <b id="doneCount">0</b>/<b id="totalCount">120</b></span>
    <span class="chip">正确率 <b id="accRate">—</b></span>
    <span class="timer" id="timer" hidden>120:00</span>
    <button class="linkbtn" id="btnReset">清空记录</button>
  </div>
  <div class="progressbar" id="progressbar" style="width:0"></div>
</div>

<div class="wrap">
  <aside class="side" id="side">
    <h3><span>答题卡</span><button class="linkbtn" id="btnToggle" style="display:none">收起 / 展开</button></h3>
    <div class="sheetgrid" id="sheet"></div>
    <div class="legend">
      <span><i style="background:#eef2f8"></i>未答</span>
      <span><i style="background:#eaf0ff"></i>已答</span>
      <span><i style="background:#e7f7ee"></i>正确</span>
      <span><i style="background:#fdeceb"></i>错误</span>
    </div>
    <div class="sidefoot">
      <button class="primarybtn" id="btnSubmit">交卷并查看成绩</button>
      <button class="ghostbtn" id="btnReset2">重新开始本卷</button>
    </div>
  </aside>

  <main class="main">
    <section class="report" id="report">
      <div class="scorehero">
        <div class="bigscore" id="rScore">0<small> / 100 分</small></div>
        <div class="scoreinfo" id="rInfo"></div>
      </div>
      <div class="rgrid" id="rGrid"></div>
      <div class="rh">错题清单（点击题号回看解析）</div>
      <div class="wronglist" id="rWrong"></div>
      <div class="qactions">
        <button class="navbtn go" id="rBack">返回逐题查看</button>
        <button class="navbtn" id="rRestart">重新考一次</button>
      </div>
    </section>

    <section class="card" id="card">
      <div class="qhead">
        <span class="qnum" id="qNum">第 1 题</span>
        <span class="tag type" id="qType">单选题</span>
        <span class="tag" id="qSection">经济金融基础知识</span>
        <span class="tag score" id="qScore">0.5 分</span>
        <button class="flagbtn" id="btnFlag">☆ 标记</button>
      </div>
      <details class="passage" id="passageBox" open hidden>
        <summary>阅读原文（点击展开 / 收起）</summary>
        <div class="ptext" id="passageText"></div>
      </details>
      <div class="stem" id="qStem"></div>
      <div class="options" id="qOptions"></div>
      <div class="feedback" id="feedback"></div>
      <div class="fbmini" id="fbmini"></div>
      <div class="qactions">
        <button class="navbtn" id="btnPrev">← 上一题</button>
        <button class="navbtn go" id="btnConfirm">确认作答</button>
        <button class="navbtn" id="btnNext">下一题 →</button>
        <span class="qhint">快捷键：A/B/C/D 选项 · ← → 切题 · Enter 确认 / 下一题</span>
      </div>
    </section>
  </main>
</div>

<script id="allExamsData" type="application/json">{"2025": {"meta": {"title": "2025年 金监局·计算机岗 专业科目真题卷", "subtitle": "金融监督管理总局招录考试 · 专业知识真题卷（含解析）", "year": 2025, "total": 120, "minutes": 120, "score": 100, "source": "【考试喵】金监局2025年笔试真题及解析-计算机岗.txt"}, "sections": [{"key": "econ", "name": "经济金融基础知识 · 单选", "range": [1, 20], "per": 0.5, "type": "single"}, {"key": "cs", "name": "计算机专业知识 · 单选", "range": [21, 80], "per": 1, "type": "single"}, {"key": "multi", "name": "计算机专业知识 · 多选", "range": [81, 100], "per": 1, "type": "multi"}, {"key": "eng", "name": "英语阅读理解 · 单选", "range": [101, 120], "per": 0.5, "type": "single"}], "questions": [{"id": 1, "section": "econ", "type": "single", "stem": "为维护您的个人权益，确保公务员考试的公平公正，请您协助我\n们监督考试实施工作。\n本场考试规定：监考人员要向本考场全体考生展示题本密封情况，\n并邀请 2 名考生代表验封签字后，方能开启试卷袋。如果您发现本考场\n监考人员存在违规启用试卷袋的情况，请向人力资源和社会保障部人事\n考试中心举报。", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "B", "analysis": "《中共中央关于进一步全面深化改革、推进中国式现代化的决定》（简称《决\n定》）全文近日公布，其中在深化金融体制改革部分明确提出“制定金融法”。故选 B 项。", "passage": ""}, {"id": 2, "section": "econ", "type": "single", "stem": "根据《公务员考试录用违纪违规行为处理办法》，答卷雷同，将\n给予该科目（场次）考试成绩无效等处理。请您妥善看护好自己的考试\n试卷和答题信息，防止被他人抄袭。\n\n\n\n注意事项 :", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "C", "analysis": "‌ 根据马克思主义政治经济学理论，劳动力成为商品是货币转化为资本的前\n提‌ 。这是因为劳动力成为商品需要满足两个基本条件：一是劳动者必须拥有人身自由，能\n够自由支配自己的劳动力并将其视为商品出售；二是劳动者没有生产资料和生活资料，只\n能通过出售劳动力来维持生计。故选 C 项。…", "passage": ""}, {"id": 3, "section": "econ", "type": "single", "stem": "在核算国内生产总值（GDP）时，以下哪项计入投资 ?（… … ）", "options": {"A": "购买股票、债券等金融资产", "B": "购买二手房", "C": "购买新设备", "D": "购买培训服务"}, "answer": "C", "analysis": "计入 GDP 的是购买最终商品的市场价值，购买股票、债券等金融资产不属于\n经济学领域的投资，经济学领域的投资仅包括固定资产投资和存货投资（也可认为包括净\n投资和重置投资）；购买二手房不计入 GDP，否则容易造成重复计算；购买培训服务属于\n消费，不属于投资。故选 C 项。\n糖糖老师：14.【答案】B\n【解析】IS 右上方，i<s，产品供大于求；LM 右下，L>m，货币供小于求。故选 B 项。", "passage": ""}, {"id": 4, "section": "econ", "type": "single", "stem": "IS 曲线右上方、LM 曲线右下方的组合表示（… … ）。", "options": {"A": "产品供大于求、货币供大于求", "B": "产品供大于求、货币供小于求", "C": "产品供小于求、货币供大于求", "D": "产品供小于求、货币供小于求"}, "answer": "", "analysis": "参考原卷解析", "passage": ""}, {"id": 5, "section": "econ", "type": "single", "stem": "在总需求不变时，短期总供给的增加会引起以下哪项变化 ?（… … ）", "options": {"A": "价格水平下降，国民收入增加", "B": "价格水平下降，国民收入下降", "C": "价格水平上升，国民收入增加", "D": "价格水平上升，国民收入下降"}, "answer": "A", "analysis": "短期总供给增加，总供给曲线下移，会使得价格水平下降，国民收入增加。\n故选 A 项。", "passage": ""}, {"id": 6, "section": "econ", "type": "single", "stem": "一个经济体系中的自然失业率是指（… … ）。", "options": {"A": "摩擦性失业人数、结构性失业人数和周期性失业人数相加后除以劳动力人数", "B": "摩擦性失业人数和周期性失业人数相加后除以劳动力人数", "C": "结构性失业人数和周期性失业人数相加后除以劳动力人数", "D": "摩擦性失业人数和结构性失业人数相加后除以劳动力人数"}, "answer": "D", "analysis": "2025 年金融监督管理局招录考试计算机岗·专业知识真题卷答案解析\n【解析】一个经济体系中的自然失业率是指摩擦性失业人数和结构性失业人数相加后\n除以劳动力人数，故选 D 项。", "passage": ""}, {"id": 7, "section": "econ", "type": "single", "stem": "如果名义 GDP 为 400 亿美元，真实 GDP 为 200 亿美元，而货币供给为 100 亿美元，\n以下说法正确的是（… … ）。", "options": {"A": "物价水平是 1/2，货币流通速度是 2", "B": "物价水平是 1/2，货币流通速度是 4", "C": "物价水平是 2，货币流通速度是 2", "D": "物价水平是 2，货币流通速度是 4"}, "answer": "D", "analysis": "物价水平（GDP 平减指数）= 名义 GDP/ 实际 GDP=400/200=2，由 MV=PT 得，\n100V=400，V=4。故选 D 项。", "passage": ""}, {"id": 8, "section": "econ", "type": "single", "stem": "假设经济的总供给函数为 Y=2000+400P，总需求函数为 Y=1600+800/P，总供给和总\n需求均衡时的收入和价格水平为（… … ）。", "options": {"A": "价格水平 P=2，收入 Y=2800", "B": "价格水平 P=2，收入 Y=2000", "C": "价格水平 P=1，收入 Y=2600", "D": "价格水平 P=1，收入 Y=2400"}, "answer": "D", "analysis": "", "passage": ""}, {"id": 9, "section": "econ", "type": "single", "stem": "假定 IS 曲线和 LM 曲线的交点所表示的均衡国民收入低于充分就业的国民收入，根\n据 IS-LM 模型，为了不让利率上升，政府应该采取以下哪些措施 ?（… … ）", "options": {"A": "在增加投资的同时减少货币供给", "B": "在增加投资的同时增加货币供给", "C": "在减少投资的同时减少货币供给", "D": "在减少投资的同时增加货币供给\n8984351279"}, "answer": "B", "analysis": "", "passage": ""}, {"id": 10, "section": "econ", "type": "single", "stem": "若商品", "options": {"A": "向左上方平行移动", "B": "向左下方平行移动", "C": "向右上方平行移动", "D": "向右下方平行移动"}, "answer": "B", "analysis": "8984351279\n【解析】连立 Y=2000+400P 和 Y=1600+800/P 得 P=1，Y=2400，故选 D 项。\n【解析】增加投资会使得 IS 右移，进而利率上升，增加货币供给会使得 LM 右移而利\n率下降，同时增加会增加总需求，而利率的变动相互抵消。故选 B 项。\n【解析】商品 A 和 B 的价格按相同比率上升，收入不变，相当于实际收入下降，预算\n线向左下方平移。故选 B 项。", "passage": ""}, {"id": 11, "section": "econ", "type": "single", "stem": "关于替代效应，以下说法正确的是（… … ）。", "options": {"A": "替代效应一定与价格反向变化", "B": "收入效应一定与价格正向变化", "C": "劣等品的收入效应与价格反向变化", "D": "吉芬品的总效应与价格反向变化"}, "answer": "A", "analysis": "正常品的收入效应与价格反方向变动，B 错；劣等品（含吉芬商品）收入效\n应与价格同方向变化，C、D 错。故选 A 项。", "passage": ""}, {"id": 12, "section": "econ", "type": "single", "stem": "如果厂商成本的产出弹性大于 1，那么存在着（… … ）。", "options": {"A": "范围经济", "B": "范围不经济", "C": "规模经济", "D": "规模不经济"}, "answer": "D", "analysis": "厂商成本的产出弹性 =（∆C/∆Q）（Q/C）=LMC/LAC 大于 1，因此 LMC 大\n于 LAC，LAC 处在上升阶段，规模不经济。故选 D 项。", "passage": ""}, {"id": 13, "section": "econ", "type": "single", "stem": "金融资产票面收益与票面额的比率称为（… … ）。", "options": {"A": "名义收益率", "B": "实际收益率", "C": "现时收益率", "D": "平均收益率"}, "answer": "A", "analysis": "‌ 金融资产票面收益与票面额的比率称为名义收益率。故选 A 项。…", "passage": ""}, {"id": 14, "section": "econ", "type": "single", "stem": "按照金融交易的交割期限，可以把金融市场划分为（… … ）。", "options": {"A": "货币市场和资本市场", "B": "现货市场和期货市场", "C": "一级市场和二级市场", "D": "同业拆借市场和回购市场"}, "answer": "B", "analysis": "‌ 金融市场可以根据金融交易的交割期限划分为现货市场和期货市场‌ 。现货市\n场是指交易双方在成交后即时进行清算交割的市场，而期货市场则是交易双方达成成交协\n议后，不立即交割，而是约定在一定时期后，按照合同规定的数量和价格进行清算和交割\n的市场。故选 B 项。‌", "passage": ""}, {"id": 15, "section": "econ", "type": "single", "stem": "如果某银行投资国债的票面利率为 3%，预期名义收益率为 8%，预期通货膨胀率\n为 2%，则该银行所投资国债的预期实际收益率为（… … ）。", "options": {"A": "1%", "B": "5%", "C": "6%", "D": "10%"}, "answer": "C", "analysis": "预期实际收益率 = 预期名义收益率 - 预期通货膨胀率，而与债券票面利率无…\n关。故此预期实际收益率为 8%-2%=6%。故选 C 项。", "passage": ""}, {"id": 16, "section": "econ", "type": "single", "stem": "根据监管规定，保险公司应该具备与风险及业务规模相匹配的资本要求，对于保\n险公司核心偿付能力充足率和综合偿付能力充足率的要求分别是不应低于（… … ）。", "options": {"A": "50%，80%", "B": "50%，100%", "C": "100%，100%", "D": "100%，150%"}, "answer": "B", "analysis": "根据监管规定，保险公司应该具备与风险及业务规模相匹配的资本要求，\n157\n\n2025 年金融监督管理局招录考试计算机岗·专业知识真题卷答案解析\n对于保险公司核心偿付能力充足率和综合偿付能力充足率的要求分别是不应低于 50% 和\n100%。故选 B 项。", "passage": ""}, {"id": 17, "section": "econ", "type": "single", "stem": "商业银行贷款按照担保形式可以分为保证贷款、抵押贷款、质押贷款和（… … ）。", "options": {"A": "普通贷款", "B": "信用贷款", "C": "联合贷款", "D": "分期贷款"}, "answer": "B", "analysis": "商业银行贷款按照担保形式可以分为信用贷款和担保贷款，其中担保贷款又\n分为保证贷款、抵押贷款、质押贷款。故选 B 项。", "passage": ""}, {"id": 18, "section": "econ", "type": "single", "stem": "在我国，委托贷款属于商业银行的（… … ）。", "options": {"A": "资产业务", "B": "负债业务", "C": "中间业务", "D": "托管业务"}, "answer": "C", "analysis": "在我国，委托贷款属于商业银行的中间业务‌ 。委托贷款是指委托人提供资金，\n由商业银行（受托人）根据委托人确定的借款人、用途、金额、币种、期限、利率等代为发放、\n协助监督使用、协助收回的贷款‌ 。故选 C 项。", "passage": ""}, {"id": 19, "section": "econ", "type": "single", "stem": "货币政策对（… … ）等指标进行管理。", "options": {"A": "预算赤字和预算盈余", "B": "政府支出和税收收入", "C": "货币供应量和利率", "D": "失业率和总产出"}, "answer": "C", "analysis": "货币政策是中央银行为实现特定的经济目标而采取的各种控制、调节货币供\n应量或信用量的方针、政策、措施的总称。货币政策对货币供应量和利率等指标进行管理。\n故选 C 项。", "passage": ""}, {"id": 20, "section": "econ", "type": "single", "stem": "国际收支平衡表中将投资收益计入（… … ）。", "options": {"A": "资本账户", "B": "金融账户", "C": "经常账户", "D": "转移账户\n\n题给出的四个选项中。只有一项是符合题目要求的。"}, "answer": "C", "analysis": "‌ 在国际收支平衡表中，投资收益被计入经常账户‌ 。经常账户包括贸易、服务、\n收入和经常转移四个子账户，其中收入账户用于记录投资收益‌ 。故选 C 项。\n二、金融监管计算机类专业单项选择题：每题 1 分，共 60 题，计 60 分。在每\n题给出的四个选项中，只有一项是符合题目要求的。", "passage": ""}, {"id": 21, "section": "cs", "type": "single", "stem": "为了解决银行柜面终端与票据打印机之间速度不匹配的问题，需要设置一个打印\n缓冲区。逐条、依次将柜面终端的打印需求传递至打印机。该缓冲区的结构应该选择（… … ）。", "options": {"A": "栈", "B": "队列", "C": "二叉树", "D": "图"}, "answer": "B", "analysis": "本题主要考查队列的应用。B 项正确，队列的特性是先进先出，缓冲区通常\n用队列机制实现。A 项错误，栈通常用作括号匹配、函数递归调用、表达式求值。C 项错误，\n二叉树通常用于通信编码。D 项错误，图通常应用于求最短路径等方面。故选 B 项。", "passage": ""}, {"id": 22, "section": "cs", "type": "single", "stem": "中间件有多种类型，windows 平台的 ODBC 和 JAVA 平台的 JDBC 属于（…", "options": {"A": "数据库访问中间件", "B": "远程过程调用中间件", "C": "面向消息中间件", "D": "实务中间件\n。\n… ）。"}, "answer": "A", "analysis": "糖糖老师：1【解析】本题主要考查中间件的类型及定义。\nA 项正确，数据库访问中间件是一种软件组件，它位于应用程序和数据库管理系统之间，\n用于管理和优化对数据库的访问。JDBC 称为 Java 数据库连接，它是一种用于数据库访问\n的应用程序 API，由一组用 Java 语言编写的类和接口组成，有了 JDBC 就可以用统一的语\n法对多种关系数据库进行访问，而不用担心其数据库操作语言的差异。\nB 项错误，远程过程调用中间件（RPC）是一种进程间通信技术，允许 A 进程在不知\n道 B 进程细节的情况下调用其功能。调用者通过参数传递信息，等待结果返回。\n158\n\nC 项错误，面向消息中间件，可以使分布式应用程序可以通过发送和接收消息来进行\n通信和交换数据。\nD 项错误，在分布式系统中，事务中间件可以确保多个应用程序之间的数据一致性，\n协调和管理交易过程，使其能够在不同的系统和应用程序之间进行数据交换\n故选 A 项。", "passage": ""}, {"id": 23, "section": "cs", "type": "single", "stem": "通常在信息系统配置中采用容错技术，提供相应的可靠性，（… … ）是集群的一\n种形式，两台服务器均处于活动状态，共同运行相同的应用，以保证整体系统的性能，也\n实现了负载均衡和互为备份。", "options": {"A": "双机双工模式", "B": "双机热备模式", "C": "双机集群模式", "D": "双机互备模式"}, "answer": "A", "analysis": "8984351279\n【解析】本题主要考查集群模式。A 项正确，双机双工备份指两台或多台服务器均为\n活动，同时运行相同的应用，保证整体的性能，也实现了负载均衡和互为备份。B 项错误，\n双机热备模式主要应用运行于主机，备机即备用机器，备机不工作，主机出现故障时备机\n接管主机的所有工作。C 项错误，双机集群模式是指将两台或多台计算机组合在一起，共\n同完成某项任务的解决方案，指的是一种集群策略，不是具体某个集群方式。D 项错误，\n双机互备模式指在双机热备的基础上，两个相对独立的应用在两台机器同时运行，但彼此\n均设为备机，当某一台服务器出现故障时，另一台服务器可以在短时间内将故障服务器的\n应用接管过来，从而保证了应用的持续性。故选 A 项。", "passage": ""}, {"id": 24, "section": "cs", "type": "single", "stem": "（… … ）是一种基于多层神经网络并以海量数据作为输入规则的自学习方法，依靠\n提供给它的大量实际行为数据，进行参数和规则调整。", "options": {"A": "监督学习", "B": "半监督学习", "C": "强化学习", "D": "深度学习"}, "answer": "D", "analysis": "本题主要考查深度学习的定义。D 项正确，深度学习是机器学习的一个分支，\n它模仿人脑神经网络的结构和功能，通过多层次的神经网络模型来学习和理解数据。深度\n学习的核心思想是通过多层次的非线性变换，将输入数据映射到输出结果，从而实现对复\n杂模式和特征的学习和提取。A 项错误，监督学习是一种机器学习任务，其中算法通过从\n标记的训练数据中学习模式和关系，以进行预测或分类。B 项错误，半监督学习是机器学\n习的一个分支，结合了监督学习和无监督学习，使用标记和未标记数据来训练用于分类和\n回归任务的人工智能（AI）模型。C 项错误，强化学习是一种试错方法，其目标是让软件\n智能体在特定环境中能够采取回报最大化的行为。故选 D 项。", "passage": ""}, {"id": 25, "section": "cs", "type": "single", "stem": "在软件开发和维护过程中，一个软件会有多个版本，（… … ）工具用来存储、更新、\n恢复和管理一个软件的多个版本。", "options": {"A": "数据流", "B": "物流", "C": "资金流", "D": "信息流\n的界面中显示文字、图形和其它界面元素。\n8984351279"}, "answer": "D", "analysis": "本题主要考查软件工程管理。D 项正确，版本控制工具是一种用于管理软件\n开发过程中产生的多个版本的工具。版本控制工具能够详细记录项目在不同时间点的状态，\n每一次的代码修改、文档更新都会被工具记录下来，包括谁进行了修改、何时进行的修改\n以及修改的具体内容。A 项错误，软件测试是测试软件正确性的手段和方法。B 项错误，\n逆向工程是指从已有的产品或技术中，通过分析和研究来了解其工作原理或者设计思路的\n过程。逆向工程（Reverse Engineering）是指从已有的产品或技术中，通过分析和研究来了\n解其工作原理或者设计思路的过程。C 项错误，UML 建模是面向对象开发中一种通用的图\n\n形化建模语言，它定义良好、易于表达、功能强大且普遍适用。故选 D 项。", "passage": ""}, {"id": 26, "section": "cs", "type": "single", "stem": "企业资源规划（ERP）中的企业资源包括企业的“三流”资源，不包含以下（… … ）。", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "A", "analysis": "本题主要考查企业“三流资源”。企业的三流资源是指物流、资金流和信息流。\n故选 A 项。", "passage": ""}, {"id": 27, "section": "cs", "type": "single", "stem": "在 Java Applet 程序用户自定义的 Applet 子类中，常常重载（… … ）方法在 Applet", "options": {"A": "start ()", "B": "stop ()", "C": "init ()", "D": "paint ()"}, "answer": "D", "analysis": "本题主要考查 Applet 子类的方法。D 项正确，paint 方法在 star() 方法之后立\n即被调用，或者在 Applet 需要重绘在浏览器的时候调用。paint() 方法是 Java 中用于实现绘\n图目的的一个方法。A 项错误，start() 方法，浏览器调用 init 方法后，该方法被自动调用。\n每当用户从其他页面返回到包含 Applet 的页面时，则调用该方法。B 项错误，stop() 方法，\n用户从包含 Applet 的页面移除的时候，该方法自动被调用。C 项错误，init() 方法的目的是\n为你的 Applet 提供所需的任何初始化。故选 D 项。", "passage": ""}, {"id": 28, "section": "cs", "type": "single", "stem": "根据软件过程活动对软件工具进行分类，则逆向工程工具属于（… … ）工具。", "options": {"A": "软件开发", "B": "软件维护", "C": "软件管理", "D": "软件支持"}, "answer": "B", "analysis": "B 项正确，软件维护工具主要包括版本控制工具、文档分析工具、开发信息\n库工具、逆向工程工具等。A 项错误，软件开发工具是指用于辅助软件生命周期过程的基\n于计算机的工具。比如：集成开发环境（IDE）、版本控制系统等。C 项错误，软件管理\n工具主要指对软件的下载安装等进行管理的工具，如 360 软件管家等。D 项错误，软件支\n持工具指对学习和电脑使用有快捷帮助的软件，比如小智桌面、快速截屏软件等。故选 B 项。", "passage": ""}, {"id": 29, "section": "cs", "type": "single", "stem": "模块", "options": {"A": "传入", "B": "传出", "C": "变换", "D": "协调"}, "answer": "C", "analysis": "C 项正确，变换模块主要用于处理数据变换，即从输入数据转换为输出数据。\n变换型模块通常位于软件结构图的中心，与其他模块有明显的输入和输出关系。A 项错误，\n传入模块是从下属模块取得数据，经过某些处理，再将其传送给上级模块。它传送的数据\n流叫作逻辑输入数据流。B 项错误，传出模块是从上级模块获得数据，进行某些处理，再\n将其传送给下属模块。它传送的数据流叫作逻辑输出数据流。D 项错误，协调模块是指那\n些负责协调和管理其他模块之间交互和依赖关系的组件。这些模块旨在确保各个功能单元\n糖糖老师：1能够有效地协同工作，从而实现软件系统的整体目标。故选 C 项。", "passage": ""}, {"id": 30, "section": "cs", "type": "single", "stem": "程序的环形复杂度等于（… … ）是模块规模的一个更科学更精确的上限。\n…A.3", "options": {"A": "", "B": "5", "C": "10", "D": "12"}, "answer": "C", "analysis": "本题主要考查环形复杂度。环形复杂度小于等于 10 是模块规模的一个更科\n学更精确的上限。环形复杂度是一种量化软件程序复杂度的度量方法。它基于控制流图，\n通过计算图中的环路或独立路径的数量来表示程序的复杂度。环形复杂度的计算公式为\nV(G)=E-N+2，其中 E 是图中边的数量，N 是节点的数量。故选 C 项。", "passage": ""}, {"id": 31, "section": "cs", "type": "single", "stem": "用 C/C++ 语言编写的程序代码，经过（… … ）后形成可执行程序。", "options": {"A": "汇编、预处理、链接、编译", "B": "预处理、编译、汇编、链接", "C": "编译、预处理、汇编、链接", "D": "链接、预处理、编译、汇编"}, "answer": "B", "analysis": "本题主要考查模块内聚类型。\n同实现了某个功能或者完成了某个任务。\n同完成某个过程或者任务。\n8984351279\nB 项正确，通信内聚指模块内部各个元素之间通过某种通信机制进行交互和通信，共\nA 项错误，过程内聚指模块内部各个元素之间按照某个特定的过程组织起来，它们共\nC 项错误，逻辑内聚指模块内执行几个逻辑上相似的功能，通过参数确定该模块完成\n哪一个功能。\nD 项错误，时间内聚指模块内部各个元素之间被按照时间顺序组织起来，它们按照一\n定的时间顺序依次执行，完成某个任务。\n故选 B 项。", "passage": ""}, {"id": 32, "section": "cs", "type": "single", "stem": "某模块实现两个功能：向某个数据结构区域写数据和从该区域读数据。该模块的\n内聚类型为（… … ）内聚。", "options": {"A": "过程", "B": "通信", "C": "逻辑", "D": "时间"}, "answer": "", "analysis": "参考原卷解析", "passage": ""}, {"id": 33, "section": "cs", "type": "single", "stem": "在某销售系统中，客户采用扫描二维码进行支付。若采用面向对象方法开发该销\n售系统，则二维码类属于（… … ）类。", "options": {"A": "接口", "B": "实体", "C": "控制", "D": "状态"}, "answer": "A", "analysis": "A 项正确，接口类的对象为用户提供一种与系统合作交互的方式，分为人和\n系统两大类，其中人的接口可以是显示屏、窗口、Web 窗体、对话框、菜单、列表框、其\n他显示控制、条形码、二维码或者用户与系统交互的其他方法。系统接口涉及把数据发送\n到其他系统，或者从其他系统接收数据。B 项错误，实体类用于映射需求中的每个实体，\n保存需要存储在永久存储体中的信息。例如，学校教学系统中就有学生类、教师类和课程类。\nC 项错误，控制类的对象用来控制活动流，充当协调者。控制类有效将业务逻辑独立于实\n体数据和边界控制，专注于处理业务逻辑。D 项错误，状态类通常用于表示对象在其生命\n周期中的不同状态。虽然状态类不是面向对象设计中的标准术语。故选 A 项。", "passage": ""}, {"id": 34, "section": "cs", "type": "single", "stem": "行业协会计划开发一个信息系统，现阶段用户无法明确该系统的全部准确要求，\n希望在试用后再逐步完善并最终实现用户需求，则该信息系统应采用的开发方法是（… … ）。", "options": {"A": "结构化方法", "B": "面向对象方法", "C": "原型化方法", "D": "面向服务方法"}, "answer": "C", "analysis": "本题主要考查程序的开发方法。\nC 项正确，原型法根据用户初步需求 ( 或需求不明确 )，利用系统开发工具，快速地建\n立一个系统模型展示给用户，在此基础上与用户交流，最终实现用户需求的信息系统快速\n开发的方法。\n159\n\n2025 年金融监督管理局招录考试计算机岗·专业知识真题卷答案解析\nA 项错误，结构化方法基本思想是“自顶向下，逐步求精”，适合需求明确的开发。\nB 项错误，面向对象的开发方法是将每个实体都抽象为对象，更加符合人类的思维编\n程的一种设计方法。\nD 项错误，面向服务的方法强调将应用程序分解为一组独立的服务，这些服务通过标\n准化的接口进行通信。\n故选 C 项。", "passage": ""}, {"id": 35, "section": "cs", "type": "single", "stem": "在信息系统开发过程中，（… … ）阶段的任务是回答信息系统“做什么”的问题，\n（… … ）阶段的任务是回答系统“怎么做”的问题。", "options": {"A": "规划 实施", "B": "分析 设计", "C": "设计 运行", "D": "实施 运行"}, "answer": "B", "analysis": "本题主要考查信息开发的过程。\n信息系统开发过程通常包括以下几个主要阶段：系统规划、系统分析、系统设计、系\n统实施、系统运行和维护。系统分析阶段的任务是回答系统“做什么”的问题，而系统设\n计阶段要回答的问题是“怎么做”。故选 B 项。", "passage": ""}, {"id": 36, "section": "cs", "type": "single", "stem": "配置管理属于信息系统软件运维体系中的（… … ）。", "options": {"A": "运维支持要素", "B": "运维管理过程", "C": "运维需求", "D": "运维管理原则"}, "answer": "B", "analysis": "本题主要考查信息系统软件运维。\nB 项正确，运维管理过程主要包括问题管理、变更管理和配置管理等内容。\nA 项错误，运维支持要素主要包括运维团队、容灾计划、监控等内容。\nC 项错误，运维需求是指对业务系统运行和维护过程中的需求进行识别、分析和整理，\n以便更好地指导运维团队的工作。\nD 项错误，运维管理原则一般包括自动化管理、安全性、最小权限分配、职责分离。\n故选 B 项。", "passage": ""}, {"id": 37, "section": "cs", "type": "single", "stem": "开发的产品不再符合市场需求，这种状况属于项目的（… … ）。", "options": {"A": "技术风险", "B": "社会风险", "C": "商业风险", "D": "组织风险"}, "answer": "C", "analysis": "本题主要考查风险的分类。\nC 项正确，商业风险通常指的是企业在经营过程中由于市场需求变化、竞争加剧、供\n应链中断等因素导致的财务损失或其他不利影响。\nA 项错误，技术风险是指在技术开发、技术应用、技术改造等过程中可能出现的各种\n糖糖老师：1不确定性和隐患。这包括技术开发过程中的难题、研发周期和成本问题，技术应用过程中\n的实施困难、操作失误和适应性问题，以及技术改造过程中的转型困难、集成问题和效果\n不明显等问题。\nB 项错误，社会风险是指由于社会结构、文化变迁、政策变动等因素引起的不确定性。\nD 项，组织风险主要指在组织内部管理过程中可能出现的风险。这包括决策失误、内\n部腐败、员工流失、沟通不畅等问题。\n故选 C 项。\n160", "passage": ""}, {"id": 38, "section": "cs", "type": "single", "stem": "企业应用集成技术（EAI）可以消除信息孤岛，将多个企业信息系统连接起来，实\n现无缝集成。EAI 包括多个层次和方面。其中在业务逻辑层上对应用系统进行黑盒集成的\n属于（… … ）。", "options": {"A": "组织横向之间的联系薄弱，部门间协调难度大", "B": "管理成本高，多头领导，难以监控", "C": "项目环境比较封闭，不利于沟通和知识共享", "D": "员工缺乏稳定性"}, "answer": "B", "analysis": "本题主要考查 EAI 的分类。\nB 项正确，控制集成也称为功能集成或应用集成，在业务逻辑上对应用系统进行集成，\n控制集成的集成点存于程序代码中，集成处可能只需要简单使用公开的 api 就可以访问。\n控制集成属于黑盒集成。\nC 项错误，表示集成也称为页面集成，是比较原始，层次最浅但又最常用的一种集成，\n数据集成是白盒集成。\n组成。\n故选 B 项。\n8984351279\n因其无需了解程序与数据库的内部构造，所以其属于黑盒集成。\nA 项错误，数据集成是为了完成控制集成和业务流程集成，必须首先要解决数据和数\n据库的集成问题。在集成之前首先对数据进行标识编成目录，另外还要确定元数据模型，\nD 项错误，业务流程集成也称为过程集成，它由一系列基于标准的统一的数据格式的", "passage": ""}, {"id": 39, "section": "cs", "type": "single", "stem": "", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "A", "analysis": "本题主要考查组织结构的类型。\nA 项正确，直线职能型的特点是各职能单位自成体系，不重视信息的横向沟通，工作\n易重复，造成效率不高；职能部门缺乏弹性，对环境变化的反应迟钝；可能增加管理费用。\nB 项错误，描述的是职能型组织架构的特点。\nC 项错误，描述直线型特点。\nD 项错误，与题干无关，干扰项。\n故选 A 项。", "passage": ""}, {"id": 40, "section": "cs", "type": "single", "stem": "有关项目团队建设的描述，不正确的是（… … ）。", "options": {"A": "通过各种活动提高团队成员之间的信任和认同感，增进协作", "B": "借助管理层和相关干系人的帮助，使项目组获得有效资源支持", "C": "通过有效手段提高团队成员的知识和技能，实现有效交付", "D": "通过塑造良好的团队文化，提高个人和团队的生产率"}, "answer": "B", "analysis": "本题主要考查项目团队建设。项目组所需要的资源应该在立项初期就确定下…\n来 , 如果只靠管理层和相关干系人的帮助获得有效资源 , 那么项目的整个过程的风险性将\n加大。故选 B 项。", "passage": ""}, {"id": 41, "section": "cs", "type": "single", "stem": "某公司承接了某海外信息系统集成项目，项目进行中，项目经理获悉因天气和汇", "options": {"A": "项目还没有结束，暂时不做处理", "B": "给主管领导打电话，寻求解决方案", "C": "填写变更申请，启动变更流程", "D": ""}, "answer": "C", "analysis": "本题主要考查项目管理的流程。作为项目经理 , 当项目进行中与预计不一致…\n时 , 应首先提交变更申请 , 启动变更流程 , 而不是给主管领导打电话。故选 C 项。", "passage": ""}, {"id": 42, "section": "cs", "type": "single", "stem": "在关键路径上增加资源不一定会缩短项目的工期，这是因为（… … ）。", "options": {"A": "关键路径上的活动是不依赖于时间和资源的", "B": "增加资源有可能导致产生额外的问题并且降低效率", "C": "关键活动的历时是固定不变的", "D": "关键活动所配置的资源数量总是充足的"}, "answer": "B", "analysis": "本题主要考查关键路径。\nB 项正确，如果考虑到对投入的人力资源的额外管理，那么增加资源有可能导致产生\n\n额外的问题并且会降低效率。活动的历时有时受具体项目的约束，即使增加资源也不能缩\n短工期。\nA 项错误，除虚活动外，所有的活动都是依赖于时间或资源的。\nC 选错误，一般而言，如不考虑投入的人力资源的额外管理，当活动的工作量不变时，\n活动的历时随投入的人力资源的多少而变化。\nD 项错误，项目是为创建某一独特产品、服务或成果而临时进行的一次性努力。对项\n目更具体的解释是用有限的资源、有限的时间为特定客户完成特定目标的一次性工作。\n故选 B 项。", "passage": ""}, {"id": 43, "section": "cs", "type": "single", "stem": "Hadoop 进行数据存储管理所采用的系统是（… … ）。", "options": {"A": "NTFS", "B": "HDFS", "C": "REDIS", "D": "CDFS"}, "answer": "B", "analysis": "【 解 析】B 项 正 确，HDFS 是 Hadoop 进 行 数 据 存 储 管 理 所 采 用 的 系 统。HDFS 是\nHadoop 项目的核心子项目，是分布式计算中数据存储管理的基础，是基于流数据模式访问\n和处理超大文件的需求而开发的，可以运行于廉价的商用服务器上。它所具有的高容错、\n高可靠性、高可扩展性、高获得性、高吞吐率等特征。A 项错误，NTFS 是一个分区格式。\nC 项错误，REDIS 是一个开源的内存数据结构存储系统，它也可以用作数据库、缓存和消\n息代理。D 项错误，CDFS 是指专门的 CD 格式的文件系统。故选 B 项。", "passage": ""}, {"id": 44, "section": "cs", "type": "single", "stem": "一个新的数据库管理系统安装完成后，以下（… … ）工作优先级最高。", "options": {"A": "创建用户，赋予角色权限", "B": "重新启动服务器", "C": "修改默认配置", "D": "优化数据库性能"}, "answer": "A", "analysis": "本题主要考查数据管理的优先级。数据库创建完成后，首先要做的就是创建\n用户，授予不同的权限。故选 A 项。", "passage": ""}, {"id": 45, "section": "cs", "type": "single", "stem": "若要“查询客户名下存在 3 张卡以上的客户号”，则正确的 SQL 语句是（… … ）。", "options": {"A": "SELECT client_no FROM rb_acct GROUP BY client_no WHERE COUNT(*)>3", "B": "SELECT client_no FROM rb_acct GROUP BY client_no HAVING COUNT (*)> 3", "C": "SELECT client_no FROM rb_acct ORDER BY client_no WHERE COLNT (*)> 3", "D": "SELECT client_no FROM rb_acct ORDER BY client_no HAVING COUNT (*)> 3"}, "answer": "B", "analysis": "本题主要考查 SQL 语句。如果要查询客户名下有 3 张银行卡，需要对客户号\n进行分组，排除 C、D 项；其次，group by 之后不能跟 where 子句，排除 A 项。故选 B 项。", "passage": ""}, {"id": 46, "section": "cs", "type": "single", "stem": "以下（… … ）属于数据挖掘中关联分析算法。", "options": {"A": "K-means", "B": "EM", "C": "Apriori", "D": "SVM"}, "answer": "C", "analysis": "C 项正确，Apriori 算法是一种挖掘关联规则的频繁项集算法。A 项错误，…\nK-means 算法是一种迭代求解的聚类分析算法。B 项错误，EM 算法是一种迭代算法，用\n糖糖老师：1于含有隐变量的概率参数模型的最大似然估计或极大后验概率估计。D 项错误，SVM 算法\n（支持向量机）是一种监督学习算法，主要用于分类和回归分析。故选 C 项。", "passage": ""}, {"id": 47, "section": "cs", "type": "single", "stem": "数据库系统中，用于删除约束的命令是（… … ）。", "options": {"A": "ALERT TABLE MODIFY CONSTRAINT", "B": "DROP CONSTRAINT", "C": "ALTER CONSTRAINT DROP… ………………", "D": "ALTER TABLE DROP CONSTRAINT"}, "answer": "D", "analysis": "【 解 析】 在 SQL 中， 删 除 约 束 的 语 句 通 常 是 使 用 ALTER TABLE 语 句 配 合 DROP\nCONSTRAINT 子句来实现的。具体的语法格式如下：\nALTER TABLE 表名\nDROP CONSTRAINT 约束名；\n\n2025 年金融监督管理局招录考试计算机岗·专业知识真题卷答案解析\n故选 D 项。", "passage": ""}, {"id": 48, "section": "cs", "type": "single", "stem": "深度为 K 的满二叉树有（… … ）个节点。", "options": {"A": "K2", "B": "2K", "C": "2k-1", "D": "2k-1"}, "answer": "D", "analysis": "本题主要考查二叉树的性质。深度为 k 的满二叉树的结点数为 2k-1；深度为 k，\n第 k 层上的结点树为 2k-1。故选 D 项。", "passage": ""}, {"id": 49, "section": "cs", "type": "single", "stem": "在一个具有 N 个节点的单链表中查找关键字为 K 的节点时，查找成功的情况下，\n需平均比较（… … ）次。", "options": {"A": "N", "B": "N/2", "C": "（N+1）/2", "D": "（N-1）/2"}, "answer": "C", "analysis": "单链表查找成功的平均查找长度 = 总次数 / 元素个数。\n总次数 =（1+2+3+……+N）=\n平均查找长度 = * =\n故选 C 项。", "passage": ""}, {"id": 50, "section": "cs", "type": "single", "stem": "数据模型的三要素是（… … ）", "options": {"A": "外模式、概念模式和内模式", "B": "关系模型、网状模型和层次模型", "C": "实体、属性和关系", "D": "数据结构、数据操作和完整性约束条件"}, "answer": "D", "analysis": "", "passage": ""}, {"id": 51, "section": "cs", "type": "single", "stem": "现代数据库系统一般采用三级模式和二级映像，这种处理使得数据库系统具有较\n高的（… … ）。", "options": {"A": "数据独立性……", "B": "数据一致性", "C": "数据完整性……", "D": "数据安全"}, "answer": "A", "analysis": "8984351279\n【解析】数据模型的三要素是数据结构、数据操作、数据完整性约束。故选 D 项。\n【解析】数据库的二级映像指的是外模式 / 模式映像和模式 / 内模式映像。外模式 / 模\n式映像保证了数据与程序的逻辑独立性。模式 / 内模式映像保证了数据与程序的物理独立\n性。故选 A 项。", "passage": ""}, {"id": 52, "section": "cs", "type": "single", "stem": "下列 SQL 语句中，能够实现“把对表 E 的属性 Salary 的修改权授予用户 WU”这\n一功能的语句是（… … ）。……", "options": {"A": "GRANT UPDATE(Salary) ON TABLE E TO WU", "B": "GRANT UPDATE ON TABLE E TO WU", "C": "GRANT Salary ON TABLE E TO WU", "D": "GRANT UPDATE ON TABLE E(Salary) TO WU"}, "answer": "A", "analysis": "本题主要考查 SQL 授权语句的书写格式。授权语句的格式为：grant 权限 on\n数据库对象 to 用户。故选 A 项。", "passage": ""}, {"id": 53, "section": "cs", "type": "single", "stem": "定义学生关系模式 S(SNO，SNAME，SAGE，SDEPT，DC)( 其属性分别为学号、姓名、\n年龄、所在系、所在系的班主任 )，则该关系模式为（… … ）。", "options": {"A": "BCNF", "B": "3NF", "C": "2NF", "D": "1NF"}, "answer": "C", "analysis": "1NF 即第一范式，是指数据库表的每一列都是不可分割的基本数据项。2NF\n即第二范式，在 1NF 的基础上，要求数据表里的所有非主属性对主属性都是完全依赖，不\n存在部分函数依赖。3NF 即第三范式，在 2NF 的基础上，不存在传递函数依赖。由该关系\n模式中，学号可以决定所在系，所在系决定系主任，那也就说明学号可以决定系主任，存\n在传递函数依赖关系。故选 C 项。", "passage": ""}, {"id": 54, "section": "cs", "type": "single", "stem": "在关系数据库设计中，设计关系模式是（… … ）阶段的任务。", "options": {"A": "需求分析", "B": "逻辑结构设计", "C": "概念结构设计", "D": "物理结构设计"}, "answer": "B", "analysis": "本题主要考查数据设计的一般过程。数据库设计的过程包括需求分析、概念\n设计、逻辑设计、物理设计、实施和维护。B 项正确，逻辑设计是在概念设计的基础上进行的，\n它是将数据库概念模型转化为可实现的关系模式的过程。A 项，需求分析是确定数据库需\n求和目标的过程。在这个阶段，数据库设计人员需要与客户进行沟通，了解客户的需求和\n业务流程。通过详细的访谈和调研，收集并整理相关信息，确定数据库的功能需求和性能\n161\n\n2025 年金融监督管理局招录考试计算机岗·专业知识真题卷答案解析\n要求。C 项错误，概念设计需求分析阶段的概念转化为数据库概念模型的过程。D 项错误，\n物理设计将逻辑设计转化为物理存储结构的过程。故选 B 项。", "passage": ""}, {"id": 55, "section": "cs", "type": "single", "stem": "某单位为用户提供网上服务，允许用户通过浏览器管理自己的账户信息。为保障\n通信的安全性，该 Web 服务可选的协议是（… … ）。", "options": {"A": "POP", "B": "HTTPS", "C": "HTTP", "D": "SNMP"}, "answer": "B", "analysis": "本题主要考查计算机网络协议的功能。B 项正确，HTTPS 用来保证 WWW 传\n输的安全性和可靠性。A 项错误，POP 即邮局协议，用于电子邮件的接收。C 项错误，\nHTTP 超文本传输协议，用来 WWW 浏览，但是不能保证安全性。D 项错误，SNMP 网际\n组管理协议，一般用于网络的管理。故选 B 项。", "passage": ""}, {"id": 56, "section": "cs", "type": "single", "stem": "主机 168.16.84.24/20 所在子网的最小可分配地址和最大可分配地址分别是（… … ）。", "options": {"A": "168.16.80.1……168.16.84.254", "B": "地址是层次结构的，且随机分配", "C": "淘汰了广播，取而代之的是组播", "D": "每个接口只能配置一个 IPv6 地址"}, "answer": "B", "analysis": "168.16.84.24/20 说明网络号占 20 位，其中 4 位为子网位，主机位为 12 位。\n其中最小网络为 168.16.01010100.24。通过第三个字节可以判断该子网是 0101 号子网，最\n小 IP 为 168.16.01010000.00000001，即 168.16.80.1；最大 IP 为 168.16.01011111.11111110，\n即 168.16.95.254。故选 B 项。", "passage": ""}, {"id": 57, "section": "cs", "type": "single", "stem": "下面有关 IPv6 的说法正确的是（… … ）。\nA. 提供了 27 亿个地址 8984351279", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "C", "analysis": "本题主要考查 IPV6。C 项正确，IPv6 淘汰了广播，采用了组播和任意播的方\n式。A 项错误，IPv6 提供的地址数量远超过 27 亿个。B 项错误，Pv6 地址有一定的层次结\n构和分配规则并不是完全随机的。D 项错误，每个接口可以配置多个 IPv6 地址。IPv6 地址\n的配置方式有多种，包括自动配置、静态配置、无状态地址自动配置。故选 C 项。", "passage": ""}, {"id": 58, "section": "cs", "type": "single", "stem": "在使用子网掩码 255.255.255.192 网络中，每个子网有（… … ）台主机。", "options": {"A": "30", "B": "31", "C": "62", "D": "63"}, "answer": "C", "analysis": "本题主要考查子网的划分。通过子网掩码 255.255.255.192，二进制表示为 11\n111111.11111111.11111111.11000000，其中前 26 位为网络位，剩余 6 位为主机位。每个子\n网容纳主机的数量为 26-2=62 个。故选 C 项。", "passage": ""}, {"id": 59, "section": "cs", "type": "single", "stem": "采取（… … ）方式，能够提高主机的可用带宽和限制广播域的规模。", "options": {"A": "使用网桥", "B": "使用交换机", "C": "使用受控的集线器……", "D": "使用交换机并配置 VLAN"}, "answer": "D", "analysis": "本题主要考查提高带宽和划分广播域。D 项正确，通过在交换机上部署\nVLAN，可以将一个规模较大的广播域在逻辑上划分成若干个不同的、规模较小的广播域，\n糖糖老师：1由此可以有效地提升网络的安全性，同时减少垃圾流量，节约网络资源。一个 VLAN 就是\n一个广播域，所以在同一个 VLAN 内部，计算机可以直接进行二层通信；而不同 VLAN 内\n的计算机，无法直接进行二层通信，只能进行三层通信来传递信息，即广播报文被限制在\n一个 VLAN。网桥可将一个冲突域分割为两个，使每个冲突域共享自己的总线信道带宽，\n在一定程度上增加了可用带宽，但不能限制广播域规模，广播数据包仍会在整个网络中传\n播。交换机通过为需要通信的两台主机直接建立专用的通信信道来增加可用带宽，但默认\n情况下，交换机所有接口所连接的主机共同构成一个广播域，不能限制广播域规模。集线\n162\n\n器在逻辑上构成一个共享的总线，所有主机共享可用带宽，且集线器和其所有接口所接的\n主机共同构成一个冲突域和一个广播域，不能提高主机可用带宽和限制广播域规模。故选\nD 项。", "passage": ""}, {"id": 60, "section": "cs", "type": "single", "stem": "显示 OSPF 邻居信息的命令是（… … ）。", "options": {"A": "display ospf interface", "B": "display ospf routing", "C": "display ospf peer", "D": "display ospf 1sdb"}, "answer": "C", "analysis": "本题主要考查网络命令。display ospf peer 命令可以查看 ospf 邻居状态信息；\ndisplay ospf interface 是查看接口 OSPF 配置信息的命令；display ospf routing 显示 OSPF 路由；\ndisplay ospf lsdb 显示 OSPF 的链路状态数据库信息。", "passage": ""}, {"id": 61, "section": "cs", "type": "single", "stem": "当你在路由器的控制台上输入了 debug ip rip 命令，并发现正在通告的 172.16.10.0\n的度量值为 16，这意味着（… … ）。", "options": {"A": "这个路由不可达", "B": "这个路由的距离为 16 跳", "C": "这个路由具有 16 微秒的延迟", "D": "这个路由排在第二个 16 条消息处"}, "answer": "A", "analysis": "8984351279\n【解析】本题主要考查路由信息的含义。debug ip rip 是一个用于调试 RIP 协议的命令。\n在 Cisco 设备中，使用 debug ip rip 命令可以在特权执行模式下开启 RIP 协议的调试功能。\n这将显示 RIP 的详细调试信息，包括路由更新、路由接收和路由通告等。在 RIP 路由协议\n中，度量值用于表示到达目的网络的“距离”。RIP 使用跳数作为度量值，其中 16 被定义\n为目的网络不可达。故选 C 项。", "passage": ""}, {"id": 62, "section": "cs", "type": "single", "stem": "某主机无法上网，查看本地连接后，发现只有发送包没有接收包，故障原因可能\n是（… … ）。", "options": {"A": "网线没有插好", "B": "DNS 配置错误", "C": "IP 地址配置错误", "D": "TCP/IP 协议存在故障"}, "answer": "C", "analysis": "网络连通性问题中，本地连接显示有发送包但无接收包，通常与网络层配置\n有关。IP 地址配置错误可能导致数据包无法正确路由或接收。例如，错误的子网掩码或网\n关设置会使主机无法与网络中的其他设备通信，发送的数据包无法到达目的地，因而没有\n返回数据包。DNS 错误影响域名解析而非底层通信，物理层故障（如网线问题）通常导致\n完全无法通信。TCP/IP 协议故障一般会导致更严重的连接中断。A 项可能与物理层相关但\n通常显示无连接；B 项属应用层问题；D 项协议故障通常无法发送包。故选 C 项。", "passage": ""}, {"id": 63, "section": "cs", "type": "single", "stem": "依据《中华人民共和国网络安全法》，网络运营者应当制定（… … ），及时处置系统漏、\n计算机病毒、网络攻击、网络侵入等安全风险。", "options": {"A": "网络安全事件应急演练方案", "B": "网络安全事件应急预案", "C": "网络安全事件补救措施", "D": "网络安全事件应急处置措施"}, "answer": "B", "analysis": "根据《中华人民共和国网络安全法》第二十五条的规定：网络运营者应当制\n定网络安全事件应急预案，及时处置系统漏洞、计算机病毒、网络攻击、网络侵入等安全\n风险；在发生危害网络安全的事件时，立即启动应急预案，采取相应的补救措施，并按照\n规定向有关主管部门报告。故选 B 项。", "passage": ""}, {"id": 64, "section": "cs", "type": "single", "stem": "某管理员对即将上线的操作系统进行了以下四项安全部署工作，其中（… … ）设\n置不利于提高运行环境安全。", "options": {"A": "操作系统安装完成后安装最新的安全补丁，确保操作系统不存在可被利用的安全…\n漏洞", "B": "为了方便进行数据备份，安装操作系统时只使用一个分区，所有数据和操作系统都\n存放在该分区", "C": "操作系统上部署防病毒软件，以对抗病毒的威胁", "D": "将默认的管理员账号改名，降低口令暴力破解攻击的发生可能"}, "answer": "B", "analysis": "本题主要考查运行环境安全的内容。不利于运行环境安全的内容主要包括：…\n（1）环境潮湿；（2）极端温度；（3）外部强烈冲击或振动；（4）腐蚀气体或液体；…\n（5）单一的数据备份分区：安装 Windows 操作系统时只使用一个分区 C，所有数据和操\n作系统都存放在 C 盘，这种做法不利于提高运行环境安全。故选 B 项。", "passage": ""}, {"id": 65, "section": "cs", "type": "single", "stem": "以下（… … ）恶意软件利用社会工程伎俩诱骗受害者安装该软件。", "options": {"A": "病毒", "B": "蠕虫", "C": "木马", "D": "逻辑炸弹"}, "answer": "C", "analysis": "【解析】本题主要考查社会工程学。社会工程学是一种利用人的心理弱点、本能反应、\n好奇心、信任和贪婪等心理陷阱来进行欺骗和伤害的手段。C 项正确，木马病毒是通过自\n身伪装，吸引用户下载，利用人们的好奇心。A 项错误，病毒是一段特殊的计算机指令和\n代码。B 项错误，蠕虫病毒是通过网络广泛传播的病毒之一。D 项错误，逻辑炸弹是指对\n计算机程序进行修改，使之在某种特定条件下触发，按某种特殊的方式运行。故选 C 项。", "passage": ""}, {"id": 66, "section": "cs", "type": "single", "stem": "如果张三收到李四发来的一条有数字签名的消息，那么张三应该使用（… … ）来\n验证消息确实发自李四。", "options": {"A": "张三的公钥", "B": "张三的私钥", "C": "李四的公钥", "D": "李四的私钥"}, "answer": "C", "analysis": "本题主要考查数字签名。数字签名的本质是 “用私钥签名，用公钥验证”，\n利用非对称加密的特性确保消息的不可否认性和完整性。因此李四用自己的私钥进行签名，\n张三利用李四的公钥验签。故选 C 项。", "passage": ""}, {"id": 67, "section": "cs", "type": "single", "stem": "保密性、完整性和可用性通常被视为安全基础设施的主要目标。下列（… … ）不\n是对保密性的破坏。", "options": {"A": "使用键盘输入记录工具窃取密码", "B": "窃听无线网络通信", "C": "纵火造成存储设备毁坏", "D": "欺骗用户向虚假网站提供个人信息"}, "answer": "C", "analysis": "保密性也称机密性，是不将有用信息泄漏给非授权用户的特性，可以通过信\n息加密、身份认证、访问控制、安全通信协议。信息加密是防止信息非法泄露的最基本手段，\n主要强调有用信息只被授权对象使用的特征。C 项错误，C 项破坏了信息的完整性和可用性。\n故选 C 项。", "passage": ""}, {"id": 68, "section": "cs", "type": "single", "stem": "某公司希望在网络上测试系统是否存在 SQL 注入漏洞。以下（… … ）最适合此任务。", "options": {"A": "端口扫描器", "B": "网络漏洞扫描器", "C": "网络发现扫描器", "D": "Web 漏洞扫描器"}, "answer": "D", "analysis": "本题主要考查 SQL 注入。测试系统是否存在 SQL 注入漏洞的方法有使用在线\n网站漏洞扫描工具、手动检测、使用自动化工具检测。使用在线网站漏洞扫描工具可以使\n用在线的网站漏洞扫描工具，如亿思平台，这是一个免费的 web 安全扫描平台。使用这类\n工具可以快速地检测出网站是否存在 SQL 注入漏洞。故选 D 项。", "passage": ""}, {"id": 69, "section": "cs", "type": "single", "stem": "（… … ）可为敏感数据的保密性提供最佳保护。", "options": {"A": "数据标签", "B": "数据分类", "C": "数据处理", "D": "数据消磁"}, "answer": "B", "analysis": "B 项正确，数据发现与分类是为了有效地保护数据，需要确切地知道拥有的\n敏感信息。可以使用这些标签来集中数据安全资源，并实现根据数据对组织的价值保护数\n据的控制，是最佳保护途径。A 项错误，数据标签是对于数据的一种管理，可以根据数据\n进行深度的分析，精细化数据，可以更好的改善工作的效率和方法。C 项错误，数据处理\n糖糖老师：1是指对数据（包括数值的和非数值的）进行分析和加工的技术过程。D 项错误，数据消磁\n是指将磁盘上的磁域转变为无极性或无意义的状态，从而将原有数据完全抹除的过程。数\n据消磁是一种重要的数据安全措施，可以防止敏感数据被恶意读取或恢复。故选 B 项。", "passage": ""}, {"id": 70, "section": "cs", "type": "single", "stem": "黑客破解了连接 Wi-Fi 的新安装的婴儿监视器，对婴儿播放恐怖的声音，使孩子\n受到惊吓。在这个案例中，攻击者是通过（… … ）访问婴儿监视器的。", "options": {"A": "限制授权用户和未经授权人员的行动", "B": "执行身份认证", "C": "跟踪用户事件和检查违规情况\n8984351279", "D": "利用默认配置"}, "answer": "D", "analysis": "在新安装的婴儿监视器中，通常会有默认的用户名、密码或其他配置信息。\n如果用户没有及时更改这些默认配置，黑客就有可能利用这些已知的默认信息来访问设备。\n故选 D 项。\n\n2025 年金融监督管理局招录考试计算机岗·专业知识真题卷答案解析", "passage": ""}, {"id": 71, "section": "cs", "type": "single", "stem": "如果你为应用程序设计人员，需要通过执行各种安全机制来保护软件访问和处理\n的各类数据。执行受约束或受限制接口的目的是（… … ）。\nD. 在主内存和次内存之间交换数据集", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "A", "analysis": "本题主要考查访问控制。A 项正确，题干中所提到的内容为访问控制的含义，\n即保护数据的完整性，所以限制合法用户和不合法用户的活动。B 项错误，执行身份认证\n是访问控制的一种手段，不是目的。C 项错误，通过日志文件可以跟踪用户事件。D 项错误，\n主存和内存之间的交换数据集是通过分页或者分段实现。故选 A 项。", "passage": ""}, {"id": 72, "section": "cs", "type": "single", "stem": "数据中心多次出现硬件故障。审核员注意到服务器以密集的方式堆叠在一起，没\n有条理。应该采取（… … ）来解决这个问题。", "options": {"A": "门禁控制", "B": "综合布线", "C": "气体灭火", "D": "热通道与冷通道"}, "answer": "D", "analysis": "", "passage": ""}, {"id": 73, "section": "cs", "type": "single", "stem": "你被安排在一家跨国大型金融机构的信息安全规划团队中。你的任务是创建一个\n优先级列表，其中必须包含在初始设计阶段要解决的问题。所有安全工作的首要目标是\n（… … ）。", "options": {"A": "预防信息泄露", "B": "保持完整性", "C": "人身安全", "D": "维持可用性"}, "answer": "A", "analysis": "8984351279\n【解析】本题主要考查数据中心容灾。解决服务器以密集方式堆叠且没有条理的问题 ,\n可以通过以下方式：（1）规划和设计：根据服务器的数量、大小和用途，制定一个详细\n的布局计划。确保有足够的空间用于散热、维护和扩展；（2）组织和排列：使用服务器\n架来存放和排列服务器，确保服务器之间有足够的空间，以便于散热和维护；（3）散热\n和通风：可以使用风扇、空调和散热器等设备来帮助散热。故选 D 项。\n【解析】信息安全的三大目标是机密性、完整性和可用性，简称 CIA 或信息安全三元…\n组，这三个目标是信息安全的基础，也是衡量信息安全防护水平的重要指标。\n机密性（Confidentiality）是指确保只有授权的用户或实体能够访问敏感信息的性质。\n这意味着保护信息免受未经授权的访问、查看或披露。这是信息安全的最基本目标，也是\n所有其他安全目标的基础。完整性（Integrity）是指确保数据在其生命周期内保持完整、准\n确和可信的性质。这意味着防止未经授权的修改、删除或篡改数据，并确保数据的完整性\n和可信度。可用性（Availability）是网络信息可被授权实体访问并按需求使用的特性。即\n网络信息服务在需要时，允许授权用户或实体使用的特性，或者是网络部分受损或需要降\n级使用时，仍能为授权用户提供有效服务的特性。金融机构的首要风险是数据泄露，在初\n始设计阶段，必须优先确保数据机密性，以防止未经授权的信息披露。故选 A 项。", "passage": ""}, {"id": 74, "section": "cs", "type": "single", "stem": "（… … ）组合策略的备份还原速度最快。", "options": {"A": "完整备份和差异备份", "B": "部分备份和增量备份", "C": "完整备份和增量备份", "D": "增量备份和差异备份"}, "answer": "A", "analysis": "本题主要考查备份的策略。完整备份是指对整个系统或指定数据集进行完全\n的复制备份。这种方式能够确保在数据恢复时，可以迅速地恢复到一个完整的状态。然而，\n它通常需要较多的存储空间和较长的备份时间。差异备份是在上一次完整备份之后，只备\n份那些自上次完整备份以来发生更改的数据。这种方式相比完整备份节省了存储空间和备\n份时间。增量备份是在上一次任何类型的备份（完整备份或增量备份）之后，只备份那些\n自上次备份以来发生更改的数据。这种方式在存储空间和备份时间上都非常高效。部分备\n份并不是一个标准的备份术语，它可能指的是对数据集中的某些部分进行选择性的备份。\n这种备份方式可以根据实际需要灵活定制，但它可能缺乏系统性和全面性，不适合重要的\n163\n\n2025 年金融监督管理局招录考试计算机岗·专业知识真题卷答案解析\n数据保护策略。完整备份提供基础数据，差异备份补充最新变化，无需处理多个增量文件，\n因此还原速度最快。故选 A 项。", "passage": ""}, {"id": 75, "section": "cs", "type": "single", "stem": "“十四五”期间，我国关注推动政务信息化共建共用、推动构建网络空间命运共同\n体，属于（… … ）的建设内容。", "options": {"A": "科技中国", "B": "数字中国", "C": "制造强国", "D": "创新强国"}, "answer": "B", "analysis": "本题主要考查“十四五”规划纲要。我国“十四五”规划纲要第五篇：加快\n数字化发展 建设数字中国，迎接数字时代 , 激活数据要素潜能 , 推进网络强国建设 , 加快\n建设数字经济、数字社会、数字政府 , 以数字化转型整体驱动生产方式、生活方式和治理\n方式变革。题干中“推动政务信息化共建共用”属于打造“数字政府”的内容；“推动构\n建网络空间命运共同体”属于营造良好数字生态的内容。故选 B 项。", "passage": ""}, {"id": 76, "section": "cs", "type": "single", "stem": "当数据中心运行岗位员工离职或轮岗时，必须首先进行（… … ）。", "options": {"A": "明确此人不再具有以前的职责", "B": "确保归还应当归还的资产", "C": "确保属于以前职责的访问权限被撤销", "D": "安全管理员陪同此人离开工作场所"}, "answer": "C", "analysis": "本题主要考查信息安全。当数据中心运行岗位员工离职或轮岗时，及时更新\n离职或轮岗员工的权限和访问控制，确保他们不再具有对数据中心系统的访问权限。这有\n助于保护数据中心的安全性。故选 C 项。", "passage": ""}, {"id": 77, "section": "cs", "type": "single", "stem": "商业银行应制定相关控制信息系统变更的制度和流程，其中应包括生产系统与开\n发系统、测试系统（… … ）。", "options": {"A": "物理隔离", "B": "有效隔离", "C": "逻辑隔离", "D": "空间隔离"}, "answer": "B", "analysis": "《商业银行信息科技风险管理指引》第三十五条规定，商业银行应制定相关\n控制信息系统变更的制度和流程，确保系统的可靠性、完整性和可维护性，其中应包括以\n下要求：( 一 ) 生产系统与开发系统、测试系统有效隔离。( 二 ) 生产系统与开发系统、测\n试系统的管理职能相分离。( 三 ) 除得到管理层批准执行紧急修复任务外，禁止应用程序开\n发和维护人员进入生产系统，且所有的紧急修复活动都应立即进行记录和审核。( 四 ) 将完\n成开发和测试环境的程序或系统配置变更应用到生产系统时，应得到信息科技部门和业务\n部门的联合批准，并对变更进行及时记录和定期复查。故选 B 项。", "passage": ""}, {"id": 78, "section": "cs", "type": "single", "stem": "某金融机构的董事会对业务连续性计划进行年度审查，以确保能采取适当措施将\n灾难对机构持续运营的影响降至最低。机构通过这次审查履行了（… … ）。", "options": {"A": "企业责任", "B": "防灾减损", "C": "尽职审查", "D": "持续经营责任"}, "answer": "B", "analysis": "B 项正确，防灾减损服务是指为了降低保险事故发生的概率和减少保险事故\n造成的损失，所采取的风险预警、风险排查和风险规避等措施。A 项错误，企业责任是指\n企业在其经营活动中所承担的法律和道德义务。C 项错误，尽职审查是指在商业交易或投\n糖糖老师：1资决策前，对目标公司或项目进行全面的调查和评估，以获取相关信息，从而做出明智的\n决策。D 项错误，持续经营责任是指企业在可预见的未来，会按照当前的规模和状态继续\n经营下去，不会破产，也不会大规模削减业务。故选 B 项。", "passage": ""}, {"id": 79, "section": "cs", "type": "single", "stem": "关于数据安全管理，以下（… … ）是错误的。", "options": {"A": "开展数据处理活动，应当遵守法律、法规，尊重社会公德和伦理，遵守商业道德和\n职业道德，诚实守信，履行数据安全保护义务，承担社会责任，不得危害国家安全、公共利益，\n不得损害个人、组织的合法权益", "B": "关系国家安全、国民经济命脉、重要民生、重大公共利益等数据属于敏感数据，应\n当实行更加严格的管理制度", "C": "各地区、各部门应当按照数据分类分级保护制度，确定本地区、本部门以及相关行业、\n领域的重要数据具体目录，对列入目录的数据进行重点保护", "D": "重要数据的处理者应当明确数据安全负责人和管理机构，落实数据安全保护责任"}, "answer": "D", "analysis": "D 项错误，重要数据的处理者应当明确网络数据安全负责人和网络数据安全\n管理机构。网络数据安全管理机构应当履行网络数据安全保护责任，而非重要数据处理者\n落实网络安全保护责任。\n164\n\nA 项正确，‌ 数据安全管理是指对企业数据进行合理、有效和安全的处理、传输、存储\n和使用，以确保数据的保密性、完整性和可用性，并遵守相关的法律法规和行业标准‌ 。\nB 项正确，‌ 关系国家安全、国民经济命脉、重要民生、重大公共利益等数据属于敏感数据，\n应当实行更加严格的管理制度‌ 。根据《中华人民共和国数据安全法》的规定，这些数据属\n于国家核心数据，必须采取更加严格的保护措施。\nC 项正确，国家数据安全工作协调机制统筹协调有关部门制定重要数据目录，加强对\n故选 D 项。", "passage": ""}, {"id": 80, "section": "cs", "type": "single", "stem": "信息科技外包是金融机构提高效率、降低成本、分散风险的重要方式之一。关于\n金融机构信息科技外包，以下说法错误的是（… … ）。", "options": {"A": "应当明确相关方职责，指定信息科技外包风险管理部门", "B": "不可以将网络安全主体责任外包", "C": "不可以将信息科技管理责任外包\n\n每题至少有两个正确答案，少选、多选或错选均不得分。", "D": ""}, "answer": "D", "analysis": "8984351279\n重要数据的保护。各地区、各部门应当按照数据分类分级保护制度，确定本地区、本部门\n以及相关行业、领域的重要数据具体目录，对列入目录的网络。\n【解析】D 项错误，金融机构通过信息科技外包，可以将非核心业务交给外部专业机\n构处理，从而降低成本、提高效率和风险控制能力。A 项正确，金融机构应当建立与本机\n构信息科技战略目标相适应的信息科技外包管理体系，将信息科技外包风险纳入全面风险\n管理体系，有效控制由于外包而引发的风险‌ 。具体来说，金融机构需要明确相关方的职责，\n并指定信息科技外包风险管理部门，确保信息科技外包活动的规范和风险管理。B 和 C 项\n正确，银保监会发布了《银行保险机构信息科技外包风险监管办法》中要求：不得将信息\n科技管理责任、网络安全主体责任外包。故选 D 项。\n三、金融监管计算机类专业多项选择题：每题 1 分，共 20 题，计 20 分。下面各题，\n每题至少有两个正确答案，少选、多选或错选均不得分。", "passage": ""}, {"id": 81, "section": "multi", "type": "multi", "stem": "以下关于软件架构设计重要性的描述，正确的有（… … ）。", "options": {"A": "软件架构设计能够满足系统的性能、安全性、可维护性等品质", "B": "软件架构能够帮助项目干系人更好地理解软件结构", "C": "软件架构设计能够帮助业务人员更好地表达需求", "D": "软件架构设计能够有效地管理系统的复杂性，并降低系统维护费用"}, "answer": "ABD", "analysis": "本题主要考查软件架构的重要性。软件架构设计是降低成本、改进质量、按\n时和按需交付产品的关键因素。软件架构设计能够满足系统的性能、安全性、可维护性等\n品质；软件架构设计能够帮助项目干系人 (Stakeholder) 更好地理解软件结构；软件架构设\n计能够有效地管理系统的复杂性 , 并降低系统维护费用；软件架构设计对系统开发具有指\n导性；软件架构设计为系统复用奠定的基础；软件架构设计能够支持冲突分析。软件架构\n设计不能捕获需求，软件架构设计是在需求捕获并进行分析之后开展的工作。故选 ABD 项。", "passage": ""}, {"id": 82, "section": "multi", "type": "multi", "stem": "从技术的角度来看，影响软件可靠性的主要因素包括（… … ）。", "options": {"A": "运行剖面（环境）", "B": "软件规模", "C": "软件内部结构", "D": "软件的开发方法和开发环境"}, "answer": "ABCD", "analysis": "影响软件可靠性的主要因素包括软件运行剖面、软件规模、软件内部结构、\n软件的开发方法和开发环境以及软件的可靠性投入等。故选 ABCD 项。", "passage": ""}, {"id": 83, "section": "multi", "type": "multi", "stem": "敏捷开发的主要原则，包括以下（… … ）。\nA. 强调通过尽早地、持续地交付有价值的软件来使客户满意", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "ACD", "analysis": "【解析】敏捷开发的主要原则包括尽早、持续地交付有价值的软件，让客户满意；欣\n然面对需求变化，即使在开发后期‌ ；‌ 频繁地交付可工作的软件‌ ；面对面交谈是最有效、最\n高效的沟通方式等。敏捷开发确实强调经常交付可以工作的软件，但并不意味着每次交付\n都必须是具有完整功能的系统。敏捷开发鼓励的是逐步增加功能，而不是一次性交付完整\n系统。故本题选 ACD 项。", "passage": ""}, {"id": 84, "section": "multi", "type": "multi", "stem": "工作量估算模型 COCOMO II 的层次结构中，估算选择主要包括（… … ）。", "options": {"A": "对象点", "B": "功能点", "C": "用例数", "D": "源代码行"}, "answer": "ABD", "analysis": "本题主要考查 COCOMOII 模型。COCOMOII 模型也需要使用规模估算信息，\n在模型层次结构中有 3 种不同的规模估算选择：对象点、功能点和代码行。故选 ABD 项。", "passage": ""}, {"id": 85, "section": "multi", "type": "multi", "stem": "为解决组织中多个项目之间的资源冲突问题，可以采用的方法有（… … ）。", "options": {"A": "制定资源计划时，每个项目预留尽量多的资源富余量", "B": "检查组织内部的资源使用情况，看是否有资源分配不合理的情况", "C": "制定资源在项目间分配的原则，重要的项目优先得到资源", "D": "将组织中的资源进行统一管理，避免资源浪费和过度使用"}, "answer": "BCD", "analysis": "本题主要考查资源利用问题。解决组织中多个项目之间的资源冲突问题，可\n以采用的方法有优先级排序、资源共享、外部采购、优化流程、培训和发展、制定应急计划、\n寻求高层支持。制定资源计划时，每个项目预留尽量多的资源富余量并不是一个推荐的做\n法。故选 BCD 项。", "passage": ""}, {"id": 86, "section": "multi", "type": "multi", "stem": "软件变更控制对保障软件项目开发质量特别重要，其中（… … ）过程实现了变更\n控制的两个主要功能：访问控制和同步控制。", "options": {"A": "审批", "B": "评估", "C": "提取", "D": "提交"}, "answer": "CD", "analysis": "在软件开发和维护过程中，对软件的变更必须进行严格控制。这包括修改代…\n码、更改需求、调整设计等。其中“检出”和“检入”处理实现了两个重要的变更控制要\n素，即存取控制和同步控制。访问控制是通过限制对软件配置项的修改权限，确保合规性，\n同步控制是通过协调多人对同一配置项的修改，避免版本冲突，保证一致性。审批涉及审\n查和批准变更请求，主要功能是决策是否允许变更，但不直接实现访问控制或同步控制。\n评估涉及分析变更的影响、风险和可行性，主要功能是支持决策，不直接处理访问或同步\n控制。提取涉及从配置库获取配置项进行修改，用户必须拥有项目权限才能检出文件，实\n现访问控制，检出时默认锁定文件（或记录版本号），确保多人同时修改时后提交者需解\n决冲突，实现同步控制。提交涉及将修改后的配置项存入配置库，提交时需验证用户是否\n有权限更新配置库（如代码仓库的推送权限），实现访问控制，提交前需合并远程最新版\n糖糖老师：1本（如 Git 的 pull 操作），解决冲突后才能提交，确保版本同步，实现同步控制。提取和\n提交二者共同完成“访问 - 修改 - 同步” 的闭环。故选 CD 项", "passage": ""}, {"id": 87, "section": "multi", "type": "multi", "stem": "某设备采购项目，签订合同后进入了合同履行阶段，以下（… … ）情形是合理的。", "options": {"A": "合同履行过程中发现关于设备质量及验收要求的约定不明确，双方进行商议后以补\n充协议进行了规定", "B": "由于采购方不具备接收通信设备的条件，要求供货方延迟货物的交付，到了实际交\n付时，由于该通信设备的价格涨价，供货方要求变更合同价格", "C": "通信设备在运输至采购方的过程中，遇到了连续极端的暴雨天气无法按时交付，采\n购方认为合同中没有对应的免责条款，对供货方进行经济索赔", "D": "合同双方在履行过程中产生了纠纷，双方无法协调一致，因此向仲裁机构提出了仲\n裁申请"}, "answer": "AD", "analysis": "本题主要考查合同履行。B 项错误，《民法典》第五百三十三条规定，合同成立…\n后，合同的基础条件发生了当事人在订立合同时无法预见的、不属于商业风险的重大变化，\n继续履行合同对于当事人一方明显不公平的，受不利影响的当事人可以与对方重新协商；\n在合理期限内协商不成的，当事人可以请求人民法院或者仲裁机构变更或者解除合同。采\n\n2025 年金融监督管理局招录考试计算机岗·专业知识真题卷答案解析\n购方要求延迟交付可能构成违约或合同变更，但供货方不能仅因市场价格上涨就单方面要\n求变更合同价格，除非合同中有明确的价格调整条款。\nC 项错误，《民法典》第一百八十条规定，因不可抗力不能履行民事义务的，不承担\n民事责任。法律另有规定的，依照其规定。极端暴雨属于不可抗力，即便合同未明确免责\n条款，因不可抗力导致的履行迟延，违约方（供货方）可免除责任。故选 ACD 项。", "passage": ""}, {"id": 88, "section": "multi", "type": "multi", "stem": "关于 OLAP 和 OLTP 的叙述中正确的有（… … ）。", "options": {"A": "OLTP 事务量大，但事务内容比较简单且重复率高", "B": "OLAP 的最终数据来源与 OLTP 不一样", "C": "OLAP 面对决策高层人员", "D": "OLTP 以应用为核心，是应用驱动的"}, "answer": "ACD", "analysis": "8984351279\n【解析】本题主要考查 OLAP 和 OLTP 的区别。A、C、D 项正确，OLTP 处理的数据\n量相对较小，一般只读 / 写数十条记录，处理简单的事务，因此 OLTP 处理的是高频、短\n事务，单个事务仅涉及少量数据，但整体并发量极大，主要用户是普通用户，直接支持业\n务应用，处理具体的业务事务，是应用驱动统动的；OLAP 处理的数据量大，因为支持动\n态查询，用户可能需要通过将大量数据进行统计后才能得到所需信息，因此 OLAP 处理的\n是复杂查询，提供复杂查询和报告功能（如趋势分析、预测），主要用户是高层管理人员\n或决策者，侧重于数据探索和决策支持，是分析驱动的。B 项错误，OLAP 和 OLTP 的数\n据来源都来自底层数据库，OLAP 的数据通常来自 OLTP 系统的历史数据，经 ETL（提取、\n转换、加载）后存入数据仓库或数据集市。D 项正确，OLTP 以应用为核心，是应用驱动的。\n故选 ACD 项。", "passage": ""}, {"id": 89, "section": "multi", "type": "multi", "stem": "作为一名服务器运维人员，对数据库服务器的日常运维监控应重点关注（… … ）。", "options": {"A": "CPU 使用率", "B": "内存使用率", "C": "磁盘容量和 I/O", "D": "并发用户数"}, "answer": "ABCD", "analysis": "运维人员在进行系统监控时应该注意以下几个方面：（1）系统性能指标，\n如 CPU 使用率、内存使用情况、磁盘 I/O 等；（2）网络流量和带宽使用情况，确保网络\n通信顺畅；（3）服务可用性，监控关键服务的运行状态 , 确保服务的高可用性；（4）安\n全监控，及时发现并响应安全事件，保护系统安全；（5）日志管理，通过分析日志来发\n现系统潜在的问题和异常。故选 ABCD 项。", "passage": ""}, {"id": 90, "section": "multi", "type": "multi", "stem": "对数据库进行安全性控制，防范的对象有（… … ）。", "options": {"A": "非法用户", "B": "非法操作", "C": "不合语义的数据", "D": "“脏”数据"}, "answer": "AB", "analysis": "安全性控制的防范对象是非法用户和非法操作，防止他们对数据库数据的非\n法存取。故选 AB 项。", "passage": ""}, {"id": 91, "section": "multi", "type": "multi", "stem": "下列关于数据库中冗余数据的说法，正确的有（… … ）。", "options": {"A": "数据库中的冗余数据越少越好", "B": "冗余数据不会破坏数据库的完整性", "C": "冗余数据的存在给数据库的维护增加了难度", "D": "数据库中有必要存储一定的冗余数据"}, "answer": "CD", "analysis": "虽然减少冗余数据可以降低存储成本和简化数据管理，但在某些情况下，存\n储一定的冗余数据可以提高数据查询性能、增加数据的可靠性和提供数据备份。因此，不\n能一概而论地说冗余数据越少越好，而是需要根据具体的应用场景和需求来权衡；冗余数\n据的目的是建立数据库恢复机制。但是冗余数据可能造成数据库中数据不一致，破坏数据\n库的完整性，大量的冗余数据也给数据库的维护带来困难，数据库中有必要存储一定的冗\n165\n\n2025 年金融监督管理局招录考试计算机岗·专业知识真题卷答案解析\n余数据。故选 CD 项。", "passage": ""}, {"id": 92, "section": "multi", "type": "multi", "stem": "网络管理员监测到局域网内计算机的传输速度变得很慢，可能的原因有（… … ）。", "options": {"A": "WannaCry 勒索病毒", "B": "网络广播风暴", "C": "网络线路介质故障", "D": "运营商互联网接入故障"}, "answer": "ABC", "analysis": "WannaCry 病毒会在局域网内疯狂扫描并感染其他主机，占用大量带宽和系统\n资源，导致网络拥堵，显著降低局域网内部传输速度。广播风暴会导致广播包在网络中无\n限循环，占用全部带宽，使正常数据传输停滞。线路故障（如网线老化、水晶头接触不良、\n电磁干扰）会导致数据包丢失或误码率上升，触发 TCP 重传机制，降低有效传输速率。D\n项错误，互联网接入故障不会影响局域网内传输速度。故选 ABC 项。", "passage": ""}, {"id": 93, "section": "multi", "type": "multi", "stem": "把物理网络划分成 VLAN 的好处有（… … ）。", "options": {"A": "控制网络流量", "B": "灵活的网络管理", "C": "简化交换机的管理", "D": "提高网络的安全性"}, "answer": "ABCD", "analysis": "把物理网络划分成 VLAN 的好处有：（1）控制网络流量。一个 VLAN 内部\n的通信（包括广播通信）不会转发到其他 VLAN 中去，从而有助于控制广播风暴，减小冲\n突域，提高网络带宽的利用率。（2）提高网络的安全性。可以通过配置 VLAN 之间的路\n由来提供广播过滤、安全和流量控制等功能。不同 VLAN 之间的通信受到限制，提高了企\n业网络的安全性。（3）灵活的网络管理。VLAN 机制使得工作组可以突破地理位置的限制\n而根据管理功能来划分。如果根据 MAC 地址划分 VLAN，用户可以在任何地方接入交换网\n络，实现移动办公。故选 ABCD 项。", "passage": ""}, {"id": 94, "section": "multi", "type": "multi", "stem": "网络管理员在日常巡检中，发现某交换机有个接口丢包频繁，下列处理方法中正\n确的是（… … ）。", "options": {"A": "检查交换机是否中病毒", "B": "检查网线接口是否存在内部金属弹片凹陷或偏位", "C": "检查连接线缆是否存在接触不良或外部损坏的情况", "D": "检查设备两端接口双工模式、速率、协商模式是否一致"}, "answer": "BCD", "analysis": "交换机作为网络层设备，通常运行专用的固件，其系统架构与普通计算机不…\n同，“中病毒”的概率极低。丢包问题更可能由物理连接或配置问题导致。网线接口的金\n属弹片若凹陷或偏位，会导致与网线水晶头的接触不良，进而引发信号传输不稳定、丢包\n等问题。线缆接触不良或外部损坏（如线缆外皮破损、内部芯线断裂）会直接影响数据传\n输的完整性，导致丢包。若交换机接口与连接设备（如电脑、路由器）的双工模式、速率\n或协商模式不匹配，会导致数据传输冲突，引发丢包。故选 BCD 项。", "passage": ""}, {"id": 95, "section": "multi", "type": "multi", "stem": "某机构运营着一个公司网站，目前使用的是一台服务器，能够处理网站的全部负载。\n能够提高该服务器运行可靠性的有（… … ）。", "options": {"A": "在服务器中安装双电源。", "B": "在负载均衡器后面部署多台服务器", "C": "用 RAID 阵列替换服务器的硬盘。", "D": "定期备份服务器"}, "answer": "ABCD", "analysis": "A 项正确，在服务器中安装双电源可以提高服务器可靠性。服务器双电源主\n糖糖老师：1要起到关键作用。它能够极大提高服务器供电的可靠性，当其中一个电源出现故障时，另\n一个电源可立即接管，确保服务器持续稳定运行，避免因电源问题导致业务中断。B 项正确，\n布置多台服务器确实可以提高可靠性和稳定性。C 项正确，可以保存冗余数据，可靠性好。\nD 项正确，定期备份，遇到故障容易恢复。（争议选项：B，题目中提及的虽然是该台服务器，\n但通过部署多台服务器时，可通过负载均衡、多服务器可通过冗余架构避免单台服务器故\n障导致的服务中断。D，若服务器因硬件故障或软件错误导致数据损坏，定期备份可快速\n恢复系统和数据，缩短故障恢复时间，间接提升 “服务可用性”）故选 ABCD 项\n166", "passage": ""}, {"id": 96, "section": "multi", "type": "multi", "stem": "IT 部门通常会使用镜像来部署新系统。使用镜像的好处有（… … ）。", "options": {"A": "为配置管理提供基线", "B": "提高工作效率，减少响应时间", "C": "统一操作系统版本", "D": "记录变更"}, "answer": "ABC", "analysis": "A 项正确，镜像可以为配置管理提供基线配置。基线配置是指在系统安装后，\n将各项配置调整到一个安全、高效、合理的数值，这些数值符合安全方面的标准。通过使\n用镜像，可以确保系统的基础配置达到预定的安全基线标准，从而为配置管理提供一个稳\n定、安全的起点。BC 项正确，镜像文件可以实现快速部署，并且实现统一的操作系统版本。\nD 项错误，镜像本身并不具备记录变更的功能。故选 ABC 项。", "passage": ""}, {"id": 97, "section": "multi", "type": "multi", "stem": "某单位系统被配置为自动接收和更新补丁。收到补丁后，其中多个系统自动重启\n首席安全官要求的有（… … ）。", "options": {"A": "禁止自动化部署补丁", "B": "实施补丁管理流程以批准所有补丁", "C": "部署补丁后，定期审核补丁", "D": ""}, "answer": "AB", "analysis": "", "passage": ""}, {"id": 98, "section": "multi", "type": "multi", "stem": "你在排除用户计算机上的故障。你查看了基于主机的入侵检测系统 (HIDS) 的日志\n后确定这台计算机已被恶意软件入侵。为查明原因、降低损失，接下来你应该（… … ）。", "options": {"A": "把计算机与网络隔离开来", "B": "查看邻近计算机的 HIDS 日志", "C": "重启计算机", "D": "对系统进行分析，查明它是怎样被感染的"}, "answer": "ABD", "analysis": "", "passage": ""}, {"id": 99, "section": "multi", "type": "multi", "stem": "以下属于网络安全评估内容的有（… … ）。", "options": {"A": "漏洞扫描", "B": "风险评估", "C": "漏洞缓解", "D": "威胁评估"}, "answer": "ABD", "analysis": "8984351279\n【解析】本题主要考查系统配置。A 项错误，禁止自动化部署补丁可能会降低系统安\n全性。B 项错误，批准所有补丁可能会导致携带病毒的补丁进入系统。故选 AB 项\n【解析】重启计算机不会消除病毒。故选 ABD 项。\n【解析】计算机网络安全评估的内容主要包括：风险评估、攻击演习、漏洞扫描、安\n全体系的评估、安全设备的部署及性能评估、安全管理措施的评估等。故选 ABD 项。", "passage": ""}, {"id": 100, "section": "multi", "type": "multi", "stem": "下列属于金融机构信息科技风险的有（… … ）。", "options": {"A": "信息科技外包风险", "B": "现金流中断风险", "C": "应用云计算、人工智能等新技术过程中的相关风险", "D": "挤兑风险\n\n每题所给的四个选项中，选出最佳选项。\n（一）\nPrice determine how resources are to be used. They are also the means by which products\nand services that are in limited supply are rationed among buyers. The price system of the United\nStates is a very complex network composed of the prices of all the products bought and sold in the\neconomy as well as those of a myriad of services, including labor, professional transportation, and\npublic-utility services. The interrelationships of all these prices make up the“system”of prices.\nThe prices of any particular product or service are linked to a broad, complicated system of prices in\nwhich everything seems to depend more or less upon everything else.\nIf one were to ask a group of random individuals to define“price”, many would reply that\nprice is an amount of money paid by the buyer to the seller of a product or service or, in other words,\nthat price is the money value of a product or service as agreed upon in a market transaction. This\ndefinition is, of course, valid as far as it goes.\nFor a complete understanding of a price in any particular transaction, much more than the\namount of money involved must be known. Both the buyer and the seller should be familiar with not\nonly the money amount, but with the amount and quality of the product or service to be exchanged,\nthe time and place at which the exchange will take place and payment will be made, the form of\nmoney to be used, and the credit terms and discounts that supply to the transaction, guarantees\non the product or service, delivery terms, return privileges, and other factors. In other words, both\nbuyer and seller should be fully aware of all the factors that comprise the total“package”being\nexchanged for the asked-for amount of money in order that they may evaluate a given price."}, "answer": "ABC", "analysis": "本题主要考查金融科技风险知识。挤兑风险不属于金融机构的信息科技风险。\n‌。\n‌ 挤兑风险与信息科技风险在性质和来源上有显著区别。挤兑风险更多关联于金融机构的财\n务状况、市场信心和监管环境，而信息科技风险则主要涉及技术系统的稳定性和安全性。\n因此，挤兑风险不属于金融机构的信息科技风险范畴。故选 ABC 项。\n四、英语阅读理解题：每小题 0.5 分，共 20 题，计 10 分。阅读下列短文，从\n每题所给的四个选项中，选出最佳选项。", "passage": ""}, {"id": 101, "section": "eng", "type": "single", "stem": "According to the passage, the price system is related primarily to ______.", "options": {"A": "labor and education", "B": "transportation and insurance", "C": "utilities and repairs……", "D": ""}, "answer": "D", "analysis": "细节理解题。本题考查对文章关键信息的理解和提取能力，重点关注价格体\n系相关联的主要元素。文章第一段明确指出 “The price system of the United States is a very\ncomplex network composed of the prices of all the products bought and sold in the economy as well\nas those of a myriad of services, including labor, professional transportation, and public\nutility\nservices”，表明价格体系主要与产品和服务相关。A 选项中的劳动只是服务的一部分；B\n选项中的交通和保险，保险在文中未提及；C 选项中的公用事业只是服务的一种，且维修\n未提及。所以答案选 D，产品和服务是价格体系主要关联的对象。", "passage": ""}, {"id": 102, "section": "eng", "type": "single", "stem": "According to the passage, which of the following is NOT a factor in the complete\nunderstanding of price?", "options": {"A": "Instructions that come with a product.", "B": "The quantity of a product.", "C": "The quality of a product.", "D": "Warranties that cover a product."}, "answer": "A", "analysis": "-\n\n【解析】细节理解题。本题考查对文章中关于理解价格所涉及因素的全面理解，判\n断选项是否在文章提及范围内。文章第三段提到 “Both the buyer and the seller should be\nfamiliar with not only the money amount, but with the amount and quality of the product or service to\nbe exchanged, the time and place at which the exchange will take place and payment will be made,\nthe form of money to be used, and the credit terms and discounts that supply to the transaction,\nguarantees on the product or service, delivery terms, return privileges, and other factors”。B 选\n项产品的数量、C 选项产品的质量、D 选项产品的保修（对应 guarantees on the product or\nservice ）均有提及，而 A 选项产品附带的说明书在文中未出现，所以答案是 A。", "passage": ""}, {"id": 103, "section": "eng", "type": "single", "stem": "In the last sentence of the passage, the word“they”refers to ______.", "options": {"A": "return privileges……", "B": "all the factors", "C": "buyer and seller……", "D": "money"}, "answer": "C", "analysis": "语义理解题。本题考查对文中代词指代对象的判断能力，依据上下文逻辑关\n系来确定。文章最后一句“In other words, both buyer and seller should be fully aware of all the\nfactors that comprise the total“package”being exchanged for the asked\n-\nfor amount of money in\norder that they may evaluate a given price”，根据前文提到买卖双方需要了解各种因素，这里\n“they”是为了评估价格，所以“they”指代的是买卖双方，即 C 选项。按照寻找代词指\n代对象的方法，先向上搜索最近的名词，这里最近的就是“both buyer and seller”，代入句\n子后语义通顺，可确定答案。A 项的政府与消费者保护协会、B 项的经济学家与金融分析\n师和 D 项的监管者与行业专家都在该句中未涉及，不选，因此答案是 C。", "passage": ""}, {"id": 104, "section": "eng", "type": "single", "stem": "The paragraph following the passage most likely discusses ______.", "options": {"A": "unusual ways to advertise products", "B": "types of payment plans for service", "C": "theories about how products affect different levels of society", "D": "how certain elements of price“package”influence its market value"}, "answer": "D", "analysis": "文章后续内容推断题。本题考查对文章整体逻辑和后续内容走向的推断能力，\n依据文章结尾内容进行合理推测。文章最后一段强调买卖双方要了解构成价格“package”\n的所有因素才能评估价格，接下来最有可能讨论的是这些价格“package”的某些元素如何\n影响其市场价值，即 D 选项。A 选项不寻常的产品广告方式、B 选项服务的支付计划类型、\nC 选项产品如何影响社会不同层面，在文章中均未提及相关线索，与文章结尾内容逻辑不符。\n一般来说，推断下文题重点关注尾句，尾句提出了价格 “package” 的概念，所以下文围\n糖糖老师：1绕其相关内容展开讨论，因此答案是 D。", "passage": ""}, {"id": 105, "section": "eng", "type": "single", "stem": "What is the best title for the passage?", "options": {"A": "The Inherent Weakness for the Price System", "B": "The Complexities of the Price System", "C": "Credit Terms in Transactions", "D": "Resource Allocation and the Public Sector"}, "answer": "B", "analysis": "主旨大意题。本题考查对文章主旨的把握和概括能力，用简洁准确的标题来\n涵盖文章核心内容。文章主要介绍了美国价格体系的复杂性，包括其构成以及理解价格所\n需要考虑的诸多因素。A 选项价格体系的内在弱点在文中未提及；C 选项交易中的信用条\n款只是理解价格的一个因素，不能概括全文；D 选项资源分配和公共部门偏离了文章主要\n讨论的价格体系内容。B 选项 “The Complexities of the Price System”（价格体系的复杂性）\n\n2025 年金融监督管理局招录考试计算机岗·专业知识真题卷答案解析\n准确地概括了文章主旨，所以答案选 B。一般拟定标题可以从文章的主要内容、核心观点\n出发，简洁明了地体现文章主题，这个标题包含了文章重点讨论的对象 “价格体系” 以\n及其主要特点“复杂性”，因此答案是 B。", "passage": ""}, {"id": 106, "section": "eng", "type": "single", "stem": "What can we learn from the first two paragraphs?", "options": {"A": "Cash has already become an endangered species in rich economies.", "B": "Governments can tackle the problem of fraud by digitalization.", "C": "Digital payments are rarely seen in recent years.", "D": "Electronic payments will bring more efficiency to the economy."}, "answer": "D", "analysis": "细节理解与推断题。本题考查对段落细节信息的理解与推断能力。选项 A\n错误，原文第一段明确提到“即将成为濒危物种”（about to turn cash into an endangered\n此答案是 D。", "passage": ""}, {"id": 107, "section": "eng", "type": "single", "stem": "Capital One is mentioned in Paragraph 3 to illustrate ______.", "options": {"A": "digital payment systems are susceptible to network attacks", "B": "American banks will become easier to hack", "C": "a digital system could let private giants steal people’s data", "D": "country people will be affected in a cashless world"}, "answer": "A", "analysis": "8984351279\nspecies），而非已经成为。选项 B 错误，第二段提到政府可以通过数字化“更严密监控欺\n诈或逃税”（keep closer tabs on fraud），但并未说明能彻底解决（tackle）。选项 C 错误，\n第一段指出过去十年数字支付 “迅速发展”（taken off），与“rarely seen”矛盾。选项 D\n正确，第二段首句明确提到数字支付使经济更高效（make the economy more efficient），因\n【解析】细节理解与推断题。本题考查例证与论点的逻辑关系，识别作者意图。第三\n段主旨句为第二句”Electronic payment systems may be vulnerable to technical failures, power\nblackouts and cyber-attacks —this week Capital One... became the latest firm to be hacked.”电子\n支付系统可能面临技术故障、停电和网络攻击，Capital One 被黑客攻击是对这一风险的具\n体例证，其中选项 A 正确，直接对应“vulnerable to cyber-attacks”。选项 B 过度推断，案\n例仅说明某银行被攻击，未提及“美国银行更容易被黑”。文章并没有直接将 Capital One\n的黑客事件与私人公司窃取用户数据的风险相联系，因此选项 C 不符合文意。文章没有讨\n论无现金社会的影响，因此选项 D 也不符合。因此答案是 A。", "passage": ""}, {"id": 108, "section": "eng", "type": "single", "stem": "According to Paragraph 4, governments ought to ______.", "options": {"A": "let credit-card firms control the electronic pipes", "B": "ensure that central banks’ monopoly over digital money", "C": "urge banks to offer cheap, instant, bank-to-bank digital transfers", "D": "make sure the payments plumbing is open to all digital firms"}, "answer": "C", "analysis": "细节理解题。本题考查对具体建议的细节理解，精准定位到文章第四段的内容。\n选项 A 错误，原文 Let credit-card firms control the electronic pipes 明确反对信用卡公司垄断（not\nreplaced by private monopolies）。 原 文 Ensure that central banks’monopoly over digital money\n虽然原文提到中央银行应保持对货币的控制，但并没有明确表示要确保中央银行对数字货\n币的垄断，因此选项 B 不完全准确。选项 C 正确，对应“urge banks to offer cheap, instant,\nbank-to-bank digital transfers”。选项 D 错误，原文为“open to a range of digital firms”（对\n多家公司开放），而非“all”（所有公司）。因此答案是 C。", "passage": ""}, {"id": 109, "section": "eng", "type": "single", "stem": "Banks need to accept and distribute cash in populated areas because ______.", "options": {"A": "cash should be quickly phased out", "B": "it will give governments time to help the poor", "C": "it is the result of spontaneous demand", "D": "it will promote digital innovation"}, "answer": "B", "analysis": "细节理解题。本题考查因果关系的逻辑推理，需结合上下文。原文第 5 段 In the\nmeantime, banks need to accept and distribute cash in more populated areas, allowing governments\n167\n\n2025 年金融监督管理局招录考试计算机岗·专业知识真题卷答案解析\ntime to figure out how to help people who would be affected by a cashless society. 可知银行需要在\n拥挤地区接受并分发现金，以便政府有时间帮助那些可能受到无现金社会影响的群体。选\n项 B 正确，直接对应“buy governments time to help the poor”。选项 A 与“gradual phase-\nout”矛盾。原文主要谈论的是为了解决贫困问题而采取的措施。没有证据表明银行接受和\n分发现金是自发需求的结果，因此 C 不对。原文并没有提到现金的分发会直接促进数字创\n新，重点是帮助政府应对无现金社会的挑战，因此 D 不对。因此答案是 B。", "passage": ""}, {"id": 110, "section": "eng", "type": "single", "stem": "Which of the following can best summarize the main idea of the text?", "options": {"A": "How to phase out cash and to build up a cashless world.", "B": "The pros and cons of digital payment and how to tackle its problems.", "C": "The indispensable role of governments and banks in digital payment.", "D": "The possibility of the private monopolies over digital money.\n（三）"}, "answer": "B", "analysis": "主旨大意题。本题考查对文章整体结构和核心论点的把握。文章结构为：优\n势（第二段）→ 问题（第三段）→ 解决方案（第四至六段）。选项 B 正确，涵盖“利弊分析”\n和“解决措施”。文章没有仅仅讨论淘汰现金，而是更多关注如何应对无现金社会带来的\n挑战，因此选项 A 不全面。尽管文章确实提到政府和银行的作用，但它更侧重于讨论数字\n支付的优缺点和解决方案，而非单纯强调它们的不可或缺性，因此选项 C 不全面。虽然文\n章提到私营公司可能垄断数字支付，但文章的重点是讨论数字支付的问题和如何应对，而\n不是垄断本身，因此选项 D 不全面。因此答案是 B。", "passage": ""}, {"id": 111, "section": "eng", "type": "single", "stem": "Why are many people opposed to monitoring employee performance?", "options": {"A": "It puts workers under constant pressure.", "B": "It is universally deemed anti-human by nature.", "C": "It does both mental and physical harm to employees monitored.", "D": "It enables firms to squeeze maximal productivity from employees."}, "answer": "A", "analysis": "【 解 析】 细 节 理 解 题。 本 题 考 查 反 对 监 控 的 核 心 原 因。 由 题 干 中 的 opposed 以 及\nmonitoring employee performance 定位到第一段第一句。文章第一段第一句提到许多人反对\n工作场所监控，因为这种做法本身就带有使人丧失人性的效果，同时，还会带来无尽的压力。\n文中的 relentless pressure 对应 A 项中的 constant pressure，故选 A 项。选项 B 错误，原文为\n“inherent dechumanizing”，但未提及“universally anti-human”。选项 C 错误，文中未提 “身\n心伤害”。选项 D 是监控的目的，而非反对原因。因此答案是 A。", "passage": ""}, {"id": 112, "section": "eng", "type": "single", "stem": "What is the supporters’ argument for workplace surveillance?", "options": {"A": "It enables employees to refrain from dominating conversations.", "B": "It enhances employees’ identification with firms they work in.", "C": "It can alert employees to intrusion into their privacy.", "D": "It can protect employees against aggressive behavior."}, "answer": "D", "analysis": "细节理解题。本题考查支持者的观点。由题干中的 supporters' argument 定\n位到第二段最后一句。文中第二段最后一句提到支持者认为这可以保护员工免受欺凌和\n糖糖老师：1性骚扰 protect against bullying and sexual harassment，欺凌和性骚扰都是侵犯性的行为，\n因此工作场所监控可以保护员工免受攻击性行为的侵害，选项 D 正确，对应“aggressive\nbehavior”。选项 A 是监控手段（检测对话主导权），非论点。选项 B 和 C 原文未提及。\n因此答案是 D。", "passage": ""}, {"id": 113, "section": "eng", "type": "single", "stem": "What does the author want to show by the example of different numbers of people\ninteracting at lunch tables?", "options": {"A": "Data analysis is key to the successful implementation of workplace surveillance.", "B": "Analyzing data gathered from workers can yield something unexpected.", "C": "More workmates sitting at a lunch table tend to facilitate interaction and idea sharing.", "D": "It is hard to decide on how many people to sit at a lunch table without data analysis."}, "answer": "B", "analysis": "细节理解和推断题。本题为例证作用题，考查案例与论点的关系。由题干中\n的 different numbers of people interacting at lunch tables 定位到第三段首句和第二句。文章第\n168\n\n三段第二句举了一个例子：人们发现，与经常坐在四人桌旁的人相比，坐在 12 人用餐桌\n旁的人更愿意互动、分享更多的想法，并且表现得更好。文中的例子都是为了支持某个论\n点服务的，也就是为本段第一句服务的。第一句提到某些数据分析可能会产生意想不到的\n结果，因此，不同数量的人在午餐桌上互动的例子是为了证明分析从员工那儿收集到的数\n据可以得到让人意想不到的结果 produce unexpected results，故选 B 项。选项 C 是案例内容，\n非论证目的。选项 A 和 D 过度引申。因此答案是 B。", "passage": ""}, {"id": 114, "section": "eng", "type": "single", "stem": "What does much of the positive effect of monitoring initiatives depend on?", "options": {"A": "How frequently employees are to be monitored.", "B": "What specific personal information is being excluded.", "C": "What steps are taken to minimize their detrimental impact.", "D": "How well bosses make known their purpose of monitoring."}, "answer": "D", "analysis": "8984351279\n【解析】细节理解题。本题考查影响监控效果的核心变量。由题干中的 monitoring\ninitiatives 定位到第五段最后一句。文中第五段最后一句指出，监控举措要想有积极效果，\n很大程度上取决于如何传达此类监控措施。第六段第一、二句提到，如果老板不能与员工\n进行有效沟通，员工会把事情想得很糟糕。但是，如果他们对正在收集的信息以及对这些\n信息的处理持开放态度，研究表明，46% 的员工通常都是能接受的。原文强调“沟通方式”\n（how initiatives are communicated）决定效果。选项 A（频率）、B（排除信息）、C（减少\n负面影响）均未提及。因此答案是 D。", "passage": ""}, {"id": 115, "section": "eng", "type": "single", "stem": "What concern do monitoring initiatives cause among many staffers?", "options": {"A": "They may empower employers excessively.", "B": "They may erode the workplace environment.", "C": "They may infringe upon staffers' entitled freedom.", "D": "They may become counterproductive in the long run.\n（四）"}, "answer": "C", "analysis": "细节理解与推断题。本题考查员工的主要顾虑。由题干中的 staffers 定位到第\n六段最后一句。第六段最后一句提到尽管许多此类监控计划使用匿名数据，而且是自愿参\n与的，许多员工仍然持怀疑态度，担心他们的公民自由会受到侵害，由此可见员工担忧监\n控举措会侵犯他们应有的自由，文中的 liberties 对应 C 项中的 freedom，故选 C 项。选项 D\n是实施不当的后果，非员工直接担忧。选项 A 和 B 原文未提及。因此答案是 C。", "passage": ""}, {"id": 116, "section": "eng", "type": "single", "stem": "According to Paragraph 1 and Paragraph 2, Stuart Russell ______.", "options": {"A": "suggested social control on AI", "B": "denied the imminence of AI progress", "C": "praised AI science for its great success", "D": "had a low opinion of AI for its potential risks"}, "answer": "A", "analysis": "细节理解题。本题考查对人物观点的精准定位。A 建议对 AI 进行社会控制，\nB 否认 AI 进步的紧迫性，C 赞扬 AI 科学的巨大成功，D 因潜在风险而对 AI 评价低。第一\n段明确提到 Russell 认为 AI 科学需要“social limitations”，第二段进一步主张建立 “system\nof checks” 和法规（“regulations”）来处理系统性偏见。所以 A 选项正确，他建议社会控制。\n选项 B（否认 AI 进步的紧迫性）错误。Russell 仅强调 AI 进步需要时间，但未否认其紧迫性（第\n一段提到“doesn't make it science fiction”）。选项 C（赞扬 AI 科学的成功）错误。原文未\n提及对 AI 成功的赞扬，反而指出其风险未被合理评估。选项 D（因潜在风险而对 AI 评价低）\n不准确。Russell 并非否定 AI 本身，而是强调需通过社会控制管理风险。因此答案是 A。", "passage": ""}, {"id": 117, "section": "eng", "type": "single", "stem": "The approach of viewing AI in engineering terms has ______.", "options": {"A": "questioned the nature of human knowledge", "B": "contributed to socially irresponsible algorithms", "C": "prevented the algorithmic radicalization", "D": "sped up the market entry of quality products"}, "answer": "B", "analysis": "细节理解题。本题考查因果关系与细节匹配。选项 B（导致社会责任缺失的\n\n算法）正确。第二段指出硅谷推动的工程方法导致 AI 在目标不被社会接受时仍被推进，\n且缺乏问责（如 YouTube 算法引发激进化）。选项 A（质疑人类知识的本质）错误。这\n属于第二种方法（哲学方法）的特点，与工程方法无关。选项 C（防止算法激进化）错\n误。原文明确提到工程方法导致了算法激进化（“highlighted by the role YouTube's algorithm\nplays in radicalizing people”）。选项 D（加速优质产品上市）错误。原文仅提到“quickly\nto market”，未提及“quality products”。因此答案是 B。", "passage": ""}, {"id": 118, "section": "eng", "type": "single", "stem": "According to Prof. Russell, machines ______.", "options": {"A": "should be banned from pretending to be humans", "B": "are especially helpful to counter social biases", "C": "might get uniformly regulated at a global scale", "D": "are not supposed to be supervised by humans"}, "answer": "A", "analysis": "细节理解题。本题考查人物观点与具体建议。选项 A（应禁止冒充人类）正确。\n第三段明确提到 Russell 支持欧盟立法禁止机器冒充人类（“ban impersonation of humans by\nmachines”）。选项 B（特别有助于消除社会偏见）错误。原文仅提到法规需处理系统性偏见，\n未说明机器本身的作用。选项 C（可能在全球范围内统一监管）不准确。Russell 支持“global\nadoption of EU legislation”，但未提及“uniformly regulated”。选项 D（不应由人类监督）错误。\nRussell 主张机器需“ask for human guidance”，说明需要人类监督。因此答案是 A。", "passage": ""}, {"id": 119, "section": "eng", "type": "single", "stem": "What does the author say about OpenAI’s GPT-3?", "options": {"A": "Its language is impossible to understand.", "B": "It is non-human but can truly fool humans.", "C": "Its programming is based on misconceptions.", "D": "It is intelligent but cannot comprehend words."}, "answer": "D", "analysis": "细节理解题。本题考查具体信息的同义替换。选项 D（智能但无法理解语…\n言）正确。第三段指出 GPT-3“cannot comprehend what it spews”，且测试中生成错误答案，\n模仿误解。选项 A（其语言无法理解）错误。原文强调 GPT-3 自身无法理解生成内容，而\n非人类无法理解其语言。选项 B（能真正愚弄人类）错误。原文提到 GPT-3 只是“superficially”\n接近图灵测试，实际无法理解“mutual understandings”。选项 C（编程基于误解）错误。\nGPT-3 生成的内容模仿误解，但编程基础并非基于误解。因此答案是 D。", "passage": ""}, {"id": 120, "section": "eng", "type": "single", "stem": "Einstein’s theory of general relativity is mentioned to show that ______.", "options": {"A": "AI-produced insights can be complementary to human thoughts", "B": "machines are comparable to humans in terms of logical thinking", "C": "human intelligence can hardly be translated into an algorithm", "D": "brilliant scientific ideas always come way ahead of their time\n8984351279"}, "answer": "C", "analysis": "细节理解题。本题考查例子与论点的关系。选项 C（人类智能难以转化为算法）\n正确。最后一段用爱因斯坦的理论说明人类智能能产生无法通过逻辑推导的灵感，而 AI\n依赖算法，无法做到这一点。选项 A（AI 见解可补充人类思想）错误。例子强调人类智能\n糖糖老师：1的独特性，而非 AI 的补充作用。选项 B（机器在逻辑思维上与人类相当）错误。例子反\n驳了这一观点，强调人类智能的不可替代性。选项 D（科学思想常超前于时代）偏离主题。\n例子重点在于人类智能的非算法性，而非时间先后。因此答案是 C。\n\n2025 年金融监督管理局招录考试计算机岗·专业知识真题卷答案解析\n8984351279\n169", "passage": ""}]}, "2024": {"meta": {"title": "2024年 金监局·计算机岗 专业科目真题卷", "subtitle": "金融监督管理总局招录考试 · 专业知识真题卷（含解析）", "year": 2024, "total": 120, "minutes": 120, "score": 100, "source": "【考试喵】金监局2024年笔试真题及解析-计算机岗.txt"}, "sections": [{"key": "econ", "name": "经济金融基础知识 · 单选", "range": [1, 20], "per": 0.5, "type": "single"}, {"key": "cs", "name": "计算机专业知识 · 单选", "range": [21, 80], "per": 1, "type": "single"}, {"key": "multi", "name": "计算机专业知识 · 多选", "range": [81, 100], "per": 1, "type": "multi"}, {"key": "eng", "name": "英语阅读理解 · 单选", "range": [101, 120], "per": 0.5, "type": "single"}], "questions": [{"id": 1, "section": "econ", "type": "single", "stem": "为维护您的个人权益，确保公务员考试的公平公正，请您协助我\n们监督考试实施工作。\n本场考试规定：监考人员要向本考场全体考生展示题本密封情况，\n并邀请 2 名考生代表验封签字后，方能开启试卷袋。如果您发现本考场\n监考人员存在违规启用试卷袋的情况，请向人力资源和社会保障部人事\n考试中心举报。", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "B", "analysis": "根据马克思的政治经济学理论，商品的两种基本属性是指商品的使用价值和\n价值。使用价值表示商品的有用性，属于自然属性；价值是指凝结在商品当中一般的、无\n差别的人类劳动，属于社会属性。故选 B 项。", "passage": ""}, {"id": 2, "section": "econ", "type": "single", "stem": "根据《公务员考试录用违纪违规行为处理办法》，答卷雷同，将\n给予该科目（场次）考试成绩无效等处理。请您妥善看护好自己的考试\n试卷和答题信息，防止被他人抄袭。\n\n\n\n注意事项 :", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "A", "analysis": "在两部门经济中，经济达到均衡时社会的总需求等于总产出，即经济社会的\n收入等于全体社会想要有的支出，实现计划储蓄和计划投资相等。故选 A 项。", "passage": ""}, {"id": 3, "section": "econ", "type": "single", "stem": "下列各项可被计入国内生产总值（GDP）的是（… … ）。", "options": {"A": "家庭主妇的家务劳动", "B": "拍卖毕加索画稿的收入", "C": "晚上帮邻居照看孩子的收入", "D": "从政府领取的困难补助收入"}, "answer": "C", "analysis": "国内生产总值（GDP）是指一定时期内（通常为 1 年）在一国（或地区）境\n内生产的所有最终产品与服务的市场价值总和。拍卖毕加索画稿是产权转移活动，没有实\n际价值增值；家庭主妇的家务劳动属于自给自足；从政府领取的困难补助收入属于转移支\n付，均不应计入 GDP。故选 C 项。", "passage": ""}, {"id": 4, "section": "econ", "type": "single", "stem": "监考人员宣布考试结束时，考生应立即停止作答，将题本、答题\n卡和草稿纸一律留在桌上，待监考人员确认数量无误、允许离开后，方\n可离开考场。如果你违反了以上任何一项要求，都将影响你的成绩。", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "C", "analysis": "糖糖老师：1【解析】 基尼系数是衡量一个国家贫富差距的指标。基尼系数越大，洛伦兹曲线越弯曲，\n收入分配越不均等；基尼系数越小，洛伦兹曲线越平缓，收入分配越均等。故选 C 项。", "passage": ""}, {"id": 5, "section": "econ", "type": "single", "stem": "million homeowners back into the black, but 11 million out of a total of 50 million mortgage\nholders remain in what financial folks call a negative equity position.“This is the new normal in\nthe housing market,” said Svenja Gudell, director of economic research at Zillow, an online real\nestate database,“We will have high levels of negative equity for some time.”\nWith mortgage rates rising and expected to hit 5 percent late next year, many economists\npredict a more subdued housing market in 2022. That means price gains should moderate and it\ncould take a while longer for homeowners who are underwater to recover. Out of the 75 million\nhomeowners in America, about one in seven stay trapped in their homes, unable to move or sell.\nHousing prices have gone up and down over the decades, but until the financial crisis of\n2008, it was rare to owe a bank more than a home is worth. For all of the 19th century and even\nduring the Great Depression, this was virtually unheard of.\nUntil all the negative equity disappears, the housing market won't be back to normal. It looks\nlike we still have years to go.", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "D", "analysis
