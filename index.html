hypotheses: Maybe it was something in the red wine, they said. But while winemakers worldwide celebrated that news, more sober research has suggested that any alcohol—whether Lafite Rothschild, a banana daiquiri or a cold bud—pretty much has the same nice, relaxing effect. So while a little wine is apt to do you good, the French aren't so special in having a drink now and then (though the fact that they drink wine moderately and slowly with meals, instead of downing shots at the bar, could make a difference). After the wine argument, scientists ventured that it must be the olive oil that keeps the French healthy. But this doesn't explain the butter or brie. Then, French scientist Serge Renaud said it's the foie gras that melts away cholesterol. This, too, is dicey: While people in Toulouse - the duck - liver - eating area of France—do indeed have one of the lowest rates of heart disease in the developed world, they actually only eat the delicacy about six times a year. And they're a lot more likely to die of stroke than we are anyway. Other researchers, perhaps sponsored by the garlic and onion industry, suggested that the French Paradox effect is due to garlic and onions. Claude Fischler, a nutritional sociologist at INSERM, says all these single hypotheses are more wishful thinking than science. Last May, researchers writing in the British Medical Journal came up with the least cheerful hypothesis of all. They argued that it's just a matter of time before the French—who are in fact eating more hamburgers and French fries these days—catch up with Americans, and begin suffering the same high rates of cardiovascular disease. These researchers, Malcolm Law and Nicholas Wald, call this the“time lag explanation”for the French Paradox. As far as they are concerned, the McDonaldization (this is a French catch - all term for the importation of fast food and other American cultural horrors) of France will continue at a frantic pace, and it is as inevitable that French men will start keeling over（晕倒）of heart attacks as it is that French women will eventually wear jean shorts and marshmallow tennis shoes on the streets of Paris.","options":{"A":"The French Paradox is due to the influence of American values.","B":"The French Paradox will disappear in time.","C":"The McDonaldization of France has little effect on the French's health.","D":"There is no such thing as the French Paradox."},"answer":"B","analysis":"推断题。由第五段的内容“They argued that it's just a matter of time before the French—who are in fact eating more hamburgers and French fries these days — catch up with Americans, and begin suffering the same high rates of cardiovascular disease.”和最后一段的内容“... it is as inevitable that French men will start keeling over（晕倒）of heart attacks as it is that French women will eventually wear jean shorts and marshmallow tennis shoes on the streets of Paris.”可知，法国人会因为吃越来越多的汉堡和薯条导致患心血管疾病的概率上升，所以“法国式悖论”的消失只是时间问题。故选 B 项。"},{"id":116,"section":"eng","type":"single","stem":"According to this passage, what is the purpose of recruiting outside directors?（ ）","passage":"Over the past decade, American companies have tried hard to find ways to discourage senior managers from feathering their own nests at the expense of their shareholders. The three most popular reforms have been recruiting more outside directors in order to make boards more independent, linking bosses' pay to various performance measures, and giving them share options so that they have the same long - term interests as their shareholders. These reforms have been widely adopted by America's larger companies, and surveys suggest that many more companies are thinking of following their lead. But have they done any good? Papers published this week by Boston Academy of Management suggest otherwise. The consequences have differed from those intended. Start with those independent directors. On the face of it, dismissing the boss's friends from the board and replacing them with outsiders looks a perfect way to make senior managers more accountable. But the Boston papers show that bosses with a boardroom full of people generally pleasing to outsiders. All too often, these seductions succeed. For the latter two reforms, the papers argue that bosses tend to attend to measures that affect their own incomes and ignore or play down other factors that affect a company's overall success. In short, bosses are quick to turn every imaginable system of corporate governance to their advantage which is probably why they are the people who are put in charge of things. Here is a paradox for the management theorists — any boss who cannot beat a system designed to keep him or her under control is probably not worth having.","options":{"A":"To diversify the company's business.","B":"To increase collaboration among board members.","C":"To protect the interests of shareholders.","D":"To introduce effective reforms in business operation."},"answer":"C","analysis":"细节题。第一段的内容“Over the past decade, American companies have tried hard to find ways to discourage senior managers from feathering their own nests at the expense of their shareholders. The three most popular reforms have been recruiting more outside directors in order to make boards more independent...”大意为：在过去的十年里，美国公司力图寻求方法阻止高级管理人员以牺牲股东利益为代价损公肥私的行为。为此采取了三种最流行的改革措施，如招募外来董事以使董事会更加独立。由此我们可以推知招募外来董事的目的是保护股东的利益。其中，“eathering their own nests”意为中饱私囊，“at the expense of their shareholders”意为以股东的利益为代价。故选 C 项。"},{"id":117,"section":"eng","type":"single","stem":"What do the papers of Boston Academy of Management suggest?（ ）","passage":"Over the past decade, American companies have tried hard to find ways to discourage senior managers from feathering their own nests at the expense of their shareholders. The three most popular reforms have been recruiting more outside directors in order to make boards more independent, linking bosses' pay to various performance measures, and giving them share options so that they have the same long - term interests as their shareholders. These reforms have been widely adopted by America's larger companies, and surveys suggest that many more companies are thinking of following their lead. But have they done any good? Papers published this week by Boston Academy of Management suggest otherwise. The consequences have differed from those intended. Start with those independent directors. On the face of it, dismissing the boss's friends from the board and replacing them with outsiders looks a perfect way to make senior managers more accountable. But the Boston papers show that bosses with a boardroom full of people generally pleasing to outsiders. All too often, these seductions succeed. For the latter two reforms, the papers argue that bosses tend to attend to measures that affect their own incomes and ignore or play down other factors that affect a company's overall success. In short, bosses are quick to turn every imaginable system of corporate governance to their advantage which is probably why they are the people who are put in charge of things. Here is a paradox for the management theorists — any boss who cannot beat a system designed to keep him or her under control is probably not worth having.","options":{"A":"Boardroom reforms have failed to achieve their desired results.","B":"Outside board directors tend to think and act differently from senior managers.","C":"The performance of the company is negatively affected by the reforms.","D":"Senior management suffers from the reforms."},"answer":"A","analysis":"细节题。由第二段最后一句“The consequences have differed from those intended.”可知，改革的结果事与愿违，这是一个总的结论。根据后面引用 Boston papers 的观点“... the papers argue that bosses tend to attend to measures that affect their own incomes and ignore or play down other factors that affect a company's overall success.”可知，老板们往往只关注影响自身收入的指标，而忽略或者淡化那些影响公司整体成功的其他因素。根据文章可知，所谓的改革背离了初衷。故选 A 项。"},{"id":118,"section":"eng","type":"single","stem":"What is the most probable meaning of the underlined word“seductions”?（ ）","passage":"Over the past decade, American companies have tried hard to find ways to discourage senior managers from feathering their own nests at the expense of their shareholders. The three most popular reforms have been recruiting more outside directors in order to make boards more independent, linking bosses' pay to various performance measures, and giving them share options so that they have the same long - term interests as their shareholders. These reforms have been widely adopted by America's larger companies, and surveys suggest that many more companies are thinking of following their lead. But have they done any good? Papers published this week by Boston Academy of Management suggest otherwise. The consequences have differed from those intended. Start with those independent directors. On the face of it, dismissing the boss's friends from the board and replacing them with outsiders looks a perfect way to make senior managers more accountable. But the Boston papers show that bosses with a boardroom full of people generally pleasing to outsiders. All too often, these seductions succeed. For the latter two reforms, the papers argue that bosses tend to attend to measures that affect their own incomes and ignore or play down other factors that affect a company's overall success. In short, bosses are quick to turn every imaginable system of corporate governance to their advantage which is probably why they are the people who are put in charge of things. Here is a paradox for the management theorists — any boss who cannot beat a system designed to keep him or her under control is probably not worth having.","options":{"A":"Efforts to defeat competitors.","B":"Endeavors to increase profits.","C":"Attempts to win over.","D":"Efforts to dissuade."},"answer":"C","analysis":"语义题。根据文章第三段的内容，从表面上看，将老板的朋友从董事会解雇，用外部人士取代他们，似乎是让高级管理人员更负责任的完美方法。但波士顿的报纸显示，老板们往往会组建一个对外部人士普遍顺从（取悦）的董事会。接下来提到，这些诱惑通常是成功的，由此我们可以推知老板的这些手段是为了争取外来董事结成联盟，进而可推知C 项正确。故选 C 项。"},{"id":119,"section":"eng","type":"single","stem":"Which of the following is TRUE according to this passage?（ ）","passage":"Over the past decade, American companies have tried hard to find ways to discourage senior managers from feathering their own nests at the expense of their shareholders. The three most popular reforms have been recruiting more outside directors in order to make boards more independent, linking bosses' pay to various performance measures, and giving them share options so that they have the same long - term interests as their shareholders. These reforms have been widely adopted by America's larger companies, and surveys suggest that many more companies are thinking of following their lead. But have they done any good? Papers published this week by Boston Academy of Management suggest otherwise. The consequences have differed from those intended. Start with those independent directors. On the face of it, dismissing the boss's friends from the board and replacing them with outsiders looks a perfect way to make senior managers more accountable. But the Boston papers show that bosses with a boardroom full of people generally pleasing to outsiders. All too often, these seductions succeed. For the latter two reforms, the papers argue that bosses tend to attend to measures that affect their own incomes and ignore or play down other factors that affect a company's overall success. In short, bosses are quick to turn every imaginable system of corporate governance to their advantage which is probably why they are the people who are put in charge of things. Here is a paradox for the management theorists — any boss who cannot beat a system designed to keep him or her under control is probably not worth having.","options":{"A":"In general corporate executives are being criticized by outside board directors.","B":"The income of corporate executives is proportional to profit growth.","C":"Corporate executives tend to take advantage of their position to enrich themselves.","D":"The performance of corporate executives affects their own interests more than those of the shareholders."},"answer":"C","analysis":"细节题。本题可用排除法。A 项，公司高管会受到外来董事的批评，文章未提及；B 项，公司高层的收入与公司增长的利润成正比，也未提及；D 项，公司高层的业绩对其自身利益的影响大于对股东利益的影响，同样未提及；C 项，公司高层倾向于利用其地位肥己，与文章第三段最后一句所述之意相符。故选 C 项。"},{"id":120,"section":"eng","type":"single","stem":"How does the author feel about the corporate reforms?（ ）","passage":"Over the past decade, American companies have tried hard to find ways to discourage senior managers from feathering their own nests at the expense of their shareholders. The three most popular reforms have been recruiting more outside directors in order to make boards more independent, linking bosses' pay to various performance measures, and giving them share options so that they have the same long - term interests as their shareholders. These reforms have been widely adopted by America's larger companies, and surveys suggest that many more companies are thinking of following their lead. But have they done any good? Papers published this week by Boston Academy of Management suggest otherwise. The consequences have differed from those intended. Start with those independent directors. On the face of it, dismissing the boss's friends from the board and replacing them with outsiders looks a perfect way to make senior managers more accountable. But the Boston papers show that bosses with a boardroom full of people generally pleasing to outsiders. All too often, these seductions succeed. For the latter two reforms, the papers argue that bosses tend to attend to measures that affect their own incomes and ignore or play down other factors that affect a company's overall success. In short, bosses are quick to turn every imaginable system of corporate governance to their advantage which is probably why they are the people who are put in charge of things. Here is a paradox for the management theorists — any boss who cannot beat a system designed to keep him or her under control is probably not worth having.","options":{"A":"Positive.","B":"Doubtful.","C":"Indifferent.","D":"Serious."},"answer":"B","analysis":"观点态度题。纵观全文，作者所述三项改革举措并未收到预期效果，反而适得其反，事与愿违，由此我们可以判断作者对其最终的结果显然持怀疑态度。故选 B 项。"}]},"2022":{"meta":{"total":120,"source":"2022 年银保监会/金监局计算机岗专业卷（PDF 原文重提取）"},"sections":[{"key":"econ","name":"经济金融基础知识 · 单选","range":[1,20],"per":0.5,"type":"single"},{"key":"cs","name":"计算机专业知识 · 单选","range":[21,80],"per":1,"type":"single"},{"key":"multi","name":"计算机专业知识 · 多选","range":[81,100],"per":1,"type":"multi"},{"key":"eng","name":"英语阅读理解 · 单选","range":[101,120],"per":0.5,"type":"single"}],"questions":[{"id":1,"section":"econ","type":"single","stem":"实际经济周期理论认为，（  ）是经济波动的根源。","passage":"","options":{"A":"货币因素","B":"价格因素","C":"技术因素","D":"人口因素"},"answer":"C","analysis":"实际经济周期理论将经济波动的根源归结为以技术冲击为代表的实际因素，认为是总供给冲击产生经济周期而不是总需求冲击产生经济周期。故选 C 项。"},{"id":2,"section":"econ","type":"single","stem":"根据凯恩斯主义的 IS - LM 模型，当经济处于流动性陷阱时期，为刺激需求应该采取的政策是（  ）。","passage":"","options":{"A":"增加财政税收","B":"增加财政支出","C":"增加货币供给","D":"提高法定准备金率"},"answer":"B","analysis":"根据凯恩斯主义的 IS - LM 模型，当经济处于流动性陷阱时期，货币政策无效，应采取扩张的财政政策来刺激总需求，如增加财政支出、减少税收等。故选 B 项。"},{"id":3,"section":"econ","type":"single","stem":"在宏观经济学基本假设中，投资支出是利率的函数。当投资支出对利率变化比较敏感时，（  ）。","passage":"","options":{"A":"总需求曲线更趋平缓","B":"总需求曲线更趋陡峭","C":"总需求曲线无变化","D":"总供给曲线更趋平缓"},"answer":"A","analysis":"当投资支出对利率变化比较敏感时，IS 曲线更加平坦，货币政策效果好。也就意味着，当价格下降时，实际货币供给量增加，LM 曲线向右移动之后带来的总需求增加的量变多，所以总需求曲线趋向平坦。故选 A 项。"},{"id":4,"section":"econ","type":"single","stem":"在边际产出大于 0 的情况下，随着投入的增加，总产量（  ），平均产量（  ）。","passage":"","options":{"A":"上升 上升","B":"上升 下降","C":"下降 上升","D":"上升 无法确定"},"answer":"D","analysis":"根据短期生产的三个阶段，由总产量、边际产量与平均产量的图形可知，当边际产量大于零时，总产量上升，平均产量可能上升也可能下降。故选 D 项。"},{"id":5,"section":"econ","type":"single","stem":"乒乓球拍价格降低将导致乒乓球的（  ）。","passage":"","options":{"A":"需求曲线向右移动","B":"需求曲线向左移动","C":"供给曲线向右移动","D":"供给曲线向左移动"},"answer":"A","analysis":"具有替代关系的两种商品，其中一种商品的价格和另一种商品的需求量之间呈同方向变动关系；互补关系的两种商品，其中一种商品的价格和另一种商品的需求量之间呈反方向变动关系。乒乓球拍与乒乓球是一组互补品，所以当乒乓球拍价格降低时，乒乓球的需求增加，引起需求曲线向右移动。故选 A 项。"},{"id":6,"section":"econ","type":"single","stem":"西方经济学中的“免费搭便车”问题产生的原因是（  ）。","passage":"","options":{"A":"私人成本超过了社会收益","B":"产品是非竞争性的和排他性的","C":"产品是非排他性的","D":"市场产量高于社会最优产量"},"answer":"C","analysis":"公共物品具有非竞争性和非排他性。由于公共物品存在消费上的非排他性，理性的个人倾向于由他人付费而自己坐享其成。这就是所谓的“免费搭便车”，即公共物品的非排他性导致“免费搭便车”问题的产生。故选 C 项。"},{"id":7,"section":"econ","type":"single","stem":"人们通常所说的负利率是指（  ）。","passage":"","options":{"A":"名义利率为负","B":"名义利率低于实际利率","C":"实际利率为负","D":"存款利率低于贷款利率"},"answer":"C","analysis":"通常所说的负利率是指实际利率小于零，即名义利率小于通货膨胀率。故选 C 项。"},{"id":8,"section":"econ","type":"single","stem":"我国货币政策的最终目标是（  ）。","passage":"","options":{"A":"国际收支平衡、充分就业","B":"人民币币值稳定、国际收支平衡","C":"国际收支平衡、经济增长","D":"人民币币值稳定、经济增长"},"answer":"D","analysis":"《中华人民共和国中国人民银行法》第三条规定，我国货币政策目标是保持货币币值的稳定，并以此促进经济增长。故选 D 项。"},{"id":9,"section":"econ","type":"single","stem":"弗里德曼货币需求理论的显著特征之一是（  ）。","passage":"","options":{"A":"强调恒久性收入对货币需求的重要影响","B":"强调货币需求的动机","C":"强调人们的流动性偏好","D":"强调资产的多样性组合"},"answer":"A","analysis":"与凯恩斯不同，弗里德曼强调恒久性收入对货币需求的重要影响，并且认为恒久性收入相对稳定，货币需求函数也是相对稳定的。故选 A 项。"},{"id":10,"section":"econ","type":"single","stem":"商业银行通过实行资产证券化可以（  ），从而降低资本要求。","passage":"","options":{"A":"增加风险资产","B":"降低风险资产","C":"增加资产规模","D":"降低负债规模"},"answer":"B","analysis":"资产证券化是指以基础资产未来所产生的现金流为偿付支持，通过结构化设计进行信用增级，在此基础上发行资产支持证券的过程，它是以特定资产组合或特定现金流为支持，发行可交易证券的一种融资形式。商业银行通过资产证券化能够实现表内资产表外化，从而增强商业银行资产的流动性，获得低成本融资，减少表内风险资产，便于商业银行优化资产负债管理。故选 B 项。"},{"id":11,"section":"econ","type":"single","stem":"关于商业银行的中间业务与表外业务，以下表述错误的是（  ）。","passage":"","options":{"A":"二者都不占用或较少占用银行资金","B":"银行在其中主要充当代理人、受托人的角色","C":"银行的收入主要为服务费、手续费、管理费等","D":"二者都有较大风险"},"answer":"D","analysis":"商业银行的中间业务一般是传统无风险业务或承担较小的风险，而表外业务一般会承受一定的风险。故选 D 项。"},{"id":12,"section":"econ","type":"single","stem":"商业银行日常经营和风险管理过程中，承担风险和吸收非预期损失的资金来源于（  ）。","passage":"","options":{"A":"资本金","B":"同业拆借资金","C":"贷款损失准备","D":"在中央银行的存款"},"answer":"A","analysis":"商业银行通常采取提取损失准备金和冲减利润的方式来应对和吸收预期损失；利用资本金来应对和化解非预期损失。故选 A 项。"},{"id":13,"section":"econ","type":"single","stem":"个人客户可以使用信用卡（  ）。","passage":"","options":{"A":"购买房屋","B":"购买汽车","C":"购买理财产品","D":"开展股票投资"},"answer":"B","analysis":"我国有关法律规定的信用卡，是指由商业银行或者其他金融机构发行的具有消费支付、信用贷款、转账结算、存取现金等全部功能或者部分功能的电子支付卡。严禁在包括但不限于以下范围使用：房地产、股票、金融投资等其他消费领域。故选 B 项。"},{"id":14,"section":"econ","type":"single","stem":"根据《中华人民共和国信托法》，以下表述正确的是（  ）。","passage":"","options":{"A":"可以采取口头形式设立信托","B":"信托财产是属于受托人的财产","C":"受益人不能是受托人","D":"法律、行政法规禁止流通的财产，不得作为信托财产"},"answer":"D","analysis":"根据《中华人民共和国信托法》规定，设立信托，应当采取书面形式，书面形式包括信托合同、遗嘱或者法律、行政法规规定的其他书面文件等，A 项错误，不当选。信托财产与属于受托人所有的财产相区别，不得归入受托人的固有财产或者成为固有财产的一部分，B 项错误，不当选。受益人是在信托中享有信托受益权的人。受益人可以是自然人、法人或者依法成立的其他组织。委托人可以是受益人，也可以是同一信托的唯一受益人。受托人可以是受益人，但不得是同一信托的唯一受益人，C 项错误，不当选。法律、行政法规禁止流通的财产，不得作为信托财产，D 项正确，当选。故选 D 项。"},{"id":15,"section":"econ","type":"single","stem":"2008 年以来全球金融监管体系最大的变革之一，是（  ）成为全球金融监管体系中的核心协调机构。","passage":"","options":{"A":"巴塞尔委员会","B":"金融稳定委员会","C":"国际清算银行","D":"国际货币基金组织"},"answer":"B","analysis":"在 2008 年全球爆发金融危机的局面下，2009 年 4 月初伦敦 G20 峰会决议设立一个全球性的金融监管体系，金融稳定委员会（FSB）在此背景下应运而生，专家称其为“全球央行”。2009 年 6 月 27 日，这个根据 G20 峰会决议设立的“全球央行”正式开始运作。金融稳定委员会的具体职能包括：评估全球金融系统脆弱性，监督各国改进行动；促进各国监管机构合作和信息交换，对各国监管政策和监管标准提供建议；协调国际标准制订机构的工作；为跨国界风险管理制订应急预案等。故选 B 项。"},{"id":16,"section":"econ","type":"single","stem":"中国货币市场的基准利率是（  ）。","passage":"","options":{"A":"LIBOR","B":"NIBOR","C":"HIBOR","D":"SHIBOR"},"answer":"D","analysis":"中国货币市场的基准利率是上海银行间同业拆放利率 SHIBOR。故选 D 项。"},{"id":17,"section":"econ","type":"single","stem":"下列会对我国国际收支平衡表中的经常账户有影响的情况是（  ）。","passage":"","options":{"A":"中国人寿保险公司购买谷歌公司的股票","B":"中国工商银行向德国某公司发放贷款","C":"中国人民保险公司收到英国某客户的保险费","D":"中国人民银行购买美国国债"},"answer":"C","analysis":"经常项目主要反映一国与他国之间实际资源的转移，是国际收支中最重要的项目。经常项目包括货物（贸易）、服务（无形贸易）、收益和单方面转移（经常转移）四个项目。资本与金融项目反映的是国际资本流动，包括长期或短期的资本流出和资本流入，是国际收支平衡表的第二大类项目。资本项目包括资本转移和非生产、非金融资产的收买或出售，前者主要是投资捐赠和债务注销，后者主要是土地和无形资产（专利、版权、商标等）的收买或出售。金融账户包括直接投资、证券投资（间接投资）和其他投资（包括国际信贷、预付款等）。ABD 项均属于资本与金融项目，C 项属于经常项目中的服务项目。故选 C 项。"},{"id":18,"section":"econ","type":"single","stem":"保险经纪人是基于（  ）的利益提供中介服务的机构。","passage":"","options":{"A":"保险人","B":"投保人","C":"被保险人","D":"受益人"},"answer":"B","analysis":"根据《中华人民共和国保险法》规定，保险经纪人（包括保险经纪公司及其分支机构）是基于投保人的利益，为投保人与保险人订立保险合同提供中介服务，并依法收取佣金的机构。保险代理人是指根据保险人的委托授权，代理其经营保险业务，并收取代理费用的人，保险代理人在保险人授权的范围内以保险人的名义进行业务活动。本题要注意保险经纪人与保险代理人的区分。故选 B 项。"},{"id":19,"section":"econ","type":"single","stem":"衡量保险公司偿付能力状况的关键指标是偿付能力充足率，它等于（  ）。","passage":"","options":{"A":"实际资本 / 最低资本","B":"认可资产 / 认可负债","C":"认可资产 / 最低资本","D":"实际资本 / 认可资产"},"answer":"A","analysis":"偿付能力是保险公司偿还债务的能力。保险公司应当具有与其风险和业务规模相适应的资本，确保偿付能力充足率不低于 100%。综合偿付能力充足率 = 保险公司的实际资本 / 最低资本。故选 A 项。"},{"id":20,"section":"econ","type":"single","stem":"保险损失补偿原则不适用于（  ）。","passage":"","options":{"A":"建筑工程保险","B":"货物运输保险","C":"农业保险","D":"人身保险"},"answer":"D","analysis":"“损失补偿原则”是适用于财产保险的一项重要原则，即当保险事故发生并使被保险人遭受损失时，保险人必须在其承担的保险金给付义务范围内履行合同义务，对被保险人所受实际损失进行补偿。保险人履行给付义务旨在弥补被保险人因承保危险发生所失去的利益，被保险人不能因保险给付义务的履行而获得额外利益。但是对于人身保险，《中华人民共和国保险法》第四十六条规定：“被保险人因第三者的行为而发生死亡、伤残或者疾病等保险事故的，保险人向被保险人或者受益人给付保险金后，不享有向第三者追偿的权利，但被保险人或者受益人仍有权向第三者请求赔偿。”该条款明确限制保险人行使代位追偿权，同时赋予被保险人或者受益人另外向实施致害行为的第三者主张侵权赔偿的权利。而且，保险法对人身保险并无重复投保的限制。因此，“损失补偿原则”不适用于人身保险。故选 D 项。"},{"id":21,"section":"cs","type":"single","stem":"二进制数 00111110 转换成十进制数为（  ）。","passage":"","options":{"A":"60","B":"61","C":"62","D":"63"},"answer":"C","analysis":"二进制转换为十进制，按“位权展开相加法”运算，0*27+0*26+1*25+1*24+1*+1*22+1*21+0*20=62。故选 C 项。"},{"id":22,"section":"cs","type":"single","stem":"信息系统总体规划中需要进行应用架构规划，（  ）不属于应用架构规划应考虑的内容。","passage":"","options":{"A":"应用建模","B":"应用现状","C":"应用要素","D":"应用体系设计"},"answer":"A","analysis":"应用架构是以业务架构为依据，对应用体系的结构和相互关系进行说明。应用架构包括应用现状、应用要素和应用体系设计的描述，为创建一体化的信息系统奠定基础。应用架构需充分考虑如下方面：（1）应用现状：应对现有应用系统情况进行描述。（2）应用要素：应包括对服务域、服务类、服务组件的说明。（3）应用体系设计：应按照信息化建设要求，规划设计主要业务和相关领域的应用系统。故选 A 项。"},{"id":23,"section":"cs","type":"single","stem":"I/O 指令实现的数据传送通常发生在（  ）。","passage":"","options":{"A":"I/O 设备和 I/O 端口之间","B":"通用寄存器和 I/O 设备之间","C":"I/O 端口和 IO 端口之间","D":"通用寄存器和 I/O 端口之间"},"answer":"D","analysis":"I/O 端口又称 I/O 接口，是 CPU 与设备之间的交接面。由于主机和 I/O 设备的工作方式和工作速度有很大差异，I/O 端口就应运而生。在执行一条指令时，CPU 使用地址总线选择所请求的 I/O 端口，使用数据总线在 CPU 寄存器和端口之间传输数据。故选D 项。"},{"id":24,"section":"cs","type":"single","stem":"下列关于队列的叙述中正确的是（  ）。","passage":"","options":{"A":"在队列中只能插入数据","B":"在队列中只能删除数据","C":"队列是先进先出的线性表","D":"队列是先进后出的线性表"},"answer":"C","analysis":"队列是先进先出的线性表，在队列中可以插入数据，也可以删除数据，在队尾插入，队首删除。故选 C 项。"},{"id":25,"section":"cs","type":"single","stem":"在系统内存中设置磁盘缓冲区的主要目的是（  ）。","passage":"","options":{"A":"减少平均寻道时间","B":"减少磁盘 I/O 次数","C":"提高磁盘数据可靠性","D":"实现设备无关性"},"answer":"B","analysis":"在系统内存中设置磁盘缓冲区的主要目的是减少磁盘 I/O 次数。磁盘缓冲区是硬盘与外部总线交换数据的场所，它对性能的影响大大超过磁盘缓存对性能的影响。故选 B 项。"},{"id":26,"section":"cs","type":"single","stem":"MVC（Model-View-Controller，模型 -视图 -控制器）是一种广泛流行的软件设计模式，也是 J2EE 平台上推荐的一种设计模型，其中，（  ）主要表现用户界面。","passage":"","options":{"A":"视图","B":"模型","C":"控制器","D":"视图和控制器"},"answer":"A","analysis":"MVC 模式代表 Model-View-Controller（模型 - 视图 - 控制器）模式。这种模式用于应用程序的分层开发。Model（模型）代表一个存取数据的对象或 JAVA POJO。它也可以带有逻辑，在数据变化时更新控制器。View（视图）代表模型包含的数据的可视化，主要表现用户界面。Controller（控制器）作用于模型和视图上，它控制数据流向模型对象，并在数据变化时更新视图。它使视图与模型分离开。故选 A 项。"},{"id":27,"section":"cs","type":"single","stem":"面向消息中间件通过高效可靠的（  ），在分布式环境下扩展进程间的通信，可支撑多种通信协议、语言、应用程序、硬件和软件平台。","passage":"","options":{"A":"消息扩展机制","B":"消息共享机制","C":"消息传递机制","D":"消息处理机制"},"answer":"C","analysis":"面向消息中间件（Message-Oriented Middleware, MOM）：利用高效可靠的消息传递机制进行平台无关的数据传递，并可基于数据通信进行分布系统的集成。通过提供消息传递和消息队列模型，可在分布环境下扩展进程间的通信，并支持多种通信协议、语言、应用程序、硬件和软件平台。故选 C 项。"},{"id":28,"section":"cs","type":"single","stem":"对数据库管理系统评价的主要性能指标有数据所允许的索引数量和最大并发事务处理能力、（  ）等。","passage":"","options":{"A":"MIPS","B":"最大连接数","C":"支持协议和标准","D":"时延抖动"},"answer":"B","analysis":"对数据库管理系统评价的主要性能指标有数据所允许的索引数量、最大并发事务处理能力、最大连接数等。故选 B 项。"},{"id":29,"section":"cs","type":"single","stem":"李某在书店租到一张带有注册商标的应用软件光盘，擅自复制后在网络进行传播，其行为是侵犯（  ）的行为。","passage":"","options":{"A":"商标权","B":"注册商标专用权","C":"软件著作权","D":"署名权"},"answer":"C","analysis":"计算机软件著作权：是指自然人、法人或者其他组织对计算机软件作品享有的财产权利和精神权利的总称。根据我国《计算机软件保护条例》的规定，软件著作权人享有下列各项权利：（1）发表权，即决定软件是否公之于众的权利；（2）署名权，即表明开发者身份，在软件上署名的权利；（3）修改权，即对软件进行增补、删节，或者改变指令、语句顺序的权利；（4）复制权，即将软件制作一份或者多份的权利；（5）发行权，即以出售或者赠与方式向公众提供软件的原件或者复制件的权利；（6）出租权，即有偿许可他人临时使用软件的权利，但是软件不是出租的主要标的的除外；（7）信息网络传播权，即以有线或者无线方式向公众提供软件，使公众可以在其个人选定的时间和地点获得软件的权利；（8）翻译权，即将原软件从一种自然语言文字转换成另一种自然语言文字的权利；（9）应当由软件著作权人享有的其他权利。本题中李某侵犯了该软件著作权人的信息网络传播权。故选 C 项。"},{"id":30,"section":"cs","type":"single","stem":"下列选项中不属于虚拟化主要特征的是（  ）。","passage":"","options":{"A":"高扩展性","B":"高可用性","C":"高安全性","D":"实现技术简单"},"answer":"D","analysis":"虚拟化是指通过虚拟化技术将一台计算机虚拟成多台逻辑计算机，主要特征包括封装、独立、隔离、分区、高扩展性、高可用性、高安全性等。故选 D 项。"},{"id":31,"section":"cs","type":"single","stem":"将高级语言源程序翻译成目标程序的是（  ）。","passage":"","options":{"A":"解释程序","B":"编译程序","C":"链接程序","D":"汇编程序"},"answer":"B","analysis":"将高级语言程序翻译成目标程序的是编译程序。故选 B 项。"},{"id":32,"section":"cs","type":"single","stem":"某公司承接一个互联网企业的开发项目，由于互联网业务变化较快，无法在项目初期准确确定出项目需求，作为项目经理应首先考虑的开发模型是（  ）。","passage":"","options":{"A":"瀑布模型","B":"V 模型","C":"螺旋模型","D":"原型化模型"},"answer":"D","analysis":"瀑布模型简单易用，开发进程比较严格，要求在项目开发前，项目需求已经被很好地理解，也很明确，项目实施过程中发生需求变更的可能性小。V 模型在瀑布模型的基础上，强调测试过程与开发过程的对应性和并行性，同样要求需求明确，而且很少有需求变更的情况发生。螺旋模型表现为瀑布模型的多次迭代，主要是针对风险比较大的项目而设计的一种软件开发过程模型，主要适用于规模很大的项目，或者采用了新技术以及不确定因素和风险限制了项目进度的项目。原型模型是在需求阶段快速构建一部分系统的生存期模型，主要是在项目前期需求不明确，或者需要减少项目不确定性的时候采用。原型化可以尽快地推出一个可执行的程序版本，有利于尽早占领市场。综上所述，该企业应该采用原型化模型。故选 D 项。"},{"id":33,"section":"cs","type":"single","stem":"下列任务中，不属于软件工程需求分析阶段的是（  ）。","passage":"","options":{"A":"分析软件系统的数据要求","B":"确定软件系统的功能需求","C":"确定软件系统的性能要求","D":"确定软件系统的运行平台"},"answer":"D","analysis":"软件工程需求分析阶段主要确定软件系统的功能需求、性能要求、界面和分析软件系统的数据要求。故选 D 项。"},{"id":34,"section":"cs","type":"single","stem":"内容耦合是指（  ）。","passage":"","options":{"A":"两个模块之间传递的是数据结构","B":"一个模块调用另一个模块时，传递的是控制变量","C":"通过一个公共数据环境相互作用的那些模块间的耦合","D":"一个模块直接使用另一个模块的内部数据，或通过非正常入口而转入另一个模块内部"},"answer":"D","analysis":"内容耦合是指如果一个模块与另一个模块的内部属性有关，不经调用直接使用另一个模块的程序代码或内部数据，那么这两个模块之间就存在内容耦合，也就是一个模块直接使用另一模块内部的数据，或通过非正常入口转入另一模块的内部。故选 D 项。"},{"id":35,"section":"cs","type":"single","stem":"Java 语言是（  ）。","passage":"","options":{"A":"面向问题的解释型高级编程语言","B":"面向机器的低级编程语言","C":"面向过程的编译型高级编程语言","D":"面向对象的解释型高级编程语言"},"answer":"D","analysis":"编程语言大致分为面向机器，面向过程和面向对象 3 种结构，Java 语言是面向对象的解释型高级编程语言。故选 D 项。"},{"id":36,"section":"cs","type":"single","stem":"一个 C 程序的执行是（  ）。","passage":"","options":{"A":"本程序的 main 函数开始，到 main 函数结束","B":"本程序文件的第一个函数开始，到本程序文件的最后一个函数结束","C":"本程序的 main 函数开始，到本程序文件的最后一个函数结束","D":"本程序文件的第一个函数开始，到本程序 main 函数结束"},"answer":"A","analysis":"一个 C 程序的执行是本程序的 main 函数开始，到 main 函数结束，中间会调用用户自定义函数。故选 A 项。"},{"id":37,"section":"cs","type":"single","stem":"关于软件测试，以下说法错误的是（  ）。","passage":"","options":{"A":"测试能提高软件的质量，但是提高质量不能依赖测试","B":"测试只能证明缺陷存在，不能证明缺陷不存在","C":"开发人员测试自己的程序后，可作为该程序已经通过测试的依据","D":"80% 的缺陷聚集在 20% 的模块中，经常出错的模块改错后还会经常出错"},"answer":"C","analysis":"软件测试是提高软件质量的一种重要手段，测试能提高软件的质量，但是提高质量不能依赖测试；软件测试的目的是发现错误和缺陷，只能证明缺陷存在，不能证明缺陷不存在；80% 的缺陷聚集在 20% 的模块中，经常出错的模块改错后还会经常出错；通常情况下，不让开发人员测试自己的程序，即使测试了也不能作为该程序已经通过测试的依据。故选 C 项。"},{"id":38,"section":"cs","type":"single","stem":"对软件是否能达到用户所期望的要求的测试称为（  ）。","passage":"","options":{"A":"集成测试","B":"有效性测试","C":"系统测试","D":"验收测试"},"answer":"D","analysis":"验收测试是部署软件之前的最后一个测试操作。在软件产品完成了单元测试、集成测试和系统测试之后，产品发布之前所进行的软件测试活动。它是技术测试的最后一个阶段，也称为交付测试。验收测试的目的是判断软件是否能达到用户所期望的要求，确保软件准备就绪，并且可以让最终用户将其用于执行软件的既定功能和任务。故选 D 项。"},{"id":39,"section":"cs","type":"single","stem":"面向对象技术中，对象是类的实例，对象有三种成分：（  ）、属性和方法。","passage":"","options":{"A":"标识","B":"规则","C":"封装","D":"消息"},"answer":"A","analysis":"对象有三种成分：标识、属性和方法（或操作）。每个对象都有自己的标识，表示该对象的状态。对象中的属性只能够通过该对象所提供的操作来存取或修改。操作也称为方法或服务，它规定了对象的行为，表示对象所提供的服务。故选 A 项。"},{"id":40,"section":"cs","type":"single","stem":"某政府部门计划采购一批服务，但是采用公开招标方式的费用占该采购项目总价值的比例过大，该部门可依法采用（  ）方式采购。","passage":"","options":{"A":"邀请招标","B":"单一来源","C":"竞争性谈判","D":"询价"},"answer":"A","analysis":"根据《政府采购法》的规定，对于采用公开招标方式的费用占政府采购项目总价值的比例过大的货物或服务，其适用的政府采购方式是邀请招标方式。邀请招标也称选择性招标，是由采购人根据供应商或承包商的资信和业绩，选择一定数目的法人或其他组织（不能少于 3 家），向其发出投标邀请书，邀请他们参加投标竞争，从中选定中标供应商的一种采购方式。故选 A 项。"},{"id":41,"section":"cs","type":"single","stem":"某手机应用系统上线后，收到老年用户多起投诉：界面繁琐，字体太小，使用不方便。这反映项目组在（  ）工作中存在不足。","passage":"","options":{"A":"变更控制","B":"识别干系人","C":"质量控制","D":"团队建设"},"answer":"B","analysis":"本题属于项目组在需求分析中，没有准确识别干系人。故选 B 项。"},{"id":42,"section":"cs","type":"single","stem":"CMM 模型将软件过程的成熟度划分为 5 级，其中在（  ）使用定量分析来不断改进和管理软件过程。","passage":"","options":{"A":"优化级","B":"管理级","C":"定义级","D":"可重复级"},"answer":"A","analysis":"CMM/CMMI 将软件过程的成熟度分为 5 个等级，以下是 5 个等级的基本特征。（1）初始级：软件过程是无序的，有时甚至是混乱的，对过程几乎没有定义，成功取决于个人努力。管理是反应式的。（2）已管理级：建立了基本的项目管理过程来跟踪费用、进度和功能特性。制定了必要的过程纪律，能重复早先类似应用项目取得的成功经验。（3）已定义级：已将软件管理和工程两方面的过程文档化、标准化，并综合成该组织的标准软件过程。所有项目均使用经批准、剪裁的标准软件过程来开发和维护软件，软件产品的生产在整个软件过程是可见的。目前，公司需要申请的就是已定义级别，通常称为 CMMI3。（4）量化管理级：分析对软件过程和产品质量的详细度量数据，对软件过程和产品都有定量的理解与控制。管理有一个作出结论的客观依据，管理能够在定量的范围内预测性能。（5）优化管理级：可集中精力改进过程，采用新技术、新方法。拥有防止出现缺陷、识别薄弱环节以及加以改进的手段。可取得过程有效性的统计数据，并可据此进行分析，从而得出最佳方法。每个等级都被分解为过程域，特殊目标和特殊实践，通用目标、通用实践和共同特性。CMM 模型将软件过程的成熟度划分为 5 级，其中在优化级使用定量分析来不断改进和管理软件过程。故选 A 项。"},{"id":43,"section":"cs","type":"single","stem":"某单位新进一批 500 台不同型号的 PC 机，均由同一设备生产厂家提供，按照质量管理相关规定，以下质量检验方法中正确的是（  ）。","passage":"","options":{"A":"对本批次设备进行随机抽检","B":"对该批次产品每台进行检验","C":"由于是常规产品，抽检 5 台","D":"针对不同型号进行抽检"},"answer":"D","analysis":"按题意，由于 500 台不同型号的 PC 机，均由同一设备生产厂家提供，可以针对不同型号进行抽检。故选 D 项。"},{"id":44,"section":"cs","type":"single","stem":"某银行软件开发部参与开发管理系统软件的程序员王某，辞职到另一银行任职，于是该项目负责人将该管理系统软件开发者的署名更改为李某（接王某工作）。该项目负责人的行为（  ）。","passage":"","options":{"A":"侵犯了王某开发者身份权（署名权）","B":"不构成侵权，因为程序员王某不是软件著作权人","C":"只是行使管理者的权利，不构成侵权","D":"不构成侵权，因为程序员王某已不是项目组成员"},"answer":"A","analysis":"《计算机软件保护条例》第八条明确，软件著作权人享有署名权（即表明开发者身份的权利），但在职务软件中，软件著作权归单位所有，而实际开发者作为作者仍享有署名权。王某作为银行员工，在任职期间参与开发管理系统软件，该软件属于职务作品。软件著作权（如复制权、发行权等）归银行所有，但王某作为实际开发者之一，依法享有署名权（开发者身份权），即有权要求在软件上被署名为开发者。项目负责人将软件开发者署名从王某更改为李某，移除了王某的署名，这侵犯了王某的署名权。故选 A 项。"},{"id":45,"section":"cs","type":"single","stem":"项目整体评估是把项目看成一个整体，权衡各种要素之间关系的评估，整体性体现在对（  ）等方面的集成。","passage":"","options":{"A":"经济、技术运行、环境、风险","B":"沟通、计划、变更","C":"资源、管理、人员","D":"文档、说明、软件、硬件"},"answer":"A","analysis":"项目整体评估是把项目看成一个整体，权衡各种要素之间关系的评估，整体性体现在对经济、技术运行、环境、风险等方面的集成。故选 A 项。"},{"id":46,"section":"cs","type":"single","stem":"在数据库系统的体系结构中，对一个表创建视图，构建的是数据库的（  ）。","passage":"","options":{"A":"内模式和外模式 / 内模式映像","B":"模式和模式 / 内模式映像","C":"模式和模式 / 外模式映像","D":"外模式和外模式 / 模式映像"},"answer":"D","analysis":"在数据库系统的体系结构中，三级模式中视图对应外模式，表对应模式，存储文件对应内模式。对一个表创建视图，构建的是数据库的外模式和外模式 / 模式映像。故选 D 项。"},{"id":47,"section":"cs","type":"single","stem":"在 DBS 中，数据独立性是指（  ）。","passage":"","options":{"A":"数据之间相互独立","B":"应用程序与 DB 的结构之间相互独立","C":"数据的逻辑结构与物理结构相互独立","D":"数据与磁盘之间相互独立"},"answer":"B","analysis":"数据独立性是指应用程序和数据结构之间相互独立，互不影响。故选 B 项。"},{"id":48,"section":"cs","type":"single","stem":"下列关于关系模型的参照完整性规则的叙述中，错误的是（  ）。","passage":"","options":{"A":"外键和相应的主键需定义在相同值域上","B":"外键和相应的主键可以不同名","C":"参照关系模式和被参照关系模式可以是同一个关系模式","D":"外键值不可以为空值"},"answer":"D","analysis":"外键值可以为空，其它选项说法正确。故选 D 项。"},{"id":49,"section":"cs","type":"single","stem":"关于 Left join、Inner join、Right join 以下描述错误的是（  ）。","passage":"","options":{"A":"Left join 返回左表中所有记录和右表中联结字段相等的记录","B":"Right join 返回包括右表中的所有记录和左表中联结字段相等的记录","C":"Inner join 只返回两个表中联结字段相等的记录","D":"三个关联查询中 Left join 查询的记录最少"},"answer":"D","analysis":"Left join 返回左表中所有记录和右表中连接字段相等的记录；Right join 返回包括右表中的所有记录和左表中连接字段相等的记录；Inner join 只返回两个表中连接字段相等的记录；三个关联查询中 Inner join 查询的记录最少。故选 D 项。"},{"id":50,"section":"cs","type":"single","stem":"如果有 10 个不同的实体集，它们之间存在着 12 个不同的二元联系（两个实体集之间的联系），其中 3 个 1：1 联系、4 个 1：N 联系、5 个 M:N 联系，那么根据 E-R 模型转换成关系模型的规则，这个 E-R 结构转换成的关系模式集中，主键和外键的总数分别为（  ）。","passage":"","options":{"A":"14、12","B":"15、15","C":"15、17","D":"19、19"},"answer":"C","analysis":"本题考查数据库设计相关知识主键个数即关系模式个数，本题中有 10 个实体、5 个 M:N 的关系，转换后应有 15 个关系模式，则有 15 个主键。外键是有联系产生的，1:1、1:N 联系均有一个外键，M:N 有两个外键，则外键 =3+4+5*2=17。故选 C 项。"},{"id":51,"section":"cs","type":"single","stem":"设计数据库时，以下不能优化查询效率的措施是（  ）。","passage":"","options":{"A":"将数据、日志、索引放在同一 I/O 设备上，增加读取速度","B":"分割数据表，减少表的尺寸","C":"数据存储时适当进行数据冗余，减少数据表间的连接操作","D":"在 IN 后面值的列表中，将出现频繁的值放在最前面"},"answer":"A","analysis":"数据库优化查询效率的措施包括：对查询语句的优化，分表分库，适当的数据冗余，以减少数据库表之间的链接操作，提高查询速度。数据和日志通常放在不同 I/O设备上。故选 A 项。"},{"id":52,"section":"cs","type":"single","stem":"在数据库技术中，“脏数据”是指（  ）。","passage":"","options":{"A":"修改后又被后一事务覆盖的数据","B":"两次读取之间被另一事务修改的数据","C":"回退的数据","D":"未提交随后又被撤销的数据"},"answer":"D","analysis":"当一个事务正在访问数据，并且对数据进行了修改，而这种修改还没有提交到数据库中，这时，另外一个事务也访问这个数据，然后使用了这个数据。因为这个数据是还没有提交的数据，那么另外一个事务读到的这个数据是脏数据。故选 D 项。"},{"id":53,"section":"cs","type":"single","stem":"下列关于数据库锁的说法错误的是（  ）。","passage":"","options":{"A":"锁是一种特殊的二元信号量","B":"为了避免活锁现象的发生，DBMS 采用资源分配图的方法来处理事务的数据操作请求","C":"对于每个需要撤销的死锁事务，可以简单地放弃该事务已经完成的全部操作，重新启动该事务","D":"在顺序加锁中，维护数据项的加锁顺序很困难，代价也非常大"},"answer":"B","analysis":"为了避免活锁现象的发生，DBMS 一般采用先来先服务的策略来处理事务的数据操作请求。故选 B 项。"},{"id":54,"section":"cs","type":"single","stem":"在面向对象数据库（OODB）中，包含其他对象的对象，称为（  ）。","passage":"","options":{"A":"复合对象","B":"持久对象","C":"超对象","D":"嵌套对象"},"answer":"A","analysis":"在面向对象数据库中，包含其他对象的对象，称为复合对象。故选 A 项。"},{"id":55,"section":"cs","type":"single","stem":"联机分析处理（OLAP）与联机事务处理（OLTP）的区别是（  ）。","passage":"","options":{"A":"OLAP 针对数据库，OLTP 针对数据仓库","B":"OLAP 要求响应时间合理，OLTP 要求响应时间快","C":"OLAP 主要用于更新事务，OLTP 用于分析数据","D":"OLAP 面向操作人员，OLTP 面向决策人员"},"answer":"B","analysis":"本题考查对数据挖掘相关概念的掌握。联机分析处理（OLAP）用于数据挖掘，从数据仓库中分析数据，为决策提供依据，要求响应时间合理；联机事务处理（OLTP）用于更新事务，将数据写入数据库，面向操作人员，要求响应时间合理。故选 B 项。"},{"id":56,"section":"cs","type":"single","stem":"以下 IP 地址中属于私网地址的是（  ）。","passage":"","options":{"A":"172.15.22.1","B":"128.168.22.1","C":"172.16.22.1","D":"192.158.22.1"},"answer":"C","analysis":"A 类 地 址 中 私 网 地 址 是 10.*.*.*;B 类 地 址 中 私 网 地 址 是 172.16.0.0~172.31.255.255;C 类地址中私网地址是 192.168.*.*；故选 C 项。"},{"id":57,"section":"cs","type":"single","stem":"一个 16 个端口的以太网交换机，冲突域和广播域的个数分别是（  ）。","passage":"","options":{"A":"1、1","B":"16、16","C":"1、16","D":"16、1"},"answer":"D","analysis":"交换机每个接口是一个冲突域，所有接口是一个广播域。故选 D 项。"},{"id":58,"section":"cs","type":"single","stem":"在常用的传输介质中，带宽最大、信号传输衰减最小，抗扰能力最强的传输质（  ）。","passage":"","options":{"A":"双绞线","B":"同轴电缆","C":"光纤","D":"无线信道"},"answer":"C","analysis":"在常用的传输介质中，带宽最大、信号传输衰减最小，抗扰能力最强的传输质是光纤。故选 C 项。"},{"id":59,"section":"cs","type":"single","stem":"邮件客户端软件使用（  ）协议从电子部件服务器上获取电子邮件。","passage":"","options":{"A":"SMTP","B":"POP3","C":"TCP","D":"UDP"},"answer":"B","analysis":"SMTP 即简单邮件传输协议。它是一组用于从源地址到目的地址传输邮件的规范，通过它来控制邮件的中转方式。SMTP 协议属于 TCP/IP 协议簇，它帮助每台计算机在发送或中转信件时找到下一个目的地。SMTP 服务器就是遵循 SMTP 协议的发送邮件服务器。POP3 即邮局协议的第 3 个版本，它规定怎样将个人计算机连接到 Internet 的邮件服务器和下载电子邮件的电子协议。它是因特网电子邮件的第一个离线协议标准，POP3 允许用户从服务器上把邮件存储到本地主机（即自己的计算机）上，同时删除保存在邮件服务器上的邮件，而 POP3 服务器则是遵循 POP3 协议的接收邮件服务器，用来接收电子邮件的。故选 B 项。"},{"id":60,"section":"cs","type":"single","stem":"当我们需要检测某远程服务器上的某项服务其端口是否正常打开时，可以使用（  ）命令来借助判定。","passage":"","options":{"A":"ping","B":"telnet","C":"traceroute","D":"netstat"},"answer":"B","analysis":"测试某个端口是否开启，在 cmd 下输入 telnet 之后会出现一个窗口，按照提示输入 help 可以查看选项。故选 B 项。"},{"id":61,"section":"cs","type":"single","stem":"TCP/IP 模型的网络层提供的是（  ）。","passage":"","options":{"A":"无连接不可靠的数据报服务","B":"无连接可靠的数据报服务","C":"有连接不可靠的虚电路服务","D":"有连接可靠的虚电路服务"},"answer":"A","analysis":"TCP/IP 模型的网络层提供的是无连接不可靠的数据报服务。故选 A 项。注：网络层提供的两种服务：面向连接的虚电路服务、无连接的数据报服务。数据包在传输过程中可能会出现误码，也有可能由于路由器繁忙而被路由器丢弃，还有可能出现按序发送的数据包不能按序到达接收方。如果网络层对于上述传输错误不采取任何措施，则提供的是不可靠传输服务；如果网络层对于上述传输错误采取措施并使得接收方能正确接收发送方所发送的数据包，则提供的是可靠传输服务。不同网络体系结构所提供的服务可能是不同的，例如因特网使用的 TCP/IP 协议体系的网际层提供的是无连接的不可靠的数据报服务，而 ATM、帧中继和 X.25 的网络层提供的都是面向连接的、可靠的虚电路服务。"},{"id":62,"section":"cs","type":"single","stem":"物理层的主要功能是透明地完成相邻节点之间原始（  ）的传输。","passage":"","options":{"A":"数据包","B":"帧","C":"报文","D":"比特流"},"answer":"D","analysis":"物理层的主要功能是透明的完成相邻节点之间原始比特流的传输。故选 D 项。"},{"id":63,"section":"cs","type":"single","stem":"SMTP 使用的端口号是（  ）。","passage":"","options":{"A":"21","B":"23","C":"25","D":"110"},"answer":"C","analysis":"SMTP 使用的端口号是 25，POP3 使用的端口号是 110，FTP 使用的端口号是21。故选 C 项。"},{"id":64,"section":"cs","type":"single","stem":"下列隧道协议中工作在网络层的是（  ）。","passage":"","options":{"A":"SSL","B":"L2TP","C":"IPSec","D":"PPTP"},"answer":"C","analysis":"隧道协议中工作在网络层的是 IPSeC。故选 C 项。"},{"id":65,"section":"cs","type":"single","stem":"不属于物联网技术三层架构的是（  ）。","passage":"","options":{"A":"网络层","B":"传输层","C":"感知层","D":"应用层"},"answer":"B","analysis":"物联网从架构上面可以分为感知层、网络层和应用层。（1）感知层：负责信息采集和物物之间的信息传输，信息采集的技术包括传感器、条码和二维码、RFID 射频技术、音视频等多媒体信息，信息传输包括远近距离数据传输技术、自组织组网技术、协同信息处理技术、信息采集中间件技术等传感器网络。感知层是实现物联网全面感知的核心能力，是物联网中包括关键技术、标准化方面、产业化方面亟待突破的部分，关键在于具备更精确、更全面的感知能力，并解决低功耗、小型化和低成本的问题。（2）网络层：是利用无线和有线网络对采集的数据进行编码、认证和传输，广泛覆盖的移动通信网络是实现物联网的基础设施，是物联网三层中标准化程度昀高、产业化能力昀强、昀成熟的部分，关键在于为物联网应用特征进行优化和改进，形成协同感知的网络。（3）应用层：提供丰富的基于物联网的应用，是物联网发展的根本目标，将物联网技术与行业信息化需求相结合，实现广泛智能化应用的解决方案集，关键在于行业融合、信息资源的开发利用、低成本高质量的解决方案、信息安全的保障以及有效的商业模式的开发。故选 B 项。"},{"id":66,"section":"cs","type":"single","stem":"用户 B 收到经 A 数字签名后的消息 M，为验证消息的真实性，首先需要从 CA 获取用户 A 的数字证书，该数字证书中包含（  ），可以利用（  ）验证该证书的真伪然后利用（  ）验证 M 的真实性。","passage":"","options":{"A":"A 的公钥 CA 的公钥 A 的公钥","B":"B 的公钥 A 的公钥 B 的私钥","C":"B 的私钥 A 的公钥 CA 的公钥","D":"CA 的公钥 B 的私钥 A 的公钥"},"answer":"A","analysis":"按照“谁发出，谁负责”的原则，利用 CA 的公钥验证该证书的真伪，利用A 的公钥验证 M 的真实性。故选 A 项。"},{"id":67,"section":"cs","type":"single","stem":"网络安全技术可以分为主动防御技术和被动防御技术两大类，以下属于主动防御技术的是（  ）。","passage":"","options":{"A":"蜜罐技术","B":"入侵检测技术","C":"防火墙技术","D":"恶意代码扫描技术"},"answer":"A","analysis":"蜜罐（Honeypot）技术是一种主动防御技术，是入侵检测技术的一个重要发展方向。蜜罐是一种在互联网上运行的计算机系统，是专门为吸引并诱骗那些试图非法闯入他人计算机系统的人而设计的。蜜罐系统是一个包含漏洞的诱骗系统，它通过模拟一个或多个易受攻击的主机和服务，给攻击者提供一个容易攻击的目标。故选 A 项。"},{"id":68,"section":"cs","type":"single","stem":"互联网上通信双方不仅需要知道对方的地址，也需要知道通信程序的端口号。以下关于端口的描述中，不正确的是（  ）。","passage":"","options":{"A":"端口可以泄露网络信息","B":"端口不能复用","C":"端口是表示服务的地址","D":"端口是网络套接字的重要组成部分"},"answer":"B","analysis":"套接字一般用（IP 地址：端口号）表示；端口是表示服务的地址，是可以复用的；端口可以泄露网络信息。故选 B 项。"},{"id":69,"section":"cs","type":"single","stem":"下面哪种应用层协议像 Telnet 那样建立会话，但会话是安全的（  ）。","passage":"","options":{"A":"FTP","B":"SSH","C":"SSL","D":"DHCP"},"answer":"B","analysis":"SSH为 Secure Shell的缩写，由 IETF的网络小组（Network Working Group）所制定；SSH 为建立在应用层基础上的安全协议。SSH 是较可靠，专为远程登录会话和其他网络服务提供安全性的协议。利用 SSH 协议可以有效防止远程管理过程中的信息泄露问题。故选B 项。"},{"id":70,"section":"cs","type":"single","stem":"ARP 攻击造成网络无法跨网段通信的原因是（  ）。","passage":"","options":{"A":"发送大量 ARP 报文造成网络堵塞","B":"伪造网关 ARP 报文使得数据包无法发送到网关","C":"ARP 攻击破坏了网络的物理连通性","D":"ARP 攻击破坏了网关设备"},"answer":"B","analysis":"ARP 攻击造成网络无法跨网段通信的原因是伪造网关 ARP 报文使得数据包无法发送到网关。故选 B 项。"},{"id":71,"section":"cs","type":"single","stem":"文件类型病毒不能感染的文件类型是（  ）。","passage":"","options":{"A":"COM 类型","B":"SYS 类型","C":"HTML 类型","D":"EME 类型"},"answer":"C","analysis":"文件型病毒系计算机病毒的一种，主要通过感染计算机中的可执行文件（.exe）和命令文件（.com）。文件型病毒是对计算机的源文件进行修改，使其成为新的带毒文件。一旦计算机运行该文件就会被感染，从而达到传播的目的。当然还有感染所有视窗操作系统可执行文件的病毒，可感染的文件类型包括后缀名是 EXE、DLL或者 VXD、SYS。故选 C项。"},{"id":72,"section":"cs","type":"single","stem":"常见的恶意代码类型有特洛伊木马，蠕虫，病毒、后门、Rootkit、僵尸程序、广告软件，2017 年 5 月爆发的恶意代码 WannaCry 勒索软件属于（  ）。","passage":"","options":{"A":"特洛伊木马","B":"蠕虫","C":"后门","D":"Rootkit"},"answer":"B","analysis":"WannaCry（想哭，又叫 Wanna Decryptor），一种“蠕虫式”的勒索病毒软件，该恶意软件会扫描电脑上的 TCP 445 端口（Server Message Block/SMB），以类似于蠕虫病毒的方式传播，攻击主机并加密主机上存储的文件，然后要求以比特币的形式支付赎金。勒索金额为 300 至 600 美元。故选 B 项。"},{"id":73,"section":"cs","type":"single","stem":"注入语句，http://xxx.xxx.xxx/abc.asp?p=YY and user>0 不仅可以判断服务器的后台数据库是否为 SQL Server，还可以得到（  ）。","passage":"","options":{"A":"当前连接数据库的用户数量","B":"当前连接数据库的用户名","C":"当前连接数据库的用户口令","D":"当前连接数据库的数据库名"},"answer":"B","analysis":"注入语句，http://xxx.xxx.xxx/abc.asp?p= YY and user>0 不仅可以判断服务器的后台数据库是否为 SQL Server，还可以得到当前连接数据库的用户名。故选 B 项。"},{"id":74,"section":"cs","type":"single","stem":"SQL 注入不能做到（  ）","passage":"","options":{"A":"读取敏感信息","B":"写入文件","C":"弹出 XSS 窗","D":"命令执行"},"answer":"C","analysis":"SQL 注入是将 Web 页面的原 URL、表单域或数据包输入的参数，修改拼接成SQL 语句，传递给 Web 服务器，进而传给数据库服务器以执行数据库命令。如 Web 应用程序的开发人员对用户所输入的数据或 cookie 等内容不进行过滤或验证（即存在注入点）就直接传输给数据库，就可能导致拼接的 SQL 被执行，获取对数据库的信息以及提权，发生 SQL 注入攻击。xxs 攻击是跨站脚本攻击，通过插入恶意脚本，实现对用户游览器的控制。SQL 注入不能做到弹出 XSS 窗。故选 C 项。"},{"id":75,"section":"cs","type":"single","stem":"面向数据挖掘的隐私保护技术主要解决高层应用中的隐私保护问题，致力于研究如何根据不同数据挖掘的特征来实现对隐私的保护，从数据挖掘的角度，不属于隐私保护技术的是（  ）。","passage":"","options":{"A":"基于数据分析的隐私保护技术","B":"基于数据失真的隐私保护技术","C":"基于数据匿名化的隐私保护技术","D":"基于数据加密的隐私保护技术"},"answer":"A","analysis":"从数据挖掘的角度，目前的隐私保护技术主要可以分为三类：基于数据失真的隐私保护技术、基于数据加密的隐私保护技术、基于数据匿名化的隐私保护技术。故选A 项。"},{"id":76,"section":"cs","type":"single","stem":"以下内容，不属于突发事件预案组成部分的是（  ）。","passage":"","options":{"A":"应急处理流程","B":"联系电话表","C":"事件场景","D":"应急演练结果"},"answer":"D","analysis":"突发事件预案组成包括事件场景描述、应急处理流程、时间处理联系电话表等，不包括应急演练结果。故选 D 项。"},{"id":77,"section":"cs","type":"single","stem":"关于商业银行实施信息科技外包活动应当遵循的要求，以下说法不正确的是（  ）。","passage":"","options":{"A":"在外包合同中约定风险责任和风险转移条款，要求外包商承担风险管理责任","B":"应建立与自身规模、市场地位相适应的供应商关系管理策略","C":"应建立外包立项，尽职调查，供应商选择、合同签署、日常管理和后评价管理流程","D":"对于重要的非驻场外包服务，要加强对其安全性、业务连续性的指标考核，每年开展实地检查，加强风险评估"},"answer":"A","analysis":"银行保险机构在实施信息科技外包时应当坚持以下原则：（一）不得将信息科技管理责任、网络安全主体责任外包；（二）以不妨碍核心能力建设、积极掌握关键技术为导向；（三）保持外包风险、成本和效益的平衡；（四）保障网络和信息安全，加强重要数据和个人信息保护；（五）强调事前控制和事中监督；（六）持续改进外包策略和风险管理措施。在外包合同中约定风险责任和风险转移条款，要求外包商承担风险管理责任，属于将信息科技管理责任、网络安全主体责任外包，违反了第一条原则。故选 A 项。"},{"id":78,"section":"cs","type":"single","stem":"（  ）这一计算机软件著作权权利是不可以转让的。","passage":"","options":{"A":"发行权","B":"复制权","C":"署名权","D":"信息网络传播权"},"answer":"C","analysis":"《著作权法》第十条 著作权包括下列人身权和财产权：（一）发表权，即决定作品是否公之于众的权利；（二）署名权，即表明作者身份，在作品上署名的权利；（三）修改权，即修改或者授权他人修改作品的权利；（四）保护作品完整权，即保护作品不受歪曲、篡改的权利；（五）复制权，即以印刷、复印、拓印、录音、录像、翻录、翻拍等方式将作品制作一份或者多份的权利；（六）发行权，即以出售或者赠与方式向公众提供作品的原件或者复制件的权利；（七）出租权，即有偿许可他人临时使用电影作品和以类似摄制电影的方法创作的作品、计算机软件的权利，计算机软件不是出租的主要标的的除外；（八）展览权，即公开陈列美术作品、摄影作品的原件或者复制件的权利；（九）表演权，即公开表演作品，以及用各种手段公开播送作品的表演的权利；（十）放映权，即通过放映机、幻灯机等技术设备公开再现美术、摄影、电影和以类似摄制电影的方法创作的作品等的权利；（十一）广播权，即以无线方式公开广播或者传播作品，以有线传播或者转播的方式向公众传播广播的作品，以及通过扩音器或者其他传送符号、声音、图像的类似工具向公众传播广播的作品的权利；（十二）信息网络传播权，即以有线或者无线方式向公众提供作品，使公众可以在其个人选定的时间和地点获得作品的权利；（十三）摄制权，即以摄制电影或者以类似摄制电影的方法将作品固定在载体上的权利；（十四）改编权，即改变作品，创作出具有独创性的新作品的权利；（十五）翻译权，即将作品从一种语言文字转换成另一种语言文字的权利；（十六）汇编权，即将作品或者作品的片段通过选择或者编排，汇集成新作品的权利；（十七）应当由著作权人享有的其他权利。著作权人可以许可他人行使前款第（五）项至第（十七）项规定的权利，并依照约定或者本法有关规定获得报酬。著作权人可以全部或者部分转让本条第一款第（五）项至第（十七）项规定的权利，并依照约定或者本法有关规定获得报酬。因此，ABD 均可转让。发表权是作者享有的最重要的著作人身权，作者将作品创作完成后，如果不行使其发表权，则其他任何著作人身权或著作财产权均无从行使。而至于署名权能否转让，知识产权界也有不同的声音，一类声音是持传统观点的不能转让，其理由为署名权为人身权，人身权不能让与，另一类声音是认为署名权可以转让。"},{"id":79,"section":"cs","type":"single","stem":"我国发布的第一个信息安全等级保护的国家标准 GB17859-199，提出将信息系统的安全等级划分为（  ）个等级，并提出每个级别的安全功能要求。","passage":"","options":{"A":"8","B":"7","C":"6","D":"5"},"answer":"D","analysis":"我国发布的第一个信息安全等级保护的国家标准 GB 17859-199，提出将信息系统的安全等级划分为 5 个等级，即自主保护级、系统审计保护级、安全标识保护级、结构化保护级、访问验证保护级，并提出每个级别的安全功能要求。故选 D 项。"},{"id":80,"section":"cs","type":"single","stem":"关于敏捷软件开发中需要关注的风险，以下说法不正确的是（  ）。","passage":"","options":{"A":"敏捷软件开发通过其执行结构规避和减轻了常见的软件开发风险，但也引入了开发过程的不确定性，蕴含了大量风险","B":"敏捷软件开发风险主要包括人员风险、技术风险、产品风险、过程风险","C":"敏捷软件开发与传统开发方法不同，在一开始不进行详细的架构设计，因此会带来架构体系不稳定和设计不佳的风险","D":"敏捷开发的过程风险需要关注的方面包括缺乏计划、迭代掌握不佳、缺乏风险管理缺乏质量保证措施等"},"answer":"C","analysis":"在敏捷软件开发过程中从人、过程、产品和技术四个维度进行的风险处理过程。（1）人员风险：敏捷软件开发通过频繁沟通、每日站立会议、反馈等方式解决了沟通不畅，缺乏协作的问题；通过领导、结对编程、代码集体所有权等方式促进团队协作，提高技能素质，应对人员变动，降低矛盾和冲突；通过频繁的产品发布提高人员成就感和士气；通过现场开发，降低缺乏客户介入的风险。（2）技术风险：敏捷软件开发通过迭代、测试套件、重构等方式适应变化和演进，避免了传统的开发方法在一开始就进行架构设计，从而导致架构体系不稳定和设计不佳的风险。对于敏捷技能险，可以通过引入敏捷教练、结对编程、学习环的方式加以应对。而对于非敏捷软件开发所特有的普适性技术风险，可以通过组织和加强内部技术人员的培训和培养，引进能解决项目关键问题的优秀人才，防止优秀人才的流失等方式进行规避。（3）产品风险：敏捷软件开发通过迭代、反馈、客户参与的方式解决了构建错误产品、功能蔓延、需求镀金、质量低下、客户满意度低等风险。可以通过综合考虑功能价值和风险，按照高风险高价值→低风险高价值→低风险低价值→高风险低价值的顺序开发产品功能，渐次降低产品的价值风险；通过对净现值、内部收益率、回收期、贴现回收期等经济指标的综合分析，规避项目的投资回报风险。（4）过程风险：敏捷软件开发通过产品→发布规划→迭代规划→任务逐渐瞄准的形式，极大地消除了各种不确定风险。故选 C 项。"},{"id":81,"section":"multi","type":"multi","stem":"下列部件中其位数（宽度）一定与机器字长相同的是（  ）。","passage":"","options":{"A":"ALU","B":"指令寄存器","C":"通用寄存器","D":"浮点寄存器"},"answer":"AC","analysis":"机器字长是指计算机能直接处理的二进制数据的位数，决定了计算机的运算精度。指令字长：一个指令字中包含二进制代码的位数。存储字长：一个存储单元存储一串二进制代码，这串二进制代码的位数称为存储字长，存储字长可以是 8位、16位、32位等。跟运算相关的 ALU 位数（宽度）一定与机器字长相同，但指令寄存器一定不对。故选 AC 项。"},{"id":82,"section":"multi","type":"multi","stem":"（  ）是文件系统应具备的功能。","passage":"","options":{"A":"对文件的按名存取","B":"负责实现访问数据时的逻辑结构到物理结构的转换","C":"提高磁盘的 I/O 速度","D":"实现对文件的各种操作"},"answer":"ABD","analysis":"文件系统应具备的功能包括管理和调度文件的存储空间，提供文件的逻辑结构、物理结构和存储方法，实现文件从标识到实际地址的映射（按名存取），实现文件的控制操作和存取操作，实现文件信息的共享并提供可靠的文件保密和保护措施，提供文件的安全措施。故选 ABD 项。"},{"id":83,"section":"multi","type":"multi","stem":"架构权衡分析方法（ATAM）是一种常见的系统架构评估框架，主要在系统开发之前，针对（  ）等质量属性进行评价和折中。","passage":"","options":{"A":"性能","B":"可用性","C":"安全性","D":"可修改性"},"answer":"ABCD","analysis":"体系结构权衡分析方法（Architecture Tradeoff Analysis Method, ATAM）是一种常见的系统架构评估框架，该框架主要关注系统的性能，针对可用性、安全性和可修改性，在系统开发之前进行分析、评价与折中。故选 ABCD 项。"},{"id":84,"section":"multi","type":"multi","stem":"为了提高易读性，源程序模块之前应加入序言性注释，用于说明（  ）。","passage":"","options":{"A":"模块的功能","B":"语句的功能","C":"开发历史","D":"模块的接口"},"answer":"ACD","analysis":"注释的作用是说明程序段或语句的功能。为了提高易读性，源程序模块内部应加入序言性注释，用于说明模块的功能，该注释内容不应有语句的功能。故选 ACD 项。"},{"id":85,"section":"multi","type":"multi","stem":"以下关于 Web 应用软件测试的说法中，错误的有（  ）。","passage":"","options":{"A":"对 Web 应用软件进行性能测试时，不需要进行压力测试","B":"内容测试是 Web 应用软件易用性测试的一项重要内容","C":"Cookie 测试是 Web 应用软件功能测试的一项重要内容","D":"是否存在无效链接是 Web 应用软件安全性测试关注的范畴"},"answer":"ABD","analysis":"对 Web 应用软件进行性能测试时，需要进行压力测试；性能测试是 Web 应用软件易用性测试的一项重要内容；Web 应用软件功能测试主要包括链接测试、表单测试、搜索测试、删除测试、cookies 和 session 测试、数据库测试。故选 ABD 项。"},{"id":86,"section":"multi","type":"multi","stem":"关于项目风险的描述，正确的是（  ）。","passage":"","options":{"A":"风险具有随机性、相对性、可变性","B":"项目收益越大，人们愿意承担的风险越大","C":"项目投入越多，人们愿意承担的风险越大","D":"风险按照影响范围可分为局部风险和总体风险"},"answer":"ABD","analysis":"项目活动投入越多，人们对成功的希望越大，愿意冒的风险也就越小。故选ABD 项。"},{"id":87,"section":"multi","type":"multi","stem":"M 软件公司的软件产品注册商标为 M，为确保公司在市场竞争中占据优势，对员工进行了保密约束。此情形下该公司享有（  ）。","passage":"","options":{"A":"商业秘密权","B":"著作权","C":"专利权","D":"商标权"},"answer":"ABD","analysis":"关于软件著作权的取得，《计算机软件保护条例》规定：“软件著作权自软件开发完成之日起产生。”即软件著作权自软件开发完成之日起自动产生，不论整体还是局部，只要具备了软件的属性即产生软件著作权，既不要求履行任何形式的登记或注册手续，也无须在复制件上加注著作权标记，也不论其是否已经发表都依法享有软件著作权。软件公司享有商业秘密权，因为一项商业秘密受到法律保护的依据，必须具备构成商业秘密的三个条件，即不为公众所知悉、具有实用性、采取了保密措施。商业秘密权保护软件是以软件中是否包含着“商业秘密”为必要条件的。该软件公司组织开发的应用软件具有商业秘密的特征，包含着他人不能知道的技术秘密；具有实用性，能为软件公司带来经济效益；对职工进行了保密的约束，在客观上已经采取相应的保密措施，所以软件公司享有商业秘密权。商标权、专利权不能自动取得，申请人必须履行商标法、专利法规定的申请手续，向国家行政部门提交必要的申请文件，申请获准后即可取得相应权利。获准注册的商标通常称为注册商标，题目里已经强调了 M 软件公司的软件产品注册商标为 M，所以该公司已经享有了商标权，只有专利权还没有申请，故选 ABD 项。"},{"id":88,"section":"multi","type":"multi","stem":"在数据库技术中，关于视图的叙述正确的是（  ）。","passage":"","options":{"A":"视图不存储数据，但可以通过视图访问数据","B":"视图提供了一种数据安全机制","C":"视图可以实现数据的逻辑独立性","D":"视图能够提高对数据的访问效率"},"answer":"ABC","analysis":"视图是数据库系统中的重要机制。视图构建于基本表或视图之上，为用户提供一个虚表，与实际存储数据的基本表建立一种映射关系，用户可以像基本表一样对视图进行操作，所有通过视图对数据的操作最终都转换成对基本表的操作来实现。可以通过建立视图，将视图授权给指定用户，则用户只能访问通过视图可见的数据，对视图外的数据起到保护作用，用户无法访问，因此，视图提供了一种数据安全机制。运行中的数据库，出于对性能的要求，可能要对已有的基本表进行分解或合并，即数据库重构。此时，数据库的模式发生改变，可以重建或修改已有视图，保持视图中的数据项与原有视图或基本表中的数据项一致，并映射到修改后的基本表上，实现了数据的逻辑独立性。普通视图只是记录相当于把查询语句持久化了，下次再按照这个查询条件来查询一遍，只是添加了一个对多表关联更加方便的查询入口而已，并不能实际提高查询效率。故选 ABC 项。"},{"id":89,"section":"multi","type":"multi","stem":"以下关于数据库设计中范式的描述，正确的是（  ）。","passage":"","options":{"A":"范式级别越高，数据冗余程度越小","B":"随着范式级别的提高，在需求变化时数据的稳定性越强","C":"范式级别越高，存储同样的数据就需要分解成更多张表","D":"范式级别提高，数据库性能（速度）将下降"},"answer":"ACD","analysis":"范式级别越高，数据冗余程度越小，存储同样数据就需要分解成更多张表，数据库性能（速度）将下降，在需求变化时数据的稳定性将变差，故选 ACD 项。"},{"id":90,"section":"multi","type":"multi","stem":"在 SQL 语言中，对于匹配串中的通配符描述正确的有（  ）。","passage":"","options":{"A":"_（下划线）：匹配任意 1 个字符","B":"%（百分号）：匹配 0 个或多个字符","C":"[]：匹配 [] 口中的任意多个字符","D":"_（下划线）：匹配 0 个或 1 个字符"},"answer":"AB","analysis":"SQL 通配符必须与 LIKE 运算符一起使用。在 SQL 中，可使用以下通配符：通配符 % 代表零个或多个字符，_ 仅替代一个字符；[charlist] 字符列中的任何单一字符；[^charlist] 或者 [!charlist] 不在字符列中的任何单一字符。故选 AB 项。"},{"id":91,"section":"multi","type":"multi","stem":"下面选项中，描述 VLAN 特点的是（  ）。","passage":"","options":{"A":"VLAN 间的通信需要借助三层设备","B":"VLAN 减少了冲突域的数量","C":"每个 VLAN 需要使用分开的 IP 地址空间","D":"针对各个 VLAN，交换机都会有一张 MAC 地址表指导数据转发"},"answer":"ACD","analysis":"VLAN 叫虚拟局域网，是在原来物理的局域网里面划分出多个逻辑上的工作组，也就逻辑上的局域网，每个局域网它是独立的一个广播域，所以不同广播域之间啊，是需要三层设备才能转发，A 项正确；一般在网络规划里面，一个 VLAN 是一个地址空间，这个地址空间指的意思就是他划分的那个 IP 地址段，网络号是不一样的，C 项正确；针对各个 VLAN，交换机里面都有一个 MAC 地址转发表，如果有 VLAN 的话，交换机 MAC 地址转发表里面也会记录出这个 VLAN 的 IP 地址，D 项正确；VLAN 是划分广播域的，跟冲突域其实没关系，VLAN 的划分增加了广播域的数量，减少了广播域的范围，B 项错误。故选 ACD 项。"},{"id":92,"section":"multi","type":"multi","stem":"从路由协议使用的算法来看，路由协议可以分为（  ）。","passage":"","options":{"A":"距离向量协议","B":"链路状态协议","C":"信息收集协议","D":"平衡型协议"},"answer":"AB","analysis":"从路由协议使用的算法来看，路由协议可以分为：距离矢量协议，如 RIP；链路状态协议，如 OSPF、ISIS。故选 AB 项。"},{"id":93,"section":"multi","type":"multi","stem":"DHCP 客户端能从 DHCP 服务器获得（  ）。","passage":"","options":{"A":"DHCP 服务器地址","B":"邮件服务器地址","C":"DNS 服务器地址","D":"Web 服务器地址"},"answer":"AC","analysis":"DHCP 客户端能从 DHCP 服务器获得 DHCP 服务器地址、DNS 服务器地址。故选 AC 项。"},{"id":94,"section":"multi","type":"multi","stem":"如果 IPv6 头部包含多个扩展头部，第一个扩展头部不是（  ）。","passage":"","options":{"A":"逐跳头部","B":"路由选择头部","C":"分段头部","D":"认证头部"},"answer":"BCD","analysis":"IPv6 头部包含多个扩展头部，第一个扩展头部是逐跳头部。故选 BCD 项。"},{"id":95,"section":"multi","type":"multi","stem":"下列攻击中，可能导致网络瘫痪的是（  ）。","passage":"","options":{"A":"溢出攻击","B":"钓鱼攻击","C":"邮件炸弹攻击","D":"拒绝服务攻击"},"answer":"ACD","analysis":"网络钓鱼是通过大量发送声称来自银行或其他知名机构的欺骗性垃圾邮件，意图引诱收信人给出敏感信息（如用户名、口令、账号 ID、ATM PIN 码或信用卡详细信息）的一种攻击方式，不会导致网络瘫痪。故选 ACD 项。"},{"id":96,"section":"multi","type":"multi","stem":"下面关于跨站攻击的描述，正确的是（  ）。","passage":"","options":{"A":"跨站脚本攻击指的是恶意攻击者向访问 Web 页面里插入恶意的 HTML 代码","B":"跨站脚本攻击简称 XSS","C":"静态站点不会受到跨站脚本攻击威胁","D":"造成跨站脚本攻击的原因是网站程序对用户的输入过滤不足"},"answer":"ABCD","analysis":"跨站攻击，即 Cross Site Script Execution（通常简写为 XSS）是指攻击者利用网站程序对用户输入过滤不足，输入可以显示在页面上对其他用户造成影响的 HTML 代码，从而盗取用户资料、利用用户身份进行某种动作或者对访问者进行病毒侵害的一种攻击方式。动态站点会受到一种名为“跨站脚本攻击”（Cross Site Scripting, 安全专家们通常将其缩写成 XSS，原本应当是 css，但为了和层叠样式表（Cascading Style Sheet,CSS）有所区分，故称 XSS）的威胁，而静态站点则完全不受其影响。故选 ABCD 项。"},{"id":97,"section":"multi","type":"multi","stem":"缓冲区溢出漏洞出现的原因有（  ）。","passage":"","options":{"A":"用户输入数据太长，超出系统负荷","B":"某些高级语言没有缓冲区边界检查","C":"某些开发人员没有安全意识","D":"软件测试不够严格"},"answer":"ABCD","analysis":"缓冲区溢出是指当计算机向缓冲区内填充数据位数时超过了缓冲区本身的容量溢出的数据覆盖在合法数据上，程序员通过往程序的缓冲区写超出其长度的内容（不一定超出系统负荷），造成缓冲区的溢出，从而破坏程序的堆栈，使程序转而执行其它指令，以达到攻击的目的。缓冲区溢出漏洞的形成是技术（语言特性、代码逻辑）和管理（安全意识、测试流程）多重因素共同作用的结果。故选 ABCD 项。"},{"id":98,"section":"multi","type":"multi","stem":"防病毒网关一般可以对哪种协议的报文进行查杀？（  ）","passage":"","options":{"A":"HTTP","B":"FTP","C":"SMTP","D":"POP3"},"answer":"ABC","analysis":"防病毒网关是一种网络设备，用以保护网络内（一般是局域网）进出数据的安全。主要体现在病毒杀除、关键字过滤（如色情、反动）、垃圾邮件阻止的功能，同时部分设备也具有一定防火墙（划分 Vlan）的功能。如果与互联网相连，就需要网关的防病毒软件。能够检测进出网络内部的数据，对 HTTP、FTP、SMTP、IMAP、POP3 等多种协议的数据进行病毒扫描，一旦发现病毒就会采取相应的手段进行隔离或查杀，在防护病毒方面起到了非常大的作用。故选 ABC 项。"},{"id":99,"section":"multi","type":"multi","stem":"在银行卡风险管理领域，以下哪些措施可以防范伪卡欺诈？（  ）","passage":"","options":{"A":"添加卡片校验码","B":"增加其他交易验证要素","C":"限制交易时间","D":"加强交易监控"},"answer":"ABD","analysis":"在银行卡风险管理领域，防范伪卡欺诈措施包括添加卡片校验码、增加其他交易验证要素、加强交易监控。故选 ABD 项。"},{"id":100,"section":"multi","type":"multi","stem":"商业银行应制定全面的信息科技风险管理策略，包括（  ）。","passage":"","options":{"A":"信息分级与保护","B":"信息系统开发、测试和维护","C":"信息科技运行和维护","D":"访问控制"},"answer":"ABCD","analysis":"《商业银行信息科技风险管理指引目录》第十五条：商业银行应制定全面的信息科技风险管理策略，包括但不限于以下领域：（1）信息分级与保护；（2）信息系统开发、测试和维护；（3）信息科技运行和维护；（4）访问控制；（5）物理安全；（6）人员安全；（7）业务连续性计划与应急处置。故选 ABCD 项。"},{"id":101,"section":"eng","type":"single","stem":"According to Paragraph 1, the U.S. economy became the largest and the most modern in the world because  .","passage":"During the American Revolution, America had not yet entered its industrial age. Most manufacturing was done in people's homes. Whereas Britain was industrialized, America had not caught on yet. Then Francis Cabot Lowell went to Britain in 1811. He memorized the secrets to constructing a power loom. After he and his associates returned to America, they founded some textile plants in Boston. The most famous was in Lowell, Massachusetts. It was built in 1822. The Lowell system employed many“mill girls”. They lived in dormitories in order to run the factory. New England was the home of a growing textile industry. It was the first area of the United States to experience such rapid growth. This growth also occurred in Pennsylvania. The iron industry pushed that state along and helped it to grow even faster. Then the direction of progress began to change. This new period took place between 1810 and the 1860s. Factories continued to expand. But greater strides were being taken in inventing American manufacturing and agriculture was greatly improved. These improvements came from practical inventions. Richard Chenaworth invented the cast - iron plow. It was useful because it had replaceable parts. John Deere invented the steel plow, which made farming faster because the soil did not stick to it. Eli Whitney invented the cotton gin and the yig. This began a huge cotton industry in the south. Samuel Morse invented the telegraph, which began the age of long - range communication. Elisha Otis invented the passenger elevator. This let to modern - day skyscrapers. Finally, George Pullman introduced the sleeping car for trains. This allowed for long - distance travel. From the 1850s on, industry in the United States boomed. The Civil War was over. With the victory of the North, northern business entrepreneurs flourished. Government was eager to see business expand. The innovations listed above caused swift and dramatic changes. Railroads were now needed to carry goods across the country. People in the south traded cotton. They sold their product to the north and to Britain. By the early 1900s, cars were needed by many people. The auto industry introduced a new dimension of growth to America. By the 1920s, Henry Ford introduced his Model - T and with it came the modern assembly line.","options":{"A":"the U.S. won the American Revolution","B":"there were many new inventions","C":"competing with the Europe and eventually surpassed it","D":"the economy grew steadily for more than 150 years"},"answer":"B","analysis":"第一段中“Then Francis Cabot Lowell went to Britain in 1811. He memorized the secrets to constructing a power loom.”表明美国的繁荣得益于工业化的发展，而工业化发展的显著特征则为各种新发明的出现及应用，B 项正确，当选。本段重点内容在“whereas”之后进行了转折，答案在此后出现，A 项错误，不当选。本段未提及“eventually surpassed it”，C 项错误，不当选。D 项未提及，不当选。故选 B 项。"},{"id":102,"section":"eng","type":"single","stem":"Which of the following best expresses the essential information in the highlighted sentence?（ ）","passage":"During the American Revolution, America had not yet entered its industrial age. Most manufacturing was done in people's homes. Whereas Britain was industrialized, America had not caught on yet. Then Francis Cabot Lowell went to Britain in 1811. He memorized the secrets to constructing a power loom. After he and his associates returned to America, they founded some textile plants in Boston. The most famous was in Lowell, Massachusetts. It was built in 1822. The Lowell system employed many“mill girls”. They lived in dormitories in order to run the factory. New England was the home of a growing textile industry. It was the first area of the United States to experience such rapid growth. This growth also occurred in Pennsylvania. The iron industry pushed that state along and helped it to grow even faster. Then the direction of progress began to change. This new period took place between 1810 and the 1860s. Factories continued to expand. But greater strides were being taken in inventing American manufacturing and agriculture was greatly improved. These improvements came from practical inventions. Richard Chenaworth invented the cast - iron plow. It was useful because it had replaceable parts. John Deere invented the steel plow, which made farming faster because the soil did not stick to it. Eli Whitney invented the cotton gin and the yig. This began a huge cotton industry in the south. Samuel Morse invented the telegraph, which began the age of long - range communication. Elisha Otis invented the passenger elevator. This let to modern - day skyscrapers. Finally, George Pullman introduced the sleeping car for trains. This allowed for long - distance travel. From the 1850s on, industry in the United States boomed. The Civil War was over. With the victory of the North, northern business entrepreneurs flourished. Government was eager to see business expand. The innovations listed above caused swift and dramatic changes. Railroads were now needed to carry goods across the country. People in the south traded cotton. They sold their product to the north and to Britain. By the early 1900s, cars were needed by many people. The auto industry introduced a new dimension of growth to America. By the 1920s, Henry Ford introduced his Model - T and with it came the modern assembly line.","options":{"A":"New England grew more rapidly than European countries.","B":"There was rapid growth in all states of the United States, including New England.","C":"Only one area besides New England in America experienced fast growth.","D":"Fast growth occurred in New England first in America."},"answer":"D","analysis":"“New England was the home of a growing textile industry. It was the first area of the United States to experience such rapid growth.”中“it”指代“New England（新英格兰）”，新英格兰是美国第一个发展速度如此之快的地区，本句只指美国的发展，没有谈到与欧洲国家的对比。故选 D 项。"},{"id":103,"section":"eng","type":"single","stem":"Which of the following can be inferred about Pennsylvania's industry?（ ）","passage":"During the American Revolution, America had not yet entered its industrial age. Most manufacturing was done in people's homes. Whereas Britain was industrialized, America had not caught on yet. Then Francis Cabot Lowell went to Britain in 1811. He memorized the secrets to constructing a power loom. After he and his associates returned to America, they founded some textile plants in Boston. The most famous was in Lowell, Massachusetts. It was built in 1822. The Lowell system employed many“mill girls”. They lived in dormitories in order to run the factory. New England was the home of a growing textile industry. It was the first area of the United States to experience such rapid growth. This growth also occurred in Pennsylvania. The iron industry pushed that state along and helped it to grow even faster. Then the direction of progress began to change. This new period took place between 1810 and the 1860s. Factories continued to expand. But greater strides were being taken in inventing American manufacturing and agriculture was greatly improved. These improvements came from practical inventions. Richard Chenaworth invented the cast - iron plow. It was useful because it had replaceable parts. John Deere invented the steel plow, which made farming faster because the soil did not stick to it. Eli Whitney invented the cotton gin and the yig. This began a huge cotton industry in the south. Samuel Morse invented the telegraph, which began the age of long - range communication. Elisha Otis invented the passenger elevator. This let to modern - day skyscrapers. Finally, George Pullman introduced the sleeping car for trains. This allowed for long - distance travel. From the 1850s on, industry in the United States boomed. The Civil War was over. With the victory of the North, northern business entrepreneurs flourished. Government was eager to see business expand. The innovations listed above caused swift and dramatic changes. Railroads were now needed to carry goods across the country. People in the south traded cotton. They sold their product to the north and to Britain. By the early 1900s, cars were needed by many people. The auto industry introduced a new dimension of growth to America. By the 1920s, Henry Ford introduced his Model - T and with it came the modern assembly line.","options":{"A":"It had a textile industry similar to Massachusetts'.","B":"It often competed against Massachusetts and other states.","C":"Its iron industry was stronger than in other states.","D":"It became a richer state than Massachusetts with faster growth."},"answer":"C","analysis":"第二段中“This growth also occurred in Pennsylvania. The iron industry pushed that state along and helped it to grow even faster.”证明其发展的是钢铁产业，钢铁产业发展势头很盛，与 C 项符合，A 项错误，不当选。B 项文章未提及。文章未将其与 Massachusetts 对比，D 项错误，不当选。故选 C 项。"},{"id":104,"section":"eng","type":"single","stem":"Why does the author mention practical inventions in Paragraph 4?（ ）","passage":"During the American Revolution, America had not yet entered its industrial age. Most manufacturing was done in people's homes. Whereas Britain was industrialized, America had not caught on yet. Then Francis Cabot Lowell went to Britain in 1811. He memorized the secrets to constructing a power loom. After he and his associates returned to America, they founded some textile plants in Boston. The most famous was in Lowell, Massachusetts. It was built in 1822. The Lowell system employed many“mill girls”. They lived in dormitories in order to run the factory. New England was the home of a growing textile industry. It was the first area of the United States to experience such rapid growth. This growth also occurred in Pennsylvania. The iron industry pushed that state along and helped it to grow even faster. Then the direction of progress began to change. This new period took place between 1810 and the 1860s. Factories continued to expand. But greater strides were being taken in inventing American manufacturing and agriculture was greatly improved. These improvements came from practical inventions. Richard Chenaworth invented the cast - iron plow. It was useful because it had replaceable parts. John Deere invented the steel plow, which made farming faster because the soil did not stick to it. Eli Whitney invented the cotton gin and the yig. This began a huge cotton industry in the south. Samuel Morse invented the telegraph, which began the age of long - range communication. Elisha Otis invented the passenger elevator. This let to modern - day skyscrapers. Finally, George Pullman introduced the sleeping car for trains. This allowed for long - distance travel. From the 1850s on, industry in the United States boomed. The Civil War was over. With the victory of the North, northern business entrepreneurs flourished. Government was eager to see business expand. The innovations listed above caused swift and dramatic changes. Railroads were now needed to carry goods across the country. People in the south traded cotton. They sold their product to the north and to Britain. By the early 1900s, cars were needed by many people. The auto industry introduced a new dimension of growth to America. By the 1920s, Henry Ford introduced his Model - T and with it came the modern assembly line.","options":{"A":"To exemplify the reasons for the development of industry in America.","B":"To show how America became rich by selling new products.","C":"To illustrate how intelligent American inventors were.","D":"To prove that most useful inventions came from America."},"answer":"A","analysis":"“From the 1850s on, industry in the United States boomed.”是第四段的中心句，主要想阐述美国的工业爆发，下文罗列了工业发展欣欣向荣的景象。故选 A 项。"},{"id":105,"section":"eng","type":"single","stem":"The word“boomed”in the passage is closest in the meaning to“ ”.","passage":"During the American Revolution, America had not yet entered its industrial age. Most manufacturing was done in people's homes. Whereas Britain was industrialized, America had not caught on yet. Then Francis Cabot Lowell went to Britain in 1811. He memorized the secrets to constructing a power loom. After he and his associates returned to America, they founded some textile plants in Boston. The most famous was in Lowell, Massachusetts. It was built in 1822. The Lowell system employed many“mill girls”. They lived in dormitories in order to run the factory. New England was the home of a growing textile industry. It was the first area of the United States to experience such rapid growth. This growth also occurred in Pennsylvania. The iron industry pushed that state along and helped it to grow even faster. Then the direction of progress began to change. This new period took place between 1810 and the 1860s. Factories continued to expand. But greater strides were being taken in inventing American manufacturing and agriculture was greatly improved. These improvements came from practical inventions. Richard Chenaworth invented the cast - iron plow. It was useful because it had replaceable parts. John Deere invented the steel plow, which made farming faster because the soil did not stick to it. Eli Whitney invented the cotton gin and the yig. This began a huge cotton industry in the south. Samuel Morse invented the telegraph, which began the age of long - range communication. Elisha Otis invented the passenger elevator. This let to modern - day skyscrapers. Finally, George Pullman introduced the sleeping car for trains. This allowed for long - distance travel. From the 1850s on, industry in the United States boomed. The Civil War was over. With the victory of the North, northern business entrepreneurs flourished. Government was eager to see business expand. The innovations listed above caused swift and dramatic changes. Railroads were now needed to carry goods across the country. People in the south traded cotton. They sold their product to the north and to Britain. By the early 1900s, cars were needed by many people. The auto industry introduced a new dimension of growth to America. By the 1920s, Henry Ford introduced his Model - T and with it came the modern assembly line.","options":{"A":"imploded","B":"increased","C":"fluctuated","D":"continued"},"answer":"B","analysis":"“boomed”指快速发展，A 项意思为“内爆，经济或政治突然崩溃”，B 项为“增加”，C 项为“波动”，D 项为“继续”。故选 B 项。"},{"id":106,"section":"eng","type":"single","stem":"What can be inferred about Erica at school?（ ）","passage":"Testing has replaced teaching in most public schools. My own children's school week is framed by pretests, drills, tests, and retests. They know that the best way to read a textbook is to look at the questions at the end of the chapter and then skim the text for the answers. I believe that my daughter Erica, who gets excellent marks, has never read a chapter of any of her school textbooks all the way through. And teachers are often heard to state proudly and openly that they teach to the mandated state test. Teaching to the test is a curious phenomenon. Instead of deciding what skills students ought to learn, helping students learn them, and then using some sensible methods of assessment to discover whether students have mastered the skills, teachers are encouraged to reverse the process. First, one looks at a commercially available test. Then, one distills skills needed not to master reading, say, or math, but to do well on the test. Finally, the test skills are taught. The ability to read or write or calculate might imply the ability to do reasonably well on standardized tests. However, neither reading nor writing develops simply through being taught to take tests. We must be careful to avoid mistaking preparation for a test of a skill with the acquisition of that skill. Too many discussions of basic of skills make this fundamental confusion because people are test - obsessed rather than concerned with the nature and quality of what is taught. Recently, many schools have faced what could be called the crisis of comprehension or, in simple terms, the phenomenon of students with phonic and grammar skills still being unable to understand what they read. These students are competent at test taking and filling in workbooks and ditto masters. However, they have little or no experience reading or thinking, and talking about what they read. They know the details but can't see or understand the whole. They are taught to be so concerned with grade that they have no time or ease of mind to think about meaning, and reread things if necessary.","options":{"A":"She learns the best way of reading a textbook.","B":"She learns to find answers more than anything else.","C":"She has not learned anything substantial.","D":"She likes testing more than learning."},"answer":"C","analysis":"第一段“I believe that my daughter Erica, who gets excellent marks, has never read a chapter of any of her school textbooks all the way through.”中“ never ”一词证明 A 项错误，不当选。通过文章可知，作者对应试教育持反对意见，排除 BD 项。故选 C 项。"},{"id":107,"section":"eng","type":"single","stem":"What do teachers think about teaching to the mandated state test?（ ）","passage":"Testing has replaced teaching in most public schools. My own children's school week is framed by pretests, drills, tests, and retests. They know that the best way to read a textbook is to look at the questions at the end of the chapter and then skim the text for the answers. I believe that my daughter Erica, who gets excellent marks, has never read a chapter of any of her school textbooks all the way through. And teachers are often heard to state proudly and openly that they teach to the mandated state test. Teaching to the test is a curious phe mind to think about meaning, and reread things if necessary.","options":{"A":"skills are determined before tests are set","B":"tests are used to assess students' skills","C":"tests restrict the skills necessary for students","D":"skills are consolidated by taking tests"},"answer":"A","analysis":"“Teaching to the test is a curious phenomenon.”“strange”与“curious”同义，作者对应试教育持反对意见，排除 B 项。C 项未提及。第二段“Instead of deciding what skills students ought to learn, helping students learn them, and then using some sensible methods of assessment to discover whether students have mastered the skills, teachers are encouraged to reverse the process.”表明作者认为先测试后进行技能训练更好，排除 D 项。故选 A 项。"},{"id":109,"section":"eng","type":"single","stem":"According to the third paragraph,“this fundamental confusion”refers to the fact that  .","passage":"Testing has replaced teaching in most public schools. My own children's school week is framed by pretests, drills, tests, and retests. They know that the best way to read a textbook is to look at the questions at the end of the chapter and then skim the text for the answers. I believe that my daughter Erica, who gets excellent marks, has never read a chapter of any of her school textbooks all the way through. And teachers are often heard to state proudly and openly that they teach to the mandated state test. Teaching to the test is a curious phenomenon. Instead of deciding what skills students ought to learn, helping students learn them, and then using some sensible methods of assessment to discover whether students have mastered the skills, teachers are encouraged to reverse the process. First, one looks at a commercially available test. Then, one distills skills needed not to master reading, say, or math, but to do well on the test. Finally, the test skills are taught. The ability to read or write or calculate might imply the ability to do reasonably well on standardized tests. However, neither reading nor writing develops simply through being taught to take tests. We must be careful to avoid mistaking preparation for a test of a skill with the acquisition of that skill. Too many discussions of basic of skills make this fundamental confusion because people are test - obsessed rather than concerned with the nature and quality of what is taught. Recently, many schools have faced what could be called the crisis of comprehension or, in simple terms, the phenomenon of students with phonic and grammar skills still being unable to understand what they read. These students are competent at test taking and filling in workbooks and ditto masters. However, they have little or no experience reading or thinking, and talking about what they read. They know the details but can't see or understand the whole. They are taught to be so concerned with grade that they have no time or ease of mind to think about meaning, and reread things if necessary.","options":{"A":"the basic of skills has been discussed too much","B":"a test of a skill has been equated with acquiring the skill","C":"the nature and quality of what is taught are rarely concerned","D":"skills do not develop by being taught to take tests"},"answer":"B","analysis":"第三段“We must be careful to avoid mistaking preparation for a test of a skill with the acquisition of that skill. Too many discussions of basic of skills make this fundamental confusion...”中的“this”表明答案在前文。故选 B 项。"},{"id":110,"section":"eng","type":"single","stem":"The crisis of comprehension is most probably resulted from  .","passage":"Testing has replaced teaching in most public schools. My own children's school week is framed by pretests, drills, tests, and retests. They know that the best way to read a textbook is to look at the questions at the end of the chapter and then skim the text for the answers. I believe that my daughter Erica, who gets excellent marks, has never read a chapter of any of her school textbooks all the way through. And teachers are often heard to state proudly and openly that they teach to the mandated state test. Teaching to the test is a curious phenomenon. Instead of deciding what skills students ought to learn, helping students learn them, and then using some sensible methods of assessment to discover whether students have mastered the skills, teachers are encouraged to reverse the process. First, one looks at a commercially available test. Then, one distills skills needed not to master reading, say, or math, but to do well on the test. Finally, the test skills are taught. The ability to read or write or calculate might imply the ability to do reasonably well on standardized tests. However, neither reading nor writing develops simply through being taught to take tests. We must be careful to avoid mistaking preparation for a test of a skill with the acquisition of that skill. Too many discussions of basic of skills make this fundamental confusion because people are test - obsessed rather than concerned with the nature and quality of what is taught. Recently, many schools have faced what could be called the crisis of comprehension or, in simple terms, the phenomenon of students with phonic and grammar skills still being unable to understand what they read. These students are competent at test taking and filling in workbooks and ditto masters. However, they have little or no experience reading or thinking, and talking about what they read. They know the details but can't see or understand the whole. They are taught to be so concerned with grade that they have no time or ease of mind to think about meaning, and reread things if necessary.","options":{"A":"students' insufficient phonic and grammar skills","B":"teaching that takes up much of students' free time","C":"teaching that emphasizes details rather than the whole","D":"students' incompetence in thinking about what they read"},"answer":"D","analysis":"细节理解题。结合最后一段中“However, they have little or no experience reading or thinking, and talking about what they read.”可知答案。故选 D 项。"},{"id":111,"section":"eng","type":"single","stem":"What do we learn from the passage about creativity?（ ）","passage":"You can't see it, smell it, or hear it, and people disagree on how precisely to define it, or where exactly it comes from. It isn't a school subject or an academic discipline, but it can be learned. It is a quality that is required of artists, but it is also present in the lives of scientists and entrepreneurs. All of us benefit from it and we thrive mentally and spiritually when we are able to wield it. It is a delicate thing, easily stamped out; in fact, it flourishes most fully when people are playful and childlike. Meanwhile, it works best in conjunction with deep knowledge and expertise. This mysterious but teachable quality is creativity, the subject of a recently - published report by Durham Commission on Creativity and Education. The report concludes that creativity should not inhabit the school curriculum only as it relates to drama, music, art and other obviously creative subjects, but that creative thinking ought to run through all of school life, infusing the way humanities and natural sciences are learned. The authors, who focus on education in England, offer a number of sensible recommendations, some of which are an attempt to alleviate the uninspiring and fact - based approach to education that has crept into policy in recent years. When children are regarded as vessels to be filled with facts, creativity does not prosper; nor does it when teachers' sole objective is coaching children towards exams. One suggestion from the commission is a network of teacher - led“creativity collaboratives”, along the lines of existing maths hubs, with the aim of supporting teaching for creativity through the school curriculum. Nevertheless, it is arts subjects through which creativity can most obviously be fostered. The value placed on them by the independent education sector is clear. One only has to look at the remarkable arts facilities at Britain's top private schools to comprehend this. But in the state sector the excessive focus on English, maths and science threatens to crush arts subjects; meanwhile reduced school budgets mean diminishing extracurricular activities. There has been a 28.1% decline in students taking creative subjects at high schools since 2014, though happily, art and design have seen a recent increase. This discrepancy between state and private education is a matter of social justice. It is simply wrong and unfair that most children have a fraction of the access to choirs, orchestras, art studios and drama that their more privileged peers enjoy. As lives are affected by any number of looming challenges—climate crisis, automation in the workplace—humans are going to need creative thinking more than ever. For all of our sakes, creativity in education, and for all, must become a priority.","options":{"A":"It develops best when people are spiritually prepared.","B":"It is most often wielded by scientists and entrepreneurs.","C":"It is founded on scientific knowledge and analytical skill.","D":"It contributes to intellectual growth but can easily be killed."},"answer":"D","analysis":"第一段“It is a quality that is required of artists, but it is also present in the lives of scientists and entrepreneurs.”表明艺术家、科学家和企业家都需要创造力，B 项“most”表达错误。“All of us benefit from it and we thrive mentally and spiritually when we are able to wield it.”表明精神世界对创造力有影响，但 A 项“best”一词表述不准确，不当选。C项未提及。“It isn't a school subject or an academic discipline, but it can be learned.”和“It is a delicate thing, easily stamped out...”表明 D 项正确，当选。故选 D 项。"},{"id":112,"section":"eng","type":"single","stem":"What is the conclusion of a recently - published report?（ ）","passage":"You can't see it, smell it, or hear it, and people disagree on how precisely to define it, or where exactly it comes from. It isn't a school subject or an academic discipline, but it can be learned. It is a quality that is required of artists, but it is also present in the lives of s
