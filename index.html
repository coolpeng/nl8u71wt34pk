 in human character defects", "B": "people tend to keep stable work to avoid the fear of changes", "C": "the paycheck makes people feel safe about their work", "D": "we tolerate dissatisfaction as we need to work"}, "answer": "B", "analysis": "第一段主要是讲我们对工作中的变化感到恐惧，因为恐惧是人类的天性。当\n我们对一件事习以为常的时候，我们的恐惧感也会随之减少。当我们领取报酬时，我们也\n\n容忍了工作中的不满：还是稳当些好！由此可以推断出人们保持稳定的工作来避免由于变\n化而产生的恐惧感。这正是 B 项的内容。A 项的错误在于自我引申，原文只说到“fear is a\nnatural human condition”（恐惧是人类的天性），而没有引申到恐惧是人类性格的缺陷。C\n项的错误同 A 项，原文的含义是薪水使人们容忍了对工作的不满，而不是使人们对工作产\n生安全感。D 干扰项的设计是把原文中几个句子的成分连接为一个新的句子，这就是在偷\n换概念。故选 B 项。", "passage": ""}, {"id": 117, "section": "eng", "type": "single", "stem": "By saying that“the safety net we preserve requires a big trade\n-\noff ”（Line 1, Paragraph.\n2）, the author probably means that .", "options": {"A": "safety can be achieved by meeting both our desires and monetary needs", "B": "people have to accept the uncertainty of their current jobs", "C": "people have to work hard to get money as the reward", "D": "safety means sacrificing the balance between monetary needs and the happiness of work"}, "answer": "A", "analysis": "第二段中“It often denies us the opportunity to experience work that makes us\nhappy, that is consistent with our desires while still meeting our monetary needs.”指出人们工作\n不仅仅是为了钱，也满足内心，获得快乐，这是很多人忽略的。故选 A 项。", "passage": ""}, {"id": 118, "section": "eng", "type": "single", "stem": "According to the passage, when changes throw our work lives into danger, we will\nusually .", "options": {"A": "express great dissatisfaction with the job", "B": "feel uncertain about the risk", "C": "remain in the work position", "D": "take another work opportunity"}, "answer": "C", "analysis": "细节理解题。第四段“…can throw our work lives into danger. But despite this\nuncertainty, some of us still cling to our jobs...”中“cling”（抓住）表明人们还会继续工作，\nC 项正确。故选 C 项。", "passage": ""}, {"id": 119, "section": "eng", "type": "single", "stem": "We can learn from the passage that .", "options": {"A": "people do not have a sense of mission nowadays", "B": "people struggle between the ideal work and monetary needs", "C": "happiness and money can hardly be achieved in workplace", "D": "happiness and money can be both achieved during work in most cases"}, "answer": "B", "analysis": "主旨大意题。文中倒数第二段、第三段，表明不如意的工作放弃和坚持都有风…\n险，所以人们徘徊于二者之间。故选 B 项。", "passage": ""}, {"id": 120, "section": "eng", "type": "single", "stem": "The purpose of the author in writing the passage is to .", "options": {"A": "persuade people to choose careers with purpose", "B": "criticize those who work for money", "C": "elaborate people's attitude towards work and safety", "D": "illustrate how safety of work lives can be achieved\n\n\n\n\n8984351279"}, "answer": "D", "analysis": "作者在文中详细讨论了我们对工作变化的恐惧、安全网的代价、以及对工作\n和生活幸福的追求等问题，最终目的是说明如何实现工作生活的安全感。通过探讨这些主\n题，作者希望引导读者理解并实现更为满意和充实的工作生活。故选 D 项。\n糖糖老师：1\n\n2022 年银保监会招录考试计算机岗·专业知识真题卷答案解析\n8984351279\n133", "passage": ""}]}, "2021": {"meta": {"title": "2021年 金监局·计算机岗 专业科目真题卷", "subtitle": "金融监督管理总局招录考试 · 专业知识真题卷（含解析）", "year": 2021, "total": 120, "minutes": 120, "score": 100, "source": "【考试喵】金监局2021年笔试真题及解析-计算机岗.txt"}, "sections": [{"key": "econ", "name": "经济金融基础知识 · 单选", "range": [1, 20], "per": 0.5, "type": "single"}, {"key": "cs", "name": "计算机专业知识 · 单选", "range": [21, 80], "per": 1, "type": "single"}, {"key": "multi", "name": "计算机专业知识 · 多选", "range": [81, 100], "per": 1, "type": "multi"}, {"key": "eng", "name": "英语阅读理解 · 单选", "range": [101, 120], "per": 0.5, "type": "single"}], "questions": [{"id": 1, "section": "econ", "type": "single", "stem": "为维护您的个人权益，确保公务员考试的公平公正，请您协助我\n们监督考试实施工作。\n本场考试规定：监考人员要向本考场全体考生展示题本密封情况，\n并邀请 2 名考生代表验封签字后，方能开启试卷袋。如果您发现本考场\n监考人员存在违规启用试卷袋的情况，请向人力资源和社会保障部人事\n考试中心举报。", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "C", "analysis": "摩擦性失业是指劳动者在正常流动过程中所产生的失业，A 项不当选。结构\n性失业，主要是由于经济结构（包括产业结构、产品结构、地区结构等）发生了变化，现\n有劳动力的知识、技能、观念、区域分布等不适应这种变化，与市场需求不匹配而引发的\n失业，B 项不当选。周期性失业是在经济萧条和衰退时期，由于社会总需求不足所引起的\n失业， C 项当选。临时性失业是口语化的概念，不属于经济学对于失业的分类， D 项不当选。\n故选 C 项。", "passage": ""}, {"id": 2, "section": "econ", "type": "single", "stem": "根据《公务员考试录用违纪违规行为处理办法》，答卷雷同，将\n给予该科目（场次）考试成绩无效等处理。请您妥善看护好自己的考试\n试卷和答题信息，防止被他人抄袭。\n\n\n\n注意事项 :", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "A", "analysis": "国民收入核算恒等式表明，资本净流出总是等于贸易余额，即资本净流出=\n贸易余额（S\n-\nI=NX）。如果发生贸易赤字，也就是进口大于出口的情况，则 S\n是负的，即有资本净流入， A 项正确，当选， B 项错误，不当选。 Y=C+I+G+NX， NX 为负，\n则消费、投资和政府购买之和超过产出，C 项错误，不当选。故选 A 项。", "passage": ""}, {"id": 3, "section": "econ", "type": "single", "stem": "消费者的预算线反映了（… … ）。", "options": {"A": "消费者的收入约束", "B": "消费者的需求趋势", "C": "消费者的支出计划", "D": "消费者获得的总效用"}, "answer": "A", "analysis": "糖糖老师：1-\nI 和 NX\n【解析】预算线是指在消费者收入和商品价格水平一定的情况下，消费者所能够买到\n两种商品数量组合点的轨迹，反映了消费者的收入约束，A 项当选。消费者的需求趋势反\n映价格和需求量反向变动的关系，B 项不当选。消费者的支出计划是口语化的支出表述，\nC 项不当选。消费者获得的总效用是给定时间、消费数量条件下，消费者获得的效用量的\n总和，D 项不当选。故选 A 项。", "passage": ""}, {"id": 4, "section": "econ", "type": "single", "stem": "监考人员宣布考试结束时，考生应立即停止作答，将题本、答题\n卡和草稿纸一律留在桌上，待监考人员确认数量无误、允许离开后，方\n可离开考场。如果你违反了以上任何一项要求，都将影响你的成绩。", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "B", "analysis": "2021 年银保监会招录考试计算机岗·专业知识真题卷答案解析\n【解析】恩格尔曲线表示消费者在每一收入水平对某商品的需求量。故选 B 项。", "passage": ""}, {"id": 5, "section": "econ", "type": "single", "stem": "以下表述正确的是（… … ）。", "options": {"A": "企业的短期供给曲线比长期供给曲线更有弹性", "B": "企业的长期供给曲线是平均可变成本以上的边际成本曲线", "C": "企业的长期供给曲线是价格等于最小平均成本时的一条水平线", "D": "企业的长期供给曲线是平均成本以上的边际成本曲线"}, "answer": "D", "analysis": "企业的短期供给曲线比长期供给曲线更陡峭，所以长期供给曲线比短期供给\n曲线更有弹性， A 项错误，不当选。企业长期供给不存在可变成本之说， B 项错误，不当选。\n成本不变的完全竞争行业中，企业的长期供给曲线是价格等于最小平均成本时的一条水平\n线，C 项错误，不当选。企业的长期均衡一定发生在长期平均成本 LAC 曲线的最低点，在\n当选。故选 D 项。", "passage": ""}, {"id": 6, "section": "econ", "type": "single", "stem": "试题答错不倒扣分。\n严禁折叠答题卡！\n停！请不要往下翻！听候监考老师的指令。\n否则，会影响你的成绩。\n\n\n\n给出的四个选项中，只有一项是符合题目要求的。", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "C", "analysis": "8984351279\n这个最低点上，生产者的平均成本降到了 LAC 曲线的最低水平，消费者购买商品的价格也\n降到了 LAC 曲线的最低水平，长期供给曲线是平均成本以上的边际成本曲线，D 项正确，\n【解析】社会福利有广义和狭义的理解。广义的社会福利是指面对广大社会成员并改\n善其物质和文化生活的一切措施，狭义的社会福利基本上是指向困难群体提供的带有福利\n性的社会支持，包括物质支持和服务支持，A 项不当选。由于市场机制不能充分地发挥作\n用而导致的资源配置缺乏效率或资源配置失当的情况叫市场失灵，B 项不当选。公共物品\n是满足社会公共需要的物品，“搭便车”是公共物品造成市场失灵的原因，C 项当选。信\n息不对称是指市场上买卖双方掌握的信息量不一样。信息不对称会导致逆向选择和道德风\n险，D 项不当选。故选 C 项。", "passage": ""}, {"id": 7, "section": "econ", "type": "single", "stem": "在凯恩斯的三个货币需求动机中，对利率最敏感的是（… … ）。", "options": {"A": "交易动机", "B": "投机动机", "C": "预防动机", "D": "利他动机"}, "answer": "B", "analysis": "交易动机所要求的货币需求，取决于收入水平、惯例和商业制度，但主要取\n决于收入水平，A 项不当选。投机动机所要求的货币需求与利率水平呈反相关，对利率最\n敏感，B 项当选。预防动机所要求的货币需求大致与收入成正比，C 项不当选。利他动机\n不是经济学的研究范畴，D 项不当选。故选 B 项。", "passage": ""}, {"id": 8, "section": "econ", "type": "single", "stem": "以下关于社会融资规模的表述，正确的是（… … ）。", "options": {"A": "仅是增量指标，不是存量指标", "B": "是金融机构资产负债表的负债方", "C": "指实体经济从商业银行获得的资金", "D": "指实体经济从金融体系获得的资金"}, "answer": "D", "analysis": "社会融资规模存量是指一定时期末（月末、季末或年末）实体经济从金融体\n系获得的资金余额，社会融资规模增量是指一定时期内实体经济从金融体系获得的资金额。\n所以社会融资规模既是增量指标，又是存量指标，A 项错误，不当选。社会融资规模描述\n的是整个金融体系（不仅仅是商业银行）向实体经济提供的资金量，所以是金融机构资产\n负债表的资产方，BC 项错误，不当选，D 项正确，当选。故选 D 项。", "passage": ""}, {"id": 9, "section": "econ", "type": "single", "stem": "通常来说，商业银行派生存款的能力（… … ）。", "options": {"A": "与现金漏损率成反比，与法定存款准备金率成反比", "B": "与现金漏损率成正比，与法定存款准备金率成反比", "C": "与现金漏损率成正比，与法定存款准备金率成正比", "D": ""}, "answer": "A", "analysis": "根据存款乘数的公式 K=1/ （rd+re\n+c+rt·t）可知，商业银行的派生存款能力与法\n定存款准备金率（rd）、超额存款准备金率（re）、现金漏损率（c）、定期存款准备金率（rt）、\n111\n\n2021 年银保监会招录考试计算机岗·专业知识真题卷答案解析\n定活比（t）成反比。故选 A 项。", "passage": ""}, {"id": 10, "section": "econ", "type": "single", "stem": "（… … ）不属于商业银行的资产业务。", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "B", "analysis": "商业银行的资产业务属于资金运用业务，贴现、贷款、证券投资等都属于资\n产业务。信用证业务属于商业银行的表外业务。故选 B 项。", "passage": ""}, {"id": 11, "section": "econ", "type": "single", "stem": "", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "C", "analysis": "分业监管体制即多头或多元监管体制，是根据从事金融业务的不同机构主体\n及其业务范围不同，由两个或两个以上的监管机构分别实施监管的体制，代表国家如中国，\nAB 项均不当选。\n美国在应对混业经营的发展趋势上形成了介于纵向监管和统一监管之间的“伞形监管”\n模式。在“伞形监管”模式中，美联储处于伞尖位置，负责整个金融业的监管，主要针对\n系统性风险。证券交易委员会、货币监理署等机构是对银行、证券、期货、保险等行业进\n行监管，他们处在伞骨的位置，D 项不当选。\n“双峰式”监管体制是依据金融监管目标设置两类监管机构：一类机构专门对金融机\n构和金融市场进行审慎监管，以控制金融业的系统性风险；另一类机构专门对金融机构进\n行合规性管理和保护消费者利益的管理。由题可知，英国政府设置的审慎监管局（PRA）\n和金融行为监管局（FCA）就是处于“双峰”位置。故选 C 项。", "passage": ""}, {"id": 12, "section": "econ", "type": "single", "stem": "SWIFT 是一种（… … ）。", "options": {"A": "跨境汇款形式", "B": "资金清算体系", "C": "利率报价方式", "D": "股票交易系统"}, "answer": "B", "analysis": "SWIFT 是指银行间的一种资金清算体系。故选 B 项。", "passage": ""}, {"id": 13, "section": "econ", "type": "single", "stem": "商业银行资产负债管理中，用来衡量银行净利息收入对市场利率敏感程度的方法\n是（… … ）。", "options": {"A": "敞口限额", "B": "久期分析", "C": "情景模拟", "D": "缺口分析"}, "answer": "D", "analysis": "敞口限额是针对不同金融风险以及受金融风险影响的程度以结合多种手段管\n理的一种方法，A 项不当选。久期分析是商业银行衡量利率变动对全行经济价值影响的一\n种方法，B 项不当选。情景模拟是商业银行结合设定的各种可能的情景的发生概率，研究\n多种因素同时作用可能产生的影响的一类方法，C 项不当选。缺口分析是商业银行衡量资\n产与负债之间重新定价期限和现金流量到期期限匹配情况的一种方法，利用该方法可以分\n糖糖老师：1析银行净利息收入对市场利率的敏感程度，D 项当选。故选 D 项。", "passage": ""}, {"id": 14, "section": "econ", "type": "single", "stem": "“太大而不能倒”是指大型金融机构的倒闭很可能导致金融体系的崩溃，因此监管\n机构不希望其破产并由此引发大范围危机。基于这一理念而采取的政策，可能产生的副作\n用是（… … ）。", "options": {"A": "弱化政府安全网", "B": "弱化对金融消费者的保护", "C": "强化债权人对金融机构的监督动力", "D": "强化大型金融机构的道德风险动机"}, "answer": "D", "analysis": "大型金融机构由于业务规模大、复杂程度高，发生重大风险事件或经营失败\n会给整个金融体系带来系统性风险，因此监管机构不希望其破产，但是基于这一理念而采\n取的一些保护政策，极易导致该类机构发生道德风险，反而在日常运营中更加容易开展高\n风险业务操作。故选 D 项。", "passage": ""}, {"id": 15, "section": "econ", "type": "single", "stem": "关于宏观审慎监管，以下表述错误的是（… … ）。", "options": {"A": "反映监管对金融体系逆周期效应的关注", "B": "关注点是整个金融体系", "C": "目标是抑制系统性风险的积累", "D": "强调金融体系风险的内生性"}, "answer": "A", "analysis": "112\n\n【解析】宏观审慎监管是以防范金融危机为目的，关注金融系统风险的内生性，而不\n仅仅重视外生性风险，宏观审慎的目标是抑制系统性风险的积累，防止系统性风险对整个\n金融市场产生冲击，BCD 项均正确，不当选。宏观审慎监管关注横向与时间两个维度。其\n中，横向维度关注因金融机构之间的相关性与同质性而产生的共同风险敞口问题，而共同\n风险敞口被认为是危机时期大量金融机构相继破产的重要原因；时间维度方面则关注如何\n抑制金融体系内在的顺周期特征，A 项错误，当选。故选 A 项。", "passage": ""}, {"id": 16, "section": "econ", "type": "single", "stem": "一般而言，由（… … ）引起的国际收支失衡是长期而持久的。", "options": {"A": "经济周期更迭", "B": "货币价值变动", "C": "预期目标改变", "D": "经济结构滞后"}, "answer": "D", "analysis": "很难在短时间内调整。故选 D 项。", "passage": ""}, {"id": 17, "section": "econ", "type": "single", "stem": "布雷顿森林体系形成后，美元之所以能持续广泛地发挥国际货币作用，是因为\n（… … ）。", "options": {"A": "美元的价值曾得到美国黄金的保证", "B": "美元的价值通过美国国债得到美国政府的保证", "C": "美元在特别提款权价值构成中具有最重要的作用", "D": "美国在国际货币基金组织拥有独家否决权"}, "answer": "B", "analysis": "8984351279\n【解析】一般经济周期更迭、货币价值变动、预期目标改变引起的国际收支失衡在短\n期内可以调整。经济结构滞后是由一国经济制度、要素禀赋等复杂原因造成的，一旦出现，\n【解析】布雷顿森林体系形成后，美元之所以能持续广泛地发挥国际货币作用，是因\n为美元的价值通过美国国债得到美国政府的保证。开放的美国国债市场不仅为各国的美元\n提供了购买力的栖息地，而且用美国政府的信誉为各国持有的美元提供了一定的价值担保。\n在布雷顿森林体系下，美元的价值担保是美国的黄金储备； 1973 年布雷顿森林体系崩溃后，\n这种担保便由美国政府的信誉所取代。从布雷顿森林体系崩溃前后美国国债持有者比重的\n演变趋势可以清晰地看到这一重大变化，只要美国政府和美国国会控制好美国联邦政府债\n务的增长速度，那么，流到世界各国的美元就能获得一定的价值担保，这显然有利于美元\n国际作用的继续发挥。故选 B 项。", "passage": ""}, {"id": 18, "section": "econ", "type": "single", "stem": "面对人口老龄化的严峻形势，人们纷纷选择购买养老保险来弥补退休后养老支出\n的不足。这种风险管理的策略属于（… … ）。", "options": {"A": "风险回避…………", "B": "风险自留", "C": "风险转移…………", "D": "风险分散"}, "answer": "C", "analysis": "风险回避是考虑影响预定目标达成的诸多风险因素，结合决策者自身的风险\n偏好性和风险承受能力，从而做出的中止、放弃或调整、改变某种决策方案的一种风险处\n理方式，A 项不当选。风险自留也称为风险承担，是指企业自己非理性或理性地主动承担…\n风险，即指一个企业以其内部的资源来弥补损失，B 项不当选。风险转移是指通过合同或\n非合同的方式将风险转嫁给另一个人或单位的一种风险处理方式，C 项当选。风险分散是\n指通过多样化投资分散并降低风险的一种风险处理方式，D 项不当选。故选 C 项。", "passage": ""}, {"id": 19, "section": "econ", "type": "single", "stem": "体弱多病的人比健康少病的人更愿意购买保险，这种倾向称为（… … ）。", "options": {"A": "保险意识", "B": "逆向选择", "C": "道德风险", "D": "风险偏好"}, "answer": "B", "analysis": "保险意识是人们关于保险的思想、观点及心理反应，它体现人们对保险概念、\n性质、职能作用的认识及由此产生的理论观点，以及对保险的需求、感觉和评价，A 项不\n当选。逆向选择是指投保人所做的不利于保险人的合同选择，在人身保险中，逆向选择表\n现为：有病者要求参加健康保险，职业危险性大的人要求参加意外伤害保险，死亡率高的\n\n人要求参加死亡保险等，B 项当选。道德风险也称为败德行为，是指交易双方达成协议后，\n协议的一方利用信息不对称，通过改变自己的行为来损害对方利益，C 项不当选。风险偏\n好是主动追求风险，喜欢收益的波动性胜于收益的稳定性的态度，D 项不当选。故选 B 项。", "passage": ""}, {"id": 20, "section": "econ", "type": "single", "stem": "保险人承担赔偿或给付保险金的最高限额称为（… … ）。", "options": {"A": "保险费", "B": "保险价值", "C": "保险价格", "D": "保险金额\n二、银保监计算机类专业单项选择题：每题 1 分，共 60 题，计 60 分。在每题\n给出的四个选项中，只有一项是符合题目要求的。"}, "answer": "D", "analysis": "保险金额是保险人承担赔偿或者给付保险金责任的最高限额。保险人实际赔\n偿或给付的保险金数额只能小于或等于保险金额，而不能大于保险金额。故选 D 项。\n二、银保监计算机类专业单项选择题：每题 1 分，共 60 题，计 60 分。在每题\n给出的四个选项中，只有一项是符合题目要求的。", "passage": ""}, {"id": 21, "section": "cs", "type": "single", "stem": "Windows 系统中，哪个工具可以修改注册表值？（… … ）", "options": {"A": "regconf.exe", "B": "regedit.exe", "C": "gpedit.exe", "D": "hive.bat"}, "answer": "B", "analysis": "Windows 注册表进入及修改注册表相关值的工具是 regedit.exe。gpedit.exe 是\n疑似木马文件，组策略是 gpedit.msc；hive.bat 是对 hive 中的表进行批量处理的批处理命令。\n故选 B 项。", "passage": ""}, {"id": 22, "section": "cs", "type": "single", "stem": "当我们某远程网络连接不上时，就需要跟踪路由查看，以便了解在网络的什么位\n置出现了问题，在 Windows 系统中满足该项目的的命令是（… … ）。", "options": {"A": "ping", "B": "ifconfig", "C": "traceroute", "D": "netstat"}, "answer": "C", "analysis": "traceroute（中文名“路由跟踪”）命令利用 ICMP 协议定位某计算机和目标\n计算机之间的所有路由器，能够遍历到数据包传输路径上的所有路由器。ping 用于测试计\n算机之间网络是否连通。ifconfig 工具用来获取和修改网络接口配置信息。netstat 命令用于\n显示与 IP、TCP、UDP 和 ICMP 协议相关的统计数据，一般用于检验本机各端口的网络连\n接情况。故选 C 项。", "passage": ""}, {"id": 23, "section": "cs", "type": "single", "stem": "Linux 系统中包含主机名到 IP 地址的映射关系的文件是（… … ）。", "options": {"A": "/ect/hostname", "B": "/ect/hosts", "C": "ect/resolv.conf", "D": "/ect/networks"}, "answer": "B", "analysis": "/etc/hostname 文件包含了 Linux 系统的主机名，包括完全的域名；/etc/hosts\n文件包含了 IP 地址和主机名之间的映射；/etc/resolv.conf 文件指定如何解析域名；/etc/\nnetworks 文件用来指定服务器上的网络配置信息。故选 B 项。", "passage": ""}, {"id": 24, "section": "cs", "type": "single", "stem": "在重新启动 Linux 系统的同时把内存中的信息写入硬盘，应使用（… … ）命令实现。", "options": {"A": "#reboot", "B": "#halt", "C": "#guanji", "D": "#shutdown -r now"}, "answer": "D", "analysis": "糖糖老师：1【解析】shutdown 命令可以安全地关闭或重启 Linux 系统，它在系统关闭之前给系统\n上的所有登录用户提示一条警告信息。该命令还允许用户指定一个时间参数，可以是一个\n精确的时间，也可以是从现在开始的一个时间段。精确时间的格式是 hh:mm，表示小时和\n分钟，时间段由 + 和分钟数表示。系统执行该命令后会自动进行数据同步的工作。需要特\n别说明的是该命令只能由超级用户使用。\n命令中各选项的含义为：\n\n2021 年银保监会招录考试计算机岗·专业知识真题卷答案解析\n-k 并不真正关机而只是发出警告信息给所有用户；\n-r 关机后立即重新启动；\n-h 关机后不重新启动；\n-f 快速关机重启动时跳过 fsck；\n-n 快速关机不经过 init 程序；\n-C 取消一个已经运行的 shutdown。\n文件系统写操作完成后就会停止内核。", "passage": ""}, {"id": 25, "section": "cs", "type": "single", "stem": "Windows、Unix 系统内，对文件、数据等资源的访问一般都采用（… … ）策略。", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "B", "analysis": "8984351279\nhalt 是最简单的关机命令，其实际上是调用 shutdown-h 命令。halt 执行时，杀死应用进程，\nreboot 的工作过程与 halt 类似，其作用是重新启动，而 halt 是关机。其参数也与 halt 类似。\nreboot 命令重启系统时是删除所有的进程，而不是平稳地终止它们。因此，使用 reboot 命\n令可以快速地关闭系统，但如果还有其他用户在该系统上工作，就会引起数据的丢失。所\n以使用 reboot 命令的场合主要是单用户模式。故选 D 项。\n【解析】访问控制策略包括：自主访问控制、强制访问控制、基于角色的访问控制。\n自主访问控制是根据访问者的身份和授权来决定访问模式，对访问进行限定的一种控制策\n略。强制访问控制依据主体和客体的安全级别来决定主体是否有对客体的访问权。基于角\n色的访问控制通过对角色的授权来控制用户对系统资源的访问。Windows、Unix 操作系统\n的访问控制策略基于自主访问控制。故选 B 项。", "passage": ""}, {"id": 26, "section": "cs", "type": "single", "stem": "虚拟存储器的最大容量（… … ）。\n（… … ）。", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "B", "analysis": "虚存的最大容量由 CPU 的地址长度决定。虚存的实际容量由 CPU 的地址长\n度和外存的容量决定，当 CPU 的地址长度能表示的大小远远大于外存容量时，虚存的实际\n容量为内存和外存容量之和；当外存容量远大于 CPU 字长度能表示的大小时，虚存的实际\n容量由 CPU 字长决定。一般情况下，CPU 的地址长度能表示的大小都大于外存容量。故\n选 B 项。", "passage": ""}, {"id": 27, "section": "cs", "type": "single", "stem": "在使用七氟丙烷作为灭火装置的机房着火后，在启动灭火装置之前，应该确保", "options": {"A": "所有设备已正常关机", "B": "所有人员已撤离至安全地点", "C": "灭火装置处于正常状态", "D": "灾备中心已做好应急准备"}, "answer": "B", "analysis": "七氟丙烷气体灭火系统喷射灭火剂前，所有人员必须在延时期内 (0-30S 可调 )\n撤离火情现场，灭火完毕后，必须首先启动风机，将废气排出后，人员才可进入现场。首先，\n七氟丙烷本身所具有的毒性，当浓度达到 10% 以上时，不适的感觉就会出现，时间长了，\n还会有生命危险。其次要考虑七氟丙烷在高温下进行分解所产生的分解物可能具有的危害\n性，保护区中物质燃烧可能产生的毒气对人员的伤害也是不可预计的。因此，应确保所有\n人员已撤离至安全地点之后，才能启动灭火装置。故选 B 项。\n113\n\n2021 年银保监会招录考试计算机岗·专业知识真题卷答案解析", "passage": ""}, {"id": 28, "section": "cs", "type": "single", "stem": "采用微内核结构的操作系统提高了系统的灵活性和可扩展性（… … ）。", "options": {"A": "并增强了系统的可靠性和可移植性，可运行于分布式系统中", "B": "并增强了系统的可靠性和可移植性，但不适用于分布式系统", "C": "但降低了系统的可靠性和可移植性，可运行于分布式系统中", "D": "但降低了系统的可靠性和可移植性，不适用于分布式系统"}, "answer": "A", "analysis": "微内核操作系统结构是 20 世纪 80 年代后期发展起来的，其基本思想是将操\n作系统中最基本的部分放入内核中，而把操作系统的绝大部分功能都放在微内核外面的一\n组服务器中实现。这样使得操作系统内核变得非常小，自然提高了系统的灵活性和可扩展\n性，增强了系统的可靠性和可移植性。由于它能有效地支持多处理机运行，故非常适用于\n分布式系统环境。当前比较流行的、能支持多处理机器运行的操作系统，几乎全部都采用\n了微内核结构。故选 A 项。", "passage": ""}, {"id": 29, "section": "cs", "type": "single", "stem": "私有云计算基础架构的基石是（… … ）。", "options": {"A": "虚拟化", "B": "分布式", "C": "并行", "D": "集中式"}, "answer": "A", "analysis": "私有云计算基础架构基石是虚拟化。它能将物理硬件资源虚拟化成多个虚拟\n资源，实现资源的共享，灵活调度和高效利用。故选 A 项。", "passage": ""}, {"id": 30, "section": "cs", "type": "single", "stem": "对于提升磁盘 I/O 性能问题，以下表述正确的是（… … ）。", "options": {"A": "数据库对象在物理设备上的合理分布能改善系统读写性能", "B": "磁盘镜像可以提高磁盘读写的速度", "C": "建议把数据库、回滚段、日志放在同一台设备上，以提高数据读写的性能", "D": "将磁盘升级到更大容量可提高磁盘 I/O 速度"}, "answer": "A", "analysis": "本题考查提升磁盘 I/O 的方法。数据库对象在物理设备上的合理分布能改善\n系统读写性能。不是所有的磁盘镜像都可以提高磁盘读写的速度。建议把数据库、回滚段、\n日志不要放在同一块设备上，以提高数据读写的性能。将磁盘升级到更大容量并不能提高\n磁盘 I/O 速度。故选 A 项。", "passage": ""}, {"id": 31, "section": "cs", "type": "single", "stem": "用 6 块 500G 硬盘组成的 RAID5 阵列，最大容量大概为（… … ）。", "options": {"A": "3T", "B": "2.5T", "C": "2T", "D": "1.5T"}, "answer": "B", "analysis": "RAID5 因为要容错、并行读取，就是少一个盘符的容量（用于容错备份）。\nRAID5 的可用磁盘数为：n-1。也就是说磁盘做 RAID5 后系统可使用容量为：单块磁盘容\n量 ×（n-1），所以 6 块盘的 RAID5，可用容量为：500G×（6-1）=2500G=2.5T。故选 B 项。", "passage": ""}, {"id": 32, "section": "cs", "type": "single", "stem": "某公司拟开发一个 VIP 会员管理系统，系统需根据不同的商场活动，不定期更新\nVIP 会员的审核标准和 VIP 折扣标准。针对需求，采用（… … ）架构风格最为合适。", "options": {"A": "规则系统", "B": "过程控制", "C": "事件驱动", "D": "管道—过滤器"}, "answer": "A", "analysis": "根据题意，VIP 会员管理系统需要根据不同情况制定规则。故选 A 项。", "passage": ""}, {"id": 33, "section": "cs", "type": "single", "stem": "面向对象程序设计语言不同于其他语言的最主要特点是（… … ）。", "options": {"A": "模块性", "B": "抽象性", "C": "继承性", "D": "共享性"}, "answer": "C", "analysis": "面向对象程序设计语言的特点主要有继承性、封装性和多态性。其中，继承\n性是其他类型的程序语言所不具有的。衡量一个面向对象程序设计语言成熟与否的重要标\n糖糖老师：1志之一，是看其是否建立了丰富的类库。故选 C 项。", "passage": ""}, {"id": 34, "section": "cs", "type": "single", "stem": "欲构造 ArrayList 类的一个实例，此类继承了 List 接口，下列方法正确的是（… … ）。", "options": {"A": "ArrayList myList=new Object()；", "B": "List myList=newArrayList()；", "C": "ArrayList myList=new List()；", "D": "List myList=new List()；"}, "answer": "B", "analysis": "本题考查在 Java 中如何实现接口。A 项错误，只是实例化了一个 ArrayList\n类 的 对 象 myList， 而 没 有 实 现 接 口；B 项 正 确， 用 List 来 声 明 MyList 实 现 接 口， 并 用\nArrayList 构造出一个实例；C 项错误，List 并不是一个类，不能用 new 关键字；D 项错误，\n接口不能实例化一个接口。故选 B 项。", "passage": ""}, {"id": 35, "section": "cs", "type": "single", "stem": "下面哪个不是 Java 关键词？（… … ）", "options": {"A": "integer", "B": "double", "C": "float", "D": "default"}, "answer": "A", "analysis": "114\n\n【 解 析】 下 面 这 些 是 Java 的 全 部 关 键 字：abstract …boolean …break …byte …case …catch …char …\nclass …continue …default …do …double …else …extends …final …finally …float …for …if …implements …import …instanceof …\nint … interface … long … native … new … package … private … protected … public … return … short … static … super … switch …\nsynchronized …this …throw …throws …transient …try …void …volatile …while。故选 A 项。", "passage": ""}, {"id": 36, "section": "cs", "type": "single", "stem": "下列哪项不属于软件开发中配置识别的内容？（… … ）", "options": {"A": "给每个产品和它的组件及相关的文档分配唯一的标识", "B": "定义每个配置项的重要特征以及识别其所有者", "C": "维护文档和组件的修订与产品版本之间的关系", "D": "确定配置库程序的标志和管理机制"}, "answer": "D", "analysis": "配置识别是配置管理的一个要素，包括选择一个系统的配置项和在技术文档\n本之间的关系等。故选 D 项。", "passage": ""}, {"id": 37, "section": "cs", "type": "single", "stem": "软件架构设计是降低成本、改进质量、按时或按需交付产品的关键活动，以下关\n于软件架构重要性的叙述中，错误的是（… … ）。", "options": {"A": "架构设计能够满足系统的性能、可维护性等品质", "B": "良好的架构设计能够更好地捕获并了解用户需求", "C": "架构设计能够使得不同的利益相关人达成一致的目标", "D": "架构设计能够支持项目计划和项目管理等活动"}, "answer": "B", "analysis": "8984351279\n中记录配置项的功能和物理特性。它是配置管理员（CMO）的工作职责之一，其内容包括\n（但不限于）：（1）识别需要受控的每个配置项；（2）给每个产品和它的组件及相关的\n文档分配唯一的标识；（3）定义每个配置项的重要特征以及识别其所有者；（4）识别组件、\n数据及产品获取点和准则：（5）建立和控制基线；（6）维护文档和组件的修订与产品版\n【解析】软件架构设计是降低成本、改进质量、按时和按需交付产品的关键因素。其\n重要性表现在：（1）能够满足系统的性能、安全性和可维护性等品质；（2）能够使得不\n同的利益相关人达成一致的目标；（3）能够支持项目计划和项目管理等活动；（4）能够\n为系统开发提供指导；（5）能够有效地管理复杂性；（6）能够为复用奠定基础；（7）\n能够降低维护费用；（8）能够支持冲突分析，而不是解决冲突。故选 B 项。", "passage": ""}, {"id": 38, "section": "cs", "type": "single", "stem": "与 C/S 体系结构相比，B/S 体系结构也有许多不足之处，以下说法正确的是（… … ）。", "options": {"A": "B/S 体系结构缺乏对动态页面的支持能力，没有集成有效的数据库处理能力", "B": "B/S 体系结构的系统扩展能力差，但是安全性比较容易控制", "C": "采用 B/S 体系结构的应用系统，在数据查询等响应速度上，要远远高于 C/S 体系结构", "D": "B/S 体系结构的数据提交一般以页面为单位，数据的动态交互性不强，利于在线事\n务处理（Online Transaction Processing，OLTP）应用"}, "answer": "A", "analysis": "B/S 体系结构的缺点：（1）B/S 体系结构缺乏对动态页面的支持能力，没有\n集成有效的数据库处理能力；（2）B/S 体系结构的系统扩展能力差，安全性难以控制；…\n（3）采用 B/S 体系机构的应用系统，在数据查询等响应速度上，要远远低于 C/S 体系结构；\n（4）B/S 体系结构的数据提交一般以页面为单位，数据的动态交互性不强，不利于在线事\n务处理（OLTP）应用。故选 A 项。", "passage": ""}, {"id": 39, "section": "cs", "type": "single", "stem": "当调用函数时，实参是一个数组名，则向函数传送的是（… … ）。", "options": {"A": "数组的长度", "B": "数组的首地址", "C": "数组每一个元素的地址", "D": "数组每个元素的值"}, "answer": "B", "analysis": "当调用函数时，实参是一个数组名，则向函数传送的是数组的首地址，函数\n中的形参可定义成以下三种形式：（1）形参定义成数组；（2）形参定义成可变长数组；（3）\n形参定义为指针变量。故选 B 项。", "passage": ""}, {"id": 40, "section": "cs", "type": "single", "stem": "下列语句序列执行后，K 的值是（… … ）。\nint i=6,j=8,k=10,m=7\nif（i>j || m<k--）k++;\nelse k--;", "options": {"A": "12", "B": "11", "C": "", "D": ""}, "answer": "C", "analysis": "【 解 析 】 由 题 意，m=7<10,k- 后 k=10-1=9; i>j || m<k- 条 件 值 为 真， 执 行 k++ 后\nk=10。故选 C 项。", "passage": ""}, {"id": 41, "section": "cs", "type": "single", "stem": "在软件发送故障或者未完全符合指定接口的情况下，软件产品能维持规定的性能\n级别的能力，这是指软件产品特性中的（… … ）。", "options": {"A": "容错性", "B": "易用性", "C": "易恢复性", "D": "可靠性"}, "answer": "A", "analysis": "【解析】软件可靠性是指在指定条件下使用时，软件产品维持规定的性能级别的能力，\n其子特性容错性是指在软件发生故障或者违反指定接口的情况下，软件产品维持规定的性\n能级别的能力。故选 A 项。", "passage": ""}, {"id": 42, "section": "cs", "type": "single", "stem": "以下关于集成测试的内容正确的有（… … ）。\n①集成测试也叫组装测试或者联合测试\n②在把各个模块连接起来的时候，穿越模块接口的数据是否会丢失\n③一个模块的功能是否会对另一个模块的功能产生不利的影响\n④各个子功能组合起来，能否达到预期要求的父功能\n⑤全局数据结构是否有问题\n⑥单个模块的误差累积起来，是否会放大，从而达到不能接受的程度", "options": {"A": "①②④⑤⑥", "B": "②③④⑤⑥", "C": "①②③⑤⑥", "D": "以上全部正确"}, "answer": "D", "analysis": "集成测试，也叫组装测试或联合测试。在单元测试的基础上，将所有模块按\n照设计要求（如根据结构图）组装成为子系统或系统，进行集成测试。集成测试时需要注\n意的问题包括：\n（1）把各个模块连接起来，验证穿越模块间的数据是否会丢失；\n（2）一个模块的功能是否会对另一个模块的功能产生影响；\n（3）各个子模块的功能组合起来是否达到预期的父功能；\n（4）全局的数据结构是否有问题；\n（5）每个模块的错误累加起来是否会放大，从而达到无法接受的程度。故选 D 项。", "passage": ""}, {"id": 43, "section": "cs", "type": "single", "stem": "通常测试可分为白盒测试和黑盒测试。白盒测试是根据程序的（… … ）来设计测\n试用例，黑盒测试是根据软件的规格说明来设计测试用例。", "options": {"A": "功能", "B": "性能", "C": "内部逻辑", "D": "内部数据"}, "answer": "C", "analysis": "白盒测试是根据程序的内部逻辑来设计测试用例。故选 C 项。", "passage": ""}, {"id": 44, "section": "cs", "type": "single", "stem": "软件设计中划分模块的一个准则是（… … ）。", "options": {"A": "低内聚低耦合", "B": "低内聚高耦合", "C": "高内聚低耦合", "D": "高内聚高耦合"}, "answer": "C", "analysis": "软件设计中划分模块的一个准则是高内聚低耦合。故选 C 项。", "passage": ""}, {"id": 45, "section": "cs", "type": "single", "stem": "CMU/SEI 推出的（… … ）将软件组织的过程能力分为五个成熟度级别，每一个级别\n定义一组过程能力目标，并描述了要达到这些目标应该具备的实践活动。", "options": {"A": "CMM", "B": "PSP", "C": "TSP", "D": "SSE-CMM"}, "answer": "A", "analysis": "CMM 将软件组织的过程能力分成 5 个成熟度级别，即初始级、可重复级、定\n义级、管理级和优化级。由低到高，软件开发生产精度越来越高，每单位工程的生产周期\n越来越短。故选 A 项。", "passage": ""}, {"id": 46, "section": "cs", "type": "single", "stem": "关于敏捷开发方法，以下叙述中错误的是（… … ）。", "options": {"A": "敏捷开发方法的思考角度是“面向开发过程”的", "B": "极限编程是著名的敏捷开发方法", "C": "敏捷开发方法是“适应性”而非“预设性”", "D": "敏捷开发方法是迭代增量式的开发方法"}, "answer": "A", "analysis": "敏捷开发以用户的需求进化为核心，采用迭代、循序渐进的方法进行软件开发。\n在敏捷开发中，软件项目在构建初期被切分成多个子项目，各个子项目的成果都经过测试，\n具备可视、可集成和可运行使用的特征。换言之，就是把一个大项目分为多个相互联系但\n糖糖老师：1也可独立运行的小项目，并分别完成，在此过程中软件一直处于可使用状态。故选 A 项。", "passage": ""}, {"id": 47, "section": "cs", "type": "single", "stem": "以下关于项目变更管理的叙述中，不正确的是（… … ）。", "options": {"A": "项目的任何干系人都可以提出变更请求", "B": "所有的变更请求都必须以书面形式记录", "C": "所有的变更请求都必须交由变更控制委员会审批", "D": "客户也可以作为变更控制委员会成员"}, "answer": "C", "analysis": "每项记录在案的变更请求都必须由一位责任人批准或否决，这个责任人通常\n是项目发起人或项目经理。应该在项目管理计划或组织流程中指定这位责任人。必要时，\n应该由变更控制委员会（CCB）来决策是否实施整体变更控制过程。故选 C 项。", "passage": ""}, {"id": 48, "section": "cs", "type": "single", "stem": "结构化软件开发期将软件开发划分为 3 个阶段，其中关键的是（… … ）。", "options": {"A": "编码的正确性", "B": "需求的准确性", "C": "测试的严格性", "D": "设计的科学性"}, "answer": "B", "analysis": "需求分析是设计、编码、测试工作的基础。需求是第一步，需求错了，全部皆错。\n\n2021 年银保监会招录考试计算机岗·专业知识真题卷答案解析\n故选 B 项。", "passage": ""}, {"id": 49, "section": "cs", "type": "single", "stem": "存在两个结构相同的数据库表 T1 (coll,col2,col3)、T2 (coll,col2,col3)，写出一 SQL 语\n句将所有 T1 数据导入到 T2 表。（… … ）", "options": {"A": "select coll,col2,col3 from T1 into T2 (coll,col2,col3)", "B": "insert T1 (coll,col2,col3) into T2 (coll,col2,col3)", "C": "insert into T2 (coll,col2,col3) as select coll,col2,col3 from T1", "D": "insert into……T2 (coll,col2,col3)……select coll,col2,col3 from T1"}, "answer": "D", "analysis": "将一个表数据导入另一个表：\ninsert into 目标表（字段 1，字段 2，字段 3）\nselect 字段 1，字段 2，字段 3\nfrom 源表\nwhere 条件。\n故选 D 项。", "passage": ""}, {"id": 50, "section": "cs", "type": "single", "stem": "关于用 TRUNCATE 和 DELETE 语句删除表中数据，下面哪个表述是正确的？（… … ）", "options": {"A": "TRUNCATE 命令不记录日志，DELETE 命令记录日志", "B": "TRUNCATE 命令记录日志，DELETE 命令不记录日志", "C": "TRUNCATE 命令不记录日志，DELETE 命令不记录日志", "D": "TRUNCATE 命令记录日志，DELETE 命令记录日志"}, "answer": "A", "analysis": "", "passage": ""}, {"id": 51, "section": "cs", "type": "single", "stem": "电话号码表 t_phonebook 中含有 100 万条数据，其中号码字段 phoneno 上创建了唯\n一索引，且电话号码全部由数字组成，要统计号码头为 321 的电话号码的数量，下面写法\n执行速度最慢的是（… … ）。", "options": {"A": "select count (*) from t_phonebook where phoneno>='321'and phoneno<'321A'", "B": "select count (*) from t_phonebook where phoneno like '321%'", "C": "select count (*) from t_phonebook where substr (phoneno,1,3) ='321'", "D": "select count (0) from t_phonebook where phoneno like '321%'"}, "answer": "C", "analysis": "8984351279\n【解析】TRUNCATE 执行操作时，速度更快且不可回滚，因为 TRUNCATE 操作不\n会记录到事务日志中，而 DELETE 操作会记录到事务日志中，记录日志会耗时，所以\nTRUNCATE 要快于 DELETE 且不可回滚。故选 A 项。\n【 解 析】 这 道 题 的 分 析 思 路 是 从 索 引 是 否 失 效 出 发。A 项， 使 用〈〉not in、not\nexist，对于这三种情况大多数认为结果集很大，一般大于 5% ～ 15% 就不走索引而走 FTS\n（全表扫描）。所以 A 项可能索引失效也可能不失效。C 项，在索引列上使用函数，如\nSUBSTR、DECODE、INSTR 等，对索引列进行运算，索引失效。所以 C 项是最慢的。故\n选 C 项。", "passage": ""}, {"id": 52, "section": "cs", "type": "single", "stem": "一般数据库若日志满了，则会出现（… … ）。", "options": {"A": "不能执行查询等操作", "B": "", "C": "查询、更新等操作正常进行", "D": ""}, "answer": "B", "analysis": "执行查询等读操作，不会记录到日志文件；执行更改、备份等写操作，需要\n写入日志记录。故选 B 项。", "passage": ""}, {"id": 53, "section": "cs", "type": "single", "stem": "数据库系统的并发控制是为了（… … ）。\nA. 对非授权用户限制其对数据库的变更", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "B", "analysis": "数据库系统的并发控制是为了确保数据库的完整性。故选 B 项。", "passage": ""}, {"id": 54, "section": "cs", "type": "single", "stem": "数据运行一段时间后，由于记录不断增删改，会使数据库的物理存储情况变坏，\n降低了数据的存取效率，数据库的性能也下降。这时，数据库管理员就要对数据进行（… … ）。", "options": {"A": "监控分析", "B": "空间管理", "C": "再组织和重构", "D": "参数调整"}, "answer": "C", "analysis": "数据库运行一段时间后，由于记录不断增、删、改，会使数据库的物理存储\n情况变坏，降低了数据的存取效率，数据库的性能也下降。这时，数据库管理员就要对数\n据库进行再组织和重构造。故选 C 项。", "passage": ""}, {"id": 55, "section": "cs", "type": "single", "stem": "关于索引（index）的说法哪个选项是错误的？（… … ）", "options": {"A": "创建索引能提高数据插入的性能", "B": "索引应该根据具体的检索需求来创建，在选择性好的列上创建索引", "C": "索引并非越多越好", "D": "建立索引可使检索操作更迅速"}, "answer": "A", "analysis": "索引是指根据关键字的值进行逻辑排序的一组指针，索引可以实现“排序”\n的显示功能，但不必像排序那样重新排列所有记录并产生新的表文件，从而提高数据的查\n询速度。当中的数据发生变化时，对所有打开的索引文件也同时随数据的改变自动改变记\n115\n\n2021 年银保监会招录考试计算机岗·专业知识真题卷答案解析\n录的逻辑顺序，从而降低了数据库更新的速度。故选 A 项。", "passage": ""}, {"id": 56, "section": "cs", "type": "single", "stem": "以下四个叙述中，哪一个不是对关系模式进行规范化的主要目的？（… … ）", "options": {"A": "加快查询速度", "B": "减少数据冗余", "C": "解决更新异常问题", "D": "提高存储空间效率"}, "answer": "A", "analysis": "关系模式进行规范化的目的是使结构更合理，消除存储异常，使数据冗余尽\n量小，便于插入、删除和更新。一个“不好”的关系数据库模式会存在数据冗余、更新异\n常（不一致的危险）、插入异常和删除异常四个问题。为了解决这些问题，人们才提出了\n关系数据库的规范化理论。故选 A 项。", "passage": ""}, {"id": 57, "section": "cs", "type": "single", "stem": "联机分析处理（OLAP）与联机事务处理（OLTP）的区别是（… … ）。", "options": {"A": "OLAP 针对数据库，OLTP 针对数据仓库", "B": "OLAP 要求响应时间合理，OLTP 要求响应时间快", "C": "OLAP 主要用于更新事务，OLTP 用于分析数据", "D": "OLAP 面向操作人员，OLTP 面向决策人员"}, "answer": "B", "analysis": "本题考查对数据挖掘相关概念的掌握。联机分析处理（OLAP）用于数据挖掘，\n从数据仓库中分析数据，为决策提供依据，要求响应时间合理；联机事务处理（OLTP）用\n于更新事务，将数据写入数据库，面向操作人员，要求响应时间合理。故选 B 项。", "passage": ""}, {"id": 58, "section": "cs", "type": "single", "stem": "当你用跑步时间（RunTime）、年龄（Age）、跑步时脉搏（Run Pulse）以及最高\n脉搏（Maximum Pulse）作为预测变量来对耗氧量（OxygenConsumption）进行回归时，年龄\n（Age）的参数估计是 -2.78。这意味着什么？（… … ）", "options": {"A": "年龄每增加一岁，耗氧量就增大 2.78", "B": "年龄每增加一岁，耗氧量就降低 2.78", "C": "年龄每增加 2.78 岁，耗氧量就翻倍", "D": "年龄每减少 2.78 岁，耗氧量就翻倍"}, "answer": "B", "analysis": "由数据关系分析，-2.78 表示耗氧量降低 2.78，故选 B 项。", "passage": ""}, {"id": 59, "section": "cs", "type": "single", "stem": "大数据并不都是全新的技术，如文件系统（如 Ext4）、数据库（如 Oracle），一直\n到大数据的文件系统（HDFS），分布式数据库（NoSQL 系列）在数据管理方面都秉承的\n一个思路是（… … ）。", "options": {"A": "需要对显示中的数据进行抽象", "B": "数据与元数据分开管理", "C": "都需要数据模型（Data model）的支撑", "D": "以上都是"}, "answer": "C", "analysis": "无论是文件系统、数据库，还是大数据的文件系统（HDFS），分布式数据库\n（NoSQL 系列）在数据管理方面都需要数据模型的支撑。故选 C 项。", "passage": ""}, {"id": 60, "section": "cs", "type": "single", "stem": "Internet 的网络层含有四个重要的协议，分别为（… … ）。", "options": {"A": "IP；ICMP；ARP；UDP", "B": "TCP；ICMP；UDP；ARP", "C": "IP；ICMP；ARP；RARP", "D": "UDP；IP；ICMP；RARP"}, "answer": "C", "analysis": "Internet 的网络层含有四个重要的协议，分别为 IP、ICMP、ARP、RARP。故\n选 C 项。", "passage": ""}, {"id": 61, "section": "cs", "type": "single", "stem": "将域名转换成 IP 地址是由（… … ）协议完成的。", "options": {"A": "DNS", "B": "DHCP", "C": "ARP", "D": "RARP"}, "answer": "A", "analysis": "DNS 指域名解析系统，它作为将域名和 IP 地址相互映射的一个分布式数据库，\n能够使人更方便地访问互联网。故选 A 项。", "passage": ""}, {"id": 62, "section": "cs", "type": "single", "stem": "根据 NAT 协议，下列 IP 地址中（… … ）不允许出现在因特网上。", "options": {"A": "192.172.56.23", "B": "172.15.34.128", "C": "192.168.32.17", "D": "172.128.45.34"}, "answer": "C", "analysis": "私有地址不允许出现在因特网上，主要有 A、B、C 三类，A 类地址范围\n是 10.0.0.0-10.255.255.255，B 类 地 址 范 围 是 172.16.0.0-172.31.255.255，C 类 地 址 范 围 是\n糖糖老师：1192.168.0.0-192.168.255.255。故选 C 项。", "passage": ""}, {"id": 63, "section": "cs", "type": "single", "stem": "局域网和广域网的差异不仅在于它们所覆盖的范围不同，还主要在于它们（… … ）。", "options": {"A": "所使用的介质不同", "B": "所使用的协议不同", "C": "所支持的通信量不同", "D": "所提供的服务不同"}, "answer": "B", "analysis": "可以通过覆盖的地理范围不同区分局域网和广域网，但它们之间的差异不仅\n在于此，还在于它们所采用的协议和网络技术。例如，WAN 使用存储转发的数据交换技术，\nLAN 使用共享广播的数据交换技术，这才是二者的根本区别。故选 B 项。", "passage": ""}, {"id": 64, "section": "cs", "type": "single", "stem": "根据用户需求，管理员需要将交换机 SWA 的端口 Ethernet1/0/1 配置为 Trunk 端口。\n下列哪个命令是正确的配置命令？（… … ）", "options": {"A": "[SWA] port link-type trunk", "B": "[SWA-Ethernert 1/0/1]port link-type trunk", "C": "[SWA]undo port link-type access", "D": "[SWA-Ethernert 1/0/1]undo port link-type access"}, "answer": "B", "analysis": "想让某个端口的模式改为 trunk，就必须在端口视图下进行操作，所以排除 A、\n116\n\nC 项；因为 D 项前面加入 undo，意思是删除 / 撤销。故选 B 项。", "passage": ""}, {"id": 65, "section": "cs", "type": "single", "stem": "相对于标准的子网划分，变长子网掩码划分（VLSM）与之最大的区别是（… … ）。", "options": {"A": "对于一个自然分类 IP 网络，可以采用某一任意长度的子网掩码进行子网划分", "B": "一个自然分类 IP 网络进行子网划分后，各子网的子网掩码长度可以不同", "C": "可能形成超网", "D": "使用无类地址进行网络划分\n什么？（… … ）\n8984351279"}, "answer": "B", "analysis": "变长子网掩码（VLSM），是指在一个层次结构的网络中，根据不同网段中\n的主机个数使用不同长度的子网掩码，也即可以对一个经过子网划分的网络再次划分。变\n长子网掩码的引入，有效解决了地址分配的浪费问题。和定长子网掩码相比，变长子网掩\n码的地址分配方案有效地节省了 IP 地址。同时，由于采用新的无类路由协议 RIPv2，路由", "passage": ""}, {"id": 66, "section": "cs", "type": "single", "stem": "当 Web 服务器访问人数超过了设计访问人数上限，将可能出现的 HTTP 状态码是", "options": {"A": "200 OK 请求已成功，请求所希望的响应头或数据体将随此响应返回", "B": "503 Service Unavailable 由于临时的服务器维护或者过载，服务器当前无法处理请求", "C": "403 Forbidden 服务器已经理解请求，但是拒绝执行它", "D": "302 Move temporarily 请求的资源现在临时从不同的 UR 响应请求"}, "answer": "B", "analysis": "故选 B 项。", "passage": ""}, {"id": 67, "section": "cs", "type": "single", "stem": "商业银行应采取（… … ），防范敏感信息在传输、处理、存储过程中出现泄漏或\n被篡改的风险。", "options": {"A": "冗余技术", "B": "容错技术", "C": "加密技术", "D": "双活技术"}, "answer": "C", "analysis": "8984351279\n更新中传递子网掩码信息，子网信息可以精确区分，消除了不连续地址的问题。故选 B 项。\n【解析】当 Web 服务器访问人数超过了设计访问人数上限，将可能出现的 HTTP 状态\n码是 503 Service Unavailable，即由于临时的服务器维护或者过载，服务器当前无法处理请求。\n【解析】通过加密技术，商业银行可以有效防范敏感信息在传输、处理、存储过程中\n出现泄漏或被篡改的风险。故选 C 项。", "passage": ""}, {"id": 68, "section": "cs", "type": "single", "stem": "小张需要将互联网邮箱内的一份非涉密文件转移到内网继续编辑，但单位的互联\n网与内网是物理隔离的。下列哪一种方法比较妥善？（… … ）", "options": {"A": "使用移动硬盘将文件从互联网拷贝到内网", "B": "使用刻录光盘将文件从互联网拷贝到内网", "C": "将内网计算机临时接入互联网下载文件", "D": "用手机访问互联网邮箱下载文件后用数据线导入内网"}, "answer": "B", "analysis": "《计算机信息系统国际联网保密管理规定》第六条规定：“涉及国家秘密的\n计算机信息系统，不得直接或间接地与国际互联网或其它公共信息网络相联接，必须实行\n物理隔离。”为确保涉密信息安全保密，应当严格禁止从互联网或其他公共信息网络直接\n向涉密计算机拷贝信息。如果确因工作需要拷贝的，必须采用国家保密工作部门批准的设\n备或认可的方式进行，可以通过以下途径：一是将要拷贝的刻录到空白光盘中，再通过光\n盘将拷贝的资料复制到涉密计算机上；二是先将互联网上的资料拷贝到单设的中间机上，\n彻底进行清除窃密程序和查杀病毒处理后，再拷贝到涉密计算机。严禁使用除光盘外的移\n动存储介质从连接互联网的计算机上直接拷贝文件、资料到涉密计算机上。故选 B 项。", "passage": ""}, {"id": 69, "section": "cs", "type": "single", "stem": "SSL 安全套接字协议所使用的端口是（… … ）。", "options": {"A": "80", "B": "443", "C": "1433", "D": "3389"}, "answer": "B", "analysis": "SSL 安全套接字协议所使用的端口是 443。故选 B 项。", "passage": ""}, {"id": 70, "section": "cs", "type": "single", "stem": "关于非对称密钥加密算法，下列说法错误的是（… … ）。", "options": {"A": "加密效率优于对称密钥加密的算法", "B": "多数算法都是基于某个数学难题的", "C": "收发双方持有不同的密钥", "D": "既可实现加密，也可实现数字签名"}, "answer": "A", "analysis": "非对称密钥加密算法只能对少量数据加密，对称密钥加密算法可以对批量数\n据加密，因此 A 项错误。故选 A 项。", "passage": ""}, {"id": 71, "section": "cs", "type": "single", "stem": "在网络上监听别人口令通常采取（… … ）。", "options": {"A": "蜜罐技术", "B": "拒绝服务", "C": "IP 欺骗", "D": "嗅探技术"}, "answer": "D", "analysis": "在网络上监听别人口令通常采取嗅探技术，使用嗅探器可以获取网络上流经\n的数据包。故选 D 项。", "passage": ""}, {"id": 72, "section": "cs", "type": "single", "stem": "（… … ）是创建防火墙策略的第一步内容。", "options": {"A": "以成本效益分析的方法确保应用程序", "B": "需要识别在外部访问的网络应用", "C": "需要识别在外部要访问的网络应用的脆弱性", "D": "创建一个应用程序的流量矩阵现实保护方式"}, "answer": "B", "analysis": "创建防火墙策略的第一步内容是识别在外部访问的网络应用，测试网络的连\n通性。故选 B 项。", "passage": ""}, {"id": 73, "section": "cs", "type": "single", "stem": "未授权实体得到了数据访问权限，这属于对安全的（… … ）破坏。", "options": {"A": "保密性", "B": "完整性", "C": "合法性", "D": "可用性"}, "answer": "A", "analysis": "保密性是指网络信息不被泄露给非授权的用户、实体或过程，即信息只为授\n权用户使用。故选 A 项。", "passage": ""}, {"id": 74, "section": "cs", "type": "single", "stem": "商业银行（… … ）是本机构信息科技风险管理的第一责任人。", "options": {"A": "信息科技部总经理", "B": "风险管理部负责人", "C": "法定代表人", "D": "首席信息官"}, "answer": "C", "analysis": "商业银行法定代表人是本机构信息科技风险管理的第一责任人。故选 C 项。", "passage": ""}, {"id": 75, "section": "cs", "type": "single", "stem": "信息系统安全管理人员在对一个部门的重要业务信息系统访问控制检查中发现，该\n部门特权用户太多，并且还有其他部门用户具有访问特权，对此纠正的最宜行动是（… … ）。", "options": {"A": "检查是否有有效的补偿性控制", "B": "在检查报告中记录", "C": "直接向部门负责人报告", "D": "关闭该信息系统服务"}, "answer": "A", "analysis": "特权用户管理的核心是 “最小权限原则”，但当发现特权用户过多时，需先\n确认是否存在其他安全控制（如审计、监控）来弥补潜在风险。若补偿性控制不足，再考\n虑缩减特权用户或调整权限分配。此选项体现了风险评估的系统性和管理流程的合理性。\n故选 A 项。", "passage": ""}, {"id": 76, "section": "cs", "type": "single", "stem": "信息系统网络在线的同时，不安全的身份鉴别技术是（… … ）。", "options": {"A": "信息系统运行管理方统一制发的数字证书", "B": "信息系统运行管理方统一制发的动态令牌", "C": "信息系统运行管理方统一制发的初始口令", "D": "信息系统运行管理方统一采集制发的人脸、指纹等生物特征码"}, "answer": "C", "analysis": "初始口令属于弱身份认证，一般要立即修改。故选 C 项。", "passage": ""}, {"id": 77, "section": "cs", "type": "single", "stem": "若", "options": {"A": "A 的公钥", "B": "A 的私钥", "C": "B 的公钥", "D": "B 的私钥"}, "answer": "B", "analysis": "此题是要验证 A 的身份，因此根据谁发出谁负责的原理，使用 A 的私钥，B\n收到后用 A 的公钥解密。故选 B 项。", "passage": ""}, {"id": 78, "section": "cs", "type": "single", "stem": "下列选项中（… … ）不是 APT 攻击的特点。", "options": {"A": "目标明确", "B": "持续性强", "C": "手段多样", "D": "攻击少见"}, "answer": "D", "analysis": "APT 攻击，即高级可持续威胁攻击，也称为定向威胁攻击，指某组织对特定\n对象展开的持续有效的攻击活动。这种攻击活动具有极强的隐蔽性和针对性，通常会运用\n受感染的各种介质、供应链和社会工程学等多种手段实施先进的、持久的且有效的威胁和\n攻击。故选 D 项。", "passage": ""}, {"id": 79, "section": "cs", "type": "single", "stem": "区块链系统根据应用场景和设计体系的不同而分为多种链，下列说法不正确的是\n（… … ）。", "options": {"A": "实现 IT 价值", "B": "联盟链的各个节点通常有与之对应的实体机构组织，通过授权后才能加入与退出网\n络，并共同维护区块链的健康运转", "C": "IT 风险可计量 8984351279", "D": "只有公有链和联盟链的共识机制、规则等可以通过一致的、开源的源代码进行验证"}, "answer": "D", "analysis": "糖糖老师：1【解析】根据应用场景和设计体系的不同，区块链系统一般分为公有链、联盟链和专…\n有链。\n（1）公有链的各个节点可以自由加入和退出网络，并参加链上数据的读写，运行时\n以扁平的拓扑结构互联互通，网络中不存在任何中心化的服务端节点。\n（2）联盟链的各个节点通常有与之对应的实体机构组织，通过授权后才能加入与退\n出网络，各机构组织组成利益相关的联盟，共同维护区块链的健康运转。\n（3）私有链（专有链）的各个节点的写入权限收归内部控制，而读取权限可视需求\n\n2021 年银保监会招录考试计算机岗·专业知识真题卷答案解析\n有选择性地对外开放。私有链仍然具备区块链多节点运行的通用结构，适用于特定机构的\n内部数据管理与审计。采用排除法。故选 D 项。", "passage": ""}, {"id": 80, "section": "cs", "type": "single", "stem": "商业银行实施 IT 治理框架时，最重要的目标是（… … ）。", "options": {"A": "", "B": "IT 与业务目标相一致", "C": "", "D": "增加 T 投资回报\n三、银保监计算机类专业多项选择题：每题 1 分，共 20 题，计 20 分。下面各题，\n每题至少有两个正确答案，少选、多选或错选均不得分。"}, "answer": "B", "analysis": "商业银行实施 IT 治理框架时，最重要的目标是 IT 与业务目标相一致。故选…\nB 项。", "passage": ""}, {"id": 81, "section": "multi", "type": "multi", "stem": "关于网络规划设计，正确的说法是（… … ）。", "options": {"A": "网络拓扑结构设计必须具有一定的灵活性，易于重新配置", "B": "网络拓扑结构设计应尽量避免单点故障导致整个网络无法正常运行", "C": "层化设计的优点是可以有效地将全局通信问题分解考虑", "D": "应用服务器应该放在接入层，以便客户端就近访问"}, "answer": "ABC", "analysis": "故选 ABC 项。\n8984351279\n三、银保监计算机类专业多项选择题：每题 1 分，共 20 题，计 20 分。下面各题，\n每题至少有两个正确答案，少选、多选或错选均不得分。\n【解析】应用服务器通常应部署在核心层或服务器专用区域，以确保高带宽、低延迟\n和安全管控，接入层的设计目标是终端接入，其带宽和处理能力有限，不适合部署服务器。", "passage": ""}, {"id": 82, "section": "multi", "type": "multi", "stem": "链路聚合的作用是（… … ）", "options": {"A": "增加链路带宽", "B": "可以实现数据的负载均衡", "C": "增加了交换机间的链路可靠性", "D": "可以避免交换网环路"}, "answer": "ABC", "analysis": "链路聚合是指将多个物理端口汇聚在一起，形成一个逻辑端口，以实现出 /\n入流量吞吐量在各成员端口的负荷分担，交换机根据用户配置的端口负荷分担策略决定网\n络封包从哪个成员端口发送到对端的交换机。当交换机检测到其中一个成员端口的链路发\n生故障时，就停止在此端口上发送封包，并根据负荷分担策略在剩下的链路中重新计算报\n文的发送端口，故障端口恢复后再次担任收发端口。链路聚合在增加链路带宽、实现链路\n传输弹性和工程冗余等方面是一项很重要的技术。链路聚合通常应用在汇聚层。如今的网\n络是层次化，核心层、汇聚层、接入层。汇聚层主要就是收集接入层数据，实现快速交换。\n因此它的作用是：增加链路带宽、增加链路可靠性、实现负载均衡。故选 ABC 项。", "passage": ""}, {"id": 83, "section": "multi", "type": "multi", "stem": "以下属于信息系统架构的有（… … ）。", "options": {"A": "业务架构", "B": "架构愿景\n…C. 应用系统架构", "C": "", "D": "数据架构"}, "answer": "CD", "analysis": "TOG 信息系统架构主要包括应用系统架构、数据架构。架构愿景：是一种团\n队内心的愿望，是脑筋的一幅图画，是一种驱动力，愿意实践、追求，来达到某一个境界，\n能追求到某一种成就，是团队成员希望架构往哪个方向发展，包括具体目标、设计原则、\n质量要求。企业架构的具体内容包括：业务架构、应用架构、数据架构、技术架构。故选\nCD 项。", "passage": ""}, {"id": 84, "section": "multi", "type": "multi", "stem": "在系统架构设计的非功能性需求中，系统性能需求包括（… … ）。", "options": {"A": "响应时间", "B": "吞吐量", "C": "日志保存期限", "D": "资源利用率"}, "answer": "ABD", "analysis": "系统性能需求（Performance Requirements）：指响应时间、吞吐量、准确性、\n有效性、资源利用率等与系统完成任务效率相关的指标。可靠性、可用性等指标可归为此类。\n故选 ABD 项。\n117\n\n2021 年银保监会招录考试计算机岗·专业知识真题卷答案解析", "passage": ""}, {"id": 85, "section": "multi", "type": "multi", "stem": "关于中间件，以下描述正确的有（… … ）。", "options": {"A": "使用中间件可以提高应用软件的可移植性", "B": "使用中间件会增加应用软件设计的复杂度", "C": "使用中间件有助于提高开发效率", "D": "中间件为应用软件提供特定功能的服务"}, "answer": "ACD", "analysis": "中间件是一类较为特殊的构件。中间件工作于操作系统与应用程序之间，分\n布式应用软件借助这种软件在不同的技术之间共享资源。中间件有以下几种类型：\n（1）远程过程调用：它是一种广泛使用的分布式应用程序处理方法。应用程序使用\nRPC 来远程执行一个位于不同地址空间里的过程，并且从效果上看和执行本地调用相同。\n要注意的是，这里的“远程”既可以指不同的计算机，也可以指同一台计算机上的不同进\n程。一个 RPC 应用可分为两个部分，分别是服务器和客户。这里的“服务器”和“客户”\n是指逻辑上的进程，而不是指物理计算机。\n（2）面向消息的中间件：利用高效可靠的消息传递机制进行平台无关的数据交换，\n并基于数据通信来进行分布式系统的集成。通过提供消息传递和消息排队模型，它可在分\n布式环境下扩展进程间的通信，并支持多种通信协议、语言、应用程序、硬件和软件平台。\n例如，IBM 的 MQSeries、BEA 的 MessageQ 等都属于面向消息的中间件产品。\n（3）事务处理监控器：也称为交易中间件，是当前应用最广泛的中间件之一。它能\n支持数以万计的客户进程对服务器的并发访问，使系统具有极强的扩展性。因此，适于电信、\n金融、证券等拥有大量客户的领域。在对效率、可靠性要求严格的关键任务系统中具有明\n显优势。TPM 一般支持负载均衡，支持分布式两阶段提交，保证事务完整性和数据完整性，\n并具有安全认证和 I 故障恢复等功能，能很好地满足应用开发的要求。\n（4）数据库访问中间件：通过一个抽象层访问数据库的技术，从而允许使用相同或\n相似的代码访问不同的数据库资源。例如，常见的 ODBC 与 JDBC 就属于数据库访问中间件。\n通过引入中间件技术，可以使应用软件可移植性提高、开发效率提高，同时由于一些复杂\n的应用程序之间的通信可由中间件完成，所以还降低了应用软件设计的复杂性。所以 B 项\n的描述错误。\n故选 ACD 项。", "passage": ""}, {"id": 86, "section": "multi", "type": "multi", "stem": "以下关于面向对象设计的说法正确的有（… … ）。", "options": {"A": "对象具有很强的表达能力和描述功能", "B": "对象是人们要进行研究的任何事物", "C": "对象是封装的最基本单位", "D": "类封装比对象封装更具体、更细致"}, "answer": "ABC", "analysis": "糖糖老师：1【解析】对象是问题或实现域中某些事物的一个抽象，它反映该事物在系统中需要保\n存的信息和发挥的作用；是一组属性和有权对这些属性进行操作的一组服务的封装体。类\n是具有相同属性和服务的一组对象的集合，它为属于该类的全部对象提供了统一的抽象描\n述。D 项，“类封装比对象封装更具体”，这是错误的说法。故选 ABC 项。", "passage": ""}, {"id": 87, "section": "multi", "type": "multi", "stem": "下列描述中正确的是（… … ）。", "options": {"A": "C++ 不是纯面向对象的，它兼容", "B": "Java 是纯面向对象语言的，不兼容以往的任何语言", "C": "在 Java 语言中，使用对象时必须先声明", "D": "Java 语言和 C++ 一样有指针"}, "answer": "ABC", "analysis": "Java 里面的引用类型其实就相当于 C++ 的指针，不过在 Java 中不需要对它进\n行特殊的处理。故选 ABC 项。\n118", "passage": ""}, {"id": 88, "section": "multi", "type": "multi", "stem": "下面属于软件工程原则的是（… … ）。", "options": {"A": "抽象", "B": "模块化", "C": "自底向上", "D": "信息隐蔽"}, "answer": "ABD", "analysis": "软件工程方法基本原则：\n（1）抽象：采用分层次抽象，自顶向下、逐层细化的办法控制软件开发过程的复杂性。\n（2）模块化：模块化有助于信息隐蔽和抽象，有助于表示复杂的系统。\n（3）信息隐蔽：将模块设计成“黑箱”，实现的细节隐藏在模块内部，不让模块的\n使用者直接访问，这就是信息封装。\n控制解的复杂性。\n故选 ABD 项。", "passage": ""}, {"id": 89, "section": "multi", "type": "multi", "stem": "以下关于项目管理办公室（PMO）的描述正确的是（… … ）。", "options": {"A": "PMO 在组织内部承担起了将组织战略目标通过一个个项目执行加以实现的职能", "B": "PMO 建立组织内项目管理的支撑环境", "C": "PMO 负责组织内多项目的管理和监控", "D": "PMO 和项目经理追求相同的任务目标，并受相同的需求驱动"}, "answer": "ABC", "analysis": "标和需求也有所不同。故选 ABC 项。", "passage": ""}, {"id": 90, "section": "multi", "type": "multi", "stem": "关于事务，下列说法正确的是（… … ）。", "options": {"A": "是一个很长的二进制向量和一系列随机映射函数", "B": "没有误算率", "C": "有一定的误算率", "D": "可以在 Bloom Filter 中删除元素"}, "answer": "BD", "analysis": "8984351279\n（4）局部化：保证模块之间具有松散的耦合，模块内部具有较强的内聚，这有助于\n【解析】PMO 和项目经理在组织中处于不同的层次，其工作的关注重点不同，工作目\n【解析】 事务开始于第一条可执行语句；事务结束：（1）遇到 commit 或 rollback 语句；\n（2）遇到 DDL 或 DCL 语句；（3）用户会话结束；（4）系统崩溃。故选 BD 项。", "passage": ""}, {"id": 91, "section": "multi", "type": "multi", "stem": "", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "AC", "analysis": "Bloom Filter 是一种空间效率很高的随机数据结构，是一个很长的二进制向量\n和一系列随机映射函数，它利用位数组很简洁地表示一个集合，并能判断一个元素是否属\n于这个集合，但不能插入、删除元素。Bloom Filter 的这种高效是有一定代价的：在判断一\n个元素是否属于某个集合时，有可能会把不属于这个集合的元素误认为属于这个集合（false\npositive）。Bloom Filter 在判断一个元素是否属于它表示的集合时会有一定的错误率。故选\nAC 项。", "passage": ""}, {"id": 92, "section": "multi", "type": "multi", "stem": "以下哪些是机器学习的监督学习算法？（… … ）", "options": {"A": "聚类", "B": "回归", "C": "时间序列", "D": "分类"}, "answer": "BD", "analysis": "常见的有监督学习算法：回归分析和统计分类。非监督机器学习可以分为以\n下几类：（1）聚类：K- 均值聚类、谱聚类、DBSCAN 聚类、模糊聚类、GMM 聚类、层\n次聚类等；（2）降维：PCA、t-SNE、MDS 等；（3）其他：PageRank、SOM 等。故选 BD 项。", "passage": ""}, {"id": 93, "section": "multi", "type": "multi", "stem": "防火墙需要定期监控的指标有（… … ）。", "options": {"A": "CPU 利用率", "B": "故障切换活动", "C": "conn 表大小", "D": "防火墙吞吐率"}, "answer": "ABCD", "analysis": "防火墙需要定期监控的指标有 CPU 利用率、故障切换活动、conn 表大小、\n防火墙吞吐率等。故选 ABCD 项。", "passage": ""}, {"id": 94, "section": "multi", "type": "multi", "stem": "关于 IPv6 地址 2001:0410:0000:0001:0000:0000:0000:45FF 的压缩表达方式，下列哪\n些是正确的？（… … ）", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "AC", "analysis": "B 项错在 41，D 项错在使用两个：：。故选 AC 项。", "passage": ""}, {"id": 95, "section": "multi", "type": "multi", "stem": "定期开展信息安全管理体系的有效性审查，关注的内容包括（… … ）。", "options": {"A": "信息安全管理的政策目标", "B": "信息安全事件", "C": "信息安全管理范围与计划", "D": "信息安全设备采购"}, "answer": "ABC", "analysis": "定期开展信息安全管理体系的有效性审查，关注的内容包括信息安全管理的\n政策目标、信息安全事件、信息安全管理范围与计划等。信息安全设备采购不属于定期审\n查内容。故选 ABC 项。", "passage": ""}, {"id": 96, "section": "multi", "type": "multi", "stem": "为降低信息科技风险，可采取的措施包括哪些？（… … ）", "options": {"A": "通过数据备份、双机热备等冗余手段来提升信息系统的可靠性", "B": "建立必要的安全制度和部署必要的技术手段，防范黑客和恶意软件的攻击", "C": "通过业务外包的方式，转嫁所有的安全风险", "D": "通过良好的系统设计、及时更新系统补丁，降低或减少信息系统自身的缺陷"}, "answer": "ABD", "analysis": "业务外包同样会增加信息科技风险。故选 ABD 项。", "passage": ""}, {"id": 97, "section": "multi", "type": "multi", "stem": "根据业务影响分析结果，依据业务恢复指标，制定差别化的业务恢复策略，主要\n包括（… … ）。", "options": {"A": "关键资源恢复", "B": "业务替代手段", "C": "数据追补", "D": "恢复优先级别"}, "answer": "ABCD", "analysis": "商业银行应当根据业务影响分析结果，依据业务恢复指标，制定差别化的业\n务恢复策略，主要包括关键资源恢复、业务替代手段、数据追补和恢复优先级别。故选\nABCD 项。", "passage": ""}, {"id": 98, "section": "multi", "type": "multi", "stem": "（… … ）是《中华人民共和国网络安全法》对关键信息基础设施的要求。", "options": {"A": "定期对从业人员进行网络安全教育、技术培训和技能考核", "B": "对重要系统和数据库进行容灾备份", "C": "设置专门安全管理机构和安全管理负责人，并对该负责人和关键岗位的人员进行安\n全背景审查", "D": "制定网络安全事件应急预案，并定期进行演练"}, "answer": "ABCD", "analysis": "《网络安全法》第三十四条规定，关键信息基础设施的运营者应当履行下列\n安全保护义务：\n（一）设置专门安全管理机构和安全管理负责人，并对该负责人和关键岗位的人员进\n行安全背景审查；\n（二）对重要系统和数据库进行容灾备份；\n（三）定期对从业人员进行网络安全教育、技术培训和技能考核；\n（四）制定网络安全事件应急预案，并定期进行演练。\n故选 ABCD 项。", "passage": ""}, {"id": 99, "section": "multi", "type": "multi", "stem": "身份鉴别是安全服务中的重要一环，以下关于身份鉴别的叙述正确的是（… … ）。", "options": {"A": "身份鉴别是授权控制的基础", "B": "身份鉴别没有双向的认证", "C": "数字签名可以实现身份鉴别", "D": "一般采用基于对称密钥加密的方法"}, "answer": "AC", "analysis": "身份鉴别需要提供双向的认证；目前一般采用基于对称密钥加密或公开密钥\n加密的方法。故选 AC 项。", "passage": ""}, {"id": 100, "section": "multi", "type": "multi", "stem": "下列关于操作系统漏洞的说法正确的是（… … ）。", "options": {"A": "操作系统漏洞是由于操作系统在设计与开发的时候产生的错误", "B": "在安装防火墙之后，操作系统的漏洞也就无法被攻击者或者恶意软件所利用了", "C": "操作系统漏洞可以通过手动安装补丁程序、操作系统自动更新或者各类自动打补丁\n的应用程序来修补", "D": "C., and the top officers of the 12 district Federal Reserve banks, located\nthrough the nation. The Fed's actions, described below, generally have a significant effect on the\nU.S. interest rates and, subsequently, on stock, bond, and other\nfinancial markets.\nThe Federal Reserve'\ns basic power\nis\nconcentrated in the Board of Governors, which is\nparamount（极为重要）in all policy issues concerning bank regulation and supervision and in …\nmost aspects of monetary control. The board enunciate（ 阐 明）the Fed'\nand banking matters. Because the board is not an operating agency, most of the day\nimplementation of policy decisions is left to the district Federal Reserve banks. Although commercial\nbanks put stock in the Fed, it does not imply they have direct control. The Board of Governors and\ns policies on both monetary\n-\nto\n-\nday\nthe heads of the Reserve banks orient their policies to the public interest rather than to the benefit of\nthe private banking system.\nThe U.S. banking system's regulatory apparatus is complex; the authority of the Federal\nReserve is shared in some instances, for example, in mergers or the examination of banks with\nother federal agencies such as the Controller of the Currency（COC） and the Federal Deposit\nInsurance Cooperation （FDIC）. In the critical area of regulating the nation's money supply in\naccordance with national economic goals, however, the Federal Reserve is independent within the\ngovernment."}, "answer": "ACD", "analysis": "在安装防火墙之后，操作系统的漏洞也不是绝对的安全，仍有可能被攻击者\n糖糖老师：1或者恶意软件所利用。故选 ACD 项。\n四、英语阅读理解题：每小题 0.5 分，共 20 题，计 10 分。阅读下列短文，从\n每题所给的四个选项中，选出最佳选项。", "passage": ""}, {"id": 101, "section": "eng", "type": "single", "stem": "The Fed of the United States .", "options": {"A": "function as a commercial bank when necessary", "B": "is the most powerful in the U.S. government in influencing economy", "C": "is subject to the banking community and government", "D": "is the counterpart of the central banks in other countries"}, "answer": "D", "analysis": "细节题。根据题干的关键词，可以快速定位到文章的第一段。第一段第一句\n提到美联储是美国的中央银行系统。接下来谈到，美联储还发行国家货币，执行货币政策，\n\n2021 年银保监会招录考试计算机岗·专业知识真题卷答案解析\n并在银行和银行控股公司的监督和管理中发挥重要作用。第一段最后一句提到，美联储的\n行为，通常会对美国的利率以及随后的股票、债券和其他金融市场产生重大影响。根据文\n段的内容，可以判断美联储相当于其他国家的中央银行。故选 D 项。", "passage": ""}, {"id": 102, "section": "eng", "type": "single", "stem": "The authority of the Federal Reserve .", "options": {"A": "has to be shared by other agencies", "B": "is exclusive in some important area", "C": "", "D": ""}, "answer": "B", "analysis": "推断题。根据题干的关键词，可以快速定位到文章的最后一段。最后一段提到，\n美国银行体系的监管机制很复杂，在某些情况下，比如在合并或审查银行时，美联储与其\n与其相符。故选 B 项。", "passage": ""}, {"id": 103, "section": "eng", "type": "single", "stem": "The fact that stock in the Fed belongs to commercial banks .", "options": {"A": "means the latter is in control", "B": "means the latter is controlled by the Fed", "C": "doesn't mean the latter is in control\n-\nto\n-", "D": "means there is no relationship between the Fed and commercial banks"}, "answer": "C", "analysis": "接的控制权。故选 C 项。\n8984351279\n他联邦机构如货币监理署（COC）和联邦存款保险公司（FDIC）共享权力。然而，在根据\n国家经济目标调节国家货币供应的关键领域，美联储是独立的。根据文意，可以推出 B 项\n【解析】细节题。由第二段“Although commercial banks put stock in the Fed, it does not\nimply they have direct control.”可知，虽然商业银行向美联储注资，但并不意味着它们有直", "passage": ""}, {"id": 104, "section": "eng", "type": "single", "stem": "According to the passage, which of the following statements is TRUE?（ ）", "options": {"A": "The Board of Governors performs the day\nday policies of the Fed.", "B": "The district Reserve banks are the supreme policy\n-\nmakers of the Fed.", "C": "The Fed has to work with other government agencies to fulfill its responsibilities.", "D": "The Federal Reserve System is big, complex and significant."}, "answer": "D", "analysis": "细节题。由第二段“Because the board is not an operating agency, most of the day\n-\nto\n-\nday implementation of policy decisions is left to the district Federal Reserve banks.” 可\n知，AB 项错误，不当选；由第一段“In the U.S. the functions are the responsibilities of key\nofficials of the Federal Reserve System...”可知，C 项错误，不当选。故选 D 项。", "passage": ""}, {"id": 105, "section": "eng", "type": "single", "stem": "The underlined word“apparatus”（Paragraph 3） here is closest in meaning to\n“ ”\n.", "options": {"A": "strength", "B": "structure", "C": "order", "D": "restriction\n（二）\nOrganic agriculture is a relatively untapped resource for feeding the Earth'\ns population,\nespecially in the face of climate change and other global challenges. That'\ns the conclusion I reached\n\n\nin reviewing 40 years of science comparing the long\n-\nterm prospects of organic and conventional\nfarming.\nThe review study,“Organic Agriculture in the 21st Century,”is featured as the cover story for\nthe February issue of the journey\nNature Plants.\nIt is the\nfirst to compare organic and conventional\nagriculture across the main goals of sustainability identified by the National Academy of Science:\nproductivity, economics, and environment.\nCritics have long argued that organic agriculture is inefficient, requiring more land to yield the\nsame amount of food. It'\ns true that organic farming produces lower yields, averaging 10 to 20 percent\nless than conventional.\nAdvocates contend that the environmental advantages of organic agriculture far outweigh the\nlower yields, and that increasing research and breeding resources for organic system would reduce\nthe yield gap. Sometimes excluded from these arguments is the fact that we already produce enough\nfood to more than feed the world'\ns 7.4 billion people but do not provide adequate access to all\nindividuals.\nIn some cases, organic yields can be higher than conventional. For example, in severe drought\nconditions, which are expected to increase with climate change in many areas, organic farms can\nproduce as good, if not better, yields because of the higher water\n-\nholding capacity of organically\nfarmed soils.\nWhat science does tell us is that mainstream conventional farming systems have provided\ngrowing supplies of food and other products but often at the expense of other sustainability goals.\nConventional agriculture may produce more food, but it often comes at a cost to the environment.\nBiodiversity loss, environmental degradation, and severe impacts on ecosystem services have\naccompanied conventional farming systems. With organic agriculture, environmental costs tend to be\nlower and the benefits greater.\nOverall, organic farms tend to store more soil carbon, have better soil quality, and reduce soil\nerosion compared to their conventional counterparts. Organic agriculture also creates less soil and\nwater pollution and lower greenhouse gas emissions. And it'\ns more energy\n-\nefficient because it\ndoesn'\nt rely on synthetic fertilizers or pesticides. Organic agriculture is also associated with greater\nbiodiversity of plants, animals, insects and microorganisms as well as genetic diversity.\nDespite lower yields, organic agriculture is more profitable for farmer because consumers are\nwilling to pay more. Higher prices, called price premiums, can be justified as a way to compensate\n\n\n\nfarmers for providing ecosystem services and avoiding environmental damage or external costs."}, "answer": "B", "analysis": "语义题。由第三段“The U.S. banking system's regulatory apparatus is complex...\n”\n可知，美国银行系统的监管机制很复杂。A 项，表示力量、力气、长处；B 项，表示组织、\n机构；C 项，表示命令、顺序；D 项，表示限制、约束。“apparatus”表示组织、机构，与\nB 项意思相符。故选 B 项。", "passage": ""}, {"id": 106, "section": "eng", "type": "single", "stem": "What do we learn from the conclusion of the author'\ns review study?（ ）", "options": {"A": "More resources should be tapped for feeding the world'\ns population.", "B": "Organic farming may be exploited to solve the global food problem.", "C": "The long\n-\nterm prospects of organic farming are yet to be explored.", "D": ""}, "answer": "D", "analysis": "【 解 析】 主旨题。根据题干的关键词可以快速定位到文章的第一段，由“Organic\nagriculture is a relatively untapped resource for feeding the Earth's population, especially in the\nface of climate change and other global challenges.”可以得出作者的观点——有机农业可以\n用来养活地球人口，应对环境变化和其他全球性挑战。故选 D 项。", "passage": ""}, {"id": 107, "section": "eng", "type": "single", "stem": "What is the critics'", "options": {"A": "It cannot meet the need for food.", "B": "It cannot increase farm yields.", "C": "It is not really practical.", "D": "It is not that productive.\n（ ）"}, "answer": "D", "analysis": "细节题。根据题干的关键词，可以快速定位到文章的第三段。由第三段可知，\n长期以来，批评人士认为，有机农业效率低下，需要更多的土地来生产同等数量的粮食。\n…\n…\n。\n…\n…\n。\n…\n…\n119\n\n2021 年银保监会招录考试计算机岗·专业知识真题卷答案解析\n有机农业的产量确实较低，平均比传统农业少 10% 到 20%。根据句意可以推知 D 项是批\n评反对者的理由，有机农业的产量不高。故选 D 项。", "passage": ""}, {"id": 108, "section": "eng", "type": "single", "stem": "What does the author think should be taken into account in arguing about organic farming?", "options": {"A": "Growth in world population.", "B": "Deterioration in soil quality.", "C": "Inequality in food distribution.", "D": "Advance in farming technology."}, "answer": "B", "analysis": "细节题。根据题干的关键词，可以快速定位到文章的倒数第二段，“Overall,\norganic farms tend to store more soil carbon, have better soil quality, and reduce soil erosion\ncompared to their conventional counterparts.”，由这句话可以知道，土壤质量需要被考虑到。\n故选 B 项。", "passage": ""}, {"id": 109, "section": "eng", "type": "single", "stem": "What does science tell us about conventional farming?（ ）", "options": {"A": "It will not be able to meet global food demand.", "B": "It is not conductive to sustainable development.", "C": "It will eventually give way to organic farming.", "D": "It is going mainstream throughout the world."}, "answer": "B", "analysis": "【 解 析 】 细 节 题。 由 第 六 段“What science does tell us is that mainstream conventional\nfarming systems have provided growing supplies of food and other products but often at the\nexpense of other sustainability goals.”可知，传统农业系统提供了越来越多的食物和其他产品，\n但往往是以其他可持续发展目标为代价的。故选 B 项。", "passage": ""}, {"id": 110, "section": "eng", "type": "single", "stem": "Why does the author think price premiums of organic food are justifiable?（ ）", "options": {"A": "They give farmers going organic a big competitive edge.", "B": "They motivate farmers to continue to upgrade farming technology.", "C": "Organic farming costs more than conventional farming.", "D": "Organic farming does long\n-\nterm good to ecosystem.\n（三）\nFor much of the past decade, American and British scientists have been annoyed by the\nphenomenon known as the French Paradox. Nutritionally speaking, the French have been getting\naway with murder: They eat all the butter, cream, foie gras, pastry and cheese that their hearts desire,\nand yet their rates of obesity and heart disease are much lower than ours. The French eat three times\nas much saturated animal fat as Americans do, and only a third as many die of heart attacks. It's\nmaddening.\nBaffled, scientists struggled to come up with a few hypotheses: Maybe it was something in the\nred wine, they said. But while winemakers worldwide celebrated that news, more sober research has\nsuggested that any alcohol—whether Lafite Rothschild, a banana daiquiri or a cold bud—pretty\nmuch has the same nice, relaxing effect. So while a little wine is apt to do you good, the French aren't\nso special in having a drink now and then……(though the fact that they drink wine moderately and\nslowly with meals, instead of downing shots at the bar, could make a difference).\nAfter the wine argument, scientists ventured that it must be the olive oil that keeps the French\nhealthy. But this doesn't explain the butter or brie. Then, French scientist Serge Renaud said it's the\nfoie gras that melts away cholesterol. This, too, is dicey: While people in Toulouse\n-\nthe duck\n-\nliver\n-\neating area of France—do indeed have one of the lowest rates of heart disease in the developed\nworld, they actually only eat the delicacy about six times a year. And they're a lot more likely to die\nof stroke than we are anyway.\nOther researchers, perhaps sponsored by the garlic and onion industry, suggested that the\nFrench Paradox effect is due to garlic and onions. Claude Fischler, a nutritional sociologist at\nINSERM, says all these single hypotheses are more wishful thinking than science.\nLast May, researchers writing in the British Medical Journal came up with the least cheerful\nhypothesis of all. They argued that it's just a matter of time before the French—who are in fact eating\nmore hamburgers and French fries these days—catch up with Americans, and begin suffering the\nsame high rates of cardiovascular disease.\nThese researchers, Malcolm Law and Nicholas Wald, call this the“time lag explanation”for\nthe French Paradox. As far as they are concerned, the McDonaldization (this is a French catch\n-\nall\nterm for the importation of fast food and other American cultural horrors) of France will continue at a\nfrantic pace, and it is as inevitable that French men will start keeling over（晕倒）of heart attacks\nas it is that French women will eventually wear jean shorts and marshmallow tennis shoes on the\nstreets of Paris."}, "answer": "A", "analysis": "细节题。题干问的是作者认为关于有机食品溢价合理的原因。由最后一段第一\n句“Despite lower yields, organic agriculture is more profitable for farmer because consumers are\nwilling to pay more.”可知，有机农业对农民来说是有利可图的。故选 A 项。", "passage": ""}, {"id": 111, "section": "eng", "type": "single", "stem": "What is the French Paradox according to this passage?（… … … ）", "options": {"A": "The French people eat unhealthy food and die of heart attacks each year.", "B": "The French eat more nutritious food than Americans but don't worry about getting heart", "C": "The French are much less likely to suffer from heart disease although they eat lots of fatty\n… ”.\ndisease.\nfood.\nfood.", "D": ""}, "answer": "C", "analysis": "【 解 析】 主 旨 题。 由 第 一 段 的 内 容“... yet their rates of obesity and heart disease are\nmuch lower than ours. The French eat three times as much saturated animal fat as Americans do,\nand only a third as many die of heart attacks.”可知，他们的肥胖率和心脏病发病率比我们低\n得多。法国人摄入的饱和动物脂肪是美国人的三倍，而死于心脏病的法国人只有美国人的\n三分之一。故选 C 项。", "passage": ""}, {"id": 112, "section": "eng", "type": "single", "stem": "What can be learned from the second paragraph?（… A. The French drink as much wine as people elsewhere.", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "D", "analysis": "推断题。根据第二段的内容，科学家们努力提出假设，想证明红酒里有什么\n糖糖老师：1特别的东西，其实红酒跟别的酒一样，同样有放松作用。少喝对身体有好处。法国人并不\n特别喜欢时不时地喝几杯，他们认为吃饭时缓慢地喝适量的葡萄酒会有所改变。故选 D 项。", "passage": ""}, {"id": 113, "section": "eng", "type": "single", "stem": "The underlined word “dicey” （Paragraph 3）probably means“…", "options": {"A": "satisfactory", "B": "strange", "C": "uncertain", "D": "interesting"}, "answer": "C", "analysis": "语义题。由第三段的内容“Then, French scientist Serge Renaud said it's the foie\ngras that melts away cholesterol. This, too, is dicey: While people in Toulouse —\nthe duck\n-\nliver\n-\neating area of France —\ndo indeed have one of the lowest rates of heart disease in the developed\nworld, they actually only eat the delicacy about six times a year.”可知，法国科学家认为是鹅肝\n120\n\n融化了胆固醇，这也是不确定的。虽然在法国吃鹅肝的图卢兹地区的人们，确实是发达国\n家中心脏病发病率最低的，但他们实际上一年只吃六次这种美味。故选 C 项。", "passage": ""}, {"id": 114, "section": "eng", "type": "single", "stem": "In the author's opinion, the French Paradox has something to do with … … … .", "options": {"A": "The French Paradox is due to the influence of American values.", "B": "The French Paradox will disappear in time.", "C": "The McDonaldization of France has little effect on the French's health.", "D": "There is no such thing as the French Paradox.\n（四）\nOver the past decade, American companies have tried hard to find ways to discourage senior\nmanagers from feathering their own nests at the expense of their shareholders. The three most popular\nreforms have been recruiting more outside directors in order to make boards more independent,\nlinking bosses'\npay to various performance measures, and giving them share options so that they have\nthe same long\n-\nterm interests as their shareholders.\n\n\nThese reforms have been widely adopted by America'\ns larger companies, and surveys suggest\nthat many more companies are thinking of following their lead. But have they done any good? Papers\npublished this week by Boston Academy of Management suggest otherwise. The consequences have\ndiffered from those intended.\nStart with those independent directors. On the face of it, dismissing the boss'\ns friends from\nthe board and replacing them with outsiders looks a perfect way to make senior managers more\naccountable. But the Boston papers show that bosses with a boardroom full of people generally\npleasing to outsiders. All too often, these seductions succeed. For the latter two reforms, the papers\nargue that bosses tend to attend to measures that affect their own incomes and ignore or play down\nother factors that affect a company'\ns overall success.\nIn short, bosses are quick to turn every imaginable system of corporate governance to their\nadvantage which is probably why they are the people who are put in charge of things. Here is a\nparadox for the management theorists\n—\nany boss who cannot beat a system designed to keep him or\nher under control is probably not worth having."}, "answer": "D", "analysis": "细节题。由第二段至第四段的内容可以知道，“法国式悖论”，与 ABC 项都…\n无关，所有这些悖论都是一厢情愿的想法，而不是科学。故选 D 项。", "passage": ""}, {"id": 115, "section": "eng", "type": "single", "stem": "", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "B", "analysis": "8984351279\n【解析】推断题。由第五段的内容“They argued that it's just a matter of time before the\nFrench—who are in fact eating more hamburgers and French fries these days —\ncatch up with\nAmericans, and begin suffering the same high rates of cardiovascular disease.”和最后一段的内\n容“... it is as inevitable that French men will start keeling over（晕倒）of heart attacks as it is\nthat French women will eventually wear jean shorts and marshmallow tennis shoes on the streets\nof Paris.”可知，法国人会因为吃越来越多的汉堡和薯条导致患心血管疾病的概率上升，所\n以“法国式悖论”的消失只是时间问题。故选 B 项。", "passage": ""}, {"id": 116, "section": "eng", "type": "single", "stem": "According to this passage, what is the purpose of recruiting outside directors?（ ）", "options": {"A": "To diversify the company'\ns business.", "B": "To increase collaboration among board members.", "C": "To protect the interests of shareholders.", "D": "To introduce effective reforms in business operation."}, "answer": "C", "analysis": "细节题。第一段的内容“Over the past decade, American companies have tried hard to\nfind ways to discourage senior managers from feathering their own nests at the expense of their\nshareholders. The three most popular reforms have been recruiting more outside directors in order\nto make boards more independent...”大意为：在过去的十年里，美国公司力图寻求方法阻\n止高级管理人员以牺牲股东利益为代价损公肥私的行为。为此采取了三种最流行的改革\n措施，如招募外来董事以使董事会更加独立。由此我们可以推知招募外来董事的目的是\n保护股东的利益。其中，“eathering their own nests”意为中饱私囊，“at the expense of their\nshareholders”意为以股东的利益为代价。故选 C 项。", "passage": ""}, {"id": 117, "section": "eng", "type": "single", "stem": "What do the papers of Boston Academy of Management suggest?（ ）", "options": {"A": "Boardroom reforms have failed to achieve their desired results.", "B": "Outside board directors tend to think and act differently from senior managers.", "C": "The performance of the company is negatively affected by the reforms.", "D": "Senior management suffers from the reforms."}, "answer": "A", "analysis": "细节题。由第二段最后一句“The consequences have differed from those intended.”\n…\n”\n…\n可知，改革的结果事与愿违，这是一个总的结论。根据后面引用 Boston papers 的观点…\n“... the papers argue that bosses tend to attend to measures that affect their own incomes and\nignore or play down other factors that affect a company's overall success.”可知，老板们往往只\n关注影响自身收入的指标，而忽略或者淡化那些影响公司整体成功的其他因素。根据文章\n可知，所谓的改革背离了初衷。故选 A 项。", "passage": ""}, {"id": 118, "section": "eng", "type": "single", "stem": "What is the most probable meaning of the underlined word“seductions” ?（ ）", "options": {"A": "Efforts to defeat competitors.", "B": "Endeavors to increase profits.", "C": "Attempts to win over.", "D": "Efforts to dissuade."}, "answer": "C", "analysis": "语义题。根据文章第三段的内容，从表面上看，将老板的朋友从董事会解雇，\n\n用外部人士取代他们，似乎是让高级管理人员更负责任的完美方法。但波士顿的报纸显示，\n老板们往往会组建一个对外部人士普遍顺从（取悦）的董事会。接下来提到，这些诱惑通\n常是成功的，由此我们可以推知老板的这些手段是为了争取外来董事结成联盟，进而可推知\nC 项正确。故选 C 项。", "passage": ""}, {"id": 119, "section": "eng", "type": "single", "stem": "Which of the following is TRUE according to this passage?（ ）", "options": {"A": "In general corporate executives are being criticized by outside board directors.", "B": "The income of corporate executives is proportional to profit growth.", "C": "Corporate executives tend to take advantage of their position to enrich themselves.", "D": "The performance of corporate executives affects their own interests more than those of the\nshareholders."}, "answer": "C", "analysis": "细节题。本题可用排除法。A 项，公司高管会受到外来董事的批评，文章未…\n提及；B 项，公司高层的收入与公司增长的利润成正比，也未提及；D 项，公司高层的业\n绩对其自身利益的影响大于对股东利益的影响，同样未提及；C 项，公司高层倾向于利用\n其地位肥己，与文章第三段最后一句所述之意相符。故选 C 项。", "passage": ""}, {"id": 120, "section": "eng", "type": "single", "stem": "How does the author feel about the corporate reforms?（ ）", "options": {"A": "Positive.", "B": "Doubtful.", "C": "Indifferent.", "D": "Serious.\n8984351279"}, "answer": "B", "analysis": "观点态度题。纵观全文，作者所述三项改革举措并未收到预期效果，反而适\n得其反，事与愿违，由此我们可以判断作者对其最终的结果显然持怀疑态度。故选 B 项。\n糖糖老师：1\n\n2021 年银保监会招录考试计算机岗·专业知识真题卷答案解析\n8984351279\n121", "passage": ""}]}, "2020": {"meta": {"title": "2020年 金监局·计算机岗 专业科目真题卷", "subtitle": "金融监督管理总局招录考试 · 专业知识真题卷（含解析）", "year": 2020, "total": 120, "minutes": 120, "score": 100, "source": "【2020】银保监会计算机岗·专业卷（附解析）.txt"}, "sections": [{"key": "econ", "name": "经济金融基础知识 · 单选", "range": [1, 20], "per": 0.5, "type": "single"}, {"key": "cs", "name": "计算机专业知识 · 单选", "range": [21, 80], "per": 1, "type": "single"}, {"key": "multi", "name": "计算机专业知识 · 多选", "range": [81, 100], "per": 1, "type": "multi"}, {"key": "eng", "name": "英语阅读理解 · 单选", "range": [101, 120], "per": 0.5, "type": "single"}], "questions": [{"id": 1, "section": "econ", "type": "single", "stem": "党的十九大报告指出，我国经济已由（展方式、 优化经济结构、 转换增长动力的攻关求和我国发展的战略目标。", "options": {"A": "为正值，且不断增加", "B": "", "C": "为负值，且不断减少 属于风险（ ）。", "D": ""}, "answer": "", "analysis": "参考原卷解析", "passage": ""}, {"id": 2, "section": "econ", "type": "single", "stem": "答案：B\n【解析】 供给学派着重分析税制对生产要事经营活动所关心的并不是获得的报酬或利润在累进税制条件下， 边际税率又是关键因素，资， 要看按边际税率纳税后增加的净报酬是否B 项。", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer": "", "analysis": "参考原卷解析", "passage": ""}, {"id": 3, "section": "econ", "type": "single", "stem": "答案：B\n【解析】 短期菲利普斯曲线表明高通货膨失业率是此消彼长的。 长期菲利普斯曲线是一与通货膨胀率之间不存在替代关系。故选", "options": {"A": "项。", "B": "项4.答案：B\n【解析】 根据边际效用递减规律， 件下， 随着消费者对某种商品消费量的增加， 得到的效用增量即边际效用是递减的。只要项。\n考试喵-S在一定5.答案：B\n【解析】 如果消费者对于确定性收入的偏消费者是 <script>
(function(){
"use strict";
const ALL_EXAMS = JSON.parse(document.getElementById('allExamsData').textContent);
let currentYear = '2025';
let DATA = ALL_EXAMS[currentYear];
let QS = DATA.questions, BYID = {}; QS.forEach(q=>BYID[q.id]=q);
let SECS = DATA.sections, KEY = 'jgj_' + currentYear + '_quiz_v1';

window.switchExamYear = function(year){
  currentYear = year;
  DATA = ALL_EXAMS[currentYear];
  QS = DATA.questions;
  BYID = {};
  QS.forEach(q=>BYID[q.id]=q);
  SECS = DATA.sections;
  KEY = 'jgj_' + currentYear + '_quiz_v1';
  try { S = Object.assign(defaultState(), JSON.parse(localStorage.getItem(KEY)||'{}')); }
  catch(e){ S = defaultState(); }
  render();
  toast('已切换至 ' + year + ' 年真题卷');
};
const $ = id => document.getElementById(id);

function secOf(id){ return SECS.find(s=>id>=s.range[0] && id<=s.range[1]) || SECS[0]; }
function passageOf(id){
  if(id<101) return '';
  const anchor = 101 + Math.floor((id-101)/5)*5;
  return BYID[anchor] ? BYID[anchor].passage : '';
}
const defaultState = () => ({
  mode:'practice', answers:{}, judged:{}, wrong:[], flags:{}, current:1,
  submitted:false, startedAt:null, elapsed:0, onlyWrong:false, wrongSession:null, showReport:false
});
let S;
try{ S = Object.assign(defaultState(), JSON.parse(localStorage.getItem(KEY)||'{}')); }
catch(e){ S = defaultState(); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function eq(a,b){ const x=(a||[]).slice().sort().join(''), y=(b||[]).slice().sort().join(''); return x && x===y; }
function isRight(id){ return eq(S.answers[id], (BYID[id].answer||'').split('')); }
function answeredCount(){ return Object.keys(S.answers).filter(k=>(S.answers[k]||[]).length).length; }
function activeIds(){ return (S.onlyWrong && S.wrongSession) ? S.wrongSession.slice().sort((a,b)=>a-b) : QS.map(q=>q.id); }
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1800); }

/* ---------- timer ---------- */
let tick=null;
function elapsedSec(){
  if(!S.startedAt) return S.elapsed||0;
  return Math.floor((Date.now()-S.startedAt)/1000);
}
function fmt(s){ s=Math.max(0,s); const m=Math.floor(s/60), r=s%60; return String(m).padStart(2,'0')+':'+String(r).padStart(2,'0'); }
function updateTimer(){
  const el=$('timer');
  if(S.mode!=='exam' || S.submitted){ el.hidden=true; return; }
  el.hidden=false;
  const total=DATA.meta.minutes*60, left=total-elapsedSec();
  el.textContent='剩余 '+fmt(left);
  el.classList.toggle('urgent', left<=600);
  if(left<=0){ finishExam(true); }
}
function startTimer(){ if(tick) clearInterval(tick); tick=setInterval(updateTimer,1000); updateTimer(); }
function stopTimer(){ if(tick) clearInterval(tick); tick=null; }

/* ---------- render ---------- */
function renderTop(){
  $('mPractice').classList.toggle('on', S.mode==='practice' && !S.onlyWrong);
  $('mExam').classList.toggle('on', S.mode==='exam');
  $('mWrong').classList.toggle('on', S.onlyWrong);
  const ids=activeIds();
  const done=ids.filter(i=>(S.answers[i]||[]).length).length;
  $('doneCount').textContent=done;
  $('totalCount').textContent=ids.length;
  const judged=Object.keys(S.judged).filter(k=>S.judged[k]);
  const right=judged.filter(k=>isRight(+k)).length;
  $('accRate').textContent = judged.length ? Math.round(right/judged.length*100)+'%' : '—';
  $('progressbar').style.width = (done/ids.length*100).toFixed(1)+'%';
  $('btnSubmit').textContent = (S.mode==='exam' && !S.submitted) ? '交卷并查看成绩' : '查看成绩报告';
  updateTimer();
}
function renderSheet(){
  const box=$('sheet'); box.innerHTML='';
  for(const s of SECS){
    for(let i=s.range[0]; i<=s.range[1]; i++){
      const d=document.createElement('button');
      d.className='cell'; d.textContent=i; d.dataset.id=i;
      const ans=S.answers[i];
      if(ans && ans.length){
        if(S.submitted || S.judged[i]){ d.classList.add(isRight(i)?'right':'wrong'); }
        else { d.classList.add('done'); }
      }
      if(S.flags[i]) d.classList.add('flag');
      if(S.current===i) d.classList.add('cur');
      d.onclick=()=>goto(i);
      box.appendChild(d);
    }
  }
}
function renderReport(){
  let score=0, right=0;
  const parts=SECS.map(s=>{
    let sc=0, r=0;
    for(let i=s.range[0]; i<=s.range[1]; i++){ if(isRight(i)){ sc+=s.per; r++; } }
    score+=sc; right+=r;
    return {name:s.name, score:sc, max:(s.range[1]-s.range[0]+1)*s.per, right:r, total:s.range[1]-s.range[0]+1};
  });
  const wrongs=QS.filter(q=>!isRight(q.id)).map(q=>q.id);
  $('rScore').innerHTML = score.toFixed(1).replace(/\.0$/,'') + '<small> / 100 分</small>';
  $('rInfo').innerHTML = '答对 <b>'+right+'</b> / 120 题 · 正确率 <b>'+Math.round(right/120*100)+'%</b><br>'
    + '用时 <b>'+fmt(S.elapsed||0)+'</b> · 未作答 <b>'+(120-answeredCount())+'</b> 题'
    + (S.mode==='exam' ? ' · 模拟考试' : ' · 练习模式');
  $('rGrid').innerHTML = parts.map(p=>
    '<div class="ritem"><div class="n">'+p.name+'</div><div class="v">'+p.score.toFixed(1).replace(/\.0$/,'')+'<small> / '+p.max+' 分</small></div>'
    +'<div class="n">答对 '+p.right+' / '+p.total+' 题</div></div>').join('');
  $('rWrong').innerHTML = wrongs.length
    ? wrongs.map(i=>'<button data-id="'+i+'">'+i+'</button>').join('')
    : '<span style="color:var(--ok);font-weight:700">全部答对，没有错题 🎉</span>';
  $('rWrong').querySelectorAll('button').forEach(b=>b.onclick=()=>{ S.showReport=false; save(); goto(+b.dataset.id); });
}
function renderQuestion(){
  const q=BYID[S.current], sec=secOf(q.id);
  const reveal = S.submitted || (S.mode==='practice' && S.judged[q.id]);
  $('qNum').textContent='第 '+q.id+' 题';
  $('qType').textContent = q.type==='multi'?'多选题':'单选题';
  $('qSection').textContent = sec.name.split(' · ')[0];
  $('qScore').textContent = sec.per+' 分';
  $('btnFlag').textContent = S.flags[q.id] ? '★ 已标记' : '☆ 标记';
  $('btnFlag').classList.toggle('on', !!S.flags[q.id]);

  const psg=passageOf(q.id), pb=$('passageBox');
  if(psg){ pb.hidden=false; $('passageText').textContent=psg; } else { pb.hidden=true; }
  $('qStem').textContent=q.stem;

  const chosen=S.answers[q.id]||[], correct=(q.answer||'').split('');
  const ob=$('qOptions'); ob.innerHTML='';
  ['A','B','C','D'].forEach(L=>{
    const btn=document.createElement('button');
    btn.className='opt'; btn.dataset.letter=L;
    const isSel=chosen.includes(L), isCor=correct.includes(L);
    if(reveal){
      if(isCor) btn.classList.add('correct');
      else if(isSel) btn.classList.add('incorrect');
      else btn.classList.add('dim');
    } else if(isSel) btn.classList.add('sel');
    btn.innerHTML='<span class="letter">'+L+'</span><span class="txt"></span>';
    btn.querySelector('.txt').textContent=q.options[L]||'';
    btn.onclick=()=>pick(L);
    ob.appendChild(btn);
  });

  const fb=$('feedback'), mini=$('fbmini');
  fb.className='feedback'; mini.className='fbmini';
  fb.innerHTML=''; mini.textContent='';
  if(reveal){
    const ok=isRight(q.id);
    fb.classList.add('show', ok?'ok':'no');
    const redo = (S.mode==='practice' && S.judged[q.id] && !S.submitted) ? '<button class="redobtn" id="btnRedo">↺ 重做本题</button>' : '';
    fb.innerHTML='<div class="fbhead"><span class="badge">'+(ok?'✓ 回答正确':'✕ 回答错误')+'</span><span>第 '+q.id+' 题</span>'+redo+'</div>'
      +'<div class="fbans">正确答案 <b>'+q.answer+'</b> · 你的答案 <b>'+(chosen.length?chosen.join(''):'未作答')+'</b></div>'
      +'<div class="fbtext"></div>';
    fb.querySelector('.fbtext').textContent=q.analysis||'（原卷未提供解析）';
    const rb=$('btnRedo');
    if(rb) rb.onclick=()=>{
      delete S.answers[q.id]; delete S.judged[q.id];
      S.wrong=S.wrong.filter(x=>x!==q.id);
      save(); renderQuestion();
    };
  } else if(S.mode==='exam'){
    mini.classList.add('show');
    mini.textContent = chosen.length ? '已作答：'+chosen.join('')+'　（考试模式下交卷后统一显示答案与解析）' : '考试模式：选择答案后点击「确认作答」，或直接从答题卡跳题。';
  } else if(q.type==='multi'){
    mini.classList.add('show'); mini.textContent='多选题：可选多个选项，选好后点「确认作答」（少选、多选、错选均不得分）。';
  }
  $('btnConfirm').textContent = reveal ? '下一题 →' : '确认作答';
  const ids=activeIds(), at=ids.indexOf(S.current);
  $('btnPrev').disabled = at<=0;
  $('btnNext').disabled = at>=ids.length-1;
  renderTop(); renderSheet();
}
function render(){
  $('report').classList.toggle('show', !!S.showReport);
  $('card').style.display = S.showReport ? 'none' : '';
  if(S.showReport) renderReport();
  renderQuestion();
  renderTop();
}

/* ---------- actions ---------- */
function recordWrong(id){
  if(!isRight(id) && !S.wrong.includes(id)) S.wrong.push(id);
  if(isRight(id)) S.wrong=S.wrong.filter(x=>x!==id);
}
function pick(L){
  const q=BYID[S.current];
  if(S.mode==='exam' && S.submitted) return;
  if(S.mode==='practice' && S.judged[S.current]) return;
  let a=(S.answers[S.current]||[]).slice();
  if(q.type==='single'){ a=[L]; }
  else { a = a.includes(L) ? a.filter(x=>x!==L) : a.concat(L).sort(); }
  S.answers[S.current]=a;
  if(q.type==='single' && S.mode==='practice'){
    S.judged[S.current]=true; recordWrong(S.current);
    save(); renderQuestion(); return;
  }
  if(q.type==='single' && S.mode==='exam'){
    save(); renderQuestion(); next(); return;
  }
  save(); renderQuestion();
}
function confirmAnswer(){
  if(S.submitted || (S.mode==='practice' && S.judged[S.current])){ next(); return; }
  const a=S.answers[S.current]||[];
  if(!a.length){ toast('还没选答案'); return; }
  if(S.mode==='practice'){
    S.judged[S.current]=true; recordWrong(S.current);
    save(); renderQuestion();
  } else {
    save(); renderQuestion(); next();
  }
}
function goto(id){ S.current=id; S.showReport=false; save(); render(); window.scrollTo({top:0,behavior:'smooth'}); }
function step(d){
  const ids=activeIds();
  const i=ids.indexOf(S.current);
  const t=ids[i+d];
  if(t===undefined){ toast(d>0?'已经是最后一题了':'已经是第一题了'); return; }
  goto(t);
}
function next(){ step(1); }
function prev(){ step(-1); }

function switchMode(mode){
  if(mode==='wrong'){
    if(!S.wrong.length){ toast('还没有错题，先做几道题吧'); return; }
    S.onlyWrong=true; S.mode='practice'; S.showReport=false;
    S.wrongSession=S.wrong.slice().sort((a,b)=>a-b);
    S.wrongSession.forEach(id=>{ delete S.answers[id]; delete S.judged[id]; });
    S.current=S.wrongSession[0];
    stopTimer();
  } else {
    S.onlyWrong=false; S.wrongSession=null; S.mode=mode; S.showReport=false;
    if(mode==='exam'){
      if(!S.startedAt && !S.submitted){ S.startedAt=Date.now(); }
      startTimer();
    } else { stopTimer(); }
  }
  save(); render();
  if(mode==='wrong') toast('共 '+S.wrongSession.length+' 道错题，答对后自动移出错题本');
  if(mode==='exam' && !S.submitted) toast('模拟考试开始：120 分钟倒计时，交卷后统一判分');
}
function finishExam(auto){
  if(S.mode!=='exam' || S.submitted) return;
  S.elapsed=elapsedSec(); S.startedAt=null; S.submitted=true; S.showReport=true;
  QS.forEach(q=>{ if(!isRight(q.id) && !S.wrong.includes(q.id)) S.wrong.push(q.id); });
  stopTimer(); save(); render();
  toast(auto?'考试时间到，已自动交卷':'已交卷，成绩报告已生成');
}
function resetAll(){
  if(!confirm('确定清空所有作答记录、错题本和计时吗？此操作不可撤销。')) return;
  stopTimer(); S=defaultState(); save(); render(); toast('已清空，可以重新开始');
}

/* ---------- events ---------- */
$('mPractice').onclick=()=>switchMode('practice');
$('mExam').onclick=()=>switchMode('exam');
$('mWrong').onclick=()=>switchMode('wrong');
$('btnSubmit').onclick=()=>{
  if(S.mode==='exam' && !S.submitted){ finishExam(false); }
  else { S.showReport=true; save(); render(); }
};
$('btnReset').onclick=resetAll;
$('btnReset2').onclick=resetAll;
$('btnFlag').onclick=()=>{ S.flags[S.current]=!S.flags[S.current]; save(); renderQuestion(); };
$('btnPrev').onclick=prev;
$('btnNext').onclick=next;
$('btnConfirm').onclick=()=>confirmAnswer();
$('rBack').onclick=()=>{ S.showReport=false; save(); render(); };
$('rRestart').onclick=resetAll;
$('btnToggle').onclick=()=>$('side').classList.toggle('collapsed');
document.addEventListener('keydown',e=>{
  if(e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  const k=e.key.toLowerCase();
  if('abcd'.includes(k) && k.length===1){ pick(k.toUpperCase()); e.preventDefault(); return; }
  if('1234'.includes(k) && k.length===1){ pick('ABCD'[+k-1]); e.preventDefault(); return; }
  if(k==='arrowright'){ next(); e.preventDefault(); }
  if(k==='arrowleft'){ prev(); e.preventDefault(); }
  if(k==='enter'){
    if(S.showReport){ S.showReport=false; save(); render(); }
    else if(S.submitted || (S.mode==='practice' && S.judged[S.current])) next();
    else confirmAnswer();
    e.preventDefault();
  }
});
function adapt(){
  const narrow=window.innerWidth<=960;
  $('btnToggle').style.display = narrow ? '' : 'none';
}
window.addEventListener('resize',adapt);
adapt();
if(S.mode==='exam' && !S.submitted && S.startedAt) startTimer();
render();
})();
</script>
