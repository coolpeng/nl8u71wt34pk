all your web activities, such as which site you visit next, how long you stay there, whether youclick on advertisements, etc. All this information is available to marketers, who use it to market more effectively to you. Not only do you not get paid for providing the information, you probablydon’t even know that you are giving it.","options":{"A":"show the good services offered in some web restaurants","B":"criticize some restaurants for the poor services","C":"show the Internet’s ability to collect data on you","D":"prove the incredible power of the Internet to change your diet"},"answer":"C","analysis":"本题属于推理判断题。题目意为：作者编造了餐馆里的故事目的是________ 。A 项，“展示一些互联网餐厅提供的良好服务”；B 项，“批评一些餐馆服务差劲”；C 项，“显示互联网收集你的数据的能力”；D 项，“证明互联网有不可思议的力量能改变你的饮食”。根据主题句：To some, this is the restaurant equivalent of the Internet.The Net’s ability toprofile you through your visits to and interactions at websites provides marketers with anenormous amount of data on you—some of which you may not want them to have.可知，作者编造餐馆里的故事目的是为了展示互联网收集你个人信息的能力。故选C 项。"},{"id":113,"section":"eng","type":"single","stem":"What can be learned about “cookie”?","passage":"Imagine you went to a restaurant with your girlfriend, had a burger, paid with a credit card, and left. The next time you go there, the waiter or waitress, armed with your profile data, greets you with, “Hey Joe, how are you? Mary is over there in the seat you sat last time. Would you like to join her for dinner again?” Then you find out that your burger has been cooked and placed onthe table. Forget the fact that you are with another date and are on a diet that doesn’t include burgers. Sound a little bizarre? To some, this is the restaurant equivalent of the Internet. The Net’s ability to profile you through your visits to and interactions at websites provides marketers with anenormous amount of data on you—some of which you may not want them to have. Are you aware that almost every time you access a website you get a “cookie”? Unfortunately, it’s not the Mrs. Field’s recipe. A cookie on the Internet is a computer code sent bythe site to your computer—usually without your knowledge. During the entire period of time that you are at the site, the cookie is collecting information about yourself, including where you visit, how long you stay there, and how frequently you return to certain pages. While this may sound scary enough, cookies aren’t even the latest in technology. Anewsystem called I-librarian Alexa—named after the legendary third century B.C.library in Alexandria, Egypt—does even more. While cookies track what you are doing at one site. Alexa collects data on all your web activities, such as which site you visit next, how long you stay there, whether youclick on advertisements, etc. All this information is available to marketers, who use it to market more effectively to you. Not only do you not get paid for providing the information, you probablydon’t even know that you are giving it.","options":{"A":"It was created by Mrs.Field.","B":"It collects information on you usually without you knowing it.","C":"It is a hardware needed to access to your computer.","D":"It is the latest in technology."},"answer":"B","analysis":"本题属于细节理解题。题目意为：关于 cookie 我们可以了解到什么？选择依据是第二段第三句及第四句。A 项，“它由菲尔德夫人创造”；B 项，“它通常在您不知道的情况下收集您的信息”；C 项，“它是访问您计算机所需的硬件”；D 项，“它是最新的技 术 ”根 据 主 题 句 ： A cookie on the Internet is a computer code sent by the site to your computer—usually without your knowledge.During the entire period of time that you are at the site, the cookie is collecting information about yourself, including where you visit, howlong youstay there, and how frequently you return to certain pages.可知，cookie 在您不知情的情况下收集您的信息。故选 B 项。"},{"id":114,"section":"eng","type":"single","stem":"What can be learned about “Alexa”?","passage":"Imagine you went to a restaurant with your girlfriend, had a burger, paid with a credit card, and left. The next time you go there, the waiter or waitress, armed with your profile data, greets you with, “Hey Joe, how are you? Mary is over there in the seat you sat last time. Would you like to join her for dinner again?” Then you find out that your burger has been cooked and placed onthe table. Forget the fact that you are with another date and are on a diet that doesn’t include burgers. Sound a little bizarre? To some, this is the restaurant equivalent of the Internet. The Net’s ability to profile you through your visits to and interactions at websites provides marketers with anenormous amount of data on you—some of which you may not want them to have. Are you aware that almost every time you access a website you get a “cookie”? Unfortunately, it’s not the Mrs. Field’s recipe. A cookie on the Internet is a computer code sent bythe site to your computer—usually without your knowledge. During the entire period of time that you are at the site, the cookie is collecting information about yourself, including where you visit, how long you stay there, and how frequently you return to certain pages. While this may sound scary enough, cookies aren’t even the latest in technology. Anewsystem called I-librarian Alexa—named after the legendary third century B.C.library in Alexandria, Egypt—does even more. While cookies track what you are doing at one site. Alexa collects data on all your web activities, such as which site you visit next, how long you stay there, whether youclick on advertisements, etc. All this information is available to marketers, who use it to market more effectively to you. Not only do you not get paid for providing the information, you probablydon’t even know that you are giving it.","options":{"A":"Alexa is named after an ancient hero in Egypt.","B":"Alexa is installed in libraries.","C":"Alexa can provide all the necessary information about history.","D":"Alexa can provide more data to marketers than a cookie."},"answer":"D","analysis":"本题属于细节推理题。题目意为：关于 Alexa 我们可以了解到什么？A项，“Alexa 是以埃及的一位古代英雄命名的”；B 项，“Alexa 被安装在图书馆里”；C 项，“Alexa可以提供所有有关历史的必要信息”；D 项，“与 cookie 相比，Alexa 可以向营销人员提供更多的数据。”根据主题句：A new system called I-librarian Alexa―named after the legendarythird century B.C.library in Alexandria, Egypt―does even more.可知，和cookie 相比，Alexa 能够为营销人员提供更多的数据。故选 D 项。"},{"id":115,"section":"eng","type":"single","stem":"Which of the following can best reflect the author’s attitude towards cookies and Alexa?","passage":"Imagine you went to a restaurant with your girlfriend, had a burger, paid with a credit card, and left. The next time you go there, the waiter or waitress, armed with your profile data, greets you with, “Hey Joe, how are you? Mary is over there in the seat you sat last time. Would you like to join her for dinner again?” Then you find out that your burger has been cooked and placed onthe table. Forget the fact that you are with another date and are on a diet that doesn’t include burgers. Sound a little bizarre? To some, this is the restaurant equivalent of the Internet. The Net’s ability to profile you through your visits to and interactions at websites provides marketers with anenormous amount of data on you—some of which you may not want them to have. Are you aware that almost every time you access a website you get a “cookie”? Unfortunately, it’s not the Mrs. Field’s recipe. A cookie on the Internet is a computer code sent bythe site to your computer—usually without your knowledge. During the entire period of time that you are at the site, the cookie is collecting information about yourself, including where you visit, how long you stay there, and how frequently you return to certain pages. While this may sound scary enough, cookies aren’t even the latest in technology. Anewsystem called I-librarian Alexa—named after the legendary third century B.C.library in Alexandria, Egypt—does even more. While cookies track what you are doing at one site. Alexa collects data on all your web activities, such as which site you visit next, how long you stay there, whether youclick on advertisements, etc. All this information is available to marketers, who use it to market more effectively to you. Not only do you not get paid for providing the information, you probablydon’t even know that you are giving it.","options":{"A":"Doubtful.","B":"Approving.","C":"Welcoming.","D":"Optimistic."},"answer":"A","analysis":"本题属于观点态度题。题目意为：以下哪一项最能反映作者对于cookies 和Alexa 的态度？判断依据是文中作者所使用的一些词句，如：usually without your knowledge, sound scary 及最后一句。这些显示了作者对 cookie 和 Alexa 持的态度不是正面的，A项“怀疑的”；B 项“赞成的”；C 项“欢迎的”；D 项“乐观的”。根据主题句：Not only doyou not get paid for providing the information, you probably don’t even know that you are givingit.可知，作者对于 cookies 和 Alexa 持怀疑的态度。故选 A 项。 （四）"},{"id":116,"section":"eng","type":"single","stem":"According to the first two paragraphs, what will banks in Europe be forced to do?","passage":"The data a bank has stored on its servers is more valuable than the gold in its vaults. Banks enjoy a monopoly over data that has helped them get away with poor services and fend off competitors. In Europe, at least, that is all about to change with a new set of regulations, named PSD2.The rules will compel banks to share data easily with licensed third parties. Bankers in Europe complain that their profits and customer relationships are under threat. However, openingup banks, and the data they store, is good for consumers and competition. New providers will be better placed to offer all sorts of innovative services, such as a one-click option to put unspent monthly income into a pension plan. Nevertheless, some concerns about PSD2 are legitimate. In particular, it is reasonable to wonder about the privacy and security implications of sensitive financial data being shared with third parties. But banks themselves are hardly invulnerable to cyber attacks (网络攻击). And the solutions that the European regulators propose to deal with these worries look promising. Third parties that want to use bank data will need to convince national regulators that their data defenses are solid and are subject to annual regulatory inspections. The gap between writing rules and implementing them is always large. First, consent fromcustomers to provide access to their bank data must be gained explicitly, and the purposes of the data use should be clearly explained. Second, regulators must be very tough both in ensuring that banks open up their infrastructure and in withdrawing the licenses of third parties that break the rules. Third, regulators must also be flexible enough to allow for changes as the market evolves. Since the new entrants will not be licensed to engage in riskier financial activities-such as lending money-it makes sense to regulate them with a lighter touch. But if some Fintech providers do endup becoming systemically important, higher standards of oversight might be necessary.","options":{"A":"To keep clients’data safe.","B":"To close down the poor services.","C":"To give up their data monopoly.","D":"To disclose their sources of profits."},"answer":"C","analysis":"本题属于细节推断题。题目意为：根据前两段，欧洲银行被迫做什么？从第一段第二句：Banks enjoy a monopoly over data that has helped them get away with poor services and fend off competitors.可知，银行对数据享有垄断地位，第二段第一句The rules will compel banks to share data easily with licensed third parties.说银行不得不与第三方共享数据，可见，银行放弃了他们在数据上的垄断。A 项“保持客户数据安全”；B 项“关闭劣质服务”；C项“放弃他们的数据垄断”；D 项“披露他们的利润来源”。故选 C 项。"},{"id":117,"section":"eng","type":"single","stem":"What can be inferred from passage on the effects of PSD2 in the second paragraph?","passage":"The data a bank has stored on its servers is more valuable than the gold in its vaults. Banks enjoy a monopoly over data that has helped them get away with poor services and fend off competitors. In Europe, at least, that is all about to change with a new set of regulations, named PSD2.The rules will compel banks to share data easily with licensed third parties. Bankers in Europe complain that their profits and customer relationships are under threat. However, openingup banks, and the data they store, is good for consumers and competition. New providers will be better placed to offer all sorts of innovative services, such as a one-click option to put unspent monthly income into a pension plan. Nevertheless, some concerns about PSD2 are legitimate. In particular, it is reasonable to wonder about the privacy and security implications of sensitive financial data being shared with third parties. But banks themselves are hardly invulnerable to cyber attacks (网络攻击). And the solutions that the European regulators propose to deal with these worries look promising. Third parties that want to use bank data will need to convince national regulators that their data defenses are solid and are subject to annual regulatory inspections. The gap between writing rules and implementing them is always large. First, consent fromcustomers to provide access to their bank data must be gained explicitly, and the purposes of the data use should be clearly explained. Second, regulators must be very tough both in ensuring that banks open up their infrastructure and in withdrawing the licenses of third parties that break the rules. Third, regulators must also be flexible enough to allow for changes as the market evolves. Since the new entrants will not be licensed to engage in riskier financial activities-such as lending money-it makes sense to regulate them with a lighter touch. But if some Fintech providers do endup becoming systemically important, higher standards of oversight might be necessary.","options":{"A":"Customers are more likely to enjoy more innovative services.","B":"People will no longer go to banks to deposit their money.","C":"Service providers do not want to partner with banks.","D":"People will receive more pension."},"answer":"A","analysis":"本题属于细节推断题。题目意为：在第二自然段中，有关PSD2 的影响我们从文中可以推断出什么？从第二段第二句和第三句“However, opening up banks, and the data they store, is good for consumers and competition.New providers will be better placed to offer all sorts of innovative services, such as a one-click option to put unspent monthly income intoa pension plan.”可知，竞争中新的服务提供商将更好地提供各种创新服务。A 项“客户更有可能享受更多创新服务”；B 项“人们不再去银行存钱了”；C 项“服务提供商不想与银行合作”；D 项“人们会得到更多的退休金”。故选 A 项。"},{"id":118,"section":"eng","type":"single","stem":"According to paragraph 3, what is the probable reason that privacy concerns about PSD2are unnecessary?","passage":"The data a bank has stored on its servers is more valuable than the gold in its vaults. Banks enjoy a monopoly over data that has helped them get away with poor services and fend off competitors. In Europe, at least, that is all about to change with a new set of regulations, named PSD2.The rules will compel banks to share data easily with licensed third parties. Bankers in Europe complain that their profits and customer relationships are under threat. However, openingup banks, and the data they store, is good for consumers and competition. New providers will be better placed to offer all sorts of innovative services, such as a one-click option to put unspent monthly income into a pension plan. Nevertheless, some concerns about PSD2 are legitimate. In particular, it is reasonable to wonder about the privacy and security implications of sensitive financial data being shared with third parties. But banks themselves are hardly invulnerable to cyber attacks (网络攻击). And the solutions that the European regulators propose to deal with these worries look promising. Third parties that want to use bank data will need to convince national regulators that their data defenses are solid and are subject to annual regulatory inspections. The gap between writing rules and implementing them is always large. First, consent fromcustomers to provide access to their bank data must be gained explicitly, and the purposes of the data use should be clearly explained. Second, regulators must be very tough both in ensuring that banks open up their infrastructure and in withdrawing the licenses of third parties that break the rules. Third, regulators must also be flexible enough to allow for changes as the market evolves. Since the new entrants will not be licensed to engage in riskier financial activities-such as lending money-it makes sense to regulate them with a lighter touch. But if some Fintech providers do endup becoming systemically important, higher standards of oversight might be necessary.","options":{"A":"Third parties will have to buy fraud insurance.","B":"Regulators have come up with promising solutions.","C":"Banks’defense against cyber attacks is strong.","D":"Third parties will check clients’data monthly."},"answer":"B","analysis":"本题属于细节推断题。题目意为：根据第三段，PSD2 的隐私问题没有必要担心的可能原因是什么？从第三段第三句可知：And the solutions that the European regulators propose to deal with these worries look promising.欧洲监管机构提出的解决这些担忧的方案看起来很有希望。A 项，“第三方将不得不购买欺诈保险”；B 项，“监管机构提出了有希望的解决方案”；C 项，“银行对网络攻击的防御很强”；D 项，“第三方每月检查客户数据”。故选 B 项。"},{"id":119,"section":"eng","type":"single","stem":"Which of the following is true in order to successfully implement PSD2?","passage":"The data a bank has stored on its servers is more valuable than the gold in its vaults. Banks enjoy a monopoly over data that has helped them get away with poor services and fend off competitors. In Europe, at least, that is all about to change with a new set of regulations, named PSD2.The rules will compel banks to share data easily with licensed third parties. Bankers in Europe complain that their profits and customer relationships are under threat. However, openingup banks, and the data they store, is good for consumers and competition. New providers will be better placed to offer all sorts of innovative services, such as a one-click option to put unspent monthly income into a pension plan. Nevertheless, some concerns about PSD2 are legitimate. In particular, it is reasonable to wonder about the privacy and security implications of sensitive financial data being shared with third parties. But banks themselves are hardly invulnerable to cyber attacks (网络攻击). And the solutions that the European regulators propose to deal with these worries look promising. Third parties that want to use bank data will need to convince national regulators that their data defenses are solid and are subject to annual regulatory inspections. The gap between writing rules and implementing them is always large. First, consent fromcustomers to provide access to their bank data must be gained explicitly, and the purposes of the data use should be clearly explained. Second, regulators must be very tough both in ensuring that banks open up their infrastructure and in withdrawing the licenses of third parties that break the rules. Third, regulators must also be flexible enough to allow for changes as the market evolves. Since the new entrants will not be licensed to engage in riskier financial activities-such as lending money-it makes sense to regulate them with a lighter touch. But if some Fintech providers do endup becoming systemically important, higher standards of oversight might be necessary.","options":{"A":"Customers are forced to share their bank data.","B":"Banks are required to open up their entire operational system.","C":"Regulators should be both tough and flexible.","D":"Banks and third parties should be regulated with a light touch."},"answer":"C","analysis":"本题属于细节推断题。题目意为：为了成功实施 PSD2，以下哪一项是正确的？A 项，“客户被迫分享他们的银行数据”；B 项“银行被要求开放整个操作系统”；C 项，“监管机构应该既强硬又灵活”；D 项，“银行和第三方应该受到轻微管制”。根据原文最后一段第三句和第四句“Second, regulator must be very tough both in ensuring that banks openup their infrastructure and in withdrawing the licenses of third parties that break the rules.Third, regulators must also be flexible enough to allow for changes as the market evolves.”可知，监管机构需要既强硬又灵活。故选 C 项。"},{"id":120,"section":"eng","type":"single","stem":"What is the passage mainly about?","passage":"The data a bank has stored on its servers is more valuable than the gold in its vaults. Banks enjoy a monopoly over data that has helped them get away with poor services and fend off competitors. In Europe, at least, that is all about to change with a new set of regulations, named PSD2.The rules will compel banks to share data easily with licensed third parties. Bankers in Europe complain that their profits and customer relationships are under threat. However, openingup banks, and the data they store, is good for consumers and competition. New providers will be better placed to offer all sorts of innovative services, such as a one-click option to put unspent monthly income into a pension plan. Nevertheless, some concerns about PSD2 are legitimate. In particular, it is reasonable to wonder about the privacy and security implications of sensitive financial data being shared with third parties. But banks themselves are hardly invulnerable to cyber attacks (网络攻击). And the solutions that the European regulators propose to deal with these worries look promising. Third parties that want to use bank data will need to convince national regulators that their data defenses are solid and are subject to annual regulatory inspections. The gap between writing rules and implementing them is always large. First, consent fromcustomers to provide access to their bank data must be gained explicitly, and the purposes of the data use should be clearly explained. Second, regulators must be very tough both in ensuring that banks open up their infrastructure and in withdrawing the licenses of third parties that break the rules. Third, regulators must also be flexible enough to allow for changes as the market evolves. Since the new entrants will not be licensed to engage in riskier financial activities-such as lending money-it makes sense to regulate them with a lighter touch. But if some Fintech providers do endup becoming systemically important, higher standards of oversight might be necessary.","options":{"A":"Challenges facing European regulators.","B":"A new regulation in Europe that opens banks to competition.","C":"The solutions to the flawed banking system in Europe.","D":"A looming threat to customers’private bank data."},"answer":"B","analysis":"本题属于主旨大意题。题目意为：这篇文章的主要内容是什么？A 项，“欧洲监管机构面临的挑战”；B 项，“欧洲的一项新规则，让银行走向竞争”；C 项，“欧洲有缺陷的银行体系的解决方案”；D 项，“客户私人银行数据迫在眉睫的威胁”。根据主题句The rules will compel banks to share data easily with licensed third parties.Bankers in Europe complain that their profits and customer relationships are under threat.可知，本文主要讲的是欧洲开放银行竞争新规则。故选 B 项。"}]},"2020":{"meta":{"total":120,"source":"2020 年银保监会/金监局计算机岗专业卷（PDF 原文重提取）"},"sections":[{"key":"econ","name":"经济金融基础知识 · 单选","range":[1,20],"per":0.5,"type":"single"},{"key":"cs","name":"计算机专业知识 · 单选","range":[21,80],"per":1,"type":"single"},{"key":"multi","name":"计算机专业知识 · 多选","range":[81,100],"per":1,"type":"multi"},{"key":"eng","name":"英语阅读理解 · 单选","range":[101,120],"per":0.5,"type":"single"}],"questions":[{"id":1,"section":"econ","type":"single","stem":"党的十九大报告指出，我国经济已由（ ）阶段转向（ ）阶段，正处在转变发展方式、优化经济结构、转换增长动力的攻关期，建设现代化经济体系是跨越关口的迫切要求和我国发展的战略目标。","passage":"","options":{"A":"高速增长，高水平发展","B":"高速发展，高水平发展","C":"高速增长，高质量发展","D":"高速发展，高质量发展"},"answer":"C","analysis":"党的十九大提出，我国经济已由高速增长阶段转向高质量发展阶段，正处在转变发展方式、优化经济结构、转换增长动力的攻关期，建设现代化经济体系是跨越关口的迫切要求和我国发展的战略目标。故选 C 项。"},{"id":2,"section":"econ","type":"single","stem":"供给学派提出的供给管理的政策思想核心是（ ）。","passage":"","options":{"A":"增加政府支出","B":"减税","C":"扩大货币发行量","D":"增加投资"},"answer":"B","analysis":"供给学派着重分析税制对生产要素供给和利用的效果，他们指出，经济主体从事经营活动所关心的并不是获得的报酬或利润总额，而是减去各种纳税后的报酬或利润净额。在累进税制条件下，边际税率又是关键因素，因为经济主体是否多做工作，或增加储蓄和投资，要看按边际税率纳税后增加的净报酬是否合算。供给学派经济政策的核心是减税。故选B 项。"},{"id":3,"section":"econ","type":"single","stem":"货币主义认为，菲利普斯曲线所表示的失业与通货膨胀之间的交替关系（）。","passage":"","options":{"A":"只存在于长期","B":"只存在于短期","C":"长短期均存在","D":"长短期均不存在"},"answer":"B","analysis":"短期菲利普斯曲线表明高通货膨胀率与高失业率不会同时发生，通货膨胀率与失业率是此消彼长的。长期菲利普斯曲线是一条位于“自然失业率”的垂直线，表明失业率与通货膨胀率之间不存在替代关系。故选 B 项。"},{"id":4,"section":"econ","type":"single","stem":"当总效用增加时，边际效用应该（ ）。","passage":"","options":{"A":"为正值，且不断增加","B":"为正值，但不断减少","C":"为负值，且不断减少","D":"为正值，可能增加也可能减少"},"answer":"B","analysis":"根据边际效用递减规律，在一定时间内，在其他商品的消费数量保持不变的条件下，随着消费者对某种商品消费量的增加，消费者从该商品连续增加的每一消费单位中所得到的效用增量即边际效用是递减的。只要边际效用大于零，总效用就是增加的。故选B项。"},{"id":5,"section":"econ","type":"single","stem":"如果消费者对于确定性收入的偏好小于有风险条件下期望收入的偏好，那么该消费者属于风险（ ）。","passage":"","options":{"A":"回避者","B":"爱好者","C":"中立者","D":"承担者"},"answer":"B","analysis":"如果消费者对于确定性收入的偏好大于有风险条件下期望收入的偏好，那么该消费者是风险回避者；如果消费者对于确定性收入的偏好小于有风险条件下期望收入的偏好，那么该消费者是风险爱好者；如果消费者对于确定性收入的偏好等于有风险条件下期望收入的偏好，那么该消费者是风险中立者。故选 B 项。"},{"id":6,"section":"econ","type":"single","stem":"一个商品价格下降对其互补品最直接的影响是（ ）。","passage":"","options":{"A":"互补品的需求曲线向右移动","B":"互补品的需求曲线向左移动","C":"互补品的供给曲线向右移动","D":"互补品的价格上升"},"answer":"A","analysis":"商品价格下降会导致该商品的需求量增加，从而其互补品的需求也会增加，在图形上表现为互补品需求曲线向右移动。故选 A 项。"},{"id":7,"section":"econ","type":"single","stem":"货币在执行（ ）的职能中产生了信用货币。","passage":"","options":{"A":"支付手段","B":"价值尺度","C":"流通手段","D":"贮藏手段"},"answer":"A","analysis":"信用货币是建立在信用关系基础之上的能执行货币职能的一种信用凭证或符号，它是直接从货币的支付手段的职能中产生和发展起来的（包括银行券、支票、汇票等）。故选 A 项。"},{"id":8,"section":"econ","type":"single","stem":"20 世纪 90 年代以来，（ ）代替了资产负债率作为金融监管指标，从而有利于增强金融机构的抗风险能力。","passage":"","options":{"A":"净资产率","B":"资本充足率","C":"资产盈利率","D":"股本收益率"},"answer":"B","analysis":"资本充足率是一个银行的资本总额对其风险加权资产的比率。资本充足率是保证银行等金融机构正常运营和发展所必需的资本比率。各国金融管理当局一般都有对商业银行资本充足率的管制，目的是监测银行抵御风险的能力。故选 B 项。"},{"id":9,"section":"econ","type":"single","stem":"通货膨胀对策中，通过公开市场业务出售政府债券属于（ ）。","passage":"","options":{"A":"控制需求","B":"改善供给","C":"减少政府转移支付","D":"收入指数化政策"},"answer":"A","analysis":"通过公开市场业务出售债券收紧市场中的货币供给量，减少经济体系中的货币存量，控制社会总需求。故选 A 项。"},{"id":10,"section":"econ","type":"single","stem":"全能银行制在以（ ）为代表的欧洲大陆国家广为流行。","passage":"","options":{"A":"瑞士","B":"英国","C":"德国","D":"比利时"},"answer":"C","analysis":"全能银行（Universal Banking）源于德国，本是德国银行业的分类概念，但在现代金融里其含义已经超出了统计概念的范畴。全能银行是一种银行类型，它不仅经营银行业务，而且还经营证券、保险、金融衍生业务以及其他新兴金融业务，有的还能持有非金融企业的股权。故选 C 项。"},{"id":11,"section":"econ","type":"single","stem":"骆驼（CAMELS）评级法中的 A 是指（ ）。","passage":"","options":{"A":"盈利水平","B":"资本充足率","C":"资产流动性","D":"资产质量"},"answer":"D","analysis":"骆驼评级包括资本充足性（Capital Adequacy）、资产质量（Asset Quality）、管理水平（Management）、盈利状况（Earnings）、流动性（Liquidity）和市场风险敏感度（Sensitivity to Market Risk）。故选 D 项。"},{"id":12,"section":"econ","type":"single","stem":"风险价值是指在一定的持有期和置信水平下，利率、汇率等市场风险要素发生变化对资产价值造成的（ ）损失。","passage":"","options":{"A":"最大","B":"最小","C":"平均","D":"预期"},"answer":"A","analysis":"风险价值是在一定的置信水平下，某一金融资产（或证券组合）在未来特定的一段时间内的最大可能损失。故选 A 项。"},{"id":13,"section":"econ","type":"single","stem":"（ ）是指相对于单一机构的监管，适用于银行集团及金融集团的监管。","passage":"","options":{"A":"多元化监管","B":"并表监管","C":"综合监管","D":"统一监管"},"answer":"B","analysis":"并表监管是指监管当局以整个银行集团为对象，对银行集团的总体经营和所有风险进行监督。并表监管是相对于对单一机构的监管而言，适用于对银行集团以及金融集团的监管。故选 B 项。"},{"id":14,"section":"econ","type":"single","stem":"审慎银行监管的核心是（ ）。","passage":"","options":{"A":"市场准入","B":"资本监管","C":"监督检查","D":"风险评级"},"answer":"B","analysis":"资本监管是审慎银行监管的核心。建立在审慎贷款风险分类、充足计提各类资产损失准备基础上计算的资本充足率，是衡量银行综合经营实力和抵御风险能力的重要指标。故选 B 项。"},{"id":15,"section":"econ","type":"single","stem":"操作风险经济资本计量模型中，（ ）的采用需要经过监管当局的批准。","passage":"","options":{"A":"基本指标法","B":"标准法","C":"高级计量法","D":"模型法"},"answer":"C","analysis":"高级计量法是指商业银行在满足巴塞尔委员会提出的资格要求以及定性和定量标准的前提下，通过内部操作风险计量系统计算监管资本要求，需要经过监管当局的批准。故选 C 项。"},{"id":16,"section":"econ","type":"single","stem":"金融深化的一个最基本衡量方法是（ ）。","passage":"","options":{"A":"流动性比率","B":"货币化程度","C":"资本充足率","D":"金融相关比率"},"answer":"B","analysis":"金融深化一个最基本的衡量方法是货币化程度，即：国民生产总值中货币交易总值所占的比例。货币化程度越低表明“自然经济”和“物物交换总值”的比重越高。故选B 项。"},{"id":17,"section":"econ","type":"single","stem":"下列债券中，不属于外国债券的是（ ）。","passage":"","options":{"A":"扬基债券","B":"武士债券","C":"金边债券","D":"猛犬债券"},"answer":"C","analysis":"外国债券是指外国借款人（政府、私人公司或国际金融机构）所在国与发行市场所在国具有不同的国籍并以发行市场所在国的货币为面值货币发行的债券。典型的外国债券包括扬基债券、武士债券、猛犬债券和熊猫债券等。金边债券是指政府债券。故选C项。"},{"id":18,"section":"econ","type":"single","stem":"A 公司是一家玩具生产企业，为防范生产的玩具给客户造成人身伤害或财产损失等风险，A 公司可以投保（ ）。","passage":"","options":{"A":"产品责任保险","B":"公众责任保险","C":"雇主责任险","D":"职业责任险"},"answer":"A","analysis":"产品责任保险是指以产品制造者、销售者、维修者等的产品责任为承保风险的一种责任保险，而产品责任又以各国的产品责任法律制度为基础。公众责任保险，又称普通责任保险或综合责任保险，它以被保险人的公众责任为承保对象，是责任保险中独立的、适用范围最为广泛的保险类别。所谓公众责任，是指致害人在公众活动场所的过错行为致使他人的人身或财产遭受损害，依法应由致害人承担的对受害人的经济赔偿责任。雇主责任险是指被保险人所雇佣的员工在受雇过程中从事与保险单所载明的与被保险人业务有关的工作而遭受意外或患与业务有关的国家规定的职业性疾病，所致伤、残或死亡，被保险人根据《中华人民共和国劳动法》及劳动合同应承担的医药费用及经济赔偿责任，包括应支出的诉讼费用，由保险人在规定的赔偿限额内负责赔偿的一种保险。职业责任保险亦称 “职业赔偿保险”。承保专业技术人员因职业上的疏忽或过失致使合同对方或其他人遭受人身伤害或财产损失，依法应承担赔偿责任的保险。其承保对象，包括医生、会计师、建筑师、工程师、律师、保险经纪人、交易所经纪人与其他专业技术人员。一般由承保对象从事专业技术服务的单位投保。故选 A 项。"},{"id":19,"section":"econ","type":"single","stem":"随着生活水平的提高，医疗费用支出不断增长，人们的健康意识也不断提高，越来越多的人加入跑步、健走、游泳等健身锻炼的队伍。从风险管理角度看，这些行为属于（）。","passage":"","options":{"A":"损失控制","B":"风险回避","C":"风险自留","D":"风险融资"},"answer":"B","analysis":"越来越多的人们通过跑步、健身、游泳等健身锻炼方式来避免出现身体健康的问题，其本质属于风险回避。故选 B 项。"},{"id":20,"section":"econ","type":"single","stem":"保险利益是指（ ）对保险标的具有的法律上承认的经济利益。","passage":"","options":{"A":"投保人或者受益人","B":"保险人或者受益人","C":"投保人或者被保险人","D":"保险人或者被保险人"},"answer":"C","analysis":"保险利益是指投保人或被保险人对保险标的所具有的利害关系。故选C项。"},{"id":21,"section":"cs","type":"single","stem":"下列 4 个无符号十进制整数中，能用 8 个二进制位表示的是（）。","passage":"","options":{"A":"257","B":"201","C":"313","D":"296"},"answer":"B","analysis":"本题考查二进制转换。十进制转化为二进制（257）D=（100000001）B，结果是 9 位二进制，所以能用 8 个二进制位表示的应该是值比 257 小。（201）D=（11001001）B。故选 B 项。"},{"id":22,"section":"cs","type":"single","stem":"操作系统通过（ ）对进程进行管理。","passage":"","options":{"A":"JCB","B":"PCB","C":"DCT","D":"CHCT"},"answer":"B","analysis":"本题考查进程管理。PCB 是进程控制块，是操作系统核心中一种数据结构，主要表示进程状态。其作用是使一个在多道程序环境下不能独立运行的程序，成为一个能独立运行的基本单位或与其他进程并发执行的进程。或者说，OS 是根据PCB 来对并发执行的进程进行控制和管理的。故选 B 项。"},{"id":23,"section":"cs","type":"single","stem":"Unix 系统中，下列哪一个命令可以查看到以往输入的命令？（）","passage":"","options":{"A":"Histfile","B":"showbuff","C":"History","D":"last"},"answer":"C","analysis":"Linux 和 Unix 中，history 命令就是历史记录，它显示了在终端中所执行过的所有命令的历史。history 的历史命令保存在~/.bash_history 文件中，所以也可以查看该文件来查看历史命令；Histfile 一般指向/.bash_history, 也就是指向保存 history 的文件。last 命令的作用是显示近期用户或终端的登录情况。故选 C 项。"},{"id":24,"section":"cs","type":"single","stem":"Windows 系统中，用户 A 对一个文件有读、写的权限，而 A 对于这个文件所在的文件夹只有读权限，用户 A 最终对这个文件将具备（ ）权限。","passage":"","options":{"A":"读","B":"写","C":"执行","D":"读、写"},"answer":"A","analysis":"本题考查操作系统——文件管理。用户 A 对一个文件有读、写的权限，而A对于这个文件所在的文件夹只有读权限，用户 A 最终对这个文件将具备读权限。因为按照文件管理的目录层次，要先访问文件夹，才能访问文件。故选 A 项。"},{"id":25,"section":"cs","type":"single","stem":"用 3 块容量是 1T 的硬盘做 RAID5 阵列，则这个阵列的容量是（）。","passage":"","options":{"A":"3T","B":"2T","C":"1T","D":"512G"},"answer":"B","analysis":"RAID5 磁盘阵列至少使用 3 块硬盘（也可以更多）组建，当有数据写入硬盘的时候，按照 1 块硬盘的方式就是直接写入这块硬盘的磁道，如果是RAID5 的话这次数据写入会根据算法分成 3 部分，然后写入这 3 块硬盘，写入的同时还会在这3 块硬盘上写入校验信息，当读取写入的数据的时候会分别从 3 块硬盘上读取数据内容，再通过检验信息进行校验。当其中有 1 块硬盘出现损坏的时候，就从另外 2 块硬盘上存储的数据可以计算出第3块硬盘的数据内容。RAID5 磁盘阵列所有磁盘容量必须一样大，当容量不同时，会以最小的容量为准。最好硬盘转速一样，否则会影响性能，而且可用空间=磁盘数n―1。故选B项。"},{"id":26,"section":"cs","type":"single","stem":"您手机上安装的银行 APP 最接近以下哪种架构？（ ）","passage":"","options":{"A":"SOA","B":"C/S","C":"B/S","D":"微服务"},"answer":"B","analysis":"本题考查系统架构。手机 APP 软件除了 C/S 架构，还有单机版APP，B/S架构等类型的 APP。 在 C/S 结构中，应用程序分为两部分：服务器部分和客户机部分。B/S架构中，客户机上只要安装一个浏览器，浏览器通过 Web Server 同数据库进行数据交互。面向服务的体系结构（SOA）是一个组件模型，它将应用程序的不同功能单元（称为服务）通过这些服务之间定义良好的接口和契约联系起来。微服务架构的系统是一个分布式的系统，按业务进行划分为独立的服务单元，解决单体系统的不足，同时也满足越来越复杂的业务需求。本题手机上安装的银行 APP 最接近 C/S 架构。故选 B 项。"},{"id":27,"section":"cs","type":"single","stem":"在 UML 提供的系统视图中，下列哪—个视图是最基本的需求分析模型？（）","passage":"","options":{"A":"部署视图","B":"进程视图","C":"逻辑视图","D":"用例视图"},"answer":"D","analysis":"UML 的 5 种视图：分别描述系统的一个方面，5 种视图组合成UML 语言完整的模型。（1）用例视图：用户描述系统应具备的功能。是最基本的需求分析模型。（2）逻辑视图：设计人员和开发人员描述用例视图中提出的系统功能的实现。（3）组件视图：开发人员显示代码组件的组织结构。（4）配置视图：开发人员、系统集成人员、测试人员显示系统的具体部署。部署是指将系统配置到由计算机和设备组成的物理结构上。（5）并发视图：开发人员、系统集成人员显示系统的并发性，解决在并发系统中存在的通信和同步问题。故选 D 项。"},{"id":28,"section":"cs","type":"single","stem":"以下关于网络存储的叙述，不正确的是（ ）。","passage":"","options":{"A":"NAS 设备可有自己的 OS","B":"FCSAN 的网络介质为光纤通道","C":"IPSAN 使用标准的以太网","D":"DAS 支持跨平台文件共享功能"},"answer":"D","analysis":"DAS（Direct Attached Storage，直接附加存储）即直连方式存储。在这种方式中，存储设备是通过电线（通常是 SCSI 接口电缆）直接连接服务器。I/O（输入/输入）请求直接发送到存储设备。DAS 也可称为 SAS（Server-Attached Storage，服务器附加存储）。它依赖于服务器，其本身是硬件的堆叠，不带有任何存储操作系统，DAS 不能提供跨平台文件共享功能，各系统平台下文件需分别存储。 NAS 是（Network Attached Storage）的简称，中文称为网络附加存储。在 NAS 存储结构中，存储系统不再通过I/O 总线附属于某个特定的服务器或客户机，而是直接通过网络接口与网络直接相连，由用户通过网络来访问。NAS 设备有自己的 OS，其实际上是一个带有瘦服务的存储设备，其作用类似于一个专用的文件服务器，不过把显示器，键盘，鼠标等设备省去，NAS 用于存储服务，可以大大降低了存储设备的成本，另外 NAS 中的存储信息都是采用 RAID 方式进行管理的，从而有效地保护了数据。 SAN 是通过专用高速网将一个或多个网络存储设备和服务器连接起来的专用存储系统，未来的信息存储将以 SAN 存储方式为主。SAN 主要采取数据块的方式进行数据和信息的存储，目前主要使用于以太网（IP SAN）和光纤通道（FC SAN）两类环境中。故选 D 项。"},{"id":29,"section":"cs","type":"single","stem":"以下关于负载均衡的叙述中，错误的是（ ）。","passage":"","options":{"A":"负载均衡并不会增加系统的吞吐量","B":"负载均衡可以通过硬件或软件实现","C":"负载均衡可以在不同地理位置、不同网络结构的服务器群之间进行","D":"负载均衡可使用户只通过一个 IP 地址或域名就能访问相应的服务器"},"answer":"A","analysis":"负载均衡是将信息系统的信息处理、数据存储等均衡分布在多个设备单元，防止单个设备负荷过大导致系统瘫痪，是一种普遍采用的可靠性技术。负载均衡建立在现有网络结构之上，它提供了一种廉价有效透明的方法扩展网络设备和服务器的带宽、增加吞吐量、加强网络数据处理能力、提高网络的灵活性和可用性。故选 A 项。"},{"id":30,"section":"cs","type":"single","stem":"关于微服务，以下说法正确的是（ ）。","passage":"","options":{"A":"与 SOA 相比，微服务粒度要粗一些","B":"微服务数量越多越好","C":"微服务需要企业服务总线支持服务间通信","D":"微服务提倡轻量级的通信方式"},"answer":"D","analysis":"面向服务的体系结构（SOA）是一个组件模型，它将应用程序的不同功能单元（称为服务）通过这些服务之间定义良好的接口和契约联系起来。微服务：微服务架构是一种将单个应用程序作为一套小型服务开发的方法，每种应用程序都在自己的进程中运行，并与轻量级机制（通常是 HTTP 资源 API）进行通信。这些服务是围绕业务功能构建的，可以通过全自动部署机制独立部署。这些服务的集中管理最少，可以用不同的编程语言编写，并使用不同的数据存储技术。微服务剔除 SOA 中复杂的 ESB 企业服务总线，所有的业务智能逻辑在服务内部处理，使用 Http（Rest API）进行轻量化通讯。微服务架构强调的是系统按业务边界做细粒度的拆分和部署。微服务适用于复杂的大系统，小应用盲目的拆分只会增加其维护和开发成本。故选 D 项。"},{"id":31,"section":"cs","type":"single","stem":"CPU 响应中断的时间是（ ）。","passage":"","options":{"A":"一条指令执行结束","B":"I/O 设备提出中断","C":"取指周期结束","D":"指令周期结束"},"answer":"D","analysis":"本题考查 CPU 中的寄存器。CPU 是在指令周期的最后一个机器周期——执行周期的结束时刻统一向所有中断源发出中断查询信号。故选 D 项。"},{"id":32,"section":"cs","type":"single","stem":"下列哪个设计策略有助于提升系统的性能？（ ）","passage":"","options":{"A":"分层结构","B":"事务机制","C":"主动冗余","D":"队列调度"},"answer":"D","analysis":"主动冗余提高系统的可靠性；队列调度主要提高系统的性能。故选D项。"},{"id":33,"section":"cs","type":"single","stem":"MVC 架构模式中，业务数据和业务逻辑主要由下列哪部分负责？（）","passage":"","options":{"A":"模型","B":"控制","C":"视图","D":"模型和控制"},"answer":"A","analysis":"MVC 架构模式中，M 即 Model（模型层），主要负责出来业务逻辑以及数据库的交互；V 即 View（视图层），主要用于显示数据和提交数据；C 即Controller（控制器），主要是用作捕获请求并控制请求转发。故选 A 项。"},{"id":34,"section":"cs","type":"single","stem":"在一个多层 B/S 架构中，应用访问从用户端到后台的通常顺序是（）。","passage":"","options":{"A":"浏览器、应用服务器、中间件、数据库服务器","B":"浏览器、数据库服务器、中间件、应用服务器","C":"浏览器、中间件、应用服务器、数据库服务器","D":"浏览器、应用服务器、数据库服务器、中间件"},"answer":"C","analysis":"本题考查 B/S 架构。多层 B/S 架构由客户机（浏览器）、中间件、应用服务器、数据库服务器四层构成。中间件是服务器上负责解析 http 请求的一组应用程序，负责接收并解析 http 请求数据包，在服务器上找到数据包所请求的文件后，将其返回给客户端，如果 http 数据包所请求的是一个动态脚本文件，如 php 等，中间件就要靠CGI 与脚本语言解析软件进行交互，处理好动态脚本文件后，再将处理后的文件其返回给浏览器。故选C项。"},{"id":35,"section":"cs","type":"single","stem":"虚拟存储器发生页面失效时，需要进行外部地址变换，即下列哪种变种？（）","passage":"","options":{"A":"虚地址到主存地址","B":"虚地址到辅存物理地址","C":"主存地址到 Cache 地址","D":"主存地址到辅存物理地址"},"answer":"B","analysis":"虚拟存储（Virtual Storage）是指把多个存储介质模块（例如，硬盘、RAID等）通过一定的手段集中管理，形成统一管理的存储池（storage pool），为用户提供大容量、高数据传输性能的存储系统。存储虚拟化是将实际的物理存储实体与存储的逻辑表示实现分离，使用虚拟存储技术，应用服务器只与分配给它们的逻辑卷（虚卷）交互，而不用关心其数据是在哪个物理存储实体上。虚拟存储区的容量与物理主存大小无关，而受限于计算机的地址结构和可用磁盘容量。其页面的置换依据相应的页面置换算法进行，当页面失效时，需要进行数据交换，此时涉及逻辑地址（虚地址）到辅存物理地址的变换。故选B 项。"},{"id":36,"section":"cs","type":"single","stem":"Chmod 744 test 命令执行的结果是（ ）。","passage":"","options":{"A":"test 文件的所有者具有执行读写权限，文件所属的组合其他用户有读的权限","B":"test 文件的所有者具有执行读写和执行权限，文件所属的组和其他用户有读的权限","C":"test 文件的所有者具有执行读和执行权限，文件所属的组和其他用户有读的权限","D":"test 文件的所有者具有执行读写和执行权限，文件所属的组和其他用户有读和写的权限"},"answer":"B","analysis":"数字表示不同用户或用户组的权限。第一个数字代表档案拥有者；第二个数字代表群组；第三个数字代表其他。在 Linux 中我们有三种常用权限：可读、可写以及可执行，用数字表示的话就是：可读 = 4，可写=2，可执行=1。例如：755 第一个数字 7 是档案拥有者的权限（可读+可写+可执行=4+2+1）；第二个数字 5是群组的权限（可读+可执行=4+1）第三个数字 5 是其他人的权限（可读+可执行=4+1）。故选 B 项。"},{"id":37,"section":"cs","type":"single","stem":"下列关于容器的说法，正确的是（ ）。","passage":"","options":{"A":"与虚拟机类似，容器镜像包含了一个客户机操作系统（Guest OS）","B":"容器镜像包含了软件运行时环境、代码、系统工具和设置","C":"容器需要虚拟硬件","D":"与虚拟机相比，容器启动速度较慢"},"answer":"A","analysis":"目前云计算平台常用的虚拟化技术有虚拟机（Virtual Machine）和容器（Container）两种。传统虚拟机技术是虚拟出一套硬件后，在其上运行一个完整操作系统，在该系统上再运行所需应用进程；而容器内的应用进程直接运行于宿主的内核，容器内没有自己的内核，而且也没有进行硬件虚拟。因此容器要比传统虚拟机更为轻便。故选A 项。"},{"id":38,"section":"cs","type":"single","stem":"ITIL（信息科技基础设施库）的最核心模块是（ ）。","passage":"","options":{"A":"业务管理","B":"服务管理","C":"安全管理","D":"基础架构管理"},"answer":"B","analysis":"ITIL 即信息技术基础架构库，主要适用于 IT 服务管理（ITSM）。ITIL为企业的 IT 服务管理实践提供了一个客观、严谨、可量化的标准和规范。在它的最新版2.0 版中，ITIL 主要包括六个模块，即业务管理、服务管理、ICT 基础架构管理、IT 服务管理规划与实施、应用管理和安全管理。其中服务管理是其最核心的模块，该模块包括“服务提供”和“服务支持”两个流程组。故选 B 项。"},{"id":39,"section":"cs","type":"single","stem":"为了提高易读性，源程序模块内部应加入功能性注释，用于说眀（）。","passage":"","options":{"A":"模块总的功能","B":"数据的用途","C":"程序段或语句的功能","D":"模块参数的用途"},"answer":"C","analysis":"程序中的注释是程序设计者与程序阅读者之间沟通的重要手段。注释能够帮助读者理解程序，并为后续测试维护提供明确的指导信息。注释可以分为功能性注释和序言性注释两种，其中功能性注释用以描述其后的语句或程序段的功能，以及数据的状态。故选C项。"},{"id":40,"section":"cs","type":"single","stem":"瀑布模型软件生命周期中，（ ）出错对软件的影响最大。","passage":"","options":{"A":"详细设计阶段","B":"概要设计阶段","C":"软件运行阶段","D":"需求分析阶段"},"answer":"D","analysis":"本题考查软件开发模型。需求分析阶段是软件生命周期中最重要的阶段，尤其是对瀑布模型软件开发来说。故选 D 项。"},{"id":41,"section":"cs","type":"single","stem":"敏捷开发中，最快速有效传递信息的方法是（ ）。","passage":"","options":{"A":"及时通讯软件","B":"电话","C":"电子邮件","D":"面对面交流"},"answer":"D","analysis":"敏捷开发的核心理念就是以最简单有效的方式快速地达成目标，并在这个过程中及时地响应外界的变化，做出迅速的调整。敏捷开发的十二条原则：（1）我们最重要的目标，是通过持续不断地及早交付有价值的软件使客户满意。（2）欣然面对需求变化，即使在开发后期也一样。为了客户的竞争优势，敏捷过程掌控变化。（3）经常地交付可工作的软件，相隔几星期或一两个月，倾向于采取较短的周期。（4）业务人员和开发人员必须相互合作，项目中的每一天都不例外。（5）激发个体的斗志，以他们为核心搭建项目。提供所需的环境和支援，辅以信任，从而达成目标。（6）不论团队内外，传递信息效果最好和效率最高的方式是面对面的交谈。（7）可工作的软件是进度的首要度量标准。（8）敏捷过程倡导可持续开发。责任人、开发人员和用户要能够共同维持其步调稳定延续。（9）坚持不懈地追求技术卓越和良好设计，敏捷能力由此增强。（10）以简洁为本，它是极力减少不必要工作量的艺术。（11）最好的架构、需求和设计出自组织团队。（12）团队定期地反思如何能提高成效，并以此调整自身的举止表现。故选 D 项。"},{"id":42,"section":"cs","type":"single","stem":"数据兼容性测试应关注以下哪一项？（ ）","passage":"","options":{"A":"异常退出时是否会破坏正在处理的文件","B":"是否能打开以前版本保存的文件","C":"同类功能的使用风格是否一致","D":"是否可以在不同的 J2EE 应用服务器上运行"},"answer":"B","analysis":"数据兼容性是指软件之间能否正确地交互和共享信息。在被测试软件与其他程序间复制粘贴的文字是否正确？在以前的版本下保存的文字在新的版本中是否能被打开？所有的特点是否能够被保留？包括新特性的新版文件在旧系统中是否能被打开？新特性在旧版本中将被如何解释？被测软件是一个系列软件中的一个吗？与本系列中的软件以何种形式交换数据？与同类软件间能否进行数据交换？软件是否提供对其他常用数据格式的支持？测试中需要明确业界有没有针对被测软件内容进行数据交换定义的标准或规范？故选B 项。"},{"id":43,"section":"cs","type":"single","stem":"通过编译程序可以发现源程序中的全部（ ）。","passage":"","options":{"A":"设计错误","B":"语法错误","C":"语义错误","D":"逻辑错误"},"answer":"B","analysis":"本题考查程序设计语言。编译程序可发现源程序全部的“语法”错误和部分的“语义”错误。故选 B 项。"},{"id":44,"section":"cs","type":"single","stem":"为了提高测试效率，应该（ ）。","passage":"","options":{"A":"随机选取测试数据","B":"选取所有可能的输入数据作为测试数据","C":"选取发现错误可能性大的数据作为测试数据","D":"在完成编码以后制定软件的测试计划"},"answer":"C","analysis":"本题考查软件测试。为了提高测试效率，应该选取发现错误可能性大的数据作为测试数据。故选 C 项。"},{"id":45,"section":"cs","type":"single","stem":"DBA 应该提出（ ）建议来保护存储在数据仓库的特殊敏感信息。","passage":"","options":{"A":"实施列等级与行等级授权访问控制","B":"通过强密码增强用户身份认证","C":"将数据仓库构架称为 Subjectmatter-specific 数据库","D":"通过日志记录用户对数据仓库的访问"},"answer":"A","analysis":"基于标签的安全（LabelSecurity）是项目空间级别的一种强制访问控制策略。它的引入使得项目空间管理员可以更加灵活地控制用户对列级别敏感数据的访问。需要将数据和访问数据的人进行安全等级划分。在政府和金融机构，通常将数据的敏感度标记分为四类：0 级（不保密）、1 级（秘密）、2 级（机密）、3 级（高度机密）。故选A项。"},{"id":46,"section":"cs","type":"single","stem":"某银行一个老的工资系统将被迁移到一个新的应用系统。下列人员中，（）应主要负责在新系统正式使用前对数据准确性和完整性进行审阅并签字。","passage":"","options":{"A":"IS 审计师（IS auditor）","B":"数据库管理员（DBA）","C":"项目经理（Project manager）","D":"数据所有人（Data owner）"},"answer":"A","analysis":"IS 审计师主要负责在新系统正式使用前对数据准确性和完整性。故选A项。"},{"id":47,"section":"cs","type":"single","stem":"数据仓库在收集数据过程中，会遇到一些略微不一致但可以纠正的数据，纠正的过程称为（ ）。","passage":"","options":{"A":"数据转换","B":"数据抽取","C":"数据清洗","D":"数据装载"},"answer":"A","analysis":"本题考查数据仓库。数据抽取是从各种存储方式中获取数据的过程。清洗过的数据经过转换整理，按主题组织起来。获取到的数据经过清洗，去掉“脏数据”，保持数据的一致性。将按主题组织起来的数组装载入数组仓库中。故选 A 项。"},{"id":48,"section":"cs","type":"single","stem":"HDFS 用来为大数据提供可靠存储，以下不属于 HDFS 高可靠性与可用性机制的是（ ）。","passage":"","options":{"A":"数据冗余存储","B":"副本存放策略","C":"RAID","D":"数据容错与恢复机制"},"answer":"C","analysis":"分布式文件系统（HDFS）的高可靠性与可用性主要是由多种策略及机制共同作用实现的，如数据冗余存储、副本存放策略、数据容错与恢复机制。RAID 是磁盘阵列，由很多块独立的磁盘，组合成一个容量巨大的磁盘组，利用个别磁盘提供数据所产生加成效果提升整个磁盘系统效能。故选 C 项。"},{"id":49,"section":"cs","type":"single","stem":"有一个不大的表 abc，要删除这个表中的全部数据，保留表结构，稳妥的操作应当使用以下哪些命令？（ ）","passage":"","options":{"A":"Delete from abc;commit;","B":"drop table abc ;","C":"delete from abc ;","D":"truncate table abc ;"},"answer":"C","analysis":"本题考查 SQL 语句。drop（删除表）：删除内容和定义，释放空间。简单来说就是把整个表去掉。Truncate（清空表中的数据）：删除内容、释放空间但不删除定义（保留表的数据结构）。与 drop 不同的是，只是清空表数据而已。truncate 不能删除行数据，要删就要把表清空。delete（删除表中的数据）：delete 语句用于删除表中的行。delete 语句执行删除的过程是每次从表中删除一行，并且同时将该行的删除操作作为事务记录在日志中保存，以便进行回滚操作。故选 C 项。"},{"id":50,"section":"cs","type":"single","stem":"数据库提供了完全备份、差异备份和日志备份等几种备份方法，其中差异备份的内容是（ ）。","passage":"","options":{"A":"上次差异备份之后修改的数据库全部内容","B":"上次完全备份之后修改的数据库全部内容","C":"上次日志备份之后修改的数据库全部内容","D":"上次完全备份之后修改的数据库内容，但不包括日志等其他内容"},"answer":"D","analysis":"本题考查数据库备份。差异数据库备份，是记录自上次完全数据库备份之后对数据库的更改的数据库备份。故选 D 项。"},{"id":51,"section":"cs","type":"single","stem":"日志文件对实现数据库系统故障的恢复有非常重要的作用。下列关于数据库系统日志文件的说法，正确的是（ ）。","passage":"","options":{"A":"数据库系统不要求日志的写入顺序必须与并行事物执行的时间次序一致","B":"为了保证数据库是可恢复的，必须严格保证先写数据库后写日志","C":"日志文件中检查点记录的主要作用是提高系统出现故障后的恢复效率","D":"系统故障恢复必须使用日志文件以保证数据库系统重启时能正常恢复，事务故障恢复不一定需要使用日志文件"},"answer":"C","analysis":"本题考查数据库备份与恢复。数据库系统要求日志的写入顺序必须与并行事物执行的时间次序一致；可以先写日志后写数据库；事务故障恢复需要使用日志文件。故选C项。"},{"id":52,"section":"cs","type":"single","stem":"有一个关系：（学生学号，姓名，系别），规定学号的域值是8 个数字组成的字符串，这一规则属于（ ）。","passage":"","options":{"A":"实体完整性约束","B":"参照完整性约束","C":"用户自定义完整性约束","D":"关键字完整性约束"},"answer":"C","analysis":"关系的约束条件也称为关系的数据完整性规则。它是对关系的一些限制和规定。它包括实体完整性、参照完整性和用户定义完整性。实体完整性：这条规定的现实意义是，关系模型对应的是现实世界的数据实体，而关键字是实体唯一性的表现，没有关键字就没有实体．所有关键字不能是空值。这是实体存在的最基本的前提，所以称之为实体完整性。参照完整性：参照完整性规则也可称为引用完整性规则。这条规则是对关系外部关键字的规定，要求外部关键字的取值必须是客观存在的，即不允许在一个关系中引用另一个关系不存在的元组。用户定义完整性：由用户根据实际情况，对数据库中数据的内容所作的规定称为用户定义的完整性规则。通过这些限制数据库中接受符合完整性约束条件的数据值，不接受违反约束条件的数据，从而保证数据库的数据合理可靠。故选 C 项。"},{"id":53,"section":"cs","type":"single","stem":"数据库中对未提交更新的依赖脏数据的读出是事务的（ ）遭到了破坏。","passage":"","options":{"A":"原子性","B":"一致性","C":"隔离性","D":"持久性"},"answer":"C","analysis":"隔离性级别是指为保证数据库数据的完整性和一致性，而使多用户事务隔离的程度，SQL92 定义了 4 种隔离性级别：未提交读、提交读、可重复，读和可串行。如果选择过高的隔离性级别，如可串行，虽然系统可以因实现更好隔离性而更大程度上保证数据的完整性和一致性，但各事务间冲突而死锁的机会大大增加，大大影响了系统性能。故选C项。"},{"id":54,"section":"cs","type":"single","stem":"以下哪个是机器学习的非监督学习算法？（ ）","passage":"","options":{"A":"回归","B":"聚类","C":"决策树","D":"分类"},"answer":"B","analysis":"非监督机器学习可以分为以下几类：（1）聚类：K-均值聚类、谱聚类、DBSCAN聚类、模糊聚类、GMM 聚类、层次聚类等；（2）降维：PCA、t-SNE、MDS 等；（3）其它：PageRank、SOM 等。故选 B 项。"},{"id":55,"section":"cs","type":"single","stem":"虚拟化技术是云计算的基础，以下哪一项不属于虚拟化？（ ）","passage":"","options":{"A":"存储虚拟化","B":"网络虚拟化","C":"应用虚拟化","D":"计算资源虚拟化"},"answer":"C","analysis":"云计算的实质是存储虚拟化、网络虚拟化、计算虚拟化。故选C 项。"},{"id":56,"section":"cs","type":"single","stem":"以下哪个命令可查看本机的网络连接状态？（ ）","passage":"","options":{"A":"ipconfig","B":"netstat","C":"nslookup","D":"ping"},"answer":"B","analysis":"本题考查网络命令。ipconfig 查看网络情况；ping 测试网络连通；netstat 显示网络状态信息；nslookup 可以指定查询的类型，可以查到 DNS 记录的生存时间还可以指定使用哪个 DNS 服务器进行解释；ipconfig /all 显示本机 TCP/IP 配置的详细信息。故选B项。"},{"id":57,"section":"cs","type":"single","stem":"下面哪个协议是加密的？（ ）","passage":"","options":{"A":"HTTP","B":"SMTP","C":"POP3","D":"SSH"},"answer":"D","analysis":"本题考查网络协议。SSH 为建立在应用层基础上的安全协议。SSH是较可靠，专为远程登录会话和其他网络服务提供安全性的协议。利用 SSH 协议可以有效防止远程管理过程中的信息泄露问题。普通网络通信一般是明文通信，数据容易被中间人拦截并且解析，而 SSH 协议则提供了基于内容加密服务。故选 D 项。"},{"id":58,"section":"cs","type":"single","stem":"在 OSI 参考模型中，路由器、交换机 Switch、集线器 Hub 实现的最高功能层分别是（ ）。","passage":"","options":{"A":"2、2、1","B":"2、2、2","C":"3、2、1","D":"3、2、2"},"answer":"D","analysis":"本题考查 OSI 参考模型。在 OSI 参考模型中，路由器工作在网络层（第3 层），交换机 Switch、集线器 Hub 工作在数据链路层（第 2 层）。故选 D 项。"},{"id":59,"section":"cs","type":"single","stem":"某 网 络 的 IP 地 址 空 间 为 192.168.5.0/24 ， 采 用 定 长 子 网划分，子网掩码为255.255.255.248，则该网络中的最大子网个数、每个子网的最大可分配地址个数分别是（ ）。","passage":"","options":{"A":"32、8","B":"32、6","C":"8、32","D":"8、30"},"answer":"B","analysis":"网络号为前24位。第25～32位为子网位+主机位。而子网掩码为255.255.255.248，其第 25～32 位的 248 用二进制表示为 11111000，因此后 8 位中，前5 位用于子网号，后3位用于主机号。因此该网络空间的最大子网个数为 25=32 个，每个子网内，去掉全0 和全1的情况，最大可分配地址个数为 6 个。故选 B 项。"},{"id":60,"section":"cs","type":"single","stem":"可以动态为主机配置 IP 地址的协议是（ ）。","passage":"","options":{"A":"ARP","B":"RARP","C":"DHCP","D":"NAT"},"answer":"C","analysis":"动态为主机配置 IP 地址的协议是 DHCP。故选 C 项。"},{"id":61,"section":"cs","type":"single","stem":"网络物理隔离是指（ ）。","passage":"","options":{"A":"两个网络间链路层在任何时刻不能直接通讯","B":"两个网络间网络层在任何时刻不能直接通讯","C":"两个网络间链路层、网络层在任何时刻都不能直接通讯","D":"通过防火墙隔离的两个完全独立网络体系"},"answer":"C","analysis":"网络物理隔离是指两个网络间链路层、网络层在任何时刻都不能直接通讯。故选 C 项。"},{"id":62,"section":"cs","type":"single","stem":"用户在线访问信息系统时，（ ）身份鉴别更安全。","passage":"","options":{"A":"使用两种身份鉴别因子","B":"将静态口令改为动态口令","C":"使用办公电话号码作为登录口令","D":"使用个人手指表皮指纹特征"},"answer":"A","analysis":"用户在线访问信息系统时，使用两种身份鉴别因子（如账号口令、动态口令等）身份鉴别更安全。故选 A 项。"},{"id":63,"section":"cs","type":"single","stem":"防范 DDOS 攻击，主要是为了保护信息系统的（ ）。","passage":"","options":{"A":"系统数据的机密性","B":"系统数据的完整性","C":"系统服务的可用性","D":"数据使用的抗抵赖性"},"answer":"C","analysis":"DDOS 攻击又称分布式拒绝服务攻击，是互联网中最常见的网络攻击手段之一，攻击者利用“肉鸡”对目标网站在较短的时间内发起大量请求，大规模消耗目标网站的主机资源，让它无法正常服务。防范 DDOS 攻击，主要是为了保护信息系统的服务的可用性。故选 C 项。"},{"id":64,"section":"cs","type":"single","stem":"减少信息系统的社会工程攻击事件，最有效的措施是（ ）。","passage":"","options":{"A":"强化数据的物理访问控制","B":"安装数据库审计软件","C":"所有员工的安全意识培训","D":"监控员工邮件"},"answer":"C","analysis":"社会工程学是一种通过对受害者心理弱点、本能反应、好奇心、信任、贪婪等心理陷阱进行诸如欺骗、伤害等危害手段。社会工程学攻击在近年来的一些网络入侵事件中起到了很大的作用，对企业信息安全有很大的威胁性。故选 C 项。"},{"id":65,"section":"cs","type":"single","stem":"从广义上讲，（ ）项的区域链技术说明不正确。","passage":"","options":{"A":"利用块链式数据结构来验证与存储数数据","B":"利用分布式节点共识算法来生成和更新数据","C":"利用密码学的方式保证数据传输和访问的安全","D":"利用手工合约来操作数据"},"answer":"D","analysis":"区块链是一种防篡改的、共享的数字化分布式账本，用于记录公有或私有对等网络中的交易。区域链技术利用块链式数据结构来验证与存储数数据，利用分布式节点共识算法来生成和更新数据，利用密码学的方式保证数据传输和访问的安全。故选D项。"},{"id":66,"section":"cs","type":"single","stem":"（ ）项不符合《中华人民共和国网络安全法》对个人信息保护的要求。","passage":"","options":{"A":"网络产品、服务具有收集用户信息功能的，其提供者不必向用户明示并取得同意","B":"网络运营者不得泄露、奠改、毁损其收集的个人信息","C":"任何个人和组织不得窃取或者以其他非法方式获取个人信息","D":"个人发现网络运营者违反法律，有权要求网络运营者删除其个人信息"},"answer":"A","analysis":"A 项不符合《中华人民共和国网络安全法》对个人信息保护的要求。故选A项。"},{"id":67,"section":"cs","type":"single","stem":"实施信息安全管控，应有效开展信息安全风险的识别与评估，其主要内容应不包括（ ）。","passage":"","options":{"A":"收集安全威胁、IT 系统脆弱性等信息安全风险相关数据","B":"评价信息安全风险可能发生的频率和潜在的不良影响程度","C":"根据组织统一的风险管理策略与偏好，明确风险缓释到可接受范围的应对策略与处置措施","D":"持续开展风险监测，但不再进行风险的应对处置"},"answer":"D","analysis":"本题考查信息安全风险。D 项不属于信息安全风险识别和评估。故选D项。"},{"id":68,"section":"cs","type":"single","stem":"一家金融机构对其生产系统的服务器进行网络配置时，（ ）项是最具安全风险的。","passage":"","options":{"A":"网络访问端口没有被限制","B":"大多数员工用便携式电脑","C":"一个包过滤防火墙被使用","D":"IT 地址空间少于电脑数量"},"answer":"A","analysis":"本题考查网络安全。网络访问端口没有被限制以及大多数员工用便携式电脑都会产生网络安全风险。但相比较而言，网络访问端口没有被限制，会被黑客利用端口扫描技术，还会被一些木马病毒利用，对计算机系统进行攻击，所以最具安全风险。故选A项。"},{"id":69,"section":"cs","type":"single","stem":"（ ）技术可作为诱饵来检测主动式的网络攻击。","passage":"","options":{"A":"包过滤","B":"蜜罐","C":"后门","D":"嗅探"},"answer":"B","analysis":"本题考查网络安全——网络攻击。主动攻击是攻击信息来源的真实性、信息传输的完整性和系统服务的可用性，有意对信息进行修改、插入和删除。主要攻击形式有：假冒、重放、欺骗、消息篡改和拒绝服务等。主要预防手段是防火墙、入侵检测技术等。蜜罐技术是网络安全中的一种入侵诱饵，属于入侵检测技术，目的是引诱黑客前来攻击，并收集黑客相关的证据和信息。嗅探是网络监听技术。故选 B 项。"},{"id":70,"section":"cs","type":"single","stem":"信息系统的漏洞检查与渗透测试之间的不同之处是（ ）。","passage":"","options":{"A":"漏洞检查需要开发专用工具，渗透测试可直接使用开源软件","B":"漏洞检查通过分析 IT 基础构架来检测漏洞，而渗透测试则利用漏洞来分析可能对信息系统的破坏","C":"两者只是名称不同","D":"漏洞检查可自动化工具处理，而渗透测试只能手工操作"},"answer":"D","analysis":"渗透测试服务（黑盒测试）是指在客户授权许可的情况下，利用各种主流的攻击技术对网络做模拟攻击测试，以发现系统中的安全漏洞和风险点，提前发现系统潜在的各种高危漏洞和安全威胁。漏洞扫描是指基于漏洞数据库，通过扫描等手段对指定的远程或者本地计算机系统的安全脆弱性进行检测，发现可利用漏洞的一种安全检测（渗透攻击）行为。一般渗透测试是由人工完成的，渗透测试操作难度大，而且渗透测试的范围也是有针对性的，需要人为参与。而漏洞扫描因工作量大多由工具完成，可以漏洞自动化扫描。故选 D 项。"},{"id":71,"section":"cs","type":"single","stem":"一家金融机构的审计部门对在核心业务应用系统的访问控制审查时发现，用户安全组没有指定的所有者，（ ）是 IT 审计关注的主要控制缺陷。","passage":"","options":{"A":"用户访问情况自查","B":"审批用户访问权限","C":"口令更新情况","D":"删除调离用户账户"},"answer":"B","analysis":"业务应用系统的访问控制的用户安全组没有指定的所有者，在审批用户访问权限控制上是有缺陷的。故选 B 项。"},{"id":72,"section":"cs","type":"single","stem":"数据资产所有者履行安全责任的首要任务是（ ）。","passage":"","options":{"A":"确定数据的敏感性等级","B":"提供数据物理访问安全策略","C":"提供数据逻辑访问的安全策略","D":"明确数据的使用者"},"answer":"A","analysis":"通常由数据资产的所有者来确定数据的敏感性等级，由系统分析员来确定数据逻辑访问的安全策略和数据物理访问安全策略。故选 A 项。"},{"id":73,"section":"cs","type":"single","stem":"在堡垒主机上，我们需要关闭或保留一些服务，以下做法中哪个是错误的？（）","passage":"","options":{"A":"如果我们不需要该服务，则将它关闭","B":"如果我们不了解该服务的功能，可将其打开","C":"如果我们将该服务关闭后引起系统运行问题，则再将它打开","D":"应该保留一些让堡垒主机提供给内部网用户的服务，如：Telnet、FTP 服务"},"answer":"B","analysis":"堡垒主机是一种被强化的可以防御进攻的计算机，作为进入内部网络的一个检查点，以达到把整个网络的安全问题集中在某个主机上解决，从而省时省力，不用考虑其他主机的安全的目的。堡垒主机是一台完全暴露给外网攻击的主机。它没有任何防火墙或者包过滤路由器设备保护。堡垒主机是网络中最容易受到侵害的主机，所以堡垒主机也必须是自身保护最完善的主机。堡垒主机执行的任务对于整个网络安全系统至关重要。事实上，防火墙和包过滤路由器也可以被看作堡垒主机。由于堡垒主机完全暴露在外网安全威胁之下，需要做许多工作来设计和配置堡垒主机，使它遭到外网攻击成功的风险性减至最低。故选B项。"},{"id":74,"section":"cs","type":"single","stem":"以下对于黑色产业链描述中正确的是（ ）。","passage":"","options":{"A":"由制造木马、传播木马、盗窃账户信息、第三方平台销赃形成了网上黑色产业链","B":"黑色产业链上的每一环都使用肉鸡倒卖作为其牟利方式","C":"黑色产业链中制作的病毒都无法避免被杀毒软件查杀掉","D":"黑色产业链一般都是个人行为"},"answer":"A","analysis":"木马已经形成制作、木马播种、流量交易、虚拟财产套现等诸多环节，俨然形成了一个完整的产业链条称之为黑色产业链。故选 A 项。"},{"id":75,"section":"cs","type":"single","stem":"向有限的空间输入超长的字符串是哪一种攻击手段？（ ）","passage":"","options":{"A":"网络监听","B":"拒绝服务攻击","C":"缓冲区溢出","D":"IP 欺骗"},"answer":"C","analysis":"向有限的空间输入超长的字符串是缓冲区溢出攻击手段。缓冲区溢出是指当计算机向缓冲区内填充数据位数时超过了缓冲区本身的容量，溢出的数据覆盖在合法数据上。理想的情况是：程序会检查数据长度，而且并不允许输入超过缓冲区长度的字符。但是绝大多数程序都会假设数据长度总是与所分配的储存空间相匹配，这就为缓冲区溢出埋下隐患。操作系统所使用的缓冲区，又被称为“堆栈”，在各个操作进程之间，指令会被临时储存在“堆栈”当中，“堆栈”也会出现缓冲区溢出。故选 C 项。"},{"id":76,"section":"cs","type":"single","stem":"分别利用 MD5 和 AES 对用户密码进行加密保护，以下叙述正确的是（）。","passage":"","options":{"A":"MD5 只是消息摘要算法，不适宜于密码的加密保护","B":"MD5 比 AES 更好，因为不能恢复密码","C":"AES 比 MD5 更好，因为不能恢复密码","D":"AES 比 MD5 更好，因为可恢复密码"},"answer":"B","analysis":"MD5 全称为信息——摘要算法（哈希算法），是为计算机安全领域的散列函数，用于确保消息的完整性。MD5 是一种单向加密，它的加密不可逆，它将任意长度的字符串，经过算法计算后生成固定长度的数据，一般为 16 位表示。AES 加密是一种分组加密，他将明文划分一组一组的，每组明文长度相等，一次加密一组明文，直到全部加密，分组长度为 128 位（16 字节），明文长度不足的进行填充。AES 加密是字节加密，使用时要转成字节码。AES 加密有三种长度分别是 128 位，192 位，256 位。故选B 项。"},{"id":77,"section":"cs","type":"single","stem":"为了满足企业业务持续运作的要求，对数据的备份时间间隔不能超过在灾难情形下业务所要求的（ ）。","passage":"","options":{"A":"恢复点目标（RPO）","B":"恢复时间目标（RTO）","C":"服务水平目标（SLO）","D":"系统年平均无故障时间"},"answer":"B","analysis":"RPO 和 RTO 是衡量灾备方案的两个重要指标，RPO-恢复点目标，决定了丢失多少数据，RTO-恢复时间目标，决定了业务中断了多长时间。两者的值要充分考虑到备份数据的重要程度和业务中断时间的允许范围。故选 B 项。"},{"id":78,"section":"cs","type":"single","stem":"一家银行对其防火墙进行了升级更新，在年度审计检查中发现存在几个临时为开发测试开放的服务端口。（ ）是最应提出的审计建议。","passage":"","options":{"A":"防火墙规则改变应事先进行文档设计","B":"安全管理员应定期检查和验证防火墙规则","C":"测试服务不应打开网络服务端口","D":"测试结束后应关闭网络端口"},"answer":"D","analysis":"本题考查网络安全——系统漏洞。系统漏洞通常是系统设计者有意设置的，目的是为了测试时或在用户在失去系统的访问权限时仍然有机会进入系统。入侵者可使用扫描器发现系统漏洞，从而进行攻击。所以测试结束后应关闭网络端口。故选D 项。"},{"id":79,"section":"cs","type":"single","stem":"某保险公司为降低成本和提高部署效率，使用公有云来部署其客户营销系统，（）是最值得关注的安全风险。","passage":"","options":{"A":"远程网络缺乏各用通讯线路","B":"云服务提供商中断外包服务","C":"云平台上存储的客户数据被共享 IT 环境上其他云租户非法访问","D":"公有云管理员操作错误"},"answer":"C","analysis":"本题考查云计算。一是数据安全与隐私保护风险。数据安全与隐私保护主要是数据的机密性和完整性保护问题。金融公有云有大量的数据加密需求，但云环境的大量数据流动和频繁访问面临加密数据检索、密钥和证书管理、加解密性能损耗等难题。当前缺乏完善的密码服务机制，难以对大量云端的敏感数据实施加密保护。由于用户并不掌握数据存放的物理位置，在数据废弃和需要删除时，如果云服务商做不到数据已被完全删除或无法恢复，将面临数据泄露风险。二是监管和法律风险。三是金融公有云服务面临很高的道德风险。四是金融公有云服务商退出风险。故选 C 项。"},{"id":80,"section":"cs","type":"single","stem":"SQL 注入可带来的（ ）风险。","passage":"","options":{"A":"获取敏感数据","B":"破解加密密码信息","C":"短信轰炸攻击","D":"数据库密码信息泄露"},"answer":"A","analysis":"本题考查 SQL 注入。SQL 注入，就是通过把 SQL 命令插入到Web 表单提交或输入域名或页面请求的查询字符串，最终达到欺骗服务器执行恶意的SQL 命令。具体来说，它是利用现有应用程序，将（恶意的）SQL 命令注入到后台数据库引擎执行的能力，它可以通过在 Web 表单中输入（恶意）SQL 语句得到一个存在安全漏洞的网站上的数据库，而不是按照设计者意图去执行 SQL 语句。比如先前的很多影视网站泄露VIP 会员密码大多就是通过 Web 表单递交查询字符爆出的。故选 A 项。"},{"id":81,"section":"multi","type":"multi","stem":"以下关于区块链接技术的描述，哪些是错误的？（ ）","passage":"","options":{"A":"区块链接是一种分布式账本技术","B":"区块链从原理上保证了绝对的安全性","C":"区块链只能用于虚拟货币","D":"区块链离不开中心化的身份认证"},"answer":"CD","analysis":"区块链是一种防篡改的、共享的数字化分布式账本，用于记录公有或私有对等网络中的交易，从原理上保证了绝对的安全性。分布式账本记录网络参与者之间的交易，比如资产或数据的交换，不仅仅用于虚拟货币。区块链一个重要的特征就是去中心化。故选CD 项。"},{"id":82,"section":"multi","type":"multi","stem":"在分布式数据框架下，下列哪些方法可以提升系统的可扩展性？（）","passage":"","options":{"A":"数据复制","B":"数据垂直切分","C":"数据水平切分","D":"缓存"},"answer":"AC","analysis":"解决数据库扩展能力的方法主要有两个：数据分片和读写分离。数据分片（Sharding）的原理就是将数据做水平切分，类似于 hash 分区的原理，通过应用架构解决访问路由和数据合并的问题。读写分离架构利用了数据库的复制技术，将读和写分布在不同的处理节点上，从而达到提高可用性和扩展性的目的。故选 AC 项。"},{"id":83,"section":"multi","type":"multi","stem":"提高关系型数据库性能的一种方式是建立数据库集群，以下哪些是在数据库集群中经常用到的技术方案？（ ）","passage":"","options":{"A":"虚拟化","B":"读写分离","C":"分库分表","D":"缓存"},"answer":"ABC","analysis":"数据库集群，是利用至少两台或者多台数据库服务器，构成一个虚拟单一数据库逻辑映像，像单数据库系统那样，向客户端提供透明的数据服务。通过使用数据库集群可以使读写分离，提高数据库的系统性能。读写分离分散了数据库读写操作的压力，但没有分散存储压力，常见的分散存储的方法“分库分表”。故选 ABC 项。"},{"id":84,"section":"multi","type":"multi","stem":"以下有关存储区域网络（SAN）的描述中，正确的是（ ）。","passage":"","options":{"A":"采用文件共享存取方式","B":"采用块（block）级别存储","C":"可基于光纤或 IP 网络实现","D":"将存储设备从传统的以太网中分离出来"},"answer":"BCD","analysis":"存储区域网络（SAN）采用网状通道技术，通过 FC 交换机连接存储阵列和服务器主机，建立专用于数据存储的区域网络，专门连接存储外围设备和服务器的网络。它通常包括服务器、外部存储设备、服务器适配器、集线器、交换机以及网络、存储管理工具等。SAN 独立于应用服务器网络系统之外，拥有几乎无限的存储能力，它采用高速的光纤通道作为传输媒介，将存储系统网络化，实现了真正高速的共享存储。磁盘阵列都是基于Block块的存储。故选 BCD 项。"},{"id":85,"section":"multi","type":"multi","stem":"以下选项中，可能会造成系统启动时出现蓝屏情况的是（ ）。","passage":"","options":{"A":"内存条故障","B":"硬盘线接触不良","C":"硬盘工作模式设置不当","D":"某些声卡驱动安装错误"},"answer":"ABCD","analysis":"引起电脑蓝屏的原因有很多，硬件方面有：电脑超频过度，散热不良，内存条接触不良，内存损坏，硬盘坏道或数据线问题、硬盘工作模式设置不当等，软件方面：个别软件或驱动导致蓝屏，电脑中毒，操作系统损坏等。故选 ABCD 项。"},{"id":86,"section":"multi","type":"multi","stem":"以下哪些技术与 DevOps 相关？（ ）","passage":"","options":{"A":"自动部署","B":"微服务","C":"容器","D":"自动测试"},"answer":"ABCD","analysis":"DevOps 是一个完整的面向 IT 运维的工作流，以 IT 自动化以及持续集成（CI）、持续部署（CD）为基础，来优化程式开发、测试、系统运维等所有环节。突出重视软件开发人员和运维人员的沟通合作，通过自动化流程来使得软件构建、测试、发布更加快捷、频繁和可靠。DevOps 其实包含了三个部分：开发、测试和运维。微服务架构理念、容器技术使得 DevOps 的实施变得更加容易，计算能力提升和云环境的发展使得快速开发的产品可以立刻获得更广泛地使用。故选 ABCD 项。"},{"id":87,"section":"multi","type":"multi","stem":"在软件测试用例过程中，白盒测试关注的是（ ）。","passage":"","options":{"A":"程序结构","B":"软件外部功能","C":"程序正确性","D":"程序内部逻辑"},"answer":"ACD","analysis":"本题考查软件测试。功能测试属于黑盒测试，白盒测试通过测试来检测产品内部动作是否按照规格说明书的规定正常进行，按照程序内部的结构测试程序，检验程序中的每条通路是否都有可能按预定要求正确工作，而不顾它的功能。故选ACD 项。"},{"id":88,"section":"multi","type":"multi","stem":"软件需求规格说明书的内容包括（ ）。","passage":"","options":{"A":"主要功能","B":"软件的性能","C":"用户界面及运行环境","D":"算法的详细过程"},"answer":"ABC","analysis":"本题考查软件需求分析。需求分析主要是确定待开发软件的功能、性能、数据、界面等要求。故选 ABC 项。"},{"id":89,"section":"multi","type":"multi","stem":"虚拟现实技术的重要特性包括（ ）。","passage":"","options":{"A":"存在感","B":"交互性","C":"自主性","D":"多感知性"},"answer":"ABCD","analysis":"虚拟现实技术的重要特性包括：沉浸性（临场感、存在感）、实时交互性、多感知性、自主性。故选 ABCD 项。"},{"id":90,"section":"multi","type":"multi","stem":"影响软件产品质量的因素包括（ ）。","passage":"","options":{"A":"开发技术","B":"过程质量","C":"人员素质及成本","D":"时间和进度"},"answer":"ABCD","analysis":"本题考查软件项目管理。软件项目管理是指软件生存周期中软件管理者所进行的一系列的活动，其目的是在一定的时间和预设的范围内有效地利用人力、资源、技术和工具，使软件系统或产品按照原定的计划和质量要求如期完成。有效的软件项目管理集中在4个 P 上，即人员（Person）、产品（Product）、过程（Procedure）和项目（Project）。故选ABCD 项。"},{"id":91,"section":"multi","type":"multi","stem":"数据挖掘的一种方法是机器学习，以下哪些属于使用机器学习构建AI 模型的相关步骤？（ ）","passage":"","options":{"A":"特征工程","B":"样本切分","C":"算法选取","D":"模型评估"},"answer":"ACD","analysis":"一个机器学习的三要素为模型、策略、算法，特征工程、算法选取、模型评估属于使用机器学习构建 AI 模型的相关步骤。故选 ACD 项。"},{"id":92,"section":"multi","type":"multi","stem":"大数据时代，在数据处理的理念上应当有哪些转变？（ ）","passage":"","options":{"A":"在数据基础上倾向于全体数据而不是抽象数据","B":"在分析方法上更注重相关分析而不是因果分析","C":"在分析效果上更追求效率而不是绝对精确","D":"在数据规模上强调相对数据而不是绝对数据"},"answer":"ABCD","analysis":"本题考查信息热点——大数据。按照题意，ABCD 都正确。故选ABCD项。"},{"id":93,"section":"multi","type":"multi","stem":"Hadoop 的两大核心组件是（ ）。","passage":"","options":{"A":"HDFS","B":"HBase","C":"Zookeeper","D":"MapReduce"},"answer":"AD","analysis":"Hadoop 实现了一个分布式文件系统 HDFS。HDFS 有高容错性的特点，并且设计用来部署在低廉的硬件上；而且它提供高吞吐量来访问应用程序的数据，适合那些有着超大数据集的应用程序。Hadoop 的框架最核心的设计就是：HDFS 和MapReduce。HDFS为海量的数据提供了存储，则 MapReduce 为海量的数据提供了计算。故选AD 项。"},{"id":94,"section":"multi","type":"multi","stem":"以下哪些是数据仓库的特点？（ ）","passage":"","options":{"A":"面向主题的","B":"面向事务的","C":"反映历史数据且随时间变化的","D":"数据是相对稳定的"},"answer":"ACD","analysis":"本题考查大数据——数据仓库。（1）主题性：数据仓库是一般从用户实际需求出发，将不同平台的数据源按设定主题进行划分整合，与传统的面向事务的操作型数据库不同，具有较高的抽象性。（2）集成性：数据仓库中存储的数据大部分来源于传统的数据库，但并不是将原有数据简单的直接导入，而是需要进行预处理。（3）稳定性：数据仓库中的数据主要为决策者分析提供数据依据。决策依据的数据是不允许进行修改的。（4）动态性：数据仓库数据会随时间变化而定期更新，不可更新是针对应用而言，即用户分析处理时不更新数据。故选 ACD 项。"},{"id":95,"section":"multi","type":"multi","stem":"请根据 OSI 网络体系各层基本原理，推断以下哪些是专门针对应用层进行攻击？（ ）","passage":"","options":{"A":"IP 地址伪造和欺骗","B":"密码口令的暴力破解","C":"数据链路的监听","D":"木马和病毒的植入"},"answer":"BD","analysis":"本题考查 OSI 参考模型。网络层的功能是寻址与路由，A 项是针对网络层的；C 项是针对数据链路层的。故选 BD 项。"},{"id":96,"section":"multi","type":"multi","stem":"以下关于以太网地址的描述，正确的是（ ）。","passage":"","options":{"A":"以太网地址就是通常所说的 MAC 地址","B":"MAC 地址又称为局域网硬件地址","C":"MAC 地址是通过域名解析查得的","D":"以太网地址通常存储在网卡中"},"answer":"ABCD","analysis":"本题考查 MAC 地址。以太网地址亦称为 MAC 地址，位于七层网络模型的第二层（数据链路层），用来标示网络中的一个网卡。故选 ABCD 项。"},{"id":97,"section":"multi","type":"multi","stem":"IPv6 的主要特点是（ ）。","passage":"","options":{"A":"更广阔的地址空间","B":"更好的安全性","C":"高 QoS","D":"更完善的自动配置"},"answer":"ABCD","analysis":"本题考查 IP 地址。IPv6 的主要特点：（1）更大的地址空间。IPv4 中规定IP地址长度为 32；而 IPv6 中 IP 地址的长度为 128。（2）更小的路由表。IPv6 的地址分配一开始就遵循聚类的原则，这使得路由器能在路由表中用一条记录表示一片子网，大大减小了路由器中路由表的长度，提高了路由器转发数据包的速度。（3）增强的组播支持以及对流的支持。这使得网络上的多媒体应用有了长足发展的机会，为服务质量（QoS）控制提供了良好的网络平台。（4）加入了对自动配置的支持。这是对 DHCP 协议的改进和扩展，使得网络（尤其是局域网）的管理更加方便和快捷。（5）更高的安全性。在使用IPv6 网络中用户可以对网络层的数据进行加密并对 IP 报文进行校验，这极大地增强了网络安全。故选ABCD 项。"},{"id":98,"section":"multi","type":"multi","stem":"下列关于 Cookie 的说法中，正确的是（ ）。","passage":"","options":{"A":"Cookie 存储在服务器端","B":"Cookie 是服务器产生的","C":"Cookie 会威胁客户隐私","D":"Cookie 的作用是跟踪用户的访问和状态"},"answer":"BCD","analysis":"Cookie 是由服务器端生成，发送给客户端浏览器，浏览器会将Cookie 的关键值保存到某个目录下的文本文件内，下次请求同一网站时就发送该 Cookie 给服务器（前提是浏览器设置为启用 cookie）。故选 BCD 项。"},{"id":99,"section":"multi","type":"multi","stem":"在金融行业中，可有效降低软硬件故障带来的网络和系统稳定性风险的手段包括（ ）。","passage":"","options":{"A":"系统和数据备份","B":"磁盘阵列","C":"双机热备","D":"服务器集群"},"answer":"ABCD","analysis":"本题考查数据备份。磁盘阵列 RAID 是一种把多块独立的硬盘（物理硬盘）按不同的方式组合起来形成一个硬盘组（逻辑硬盘），从而提供比单个硬盘更高的存储性能和提供数据备份技术。服务器集群就是指将很多服务器集中起来一起进行同一种服务，在客户端看来就像是只有一个服务器。集群可以利用多个计算机进行并行计算从而获得很高的计算速度，也可以用多个计算机做备份，从而使得任何一个机器坏了整个系统还是能正常运行。故选 ABCD 项。"},{"id":100,"section":"multi","type":"multi","stem":"按照 COSO 的企业全面风险管理框架，信息科技风险管理需要确保（）。","passage":"","options":{"A":"企业战略目标","B":"员工成长目标","C":"企业经营目标","D":"合规目标"},"answer":"ACD","analysis":"COSO— ERM 2004 从四类目标、八大要素和四层企业内部的不同层次的单元构成了三维视角的企业全面风险管理的模型。四大目标包括：战略、经营、报告与合规目标。八大要素包括：内部环境、目标设定、事项识别、风险评估、风险应对、控制活动、信息沟通和监控；四大层面包括：主体层次、分布、业务单位、子公司。故选ACD 项。英语部分的四个选项中，选出最佳选项。 （一）"},{"id":101,"section":"eng","type":"single","stem":"It is indicated in the first paragraph that ______.","passage":"High-speed trading firms - the lightening-quick, computerized companies that have risen inthe last decade to dominate the nation’s stock market – are now struggling to hold onto their gains. Profits from high-speed trading in American stocks are reported to be, at most, $1.25 billion this year, down 35 percent from last year and 74 percent from the peak of a year ago, according toestimates from the brokerage firm Rosenblatt Securities. While no official data is available about the employment at the high-speed firms, interviews with more than a dozen industry participants suggest that firms large and small have been cuttingstaff, and in some cases have shut down. The firms also account for a declining percentage of a shrinking pool of stock trading, from 61 percent three years ago to 51 percent now. It is a swift reversal for trading firms that have often looked like profit machines in the eyes of other investors, thanks to high-powered software and super fast data connections that can take advantage of small changes in the price of a stock. High-speed trading is far fromdisappearingfrom the market, but the struggles facing these firms are welcomed by some traditional traders andinvestors who have viewed the firms as formidable rivals, or worse, market manipulators that create sudden increases and drops in share prices. Peter Costa, a long-time trader on the floor of the New York Stock Exchange, said the fading presence of the firms could “restore some order tostock markets”. Regulators are still trying to understand whether the rise of high-speed firms has been net benefit or loss for investors, so it is hard to say how the decline of these firms will affect the markets. Many market experts have argued that the technical problems that have recently hit the market have been a result of broader trend of the market turning into dozens of automated tradingservices and a lack of human oversight.","options":{"A":"the strength of high-speed trading firms is the computerization","B":"the profits of high-speed trading are declining in recent years","C":"all the high-speed firms are no longer profitable","D":"every high-speed trader can make more money than the traditional traders"},"answer":"B","analysis":"本题属于主旨题。题目意为：第一段的主旨是什么？A 项，高速贸易公司的优势在于计算机化；B 项，近年来高速交易的利润在下降；C 项，所有的高速公司都不再盈利了；D 项，每一个高速交易者都能比传统交易者赚更多的钱。根据第一段中：“struggleing”“down 35% from last year and 74% from the peak of a year ago”可知，本段主要是谈高速交易数量有所下降。故选 B 项。"},{"id":102,"section":"eng","type":"single","stem":"According to the first two paragraphs, the decline of high-speed trading firms is characterized by ______.","passage":"High-speed trading firms - the lightening-quick, computerized companies that have risen inthe last decade to dominate the nation’s stock market – are now struggling to hold onto their gains. Profits from high-speed trading in American stocks are reported to be, at most, $1.25 billion this year, down 35 percent from last year and 74 percent from the peak of a year ago, according toestimates from the brokerage firm Rosenblatt Securities. While no official data is available about the employment at the high-speed firms, interviews with more than a dozen industry participants suggest that firms large and small have been cuttingstaff, and in some cases have shut down. The firms also account for a declining percentage of a shrinking pool of stock trading, from 61 percent three years ago to 51 percent now. It is a swift reversal for trading firms that have often looked like profit machines in the eyes of other investors, thanks to high-powered software and super fast data connections that can take advantage of small changes in the price of a stock. High-speed trading is far fromdisappearingfrom the market, but the struggles facing these firms are welcomed by some traditional traders andinvestors who have viewed the firms as formidable rivals, or worse, market manipulators that create sudden increases and drops in share prices. Peter Costa, a long-time trader on the floor of the New York Stock Exchange, said the fading presence of the firms could “restore some order tostock markets”. Regulators are still trying to understand whether the rise of high-speed firms has been net benefit or loss for investors, so it is hard to say how the decline of these firms will affect the markets. Many market experts have argued that the technical problems that have recently hit the market have been a result of broader trend of the market turning into dozens of automated tradingservices and a lack of human oversight.","options":{"A":"struggling to make any profits","B":"the shrink of stock trading market","C":"the reduction of profits and employee numbers","D":"no longer being active in the nation’s stock market"},"answer":"C","analysis":"本题属于细节理解题。题目意为：根据前两段，高速贸易公司的衰落特征是？文章第一段主要说了高速交易在利润的下降，“Profits from high-speed trading in Americanstocks are reported to be, at most, $1.25 billion this year, down 35 percent from last year and 74 percent from the peak of a year ago, according to estimates from the brokerage firmRosenblatt Securities.”第二段讲了一些公司在裁员甚至倒闭，“interviews with more than a dozen industryparticipants suggest that firms large and small have been cutting staff, and in some cases have shut down.”A 项“努力赚钱”；B 项“股票交易市场的萎缩”；C 项“利润和雇员人数的减少”；D 项“不再活跃于全国股市”。其中 A 项原文并未提及，B 项只提到了其中一种现象，比较片面，D 项说法过于绝对。故选 C 项。"},{"id":103,"section":"eng","type":"single","stem":"The phrase “swift reversal” most probably refers to ______.","passage":"High-speed trading firms - the lightening-quick, computerized companies that have risen inthe last decade to dominate the nation’s stock market – are now struggling to hold onto their gains. Profits from high-speed trading in American stocks are reported to be, at most, $1.25 billion this year, down 35 percent from last year and 74 percent from the peak of a year ago, according toestimates from the brokerage firm Rosenblatt Securities. While no official data is available about the employment at the high-speed firms, interviews with more than a dozen industry participants suggest that firms large and small have been cuttingstaff, and in some cases have shut down. The firms also account for a declining percentage of a shrinking pool of stock trading, from 61 percent three years ago to 51 percent now. It is a swift reversal for trading firms that have often looked like profit machines in the eyes of other investors, thanks to high-powered software and super fast data connections that can take advantage of small changes in the price of a stock. High-speed trading is far fromdisappearingfrom the market, but the struggles facing these firms are welcomed by some traditional traders andinvestors who have viewed the firms as formidable rivals, or worse, market manipulators that create sudden increases and drops in share prices. Peter Costa, a long-time trader on the floor of the New York Stock Exchange, said the fading presence of the firms could “restore some order tostock markets”. Regulators are still trying to understand whether the rise of high-speed firms has been net benefit or loss for investors, so it is hard to say how the decline of these firms will affect the markets. Many market experts have argued that the technical problems that have recently hit the market have been a result of broader trend of the market turning into dozens of automated tradingservices and a lack of human oversight.","options":{"A":"high-powered software and super-fast data connections","B":"new investors becoming profit machines","C":"taking in charge of the price of a stock","D":"not making huge profits as before"},"answer":"D","analysis":"本题属于语义理解题。题目意为：Swift reversal 这个词很可能指的是？A项“高性能软件和超高速数据连接”；B 项“新投资者成为盈利机器”；C 项“掌握股票价格”；D 项“没有像以前那样赚大钱”。文中“It is a swift reversal for trading firms that have oftenlooked like profit machines in the eyes of other investors, thanks to high-powered software and super fast data connections that can take advantage of small changes in the price of a stock.”意思是：这对于那些在其他投资者眼中经常看起来像盈利机器的贸易公司来说是一个迅速的逆转，它们过去利用高性能的软件和超快的数据连接在股票价格的微小变化中获利。“Swift reversal”在段落中主要指来自市场的报复，即利润率的下降。故选 D 项。"},{"id":104,"section":"eng","type":"single","stem":"Which of the following would Peter Costa most probably agree on?","passage":"High-speed trading firms - the lightening-quick, computerized companies that have risen inthe last decade to dominate the nation’s stock market – are now struggling to hold onto their gains. Profits from high-speed trading in American stocks are reported to be, at most, $1.25 billion this year, down 35 percent from last year and 74 percent from the peak of a year ago, according toestimates from the brokerage firm Rosenblatt Securities. While no official data is available about the employment at the high-speed firms, interviews with more than a dozen industry participants suggest that firms large and small have been cuttingstaff, and in some cases have shut down. The firms also account for a declining percentage of a shrinking pool of stock trading, from 61 percent three years ago to 51 percent now. It is a swift reversal for trading firms that have often looked like profit machines in the eyes of other investors, thanks to high-powered software and super fast data connections that can take advantage of small changes in the price of a stock. High-speed trading is far fromdisappearingfrom the market, but the struggles facing these firms are welcomed by some traditional traders andinvestors who have viewed the firms as formidable rivals, or worse, market manipulators that create sudden increases and drops in share prices. Peter Costa, a long-time trader on the floor of the New York Stock Exchange, said the fading presence of the firms could “restore some order tostock markets”. Regulators are still trying to understand whether the rise of high-speed firms has been net benefit or loss for investors, so it is hard to say how the decline of these firms will affect the markets. Many market experts have argued that the technical problems that have recently hit the market have been a result of broader trend of the market turning into dozens of automated tradingservices and a lack of human oversight.","options":{"A":"Decline of high-speed firms is good for proper market functioning.","B":"Traditional traders and investors are afraid of high-speed firms.","C":"Stock markets need the presence of high-speed trading firms.","D":"High-speed trading firms could bring order to stock markets."},"answer":"A","analysis":"本题属于细节判断题。题目意为：Peter costa 最有可能同意以下哪一项？根据Peter costa 在文中所说的“the fading presence of the firms could ‘restore some order to stockmarkets’”。其意思是：这些公司的逐渐衰落可能“恢复股市的一些秩序”。A项，高速公司的衰落有利于市场的正常运行；B 项，传统的交易者和投资者害怕高速公司；C项，股市需要高速交易公司的存在；D 项，高速交易公司可以给股市带来秩序。只有A项符合题意。故选 A 项。"},{"id":105,"section":"eng","type":"single","stem":"Which of the following is true according to the last paragraph?","passage":"High-speed trading firms - the lightening-quick, computerized companies that have risen inthe last decade to dominate the nation’s stock market – are now struggling to hold onto their gains. Profits from high-speed trading in American stocks are reported to be, at most, $1.25 billion this year, down 35 percent from last year and 74 percent from the peak of a year ago, according toestimates from the brokerage firm Rosenblatt Securities. While no official data is available about the employment at the high-speed firms, interviews with more than a dozen industry participants suggest that firms large and small have been cuttingstaff, and in some cases have shut down. The firms also account for a declining percentage of a shrinking pool of stock trading, from 61 percent three years ago to 51 percent now. It is a swift reversal for trading firms that have often looked like profit machines in the eyes of other investors, thanks to high-powered software and super fast data connections that can take advantage of small changes in the price of a stock. High-speed trading is far fromdisappearingfrom the market, but the struggles facing these firms are welcomed by some traditional traders andinvestors who have viewed the firms as formidable rivals, or worse, market manipulators that create sudden increases and drops in share prices. Peter Costa, a long-time trader on the floor of the New York Stock Exchange, said the fading presence of the firms could “restore some order tostock markets”. Regulators are still trying to understand whether the rise of high-speed firms has been net benefit or loss for investors, so it is hard to say how the decline of these firms will affect the markets. Many market experts have argued that the technical problems that have recently hit the market have been a result of broader trend of the market turning into dozens of automated tradingservices and a lack of human oversight.","options":{"A":"Regulators think the prospect of high-speed firms is promising.","B":"The influence of the decline of high-speed firms is not certain.","C":"The stock markets are under strong oversight.","D":"The stock markets are confident to overcome the technical problems. （二） “The world’s environment is surprisingly healthy. Discuss.” If that were an examination topic, most students would tear it apart, offering a long list of complaints: from local smog to global climate change, from the felling (砍 伐 ) of forest to the extinction of species. The list wouldlargely be accurate, the concern legitimate. Yet the students who should be given the highest marks would actually be those who agreed with the statement. The surprise is how good things are, not how bad. After all, the world’s population has more than tripled during this century, and world output has risen hugely, so you would expect the earth itself to have been affected. Indeed, if people lived, consumed and produced things in the same way as they did in 1900 (or in 1950 or in 1980), the world by now would be a pretty disgusting place: smelly, dirty, toxic and dangerous. But they don’t. The reasons why they don’t, and why the environment has not been ruined, have to do with prices, technological innovation, social change and government regulation inresponse to popular pressure. That is why today’s environmental problems in the poor countries ought, in principle, to be solvable. Raw materials have not run out, and show no sign of doing so. Logically, one day they must: the planet is a finite place. Yet it is also very big, and man is very ingenious. What has happened is that every time a material seems to be running short, the price has risen and, in response, people have looked for new sources of supply, tried to find ways to use less of the material, or looked for a new substitute. For this reason, prices for energy and for minerals have fallen in real terms during the century. The same is true for food. Prices fluctuate, in response to harvests, natural disasters and political instability, and when they rise, it takes some time before newsources of supply become available. But they always do, assisted by new farming and crop technology. The long-term trend has been downwards. It is where prices and markets do not operate properly that this benign (良性的) trend begins to stumble, and the genuine problems arise. Markets cannot always keep the environment healthy. If no one owns the resource concerned, no one has an interest in conserving it or fostering it: fishis the best example of this."},"answer":"B","analysis":"本题属于细节理解题。题目意为：根据最后一段，下列哪一项是正确的？根据文章最后一段关键句“it is hard to say how the decline of these firms will affect the markets.”即很难说这些公司的衰落将如何影响市场。A 项，监管者认为高速公司的前景是有希望的；B项，高速公司衰落的影响还不确定；C 项，股市受到了强有力的监督；D 项，股市有信心克服技术问题。其中 AD 项的说法在原文都未提及，C 项说法错误，只有B 项符合文意。故选B 项。 （二）"},{"id":106,"section":"eng","type":"single","stem":"According to the author, most students ______.","passage":"“The world’s environment is surprisingly healthy. Discuss.” If that were an examination topic, most students would tear it apart, offering a long list of complaints: from local smog to global climate change, from the felling (砍 伐 ) of forest to the extinction of species. The list wouldlargely be accurate, the concern legitimate. Yet the students who should be given the highest marks would actually be those who agreed with the statement. The surprise is how good things are, not how bad. After all, the world’s population has more than tripled during this century, and world output has risen hugely, so you would expect the earth itself to have been affected. Indeed, if people lived, consumed and produced things in the same way as they did in 1900 (or in 1950 or in 1980), the world by now would be a pretty disgusting place: smelly, dirty, toxic and dangerous. But they don’t. The reasons why they don’t, and why the environment has not been ruined, have to do with prices, technological innovation, social change and government regulation inresponse to popular pressure. That is why today’s environmental problems in the poor countries ought, in principle, to be solvable. Raw materials have not run out, and show no sign of doing so. Logically, one day they must: the planet is a finite place. Yet it is also very big, and man is very ingenious. What has happened is that every time a material seems to be running short, the price has risen and, in response, people have looked for new sources of supply, tried to find ways to use less of the material, or looked for a new substitute. For this reason, prices for energy and for minerals have fallen in real terms during the century. The same is true for food. Prices fluctuate, in response to harvests, natural disasters and political instability, and when they rise, it takes some time before newsources of supply become available. But they always do, assisted by new farming and crop technology. The long-term trend has been downwards. It is where prices and markets do not operate properly that this benign (良性的) trend begins to stumble, and the genuine problems arise. Markets cannot always keep the environment healthy. If no one owns the resource concerned, no one has an interest in conserving it or fostering it: fishis the best example of this.","options":{"A":"believe the world’s environment is not as bad as it is thought to be","B":"think the world’s environment is in an undesirable condition","C":"are not worried about the state of the world’s environment","D":"have deep knowledge about environment"},"answer":"B","analysis":"本题属于细节理解题。题目意为：根据作者的说法，大多数学生______。其实是在问学生对于环境的认知。A 项，相信世界环境并没有想像中那么糟糕；B 项，认为世界环境不好；C 项，不担心世界环境状况；D 项，对环境有深刻的认识。根据文章第一段学生对于要讨论的话题“世界的环境非常健康”的态度：“If that were an examination topic, most students would tear it apart, offering a long list of complaints: from local smog to global climate change, from the felling of forest to the extinction of species.”可知，学生认为目前世界的状态并不好。故选 B 项。"},{"id":107,"section":"eng","type":"single","stem":"The huge increase in world population and production ______.","passage":"“The world’s environment is surprisingly healthy. Discuss.” If that were an examination topic, most students would tear it apart, offering a long list of complaints: from local smog to global climate change, from the felling (砍 伐 ) of forest to the extinction of species. The list wouldlargely be accurate, the concern legitimate. Yet the students who should be given the highest marks would actually be those who agreed with the statement. The surprise is how good things are, not how bad. After all, the world’s population has more than tripled during this century, and world output has risen hugely, so you would expect the earth itself to have been affected. Indeed, if people lived, consumed and produced things in the same way as they did in 1900 (or in 1950 or in 1980), the world by now would be a pretty disgusting place: smelly, dirty, toxic and dangerous. But they don’t. The reasons why they don’t, and why the environment has not been ruined, have to do with prices, technological innovation, social change and government regulation inresponse to popular pressure. That is why today’s environmental problems in the poor countries ought, in principle, to be solvable. Raw materials have not run out, and show no sign of doing so. Logically, one day they must: the planet is a finite place. Yet it is also very big, and man is very ingenious. What has happened is that every time a mater ions":{"A":"technological innovation emerge","B":"consumption will drop","C":"new sources are always becoming available","D":"new farming and crop technology can lead to overproduction"},"answer":"C","analysis":"本题属于细节理解题。题目意为：价格长期下跌的一个重要原因是______。A项，技术创新的出现；B 项，消费将下降；C 项，总可以找到新的来源；D 项，新的农业和作物技术可能导致生产过剩。定位文章第四段：“What has happened is that every time a material seems to be running short, the price has risen and, in response, people have looked for new sources of supply, tried to find ways to use less of the material, or looked for a newsubstitute.”即每当一种材料似乎供不应求时，价格就会上涨，人们就会寻找新的供应来源，试图找到减少材料使用的方法，或者寻找新的替代品。故选 C 项。"},{"id":109,"section":"eng","type":"single","stem":"According to the author, why fish resources are diminishing?","passage":"“The world’s environment is surprisingly healthy. Discuss.” If that were an examination topic, most students would tear it apart, offering a long list of complaints: from local smog to global climate change, from the felling (砍 伐 ) of forest to the extinction of species. The list wouldlargely be accurate, the concern legitimate. Yet the students who should be given the highest marks would actually be those who agreed with the statement. The surprise is how good things are, not how bad. After all, the world’s population has more than tripled during this century, and world output has risen hugely, so you would expect the earth itself to have been affected. Indeed, if people lived, consumed and produced things in the same way as they did in 1900 (or in 1950 or in 1980), the world by now would be a pretty disgusting place: smelly, dirty, toxic and dangerous. But they don’t. The reasons why they don’t, and why the environment has not been ruined, have to do with prices, technological innovation, social change and government regulation inresponse to popular pressure. That is why today’s environmental problems in the poor countries ought, in principle, to be solvable. Raw materials have not run out, and show no sign of doing so. Logically, one
